<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scan Register Kayu</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 20px;
      margin: 0;
    }

    h2 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: white;
    }

    #hasil {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    #status {
      margin-top: 15px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h2>SCAN REGISTER KAYU</h2>

  <div id="reader"></div>

  <button onclick="mulaiScan()">
    📷 BUKA KAMERA
  </button>

  <div id="hasil"></div>

  <div id="status">
    Tekan tombol untuk mulai scan
  </div>


  <script>

    let scanner = null;
    let sudahScan = false;

    function mulaiScan() {

      if (scanner) {
        return;
      }

      document.getElementById("status").innerHTML =
        "⏳ Membuka kamera...";

      scanner = new Html5Qrcode("reader");

      scanner.start(

        { facingMode: "environment" },

        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 150
          }
        },

        function(decodedText) {

          if (sudahScan) return;

          sudahScan = true;

          document.getElementById("hasil").innerHTML =
            "Register: " + decodedText;

          document.getElementById("status").innerHTML =
            "⏳ Menyimpan data...";


          fetch(
            "https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec",
            {
              method: "POST",
              mode: "no-cors",
              headers: {
                "Content-Type": "text/plain"
              },
              body: decodedText
            }
          )
          .then(function() {

            document.getElementById("status").innerHTML =
              "✅ Data dikirim";

            scanner.stop();

          })
          .catch(function(error) {

            document.getElementById("status").innerHTML =
              "❌ Gagal mengirim data";

            sudahScan = false;

          });

        },

        function(errorMessage) {
          // Abaikan error scan sementara
        }

      )

      .then(function() {

        document.getElementById("status").innerHTML =
          "📷 Kamera aktif — arahkan ke barcode";

      })

      .catch(function(error) {

        document.getElementById("status").innerHTML =
          "❌ Kamera gagal dibuka<br>" + error;

        scanner = null;

      });

    }

  </script>

</body>
</html>
