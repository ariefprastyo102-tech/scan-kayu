<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Scan Kayu</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 15px;
}

h2 {
  text-align: center;
  margin: 5px 0 15px;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: auto;
  background: white;
  border-radius: 10px;
  overflow: hidden;
}

#btnScan {
  display: block;
  width: 100%;
  max-width: 500px;
  margin: 15px auto;
  padding: 15px;
  font-size: 18px;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  background: #1976d2;
  color: white;
}

#status {
  max-width: 500px;
  margin: 10px auto;
  text-align: center;
  font-weight: bold;
}

#jumlah {
  max-width: 500px;
  margin: 10px auto;
  text-align: center;
  font-weight: bold;
}

#daftar {
  width: 100%;
  max-width: 500px;
  margin: 15px auto;
}

.item {
  background: white;
  margin-bottom: 8px;
  border-radius: 8px;
  padding: 12px;
}

.baris {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.nomor {
  font-size: 20px;
  font-weight: bold;
  word-break: break-all;
}

.detailBtn {
  width: auto;
  min-width: 80px;
  padding: 8px 12px;
  margin: 0;

  color: white;

  border-radius: 6px;
  font-size: 14px;
  font-weight: bold;
}

.detail {
  display: none;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid #ddd;
  font-size: 15px;
  line-height: 1.7;
}

  color: green;
}

  color: red;
}

  color: darkorange;
}

  color: red;
}

  background: #c62828;
}

  display: inline-block;
  width: 115px;
  font-weight: bold;
}

</style>

</head>


<body>


<h2>SCAN REGISTER KAYU</h2>


<div id="reader"></div>


<button
  id="btnScan"
  onclick="mulaiKamera()"
>
  📷 BUKA KAMERA
</button>


<div id="status">
  Tekan Buka Kamera
</div>


<div id="jumlah">
  Jumlah berhasil: 0
</div>


<div id="daftar"></div>


<script>


// ==========================================
// URL APPS SCRIPT
// ==========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


// ==========================================
// VARIABEL
// ==========================================

let scanner = null;

let kameraAktif = false;

let sedangProses = false;

let jumlahBerhasil = 0;


// ==========================================
// BUNYI BERHASIL
// ==========================================

function bunyiBerhasil(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext){
      return;
    }

    const audio =
      new AudioContext();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.type =
      "sine";

    oscillator.frequency.value =
      1200;

    gain.gain.value =
      0.25;

    oscillator.connect(
      gain
    );

    gain.connect(
      audio.destination
    );

    oscillator.start();

    oscillator.stop(
      audio.currentTime + 0.2
    );

  }catch(e){

    console.log(
      "Audio tidak tersedia"
    );

  }

}


// ==========================================
// GETAR
// ==========================================

function getarBerhasil(){

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [
        120,
        60,
        120
      ]
    );

  }

}


// ==========================================
// BUKA KAMERA
// ==========================================

function mulaiKamera() {

  if (kameraAktif) {
    return;
  }

  kameraAktif = true;


  document.getElementById("status").innerHTML =
    "⏳ Membuka kamera...";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {

      /*
       * FPS dinaikkan supaya
       * pembacaan lebih cepat.
       */

      fps: 20,


      /*
       * Kotak scanner diperbesar sedikit
       * tetapi tetap mempertahankan
       * bentuk kotaknya.
       */

      qrbox: {
        width: 340,
        height: 180
      },


      /*
       * Minta kamera resolusi tinggi
       * agar barcode lebih mudah dibaca
       * dari jarak agak jauh.
       */

      videoConstraints: {
        facingMode: "environment",

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }
      }

    },


    function(register) {

      register =
        String(register).trim();


      if (!register) {
        return;
      }


      if (sedangProses) {
        return;
      }


      sedangProses = true;


      /*
       * INI TETAP ADA
       * seperti kode asli.
       */

      document.getElementById("status").innerHTML =
        "⏳ Mengecek " +
        register +
        "...";


      cekRegister(register);

    },


    function(errorMessage) {

      // Error pembacaan sementara diabaikan

    }

  )


  .then(function() {

    document.getElementById("status").innerHTML =
      "📷 KAMERA AKTIF<br>" +
      "Arahkan ke barcode";

  })


  .catch(function(error) {

    kameraAktif = false;


    document.getElementById("status").innerHTML =
      "❌ Kamera gagal dibuka<br>" +
      error;

  });

}


// ==========================================
// CEK REGISTER
// ==========================================

function cekRegister(register) {


  const callbackName =
    "scan_" +
    Date.now();


  window[callbackName] =
    function(hasil) {


      // ====================================
      // BERHASIL
      // ====================================

      if (
        hasil.status === "success"
      ) {


        jumlahBerhasil++;


        document.getElementById("jumlah").innerHTML =
          "Jumlah berhasil: " +
          jumlahBerhasil;


        document.getElementById("status").innerHTML =
          "✅ " +
          register;


        /*
         * BUNYI
         */

        bunyiBerhasil();


        /*
         * GETAR
         */

        getarBerhasil();


        tambahHasil(

          hasil.data,

          hasil.tanggalScan,

          hasil.jamScan,

          "success"

        );

      }


      // ====================================
      // DUPLIKAT
      // ====================================

      else if (
        hasil.status === "duplicate"
      ) {


        document.getElementById("status").innerHTML =
          "❌ " +
          hasil.message;


        tambahHasil(

          hasil.data,

          "",

          "",

          "duplicate"

        );

      }


      // ====================================
      // TIDAK ADA DI DATABASE
      // ====================================

      else if (
        hasil.status === "not_found"
      ) {


        document.getElementById("status").innerHTML =
          "⚠️ " +
          hasil.message;


        tambahHasilTidakDitemukan(
          register
        );

      }


      // ====================================
      // ERROR
      // ====================================

      else {


        document.getElementById("status").innerHTML =
          "⚠️ " +
          hasil.message;

      }


      // ====================================
      // SIAP SCAN BERIKUTNYA
      // ====================================

      setTimeout(function() {

        sedangProses = false;

      }, 1200);


      delete window[callbackName];


      const script =
        document.getElementById(
          callbackName
        );


      if (script) {
        script.remove();
      }

    };


  // ======================================
  // JSONP
  // ======================================

  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?register=" +
    encodeURIComponent(register) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {


      document.getElementById("status").innerHTML =
        "❌ Gagal menghubungi DATABASE";


      sedangProses = false;


      delete window[callbackName];


      script.remove();

    };


  document.body.appendChild(script);

}


// ==========================================
// HASIL BERHASIL / DUPLIKAT
// ==========================================

function tambahHasil(

  data,
  tanggalScan,
  jamScan,
  tipe

) {


  const register =
    data[0];


  const item =
    document.createElement("div");


  item.className =
    "item";


  const id =
    "detail_" +
    Date.now();


  let warna =
    tipe === "success"
    ?
    "success"
    :
    "duplicate";


  let tulisan =
    tipe === "success"
    ?
    "✅ " + register
    :
    "❌ " + register;


  let tombol =
    "DETAIL";


  item.innerHTML = `

    <div class="baris">

      <div class="nomor ${warna}">
        ${tulisan}
      </div>

      <button
        class="detailBtn ${tipe === "duplicate" ? "duplicateBtn" : ""}"
        onclick="toggleDetail('${id}', this)"
      >
        ${tombol}
      </button>

    </div>


    <div
      id="${id}"
      class="detail"
    >

      <div>
        <span class="label">REGISTER</span>
        : ${data[0]}
      </div>

      <div>
        <span class="label">PANJANG</span>
        : ${data[1]}
      </div>

      <div>
        <span class="label">DIAMETER</span>
        : ${data[2]}
      </div>

      <div>
        <span class="label">TPK</span>
        : ${data[3]}
      </div>

      <div>
        <span class="label">TUMPUK</span>
        : ${data[4]}
      </div>

      <div>
        <span class="label">MUTU</span>
        : ${data[5]}
      </div>

      <div>
        <span class="label">STATUS</span>
        : ${data[6]}
      </div>

      <div>
        <span class="label">M3</span>
        : ${data[7]}
      </div>


      ${
        tanggalScan
        ?
        `
        <div>
          <span class="label">TANGGAL</span>
          : ${tanggalScan}
        </div>

        <div>
          <span class="label">JAM</span>
          : ${jamScan}
        </div>
        `
        :
        ""
      }


    </div>

  `;


  document
    .getElementById("daftar")
    .prepend(item);

}


// ==========================================
// REGISTER TIDAK DITEMUKAN
// ==========================================

function tambahHasilTidakDitemukan(
  register
) {


  const item =
    document.createElement("div");


  item.className =
    "item";


  item.innerHTML = `

    <div class="baris">

      <div class="nomor notfound">
        ⚠️ ${register}
      </div>

      <div class="notfound">
        TIDAK ADA
      </div>

    </div>

  `;


  document
    .getElementById("daftar")
    .prepend(item);

}


// ==========================================
// BUKA / TUTUP DETAIL
// ==========================================

function toggleDetail(
  id,
  tombol
) {


  const detail =
    document.getElementById(id);


  if (
    detail.style.display === "block"
  ) {


    detail.style.display =
      "none";


    tombol.innerHTML =
      "DETAIL";


  }

  else {


    detail.style.display =
      "block";


    tombol.innerHTML =
      "TUTUP";


  }

}


</script>


</body>

</html>
