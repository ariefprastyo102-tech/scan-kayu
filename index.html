<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Scan Kayu</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 15px;
}

h2 {
  text-align: center;
  margin: 5px 0 15px;
}


/* =====================================================
   AREA SCANNER
===================================================== */

#reader {
  width: 100%;
  max-width: 500px;
  margin: auto;
  background: white;
  border-radius: 10px;
  overflow: hidden;
  border: 3px solid transparent;
  transition: border-color 0.15s ease,
              box-shadow 0.15s ease;
}


/* TANDA BERHASIL */

#reader.scan-success {
  border-color: #00c853;
  box-shadow:
    0 0 0 5px rgba(0, 200, 83, 0.25);
}


/* TANDA DUPLIKAT */

#reader.scan-duplicate {
  border-color: #e53935;
  box-shadow:
    0 0 0 5px rgba(229, 57, 53, 0.25);
}


/* =====================================================
   TOMBOL
===================================================== */

#btnScan {
  display: block;
  width: 100%;
  max-width: 500px;
  margin: 15px auto;
  padding: 15px;
  font-size: 18px;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  background: #1976d2;
  color: white;
}


/* =====================================================
   STATUS
===================================================== */

#status {
  max-width: 500px;
  margin: 10px auto;
  text-align: center;
  font-weight: bold;
  line-height: 1.5;
}

#jumlah {
  max-width: 500px;
  margin: 10px auto;
  text-align: center;
  font-weight: bold;
}


/* =====================================================
   DAFTAR HASIL
===================================================== */

#daftar {
  width: 100%;
  max-width: 500px;
  margin: 15px auto;
}

.item {
  background: white;
  margin-bottom: 8px;
  border-radius: 8px;
  padding: 12px;
}

.baris {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.nomor {
  font-size: 20px;
  font-weight: bold;
  word-break: break-all;
}

.detailBtn {
  width: auto;
  min-width: 80px;
  padding: 8px 12px;
  margin: 0;
  background: #555;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: bold;
}

.detail {
  display: none;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid #ddd;
  font-size: 15px;
  line-height: 1.7;
}


/* =====================================================
   WARNA STATUS
===================================================== */

.success {
  color: green;
}

.duplicate {
  color: red;
}

.notfound {
  color: darkorange;
}

.error {
  color: red;
}

.detailBtn.duplicateBtn {
  background: #c62828;
}

.label {
  display: inline-block;
  width: 115px;
  font-weight: bold;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  body {
    padding: 10px;
  }

  #reader {
    max-width: 100%;
  }

  #btnScan {
    max-width: 100%;
  }

  #status,
  #jumlah,
  #daftar {
    max-width: 100%;
  }

}

</style>

</head>


<body>


<h2>
SCAN REGISTER KAYU
</h2>


<div id="reader"></div>


<button
  id="btnScan"
  onclick="mulaiKamera()"
>
  📷 BUKA KAMERA
</button>


<div id="status">
  Tekan Buka Kamera
</div>


<div id="jumlah">
  Jumlah berhasil: 0
</div>


<div id="daftar"></div>


<script>


// =====================================================
// URL APPS SCRIPT
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


// =====================================================
// VARIABEL
// =====================================================

let scanner = null;

let kameraAktif = false;

let sedangProses = false;

let jumlahBerhasil = 0;


// =====================================================
// SUARA BEEP
// =====================================================

let audioContext = null;


function bunyiBeep(
  frekuensi,
  durasi
) {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      frekuensi;


    oscillator.type =
      "sine";


    gain.gain.setValueAtTime(
      0.15,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime +
      durasi
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      durasi
    );

  }

  catch(error) {

    console.log(
      "Audio tidak tersedia"
    );

  }

}


// =====================================================
// TANDA SCAN BERHASIL
// =====================================================

function tandaBerhasil() {

  const reader =
    document.getElementById(
      "reader"
    );


  reader.classList.remove(
    "scan-duplicate"
  );


  reader.classList.add(
    "scan-success"
  );


  bunyiBeep(
    1200,
    0.15
  );


  setTimeout(
    function(){

      reader.classList.remove(
        "scan-success"
      );

    },
    500
  );

}


// =====================================================
// TANDA DUPLIKAT
// =====================================================

function tandaDuplikat() {

  const reader =
    document.getElementById(
      "reader"
    );


  reader.classList.remove(
    "scan-success"
  );


  reader.classList.add(
    "scan-duplicate"
  );


  bunyiBeep(
    450,
    0.25
  );


  setTimeout(
    function(){

      reader.classList.remove(
        "scan-duplicate"
      );

    },
    700
  );

}


// =====================================================
// BUKA KAMERA
// =====================================================

function mulaiKamera() {

  if (kameraAktif) {
    return;
  }


  kameraAktif = true;


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Membuka kamera...";


  /*
   * Buat scanner
   */

  scanner =
    new Html5Qrcode(
      "reader"
    );


  /*
   * Konfigurasi kamera
   *
   * CODE_128 karena barcode
   * kita menggunakan CODE128.
   */

  const konfigurasi = {

    fps: 15,

    qrbox: {

      width: 350,

      height: 190

    },

    aspectRatio: 1.7777778,

    disableFlip: true,

    formatsToSupport: [

      Html5QrcodeSupportedFormats.CODE_128

    ]

  };


  /*
   * Mulai kamera belakang
   */

  scanner.start(

    {
      facingMode:
        "environment"
    },

    konfigurasi,


    function(register) {


      register =
        String(
          register
        ).trim();


      if (!register) {

        return;

      }


      /*
       * Kalau masih memproses
       * jangan baca lagi.
       */

      if (sedangProses) {

        return;

      }


      sedangProses = true;


      /*
       * Tanda sedang mengecek
       */

      document.getElementById(
        "status"
      ).innerHTML =
        "⏳ Mengecek <b>" +
        register +
        "</b>...";


      /*
       * Cek ke database
       */

      cekRegister(
        register
      );

    },


    function(errorMessage) {

      /*
       * Error pembacaan sementara
       * sengaja tidak ditampilkan.
       */

    }

  )


  .then(function() {


    /*
     * Kamera aktif
     */

    document.getElementById(
      "status"
    ).innerHTML =
      "📷 <b>KAMERA AKTIF</b><br>" +
      "Arahkan barcode ke kamera";


    /*
     * Aktifkan audio setelah
     * user menekan tombol kamera.
     */

    try {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    catch(error) {

      console.log(
        "Audio tidak tersedia"
      );

    }

  })


  .catch(function(error) {


    kameraAktif = false;


    document.getElementById(
      "status"
    ).innerHTML =
      "❌ Kamera gagal dibuka<br>" +
      error;

  });

}


// =====================================================
// CEK REGISTER
// =====================================================

function cekRegister(
  register
) {


  const callbackName =
    "scan_" +
    Date.now();


  window[callbackName] =
    function(hasil) {


      /*
       * BERHASIL
       */

      if (
        hasil.status ===
        "success"
      ) {


        /*
         * TANDA HIJAU
         */

        tandaBerhasil();


        jumlahBerhasil++;


        document.getElementById(
          "jumlah"
        ).innerHTML =
          "Jumlah berhasil: " +
          jumlahBerhasil;


        document.getElementById(
          "status"
        ).innerHTML =
          "✅ <b>BERHASIL SCAN</b><br>" +
          register;


        tambahHasil(

          hasil.data,

          hasil.tanggalScan,

          hasil.jamScan,

          "success"

        );

      }


      /*
       * DUPLIKAT
       */

      else if (
        hasil.status ===
        "duplicate"
      ) {


        /*
         * TANDA MERAH
         */

        tandaDuplikat();


        document.getElementById(
          "status"
        ).innerHTML =
          "❌ <b>SUDAH PERNAH DISCAN</b><br>" +
          hasil.message;


        tambahHasil(

          hasil.data,

          "",

          "",

          "duplicate"

        );

      }


      /*
       * TIDAK DITEMUKAN
       */

      else if (
        hasil.status ===
        "not_found"
      ) {


        /*
         * Tanda merah/oranye
         */

        tandaDuplikat();


        document.getElementById(
          "status"
        ).innerHTML =
          "⚠️ <b>REGISTER TIDAK DITEMUKAN</b><br>" +
          hasil.message;


        tambahHasilTidakDitemukan(
          register
        );

      }


      /*
       * ERROR
       */

      else {


        document.getElementById(
          "status"
        ).innerHTML =
          "⚠️ " +
          hasil.message;

      }


      /*
       * Tunggu sebentar sebelum
       * scan berikutnya.
       */

      setTimeout(
        function(){

          sedangProses =
            false;


          /*
           * Status kembali siap scan
           */

          if (
            kameraAktif
          ) {

            document.getElementById(
              "status"
            ).innerHTML =
              "📷 <b>SIAP SCAN</b><br>" +
              "Arahkan ke barcode";

          }

        },
        1200
      );


      /*
       * Bersihkan JSONP
       */

      delete window[
        callbackName
      ];


      const script =
        document.getElementById(
          callbackName
        );


      if (script) {

        script.remove();

      }

    };


  /*
   * JSONP
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?register=" +
    encodeURIComponent(
      register
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {


      document.getElementById(
        "status"
      ).innerHTML =
        "❌ Gagal menghubungi DATABASE";


      sedangProses =
        false;


      delete window[
        callbackName
      ];


      script.remove();

    };


  document.body.appendChild(
    script
  );

}


// =====================================================
// HASIL BERHASIL / DUPLIKAT
// =====================================================

function tambahHasil(

  data,

  tanggalScan,

  jamScan,

  tipe

) {


  const register =
    data[0];


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "item";


  const id =
    "detail_" +
    Date.now();


  let warna =
    tipe === "success"
    ?
    "success"
    :
    "duplicate";


  let tulisan =
    tipe === "success"
    ?
    "✅ " + register
    :
    "❌ " + register;


  let tombol =
    "DETAIL";


  item.innerHTML = `

    <div class="baris">

      <div class="nomor ${warna}">
        ${tulisan}
      </div>

      <button
        class="detailBtn ${
          tipe === "duplicate"
          ?
          "duplicateBtn"
          :
          ""
        }"
        onclick="toggleDetail(
          '${id}',
          this
        )"
      >
        ${tombol}
      </button>

    </div>


    <div
      id="${id}"
      class="detail"
    >

      <div>
        <span class="label">REGISTER</span>
        : ${data[0]}
      </div>

      <div>
        <span class="label">PANJANG</span>
        : ${data[1]}
      </div>

      <div>
        <span class="label">DIAMETER</span>
        : ${data[2]}
      </div>

      <div>
        <span class="label">TPK</span>
        : ${data[3]}
      </div>

      <div>
        <span class="label">TUMPUK</span>
        : ${data[4]}
      </div>

      <div>
        <span class="label">MUTU</span>
        : ${data[5]}
      </div>

      <div>
        <span class="label">STATUS</span>
        : ${data[6]}
      </div>

      <div>
        <span class="label">M3</span>
        : ${data[7]}
      </div>


      ${
        tanggalScan
        ?
        `
        <div>
          <span class="label">TANGGAL</span>
          : ${tanggalScan}
        </div>

        <div>
          <span class="label">JAM</span>
          : ${jamScan}
        </div>
        `
        :
        ""
      }

    </div>

  `;


  document
    .getElementById(
      "daftar"
    )
    .prepend(item);

}


// =====================================================
// REGISTER TIDAK DITEMUKAN
// =====================================================

function tambahHasilTidakDitemukan(
  register
) {


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "item";


  item.innerHTML = `

    <div class="baris">

      <div class="nomor notfound">
        ⚠️ ${register}
      </div>

      <div class="notfound">
        TIDAK ADA
      </div>

    </div>

  `;


  document
    .getElementById(
      "daftar"
    )
    .prepend(item);

}


// =====================================================
// BUKA / TUTUP DETAIL
// =====================================================

function toggleDetail(
  id,
  tombol
) {


  const detail =
    document.getElementById(
      id
    );


  if (
    detail.style.display ===
    "block"
  ) {


    detail.style.display =
      "none";


    tombol.innerHTML =
      "DETAIL";


  }

  else {


    detail.style.display =
      "block";


    tombol.innerHTML =
      "TUTUP";

  }

}

</script>


</body>

</html>
