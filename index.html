<!DOCTYPE html>
<html lang="id">

<head>

      content="width=device-width, initial-scale=1.0">

<title>Scan Register Kayu - IK Saradan</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {

body {

   MOBILE
========================================== */

@media(max-width:500px) {

  body {
    padding: 10px;
  }

  .header {
    padding: 14px 10px;
  }

  .logo {
    width: 65px;
    height: 65px;
  }

  .judul {
    font-size: 21px;
  }

  .subjudul {
    font-size: 14px;
  }

}

</style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<div class="header">

  <!-- Logo Perhutani -->
  <img
    class="logo"
    src="https://www.perhutani.co.id/wp-content/uploads/2023/11/logo-perhutani.png"
    alt="Logo Perhutani"
    onerror="this.style.display='none';"
  >

  <div class="judul">
    SCAN REGISTER KAYU
  </div>

  <div class="subjudul">
    IK SARADAN
  </div>

</div>


<!-- ==========================================
     CAMERA
========================================== -->

<div class="camera-card">

  <div id="reader"></div>

</div>


<button
  id="btnScan"
  onclick="mulaiKamera()"
>
  📷 BUKA KAMERA
</button>


<!-- ==========================================
     STATUS
========================================== -->

<div class="status-card">

  <div id="status">
    Tekan Buka Kamera
  </div>

  <div id="jumlah">
    Jumlah berhasil: 0
  </div>

</div>


<div id="daftar"></div>


<script>


// ==========================================
// URL APPS SCRIPT
// ==========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


// ==========================================
// VARIABEL
// ==========================================

let scanner = null;

let kameraAktif = false;

let sedangProses = false;

let jumlahBerhasil = 0;


// ==========================================
// SUARA CEKLING
// ==========================================

function bunyiBerhasil() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const audio =
      new AudioContext();

    const oscillator1 =
      audio.createOscillator();

    const gain1 =
      audio.createGain();

    oscillator1.type =
      "sine";

    oscillator1.frequency.setValueAtTime(
      1300,
      audio.currentTime
    );

    gain1.gain.setValueAtTime(
      0.001,
      audio.currentTime
    );

    gain1.gain.exponentialRampToValueAtTime(
      0.35,
      audio.currentTime + 0.01
    );

    gain1.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.12
    );

    oscillator1.connect(gain1);
    gain1.connect(audio.destination);

    oscillator1.start(
      audio.currentTime
    );

    oscillator1.stop(
      audio.currentTime + 0.13
    );


    const oscillator2 =
      audio.createOscillator();

    const gain2 =
      audio.createGain();

    oscillator2.type =
      "sine";

    oscillator2.frequency.setValueAtTime(
      1850,
      audio.currentTime + 0.08
    );

    gain2.gain.setValueAtTime(
      0.001,
      audio.currentTime + 0.08
    );

    gain2.gain.exponentialRampToValueAtTime(
      0.28,
      audio.currentTime + 0.09
    );

    gain2.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.22
    );

    oscillator2.connect(gain2);
    gain2.connect(audio.destination);

    oscillator2.start(
      audio.currentTime + 0.08
    );

    oscillator2.stop(
      audio.currentTime + 0.23
    );

    setTimeout(function() {

      audio.close();

    }, 400);

  } catch (e) {

    console.log(
      "Audio tidak tersedia",
      e
    );

  }

}


// ==========================================
// GETAR
// ==========================================

function getarBerhasil() {

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      [
        100,
        50,
        100
      ]
    );

  }

}


// ==========================================
// BUKA KAMERA
// ==========================================

function mulaiKamera() {

  if (kameraAktif) {
    return;
  }

  kameraAktif = true;

  document.getElementById("status").innerHTML =
    "⏳ Membuka kamera...";

  scanner =
    new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {

      fps: 30,

      qrbox: {
        width: 280,
        height: 160
      }

    },

    function(register) {

      register =
        String(register).trim();

      if (!register) {
        return;
      }

      if (sedangProses) {
        return;
      }

      sedangProses = true;

      document.getElementById("status").innerHTML =
        "⏳ Mengecek " +
        register +
        "...";

      cekRegister(register);

    },

    function(errorMessage) {

      // Error pembacaan sementara diabaikan

    }

  )

  .then(function() {

    document.getElementById("status").innerHTML =
      "📷 KAMERA AKTIF<br>" +
      "Arahkan ke barcode";

  })

  .catch(function(error) {

    kameraAktif = false;

    document.getElementById("status").innerHTML =
      "❌ Kamera gagal dibuka<br>" +
      error;

  });

}


// ==========================================
// CEK REGISTER
// ==========================================

function cekRegister(register) {

  const callbackName =
    "scan_" +
    Date.now();

  window[callbackName] =
    function(hasil) {

      if (
        hasil.status === "success"
      ) {

        jumlahBerhasil++;

        document.getElementById("jumlah").innerHTML =
          "Jumlah berhasil: " +
          jumlahBerhasil;

        document.getElementById("status").innerHTML =
          "✅ " +
          register;

        bunyiBerhasil();

        getarBerhasil();

        tambahHasil(
          hasil.data,
          hasil.tanggalScan,
          hasil.jamScan,
          "success"
        );

      }

      else if (
        hasil.status === "duplicate"
      ) {

        document.getElementById("status").innerHTML =
          "❌ " +
          hasil.message;

        tambahHasil(
          hasil.data,
          "",
          "",
          "duplicate"
        );

      }

      else if (
        hasil.status === "not_found"
      ) {

        document.getElementById("status").innerHTML =
          "⚠️ " +
          hasil.message;

        tambahHasilTidakDitemukan(
          register
        );

      }

      else {

        document.getElementById("status").innerHTML =
          "⚠️ " +
          hasil.message;

      }

      setTimeout(function() {

        sedangProses = false;

      }, 500);

      delete window[callbackName];

      const script =
        document.getElementById(
          callbackName
        );

      if (script) {
        script.remove();
      }

    };


  const script =
    document.createElement("script");

  script.id =
    callbackName;

  script.src =
    API_URL +
    "?register=" +
    encodeURIComponent(register) +
    "&callback=" +
    callbackName;

  script.onerror =
    function() {

      document.getElementById("status").innerHTML =
        "❌ Gagal menghubungi DATABASE";

      sedangProses = false;

      delete window[callbackName];

      script.remove();

    };

  document.body.appendChild(script);

}


// ==========================================
// HASIL BERHASIL / DUPLIKAT
// ==========================================

function tambahHasil(

  data,
  tanggalScan,
  jamScan,
  tipe

) {

  const register =
    data[0];

  const item =
    document.createElement("div");

  item.className =
    "item";

  const id =
    "detail_" +
    Date.now();

  let warna =
    tipe === "success"
    ?
    "success"
    :
    "duplicate";

  let tulisan =
    tipe === "success"
    ?
    "✅ " + register
    :
    "❌ " + register;

  let tombol =
    "DETAIL";

  item.innerHTML = `

    <div class="baris">

      <div class="nomor ${warna}">
        ${tulisan}
      </div>

      <button
        class="detailBtn ${tipe === "duplicate" ? "duplicateBtn" : ""}"
        onclick="toggleDetail('${id}', this)"
      >
        ${tombol}
      </button>

    </div>

    <div
      id="${id}"
      class="detail"
    >

      <div>
        <span class="label">REGISTER</span>
        : ${data[0]}
      </div>

      <div>
        <span class="label">PANJANG</span>
        : ${data[1]}
      </div>

      <div>
        <span class="label">DIAMETER</span>
        : ${data[2]}
      </div>

      <div>
        <span class="label">TPK</span>
        : ${data[3]}
      </div>

      <div>
        <span class="label">TUMPUK</span>
        : ${data[4]}
      </div>

      <div>
        <span class="label">MUTU</span>
        : ${data[5]}
      </div>

      <div>
        <span class="label">STATUS</span>
        : ${data[6]}
      </div>

      <div>
        <span class="label">M3</span>
        : ${data[7]}
      </div>

      ${
        tanggalScan
        ?
        `
        <div>
          <span class="label">TANGGAL</span>
          : ${tanggalScan}
        </div>

        <div>
          <span class="label">JAM</span>
          : ${jamScan}
        </div>
        `
        :
        ""
      }

    </div>

  `;

  document
    .getElementById("daftar")
    .prepend(item);

}


// ==========================================
// REGISTER TIDAK DITEMUKAN
// ==========================================

function tambahHasilTidakDitemukan(
  register
) {

  const item =
    document.createElement("div");

  item.className =
    "item";

  item.innerHTML = `

    <div class="baris">

      <div class="nomor notfound">
        ⚠️ ${register}
      </div>

      <div class="notfound">
        TIDAK ADA
      </div>

    </div>

  `;

  document
    .getElementById("daftar")
    .prepend(item);

}


// ==========================================
// BUKA / TUTUP DETAIL
// ==========================================

function toggleDetail(
  id,
  tombol
) {

  const detail =
    document.getElementById(id);

  if (
    detail.style.display === "block"
  ) {

    detail.style.display =
      "none";

    tombol.innerHTML =
      "DETAIL";

  }

  else {

    detail.style.display =
      "block";

    tombol.innerHTML =
      "TUTUP";

  }

}

</script>

</body>

</html>
