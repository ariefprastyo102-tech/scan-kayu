<style>

</head>


<body>


<h2>
SCAN REGISTER KAYU
</h2>


<div id="reader"></div>


<button
  id="btnScan"
  onclick="mulaiKamera()"
>
📷 BUKA KAMERA
</button>


<div id="status">
Tekan Buka Kamera
</div>


<div id="jumlah">
Jumlah berhasil: 0
</div>


<div id="daftar"></div>


<script>


// =====================================================
// URL APPS SCRIPT
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


// =====================================================
// VARIABEL
// =====================================================

let scanner = null;

let kameraAktif = false;

let sedangProses = false;

let jumlahBerhasil = 0;


// =====================================================
// AUDIO
// =====================================================

let audioContext = null;


// =====================================================
// SIAPKAN AUDIO
// =====================================================

function siapkanAudio(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioContext){

      return;

    }


    if(!audioContext){

      audioContext =
        new AudioContext();

    }


    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }catch(e){

    console.log(
      "Audio tidak tersedia",
      e
    );

  }

}


// =====================================================
// BUNYI BERHASIL
// =====================================================

function bunyiBerhasil(){

  try{

    if(!audioContext){

      return;

    }


    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.setValueAtTime(
      1200,
      audioContext.currentTime
    );


    gain.gain.setValueAtTime(
      0.3,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.25
    );


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.25
    );

  }catch(e){

    console.log(
      "Gagal bunyi",
      e
    );

  }

}


// =====================================================
// GETAR HP
// =====================================================

function getarBerhasil(){

  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      [
        120,
        60,
        120
      ]
    );

  }

}


// =====================================================
// BUKA KAMERA
// =====================================================

function mulaiKamera(){

  siapkanAudio();


  if(kameraAktif){

    return;

  }


  kameraAktif =
    true;


  document.getElementById(
    "status"
  ).className =
    "";


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Membuka kamera...";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {

      fps:15,

      qrbox:{
        width:300,
        height:180
      },

      aspectRatio:
        1.7777778

    },


    function(register){

      register =
        String(
          register
        ).trim();


      if(!register){

        return;

      }


      if(sedangProses){

        return;

      }


      sedangProses =
        true;


      document.getElementById(
        "status"
      ).className =
        "";


      document.getElementById(
        "status"
      ).innerHTML =
        "⏳ MENGECEK<br>" +
        register;


      cekRegister(
        register
      );

    },


    function(errorMessage){

      // Error pembacaan sementara
      // sengaja tidak ditampilkan

    }

  )


  .then(function(){

    document.getElementById(
      "status"
    ).className =
      "";


    document.getElementById(
      "status"
    ).innerHTML =
      "📷 KAMERA AKTIF<br>" +
      "Arahkan ke barcode";

  })


  .catch(function(error){

    kameraAktif =
      false;


    document.getElementById(
      "status"
    ).className =
      "error";


    document.getElementById(
      "status"
    ).innerHTML =
      "❌ Kamera gagal dibuka<br>" +
      error;

  });

}


// =====================================================
// CEK REGISTER
// =====================================================

function cekRegister(
  register
){

  const callbackName =
    "scan_" +
    Date.now();


  window[callbackName] =
    function(hasil){


      if(!hasil){

        sedangProses =
          false;

        return;

      }


      // =================================================
      // BERHASIL
      // =================================================

      if(
        hasil.status ===
        "success"
      ){

        jumlahBerhasil++;


        document.getElementById(
          "jumlah"
        ).innerHTML =
          "Jumlah berhasil: " +
          jumlahBerhasil;


        const status =
          document.getElementById(
            "status"
          );


        status.className =
          "statusBerhasil";


        status.innerHTML =
          "✅ SUDAH BERHASIL SCAN<br>" +
          register;


        bunyiBerhasil();

        getarBerhasil();


        tambahHasil(

          hasil.data,

          hasil.tanggalScan,

          hasil.jamScan,

          "success"

        );

      }


      // =================================================
      // DUPLIKAT
      // =================================================

      else if(
        hasil.status ===
        "duplicate"
      ){

        const status =
          document.getElementById(
            "status"
          );


        status.className =
          "statusDuplikat";


        status.innerHTML =
          "❌ SUDAH PERNAH SCAN<br>" +
          register;


        getarBerhasil();


        tambahHasil(

          hasil.data,

          "",

          "",

          "duplicate"

        );

      }


      // =================================================
      // TIDAK DITEMUKAN
      // =================================================

      else if(
        hasil.status ===
        "not_found"
      ){

        const status =
          document.getElementById(
            "status"
          );


        status.className =
          "statusTidakAda";


        status.innerHTML =
          "⚠️ REGISTER TIDAK ADA<br>" +
          register;


        tambahHasilTidakDitemukan(
          register
        );

      }


      // =================================================
      // ERROR
      // =================================================

      else{

        document.getElementById(
          "status"
        ).className =
          "error";


        document.getElementById(
          "status"
        ).innerHTML =
          "⚠️ " +
          (
            hasil.message ||
            "Terjadi kesalahan"
          );

      }


      // =================================================
      // SIAP SCAN LAGI
      // =================================================

      setTimeout(
        function(){

          sedangProses =
            false;


          document.getElementById(
            "status"
          ).className =
            "";


          document.getElementById(
            "status"
          ).innerHTML =
            "📷 SIAP SCAN BERIKUTNYA";

        },
        2000
      );


      delete window[
        callbackName
      ];


      const script =
        document.getElementById(
          callbackName
        );


      if(script){

        script.remove();

      }

    };


  // ===================================================
  // JSONP
  // ===================================================

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?register=" +
    encodeURIComponent(
      register
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function(){

      document.getElementById(
        "status"
      ).className =
        "error";


      document.getElementById(
        "status"
      ).innerHTML =
        "❌ Gagal menghubungi DATABASE";


      sedangProses =
        false;


      delete window[
        callbackName
      ];


      script.remove();

    };


  document.body.appendChild(
    script
  );

}


// =====================================================
// HASIL BERHASIL / DUPLIKAT
// =====================================================

function tambahHasil(

  data,

  tanggalScan,

  jamScan,

  tipe

){

  if(!data){

    return;

  }


  const register =
    data[0];


  const item =
    document.createElement(
      "div"
    );


  item.className =
    tipe === "success"
    ?
    "item berhasil"
    :
    "item duplikat";


  const id =
    "detail_" +
    Date.now();


  const tulisan =
    tipe === "success"
    ?
    "✅ " + register
    :
    "❌ " + register;


  item.innerHTML = `

    <div class="baris">

      <div class="nomor ${
        tipe === "success"
        ? "success"
        : "duplicate"
      }">

        ${tulisan}

      </div>


      <button

        class="detailBtn ${
          tipe === "duplicate"
          ? "duplicateBtn"
          : ""
        }"

        onclick="toggleDetail(
          '${id}',
          this
        )"

      >

        DETAIL

      </button>

    </div>


    <div
      id="${id}"
      class="detail"
    >

      <div>
        <span class="label">
          REGISTER
        </span>
        : ${data[0] ?? ""}
      </div>

      <div>
        <span class="label">
          PANJANG
        </span>
        : ${data[1] ?? ""}
      </div>

      <div>
        <span class="label">
          DIAMETER
        </span>
        : ${data[2] ?? ""}
      </div>

      <div>
        <span class="label">
          TPK
        </span>
        : ${data[3] ?? ""}
      </div>

      <div>
        <span class="label">
          TUMPUK
        </span>
        : ${data[4] ?? ""}
      </div>

      <div>
        <span class="label">
          MUTU
        </span>
        : ${data[5] ?? ""}
      </div>

      <div>
        <span class="label">
          STATUS
        </span>
        : ${data[6] ?? ""}
      </div>

      <div>
        <span class="label">
          M3
        </span>
        : ${data[7] ?? ""}
      </div>


      ${
        tanggalScan
        ?
        `
        <div>
          <span class="label">
            TANGGAL
          </span>
          : ${tanggalScan}
        </div>

        <div>
          <span class="label">
            JAM
          </span>
          : ${jamScan}
        </div>
        `
        :
        ""
      }

    </div>

  `;


  document
    .getElementById(
      "daftar"
    )
    .prepend(
      item
    );

}


// =====================================================
// REGISTER TIDAK DITEMUKAN
// =====================================================

function tambahHasilTidakDitemukan(
  register
){

  const item =
    document.createElement(
      "div"
    );


  item.className =
    "item tidakada";


  item.innerHTML = `

    <div class="baris">

      <div class="nomor notfound">

        ⚠️ ${register}

      </div>

      <div class="notfound">

        TIDAK ADA

      </div>

    </div>

  `;


  document
    .getElementById(
      "daftar"
    )
    .prepend(
      item
    );

}


// =====================================================
// BUKA / TUTUP DETAIL
// =====================================================

function toggleDetail(
  id,
  tombol
){

  const detail =
    document.getElementById(
      id
    );


  if(
    detail.style.display ===
    "block"
  ){

    detail.style.display =
      "none";


    tombol.innerHTML =
      "DETAIL";

  }

  else{

    detail.style.display =
      "block";


    tombol.innerHTML =
      "TUTUP";

  }

}

</script>

</body>

</html>
