<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Cetak Barcode Kayu</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  font-family: Arial, sans-serif;

  margin: 0;

  padding: 20px;

  background: #f5f5f5;

}


/* =====================================================
   KONTROL
   ===================================================== */

.kontrol {

  max-width: 1000px;

  margin: 0 auto 20px;

  background: white;

  padding: 20px;

  border-radius: 10px;

  box-shadow: 0 2px 8px rgba(0,0,0,0.08);

}


h2 {

  text-align: center;

  margin: 0 0 20px;

}


button {

  padding: 12px 16px;

  border: none;

  border-radius: 8px;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

}


#btnAmbil {

  background: #1976d2;

  color: white;

  width: 100%;

}


#btnPrint {

  background: #388e3c;

  color: white;

}


#btnPilihSemua {

  background: #757575;

  color: white;

}


#btnBatal {

  background: #d32f2f;

  color: white;

}


/* =====================================================
   PENGATURAN
   ===================================================== */

.pengaturan {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 12px;

  margin-top: 15px;

}


.kotak {

  background: #f7f7f7;

  border: 1px solid #ddd;

  border-radius: 8px;

  padding: 10px;

}


.kotak label {

  display: block;

  font-size: 13px;

  font-weight: bold;

  margin-bottom: 6px;

}


.kotak input {

  width: 100%;

  padding: 9px;

  border: 1px solid #bbb;

  border-radius: 6px;

  font-size: 15px;

}


/* =====================================================
   FILTER
   ===================================================== */

.filterArea {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 12px;

  margin-top: 15px;

}


.filterArea input {

  width: 100%;

  padding: 10px;

  border: 1px solid #ccc;

  border-radius: 7px;

}


/* =====================================================
   TOMBOL
   ===================================================== */

.tombolArea {

  display: flex;

  gap: 8px;

  flex-wrap: wrap;

  margin-top: 15px;

}


.tombolArea button {

  flex: 1;

  min-width: 150px;

}


/* =====================================================
   STATUS
   ===================================================== */

#status {

  text-align: center;

  margin-top: 15px;

  font-weight: bold;

}


#jumlah {

  text-align: center;

  margin-top: 8px;

}


#jumlahDipilih {

  text-align: center;

  margin-top: 5px;

  font-weight: bold;

}


/* =====================================================
   HASIL
   ===================================================== */

#hasil {

  max-width: 1200px;

  margin: auto;

}


.grid {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 10px;

}


/* =====================================================
   ITEM BARCODE
   ===================================================== */

.barcodeItem {

  position: relative;

  background: white;

  border: 1px solid #ccc;

  border-radius: 6px;

  padding: 5px;

  text-align: center;

}


.barcodeItem.tidakDipilih {

  opacity: 0.35;

}


/* =====================================================
   CHECKBOX
   ===================================================== */

.check {

  position: absolute;

  top: 5px;

  left: 5px;

  width: 18px;

  height: 18px;

}


/* =====================================================
   BARCODE
   ===================================================== */

.barcodeItem svg {

  display: block;

  margin: 18px auto 2px;

  width: 100%;

  height: 55px;

}


/* =====================================================
   REGISTER + TUMPUK
   ===================================================== */

.info {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 15px;

  margin-top: 2px;

  font-size: 14px;

  font-weight: bold;

}


.register {

  text-align: right;

}


.tumpuk {

  text-align: left;

}


/* =====================================================
   MODE CETAK
   ===================================================== */

@media print {

  @page {

    size: auto;

    margin: 0;

  }


  body {

    background: white;

    padding: 0;

    margin: 0;

  }


  .kontrol {

    display: none !important;

  }


  #hasil {

    width: auto;

    max-width: none;

    margin: 0;

  }


  .grid {

    display: grid;

    gap: var(--jarak-v) var(--jarak-h);

    grid-template-columns:
      repeat(var(--kolom), var(--barcode-width));

    justify-content: start;

    align-items: start;

  }


  .barcodeItem {

    width: var(--barcode-width);

    height: var(--barcode-height);

    border: none;

    border-radius: 0;

    padding: 0;

    margin: 0;

    background: white;

    break-inside: avoid;

    page-break-inside: avoid;

  }


  .barcodeItem:not(.dipilih) {

    display: none !important;

  }


  .check {

    display: none !important;

  }


  .barcodeItem svg {

    width: var(--barcode-width);

    height: calc(var(--barcode-height) - 0.45cm);

    margin: 0;

  }


  .info {

    font-size: 10pt;

    gap: 0.3cm;

    margin: 0;

    line-height: 0.35cm;

  }

}


/* =====================================================
   HP
   ===================================================== */

@media screen and (max-width: 700px) {

  .pengaturan {

    grid-template-columns:
      repeat(2, 1fr);

  }


  .filterArea {

    grid-template-columns:
      1fr;

  }


  .grid {

    grid-template-columns:
      repeat(2, 1fr);

  }

}


@media screen and (max-width: 450px) {

  .pengaturan {

    grid-template-columns:
      1fr;

  }


  .grid {

    grid-template-columns:
      repeat(1, 1fr);

  }

}

</style>

</head>


<body>


<!-- =====================================================
     KONTROL
     ===================================================== -->

<div class="kontrol">

  <h2>
    🖨️ CETAK BARCODE KAYU
  </h2>


  <button
    id="btnAmbil"
    onclick="ambilDatabase()"
  >

    🔄 AMBIL DATA REGISTER

  </button>


  <!-- ===================================================
       PENGATURAN UKURAN
       =================================================== -->

  <div class="pengaturan">

    <div class="kotak">

      <label>
        Lebar Barcode (cm)
      </label>

      <input
        type="number"
        id="lebar"
        value="5"
        min="1"
        step="0.1"
        onchange="updateTampilan()"
      >

    </div>


    <div class="kotak">

      <label>
        Tinggi Barcode (cm)
      </label>

      <input
        type="number"
        id="tinggi"
        value="2"
        min="1"
        step="0.1"
        onchange="updateTampilan()"
      >

    </div>


    <div class="kotak">

      <label>
        Jarak Horizontal (cm)
      </label>

      <input
        type="number"
        id="jarakH"
        value="0.5"
        min="0"
        step="0.1"
        onchange="updateTampilan()"
      >

    </div>


    <div class="kotak">

      <label>
        Jarak Vertikal (cm)
      </label>

      <input
        type="number"
        id="jarakV"
        value="0.5"
        min="0"
        step="0.1"
        onchange="updateTampilan()"
      >

    </div>

  </div>


  <!-- ===================================================
       FILTER
       =================================================== -->

  <div class="filterArea">

    <input
      type="text"
      id="filterRegister"
      placeholder="🔎 Filter Register..."
      oninput="filterBarcode()"
    >


    <input
      type="text"
      id="filterTumpuk"
      placeholder="🔎 Filter Tumpuk..."
      oninput="filterBarcode()"
    >

  </div>


  <!-- ===================================================
       TOMBOL
       =================================================== -->

  <div class="tombolArea">

    <button
      id="btnPilihSemua"
      onclick="pilihSemua()"
    >

      ☑️ PILIH SEMUA

    </button>


    <button
      id="btnBatal"
      onclick="batalSemua()"
    >

      ❌ BATALKAN SEMUA

    </button>


    <button
      id="btnPrint"
      onclick="cetakBarcode()"
    >

      🖨️ CETAK BARCODE TERPILIH

    </button>

  </div>


  <!-- ===================================================
       STATUS
       =================================================== -->

  <div id="status">

    Tekan "Ambil Data Register"

  </div>


  <div id="jumlah">

    Jumlah barcode: 0

  </div>


  <div id="jumlahDipilih">

    Dipilih: 0

  </div>

</div>


<!-- =====================================================
     HASIL
     ===================================================== -->

<div id="hasil">

  <div
    id="grid"
    class="grid"
  ></div>

</div>


<script>


// ======================================================
// URL APPS SCRIPT
// ======================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


// ======================================================
// AMBIL DATABASE
// ======================================================

function ambilDatabase() {


  const status =
    document.getElementById(
      "status"
    );


  const grid =
    document.getElementById(
      "grid"
    );


  status.innerHTML =
    "⏳ Mengambil data DATABASE...";


  grid.innerHTML =
    "";


  const callbackName =
    "database_" +
    Date.now();


  window[callbackName] =
    function(hasil) {


      if (
        !hasil ||
        hasil.status !== "success"
      ) {

        status.innerHTML =
          "❌ Gagal mengambil DATABASE";

        cleanup();

        return;

      }


      const data =
        hasil.data || [];


      if (
        !Array.isArray(data)
      ) {

        status.innerHTML =
          "❌ Format DATABASE tidak sesuai";

        cleanup();

        return;

      }


      if (
        data.length === 0
      ) {

        status.innerHTML =
          "⚠️ DATABASE kosong";

        cleanup();

        return;

      }


      let jumlah =
        0;


      // =================================================
      // BUAT BARCODE
      // =================================================

      for (
        let i = 0;
        i < data.length;
        i++
      ) {


        const item =
          data[i];


        const register =
          String(
            item.register || ""
          ).trim();


        const tumpuk =
          String(
            item.tumpuk || ""
          ).trim();


        if (
          !register
        ) {

          continue;

        }


        buatBarcode(

          register,

          tumpuk

        );


        jumlah++;

      }


      document.getElementById(
        "jumlah"
      ).innerHTML =
        "Jumlah barcode: " +
        jumlah;


      updateJumlahDipilih();


      status.innerHTML =
        "✅ Semua barcode berhasil dibuat";


      cleanup();

    };


  // ====================================================
  // JSONP
  // ====================================================

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?getDatabase=1" +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      status.innerHTML =
        "❌ Gagal menghubungi DATABASE";


      cleanup();

    };


  document.body.appendChild(
    script
  );


  function cleanup() {

    delete window[
      callbackName
    ];


    if (
      script
    ) {

      script.remove();

    }

  }

}


// ======================================================
// BUAT BARCODE
// ======================================================

function buatBarcode(

  register,

  tumpuk

) {


  const grid =
    document.getElementById(
      "grid"
    );


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "barcodeItem dipilih";


  // ====================================================
  // CHECKBOX
  // ====================================================

  const check =
    document.createElement(
      "input"
    );


  check.type =
    "checkbox";


  check.className =
    "check";


  check.checked =
    true;


  check.dataset.register =
    register;


  check.addEventListener(
    "change",
    function() {

      if (
        this.checked
      ) {

        item.classList.add(
          "dipilih"
        );

        item.classList.remove(
          "tidakDipilih"
        );

      } else {

        item.classList.remove(
          "dipilih"
        );

        item.classList.add(
          "tidakDipilih"
        );

      }


      updateJumlahDipilih();

    }
  );


  item.appendChild(
    check
  );


  // ====================================================
  // SVG
  // ====================================================

  const svg =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "svg"

    );


  // ====================================================
  // INFO
  // ====================================================

  const info =
    document.createElement(
      "div"
    );


  info.className =
    "info";


  const nomor =
    document.createElement(
      "span"
    );


  nomor.className =
    "register";


  nomor.textContent =
    register;


  const angkaTumpuk =
    document.createElement(
      "span"
    );


  angkaTumpuk.className =
    "tumpuk";


  angkaTumpuk.textContent =
    tumpuk;


  info.appendChild(
    nomor
  );


  info.appendChild(
    angkaTumpuk
  );


  item.appendChild(
    svg
  );


  item.appendChild(
    info
  );


  grid.appendChild(
    item
  );


  // ====================================================
  // CODE 128
  // ====================================================

  JsBarcode(

    svg,

    register,

    {

      format:
        "CODE128",

      width:
        2,

      height:
        55,

      displayValue:
        false,

      margin:
        3

    }

  );

}


// ======================================================
// PILIH SEMUA
// ======================================================

function pilihSemua() {


  const items =
    document.querySelectorAll(
      ".barcodeItem"
    );


  items.forEach(
    function(item) {


      if (
        item.style.display ===
        "none"
      ) {

        return;

      }


      const check =
        item.querySelector(
          ".check"
        );


      check.checked =
        true;


      item.classList.add(
        "dipilih"
      );


      item.classList.remove(
        "tidakDipilih"
      );

    }
  );


  updateJumlahDipilih();

}


// ======================================================
// BATAL SEMUA
// ======================================================

function batalSemua() {


  const items =
    document.querySelectorAll(
      ".barcodeItem"
    );


  items.forEach(
    function(item) {


      const check =
        item.querySelector(
          ".check"
        );


      check.checked =
        false;


      item.classList.remove(
        "dipilih"
      );


      item.classList.add(
        "tidakDipilih"
      );

    }
  );


  updateJumlahDipilih();

}


// ======================================================
// JUMLAH DIPILIH
// ======================================================

function updateJumlahDipilih() {


  const checks =
    document.querySelectorAll(
      ".barcodeItem .check:checked"
    );


  document.getElementById(
    "jumlahDipilih"
  ).innerHTML =
    "Dipilih: " +
    checks.length;

}


// ======================================================
// FILTER
// ======================================================

function filterBarcode() {


  const register =
    document.getElementById(
      "filterRegister"
    ).value
      .toLowerCase()
      .trim();


  const tumpuk =
    document.getElementById(
      "filterTumpuk"
    ).value
      .toLowerCase()
      .trim();


  const items =
    document.querySelectorAll(
      ".barcodeItem"
    );


  items.forEach(
    function(item) {


      const nomor =
        item.querySelector(
          ".register"
        ).textContent
          .toLowerCase();


      const tumpukData =
        item.querySelector(
          ".tumpuk"
        ).textContent
          .toLowerCase();


      const cocokRegister =
        nomor.includes(
          register
        );


      const cocokTumpuk =
        tumpukData.includes(
          tumpuk
        );


      if (
        cocokRegister &&
        cocokTumpuk
      ) {

        item.style.display =
          "";

      } else {

        item.style.display =
          "none";

      }

    }
  );

}


// ======================================================
// UPDATE TAMPILAN
// ======================================================

function updateTampilan() {


  const lebar =
    parseFloat(
      document.getElementById(
        "lebar"
      ).value
    ) || 5;


  const tinggi =
    parseFloat(
      document.getElementById(
        "tinggi"
      ).value
    ) || 2;


  const jarakH =
    parseFloat(
      document.getElementById(
        "jarakH"
      ).value
    ) || 0;


  const jarakV =
    parseFloat(
      document.getElementById(
        "jarakV"
      ).value
    ) || 0;


  const grid =
    document.getElementById(
      "grid"
    );


  // ====================================================
  // JUMLAH KOLOM TAMPILAN LAYAR
  // ====================================================

  const lebarLayar =
    1000;


  let kolom =
    Math.floor(
      lebarLayar /
      (lebar + jarakH)
    );


  if (
    kolom < 1
  ) {

    kolom = 1;

  }


  grid.style.gridTemplateColumns =
    "repeat(" +
    kolom +
    ", " +
    lebar +
    "cm)";


  grid.style.columnGap =
    jarakH +
    "cm";


  grid.style.rowGap =
    jarakV +
    "cm";


  // ====================================================
  // CSS VARIABLE UNTUK CETAK
  // ====================================================

  document.documentElement.style
    .setProperty(
      "--barcode-width",
      lebar + "cm"
    );


  document.documentElement.style
    .setProperty(
      "--barcode-height",
      tinggi + "cm"
    );


  document.documentElement.style
    .setProperty(
      "--jarak-h",
      jarakH + "cm"
    );


  document.documentElement.style
    .setProperty(
      "--jarak-v",
      jarakV + "cm"
    );


  document.documentElement.style
    .setProperty(
      "--kolom",
      kolom
    );

}


// ======================================================
// CETAK
// ======================================================

function cetakBarcode() {


  const dipilih =
    document.querySelectorAll(
      ".barcodeItem.dipilih"
    );


  if (
    dipilih.length === 0
  ) {

    alert(
      "Belum ada barcode yang dipilih."
    );

    return;

  }


  updateTampilan();


  window.print();

}


// ======================================================
// JALANKAN AWAL
// ======================================================

updateTampilan();


</script>


</body>

</html>
