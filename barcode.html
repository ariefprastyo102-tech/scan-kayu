```html
<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Cetak Barcode Kayu</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  font-family: Arial, sans-serif;

  margin: 0;

  padding: 20px;

  background: #f5f5f5;

}


/* ==========================================
   KONTROL
   ========================================== */

.kontrol {

  max-width: 700px;

  margin: 0 auto 20px;

  background: white;

  padding: 20px;

  border-radius: 10px;

}


h2 {

  text-align: center;

  margin: 0 0 15px;

}


button {

  width: 100%;

  padding: 14px;

  margin-top: 10px;

  border: none;

  border-radius: 8px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}


#btnAmbil {

  background: #1976d2;

  color: white;

}


#btnPrint {

  background: #388e3c;

  color: white;

}


#status {

  text-align: center;

  margin-top: 15px;

  font-weight: bold;

}


#jumlah {

  text-align: center;

  margin-top: 8px;

}


/* ==========================================
   HASIL BARCODE
   ========================================== */

#hasil {

  max-width: 900px;

  margin: auto;

}


.grid {

  display: grid;

  grid-template-columns: repeat(3, 1fr);

  gap: 8px;

}


/* ==========================================
   SATU BARCODE
   ========================================== */

.barcodeItem {

  background: white;

  border: 1px solid #ccc;

  padding: 5px;

  text-align: center;

  page-break-inside: avoid;

}


/* ==========================================
   BARCODE
   ========================================== */

.barcodeItem svg {

  width: 100%;

  max-width: 250px;

  height: 60px;

  display: block;

  margin: auto;

}


/* ==========================================
   REGISTER + TUMPUK
   ========================================== */

.info {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 15px;

  margin-top: 2px;

  font-size: 15px;

  font-weight: bold;

}


/* REGISTER */

.register {

  text-align: right;

}


/* TUMPUK */

.tumpuk {

  text-align: left;

}


/* ==========================================
   MODE CETAK
   ========================================== */

@media print {

  @page {

    size: A4;

    margin: 8mm;

  }


  body {

    background: white;

    padding: 0;

  }


  .kontrol {

    display: none;

  }


  #hasil {

    width: 100%;

    max-width: none;

  }


  .grid {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 5px;

  }


  .barcodeItem {

    border: 1px solid #000;

    padding: 3px;

    break-inside: avoid;

    page-break-inside: avoid;

  }


  .barcodeItem svg {

    width: 100%;

    height: 55px;

  }


  .info {

    font-size: 13px;

    gap: 10px;

    margin-top: 1px;

  }

}


/* ==========================================
   TAMPILAN HP
   ========================================== */

@media screen and (max-width: 600px) {

  .grid {

    grid-template-columns: repeat(2, 1fr);

  }

}

</style>

</head>


<body>


<!-- ========================================
     KONTROL
     ======================================== -->

<div class="kontrol">

  <h2>
    🖨️ CETAK BARCODE KAYU
  </h2>


  <button
    id="btnAmbil"
    onclick="ambilDatabase()"
  >

    🔄 AMBIL DATA REGISTER

  </button>


  <button
    id="btnPrint"
    onclick="window.print()"
  >

    🖨️ CETAK BARCODE

  </button>


  <div id="status">

    Tekan "Ambil Data Register"

  </div>


  <div id="jumlah">

    Jumlah barcode: 0

  </div>

</div>


<!-- ========================================
     HASIL
     ======================================== -->

<div id="hasil">

  <div
    id="grid"
    class="grid"
  ></div>

</div>


<script>


// ==========================================
// URL APPS SCRIPT
// ==========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


// ==========================================
// AMBIL DATABASE
// ==========================================

function ambilDatabase() {

  const status =
    document.getElementById(
      "status"
    );

  const grid =
    document.getElementById(
      "grid"
    );


  status.innerHTML =
    "⏳ Mengambil data DATABASE...";


  grid.innerHTML =
    "";


  const callbackName =
    "database_" +
    Date.now();


  window[callbackName] =
    function(hasil) {


      // ====================================
      // CEK HASIL
      // ====================================

      if (
        !hasil ||
        hasil.status !== "success"
      ) {

        status.innerHTML =
          "❌ Gagal mengambil DATABASE";

        cleanup();

        return;

      }


      const data =
        hasil.data || [];


      if (
        !Array.isArray(data)
      ) {

        status.innerHTML =
          "❌ Format DATABASE tidak sesuai";

        cleanup();

        return;

      }


      if (
        data.length === 0
      ) {

        status.innerHTML =
          "⚠️ DATABASE kosong";

        cleanup();

        return;

      }


      let jumlah =
        0;


      // ====================================
      // BUAT BARCODE
      // ====================================

      for (
        let i = 0;
        i < data.length;
        i++
      ) {


        const item =
          data[i];


        // ==================================
        // REGISTER
        // ==================================

        const register =
          String(
            item.register || ""
          ).trim();


        // ==================================
        // TUMPUK
        // ==================================

        const tumpuk =
          String(
            item.tumpuk || ""
          ).trim();


        // ==================================
        // LEWATI JIKA REGISTER KOSONG
        // ==================================

        if (
          !register
        ) {

          continue;

        }


        // ==================================
        // BUAT
        // ==================================

        buatBarcode(

          register,

          tumpuk

        );


        jumlah++;

      }


      // ====================================
      // JUMLAH
      // ====================================

      document.getElementById(
        "jumlah"
      ).innerHTML =
        "Jumlah barcode: " +
        jumlah;


      status.innerHTML =
        "✅ Semua barcode berhasil dibuat";


      cleanup();

    };


  // ========================================
  // BUAT SCRIPT JSONP
  // ========================================

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?getDatabase=1" +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      status.innerHTML =
        "❌ Gagal menghubungi DATABASE";


      cleanup();

    };


  document.body.appendChild(
    script
  );


  // ========================================
  // CLEANUP
  // ========================================

  function cleanup() {

    delete window[
      callbackName
    ];


    if (
      script
    ) {

      script.remove();

    }

  }

}


// ==========================================
// BUAT BARCODE
// ==========================================

function buatBarcode(

  register,

  tumpuk

) {


  const grid =
    document.getElementById(
      "grid"
    );


  // ========================================
  // CONTAINER
  // ========================================

  const item =
    document.createElement(
      "div"
    );


  item.className =
    "barcodeItem";


  // ========================================
  // SVG
  // ========================================

  const svg =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "svg"

    );


  // ========================================
  // BARIS REGISTER + TUMPUK
  // ========================================

  const info =
    document.createElement(
      "div"
    );


  info.className =
    "info";


  // ========================================
  // NOMOR REGISTER
  // ========================================

  const nomor =
    document.createElement(
      "span"
    );


  nomor.className =
    "register";


  nomor.textContent =
    register;


  // ========================================
  // NOMOR TUMPUK
  // ========================================

  const angkaTumpuk =
    document.createElement(
      "span"
    );


  angkaTumpuk.className =
    "tumpuk";


  angkaTumpuk.textContent =
    tumpuk;


  // ========================================
  // GABUNG
  // ========================================

  info.appendChild(
    nomor
  );


  info.appendChild(
    angkaTumpuk
  );


  item.appendChild(
    svg
  );


  item.appendChild(
    info
  );


  grid.appendChild(
    item
  );


  // ========================================
  // GENERATE CODE 128
  // ========================================

  JsBarcode(

    svg,

    register,

    {

      format:
        "CODE128",

      width:
        2,

      height:
        55,

      displayValue:
        false,

      margin:
        3

    }

  );

}


</script>


</body>

</html>
```
