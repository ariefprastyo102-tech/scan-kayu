<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Barcode Kayu</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}


/* =====================================================
   PANEL
===================================================== */

.kontrol{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
}


h2{
    text-align:center;
    margin-top:0;
}


/* =====================================================
   BUTTON
===================================================== */

button{
    border:none;
    border-radius:7px;
    padding:11px 15px;
    margin:4px;
    font-weight:bold;
    cursor:pointer;
}


.btnAmbil{
    width:100%;
    background:#1976d2;
    color:white;
}


.btnFilter{
    background:#1976d2;
    color:white;
}


.btnSemua{
    background:#607d8b;
    color:white;
}


.btnPilih{
    background:#388e3c;
    color:white;
}


.btnBatal{
    background:#d32f2f;
    color:white;
}


.btnDownload{
    width:100%;
    margin-top:15px;
    background:#6a1b9a;
    color:white;
}


/* =====================================================
   FILTER
===================================================== */

.filter{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}


.filter input{
    width:100%;
    padding:11px;
    border:1px solid #aaa;
    border-radius:7px;
    font-size:15px;
}


/* =====================================================
   STATUS
===================================================== */

.status{
    margin-top:15px;
    padding:12px;
    background:#f5f5f5;
    border-radius:7px;
    text-align:center;
    line-height:1.8;
}


/* =====================================================
   PREVIEW
===================================================== */

#grid{
    max-width:1100px;
    margin:20px auto;
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:10px;
}


.item{
    background:white;
    border:1px solid #aaa;
    padding:7px;
    text-align:center;
    position:relative;
}


.item.hide{
    display:none;
}


.item input{
    position:absolute;
    top:5px;
    left:5px;
    width:18px;
    height:18px;
}


.item svg{
    width:100%;
    height:70px;
    margin-top:15px;
}


.info{
    display:flex;
    justify-content:center;
    gap:15px;
    font-weight:bold;
    font-size:14px;
}


@media(max-width:700px){

    .filter{
        grid-template-columns:1fr;
    }

    #grid{
        grid-template-columns:
            repeat(2,1fr);
    }

}

</style>

</head>


<body>


<div class="kontrol">

<h2>
🪵 CETAK BARCODE KAYU
</h2>


<button
    class="btnAmbil"
    onclick="ambilDatabase()">

🔄 AMBIL DATA REGISTER

</button>


<div class="filter">

<input
    id="filterRegister"
    type="text"
    placeholder="Cari nomor register">


<input
    id="filterTumpuk"
    type="text"
    placeholder="Nomor tumpuk, contoh: 1">

</div>


<div>

<button
    class="btnFilter"
    onclick="filterData()">

🔎 FILTER

</button>


<button
    class="btnSemua"
    onclick="tampilkanSemua()">

🔄 TAMPILKAN SEMUA

</button>


<button
    class="btnPilih"
    onclick="pilihHasilFilter()">

☑️ PILIH HASIL FILTER

</button>


<button
    class="btnBatal"
    onclick="batalHasilFilter()">

❌ BATAL HASIL FILTER

</button>


<button
    class="btnPilih"
    onclick="pilihSemua()">

☑️ PILIH SEMUA

</button>


<button
    class="btnBatal"
    onclick="batalSemua()">

❌ BATAL SEMUA

</button>

</div>


<button
    class="btnDownload"
    onclick="downloadSVG()">

📥 DOWNLOAD MASTER SVG

</button>


<div class="status">

<div id="status">
Belum mengambil database
</div>

<div id="jumlah">
Jumlah barcode: 0
</div>

<div id="dipilih">
Dipilih: 0
</div>

</div>

</div>


<div id="grid"></div>


<script>


/* =====================================================
   API DATABASE
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


/* =====================================================
   DATABASE
===================================================== */

let database=[];


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    const status =
        document.getElementById("status");

    status.innerHTML =
        "⏳ Mengambil DATABASE...";


    const callback =
        "database_"+Date.now();


    window[callback] =
        function(hasil){

            if(
                !hasil ||
                hasil.status !== "success"
            ){

                status.innerHTML =
                    "❌ Gagal mengambil DATABASE";

                bersihkan();

                return;
            }


            database=[];


            const data =
                hasil.data || [];


            data.forEach(function(item){

                const register =
                    String(
                        item.register || ""
                    ).trim();


                const tumpuk =
                    String(
                        item.tumpuk || ""
                    ).trim();


                if(!register){

                    return;

                }


                database.push({

                    register:register,

                    tumpuk:tumpuk,

                    dipilih:true

                });

            });


            tampilkan();


            updateJumlah();


            status.innerHTML =
                "✅ DATABASE berhasil diambil";


            bersihkan();

        };


    const script =
        document.createElement("script");


    script.src =
        API_URL +
        "?getDatabase=1" +
        "&callback=" +
        callback;


    script.onerror =
        function(){

            status.innerHTML =
                "❌ Gagal menghubungi DATABASE";

            bersihkan();

        };


    document.body.appendChild(
        script
    );


    function bersihkan(){

        delete window[
            callback
        ];


        if(script){

            script.remove();

        }

    }

}


/* =====================================================
   TAMPILKAN PREVIEW
===================================================== */

function tampilkan(){

    const grid =
        document.getElementById(
            "grid"
        );


    grid.innerHTML="";


    database.forEach(
        function(data,index){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item";


            item.dataset.index =
                index;


            item.dataset.register =
                data.register
                    .toLowerCase();


            item.dataset.tumpuk =
                data.tumpuk
                    .toLowerCase();


            /* CHECKBOX */

            const check =
                document.createElement(
                    "input"
                );


            check.type =
                "checkbox";


            check.checked =
                data.dipilih;


            check.onchange =
                function(){

                    data.dipilih =
                        this.checked;


                    updateJumlah();

                };


            item.appendChild(
                check
            );


            /* BARCODE */

            const svg =
                document.createElementNS(

                    "http://www.w3.org/2000/svg",

                    "svg"

                );


            item.appendChild(
                svg
            );


            JsBarcode(

                svg,

                data.register,

                {

                    format:
                        "CODE128",

                    width:
                        2,

                    height:
                        55,

                    displayValue:
                        false,

                    margin:
                        3

                }

            );


            /* INFO */

            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "info";


            const register =
                document.createElement(
                    "span"
                );


            register.textContent =
                data.register;


            const tumpuk =
                document.createElement(
                    "span"
                );


            tumpuk.textContent =
                data.tumpuk;


            info.appendChild(
                register
            );


            info.appendChild(
                tumpuk
            );


            item.appendChild(
                info
            );


            grid.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   FILTER
===================================================== */

function filterData(){

    const register =
        document
        .getElementById(
            "filterRegister"
        )
        .value
        .trim()
        .toLowerCase();


    const tumpuk =
        document
        .getElementById(
            "filterTumpuk"
        )
        .value
        .trim()
        .toLowerCase();


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        const nilaiRegister =
            item.dataset.register;


        const nilaiTumpuk =
            item.dataset.tumpuk;


        /*
         * REGISTER
         *
         * Bisa mencari sebagian.
         */

        const cocokRegister =
            register === "" ||
            nilaiRegister.includes(
                register
            );


        /*
         * TUMPUK
         *
         * HARUS SAMA PERSIS.
         *
         * Contoh:
         *
         * Input 1
         *
         * 1  = masuk
         * 11 = tidak
         * 12 = tidak
         * 13 = tidak
         */

        const cocokTumpuk =
            tumpuk === "" ||
            nilaiTumpuk === tumpuk;


        if(
            cocokRegister &&
            cocokTumpuk
        ){

            item.classList.remove(
                "hide"
            );

        }else{

            item.classList.add(
                "hide"
            );

        }

    });

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterRegister"
    ).value="";


    document.getElementById(
        "filterTumpuk"
    ).value="";


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.classList.remove(
            "hide"
        );

    });

}


/* =====================================================
   PILIH HASIL FILTER
===================================================== */

function pilihHasilFilter(){

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        if(
            item.classList.contains(
                "hide"
            )
        ){

            return;

        }


        const index =
            Number(
                item.dataset.index
            );


        database[index]
            .dipilih=true;


        item.querySelector(
            "input"
        ).checked=true;

    });


    updateJumlah();

}


/* =====================================================
   BATAL HASIL FILTER
===================================================== */

function batalHasilFilter(){

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        if(
            item.classList.contains(
                "hide"
            )
        ){

            return;

        }


        const index =
            Number(
                item.dataset.index
            );


        database[index]
            .dipilih=false;


        item.querySelector(
            "input"
        ).checked=false;

    });


    updateJumlah();

}


/* =====================================================
   PILIH SEMUA
===================================================== */

function pilihSemua(){

    database.forEach(
        function(data){

            data.dipilih=true;

        }
    );


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.querySelector(
            "input"
        ).checked=true;

    });


    updateJumlah();

}


/* =====================================================
   BATAL SEMUA
===================================================== */

function batalSemua(){

    database.forEach(
        function(data){

            data.dipilih=false;

        }
    );


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.querySelector(
            "input"
        ).checked=false;

    });


    updateJumlah();

}


/* =====================================================
   UPDATE JUMLAH
===================================================== */

function updateJumlah(){

    const jumlah =
        database.length;


    const dipilih =
        database.filter(
            function(data){

                return data.dipilih;

            }
        ).length;


    document.getElementById(
        "jumlah"
    ).innerHTML =
        "Jumlah barcode: " +
        jumlah;


    document.getElementById(
        "dipilih"
    ).innerHTML =
        "Dipilih: " +
        dipilih;

}


/* =====================================================
   DOWNLOAD MASTER SVG
===================================================== */

function downloadSVG(){

    const daftar =
        database.filter(
            function(data){

                return data.dipilih;

            }
        );


    if(
        daftar.length === 0
    ){

        alert(
            "Belum ada barcode yang dipilih."
        );

        return;

    }


    /*
    =====================================================
    UKURAN LABEL
    =====================================================

    5 x 2,5 CM

    Dalam SVG kita gunakan satuan mm.

    5 cm   = 50 mm
    2,5 cm = 25 mm
    */

    const LABEL_W =
        50;


    const LABEL_H =
        25;


    /*
    =====================================================
    JARAK ANTAR LABEL
    =====================================================
    */

    const GAP =
        2;


    /*
    =====================================================
    MARGIN MASTER
    =====================================================
    */

    const MARGIN =
        20;


    /*
    =====================================================
    JUMLAH KOLOM
    =====================================================

    4 barcode per baris.
    */

    const COL =
        4;


    /*
    =====================================================
    JUMLAH BARIS
    =====================================================
    */

    const ROW =
        Math.ceil(
            daftar.length / COL
        );


    /*
    =====================================================
    UKURAN KANVAS
    =====================================================
    */

    const CANVAS_W =
        MARGIN * 2 +
        (
            COL *
            LABEL_W
        ) +
        (
            (COL - 1) *
            GAP
        );


    const CANVAS_H =
        MARGIN * 2 +
        (
            ROW *
            LABEL_H
        ) +
        (
            (ROW - 1) *
            GAP
        );


    /*
    =====================================================
    BUAT SVG UTAMA
    =====================================================
    */

    const NS =
        "http://www.w3.org/2000/svg";


    const root =
        document.createElementNS(
            NS,
            "svg"
        );


    root.setAttribute(
        "xmlns",
        NS
    );


    root.setAttribute(
        "width",
        CANVAS_W + "mm"
    );


    root.setAttribute(
        "height",
        CANVAS_H + "mm"
    );


    root.setAttribute(
        "viewBox",
        `0 0 ${CANVAS_W} ${CANVAS_H}`
    );


    /*
    =====================================================
    BACKGROUND
    =====================================================
    */

    const background =
        document.createElementNS(
            NS,
            "rect"
        );


    background.setAttribute(
        "x",
        0
    );


    background.setAttribute(
        "y",
        0
    );


    background.setAttribute(
        "width",
        CANVAS_W
    );


    background.setAttribute(
        "height",
        CANVAS_H
    );


    background.setAttribute(
        "fill",
        "white"
    );


    root.appendChild(
        background
    );


    /*
    =====================================================
    BUAT LABEL SATU PER SATU
    =====================================================
    */

    daftar.forEach(
        function(data,index){

            const col =
                index % COL;


            const row =
                Math.floor(
                    index / COL
                );


            /*
            POSISI LABEL
            */

            const labelX =
                MARGIN +
                col *
                (
                    LABEL_W +
                    GAP
                );


            const labelY =
                MARGIN +
                row *
                (
                    LABEL_H +
                    GAP
                );


            /*
            GROUP
            */

            const group =
                document.createElementNS(
                    NS,
                    "g"
                );


            group.setAttribute(
                "transform",
                `translate(${labelX},${labelY})`
            );


            /*
            =================================================
            KOTAK LABEL 50 x 25 mm
            =================================================
            */

            const box =
                document.createElementNS(
                    NS,
                    "rect"
                );


            box.setAttribute(
                "x",
                0
            );


            box.setAttribute(
                "y",
                0
            );


            box.setAttribute(
                "width",
                LABEL_W
            );


            box.setAttribute(
                "height",
                LABEL_H
            );


            box.setAttribute(
                "fill",
                "white"
            );


            box.setAttribute(
                "stroke",
                "black"
            );


            box.setAttribute(
                "stroke-width",
                "0.25"
            );


            group.appendChild(
                box
            );


            /*
            =================================================
            AREA BARCODE
            =================================================

            Barcode sekarang dibuat
            benar-benar di tengah.

            Batas area:

            kiri  = 5 mm
            kanan = 5 mm

            atas  = 2 mm
            */

            const barcodeX =
                5;


            const barcodeY =
                2;


            const barcodeW =
                40;


            const barcodeH =
                13;


            /*
            =================================================
            BARCODE SVG
            =================================================
            */

            const barcode =
                document.createElementNS(
                    NS,
                    "svg"
                );


            barcode.setAttribute(
                "x",
                barcodeX
            );


            barcode.setAttribute(
                "y",
                barcodeY
            );


            barcode.setAttribute(
                "width",
                barcodeW
            );


            barcode.setAttribute(
                "height",
                barcodeH
            );


            /*
            viewBox barcode
            */

            barcode.setAttribute(
                "viewBox",
                "0 0 400 130"
            );


            /*
            Generate barcode
            */

            JsBarcode(
                barcode,
                data.register,
                {

                    format:
                        "CODE128",

                    width:
                        2,

                    height:
                        100,

                    displayValue:
                        false,

                    margin:
                        0

                }
            );


            group.appendChild(
                barcode
            );


            /*
            =================================================
            REGISTER
            =================================================
            */

            const register =
                document.createElementNS(
                    NS,
                    "text"
                );


            register.setAttribute(
                "x",
                LABEL_W / 2
            );


            register.setAttribute(
                "y",
                20
            );


            register.setAttribute(
                "text-anchor",
                "middle"
            );


            register.setAttribute(
                "font-family",
                "Arial"
            );


            register.setAttribute(
                "font-size",
                "3.5"
            );


            register.setAttribute(
                "font-weight",
                "bold"
            );


            register.textContent =
                data.register;


            group.appendChild(
                register
            );


            /*
            =================================================
            TUMPUK
            =================================================
            */

            const tumpuk =
                document.createElementNS(
                    NS,
                    "text"
                );


            tumpuk.setAttribute(
                "x",
                LABEL_W / 2
            );


            tumpuk.setAttribute(
                "y",
                24
            );


            tumpuk.setAttribute(
                "text-anchor",
                "middle"
            );


            tumpuk.setAttribute(
                "font-family",
                "Arial"
            );


            tumpuk.setAttribute(
                "font-size",
                "3"
            );


            tumpuk.textContent =
                data.tumpuk;


            group.appendChild(
                tumpuk
            );


            /*
            =================================================
            MASUKKAN LABEL
            =================================================
            */

            root.appendChild(
                group
            );

        }
    );


    /*
    =====================================================
    SERIALIZE SVG
    =====================================================
    */

    const serializer =
        new XMLSerializer();


    let source =
        serializer.serializeToString(
            root
        );


    source =
        '<?xml version="1.0" encoding="UTF-8"?>\n' +
        source;


    /*
    =====================================================
    DOWNLOAD
    =====================================================
    */

    const blob =
        new Blob(
            [source],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "MASTER-BARCODE-KAYU.svg";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );


    document.getElementById(
        "status"
    ).innerHTML =
        "✅ Master SVG selesai — " +
        daftar.length +
        " barcode";

}

</script>

</body>
</html>
