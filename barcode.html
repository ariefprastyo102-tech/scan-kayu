<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Master Barcode Kayu</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 20px;

  font-family: Arial, sans-serif;

  background: #f3f3f3;

}


/* =====================================================
   KONTROL
   ===================================================== */

.kontrol {

  max-width: 1100px;

  margin: auto;

  background: white;

  padding: 20px;

  border-radius: 12px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.08);

}


h2 {

  text-align: center;

  margin:
    0 0 20px;

}


/* =====================================================
   BUTTON
   ===================================================== */

button {

  border: none;

  border-radius: 8px;

  padding: 12px 15px;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

}


#ambil {

  width: 100%;

  background: #1976d2;

  color: white;

  margin-bottom: 15px;

}


/* =====================================================
   FILTER
   ===================================================== */

.judulFilter {

  font-weight: bold;

  margin-bottom: 8px;

}


.filter {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

}


.filterBox input {

  width: 100%;

  padding: 12px;

  border:
    1px solid #aaa;

  border-radius: 8px;

  font-size: 15px;

}


/* =====================================================
   TOMBOL FILTER
   ===================================================== */

.tombolFilter {

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-top: 10px;

}


.tombolFilter button {

  color: white;

}


.btnFilter {

  background: #1976d2;

}


#semua {

  background: #607d8b;

}


#pilihFilter {

  background: #388e3c;

}


#batalFilter {

  background: #d32f2f;

}


#pilihSemua {

  background: #455a64;

}


#batalSemua {

  background: #757575;

}


#downloadPilihan {

  background: #ef6c00;

}


#downloadSemua {

  background: #6a1b9a;

}


/* =====================================================
   UKURAN
   ===================================================== */

.ukuran {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin-top: 15px;

}


.kotak {

  background: #f7f7f7;

  border:
    1px solid #ddd;

  padding: 10px;

  border-radius: 8px;

}


.kotak label {

  display: block;

  font-size: 13px;

  font-weight: bold;

  margin-bottom: 5px;

}


.kotak input {

  width: 100%;

  padding: 9px;

  border:
    1px solid #bbb;

  border-radius: 6px;

  font-size: 15px;

}


/* =====================================================
   JUMLAH KOLOM
   ===================================================== */

.kolomBox {

  margin-top: 10px;

}


.kolomBox label {

  display: block;

  font-size: 13px;

  font-weight: bold;

  margin-bottom: 5px;

}


.kolomBox input {

  width: 100%;

  padding: 9px;

  border:
    1px solid #bbb;

  border-radius: 6px;

  font-size: 15px;

}


/* =====================================================
   STATUS
   ===================================================== */

.statusBox {

  margin-top: 15px;

  padding: 12px;

  background: #f7f7f7;

  border-radius: 8px;

  text-align: center;

}


#status {

  font-weight: bold;

}


#jumlah {

  margin-top: 5px;

}


#hasilFilter {

  margin-top: 5px;

}


#dipilih {

  margin-top: 5px;

  font-weight: bold;

}


/* =====================================================
   INFO
   ===================================================== */

.masterInfo {

  margin-top: 15px;

  padding: 12px;

  background: #e8f5e9;

  border:
    1px solid #81c784;

  border-radius: 8px;

  text-align: center;

  line-height: 1.6;

  font-size: 14px;

}


/* =====================================================
   PREVIEW
   ===================================================== */

#hasil {

  max-width: 1200px;

  margin:
    20px auto;

}


.grid {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 10px;

}


.item {

  position: relative;

  background: white;

  border:
    1px solid #bbb;

  padding: 5px;

  text-align: center;

}


.item.tidak {

  opacity: .35;

}


.check {

  position: absolute;

  top: 5px;

  left: 5px;

  width: 18px;

  height: 18px;

}


.item svg {

  width: 100%;

  height: 60px;

  display: block;

  margin-top: 18px;

}


.info {

  display: flex;

  justify-content: center;

  gap: 15px;

  font-size: 14px;

  font-weight: bold;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:700px) {

  .grid {

    grid-template-columns:
      repeat(2,1fr);

  }

}


@media(max-width:500px) {

  .filter {

    grid-template-columns:
      1fr;

  }


  .ukuran {

    grid-template-columns:
      1fr;

  }


  .grid {

    grid-template-columns:
      1fr 1fr;

  }

}

</style>

</head>


<body>

<b>5 × 2 cm</b>

<!-- =====================================================
     PREVIEW
     ===================================================== -->

<div id="hasil">

<div
  id="grid"
  class="grid"
></div>

</div>


<script>


/* =====================================================
   API
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


/* =====================================================
   DATA
   ===================================================== */

let dataBarcode = [];


/* =====================================================
   AMBIL DATABASE
   ===================================================== */

function ambilDatabase() {


  const status =
    document.getElementById(
      "status"
    );


  const grid =
    document.getElementById(
      "grid"
    );


  status.innerHTML =
    "⏳ Mengambil DATABASE...";


  grid.innerHTML =
    "";


  dataBarcode = [];


  updateStatus();


  const callbackName =
    "database_" +
    Date.now();


  window[callbackName] =
    function(hasil) {


      if (
        !hasil ||
        hasil.status !== "success"
      ) {

        status.innerHTML =
          "❌ Gagal mengambil DATABASE";

        cleanup();

        return;

      }


      const data =
        hasil.data || [];


      if (
        !Array.isArray(data) ||
        data.length === 0
      ) {

        status.innerHTML =
          "⚠️ DATABASE kosong";

        cleanup();

        return;

      }


      data.forEach(
        function(item) {


          const register =
            String(
              item.register || ""
            ).trim();


          const tumpuk =
            String(
              item.tumpuk || ""
            ).trim();


          if (!register) {

            return;

          }


          dataBarcode.push({

            register:
              register,

            tumpuk:
              tumpuk,

            dipilih:
              true

          });

        }
      );


      tampilkanPreview();


      status.innerHTML =
        "✅ Database berhasil dimuat";


      updateStatus();


      cleanup();

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?getDatabase=1" +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      status.innerHTML =
        "❌ Gagal menghubungi DATABASE";

      cleanup();

    };


  document.body.appendChild(
    script
  );


  function cleanup() {

    delete window[
      callbackName
    ];

    script.remove();

  }

}


/* =====================================================
   TAMPILKAN PREVIEW
   ===================================================== */

function tampilkanPreview() {


  const grid =
    document.getElementById(
      "grid"
    );


  grid.innerHTML =
    "";


  dataBarcode.forEach(

    function(data, index) {


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "item";


      item.dataset.index =
        index;


      item.dataset.register =
        data.register
          .toLowerCase();


      item.dataset.tumpuk =
        data.tumpuk
          .toLowerCase();


      const check =
        document.createElement(
          "input"
        );


      check.type =
        "checkbox";


      check.className =
        "check";


      check.checked =
        data.dipilih;


      check.addEventListener(
        "change",
        function() {

          data.dipilih =
            this.checked;

          item.classList.toggle(
            "tidak",
            !this.checked
          );

          updateStatus();

        }
      );


      item.appendChild(
        check
      );


      const svg =
        document.createElementNS(

          "http://www.w3.org/2000/svg",

          "svg"

        );


      item.appendChild(
        svg
      );


      JsBarcode(

        svg,

        data.register,

        {

          format:
            "CODE128",

          width:
            2,

          height:
            55,

          displayValue:
            false,

          margin:
            3

        }

      );


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "info";


      const register =
        document.createElement(
          "span"
        );


      register.textContent =
        data.register;


      const tumpuk =
        document.createElement(
          "span"
        );


      tumpuk.textContent =
        data.tumpuk;


      info.appendChild(
        register
      );


      info.appendChild(
        tumpuk
      );


      item.appendChild(
        info
      );


      grid.appendChild(
        item
      );

    }

  );


  updateStatus();

}


/* =====================================================
   FILTER
   ===================================================== */

function jalankanFilter() {


  const filterRegister =
    document
      .getElementById(
        "filterRegister"
      )
      .value
      .trim()
      .toLowerCase();


  const filterTumpuk =
    document
      .getElementById(
        "filterTumpuk"
      )
      .value
      .trim()
      .toLowerCase();


  const items =
    document.querySelectorAll(
      ".item"
    );


  let jumlah =
    0;


  items.forEach(

    function(item) {


      const register =
        String(
          item.dataset.register || ""
        )
        .trim()
        .toLowerCase();


      const tumpuk =
        String(
          item.dataset.tumpuk || ""
        )
        .trim()
        .toLowerCase();


      /* ==========================================
         REGISTER
         BOLEH SEBAGIAN
         ========================================== */

      const cocokRegister =
        filterRegister === "" ||
        register.includes(
          filterRegister
        );


      /* ==========================================
         TUMPUK
         HARUS PERSIS
         
         1 = hanya 1
         11 tidak ikut
         12 tidak ikut
         13 tidak ikut
         ========================================== */

      const cocokTumpuk =
        filterTumpuk === "" ||
        tumpuk === filterTumpuk;


      const cocok =
        cocokRegister &&
        cocokTumpuk;


      if (cocok) {

        item.style.display =
          "";

        jumlah++;

      } else {

        item.style.display =
          "none";

      }

    }
  );


  document.getElementById(
    "hasilFilter"
  ).innerHTML =
    "Hasil filter: " +
    jumlah;

}


/* =====================================================
   TAMPILKAN SEMUA
   ===================================================== */

function tampilkanSemua() {


  document.getElementById(
    "filterRegister"
  ).value =
    "";


  document.getElementById(
    "filterTumpuk"
  ).value =
    "";


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {

        item.style.display =
          "";

      }

    );


  document.getElementById(
    "hasilFilter"
  ).innerHTML =
    "Hasil filter: " +
    dataBarcode.length;

}


/* =====================================================
   PILIH HASIL FILTER
   ===================================================== */

function pilihHasilFilter() {


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {


        if (
          item.style.display ===
          "none"
        ) {

          return;

        }


        const index =
          Number(
            item.dataset.index
          );


        dataBarcode[index]
          .dipilih =
          true;


        item
          .querySelector(
            ".check"
          )
          .checked =
          true;


        item.classList.remove(
          "tidak"
        );

      }
    );


  updateStatus();

}


/* =====================================================
   BATAL HASIL FILTER
   ===================================================== */

function batalHasilFilter() {


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {


        if (
          item.style.display ===
          "none"
        ) {

          return;

        }


        const index =
          Number(
            item.dataset.index
          );


        dataBarcode[index]
          .dipilih =
          false;


        item
          .querySelector(
            ".check"
          )
          .checked =
          false;


        item.classList.add(
          "tidak"
        );

      }
    );


  updateStatus();

}


/* =====================================================
   PILIH SEMUA
   ===================================================== */

function pilihSemuaData() {


  dataBarcode.forEach(
    function(data) {

      data.dipilih =
        true;

    }
  );


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {

        item
          .querySelector(
            ".check"
          )
          .checked =
          true;


        item.classList.remove(
          "tidak"
        );

      }
    );


  updateStatus();

}


/* =====================================================
   BATAL SEMUA
   ===================================================== */

function batalSemuaData() {


  dataBarcode.forEach(
    function(data) {

      data.dipilih =
        false;

    }
  );


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {

        item
          .querySelector(
            ".check"
          )
          .checked =
          false;


        item.classList.add(
          "tidak"
        );

      }
    );


  updateStatus();

}


/* =====================================================
   STATUS
   ===================================================== */

function updateStatus() {


  const jumlah =
    dataBarcode.length;


  const dipilih =
    dataBarcode.filter(
      function(data) {

        return data.dipilih;

      }
    ).length;


  document.getElementById(
    "jumlah"
  ).innerHTML =
    "Jumlah database: " +
    jumlah;


  document.getElementById(
    "dipilih"
  ).innerHTML =
    "Dipilih: " +
    dipilih;

}


/* =====================================================
   DATA DIPILIH
   ===================================================== */

function getDipilih() {

  return dataBarcode.filter(

    function(data) {

      return data.dipilih;

    }

  );

}


/* =====================================================
   BUAT SATU LABEL DALAM GROUP
   ===================================================== */

function buatLabelGroup(
  parent,
  register,
  tumpuk,
  x,
  y,
  lebar,
  tinggi
) {


  const group =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "g"
    );


  /*
   * Skala dasar:
   * 1000 x 400
   */


  const scaleX =
    (lebar * 100) /
    1000;


  const scaleY =
    (tinggi * 100) /
    400;


  group.setAttribute(
    "transform",
    "translate(" +
    x +
    "," +
    y +
    ") scale(" +
    scaleX +
    "," +
    scaleY +
    ")"
  );


  /* ==================================================
     BACKGROUND
     ================================================== */

  const bg =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );


  bg.setAttribute(
    "x",
    "0"
  );


  bg.setAttribute(
    "y",
    "0"
  );


  bg.setAttribute(
    "width",
    "1000"
  );


  bg.setAttribute(
    "height",
    "400"
  );


  bg.setAttribute(
    "fill",
    "white"
  );


  group.appendChild(bg);


  /* ==================================================
     GARIS POTONG
     ================================================== */

  const border =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );


  border.setAttribute(
    "x",
    "2"
  );


  border.setAttribute(
    "y",
    "2"
  );


  border.setAttribute(
    "width",
    "996"
  );


  border.setAttribute(
    "height",
    "396"
  );


  border.setAttribute(
    "fill",
    "none"
  );


  border.setAttribute(
    "stroke",
    "black"
  );


  border.setAttribute(
    "stroke-width",
    "2"
  );


  group.appendChild(border);


  /* ==================================================
     BARCODE
     ================================================== */

  const barcodeSVG =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "svg"
    );


  barcodeSVG.setAttribute(
    "x",
    "30"
  );


  barcodeSVG.setAttribute(
    "y",
    "20"
  );


  barcodeSVG.setAttribute(
    "width",
    "940"
  );


  barcodeSVG.setAttribute(
    "height",
    "240"
  );


  barcodeSVG.setAttribute(
    "viewBox",
    "0 0 940 240"
  );


  group.appendChild(
    barcodeSVG
  );


  JsBarcode(

    barcodeSVG,

    register,

    {

      format:
        "CODE128",

      width:
        2,

      height:
        220,

      displayValue:
        false,

      margin:
        0

    }

  );


  /* ==================================================
     REGISTER
     ================================================== */

  const reg =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );


  reg.setAttribute(
    "x",
    "500"
  );


  reg.setAttribute(
    "y",
    "315"
  );


  reg.setAttribute(
    "text-anchor",
    "middle"
  );


  reg.setAttribute(
    "font-family",
    "Arial"
  );


  reg.setAttribute(
    "font-size",
    "50"
  );


  reg.setAttribute(
    "font-weight",
    "bold"
  );


  reg.setAttribute(
    "fill",
    "#000000"
  );


  reg.textContent =
    register;


  group.appendChild(reg);


  /* ==================================================
     TUMPUK
     ================================================== */

  const tup =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );


  tup.setAttribute(
    "x",
    "500"
  );


  tup.setAttribute(
    "y",
    "375"
  );


  tup.setAttribute(
    "text-anchor",
    "middle"
  );


  tup.setAttribute(
    "font-family",
    "Arial"
  );


  tup.setAttribute(
    "font-size",
    "40"
  );


  tup.setAttribute(
    "fill",
    "#000000"
  );


  tup.textContent =
    tumpuk;


  group.appendChild(tup);


  parent.appendChild(
    group
  );

}


/* =====================================================
   BUAT MASTER SVG
   ===================================================== */

function buatMasterSVG(
  daftar
) {


  if (
    daftar.length === 0
  ) {

    return null;

  }


  const lebar =
    parseFloat(
      document.getElementById(
        "lebarBarcode"
      ).value
    );


  const tinggi =
    parseFloat(
      document.getElementById(
        "tinggiBarcode"
      ).value
    );


  let kolom =
    parseInt(
      document.getElementById(
        "jumlahKolom"
      ).value
    );


  if (
    !kolom ||
    kolom < 1
  ) {

    kolom = 5;

  }


  /*
   * Jarak antar barcode
   */

  const jarak =
    0.2;


  const margin =
    0.2;


  /*
   * Jumlah baris otomatis
   */

  const baris =
    Math.ceil(
      daftar.length /
      kolom
    );


  /*
   * Ukuran total dalam cm
   */

  const totalLebar =
    (kolom * lebar) +
    ((kolom - 1) * jarak) +
    (margin * 2);


  const totalTinggi =
    (baris * tinggi) +
    ((baris - 1) * jarak) +
    (margin * 2);


  /*
   * Gunakan satuan cm
   * tetapi viewBox memakai
   * 100 unit per cm.
   */

  const viewLebar =
    totalLebar * 100;


  const viewTinggi =
    totalTinggi * 100;


  /* ==================================================
     SVG MASTER
     ================================================== */

  const master =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "svg"
    );


  master.setAttribute(
    "xmlns",
    "http://www.w3.org/2000/svg"
  );


  master.setAttribute(
    "width",
    totalLebar + "cm"
  );


  master.setAttribute(
    "height",
    totalTinggi + "cm"
  );


  master.setAttribute(
    "viewBox",
    "0 0 " +
    viewLebar +
    " " +
    viewTinggi
  );


  /* ==================================================
     BACKGROUND MASTER
     ================================================== */

  const background =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "rect"
    );


  background.setAttribute(
    "x",
    "0"
  );


  background.setAttribute(
    "y",
    "0"
  );


  background.setAttribute(
    "width",
    viewLebar
  );


  background.setAttribute(
    "height",
    viewTinggi
  );


  background.setAttribute(
    "fill",
    "white"
  );


  master.appendChild(
    background
  );


  /* ==================================================
     MASUKKAN BARCODE
     ================================================== */

  daftar.forEach(

    function(data, index) {


      const col =
        index % kolom;


      const row =
        Math.floor(
          index / kolom
        );


      const x =
        (
          margin +
          col *
          (lebar + jarak)
        ) * 100;


      const y =
        (
          margin +
          row *
          (tinggi + jarak)
        ) * 100;


      buatLabelGroup(

        master,

        data.register,

        data.tumpuk,

        x,

        y,

        lebar,

        tinggi

      );

    }

  );


  return master;

}


/* =====================================================
   DOWNLOAD SEMUA
   ===================================================== */

function downloadSemua() {


  if (
    dataBarcode.length === 0
  ) {

    alert(
      "Belum ada database."
    );

    return;

  }


  const status =
    document.getElementById(
      "status"
    );


  status.innerHTML =
    "⏳ Membuat file semua barcode...";


  /*
   * Beri waktu browser
   * supaya tidak langsung freeze.
   */

  setTimeout(
    function() {


      const svg =
        buatMasterSVG(
          dataBarcode
        );


      if (!svg) {

        status.innerHTML =
          "❌ Gagal membuat file.";

        return;

      }


      downloadFile(

        svg,

        "MASTER-BARCODE-SEMUA.svg"

      );


    },
    100
  );

}

/* =====================================================
   DOWNLOAD FILE SVG
   ===================================================== */

function downloadFile(

  svg,

  nama

) {


  /*
   * XML SERIALIZER
   */

  const serializer =
    new XMLSerializer();


  let source =
    serializer.serializeToString(
      svg
    );


  /*
   * Pastikan namespace SVG benar.
   */

  if (
    !source.includes(
      'xmlns="http://www.w3.org/2000/svg"'
    )
  ) {

    source =
      source.replace(
        "<svg",
        '<svg xmlns="http://www.w3.org/2000/svg"'
      );

  }


  /*
   * Header XML
   */

  source =
    '<?xml version="1.0" encoding="UTF-8"?>\n' +
    source;


  /*
   * Blob
   */

  const blob =
    new Blob(

      [source],

      {
        type:
          "image/svg+xml;charset=utf-8"
      }

    );


  /*
   * Download
   */

  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    nama;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    3000
  );


  document.getElementById(
    "status"
  ).innerHTML =
    "✅ File berhasil dibuat: " +
    nama;

}
