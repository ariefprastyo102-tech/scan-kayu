<style>

   DASAR
   ===================================================== */

  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 20px;

/* =====================================================
   PANEL KONTROL

  max-width: 1100px;

  margin: auto;

  background: white;

}

}

.tombol button {

  padding: 11px 14px;

  font-weight: bold;

  cursor: pointer;

}


.btnFilter {

  background: #1976d2;

}


.btnSemua {

}


.btnPilih {

}


.btnBatal {

  background: #d32f2f;

}


.btnPDF {

}


.btnPDFPilihan {

}


/* =====================================================
   PENGATURAN UKURAN

.pengaturan {

  display: grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap: 10px;

  margin-top: 15px;

}


.kotak {

  padding: 12px;

  background: #f7f7f7;

  border:
    1px solid #ddd;

  border-radius: 8px;

}


.kotak label {

  display: block;

  font-size: 13px;

  font-weight: bold;

  margin-bottom: 6px;

}


.kotak input,
.kotak select {

  width: 100%;

  padding: 9px;

  border:
    1px solid #aaa;

  border-radius: 6px;

  font-size: 15px;

}


/* =====================================================
   STATUS
   ===================================================== */

.status {

  margin-top: 15px;

  padding: 12px;

  text-align: center;

  background: #f7f7f7;

  border-radius: 8px;

  line-height: 1.7;

}


#status {

  font-weight: bold;

}


/* =====================================================
   PREVIEW
   ===================================================== */

#hasil {

  max-width: 1200px;

  margin:
    20px auto;

}


.grid {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 10px;

}


.item {

  position: relative;

  background: white;

  border:
    1px solid #aaa;

  padding: 6px;

}


.item.tidakDipilih {

  opacity: .35;

}


.item input {

  top: 5px;

  width: 18px;

}


.item svg {

  width: 100%;

}


.info {

  display: flex;

  justify-content: center;

  font-weight: bold;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:700px) {

  .filter {

    grid-template-columns:

    grid-template-columns:
      1fr;

  }


  .grid {

      repeat(2, 1fr);

}

</style>

<body>


<!-- =====================================================
     PANEL
     ===================================================== -->

<div class="kontrol">


<h2>

<!-- =====================================================
     AMBIL DATABASE
     ===================================================== -->

<button

>

📦 DOWNLOAD PDF SEMUA

<!-- =====================================================
     STATUS
     ===================================================== -->

<div class="status">


<div id="status">

Belum mengambil database

</div>


<div id="jumlah">

Jumlah database: 0

</div>


<div id="hasilFilter">

Hasil filter: 0

</div>


<div id="jumlahDipilih">

Dipilih: 0

</div>


</div>

<!-- =====================================================
     PREVIEW
     ===================================================== -->

<div id="hasil">

<div
  id="grid"
  class="grid"
></div>

</div>


<script>


/* =====================================================
   URL APPS SCRIPT
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


/* =====================================================
   DATA
   ===================================================== */

let database = [];


/* =====================================================
   AMBIL DATABASE
   ===================================================== */

function ambilDatabase() {


  const status =
    document.getElementById(
      "status"
    );


  const grid =
    document.getElementById(
      "grid"
    );


  status.innerHTML =
    "⏳ Mengambil DATABASE...";


  grid.innerHTML =
    "";


  database = [];


  const callbackName =
    "database_" +
    Date.now();


  window[callbackName] =
    function(hasil) {


      if (
        !hasil ||
        hasil.status !== "success"
      ) {

        status.innerHTML =
          "❌ Gagal mengambil DATABASE";

        bersihkan();

        return;

      }


      const data =
        hasil.data || [];


      if (
        !Array.isArray(data)
      ) {

        status.innerHTML =
          "❌ Format DATABASE tidak sesuai";

        bersihkan();

        return;

      }


      data.forEach(

        function(item) {


          const register =
            String(
              item.register || ""
            ).trim();


          const tumpuk =
            String(
              item.tumpuk || ""
            ).trim();


          if (!register) {

            return;

          }


          database.push({

            register:
              register,

            tumpuk:
              tumpuk,

            dipilih:
              true

          });

        }

      );


      tampilkanPreview();


      status.innerHTML =
        "✅ DATABASE berhasil diambil";


      updateJumlah();


      bersihkan();

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?getDatabase=1" +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      status.innerHTML =
        "❌ Gagal menghubungi DATABASE";

      bersihkan();

    };


  document.body.appendChild(
    script
  );


  function bersihkan() {

    delete window[
      callbackName
    ];

    if (script) {

      script.remove();

    }

  }

}


/* =====================================================
   TAMPILKAN PREVIEW
   ===================================================== */

function tampilkanPreview() {


  const grid =
    document.getElementById(
      "grid"
    );


  grid.innerHTML =
    "";


  database.forEach(

    function(data, index) {


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "item";


      item.dataset.index =
        index;


      item.dataset.register =
        data.register
          .toLowerCase();


      item.dataset.tumpuk =
        data.tumpuk
          .toLowerCase();


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.checked =
        data.dipilih;


      checkbox.addEventListener(

        "change",

        function() {

          data.dipilih =
            this.checked;


          item.classList.toggle(
            "tidakDipilih",
            !this.checked
          );


          updateJumlah();

        }

      );


      item.appendChild(
        checkbox
      );


      const svg =
        document.createElementNS(

          "http://www.w3.org/2000/svg",

          "svg"

        );


      item.appendChild(
        svg
      );


      JsBarcode(

        svg,

        data.register,

        {

          format:
            "CODE128",

          width:
            2,

          height:
            55,

          displayValue:
            false,

          margin:
            3

        }

      );


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "info";


      const reg =
        document.createElement(
          "span"
        );


      reg.textContent =
        data.register;


      const tup =
        document.createElement(
          "span"
        );


      tup.textContent =
        data.tumpuk;


      info.appendChild(
        reg
      );


      info.appendChild(
        tup
      );


      item.appendChild(
        info
      );


      grid.appendChild(
        item
      );

    }

  );


  updateJumlah();

}


/* =====================================================
   FILTER
   ===================================================== */

function filterData() {


  const register =
    document
      .getElementById(
        "filterRegister"
      )
      .value
      .trim()
      .toLowerCase();


  const tumpuk =
    document
      .getElementById(
        "filterTumpuk"
      )
      .value
      .trim()
      .toLowerCase();


  const items =
    document.querySelectorAll(
      ".item"
    );


  let jumlah =
    0;


  items.forEach(

    function(item) {


      const nilaiRegister =
        item.dataset.register;


      const nilaiTumpuk =
        item.dataset.tumpuk;


      /*
       * REGISTER:
       * boleh mengandung teks
       */

      const cocokRegister =
        register === "" ||
        nilaiRegister.includes(
          register
        );


      /*
       * TUMPUK:
       * HARUS SAMA PERSIS
       *
       * Jadi:
       *
       * 1  = masuk
       * 11 = tidak
       * 12 = tidak
       * 13 = tidak
       */

      const cocokTumpuk =
        tumpuk === "" ||
        nilaiTumpuk === tumpuk;


      const cocok =
        cocokRegister &&
        cocokTumpuk;


      if (cocok) {

        item.style.display =
          "";

        jumlah++;

      } else {

        item.style.display =
          "none";

      }

    }

  );


  document.getElementById(
    "hasilFilter"
  ).innerHTML =
    "Hasil filter: " +
    jumlah;

}


/* =====================================================
   TAMPILKAN SEMUA
   ===================================================== */

function tampilkanSemua() {


  document.getElementById(
    "filterRegister"
  ).value =
    "";


  document.getElementById(
    "filterTumpuk"
  ).value =
    "";


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {

        item.style.display =
          "";

      }

    );


  document.getElementById(
    "hasilFilter"
  ).innerHTML =
    "Hasil filter: " +
    database.length;

}


/* =====================================================
   PILIH HASIL FILTER
   ===================================================== */

function pilihHasilFilter() {


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {


        if (
          item.style.display ===
          "none"
        ) {

          return;

        }


        const index =
          Number(
            item.dataset.index
          );


        database[index]
          .dipilih =
          true;


        item.querySelector(
          "input"
        ).checked =
          true;


        item.classList.remove(
          "tidakDipilih"
        );

      }

    );


  updateJumlah();

}


/* =====================================================
   BATAL HASIL FILTER
   ===================================================== */

function batalHasilFilter() {


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {


        if (
          item.style.display ===
          "none"
        ) {

          return;

        }


        const index =
          Number(
            item.dataset.index
          );


        database[index]
          .dipilih =
          false;


        item.querySelector(
          "input"
        ).checked =
          false;


        item.classList.add(
          "tidakDipilih"
        );

      }

    );


  updateJumlah();

}


/* =====================================================
   PILIH SEMUA
   ===================================================== */

function pilihSemua() {


  database.forEach(

    function(data) {

      data.dipilih =
        true;

    }

  );


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {

        item.querySelector(
          "input"
        ).checked =
          true;


        item.classList.remove(
          "tidakDipilih"
        );

      }

    );


  updateJumlah();

}


/* =====================================================
   BATAL SEMUA
   ===================================================== */

function batalSemua() {


  database.forEach(

    function(data) {

      data.dipilih =
        false;

    }

  );


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {

        item.querySelector(
          "input"
        ).checked =
          false;


        item.classList.add(
          "tidakDipilih"
        );

      }

    );


  updateJumlah();

}


/* =====================================================
   JUMLAH
   ===================================================== */

function updateJumlah() {


  const jumlah =
    database.length;


  const dipilih =
    database.filter(

      function(data) {

        return data.dipilih;

      }

    ).length;


  document.getElementById(
    "jumlah"
  ).innerHTML =
    "Jumlah database: " +
    jumlah;


  document.getElementById(
    "jumlahDipilih"
  ).innerHTML =
    "Dipilih: " +
    dipilih;

}


/* =====================================================
   DATA DIPILIH
   ===================================================== */

function dataDipilih() {

  return database.filter(

    function(data) {

      return data.dipilih;

    }

  );

}


/* =====================================================
   BUAT SVG BARCODE
   ===================================================== */

function buatSVGBarcode(
  register
) {


  const svg =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "svg"

    );


  /*
   * Ukuran dasar
   */

  svg.setAttribute(
    "width",
    "1000"
  );


  svg.setAttribute(
    "height",
    "500"
  );


  svg.setAttribute(
    "viewBox",
    "0 0 1000 500"
  );


  /*
   * Barcode
   */

  JsBarcode(

    svg,

    register,

    {

      format:
        "CODE128",

      width:
        2,

      height:
        300,

      displayValue:
        false,

      margin:
        0

    }

  );


  return svg;

}


/* =====================================================
   BUAT LABEL PDF
   ===================================================== */

async function buatLabelPDF(

  doc,

  data,

  x,

  y,

  lebar,

  tinggi

) {


  /*
   * BORDER / GARIS POTONG
   */

  doc.setDrawColor(
    0,
    0,
    0
  );


  doc.setLineWidth(
    0.25
  );


  doc.rect(

    x,

    y,

    lebar,

    tinggi

  );


  /*
   * SVG BARCODE
   */

  const barcodeSVG =
    buatSVGBarcode(
      data.register
    );


  /*
   * Ukuran barcode
   * diberi ruang kiri kanan
   */

  const marginX =
    1.5;


  const marginTop =
    1;


  const barcodeWidth =
    lebar -
    (marginX * 2);


  const barcodeHeight =
    tinggi * 0.62;


  /*
   * Konversi SVG ke PDF
   */

  await doc.svg(

    barcodeSVG,

    {

      x:
        x + marginX,

      y:
        y + marginTop,

      width:
        barcodeWidth,

      height:
        barcodeHeight,

      preserveAspectRatio:
        "xMidYMid meet"

    }

  );


  /*
   * REGISTER
   */

  doc.setFont(
    "helvetica",
    "bold"
  );


  doc.setFontSize(
    Math.max(
      7,
      Math.min(
        11,
        tinggi * 0.30
      )
    )
  );


  doc.text(

    String(
      data.register
    ),

    x +
      (lebar / 2),

    y +
      (tinggi * 0.82),

    {

      align:
        "center"

    }

  );


  /*
   * TUMPUK
   */

  doc.setFont(
    "helvetica",
    "normal"
  );


  doc.setFontSize(
    Math.max(
      6,
      Math.min(
        9,
        tinggi * 0.22
      )
    )
  );


  doc.text(

    String(
      data.tumpuk
    ),

    x +
      (lebar / 2),

    y +
      (tinggi * 0.96),

    {

      align:
        "center"

    }

  );

}


/* =====================================================
   UKURAN KERTAS
   ===================================================== */

function ukuranKertas() {


  const jenis =
    document.getElementById(
      "kertas"
    ).value;


  if (
    jenis === "a3"
  ) {

    return {

      nama:
        "a3",

      lebar:
        297,

      tinggi:
        420

    };

  }


  if (
    jenis === "letter"
  ) {

    return {

      nama:
        "letter",

      lebar:
        215.9,

      tinggi:
        279.4

    };

  }


  return {

    nama:
      "a4",

    lebar:
      210,

    tinggi:
      297

  };

}


/* =====================================================
   BUAT PDF
   ===================================================== */

async function buatPDF(
  daftar,
  namaFile
) {


  if (
    daftar.length === 0
  ) {

    alert(
      "Tidak ada barcode yang dipilih."
    );

    return;

  }


  /*
   * UKURAN BARCODE
   */

  let lebar =
    parseFloat(
      document.getElementById(
        "lebar"
      ).value
    );


  let tinggi =
    parseFloat(
      document.getElementById(
        "tinggi"
      ).value
    );


  if (
    !lebar ||
    lebar <= 0
  ) {

    lebar = 5;

  }


  if (
    !tinggi ||
    tinggi <= 0
  ) {

    tinggi = 2;

  }


  /*
   * KONVERSI CM KE MM
   */

  lebar *= 10;

  tinggi *= 10;


  /*
   * KERTAS
   */

  const kertas =
    ukuranKertas();


  /*
   * MARGIN KERTAS
   */

  const marginKertas =
    8;


  /*
   * JARAK ANTAR LABEL
   */

  const jarak =
    1;


  /*
   * BUAT PDF
   */

  const {
    jsPDF
  } = window.jspdf;


  const doc =
    new jsPDF({

      orientation:
        "portrait",

      unit:
        "mm",

      format:
        [
          kertas.lebar,
          kertas.tinggi
        ],

      compress:
        true

    });


  /*
   * HITUNG KOLOM
   */

  const areaLebar =
    kertas.lebar -
    (marginKertas * 2);


  const kolom =
    Math.max(

      1,

      Math.floor(

        (
          areaLebar +
          jarak
        ) /

        (
          lebar +
          jarak
        )

      )

    );


  /*
   * HITUNG BARIS
   */

  const areaTinggi =
    kertas.tinggi -
    (marginKertas * 2);


  const baris =
    Math.max(

      1,

      Math.floor(

        (
          areaTinggi +
          jarak
        ) /

        (
          tinggi +
          jarak
        )

      )

    );


  /*
   * JUMLAH LABEL PER HALAMAN
   */

  const perHalaman =
    kolom *
    baris;


  /*
   * TENGAHKAN GRID
   */

  const gridLebar =
    (
      kolom * lebar
    ) +

    (
      (kolom - 1) *
      jarak
    );


  const gridTinggi =
    (
      baris * tinggi
    ) +

    (
      (baris - 1) *
      jarak
    );


  const offsetX =
    (
      kertas.lebar -
      gridLebar
    ) / 2;


  const offsetY =
    (
      kertas.tinggi -
      gridTinggi
    ) / 2;


  /*
   * PROSES BARCODE
   */

  for (
    let i = 0;
    i < daftar.length;
    i++
  ) {


    /*
     * Halaman baru
     */

    if (
      i > 0 &&
      i % perHalaman === 0
    ) {

      doc.addPage();

    }


    const posisi =
      i %
      perHalaman;


    const kolomKe =
      posisi %
      kolom;


    const barisKe =
      Math.floor(
        posisi /
        kolom
      );


    const x =
      offsetX +

      kolomKe *
      (
        lebar +
        jarak
      );


    const y =
      offsetY +

      barisKe *
      (
        tinggi +
        jarak
      );


    /*
     * Status
     */

    document.getElementById(
      "status"
    ).innerHTML =

      "⏳ Membuat PDF... " +

      (
        i + 1
      ) +

      " / " +

      daftar.length;


    /*
     * Buat label
     */

    await buatLabelPDF(

      doc,

      daftar[i],

      x,

      y,

      lebar,

      tinggi

    );


    /*
     * Beri kesempatan
     * browser bernapas
     */

    if (
      i % 20 === 0
    ) {

      await new Promise(

        function(resolve) {

          setTimeout(
            resolve,
            0
          );

        }

      );

    }

  }


  /*
   * DOWNLOAD
   */

  doc.save(
    namaFile
  );


  document.getElementById(
    "status"
  ).innerHTML =

    "✅ PDF berhasil dibuat";


}
