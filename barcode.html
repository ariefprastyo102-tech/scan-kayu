<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Cetak Barcode Kayu</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.kontrol{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:12px;
}

h2{
    text-align:center;
    margin-top:0;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 15px;
    margin:4px;
    font-weight:bold;
    cursor:pointer;
}

.btnAmbil{background:#1976d2;color:#fff;width:100%}
.btnFilter{background:#1976d2;color:#fff}
.btnSemua{background:#607d8b;color:#fff}
.btnPilih{background:#388e3c;color:#fff}
.btnBatal{background:#d32f2f;color:#fff}
.btnDownload{background:#6a1b9a;color:#fff;width:100%;margin-top:15px}

.filter{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

input{
    padding:11px;
    border:1px solid #aaa;
    border-radius:7px;
    font-size:15px;
    width:100%;
}

.status{
    margin-top:15px;
    padding:12px;
    background:#f5f5f5;
    border-radius:7px;
    text-align:center;
    line-height:1.7;
}

#grid{
    max-width:1100px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.item{
    background:white;
    border:1px solid #999;
    padding:5px;
    text-align:center;
    position:relative;
}

.item.hide{
    display:none;
}

.item input{
    position:absolute;
    top:5px;
    left:5px;
    width:18px;
    height:18px;
}

.item svg{
    width:100%;
    height:65px;
    margin-top:15px;
}

.info{
    display:flex;
    justify-content:center;
    gap:15px;
    font-weight:bold;
    font-size:14px;
}

@media(max-width:700px){
    .filter{
        grid-template-columns:1fr;
    }

    #grid{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="kontrol">

<h2>🪵 CETAK BARCODE KAYU</h2>

<button
    class="btnAmbil"
    onclick="ambilDatabase()">
    🔄 AMBIL DATA REGISTER
</button>

<div class="filter">

<input
    id="filterRegister"
    placeholder="Cari nomor register">

<input
    id="filterTumpuk"
    placeholder="Cari nomor tumpuk">

</div>

<div>

<button
    class="btnFilter"
    onclick="filterData()">
    🔎 FILTER
</button>

<button
    class="btnSemua"
    onclick="tampilkanSemua()">
    🔄 SEMUA
</button>

<button
    class="btnPilih"
    onclick="pilihFilter()">
    ☑️ PILIH HASIL FILTER
</button>

<button
    class="btnBatal"
    onclick="batalFilter()">
    ❌ BATAL HASIL FILTER
</button>

<button
    class="btnPilih"
    onclick="pilihSemua()">
    ☑️ PILIH SEMUA
</button>

<button
    class="btnBatal"
    onclick="batalSemua()">
    ❌ BATAL SEMUA
</button>

</div>

<button
    class="btnDownload"
    onclick="downloadSVG()">
    📥 DOWNLOAD MASTER SVG
</button>

<div class="status">

<div id="status">
Belum mengambil database
</div>

<div id="jumlah">
Jumlah barcode: 0
</div>

<div id="dipilih">
Dipilih: 0
</div>

</div>

</div>


<div id="grid"></div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


/* =====================================================
   DATABASE
===================================================== */

let database=[];


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    const status=
        document.getElementById("status");

    status.innerHTML=
        "⏳ Mengambil DATABASE...";

    const callback=
        "db_"+Date.now();

    window[callback]=function(hasil){

        if(!hasil || hasil.status!=="success"){

            status.innerHTML=
                "❌ Gagal mengambil DATABASE";

            bersihkan();
            return;
        }

        database=[];

        (hasil.data||[]).forEach(item=>{

            const register=
                String(item.register||"").trim();

            const tumpuk=
                String(item.tumpuk||"").trim();

            if(!register)return;

            database.push({

                register:register,

                tumpuk:tumpuk,

                dipilih:true

            });

        });


        tampilkan();

        status.innerHTML=
            "✅ DATABASE berhasil diambil";

        updateJumlah();

        bersihkan();
    };


    const script=
        document.createElement("script");

    script.src=
        API_URL+
        "?getDatabase=1"+
        "&callback="+callback;

    script.onerror=function(){

        status.innerHTML=
            "❌ Gagal menghubungi DATABASE";

        bersihkan();
    };

    document.body.appendChild(script);


    function bersihkan(){

        delete window[callback];

        script.remove();

    }
}


/* =====================================================
   TAMPILKAN
===================================================== */

function tampilkan(){

    const grid=
        document.getElementById("grid");

    grid.innerHTML="";


    database.forEach((data,index)=>{

        const item=
            document.createElement("div");

        item.className="item";

        item.dataset.index=index;

        item.dataset.register=
            data.register.toLowerCase();

        item.dataset.tumpuk=
            data.tumpuk.toLowerCase();


        const check=
            document.createElement("input");

        check.type="checkbox";

        check.checked=data.dipilih;

        check.onchange=function(){

            data.dipilih=
                this.checked;

            updateJumlah();

        };


        item.appendChild(check);


        const svg=
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "svg"
            );


        item.appendChild(svg);


        JsBarcode(
            svg,
            data.register,
            {
                format:"CODE128",
                width:2,
                height:55,
                displayValue:false,
                margin:3
            }
        );


        const info=
            document.createElement("div");

        info.className="info";


        const reg=
            document.createElement("span");

        reg.textContent=
            data.register;


        const tup=
            document.createElement("span");

        tup.textContent=
            data.tumpuk;


        info.appendChild(reg);
        info.appendChild(tup);

        item.appendChild(info);

        grid.appendChild(item);

    });

}


/* =====================================================
   FILTER
===================================================== */

function filterData(){

    const register=
        document
        .getElementById("filterRegister")
        .value
        .trim()
        .toLowerCase();


    const tumpuk=
        document
        .getElementById("filterTumpuk")
        .value
        .trim()
        .toLowerCase();


    document
    .querySelectorAll(".item")
    .forEach(item=>{

        const cocokRegister=
            !register ||
            item.dataset.register.includes(register);


        /*
         * PENTING:
         *
         * TUMPUK HARUS SAMA PERSIS
         *
         * 1  -> tampil
         * 11 -> tidak
         * 12 -> tidak
         * 13 -> tidak
         */

        const cocokTumpuk=
            !tumpuk ||
            item.dataset.tumpuk===tumpuk;


        if(
            cocokRegister &&
            cocokTumpuk
        ){

            item.classList.remove("hide");

        }else{

            item.classList.add("hide");

        }

    });

}


/* =====================================================
   SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterRegister"
    ).value="";

    document.getElementById(
        "filterTumpuk"
    ).value="";


    document
    .querySelectorAll(".item")
    .forEach(item=>{

        item.classList.remove("hide");

    });

}


/* =====================================================
   PILIH HASIL FILTER
===================================================== */

function pilihFilter(){

    document
    .querySelectorAll(".item")
    .forEach(item=>{

        if(
            item.classList.contains("hide")
        )return;


        const index=
            Number(item.dataset.index);


        database[index].dipilih=true;

        item.querySelector(
            "input"
        ).checked=true;

    });

    updateJumlah();
}


/* =====================================================
   BATAL HASIL FILTER
===================================================== */

function batalFilter(){

    document
    .querySelectorAll(".item")
    .forEach(item=>{

        if(
            item.classList.contains("hide")
        )return;


        const index=
            Number(item.dataset.index);


        database[index].dipilih=false;

        item.querySelector(
            "input"
        ).checked=false;

    });

    updateJumlah();
}


/* =====================================================
   PILIH SEMUA
===================================================== */

function pilihSemua(){

    database.forEach(data=>{
        data.dipilih=true;
    });


    document
    .querySelectorAll(".item")
    .forEach(item=>{

        item.querySelector(
            "input"
        ).checked=true;

    });


    updateJumlah();
}


/* =====================================================
   BATAL SEMUA
===================================================== */

function batalSemua(){

    database.forEach(data=>{
        data.dipilih=false;
    });


    document
    .querySelectorAll(".item")
    .forEach(item=>{

        item.querySelector(
            "input"
        ).checked=false;

    });


    updateJumlah();
}


/* =====================================================
   JUMLAH
===================================================== */

function updateJumlah(){

    document.getElementById(
        "jumlah"
    ).innerHTML=
        "Jumlah barcode: "+
        database.length;


    document.getElementById(
        "dipilih"
    ).innerHTML=
        "Dipilih: "+
        database.filter(
            x=>x.dipilih
        ).length;

}


/* =====================================================
   BUAT MASTER SVG
===================================================== */

function downloadSVG(){

    const daftar=
        database.filter(
            x=>x.dipilih
        );


    if(!daftar.length){

        alert(
            "Belum ada barcode yang dipilih."
        );

        return;
    }


    /*
     * UKURAN SETIAP BARCODE
     *
     * 5 x 2 cm
     */

    const W=500;
    const H=200;


    /*
     * JARAK ANTAR BARCODE
     */

    const GAP=10;


    /*
     * JUMLAH KOLOM
     *
     * Dibuat 4 supaya
     * tidak terlalu kecil.
     */

    const COL=4;


    /*
     * HITUNG BARIS
     */

    const ROW=
        Math.ceil(
            daftar.length/COL
        );


    /*
     * UKURAN KANVAS
     */

    const canvasW=
        COL*W+
        (COL-1)*GAP;


    const canvasH=
        ROW*H+
        (ROW-1)*GAP;


    /*
     * SVG MASTER
     */

    const ns=
        "http://www.w3.org/2000/svg";


    const root=
        document.createElementNS(
            ns,
            "svg"
        );


    root.setAttribute(
        "xmlns",
        ns
    );


    root.setAttribute(
        "width",
        canvasW
    );


    root.setAttribute(
        "height",
        canvasH
    );


    root.setAttribute(
        "viewBox",
        `0 0 ${canvasW} ${canvasH}`
    );


    /*
     * BACKGROUND PUTIH
     */

    const bg=
        document.createElementNS(
            ns,
            "rect"
        );


    bg.setAttribute("x",0);
    bg.setAttribute("y",0);
    bg.setAttribute("width",canvasW);
    bg.setAttribute("height",canvasH);
    bg.setAttribute("fill","white");

    root.appendChild(bg);


    /*
     * BUAT SEMUA BARCODE
     */

    daftar.forEach((data,index)=>{


        const col=
            index%COL;


        const row=
            Math.floor(index/COL);


        const x=
            col*(W+GAP);


        const y=
            row*(H+GAP);


        /*
         * GROUP
         */

        const group=
            document.createElementNS(
                ns,
                "g"
            );


        group.setAttribute(
            "transform",
            `translate(${x},${y})`
        );


        /*
         * GARIS POTONG
         */

        const border=
            document.createElementNS(
                ns,
                "rect"
            );


        border.setAttribute(
            "x",
            0
        );

        border.setAttribute(
            "y",
            0
        );

        border.setAttribute(
            "width",
            W
        );

        border.setAttribute(
            "height",
            H
        );

        border.setAttribute(
            "fill",
            "white"
        );

        border.setAttribute(
            "stroke",
            "black"
        );

        border.setAttribute(
            "stroke-width",
            2
        );


        group.appendChild(border);


        /*
         * BUAT SVG BARCODE SEMENTARA
         */

        const barcode=
            document.createElementNS(
                ns,
                "svg"
            );


        barcode.setAttribute(
            "x",
            25
        );

        barcode.setAttribute(
            "y",
            15
        );

        barcode.setAttribute(
            "width",
            450
        );

        barcode.setAttribute(
            "height",
            115
        );


        JsBarcode(
            barcode,
            data.register,
            {
                format:"CODE128",
                width:2,
                height:100,
                displayValue:false,
                margin:0
            }
        );


        group.appendChild(barcode);


        /*
         * REGISTER
         */

        const reg=
            document.createElementNS(
                ns,
                "text"
            );


        reg.setAttribute(
            "x",
            W/2
        );

        reg.setAttribute(
            "y",
            155
        );

        reg.setAttribute(
            "text-anchor",
            "middle"
        );

        reg.setAttribute(
            "font-family",
            "Arial"
        );

        reg.setAttribute(
            "font-size",
            25
        );

        reg.setAttribute(
            "font-weight",
            "bold"
        );

        reg.textContent=
            data.register;


        group.appendChild(reg);


        /*
         * TUMPUK
         */

        const tup=
            document.createElementNS(
                ns,
                "text"
            );


        tup.setAttribute(
            "x",
            W/2
        );

        tup.setAttribute(
            "y",
            187
        );

        tup.setAttribute(
            "text-anchor",
            "middle"
        );

        tup.setAttribute(
            "font-family",
            "Arial"
        );

        tup.setAttribute(
            "font-size",
            20
        );

        tup.textContent=
            data.tumpuk;


        group.appendChild(tup);


        root.appendChild(group);

    });


    /*
     * SERIALIZE
     */

    const serializer=
        new XMLSerializer();


    let source=
        serializer.serializeToString(root);


    /*
     * HEADER XML
     */

    source=
        '<?xml version="1.0" encoding="UTF-8"?>\n'+
        source;


    /*
     * DOWNLOAD
     */

    const blob=
        new Blob(
            [source],
            {
                type:"image/svg+xml"
            }
        );


    const url=
        URL.createObjectURL(blob);


    const a=
        document.createElement("a");


    a.href=url;

    a.download=
        "MASTER-BARCODE-KAYU.svg";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);


    document.getElementById(
        "status"
    ).innerHTML=
        "✅ MASTER SVG berhasil dibuat — "+
        daftar.length+
        " barcode";

}

</script>

</body>
</html>
