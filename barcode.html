<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Barcode Kayu</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}


/* =====================================================
   PANEL
===================================================== */

.kontrol{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
}


h2{
    text-align:center;
    margin-top:0;
}


/* =====================================================
   BUTTON
===================================================== */

button{
    border:none;
    border-radius:7px;
    padding:11px 15px;
    margin:4px;
    font-weight:bold;
    cursor:pointer;
}


.btnAmbil{
    width:100%;
    background:#1976d2;
    color:white;
}


.btnFilter{
    background:#1976d2;
    color:white;
}


.btnSemua{
    background:#607d8b;
    color:white;
}


.btnPilih{
    background:#388e3c;
    color:white;
}


.btnBatal{
    background:#d32f2f;
    color:white;
}


.btnDownload{
    width:100%;
    margin-top:15px;
    background:#6a1b9a;
    color:white;
}


/* =====================================================
   FILTER
===================================================== */

.filter{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}


.filter input{
    width:100%;
    padding:11px;
    border:1px solid #aaa;
    border-radius:7px;
    font-size:15px;
}


/* =====================================================
   STATUS
===================================================== */

.status{
    margin-top:15px;
    padding:12px;
    background:#f5f5f5;
    border-radius:7px;
    text-align:center;
    line-height:1.8;
}


/* =====================================================
   PREVIEW
===================================================== */

#grid{
    max-width:1100px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}


.item{
    background:white;
    border:1px solid #aaa;
    padding:7px;
    text-align:center;
    position:relative;
}


.item.hide{
    display:none;
}


.item input{
    position:absolute;
    top:5px;
    left:5px;
    width:18px;
    height:18px;
}


.item svg{
    width:100%;
    height:70px;
    margin-top:15px;
}


.info{
    display:flex;
    justify-content:center;
    gap:15px;
    font-weight:bold;
    font-size:14px;
}


@media(max-width:700px){

    .filter{
        grid-template-columns:1fr;
    }

    #grid{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>


<body>


<div class="kontrol">

<h2>
🪵 CETAK BARCODE KAYU
</h2>


<button
    class="btnAmbil"
    onclick="ambilDatabase()">

🔄 AMBIL DATA REGISTER

</button>


<div class="filter">

<input
    id="filterRegister"
    type="text"
    placeholder="Cari nomor register">


<input
    id="filterTumpuk"
    type="text"
    placeholder="Nomor tumpuk, contoh: 1">

</div>


<div>

<button
    class="btnFilter"
    onclick="filterData()">

🔎 FILTER

</button>


<button
    class="btnSemua"
    onclick="tampilkanSemua()">

🔄 TAMPILKAN SEMUA

</button>


<button
    class="btnPilih"
    onclick="pilihHasilFilter()">

☑️ PILIH HASIL FILTER

</button>


<button
    class="btnBatal"
    onclick="batalHasilFilter()">

❌ BATAL HASIL FILTER

</button>


<button
    class="btnPilih"
    onclick="pilihSemua()">

☑️ PILIH SEMUA

</button>


<button
    class="btnBatal"
    onclick="batalSemua()">

❌ BATAL SEMUA

</button>

</div>


<button
    class="btnDownload"
    onclick="downloadSVG()">

📥 DOWNLOAD MASTER SVG

</button>


<div class="status">

<div id="status">
Belum mengambil database
</div>

<div id="jumlah">
Jumlah barcode: 0
</div>

<div id="dipilih">
Dipilih: 0
</div>

</div>

</div>


<div id="grid"></div>


<script>


/* =====================================================
   API DATABASE
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


/* =====================================================
   DATABASE
===================================================== */

let database=[];


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    const status =
        document.getElementById("status");

    status.innerHTML =
        "⏳ Mengambil DATABASE...";


    const callback =
        "database_"+Date.now();


    window[callback] =
        function(hasil){

            if(
                !hasil ||
                hasil.status !== "success"
            ){

                status.innerHTML =
                    "❌ Gagal mengambil DATABASE";

                bersihkan();

                return;
            }


            database=[];


            const data =
                hasil.data || [];


            data.forEach(function(item){

                const register =
                    String(
                        item.register || ""
                    ).trim();


                const tumpuk =
                    String(
                        item.tumpuk || ""
                    ).trim();


                if(!register){
                    return;
                }


                database.push({

                    register:register,

                    tumpuk:tumpuk,

                    dipilih:true

                });

            });


            tampilkan();

            updateJumlah();


            status.innerHTML =
                "✅ DATABASE berhasil diambil";


            bersihkan();

        };


    const script =
        document.createElement("script");


    script.src =
        API_URL +
        "?getDatabase=1" +
        "&callback=" +
        callback;


    script.onerror =
        function(){

            status.innerHTML =
                "❌ Gagal menghubungi DATABASE";

            bersihkan();

        };


    document.body.appendChild(
        script
    );


    function bersihkan(){

        delete window[
            callback
        ];


        if(script){
            script.remove();
        }

    }

}


/* =====================================================
   TAMPILKAN PREVIEW
===================================================== */

function tampilkan(){

    const grid =
        document.getElementById(
            "grid"
        );


    grid.innerHTML="";


    database.forEach(
        function(data,index){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item";


            item.dataset.index =
                index;


            item.dataset.register =
                data.register.toLowerCase();


            item.dataset.tumpuk =
                data.tumpuk.toLowerCase();


            /* CHECKBOX */

            const check =
                document.createElement(
                    "input"
                );


            check.type =
                "checkbox";


            check.checked =
                data.dipilih;


            check.onchange =
                function(){

                    data.dipilih =
                        this.checked;

                    updateJumlah();

                };


            item.appendChild(
                check
            );


            /* BARCODE */

            const svg =
                document.createElementNS(

                    "http://www.w3.org/2000/svg",

                    "svg"

                );


            item.appendChild(
                svg
            );


            JsBarcode(

                svg,

                data.register,

                {

                    format:
                        "CODE128",

                    width:
                        2,

                    height:
                        55,

                    displayValue:
                        false,

                    margin:
                        3

                }

            );


            /* INFO */

            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "info";


            const register =
                document.createElement(
                    "span"
                );


            register.textContent =
                data.register;


            const tumpuk =
                document.createElement(
                    "span"
                );


            tumpuk.textContent =
                data.tumpuk;


            info.appendChild(
                register
            );


            info.appendChild(
                tumpuk
            );


            item.appendChild(
                info
            );


            grid.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   FILTER
===================================================== */

function filterData(){

    const register =
        document
        .getElementById(
            "filterRegister"
        )
        .value
        .trim()
        .toLowerCase();


    const tumpuk =
        document
        .getElementById(
            "filterTumpuk"
        )
        .value
        .trim()
        .toLowerCase();


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        const nilaiRegister =
            item.dataset.register;


        const nilaiTumpuk =
            item.dataset.tumpuk;


        const cocokRegister =
            register === "" ||
            nilaiRegister.includes(
                register
            );


        /*
         * TUMPUK HARUS SAMA PERSIS
         *
         * 1  = masuk
         * 11 = tidak
         * 12 = tidak
         * 13 = tidak
         */

        const cocokTumpuk =
            tumpuk === "" ||
            nilaiTumpuk === tumpuk;


        if(
            cocokRegister &&
            cocokTumpuk
        ){

            item.classList.remove(
                "hide"
            );

        }else{

            item.classList.add(
                "hide"
            );

        }

    });

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterRegister"
    ).value="";


    document.getElementById(
        "filterTumpuk"
    ).value="";


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.classList.remove(
            "hide"
        );

    });

}


/* =====================================================
   PILIH HASIL FILTER
===================================================== */

function pilihHasilFilter(){

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        if(
            item.classList.contains(
                "hide"
            )
        ){
            return;
        }


        const index =
            Number(
                item.dataset.index
            );


        database[index].dipilih =
            true;


        item.querySelector(
            "input"
        ).checked=true;

    });


    updateJumlah();

}


/* =====================================================
   BATAL HASIL FILTER
===================================================== */

function batalHasilFilter(){

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        if(
            item.classList.contains(
                "hide"
            )
        ){
            return;
        }


        const index =
            Number(
                item.dataset.index
            );


        database[index].dipilih =
            false;


        item.querySelector(
            "input"
        ).checked=false;

    });


    updateJumlah();

}


/* =====================================================
   PILIH SEMUA
===================================================== */

function pilihSemua(){

    database.forEach(
        function(data){

            data.dipilih=true;

        }
    );


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.querySelector(
            "input"
        ).checked=true;

    });


    updateJumlah();

}


/* =====================================================
   BATAL SEMUA
===================================================== */

function batalSemua(){

    database.forEach(
        function(data){

            data.dipilih=false;

        }
    );


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.querySelector(
            "input"
        ).checked=false;

    });


    updateJumlah();

}


/* =====================================================
   UPDATE JUMLAH
===================================================== */

function updateJumlah(){

    const jumlah =
        database.length;


    const dipilih =
        database.filter(
            function(data){

                return data.dipilih;

            }
        ).length;


    document.getElementById(
        "jumlah"
    ).innerHTML =
        "Jumlah barcode: " +
        jumlah;


    document.getElementById(
        "dipilih"
    ).innerHTML =
        "Dipilih: " +
        dipilih;

}


/* =====================================================
   DOWNLOAD MASTER SVG
===================================================== */

function downloadSVG(){

    const daftar =
        database.filter(
            function(data){

                return data.dipilih;

            }
        );


    if(
        daftar.length === 0
    ){

        alert(
            "Belum ada barcode yang dipilih."
        );

        return;

    }


    /* =================================================
       UKURAN LABEL
       5 x 2,5 CM
    ================================================= */

    const LABEL_W = 50;

    const LABEL_H = 25;

    const GAP = 2;

    const MARGIN = 10;

    const COL = 4;


    const ROW =
        Math.ceil(
            daftar.length / COL
        );


    /* =================================================
       UKURAN MASTER
    ================================================= */

    const CANVAS_W =
        MARGIN * 2 +
        COL * LABEL_W +
        (COL - 1) * GAP;


    const CANVAS_H =
        MARGIN * 2 +
        ROW * LABEL_H +
        (ROW - 1) * GAP;


    /* =================================================
       ROOT SVG
    ================================================= */

    const NS =
        "http://www.w3.org/2000/svg";


    const root =
        document.createElementNS(
            NS,
            "svg"
        );


    root.setAttribute(
        "xmlns",
        NS
    );


    root.setAttribute(
        "width",
        CANVAS_W + "mm"
    );


    root.setAttribute(
        "height",
        CANVAS_H + "mm"
    );


    root.setAttribute(
        "viewBox",
        "0 0 " +
        CANVAS_W +
        " " +
        CANVAS_H
    );


    /* =================================================
       BACKGROUND
    ================================================= */

    const bg =
        document.createElementNS(
            NS,
            "rect"
        );


    bg.setAttribute(
        "x",
        "0"
    );


    bg.setAttribute(
        "y",
        "0"
    );


    bg.setAttribute(
        "width",
        CANVAS_W
    );


    bg.setAttribute(
        "height",
        CANVAS_H
    );


    bg.setAttribute(
        "fill",
        "white"
    );


    root.appendChild(
        bg
    );


    /* =================================================
       ITEM PREVIEW
    ================================================= */

    const semuaItem =
        Array.from(
            document.querySelectorAll(
                ".item"
            )
        );


    /* =================================================
       BUAT LABEL
    ================================================= */

    daftar.forEach(
        function(data,index){

            const col =
                index % COL;


            const row =
                Math.floor(
                    index / COL
                );


            const labelX =
                MARGIN +
                col *
                (
                    LABEL_W +
                    GAP
                );


            const labelY =
                MARGIN +
                row *
                (
                    LABEL_H +
                    GAP
                );


            /* =================================================
               GROUP
            ================================================= */

            const group =
                document.createElementNS(
                    NS,
                    "g"
                );


            group.setAttribute(
                "transform",
                "translate(" +
                labelX +
                "," +
                labelY +
                ")"
            );


            /* =================================================
               KOTAK LABEL
            ================================================= */

            const kotak =
                document.createElementNS(
                    NS,
                    "rect"
                );


            kotak.setAttribute(
                "x",
                "0"
            );


            kotak.setAttribute(
                "y",
                "0"
            );


            kotak.setAttribute(
                "width",
                LABEL_W
            );


            kotak.setAttribute(
                "height",
                LABEL_H
            );


            kotak.setAttribute(
                "fill",
                "white"
            );


            kotak.setAttribute(
                "stroke",
                "black"
            );


            kotak.setAttribute(
                "stroke-width",
                "0.25"
            );


            group.appendChild(
                kotak
            );


            /* =================================================
               CARI BARCODE PREVIEW
            ================================================= */

            let sourceSVG = null;


            for(
                let i = 0;
                i < semuaItem.length;
                i++
            ){

                const item =
                    semuaItem[i];


                const itemIndex =
                    Number(
                        item.dataset.index
                    );


                if(
                    database[itemIndex] ===
                    data
                ){

                    sourceSVG =
                        item.querySelector(
                            "svg"
                        );

                    break;

                }

            }


            /* =================================================
               COPY BARCODE
            ================================================= */

            if(sourceSVG){

                const barcode =
                    sourceSVG.cloneNode(
                        true
                    );


                barcode.removeAttribute(
                    "style"
                );


                const viewBox =
                    sourceSVG.getAttribute(
                        "viewBox"
                    );


                if(viewBox){

                    barcode.setAttribute(
                        "viewBox",
                        viewBox
                    );

                }


                /*
                UKURAN BARCODE
                */

                const BARCODE_W = 40;

                const BARCODE_H = 12;


                /*
                POSISI TENGAH
                */

                const barcodeX =
                    (
                        LABEL_W -
                        BARCODE_W
                    ) / 2;


                const barcodeY = 2;


                barcode.setAttribute(
                    "x",
                    barcodeX
                );


                barcode.setAttribute(
                    "y",
                    barcodeY
                );


                barcode.setAttribute(
                    "width",
                    BARCODE_W
                );


                barcode.setAttribute(
                    "height",
                    BARCODE_H
                );


                barcode.style.width="";
                barcode.style.height="";
                barcode.style.margin="";


                group.appendChild(
                    barcode
                );

            }


            /* =================================================
               REGISTER
               SEJAJAR DENGAN TUMPUK
            ================================================= */

            const reg =
                document.createElementNS(
                    NS,
                    "text"
                );


            reg.setAttribute(
                "x",
                "22"
            );


            reg.setAttribute(
                "y",
                "23"
            );


            reg.setAttribute(
                "text-anchor",
                "end"
            );


            reg.setAttribute(
                "font-family",
                "Arial"
            );


            reg.setAttribute(
                "font-size",
                "3.5"
            );


            reg.setAttribute(
                "font-weight",
                "bold"
            );


            reg.textContent =
                data.register;


            group.appendChild(
                reg
            );


            /* =================================================
               TUMPUK
               SEJAJAR DENGAN REGISTER
            ================================================= */

            const tup =
                document.createElementNS(
                    NS,
                    "text"
                );


            tup.setAttribute(
                "x",
                "28"
            );


            tup.setAttribute(
                "y",
                "23"
            );


            tup.setAttribute(
                "text-anchor",
                "start"
            );


            tup.setAttribute(
                "font-family",
                "Arial"
            );


            tup.setAttribute(
                "font-size",
                "3.5"
            );


            tup.setAttribute(
                "font-weight",
                "bold"
            );


            tup.textContent =
                data.tumpuk;


            group.appendChild(
                tup
            );


            /* =================================================
               MASUKKAN LABEL
            ================================================= */

            root.appendChild(
                group
            );

        }
    );


    /* =================================================
       SERIALIZE
    ================================================= */

    const serializer =
        new XMLSerializer();


    let source =
        serializer.serializeToString(
            root
        );


    source =
        '<?xml version="1.0" encoding="UTF-8"?>\n' +
        source;


    /* =================================================
       DOWNLOAD
    ================================================= */

    const blob =
        new Blob(
            [source],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "MASTER-BARCODE-KAYU.svg";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );


    document.getElementById(
        "status"
    ).innerHTML =
        "✅ Master SVG selesai — " +
        daftar.length +
        " barcode";

}

</script>

</body>
</html>
