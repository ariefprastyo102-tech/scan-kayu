<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Barcode Kayu</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.kontrol{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
}

h2{
    text-align:center;
    margin-top:0;
}


/* =====================================================
   JUDUL + LOGO PERHUTANI
===================================================== */

.judulBarcode{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-bottom:15px;
}

.judulBarcode img{
    width:50px !important;
    height:50px !important;
    max-width:50px !important;
    max-height:50px !important;
    object-fit:contain;
    display:block;
}

.judulBarcode h2{
    margin:0;
}


button{
    border:none;
    border-radius:7px;
    padding:11px 15px;
    margin:4px;
    font-weight:bold;
    cursor:pointer;
}

.btnAmbil{
    width:100%;
    background:#1976d2;
    color:white;
}

.btnFilter{
    background:#1976d2;
    color:white;
}

.btnSemua{
    background:#607d8b;
    color:white;
}

.btnPilih{
    background:#388e3c;
    color:white;
}

.btnBatal{
    background:#d32f2f;
    color:white;
}

.btnDownload{
    width:100%;
    margin-top:15px;
    background:#6a1b9a;
    color:white;
}

.filter{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.filter input{
    width:100%;
    padding:11px;
    border:1px solid #aaa;
    border-radius:7px;
    font-size:15px;
}

#filterRegister{
    min-height:44px;
}

.status{
    margin-top:15px;
    padding:12px;
    background:#f5f5f5;
    border-radius:7px;
    text-align:center;
    line-height:1.8;
}

#grid{
    max-width:1100px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.item{
    background:white;
    border:1px solid #aaa;
    padding:7px;
    text-align:center;
    position:relative;
}

.item.hide{
    display:none;
}

.item input{
    position:absolute;
    top:5px;
    left:5px;
    width:18px;
    height:18px;
}

.item svg{
    width:100%;
    height:70px;
    margin-top:15px;
}

.info{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    font-weight:bold;
    font-size:20px;
}

.areaCetak{
    display:none;
}


/* =====================================================
   CETAK F4
===================================================== */

@media print{

    @page{
        size:215.9mm 330.2mm;
        margin:0;
    }

    html,
    body{
        width:215.9mm;
        height:330.2mm;
        margin:0;
        padding:0;
        background:white;
    }

    body{
        font-family:Arial,sans-serif;
    }

    .kontrol,
    #grid{
        display:none !important;
    }

    .areaCetak{
        display:block;
        width:215.9mm;
    }

    .lembar{

        width:215.9mm;
        height:330.2mm;

        page-break-after:always;
        page-break-inside:avoid;

        display:grid;

        grid-template-columns:
            70mm 70mm 70mm;

        grid-template-rows:
            repeat(11,30mm);

        column-gap:0;

        row-gap:0;

        padding-left:2.95mm;
        padding-right:2.95mm;

        padding-top:0;
        padding-bottom:0;

        box-sizing:border-box;

        overflow:hidden;
    }

    .lembar:last-child{
        page-break-after:auto;
    }

    .labelCetak{

        width:70mm;
        height:30mm;

        border:0.25mm solid black;

        background:white;

        position:relative;

        overflow:hidden;

        display:block;
    }

    .labelBarcode{

        position:absolute;

        left:11mm;

        top:0.8mm;

        width:48mm;

        height:21mm;

        overflow:hidden;
    }

    .labelBarcode svg{

        display:block;

        width:48mm !important;

        height:21mm !important;

    }

    .angkaCetak{

        position:absolute;

        left:0;

        top:23.7mm;

        width:70mm;

        height:5.5mm;

        display:flex;

        align-items:center;

        justify-content:center;

        font-family:Arial,sans-serif;

        font-size:5mm;

        font-weight:bold;

        line-height:1;

        white-space:nowrap;

        word-spacing:1.2mm;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .filter{
        grid-template-columns:1fr;
    }

    #grid{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>

<body>

<div class="kontrol">

<div class="judulBarcode">


<img
    src="logo-perhutani.jpg"
    alt="Logo Perhutani"
>

<h2>
    CETAK BARCODE BBI IK SARADAN
</h2>


</div>

<button
class="btnAmbil"
onclick="ambilDatabase()">

🔄 AMBIL DATA REGISTER

</button>

<div class="filter">

<input
id="filterRegister"
type="text"
placeholder="Cari nomor register (bisa banyak)">

<input
id="filterTumpuk"
type="text"
placeholder="Nomor tumpuk, contoh: 1">

</div>

<div>

<button
class="btnFilter"
onclick="filterData()">

🔎 FILTER

</button>

<button
class="btnSemua"
onclick="tampilkanSemua()">

🔄 TAMPILKAN SEMUA

</button>

<button
class="btnPilih"
onclick="pilihHasilFilter()">

☑️ PILIH HASIL FILTER

</button>

<button
class="btnBatal"
onclick="batalHasilFilter()">

❌ BATAL HASIL FILTER

</button>

<button
class="btnPilih"
onclick="pilihSemua()">

☑️ PILIH SEMUA

</button>

<button
class="btnBatal"
onclick="batalSemua()">

❌ BATAL SEMUA

</button>

</div>

<button
class="btnDownload"
onclick="cetakF4()">

🖨️ CETAK F4 — 33 BARCODE / LEMBAR

</button>

<div class="status">

<div id="status">
Belum mengambil database
</div>

<div id="jumlah">
Jumlah barcode: 0
</div>

<div id="dipilih">
Dipilih: 0
</div>

</div>

</div>

<div id="grid"></div>

<div
    id="areaCetak"
    class="areaCetak">
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";

let database=[];


/* =====================================================
   KODE SINGKAT TPK
===================================================== */

const kodeTPK = {

    "SARADAN":"SRD",

    "MADIUN":"MDN",

    "PAGOTAN":"PGT",

    "BANJAREJO":"BJR",

    "KAMBANGAN":"KMB",

    "TAMANAN":"TMN"

};


/* =====================================================
   AMBIL KODE TPK
===================================================== */

function getKodeTPK(tpk){

    const nama =
        String(
            tpk || ""
        )
        .trim()
        .toUpperCase();

    /*
       Kalau dari DATABASE/API sudah berupa
       kode singkat, langsung gunakan.
    */

    if(
        nama === "SRD" ||
        nama === "MDN" ||
        nama === "PGT" ||
        nama === "BJR" ||
        nama === "KMB" ||
        nama === "TMN"
    ){

        return nama;

    }

    /*
       Kalau berupa nama TPK,
       ubah menjadi kode.
    */

    return kodeTPK[nama] || "";

}


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    const status =
        document.getElementById("status");

    status.innerHTML =
        "⏳ Mengambil DATABASE...";

    const callback =
        "database_"+Date.now();

    let script=null;

    window[callback] =
        function(hasil){

            if(
                !hasil ||
                hasil.status !== "success"
            ){

                status.innerHTML =
                    "❌ Gagal mengambil DATABASE";

                bersihkan();

                return;

            }

            database=[];

            const data =
                hasil.data || [];

            data.forEach(function(item){

                const register =
                    String(
                        item.register || ""
                    ).trim();

                const panjang =
                    String(
                        item.panjang || ""
                    ).trim();

                const diameter =
                    String(
                        item.diameter || ""
                    ).trim();

                const tumpuk =
                    String(
                        item.tumpuk || ""
                    ).trim();

                /*
                   Baca TPK dari API.
                   Dibuat menerima:
                   item.tpk
                   atau
                   item.TPK
                */

                const tpk =
                    String(
                        item.tpk ||
                        item.TPK ||
                        ""
                    )
                    .trim();

                /*
                   Ubah nama TPK menjadi kode singkat.
                */

                const kodeTPKItem =
                    getKodeTPK(tpk);

                if(!register){
                    return;
                }

                database.push({

                    register:register,

                    panjang:panjang,

                    diameter:diameter,

                    tumpuk:tumpuk,

                    tpk:kodeTPKItem,

                    dipilih:true

                });

            });

            tampilkan();

            updateJumlah();

            status.innerHTML =
                "✅ DATABASE berhasil diambil";

            bersihkan();

        };

    script =
        document.createElement("script");

    script.src =
        API_URL +
        "?getDatabase=1" +
        "&callback=" +
        callback;

    script.onerror =
        function(){

            status.innerHTML =
                "❌ Gagal menghubungi DATABASE";

            bersihkan();

        };

    document.body.appendChild(
        script
    );

    function bersihkan(){

        delete window[
            callback
        ];

        if(script){
            script.remove();
        }

    }

}


/* =====================================================
   TAMPILKAN DATABASE
===================================================== */

function tampilkan(){

    const grid =
        document.getElementById(
            "grid"
        );

    grid.innerHTML="";

    database.forEach(
        function(data,index){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "item";

            item.dataset.index =
                index;

            item.dataset.register =
                data.register.toLowerCase();

            item.dataset.tumpuk =
                data.tumpuk.toLowerCase();

            const check =
                document.createElement(
                    "input"
                );

            check.type =
                "checkbox";

            check.checked =
                data.dipilih;

            check.onchange =
                function(){

                    data.dipilih =
                        this.checked;

                    updateJumlah();

                };

            item.appendChild(
                check
            );

            const svg =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                );

            item.appendChild(
                svg
            );

            JsBarcode(

                svg,

                data.register,

                {

                    format:
                        "CODE128",

                    width:
                        1.8,

                    height:
                        55,

                    displayValue:
                        false,

                    margin:
                        6

                }

            );

            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "info";

            const register =
                document.createElement(
                    "span"
                );

            register.textContent =
                data.register;

            const ukuran =
                document.createElement(
                    "span"
                );

            ukuran.textContent =
                data.panjang +
                "/" +
                data.diameter;

            const tumpuk =
                document.createElement(
                    "span"
                );

            tumpuk.textContent =
                data.tumpuk;

            info.appendChild(
                register
            );

            info.appendChild(
                ukuran
            );

            info.appendChild(
                tumpuk
            );

            item.appendChild(
                info
            );

            grid.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   FILTER DATA
===================================================== */

function filterData(){

    const registerInput =
        document
        .getElementById(
            "filterRegister"
        )
        .value
        .trim();

    const tumpuk =
        document
        .getElementById(
            "filterTumpuk"
        )
        .value
        .trim()
        .toLowerCase();

    const daftarRegister =
        registerInput
        .split(/[\s,;]+/)
        .map(function(nomor){

            return nomor
                .trim()
                .toLowerCase();

        })
        .filter(function(nomor){

            return nomor !== "";

        });

    const registerUnik =
        [...new Set(
            daftarRegister
        )];

    let jumlahCocok =
        0;

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        const nilaiRegister =
            item.dataset.register;

        const nilaiTumpuk =
            item.dataset.tumpuk;

        let cocokRegister =
            registerUnik.length === 0;

        if(
            registerUnik.length > 0
        ){

            cocokRegister =
                registerUnik.includes(
                    nilaiRegister
                );

        }

        const cocokTumpuk =
            tumpuk === "" ||
            nilaiTumpuk === tumpuk;

        if(
            cocokRegister &&
            cocokTumpuk
        ){

            item.classList.remove(
                "hide"
            );

            jumlahCocok++;

        }

        else{

            item.classList.add(
                "hide"
            );

        }

    });

    if(
        registerUnik.length > 0
    ){

        document.getElementById(
            "status"
        ).innerHTML =
            "🔎 " +
            registerUnik.length +
            " nomor dicari — " +
            jumlahCocok +
            " ditemukan";

    }

    else if(
        tumpuk !== ""
    ){

        document.getElementById(
            "status"
        ).innerHTML =
            "🔎 Filter tumpuk — " +
            jumlahCocok +
            " ditemukan";

    }

    else{

        document.getElementById(
            "status"
        ).innerHTML =
            "🔎 Semua data ditampilkan";

    }

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterRegister"
    ).value="";

    document.getElementById(
        "filterTumpuk"
    ).value="";

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.classList.remove(
            "hide"
        );

    });

    document.getElementById(
        "status"
    ).innerHTML =
        "✅ Semua DATABASE ditampilkan";

}


/* =====================================================
   PILIH HASIL FILTER
===================================================== */

function pilihHasilFilter(){

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        if(
            item.classList.contains(
                "hide"
            )
        ){

            return;

        }

        const index =
            Number(
                item.dataset.index
            );

        database[index].dipilih=true;

        item.querySelector(
            "input"
        ).checked=true;

    });

    updateJumlah();

}


/* =====================================================
   BATAL HASIL FILTER
===================================================== */

function batalHasilFilter(){

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        if(
            item.classList.contains(
                "hide"
            )
        ){

            return;

        }

        const index =
            Number(
                item.dataset.index
            );

        database[index].dipilih=false;

        item.querySelector(
            "input"
        ).checked=false;

    });

    updateJumlah();

}


/* =====================================================
   PILIH SEMUA
===================================================== */

function pilihSemua(){

    database.forEach(
        function(data){

            data.dipilih=true;

        }
    );

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.querySelector(
            "input"
        ).checked=true;

    });

    updateJumlah();

}


/* =====================================================
   BATAL SEMUA
===================================================== */

function batalSemua(){

    database.forEach(
        function(data){

            data.dipilih=false;

        }
    );

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.querySelector(
            "input"
        ).checked=false;

    });

    updateJumlah();

}


/* =====================================================
   UPDATE JUMLAH
===================================================== */

function updateJumlah(){

    const jumlah =
        database.length;

    const dipilih =
        database.filter(
            function(data){

                return data.dipilih;

            }
        ).length;

    document.getElementById(
        "jumlah"
    ).innerHTML =
        "Jumlah barcode: " +
        jumlah;

    document.getElementById(
        "dipilih"
    ).innerHTML =
        "Dipilih: " +
        dipilih;

}


/* =====================================================
   CETAK F4
===================================================== */

function cetakF4(){

    const daftar=[];

    database.forEach(
        function(data){

            if(
                data.dipilih
            ){

                daftar.push(data);

            }

        }
    );

    if(
        daftar.length === 0
    ){

        alert(
            "Belum ada barcode yang dipilih."
        );

        return;

    }

    daftar.sort(
        function(a,b){

            const angkaA =
                parseInt(
                    String(
                        a.tumpuk
                    ).replace(
                        /[^0-9-]/g,
                        ""
                    )
                );

            const angkaB =
                parseInt(
                    String(
                        b.tumpuk
                    ).replace(
                        /[^0-9-]/g,
                        ""
                    )
                );

            const nilaiA =
                isNaN(
                    angkaA
                )
                ? Infinity
                : angkaA;

            const nilaiB =
                isNaN(
                    angkaB
                )
                ? Infinity
                : angkaB;

            return nilaiA - nilaiB;

        }
    );

    const area =
        document.getElementById(
            "areaCetak"
        );

    area.innerHTML="";

    const PER_LEMBAR =
        33;

    for(
        let awal=0;
        awal<daftar.length;
        awal+=PER_LEMBAR
    ){

        const lembar =
            document.createElement(
                "div"
            );

        lembar.className =
            "lembar";

        const bagian =
            daftar.slice(
                awal,
                awal+PER_LEMBAR
            );

        bagian.forEach(
            function(data){

                const label =
                    document.createElement(
                        "div"
                    );

                label.className =
                    "labelCetak";

                const barcodeBox =
                    document.createElement(
                        "div"
                    );

                barcodeBox.className =
                    "labelBarcode";

                const svg =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "svg"
                    );

                barcodeBox.appendChild(
                    svg
                );

                JsBarcode(

                    svg,

                    data.register,

                    {

                        format:
                            "CODE128",

                        width:
                            1.8,

                        height:
                            55,

                        displayValue:
                            false,

                        margin:
                            6

                    }

                );

                label.appendChild(
                    barcodeBox
                );

                const angka =
                    document.createElement(
                        "div"
                    );

                angka.className =
                    "angkaCetak";

                /*
                   TPK dicetak langsung setelah
                   nomor tumpuk.

                   Contoh:
                   12345 4000/30 1 SRD
                */

                const kode =
                    getKodeTPK(
                        data.tpk
                    );

                angka.textContent =
                    data.register +
                    " " +
                    data.panjang +
                    "/" +
                    data.diameter +
                    " " +
                    data.tumpuk +
                    (
                        kode
                        ? " " + kode
                        : ""
                    );

                label.appendChild(
                    angka
                );

                lembar.appendChild(
                    label
                );

            }
        );

        area.appendChild(
            lembar
        );

    }

    document.getElementById(
        "status"
    ).innerHTML =
        "🖨️ Siap mencetak " +
        daftar.length +
        " barcode — " +
        Math.ceil(
            daftar.length / 33
        ) +
        " lembar";

    setTimeout(
        function(){

            window.print();

        },
        300
    );

}


/* =====================================================
   SELESAI PRINT
===================================================== */

window.addEventListener(
    "afterprint",
    function(){

        const area =
            document.getElementById(
                "areaCetak"
            );

        area.innerHTML="";

    }
);

</script>

</body>

</html>
