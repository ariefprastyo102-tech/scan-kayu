<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Barcode Kayu</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}


/* =====================================================
   PANEL
===================================================== */

.kontrol{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
}

h2{
    text-align:center;
    margin-top:0;
}


/* =====================================================
   BUTTON
===================================================== */

button{
    border:none;
    border-radius:7px;
    padding:11px 15px;
    margin:4px;
    font-weight:bold;
    cursor:pointer;
}

.btnAmbil{
    width:100%;
    background:#1976d2;
    color:white;
}

.btnFilter{
    background:#1976d2;
    color:white;
}

.btnSemua{
    background:#607d8b;
    color:white;
}

.btnPilih{
    background:#388e3c;
    color:white;
}

.btnBatal{
    background:#d32f2f;
    color:white;
}

.btnDownload{
    width:100%;
    margin-top:15px;
    background:#6a1b9a;
    color:white;
}


/* =====================================================
   FILTER
===================================================== */

.filter{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.filter input{
    width:100%;
    padding:11px;
    border:1px solid #aaa;
    border-radius:7px;
    font-size:15px;
}


/* =====================================================
   STATUS
===================================================== */

.status{
    margin-top:15px;
    padding:12px;
    background:#f5f5f5;
    border-radius:7px;
    text-align:center;
    line-height:1.8;
}


/* =====================================================
   PREVIEW WEB
===================================================== */

#grid{
    max-width:1100px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.item{
    background:white;
    border:1px solid #aaa;
    padding:7px;
    text-align:center;
    position:relative;
}

.item.hide{
    display:none;
}

.item input{
    position:absolute;
    top:5px;
    left:5px;
    width:18px;
    height:18px;
}

.item svg{
    width:100%;
    height:70px;
    margin-top:15px;
}

.info{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    font-weight:bold;
    font-size:14px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .filter{
        grid-template-columns:1fr;
    }

    #grid{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>


<body>


<div class="kontrol">

<h2>
🪵 CETAK BARCODE KAYU
</h2>


<button
    class="btnAmbil"
    onclick="ambilDatabase()">

🔄 AMBIL DATA REGISTER

</button>


<div class="filter">

<input
    id="filterRegister"
    type="text"
    placeholder="Cari nomor register">

<input
    id="filterTumpuk"
    type="text"
    placeholder="Nomor tumpuk, contoh: 1">

</div>


<div>

<button
    class="btnFilter"
    onclick="filterData()">

🔎 FILTER

</button>


<button
    class="btnSemua"
    onclick="tampilkanSemua()">

🔄 TAMPILKAN SEMUA

</button>


<button
    class="btnPilih"
    onclick="pilihHasilFilter()">

☑️ PILIH HASIL FILTER

</button>


<button
    class="btnBatal"
    onclick="batalHasilFilter()">

❌ BATAL HASIL FILTER

</button>


<button
    class="btnPilih"
    onclick="pilihSemua()">

☑️ PILIH SEMUA

</button>


<button
    class="btnBatal"
    onclick="batalSemua()">

❌ BATAL SEMUA

</button>

</div>


<button
    class="btnDownload"
    onclick="downloadSVG()">

📥 DOWNLOAD MASTER SVG

</button>


<div class="status">

<div id="status">
Belum mengambil database
</div>

<div id="jumlah">
Jumlah barcode: 0
</div>

<div id="dipilih">
Dipilih: 0
</div>

</div>

</div>


<div id="grid"></div>


<script>


/* =====================================================
   API DATABASE
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


/* =====================================================
   DATABASE
===================================================== */

let database=[];


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    const status =
        document.getElementById("status");

    status.innerHTML =
        "⏳ Mengambil DATABASE...";


    const callback =
        "database_"+Date.now();


    window[callback] =
        function(hasil){

            if(
                !hasil ||
                hasil.status !== "success"
            ){

                status.innerHTML =
                    "❌ Gagal mengambil DATABASE";

                bersihkan();

                return;

            }


            database=[];


            const data =
                hasil.data || [];


            data.forEach(function(item){

                const register =
                    String(
                        item.register || ""
                    ).trim();


                const tumpuk =
                    String(
                        item.tumpuk || ""
                    ).trim();


                if(!register){

                    return;

                }


                database.push({

                    register:register,

                    tumpuk:tumpuk,

                    dipilih:true

                });

            });


            tampilkan();


            updateJumlah();


            status.innerHTML =
                "✅ DATABASE berhasil diambil";


            bersihkan();

        };


    const script =
        document.createElement("script");


    script.src =
        API_URL +
        "?getDatabase=1" +
        "&callback=" +
        callback;


    script.onerror =
        function(){

            status.innerHTML =
                "❌ Gagal menghubungi DATABASE";


            bersihkan();

        };


    document.body.appendChild(
        script
    );


    function bersihkan(){

        delete window[
            callback
        ];


        if(script){

            script.remove();

        }

    }

}


/* =====================================================
   TAMPILKAN DATABASE
===================================================== */

function tampilkan(){

    const grid =
        document.getElementById(
            "grid"
        );


    grid.innerHTML="";


    database.forEach(
        function(data,index){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item";


            item.dataset.index =
                index;


            item.dataset.register =
                data.register.toLowerCase();


            item.dataset.tumpuk =
                data.tumpuk.toLowerCase();


            /* CHECKBOX */

            const check =
                document.createElement(
                    "input"
                );


            check.type =
                "checkbox";


            check.checked =
                data.dipilih;


            check.onchange =
                function(){

                    data.dipilih =
                        this.checked;


                    updateJumlah();

                };


            item.appendChild(
                check
            );


            /* =================================================
               SVG BARCODE WEB
            ================================================= */

            const svg =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                );


            item.appendChild(
                svg
            );


            JsBarcode(

                svg,

                data.register,

                {

                    format:
                        "CODE128",

                    width:
                        2,

                    height:
                        55,

                    displayValue:
                        false,

                    margin:
                        3

                }

            );


            /* INFO */

            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "info";


            const register =
                document.createElement(
                    "span"
                );


            register.textContent =
                data.register;


            const tumpuk =
                document.createElement(
                    "span"
                );


            tumpuk.textContent =
                data.tumpuk;


            info.appendChild(
                register
            );


            info.appendChild(
                tumpuk
            );


            item.appendChild(
                info
            );


            grid.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   FILTER
===================================================== */

function filterData(){

    const register =
        document
        .getElementById(
            "filterRegister"
        )
        .value
        .trim()
        .toLowerCase();


    const tumpuk =
        document
        .getElementById(
            "filterTumpuk"
        )
        .value
        .trim()
        .toLowerCase();


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        const nilaiRegister =
            item.dataset.register;


        const nilaiTumpuk =
            item.dataset.tumpuk;


        const cocokRegister =
            register === "" ||
            nilaiRegister.includes(
                register
            );


        /*
         * TUMPUK HARUS SAMA PERSIS
         *
         * 1  = masuk
         * 11 = tidak
         * 12 = tidak
         * 13 = tidak
         */

        const cocokTumpuk =
            tumpuk === "" ||
            nilaiTumpuk === tumpuk;


        if(
            cocokRegister &&
            cocokTumpuk
        ){

            item.classList.remove(
                "hide"
            );

        }else{

            item.classList.add(
                "hide"
            );

        }

    });

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterRegister"
    ).value="";


    document.getElementById(
        "filterTumpuk"
    ).value="";


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.classList.remove(
            "hide"
        );

    });

}


/* =====================================================
   PILIH HASIL FILTER
===================================================== */

function pilihHasilFilter(){

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        if(
            item.classList.contains(
                "hide"
            )
        ){

            return;

        }


        const index =
            Number(
                item.dataset.index
            );


        database[index].dipilih=true;


        item.querySelector(
            "input"
        ).checked=true;

    });


    updateJumlah();

}


/* =====================================================
   BATAL HASIL FILTER
===================================================== */

function batalHasilFilter(){

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        if(
            item.classList.contains(
                "hide"
            )
        ){

            return;

        }


        const index =
            Number(
                item.dataset.index
            );


        database[index].dipilih=false;


        item.querySelector(
            "input"
        ).checked=false;

    });


    updateJumlah();

}


/* =====================================================
   PILIH SEMUA
===================================================== */

function pilihSemua(){

    database.forEach(
        function(data){

            data.dipilih=true;

        }
    );


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.querySelector(
            "input"
        ).checked=true;

    });


    updateJumlah();

}


/* =====================================================
   BATAL SEMUA
===================================================== */

function batalSemua(){

    database.forEach(
        function(data){

            data.dipilih=false;

        }
    );


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.querySelector(
            "input"
        ).checked=false;

    });


    updateJumlah();

}


/* =====================================================
   UPDATE JUMLAH
===================================================== */

function updateJumlah(){

    const jumlah =
        database.length;


    const dipilih =
        database.filter(
            function(data){

                return data.dipilih;

            }
        ).length;


    document.getElementById(
        "jumlah"
    ).innerHTML =
        "Jumlah barcode: " +
        jumlah;


    document.getElementById(
        "dipilih"
    ).innerHTML =
        "Dipilih: " +
        dipilih;

}


/* =====================================================
   DOWNLOAD MASTER SVG
===================================================== */

function downloadSVG(){

    const semuaItem =
        document.querySelectorAll(
            ".item"
        );


    const daftar=[];


    semuaItem.forEach(
        function(item){

            const index =
                Number(
                    item.dataset.index
                );


            if(
                database[index] &&
                database[index].dipilih
            ){

                daftar.push(item);

            }

        }
    );


    if(
        daftar.length === 0
    ){

        alert(
            "Belum ada barcode yang dipilih."
        );

        return;

    }


    /* =================================================
       UKURAN LABEL
       50 x 25 MM
    ================================================= */

    const LABEL_W =
        50;


    const LABEL_H =
        25;


    /* =================================================
       JARAK LABEL
    ================================================= */

    const GAP =
        2;


    /* =================================================
       MARGIN
    ================================================= */

    const MARGIN =
        10;


    /* =================================================
       KOLOM
    ================================================= */

    const COL =
        4;


    const ROW =
        Math.ceil(
            daftar.length / COL
        );


    /* =================================================
       KANVAS
    ================================================= */

    const CANVAS_W =
        MARGIN * 2 +
        (
            COL *
            LABEL_W
        ) +
        (
            (COL - 1) *
            GAP
        );


    const CANVAS_H =
        MARGIN * 2 +
        (
            ROW *
            LABEL_H
        ) +
        (
            (ROW - 1) *
            GAP
        );


    const NS =
        "http://www.w3.org/2000/svg";


    /* =================================================
       SVG MASTER
    ================================================= */

    const root =
        document.createElementNS(
            NS,
            "svg"
        );


    root.setAttribute(
        "xmlns",
        NS
    );


    root.setAttribute(
        "width",
        CANVAS_W + "mm"
    );


    root.setAttribute(
        "height",
        CANVAS_H + "mm"
    );


    root.setAttribute(
        "viewBox",
        "0 0 " +
        CANVAS_W +
        " " +
        CANVAS_H
    );


    /* =================================================
       BACKGROUND
    ================================================= */

    const background =
        document.createElementNS(
            NS,
            "rect"
        );


    background.setAttribute(
        "x",
        0
    );


    background.setAttribute(
        "y",
        0
    );


    background.setAttribute(
        "width",
        CANVAS_W
    );


    background.setAttribute(
        "height",
        CANVAS_H
    );


    background.setAttribute(
        "fill",
        "white"
    );


    root.appendChild(
        background
    );


    /* =================================================
       BUAT LABEL
    ================================================= */

    daftar.forEach(
        function(item,index){

            const col =
                index % COL;


            const row =
                Math.floor(
                    index / COL
                );


            const labelX =
                MARGIN +
                col *
                (
                    LABEL_W +
                    GAP
                );


            const labelY =
                MARGIN +
                row *
                (
                    LABEL_H +
                    GAP
                );


            /* =================================================
               GROUP LABEL
            ================================================= */

            const group =
                document.createElementNS(
                    NS,
                    "g"
                );


            group.setAttribute(
                "transform",
                "translate(" +
                labelX +
                " " +
                labelY +
                ")"
            );


            /* =================================================
               KOTAK LABEL
            ================================================= */

            const border =
                document.createElementNS(
                    NS,
                    "rect"
                );


            border.setAttribute(
                "x",
                0
            );


            border.setAttribute(
                "y",
                0
            );


            border.setAttribute(
                "width",
                LABEL_W
            );


            border.setAttribute(
                "height",
                LABEL_H
            );


            border.setAttribute(
                "fill",
                "white"
            );


            border.setAttribute(
                "stroke",
                "black"
            );


            border.setAttribute(
                "stroke-width",
                "0.25"
            );


            group.appendChild(
                border
            );


            /* =================================================
               AMBIL BARCODE ASLI DARI WEB
            ================================================= */

            const svgWeb =
                item.querySelector(
                    "svg"
                );


            if(svgWeb){

                const clone =
                    svgWeb.cloneNode(
                        true
                    );


                /* =================================================
                   UKURAN BARCODE
                ================================================= */

                const BARCODE_W =
                    47;


                const BARCODE_H =
                    17;


                /* =================================================
                   POSISI BARCODE
                ================================================= */

                const barcodeX =
                    (
                        LABEL_W -
                        BARCODE_W
                    ) / 2;


                const barcodeY =
                    1;


                clone.setAttribute(
                    "x",
                    barcodeX
                );


                clone.setAttribute(
                    "y",
                    barcodeY
                );


                clone.setAttribute(
                    "width",
                    BARCODE_W
                );


                clone.setAttribute(
                    "height",
                    BARCODE_H
                );


                clone.setAttribute(
                    "preserveAspectRatio",
                    "none"
                );


                clone.removeAttribute(
                    "style"
                );


                group.appendChild(
                    clone
                );

            }


            /* =================================================
               AMBIL ANGKA DARI WEB
            ================================================= */

            const info =
                item.querySelector(
                    ".info"
                );


            let registerText =
                "";


            let tumpukText =
                "";


            if(info){

                const teks =
                    info.querySelectorAll(
                        "span"
                    );


                if(teks[0]){

                    registerText =
                        teks[0].textContent;

                }


                if(teks[1]){

                    tumpukText =
                        teks[1].textContent;

                }

            }


            /* =================================================
               REGISTER + TUMPUK
               
               SATU TEKS
               POSISI BENAR-BENAR TENGAH
            ================================================= */

            const angka =
                document.createElementNS(
                    NS,
                    "text"
                );


            angka.setAttribute(
                "x",
                LABEL_W / 2
            );


            angka.setAttribute(
                "y",
                "21.5"
            );


            angka.setAttribute(
                "text-anchor",
                "middle"
            );


            angka.setAttribute(
                "dominant-baseline",
                "middle"
            );


            angka.setAttribute(
                "font-family",
                "Arial"
            );


            angka.setAttribute(
                "font-size",
                "4"
            );


            angka.setAttribute(
                "font-weight",
                "bold"
            );


            /*
             * Register dan Tumpuk dibuat
             * menjadi SATU tulisan.
             *
             * 3 spasi supaya agak renggang.
             */

            angka.textContent =
                registerText +
                "   " +
                tumpukText;


            group.appendChild(
                angka
            );


            /* =================================================
               MASUKKAN LABEL
            ================================================= */

            root.appendChild(
                group
            );

        }
    );


    /* =================================================
       SERIALIZE SVG
    ================================================= */

    const serializer =
        new XMLSerializer();


    let source =
        serializer.serializeToString(
            root
        );


    source =
        '<?xml version="1.0" encoding="UTF-8"?>\n' +
        source;


    /* =================================================
       DOWNLOAD
    ================================================= */

    const blob =
        new Blob(
            [source],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "MASTER-BARCODE-KAYU.svg";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );


    document.getElementById(
        "status"
    ).innerHTML =
        "✅ MASTER SVG selesai — " +
        daftar.length +
        " barcode";

}

</script>

</body>
</html>
