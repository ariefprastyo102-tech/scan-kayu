<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cetak Barcode Tumpuk</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.kontrol{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
}

h2{
    text-align:center;
    margin-top:0;
}


/* =====================================================
   JUDUL
===================================================== */

.judulBarcode{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:15px;
}

.judulBarcode img{
    width:50px !important;
    height:50px !important;
    max-width:50px !important;
    max-height:50px !important;
    object-fit:contain;
    display:block;
}

.judulBarcode h2{
    margin:0;
}


/* =====================================================
   BUTTON
===================================================== */

button{
    border:none;
    border-radius:7px;
    padding:11px 15px;
    margin:4px;
    font-weight:bold;
    cursor:pointer;
}

.btnAmbil{
    width:100%;
    background:#1976d2;
    color:white;
}

.btnFilter{
    background:#1976d2;
    color:white;
}

.btnSemua{
    background:#607d8b;
    color:white;
}

.btnPilih{
    background:#388e3c;
    color:white;
}

.btnBatal{
    background:#d32f2f;
    color:white;
}

.btnDownload{
    width:100%;
    margin-top:15px;
    background:#6a1b9a;
    color:white;
}


/* =====================================================
   FILTER
===================================================== */

.filter{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.filter input{
    width:100%;
    padding:11px;
    border:1px solid #aaa;
    border-radius:7px;
    font-size:15px;
}


/* =====================================================
   STATUS
===================================================== */

.status{
    margin-top:15px;
    padding:12px;
    background:#f5f5f5;
    border-radius:7px;
    text-align:center;
    line-height:1.8;
}


/* =====================================================
   GRID DATA
===================================================== */

#grid{
    max-width:1100px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.item{
    background:#fff700;
    border:2px solid #111;
    padding:10px;
    text-align:center;
    position:relative;
    border-radius:5px;
}

.item.hide{
    display:none;
}

.item input{
    position:absolute;
    top:7px;
    left:7px;
    width:18px;
    height:18px;
}

.item svg{
    width:100%;
    height:70px;
    margin-top:15px;
}

.info{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:3px;
    font-weight:bold;
}

.info .tumpuk{
    font-size:25px;
}

.info .tpk{
    font-size:17px;
}

.info .jumlah{
    font-size:14px;
}

.areaCetak{
    display:none;
}


/* =====================================================
   CETAK F4
   1 LEMBAR = 8 LABEL
   2 KOLOM × 4 BARIS
===================================================== */

@media print{

    @page{
        size:215.9mm 330.2mm;
        margin:0;
    }

    html,
    body{
        width:215.9mm;
        height:330.2mm;
        margin:0;
        padding:0;
        background:white;
    }

    body{
        font-family:Arial,sans-serif;
    }

    .kontrol,
    #grid{
        display:none !important;
    }

    .areaCetak{
        display:block;
        width:215.9mm;
        height:330.2mm;
    }


    /* =================================================
       LEMBAR F4
    ================================================= */

    .lembar{

        width:215.9mm;
        height:330.2mm;

        page-break-after:always;
        page-break-inside:avoid;

        display:grid;

        grid-template-columns:
            107.95mm 107.95mm;

        grid-template-rows:
            repeat(4,82.55mm);

        column-gap:0;
        row-gap:0;

        padding:0;

        box-sizing:border-box;

        overflow:hidden;
    }

    .lembar:last-child{
        page-break-after:auto;
    }


    /* =================================================
       LABEL
    ================================================= */

    .labelCetak{

        width:107.95mm;
        height:82.55mm;

        border:0.3mm solid black;

        background:#fff700;

        position:relative;

        overflow:hidden;

        display:block;
    }


    /* =================================================
       BARCODE
    ================================================= */

    .labelBarcode{

        position:absolute;

        left:9mm;

        top:6mm;

        width:89.95mm;

        height:43mm;

        overflow:hidden;

        display:flex;

        align-items:center;

        justify-content:center;
    }

    .labelBarcode svg{

        display:block;

        width:89.95mm !important;

        height:43mm !important;

    }


    /* =================================================
       TULISAN TUMPUK + TPK
    ================================================= */

    .infoCetak{

        position:absolute;

        left:0;

        bottom:4mm;

        width:107.95mm;

        height:27mm;

        display:flex;

        flex-direction:column;

        align-items:center;

        justify-content:center;

        text-align:center;

        font-family:Arial,sans-serif;

        line-height:1;

    }

    .tumpukCetak{

        font-size:14mm;

        font-weight:900;

        line-height:1;

        white-space:nowrap;
    }

    .tpkCetak{

        margin-top:2mm;

        font-size:6mm;

        font-weight:bold;

        line-height:1;

        white-space:nowrap;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .filter{
        grid-template-columns:1fr;
    }

    #grid{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>


<body>


<div class="kontrol">


<div class="judulBarcode">

<img
    src="logo-perhutani.jpg"
    alt="Logo Perhutani"
>

<h2>
    CETAK BARCODE TUMPUK
</h2>

</div>


<button
class="btnAmbil"
onclick="ambilDatabase()">

🔄 AMBIL DATA TUMPUK

</button>


<div class="filter">

<input
id="filterTumpuk"
type="text"
placeholder="Cari nomor tumpuk">

<input
id="filterTpk"
type="text"
placeholder="Cari TPK">

</div>


<div>

<button
class="btnFilter"
onclick="filterData()">

🔎 FILTER

</button>


<button
class="btnSemua"
onclick="tampilkanSemua()">

🔄 TAMPILKAN SEMUA

</button>


<button
class="btnPilih"
onclick="pilihHasilFilter()">

☑️ PILIH HASIL FILTER

</button>


<button
class="btnBatal"
onclick="batalHasilFilter()">

❌ BATAL HASIL FILTER

</button>


<button
class="btnPilih"
onclick="pilihSemua()">

☑️ PILIH SEMUA

</button>


<button
class="btnBatal"
onclick="batalSemua()">

❌ BATAL SEMUA

</button>

</div>


<button
class="btnDownload"
onclick="cetakF4()">

🖨️ CETAK F4 — 8 BARCODE / LEMBAR

</button>


<div class="status">

<div id="status">
Belum mengambil database
</div>

<div id="jumlah">
Jumlah tumpuk: 0
</div>

<div id="dipilih">
Dipilih: 0
</div>

</div>


</div>


<div id="grid"></div>


<div
id="areaCetak"
class="areaCetak">
</div>


<script>


/* =====================================================
   API TUMPUK
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


let database=[];


/* =====================================================
   AMBIL DATA TUMPUK
===================================================== */

function ambilDatabase(){

    const status =
        document.getElementById("status");

    status.innerHTML =
        "⏳ Mengambil DATA TUMPUK...";


    const callback =
        "tumpuk_"+Date.now();


    let script=null;


    window[callback] =
        function(hasil){

            if(
                !hasil ||
                hasil.status !== "success"
            ){

                status.innerHTML =
                    "❌ Gagal mengambil DATA TUMPUK";

                bersihkan();

                return;

            }


            database=[];


            const data =
                hasil.data || [];


            data.forEach(function(item){

                const tpk =
                    String(
                        item.tpk || ""
                    ).trim();


                const tumpuk =
                    String(
                        item.tumpuk || ""
                    ).trim();


                if(!tumpuk){
                    return;
                }


                const stackId =
                    String(
                        item.stackId ||
                        (
                            tpk +
                            "|" +
                            tumpuk
                        )
                    ).trim();


                database.push({

                    stackId:stackId,

                    tpk:tpk,

                    tumpuk:tumpuk,

                    jumlahAwal:
                        item.jumlahAwal || 0,

                    volumeAwal:
                        item.volumeAwal || 0,

                    dipilih:true

                });

            });


            tampilkan();

            updateJumlah();


            status.innerHTML =
                "✅ DATA TUMPUK berhasil diambil";


            bersihkan();

        };


    script =
        document.createElement("script");


    script.src =
        API_URL +
        "?action=getTumpukList" +
        "&callback=" +
        encodeURIComponent(
            callback
        );


    script.onerror =
        function(){

            status.innerHTML =
                "❌ Gagal menghubungi DATA TUMPUK";

            bersihkan();

        };


    document.body.appendChild(
        script
    );


    function bersihkan(){

        delete window[
            callback
        ];


        if(script){
            script.remove();
        }

    }

}


/* =====================================================
   TAMPILKAN
===================================================== */

function tampilkan(){

    const grid =
        document.getElementById(
            "grid"
        );


    grid.innerHTML="";


    database.forEach(
        function(data,index){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item";


            item.dataset.index =
                index;


            item.dataset.tumpuk =
                data.tumpuk
                .toLowerCase();


            item.dataset.tpk =
                data.tpk
                .toLowerCase();


            const check =
                document.createElement(
                    "input"
                );


            check.type =
                "checkbox";


            check.checked =
                data.dipilih;


            check.onchange =
                function(){

                    data.dipilih =
                        this.checked;

                    updateJumlah();

                };


            item.appendChild(
                check
            );


            const svg =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                );


            item.appendChild(
                svg
            );


            const barcodeValue =
                String(
                    data.stackId
                ).trim();


            JsBarcode(

                svg,

                barcodeValue,

                {

                    format:
                        "CODE128",

                    width:
                        2,

                    height:
                        55,

                    displayValue:
                        false,

                    margin:
                        5

                }

            );


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "info";


            const tumpuk =
                document.createElement(
                    "div"
                );


            tumpuk.className =
                "tumpuk";


            tumpuk.textContent =
                "TUMPUK " +
                data.tumpuk;


            const tpk =
                document.createElement(
                    "div"
                );


            tpk.className =
                "tpk";


            tpk.textContent =
                "TPK ASAL : " +
                data.tpk;


            const jumlah =
                document.createElement(
                    "div"
                );


            jumlah.className =
                "jumlah";


            jumlah.textContent =
                "JUMLAH AWAL : " +
                data.jumlahAwal +
                " BATANG";


            info.appendChild(
                tumpuk
            );


            info.appendChild(
                tpk
            );


            info.appendChild(
                jumlah
            );


            item.appendChild(
                info
            );


            grid.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   FILTER
===================================================== */

function filterData(){

    const tumpuk =
        document
        .getElementById(
            "filterTumpuk"
        )
        .value
        .trim()
        .toLowerCase();


    const tpk =
        document
        .getElementById(
            "filterTpk"
        )
        .value
        .trim()
        .toLowerCase();


    let jumlahCocok =
        0;


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        const nilaiTumpuk =
            item.dataset.tumpuk;


        const nilaiTpk =
            item.dataset.tpk;


        /*
           TUMPUK HARUS EXACT MATCH

           Jadi:
           1  ≠  11
           1  ≠  12
           29 = 29
        */

        const cocokTumpuk =
            tumpuk === "" ||
            nilaiTumpuk === tumpuk;


        const cocokTpk =
            tpk === "" ||
            nilaiTpk.includes(tpk);


        if(
            cocokTumpuk &&
            cocokTpk
        ){

            item.classList.remove(
                "hide"
            );

            jumlahCocok++;

        }

        else{

            item.classList.add(
                "hide"
            );

        }

    });


    if(
        tumpuk !== "" &&
        tpk !== ""
    ){

        document.getElementById(
            "status"
        ).innerHTML =
            "🔎 Tumpuk " +
            tumpuk +
            " + TPK " +
            tpk +
            " — " +
            jumlahCocok +
            " ditemukan";

    }

    else if(
        tumpuk !== ""
    ){

        document.getElementById(
            "status"
        ).innerHTML =
            "🔎 Tumpuk " +
            tumpuk +
            " — " +
            jumlahCocok +
            " ditemukan";

    }

    else if(
        tpk !== ""
    ){

        document.getElementById(
            "status"
        ).innerHTML =
            "🔎 TPK " +
            tpk +
            " — " +
            jumlahCocok +
            " ditemukan";

    }

    else{

        document.getElementById(
            "status"
        ).innerHTML =
            "🔎 Semua data ditampilkan";

    }

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterTumpuk"
    ).value="";


    document.getElementById(
        "filterTpk"
    ).value="";


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.classList.remove(
            "hide"
        );

    });


    document.getElementById(
        "status"
    ).innerHTML =
        "✅ Semua DATA TUMPUK ditampilkan";

}


/* =====================================================
   PILIH HASIL FILTER
===================================================== */

function pilihHasilFilter(){

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        if(
            item.classList.contains(
                "hide"
            )
        ){

            return;

        }


        const index =
            Number(
                item.dataset.index
            );


        database[index].dipilih=true;


        item.querySelector(
            "input"
        ).checked=true;

    });


    updateJumlah();

}


/* =====================================================
   BATAL HASIL FILTER
===================================================== */

function batalHasilFilter(){

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        if(
            item.classList.contains(
                "hide"
            )
        ){

            return;

        }


        const index =
            Number(
                item.dataset.index
            );


        database[index].dipilih=false;


        item.querySelector(
            "input"
        ).checked=false;

    });


    updateJumlah();

}


/* =====================================================
   PILIH SEMUA
===================================================== */

function pilihSemua(){

    database.forEach(
        function(data){

            data.dipilih=true;

        }
    );


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.querySelector(
            "input"
        ).checked=true;

    });


    updateJumlah();

}


/* =====================================================
   BATAL SEMUA
===================================================== */

function batalSemua(){

    database.forEach(
        function(data){

            data.dipilih=false;

        }
    );


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.querySelector(
            "input"
        ).checked=false;

    });


    updateJumlah();

}


/* =====================================================
   UPDATE JUMLAH
===================================================== */

function updateJumlah(){

    const jumlah =
        database.length;


    const dipilih =
        database.filter(
            function(data){

                return data.dipilih;

            }
        ).length;


    document.getElementById(
        "jumlah"
    ).innerHTML =
        "Jumlah tumpuk: " +
        jumlah;


    document.getElementById(
        "dipilih"
    ).innerHTML =
        "Dipilih: " +
        dipilih;

}


/* =====================================================
   CETAK F4
   8 LABEL / LEMBAR
===================================================== */

function cetakF4(){

    const daftar=[];


    database.forEach(
        function(data){

            if(
                data.dipilih
            ){

                daftar.push(data);

            }

        }
    );


    if(
        daftar.length === 0
    ){

        alert(
            "Belum ada tumpuk yang dipilih."
        );

        return;

    }


    /*
       Urutkan berdasarkan nomor TUMPUK
    */

    daftar.sort(
        function(a,b){

            const angkaA =
                parseInt(
                    String(
                        a.tumpuk
                    ).replace(
                        /[^0-9-]/g,
                        ""
                    )
                );


            const angkaB =
                parseInt(
                    String(
                        b.tumpuk
                    ).replace(
                        /[^0-9-]/g,
                        ""
                    )
                );


            const nilaiA =
                isNaN(
                    angkaA
                )
                ? Infinity
                : angkaA;


            const nilaiB =
                isNaN(
                    angkaB
                )
                ? Infinity
                : angkaB;


            return nilaiA - nilaiB;

        }
    );


    const area =
        document.getElementById(
            "areaCetak"
        );


    area.innerHTML="";


    /*
       8 LABEL / LEMBAR
    */

    const PER_LEMBAR =
        8;


    for(
        let awal=0;
        awal<daftar.length;
        awal+=PER_LEMBAR
    ){

        const lembar =
            document.createElement(
                "div"
            );


        lembar.className =
            "lembar";


        const bagian =
            daftar.slice(
                awal,
                awal+PER_LEMBAR
            );


        bagian.forEach(
            function(data){

                const label =
                    document.createElement(
                        "div"
                    );


                label.className =
                    "labelCetak";


                /*
                   BOX BARCODE
                */

                const barcodeBox =
                    document.createElement(
                        "div"
                    );


                barcodeBox.className =
                    "labelBarcode";


                const svg =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "svg"
                    );


                barcodeBox.appendChild(
                    svg
                );


                JsBarcode(

                    svg,

                    String(
                        data.stackId
                    ).trim(),

                    {

                        format:
                            "CODE128",

                        width:
                            2,

                        height:
                            55,

                        displayValue:
                            false,

                        margin:
                            4

                    }

                );


                label.appendChild(
                    barcodeBox
                );


                /*
                   INFO TUMPUK
                */

                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "infoCetak";


                const tumpuk =
                    document.createElement(
                        "div"
                    );


                tumpuk.className =
                    "tumpukCetak";


                tumpuk.textContent =
                    "TUMPUK " +
                    data.tumpuk;


                const tpk =
                    document.createElement(
                        "div"
                    );


                tpk.className =
                    "tpkCetak";


                tpk.textContent =
                    "TPK ASAL : " +
                    data.tpk;


                info.appendChild(
                    tumpuk
                );


                info.appendChild(
                    tpk
                );


                label.appendChild(
                    info
                );


                lembar.appendChild(
                    label
                );

            }
        );


        area.appendChild(
            lembar
        );

    }


    document.getElementById(
        "status"
    ).innerHTML =
        "🖨️ Siap mencetak " +
        daftar.length +
        " barcode — " +
        Math.ceil(
            daftar.length / 8
        ) +
        " lembar";


    setTimeout(
        function(){

            window.print();

        },
        300
    );

}


/* =====================================================
   SELESAI PRINT
===================================================== */

window.addEventListener(
    "afterprint",
    function(){

        const area =
            document.getElementById(
                "areaCetak"
            );


        area.innerHTML="";

    }
);


</script>

</body>

</html>
