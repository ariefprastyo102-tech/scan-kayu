<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Barcode Kayu</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}


/* =====================================================
   PANEL
===================================================== */

.kontrol{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
}


h2{
    text-align:center;
    margin-top:0;
}


/* =====================================================
   BUTTON
===================================================== */

button{
    border:none;
    border-radius:7px;
    padding:11px 15px;
    margin:4px;
    font-weight:bold;
    cursor:pointer;
}


.btnAmbil{
    width:100%;
    background:#1976d2;
    color:white;
}


.btnFilter{
    background:#1976d2;
    color:white;
}


.btnSemua{
    background:#607d8b;
    color:white;
}


.btnPilih{
    background:#388e3c;
    color:white;
}


.btnBatal{
    background:#d32f2f;
    color:white;
}


.btnDownload{
    width:100%;
    margin-top:15px;
    background:#6a1b9a;
    color:white;
}


/* =====================================================
   FILTER
===================================================== */

.filter{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}


.filter input{
    width:100%;
    padding:11px;
    border:1px solid #aaa;
    border-radius:7px;
    font-size:15px;
}


/* =====================================================
   STATUS
===================================================== */

.status{
    margin-top:15px;
    padding:12px;
    background:#f5f5f5;
    border-radius:7px;
    text-align:center;
    line-height:1.8;
}


/* =====================================================
   PREVIEW
===================================================== */

#grid{
    max-width:1100px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}


.item{
    background:white;
    border:1px solid #aaa;
    padding:7px;
    text-align:center;
    position:relative;
}


.item.hide{
    display:none;
}


.item input{
    position:absolute;
    top:5px;
    left:5px;
    width:18px;
    height:18px;
}


.item svg{
    width:100%;
    height:70px;
    margin-top:15px;
}


.info{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    font-weight:bold;
    font-size:14px;
}


@media(max-width:700px){

    .filter{
        grid-template-columns:1fr;
    }

    #grid{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>


<body>


<div class="kontrol">

<h2>
🪵 CETAK BARCODE KAYU
</h2>


<button
    class="btnAmbil"
    onclick="ambilDatabase()">

🔄 AMBIL DATA REGISTER

</button>


<div class="filter">

<input
    id="filterRegister"
    type="text"
    placeholder="Cari nomor register">


<input
    id="filterTumpuk"
    type="text"
    placeholder="Nomor tumpuk, contoh: 1">

</div>


<div>

<button
    class="btnFilter"
    onclick="filterData()">

🔎 FILTER

</button>


<button
    class="btnSemua"
    onclick="tampilkanSemua()">

🔄 TAMPILKAN SEMUA

</button>


<button
    class="btnPilih"
    onclick="pilihHasilFilter()">

☑️ PILIH HASIL FILTER

</button>


<button
    class="btnBatal"
    onclick="batalHasilFilter()">

❌ BATAL HASIL FILTER

</button>


<button
    class="btnPilih"
    onclick="pilihSemua()">

☑️ PILIH SEMUA

</button>


<button
    class="btnBatal"
    onclick="batalSemua()">

❌ BATAL SEMUA

</button>

</div>


<button
    class="btnDownload"
    onclick="downloadSVG()">

📥 DOWNLOAD MASTER SVG

</button>


<div class="status">

<div id="status">
Belum mengambil database
</div>

<div id="jumlah">
Jumlah barcode: 0
</div>

<div id="dipilih">
Dipilih: 0
</div>

</div>

</div>


<div id="grid"></div>


<script>


/* =====================================================
   API DATABASE
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


/* =====================================================
   DATABASE
===================================================== */

let database=[];


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    const status =
        document.getElementById("status");

    status.innerHTML =
        "⏳ Mengambil DATABASE...";


    const callback =
        "database_"+Date.now();


    window[callback] =
        function(hasil){

            if(
                !hasil ||
                hasil.status !== "success"
            ){

                status.innerHTML =
                    "❌ Gagal mengambil DATABASE";

                bersihkan();

                return;
            }


            database=[];


            const data =
                hasil.data || [];


            data.forEach(function(item){

                const register =
                    String(
                        item.register || ""
                    ).trim();


                const tumpuk =
                    String(
                        item.tumpuk || ""
                    ).trim();


                if(!register){
                    return;
                }


                database.push({

                    register:register,

                    tumpuk:tumpuk,

                    dipilih:true

                });

            });


            tampilkan();

            updateJumlah();


            status.innerHTML =
                "✅ DATABASE berhasil diambil";


            bersihkan();

        };


    const script =
        document.createElement("script");


    script.src =
        API_URL +
        "?getDatabase=1" +
        "&callback=" +
        callback;


    script.onerror =
        function(){

            status.innerHTML =
                "❌ Gagal menghubungi DATABASE";

            bersihkan();

        };


    document.body.appendChild(
        script
    );


    function bersihkan(){

        delete window[
            callback
        ];


        if(script){
            script.remove();
        }

    }

}


/* =====================================================
   TAMPILKAN PREVIEW
===================================================== */

function tampilkan(){

    const grid =
        document.getElementById(
            "grid"
        );


    grid.innerHTML="";


    database.forEach(
        function(data,index){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item";


            item.dataset.index =
                index;


            item.dataset.register =
                data.register.toLowerCase();


            item.dataset.tumpuk =
                data.tumpuk.toLowerCase();


            /* CHECKBOX */

            const check =
                document.createElement(
                    "input"
                );


            check.type =
                "checkbox";


            check.checked =
                data.dipilih;


            check.onchange =
                function(){

                    data.dipilih =
                        this.checked;

                    updateJumlah();

                };


            item.appendChild(
                check
            );


            /* BARCODE */

            const svg =
                document.createElementNS(

                    "http://www.w3.org/2000/svg",

                    "svg"

                );


            item.appendChild(
                svg
            );


            JsBarcode(

                svg,

                data.register,

                {

                    format:
                        "CODE128",

                    width:
                        2,

                    height:
                        55,

                    displayValue:
                        false,

                    margin:
                        3

                }

            );


            /* INFO */

            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "info";


            const register =
                document.createElement(
                    "span"
                );


            register.textContent =
                data.register;


            const tumpuk =
                document.createElement(
                    "span"
                );


            tumpuk.textContent =
                data.tumpuk;


            info.appendChild(
                register
            );


            info.appendChild(
                tumpuk
            );


            item.appendChild(
                info
            );


            grid.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   FILTER
===================================================== */

function filterData(){

    const register =
        document
        .getElementById(
            "filterRegister"
        )
        .value
        .trim()
        .toLowerCase();


    const tumpuk =
        document
        .getElementById(
            "filterTumpuk"
        )
        .value
        .trim()
        .toLowerCase();


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        const nilaiRegister =
            item.dataset.register;


        const nilaiTumpuk =
            item.dataset.tumpuk;


        const cocokRegister =
            register === "" ||
            nilaiRegister.includes(
                register
            );


        const cocokTumpuk =
            tumpuk === "" ||
            nilaiTumpuk === tumpuk;


        if(
            cocokRegister &&
            cocokTumpuk
        ){

            item.classList.remove(
                "hide"
            );

        }else{

            item.classList.add(
                "hide"
            );

        }

    });

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterRegister"
    ).value="";


    document.getElementById(
        "filterTumpuk"
    ).value="";


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.classList.remove(
            "hide"
        );

    });

}


/* =====================================================
   PILIH HASIL FILTER
===================================================== */

function pilihHasilFilter(){

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        if(
            item.classList.contains(
                "hide"
            )
        ){
            return;
        }


        const index =
            Number(
                item.dataset.index
            );


        database[index].dipilih=true;


        item.querySelector(
            "input"
        ).checked=true;

    });


    updateJumlah();

}


/* =====================================================
   BATAL HASIL FILTER
===================================================== */

function batalHasilFilter(){

    document
    .querySelectorAll(".item")
    .forEach(function(item){

        if(
            item.classList.contains(
                "hide"
            )
        ){
            return;
        }


        const index =
            Number(
                item.dataset.index
            );


        database[index].dipilih=false;


        item.querySelector(
            "input"
        ).checked=false;

    });


    updateJumlah();

}


/* =====================================================
   PILIH SEMUA
===================================================== */

function pilihSemua(){

    database.forEach(
        function(data){

            data.dipilih=true;

        }
    );


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.querySelector(
            "input"
        ).checked=true;

    });


    updateJumlah();

}


/* =====================================================
   BATAL SEMUA
===================================================== */

function batalSemua(){

    database.forEach(
        function(data){

            data.dipilih=false;

        }
    );


    document
    .querySelectorAll(".item")
    .forEach(function(item){

        item.querySelector(
            "input"
        ).checked=false;

    });


    updateJumlah();

}


/* =====================================================
   UPDATE JUMLAH
===================================================== */

function updateJumlah(){

    const jumlah =
        database.length;


    const dipilih =
        database.filter(
            function(data){

                return data.dipilih;

            }
        ).length;


    document.getElementById(
        "jumlah"
    ).innerHTML =
        "Jumlah barcode: " +
        jumlah;


    document.getElementById(
        "dipilih"
    ).innerHTML =
        "Dipilih: " +
        dipilih;

}


/* =====================================================
   DOWNLOAD MASTER SVG
   =====================================================

   PENTING:

   Bagian ini TIDAK membuat barcode baru.

   Barcode yang sudah tampil di WEB
   langsung disalin ke MASTER SVG.

   Jadi bentuk barcode mengikuti
   barcode yang sudah lu lihat di web.
===================================================== */

function downloadSVG(){

    const daftar =
        database.filter(
            function(data){
                return data.dipilih;
            }
        );


    if(
        daftar.length === 0
    ){

        alert(
            "Belum ada barcode yang dipilih."
        );

        return;

    }


    /* =================================================
       UKURAN LABEL

       50 x 25 mm
    ================================================= */

    const LABEL_W = 50;
    const LABEL_H = 25;


    /* =================================================
       JARAK ANTAR LABEL
    ================================================= */

    const GAP = 2;


    /* =================================================
       MARGIN
    ================================================= */

    const MARGIN = 10;


    /* =================================================
       JUMLAH KOLOM
    ================================================= */

    const COL = 4;


    const ROW =
        Math.ceil(
            daftar.length / COL
        );


    /* =================================================
       UKURAN KANVAS
    ================================================= */

    const CANVAS_W =
        MARGIN * 2 +
        (COL * LABEL_W) +
        ((COL - 1) * GAP);


    const CANVAS_H =
        MARGIN * 2 +
        (ROW * LABEL_H) +
        ((ROW - 1) * GAP);


    const NS =
        "http://www.w3.org/2000/svg";


    /* =================================================
       ROOT SVG
    ================================================= */

    const root =
        document.createElementNS(
            NS,
            "svg"
        );


    root.setAttribute(
        "xmlns",
        NS
    );


    root.setAttribute(
        "width",
        CANVAS_W + "mm"
    );


    root.setAttribute(
        "height",
        CANVAS_H + "mm"
    );


    root.setAttribute(
        "viewBox",
        "0 0 " +
        CANVAS_W +
        " " +
        CANVAS_H
    );


    /* =================================================
       BACKGROUND
    ================================================= */

    const bg =
        document.createElementNS(
            NS,
            "rect"
        );


    bg.setAttribute(
        "x",
        0
    );


    bg.setAttribute(
        "y",
        0
    );


    bg.setAttribute(
        "width",
        CANVAS_W
    );


    bg.setAttribute(
        "height",
        CANVAS_H
    );


    bg.setAttribute(
        "fill",
        "white"
    );


    root.appendChild(
        bg
    );


    /* =================================================
       BUAT LABEL
    ================================================= */

    daftar.forEach(
        function(data,index){

            const col =
                index % COL;


            const row =
                Math.floor(
                    index / COL
                );


            const x =
                MARGIN +
                col *
                (
                    LABEL_W +
                    GAP
                );


            const y =
                MARGIN +
                row *
                (
                    LABEL_H +
                    GAP
                );


            /* =================================================
               GROUP LABEL
            ================================================= */

            const group =
                document.createElementNS(
                    NS,
                    "g"
                );


            group.setAttribute(
                "transform",
                "translate(" +
                x +
                "," +
                y +
                ")"
            );


            /* =================================================
               KOTAK LABEL
            ================================================= */

            const box =
                document.createElementNS(
                    NS,
                    "rect"
                );


            box.setAttribute(
                "x",
                0
            );


            box.setAttribute(
                "y",
                0
            );


            box.setAttribute(
                "width",
                LABEL_W
            );


            box.setAttribute(
                "height",
                LABEL_H
            );


            box.setAttribute(
                "fill",
                "white"
            );


            box.setAttribute(
                "stroke",
                "black"
            );


            box.setAttribute(
                "stroke-width",
                "0.25"
            );


            group.appendChild(
                box
            );


            /* =================================================
               CARI ITEM WEB ASLI
            ================================================= */

            const indexDatabase =
                database.indexOf(
                    data
                );


            const itemWeb =
                document.querySelector(
                    '.item[data-index="' +
                    indexDatabase +
                    '"]'
                );


            if(!itemWeb){

                return;

            }


            /* =================================================
               SALIN BARCODE WEB
            ================================================= */

            const barcodeWeb =
                itemWeb.querySelector(
                    "svg"
                );


            if(barcodeWeb){

                const barcodeClone =
                    barcodeWeb.cloneNode(
                        true
                    );


                /*
                 * Ukuran barcode dibuat
                 * mengikuti area label,
                 * tetapi isi barcode-nya
                 * tetap dari WEB.
                 */

                const BARCODE_W = 44;
                const BARCODE_H = 14;


                const barcodeX =
                    (
                        LABEL_W -
                        BARCODE_W
                    ) / 2;


                const barcodeY =
                    2;


                barcodeClone.setAttribute(
                    "x",
                    barcodeX
                );


                barcodeClone.setAttribute(
                    "y",
                    barcodeY
                );


                barcodeClone.setAttribute(
                    "width",
                    BARCODE_W
                );


                barcodeClone.setAttribute(
                    "height",
                    BARCODE_H
                );


                barcodeClone.removeAttribute(
                    "style"
                );


                barcodeClone.setAttribute(
                    "preserveAspectRatio",
                    "none"
                );


                group.appendChild(
                    barcodeClone
                );

            }


            /* =================================================
               AMBIL TEKS DARI WEB
            ================================================= */

            const infoWeb =
                itemWeb.querySelector(
                    ".info"
                );


            const registerText =
                infoWeb
                ? infoWeb.children[0].textContent
                : data.register;


            const tumpukText =
                infoWeb
                ? infoWeb.children[1].textContent
                : data.tumpuk;


            /* =================================================
               GROUP TEKS

               TETAP SEBARIS
            ================================================= */

            const textGroup =
                document.createElementNS(
                    NS,
                    "g"
                );


            textGroup.setAttribute(
                "transform",
                "translate(25,22)"
            );


            /* =================================================
               REGISTER
            ================================================= */

            const reg =
                document.createElementNS(
                    NS,
                    "text"
                );


            reg.setAttribute(
                "x",
                -1.5
            );


            reg.setAttribute(
                "y",
                0
            );


            reg.setAttribute(
                "text-anchor",
                "end"
            );


            reg.setAttribute(
                "dominant-baseline",
                "middle"
            );


            reg.setAttribute(
                "font-family",
                "Arial"
            );


            reg.setAttribute(
                "font-size",
                "3.5"
            );


            reg.setAttribute(
                "font-weight",
                "bold"
            );


            reg.textContent =
                registerText;


            textGroup.appendChild(
                reg
            );


            /* =================================================
               TUMPUK
            ================================================= */

            const tup =
                document.createElementNS(
                    NS,
                    "text"
                );


            tup.setAttribute(
                "x",
                1.5
            );


            tup.setAttribute(
                "y",
                0
            );


            tup.setAttribute(
                "text-anchor",
                "start"
            );


            tup.setAttribute(
                "dominant-baseline",
                "middle"
            );


            tup.setAttribute(
                "font-family",
                "Arial"
            );


            tup.setAttribute(
                "font-size",
                "3.5"
            );


            tup.setAttribute(
                "font-weight",
                "bold"
            );


            tup.textContent =
                tumpukText;


            textGroup.appendChild(
                tup
            );


            group.appendChild(
                textGroup
            );


            /* =================================================
               MASUKKAN LABEL
            ================================================= */

            root.appendChild(
                group
            );

        }
    );


    /* =================================================
       SERIALIZE
    ================================================= */

    const serializer =
        new XMLSerializer();


    let source =
        serializer.serializeToString(
            root
        );


    source =
        '<?xml version="1.0" encoding="UTF-8"?>\n' +
        source;


    /* =================================================
       DOWNLOAD
    ================================================= */

    const blob =
        new Blob(
            [source],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "MASTER-BARCODE-KAYU.svg";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );


    document.getElementById(
        "status"
    ).innerHTML =
        "✅ Master SVG selesai — " +
        daftar.length +
        " barcode";

}

</script>

</body>

</html>
