<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Master Barcode Kayu</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f3f3f3;
}


/* =====================================================
   KONTROL
   ===================================================== */

.kontrol {

  max-width: 1100px;

  margin: auto;

  background: white;

  padding: 20px;

  border-radius: 12px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.08);

}


h2 {

  text-align: center;

  margin:
    0 0 20px;

}


/* =====================================================
   BUTTON
   ===================================================== */

button {

  border: none;

  border-radius: 8px;

  padding: 12px 15px;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

}


#ambil {

  width: 100%;

  background: #1976d2;

  color: white;

  margin-bottom: 15px;

}


/* =====================================================
   FILTER
   ===================================================== */

.judulFilter {

  font-weight: bold;

  margin-bottom: 8px;

}


.filter {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

}


.filterBox input {

  width: 100%;

  padding: 12px;

  border:
    1px solid #aaa;

  border-radius: 8px;

  font-size: 15px;

}


/* =====================================================
   TOMBOL FILTER
   ===================================================== */

.tombolFilter {

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-top: 10px;

}


.tombolFilter button {

  color: white;

}


.btnFilter {
  background: #1976d2;
}


#semua {
  background: #607d8b;
}


#pilihFilter {
  background: #388e3c;
}


#batalFilter {
  background: #d32f2f;
}


#pilihSemua {
  background: #455a64;
}


#batalSemua {
  background: #757575;
}


#downloadPilihan {
  background: #ef6c00;
}


#downloadSemua {
  background: #6a1b9a;
}


/* =====================================================
   UKURAN
   ===================================================== */

.ukuran {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin-top: 15px;

}


.kotak {

  background: #f7f7f7;

  border:
    1px solid #ddd;

  padding: 10px;

  border-radius: 8px;

}


.kotak label {

  display: block;

  font-size: 13px;

  font-weight: bold;

  margin-bottom: 5px;

}


.kotak input {

  width: 100%;

  padding: 9px;

  border:
    1px solid #bbb;

  border-radius: 6px;

  font-size: 15px;

}


/* =====================================================
   STATUS
   ===================================================== */

.statusBox {

  margin-top: 15px;

  padding: 12px;

  background: #f7f7f7;

  border-radius: 8px;

  text-align: center;

}


#status {
  font-weight: bold;
}


#jumlah {
  margin-top: 5px;
}


#hasilFilter {
  margin-top: 5px;
}


#dipilih {

  margin-top: 5px;

  font-weight: bold;

}


/* =====================================================
   INFO
   ===================================================== */

.masterInfo {

  margin-top: 15px;

  padding: 12px;

  background: #e8f5e9;

  border:
    1px solid #81c784;

  border-radius: 8px;

  text-align: center;

  line-height: 1.6;

  font-size: 14px;

}


/* =====================================================
   HASIL
   ===================================================== */

#hasil {

  max-width: 1200px;

  margin:
    20px auto;

}


.grid {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 10px;

}


.item {

  position: relative;

  background: white;

  border:
    1px solid #bbb;

  padding: 5px;

  text-align: center;

}


.item.tidak {

  opacity: .35;

}


.check {

  position: absolute;

  top: 5px;

  left: 5px;

  width: 18px;

  height: 18px;

}


.item svg {

  width: 100%;

  height: 60px;

  display: block;

  margin-top: 18px;

}


.info {

  display: flex;

  justify-content: center;

  gap: 15px;

  font-size: 14px;

  font-weight: bold;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:700px) {

  .grid {

    grid-template-columns:
      repeat(2,1fr);

  }

}


@media(max-width:500px) {

  .filter {

    grid-template-columns:
      1fr;

  }

  .ukuran {

    grid-template-columns:
      1fr;

  }

  .grid {

    grid-template-columns:
      1fr 1fr;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     KONTROL
     ===================================================== -->

<div class="kontrol">


<h2>
🪵 MASTER BARCODE KAYU
</h2>


<!-- =====================================================
     AMBIL DATABASE
     ===================================================== -->

<button
  id="ambil"
  onclick="ambilDatabase()"
>

🔄 AMBIL DATA REGISTER

</button>


<!-- =====================================================
     FILTER
     ===================================================== -->

<div class="judulFilter">

🔎 FILTER DATA

</div>


<div class="filter">


<div class="filterBox">

<input
  id="filterRegister"
  type="text"
  placeholder="Ketik nomor register..."
  autocomplete="off"
>

</div>


<div class="filterBox">

<input
  id="filterTumpuk"
  type="text"
  placeholder="Ketik nomor tumpuk..."
  autocomplete="off"
>

</div>


</div>


<div class="tombolFilter">


<button
  class="btnFilter"
  onclick="jalankanFilter()"
>

🔎 FILTER

</button>


<button
  id="semua"
  onclick="tampilkanSemua()"
>

🔄 TAMPILKAN SEMUA

</button>


<button
  id="pilihFilter"
  onclick="pilihHasilFilter()"
>

☑️ PILIH HASIL FILTER

</button>


<button
  id="batalFilter"
  onclick="batalHasilFilter()"
>

❌ BATAL HASIL FILTER

</button>


<button
  id="pilihSemua"
  onclick="pilihSemuaData()"
>

☑️ PILIH SEMUA DATA

</button>


<button
  id="batalSemua"
  onclick="batalSemuaData()"
>

❌ BATAL SEMUA DATA

</button>


<button
  id="downloadPilihan"
  onclick="downloadPilihan()"
>

💾 DOWNLOAD YANG DIPILIH

</button>


<button
  id="downloadSemua"
  onclick="downloadSemua()"
>

📦 DOWNLOAD SEMUA

</button>


</div>


<!-- =====================================================
     UKURAN
     ===================================================== -->

<div class="ukuran">


<div class="kotak">

<label>
Lebar barcode
</label>

<input
  id="lebarBarcode"
  type="number"
  value="5"
  min="1"
  step="0.1"
>


</div>


<div class="kotak">

<label>
Tinggi barcode
</label>

<input
  id="tinggiBarcode"
  type="number"
  value="2"
  min="1"
  step="0.1"
>


</div>


</div>


<!-- =====================================================
     STATUS
     ===================================================== -->

<div class="statusBox">


<div id="status">

Belum mengambil database

</div>


<div id="jumlah">

Jumlah database: 0

</div>


<div id="hasilFilter">

Hasil filter: 0

</div>


<div id="dipilih">

Dipilih: 0

</div>


</div>


<div class="masterInfo">

📐 Ukuran dasar:
<b>5 × 2 cm</b>

<br>

✂️ Garis potong:
<b>Aktif</b>

<br>

📦 Output:
<b>SVG</b>

<br>

🏭 Layout banner:
<b>Bebas diatur tukang cetak</b>

</div>


</div>


<!-- =====================================================
     HASIL
     ===================================================== -->

<div id="hasil">

<div
  id="grid"
  class="grid"
></div>

</div>


<script>


/* =====================================================
   API
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


/* =====================================================
   DATA
   ===================================================== */

let dataBarcode = [];


/* =====================================================
   AMBIL DATABASE
   ===================================================== */

function ambilDatabase() {

  const status =
    document.getElementById(
      "status"
    );

  const grid =
    document.getElementById(
      "grid"
    );


  status.innerHTML =
    "⏳ Mengambil DATABASE...";


  grid.innerHTML =
    "";


  dataBarcode = [];


  updateStatus();


  const callbackName =
    "database_" +
    Date.now();


  window[callbackName] =
    function(hasil) {


      if (
        !hasil ||
        hasil.status !== "success"
      ) {

        status.innerHTML =
          "❌ Gagal mengambil DATABASE";

        cleanup();

        return;

      }


      const data =
        hasil.data || [];


      if (
        !Array.isArray(data) ||
        data.length === 0
      ) {

        status.innerHTML =
          "⚠️ DATABASE kosong";

        cleanup();

        return;

      }


      data.forEach(
        function(item) {


          const register =
            String(
              item.register || ""
            ).trim();


          const tumpuk =
            String(
              item.tumpuk || ""
            ).trim();


          if (!register) {
            return;
          }


          dataBarcode.push({

            register:
              register,

            tumpuk:
              tumpuk,

            dipilih:
              true

          });

        }
      );


      tampilkanPreview();


      status.innerHTML =
        "✅ Database berhasil dimuat";


      updateStatus();


      cleanup();

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?getDatabase=1" +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      status.innerHTML =
        "❌ Gagal menghubungi DATABASE";

      cleanup();

    };


  document.body.appendChild(
    script
  );


  function cleanup() {

    delete window[
      callbackName
    ];

    script.remove();

  }

}


/* =====================================================
   TAMPILKAN PREVIEW
   ===================================================== */

function tampilkanPreview() {

  const grid =
    document.getElementById(
      "grid"
    );


  grid.innerHTML =
    "";


  dataBarcode.forEach(

    function(data, index) {


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "item";


      item.dataset.index =
        index;


      item.dataset.register =
        data.register
          .toLowerCase();


      item.dataset.tumpuk =
        data.tumpuk
          .toLowerCase();


      const check =
        document.createElement(
          "input"
        );


      check.type =
        "checkbox";


      check.className =
        "check";


      check.checked =
        data.dipilih;


      check.addEventListener(
        "change",
        function() {

          data.dipilih =
            this.checked;

          item.classList.toggle(
            "tidak",
            !this.checked
          );

          updateStatus();

        }
      );


      item.appendChild(
        check
      );


      const svg =
        document.createElementNS(

          "http://www.w3.org/2000/svg",

          "svg"

        );


      item.appendChild(
        svg
      );


      JsBarcode(

        svg,

        data.register,

        {

          format:
            "CODE128",

          width:
            2,

          height:
            55,

          displayValue:
            false,

          margin:
            3

        }

      );


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "info";


      const register =
        document.createElement(
          "span"
        );


      register.textContent =
        data.register;


      const tumpuk =
        document.createElement(
          "span"
        );


      tumpuk.textContent =
        data.tumpuk;


      info.appendChild(
        register
      );


      info.appendChild(
        tumpuk
      );


      item.appendChild(
        info
      );


      grid.appendChild(
        item
      );

    }

  );


  updateStatus();

}


/* =====================================================
   FILTER
   ===================================================== */

function jalankanFilter() {

  const filterRegister =
    document
      .getElementById(
        "filterRegister"
      )
      .value
      .trim()
      .toLowerCase();


  const filterTumpuk =
    document
      .getElementById(
        "filterTumpuk"
      )
      .value
      .trim()
      .toLowerCase();


  const items =
    document.querySelectorAll(
      ".item"
    );


  let jumlah =
    0;


  items.forEach(

    function(item) {


      const register =
        String(
          item.dataset.register || ""
        )
        .trim()
        .toLowerCase();


      const tumpuk =
        String(
          item.dataset.tumpuk || ""
        )
        .trim()
        .toLowerCase();


      /* =============================================
         REGISTER
         Pencarian sebagian.
         
         Ketik 261
         → 26143
         → 26144
         → 26145
         ============================================= */

      const cocokRegister =
        filterRegister === "" ||
        register.includes(
          filterRegister
        );


      /* =============================================
         TUMPUK
         HARUS PERSIS SAMA
         
         Ketik 1
         → 1

         Tidak ikut:
         → 11
         → 12
         → 13
         → 14
         ============================================= */

      const cocokTumpuk =
        filterTumpuk === "" ||
        tumpuk === filterTumpuk;


      const cocok =
        cocokRegister &&
        cocokTumpuk;


      if (cocok) {

        item.style.display =
          "";

        jumlah++;

      } else {

        item.style.display =
          "none";

      }

    }
  );


  document.getElementById(
    "hasilFilter"
  ).innerHTML =
    "Hasil filter: " +
    jumlah;

}


/* =====================================================
   TAMPILKAN SEMUA
   ===================================================== */

function tampilkanSemua() {

  document.getElementById(
    "filterRegister"
  ).value =
    "";


  document.getElementById(
    "filterTumpuk"
  ).value =
    "";


  const items =
    document.querySelectorAll(
      ".item"
    );


  items.forEach(
    function(item) {

      item.style.display =
        "";

    }
  );


  document.getElementById(
    "hasilFilter"
  ).innerHTML =
    "Hasil filter: " +
    dataBarcode.length;

}


/* =====================================================
   PILIH HASIL FILTER
   ===================================================== */

function pilihHasilFilter() {

  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {


        if (
          item.style.display ===
          "none"
        ) {

          return;

        }


        const index =
          Number(
            item.dataset.index
          );


        dataBarcode[index]
          .dipilih =
          true;


        item
          .querySelector(
            ".check"
          )
          .checked =
          true;


        item.classList.remove(
          "tidak"
        );

      }
    );


  updateStatus();

}


/* =====================================================
   BATAL HASIL FILTER
   ===================================================== */

function batalHasilFilter() {

  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {


        if (
          item.style.display ===
          "none"
        ) {

          return;

        }


        const index =
          Number(
            item.dataset.index
          );


        dataBarcode[index]
          .dipilih =
          false;


        item
          .querySelector(
            ".check"
          )
          .checked =
          false;


        item.classList.add(
          "tidak"
        );

      }
    );


  updateStatus();

}


/* =====================================================
   PILIH SEMUA DATA
   ===================================================== */

function pilihSemuaData() {

  dataBarcode.forEach(
    function(data) {

      data.dipilih =
        true;

    }
  );


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {

        item
          .querySelector(
            ".check"
          )
          .checked =
          true;


        item.classList.remove(
          "tidak"
        );

      }
    );


  updateStatus();

}


/* =====================================================
   BATAL SEMUA DATA
   ===================================================== */

function batalSemuaData() {

  dataBarcode.forEach(
    function(data) {

      data.dipilih =
        false;

    }
  );


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(

      function(item) {

        item
          .querySelector(
            ".check"
          )
          .checked =
          false;


        item.classList.add(
          "tidak"
        );

      }
    );


  updateStatus();

}


/* =====================================================
   UPDATE STATUS
   ===================================================== */

function updateStatus() {

  const jumlah =
    dataBarcode.length;


  const dipilih =
    dataBarcode.filter(
      function(data) {

        return data.dipilih;

      }
    ).length;


  document.getElementById(
    "jumlah"
  ).innerHTML =
    "Jumlah database: " +
    jumlah;


  document.getElementById(
    "dipilih"
  ).innerHTML =
    "Dipilih: " +
    dipilih;

}


/* =====================================================
   DATA DIPILIH
   ===================================================== */

function getDipilih() {

  return dataBarcode.filter(

    function(data) {

      return data.dipilih;

    }

  );

}


/* =====================================================
   BUAT MASTER SVG
   ===================================================== */

function buatMasterSVG(daftar) {

  const lebar =
    parseFloat(
      document.getElementById(
        "lebarBarcode"
      ).value
    );


  const tinggi =
    parseFloat(
      document.getElementById(
        "tinggiBarcode"
      ).value
    );


  const jarak =
    0.2;


  const margin =
    0.2;


  const tinggiTotal =
    margin +
    (daftar.length * tinggi) +
    ((daftar.length - 1) * jarak) +
    margin;


  const lebarTotal =
    lebar +
    (margin * 2);


  /* =================================================
     SVG UTAMA
     ================================================= */

  const svg =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "svg"

    );


  svg.setAttribute(
    "xmlns",
    "http://www.w3.org/2000/svg"
  );


  svg.setAttribute(
    "width",
    lebarTotal + "cm"
  );


  svg.setAttribute(
    "height",
    tinggiTotal + "cm"
  );


  svg.setAttribute(

    "viewBox",

    "0 0 " +
    lebarTotal +
    " " +
    tinggiTotal

  );


  /* =================================================
     BACKGROUND
     ================================================= */

  const bg =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "rect"

    );


  bg.setAttribute(
    "x",
    "0"
  );


  bg.setAttribute(
    "y",
    "0"
  );


  bg.setAttribute(
    "width",
    lebarTotal
  );


  bg.setAttribute(
    "height",
    tinggiTotal
  );


  bg.setAttribute(
    "fill",
    "white"
  );


  svg.appendChild(
    bg
  );


  /* =================================================
     BARCODE SATU PER SATU
     ================================================= */

  daftar.forEach(

    function(data, index) {


      const y =
        margin +
        index *
        (
          tinggi +
          jarak
        );


      const item =
        buatBarcodeSVG(

          data.register,

          data.tumpuk,

          lebar,

          tinggi

        );


      item.setAttribute(
        "x",
        margin
      );


      item.setAttribute(
        "y",
        y
      );


      svg.appendChild(
        item
      );

    }

  );


  return svg;

}


/* =====================================================
   BUAT SATU BARCODE SVG
   ===================================================== */

function buatBarcodeSVG(

  register,

  tumpuk,

  lebar,

  tinggi

) {


  const svg =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "svg"

    );


  svg.setAttribute(
    "xmlns",
    "http://www.w3.org/2000/svg"
  );


  svg.setAttribute(
    "width",
    lebar + "cm"
  );


  svg.setAttribute(
    "height",
    tinggi + "cm"
  );


  svg.setAttribute(
    "viewBox",
    "0 0 1000 400"
  );


  /* =================================================
     BACKGROUND
     ================================================= */

  const bg =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "rect"

    );


  bg.setAttribute(
    "x",
    "0"
  );


  bg.setAttribute(
    "y",
    "0"
  );


  bg.setAttribute(
    "width",
    "1000"
  );


  bg.setAttribute(
    "height",
    "400"
  );


  bg.setAttribute(
    "fill",
    "white"
  );


  svg.appendChild(
    bg
  );


  /* =================================================
     GARIS POTONG
     ================================================= */

  const border =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "rect"

    );


  border.setAttribute(
    "x",
    "2"
  );


  border.setAttribute(
    "y",
    "2"
  );


  border.setAttribute(
    "width",
    "996"
  );


  border.setAttribute(
    "height",
    "396"
  );


  border.setAttribute(
    "fill",
    "none"
  );


  border.setAttribute(
    "stroke",
    "black"
  );


  border.setAttribute(
    "stroke-width",
    "2"
  );


  svg.appendChild(
    border
  );


  /* =================================================
     BARCODE
     ================================================= */

  const barcode =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "svg"

    );


  barcode.setAttribute(
    "x",
    "30"
  );


  barcode.setAttribute(
    "y",
    "20"
  );


  barcode.setAttribute(
    "width",
    "940"
  );


  barcode.setAttribute(
    "height",
    "240"
  );


  svg.appendChild(
    barcode
  );


  JsBarcode(

    barcode,

    register,

    {

      format:
        "CODE128",

      width:
        2,

      height:
        220,

      displayValue:
        false,

      margin:
        0

    }

  );


  /* =================================================
     NOMOR REGISTER
     ================================================= */

  const reg =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "text"

    );


  reg.setAttribute(
    "x",
    "500"
  );


  reg.setAttribute(
    "y",
    "315"
  );


  reg.setAttribute(
    "text-anchor",
    "middle"
  );


  reg.setAttribute(
    "font-family",
    "Arial"
  );


  reg.setAttribute(
    "font-size",
    "50"
  );


  reg.setAttribute(
    "font-weight",
    "bold"
  );


  reg.setAttribute(
    "fill",
    "black"
  );


  reg.textContent =
    register;


  svg.appendChild(
    reg
  );


  /* =================================================
     NOMOR TUMPUK
     ================================================= */

  const tup =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "text"

    );


  tup.setAttribute(
    "x",
    "500"
  );


  tup.setAttribute(
    "y",
    "375"
  );


  tup.setAttribute(
    "text-anchor",
    "middle"
  );


  tup.setAttribute(
    "font-family",
    "Arial"
  );


  tup.setAttribute(
    "font-size",
    "40"
  );


  tup.setAttribute(
    "fill",
    "black"
  );


  tup.textContent =
    tumpuk;


  svg.appendChild(
    tup
  );


  return svg;

}


/* =====================================================

function downloadSemua() {


  if (

  ) {

  }

    );

/* =====================================================
   DOWNLOAD FILE
   ===================================================== */

function downloadFile(

  svg,

  nama

) {


  const serializer =
    new XMLSerializer();


  let source =
    serializer.serializeToString(
      svg
    );


  source =
    '<?xml version="1.0" encoding="UTF-8"?>\n' +
    source;


  const blob =
    new Blob(

      [source],

      {
        type:
          "image/svg+xml;charset=utf-8"
      }

    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    nama;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );


  document.getElementById(
    "status"
  ).innerHTML =
    "✅ File berhasil dibuat: " +
    nama;

}
