<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Master Barcode Kayu</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f3f3f3;
}


/* =====================================================
   KONTROL
   ===================================================== */

.kontrol {

  max-width: 1000px;

  margin: auto;

  background: white;

  padding: 20px;

  border-radius: 12px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.08);

}


h2 {

  text-align: center;

  margin:
    0 0 20px;

}


/* =====================================================
   UKURAN
   ===================================================== */

.ukuran {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin-top: 15px;

}


.kotak {

  background: #f7f7f7;

  border: 1px solid #ddd;

  padding: 12px;

  border-radius: 8px;

}


.kotak label {

  display: block;

  font-size: 13px;

  font-weight: bold;

  margin-bottom: 6px;

}


.kotak input {

  width: 100%;

  padding: 9px;

  border:
    1px solid #bbb;

  border-radius: 6px;

  font-size: 15px;

}


/* =====================================================
   FILTER
   ===================================================== */

.filter {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin-top: 12px;

}


.filter input {

  width: 100%;

  padding: 10px;

  border:
    1px solid #ccc;

  border-radius: 7px;

}


/* =====================================================
   BUTTON
   ===================================================== */

.tombol {

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-top: 15px;

}


button {

  border: none;

  border-radius: 8px;

  padding: 12px 15px;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

  flex: 1;

  min-width: 170px;

}


#ambil {

  width: 100%;

  flex: none;

  background: #1976d2;

  color: white;

}


#pilih {

  background: #757575;

  color: white;

}


#batal {

  background: #d32f2f;

  color: white;

}


#download {

  background: #6a1b9a;

  color: white;

}


#downloadPilihan {

  background: #ef6c00;

  color: white;

}


/* =====================================================
   STATUS
   ===================================================== */

#status {

  text-align: center;

  font-weight: bold;

  margin-top: 15px;

}


#jumlah,
#dipilih {

  text-align: center;

  margin-top: 5px;

}


/* =====================================================
   PREVIEW
   ===================================================== */

#hasil {

  max-width: 1200px;

  margin:
    20px auto;

}


.grid {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 10px;

}


.item {

  position: relative;

  background: white;

  border:
    1px solid #bbb;

  padding: 5px;

  text-align: center;

}


.item.tidak {

  opacity: .35;

}


.check {

  position: absolute;

  top: 5px;

  left: 5px;

}


.item svg {

  width: 100%;

  height: 60px;

  display: block;

  margin-top: 18px;

}


.info {

  display: flex;

  justify-content: center;

  gap: 15px;

  font-size: 14px;

  font-weight: bold;

}


/* =====================================================
   INFO MASTER
   ===================================================== */

.masterInfo {

  margin-top: 15px;

  padding: 12px;

  background: #e8f5e9;

  border:
    1px solid #81c784;

  border-radius: 8px;

  text-align: center;

  font-size: 14px;

  line-height: 1.6;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:700px) {

  .grid {

    grid-template-columns:
      repeat(2,1fr);

  }

}


@media(max-width:500px) {

  .ukuran {

    grid-template-columns:
      1fr;

  }

  .filter {

    grid-template-columns:
      1fr;

  }

  .grid {

    grid-template-columns:
      1fr 1fr;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     KONTROL
     ===================================================== -->

<div class="kontrol">


<h2>
🪵 MASTER BARCODE KAYU
</h2>


<button
  id="ambil"
  onclick="ambilDatabase()"
>

🔄 AMBIL DATA REGISTER

</button>


<!-- ===================================================
     UKURAN BARCODE
     =================================================== -->

<div class="ukuran">


<div class="kotak">

<label>
Lebar Barcode (cm)
</label>

<input
  id="lebarBarcode"
  type="number"
  value="5"
  min="1"
  step="0.1"
>


</div>


<div class="kotak">

<label>
Tinggi Barcode (cm)
</label>

<input
  id="tinggiBarcode"
  type="number"
  value="2"
  min="1"
  step="0.1"
>


</div>


</div>


<!-- ===================================================
     FILTER
     =================================================== -->

<div class="filter">


<input
  id="filterRegister"
  type="text"
  placeholder="🔎 Filter Register..."
  oninput="filterData()"
>


<input
  id="filterTumpuk"
  type="text"
  placeholder="🔎 Filter Tumpuk..."
  oninput="filterData()"
>


</div>


<!-- ===================================================
     BUTTON
     =================================================== -->

<div class="tombol">


<button
  id="pilih"
  onclick="pilihSemua()"
>

☑️ PILIH SEMUA

</button>


<button
  id="batal"
  onclick="batalSemua()"
>

❌ BATAL SEMUA

</button>


<button
  id="downloadPilihan"
  onclick="downloadPilihan()"
>

💾 DOWNLOAD YANG DIPILIH

</button>


<button
  id="download"
  onclick="downloadSemua()"
>

📦 DOWNLOAD SEMUA SVG

</button>


</div>


<!-- ===================================================
     STATUS
     =================================================== -->

<div id="status">

Tekan "Ambil Data Register"

</div>


<div id="jumlah">

Jumlah barcode: 0

</div>


<div id="dipilih">

Dipilih: 0

</div>


<div class="masterInfo">

📐 Ukuran dasar:
<b>5 × 2 cm</b>
<br>

✂️ Garis potong:
<b>Aktif</b>
<br>

📦 File:
<b>1 SVG berisi semua barcode</b>
<br>

🏭 Layout banner:
<b>Diatur oleh tukang cetak</b>

</div>


</div>


<!-- =====================================================
     PREVIEW
     ===================================================== -->

<div id="hasil">

<div
  id="grid"
  class="grid"
></div>

</div>


<script>


/* =====================================================
   API
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


/* =====================================================
   DATA
   ===================================================== */

let dataBarcode = [];


/* =====================================================
   AMBIL DATABASE
   ===================================================== */

function ambilDatabase() {


  const status =
    document.getElementById(
      "status"
    );


  const grid =
    document.getElementById(
      "grid"
    );


  status.innerHTML =
    "⏳ Mengambil DATABASE...";


  grid.innerHTML =
    "";


  dataBarcode = [];


  const callbackName =
    "database_" +
    Date.now();


  window[callbackName] =
    function(hasil) {


      if (
        !hasil ||
        hasil.status !== "success"
      ) {

        status.innerHTML =
          "❌ Gagal mengambil DATABASE";

        cleanup();

        return;

      }


      const data =
        hasil.data || [];


      if (
        !Array.isArray(data) ||
        data.length === 0
      ) {

        status.innerHTML =
          "⚠️ DATABASE kosong";

        cleanup();

        return;

      }


      let jumlah = 0;


      data.forEach(
        function(item) {


          const register =
            String(
              item.register || ""
            ).trim();


          const tumpuk =
            String(
              item.tumpuk || ""
            ).trim();


          if (
            !register
          ) {

            return;

          }


          dataBarcode.push({

            register:
              register,

            tumpuk:
              tumpuk

          });


          buatItem(
            register,
            tumpuk
          );


          jumlah++;

        }
      );


      document.getElementById(
        "jumlah"
      ).innerHTML =
        "Jumlah barcode: " +
        jumlah;


      updateDipilih();


      status.innerHTML =
        "✅ Database berhasil dimuat";


      cleanup();

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?getDatabase=1" +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      status.innerHTML =
        "❌ Gagal menghubungi DATABASE";

      cleanup();

    };


  document.body.appendChild(
    script
  );


  function cleanup() {

    delete window[
      callbackName
    ];

    script.remove();

  }

}


/* =====================================================
   BUAT ITEM
   ===================================================== */

function buatItem(

  register,

  tumpuk

) {


  const grid =
    document.getElementById(
      "grid"
    );


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "item";


  item.dataset.register =
    register;


  item.dataset.tumpuk =
    tumpuk;


  const check =
    document.createElement(
      "input"
    );


  check.type =
    "checkbox";


  check.className =
    "check";


  check.checked =
    true;


  check.onchange =
    function() {


      if (
        this.checked
      ) {

        item.classList.remove(
          "tidak"
        );

      } else {

        item.classList.add(
          "tidak"
        );

      }


      updateDipilih();

    };


  item.appendChild(
    check
  );


  const svg =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "svg"

    );


  item.appendChild(
    svg
  );


  const info =
    document.createElement(
      "div"
    );


  info.className =
    "info";


  const reg =
    document.createElement(
      "span"
    );


  reg.textContent =
    register;


  const tup =
    document.createElement(
      "span"
    );


  tup.textContent =
    tumpuk;


  info.appendChild(
    reg
  );


  info.appendChild(
    tup
  );


  item.appendChild(
    info
  );


  grid.appendChild(
    item
  );


  JsBarcode(

    svg,

    register,

    {

      format:
        "CODE128",

      width:
        2,

      height:
        55,

      displayValue:
        false,

      margin:
        3

    }

  );

}


/* =====================================================
   PILIH SEMUA
   ===================================================== */

function pilihSemua() {


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(
      function(item) {


        const check =
          item.querySelector(
            ".check"
          );


        check.checked =
          true;


        item.classList.remove(
          "tidak"
        );

      }
    );


  updateDipilih();

}


/* =====================================================
   BATAL SEMUA
   ===================================================== */

function batalSemua() {


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(
      function(item) {


        const check =
          item.querySelector(
            ".check"
          );


        check.checked =
          false;


        item.classList.add(
          "tidak"
        );

      }
    );


  updateDipilih();

}


/* =====================================================
   JUMLAH DIPILIH
   ===================================================== */

function updateDipilih() {


  const jumlah =
    document.querySelectorAll(
      ".item .check:checked"
    ).length;


  document.getElementById(
    "dipilih"
  ).innerHTML =
    "Dipilih: " +
    jumlah;

}


/* =====================================================
   FILTER
   ===================================================== */

function filterData() {


  const register =
    document.getElementById(
      "filterRegister"
    ).value
      .toLowerCase()
      .trim();


  const tumpuk =
    document.getElementById(
      "filterTumpuk"
    ).value
      .toLowerCase()
      .trim();


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(
      function(item) {


        const reg =
          item.dataset.register
            .toLowerCase();


        const tup =
          item.dataset.tumpuk
            .toLowerCase();


        const cocok =
          reg.includes(register) &&
          tup.includes(tumpuk);


        item.style.display =
          cocok
            ? ""
            : "none";

      }
    );

}


/* =====================================================
   AMBIL DATA DIPILIH
   ===================================================== */

function getDipilih() {


  const hasil = [];


  document
    .querySelectorAll(
      ".item"
    )
    .forEach(
      function(item) {


        const check =
          item.querySelector(
            ".check"
          );


        if (
          check &&
          check.checked
        ) {


          hasil.push({

            register:
              item.dataset.register,

            tumpuk:
              item.dataset.tumpuk

          });

        }

      }
    );


  return hasil;

}


/* =====================================================
   BUAT SATU BARCODE SVG
   ===================================================== */

function buatBarcodeSVG(

  register,

  tumpuk,

  lebar,

  tinggi

) {


  /*
     SVG internal menggunakan
     satuan 1000 x 400.

     Perbandingan:
     5 cm x 2 cm
     = 2.5 : 1
  */


  const svg =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "svg"

    );


  svg.setAttribute(
    "xmlns",
    "http://www.w3.org/2000/svg"
  );


  svg.setAttribute(
    "width",
    lebar + "cm"
  );


  svg.setAttribute(
    "height",
    tinggi + "cm"
  );


  svg.setAttribute(
    "viewBox",
    "0 0 1000 400"
  );


  /* =================================================
     BACKGROUND
     ================================================= */

  const bg =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "rect"

    );


  bg.setAttribute(
    "x",
    "0"
  );


  bg.setAttribute(
    "y",
    "0"
  );


  bg.setAttribute(
    "width",
    "1000"
  );


  bg.setAttribute(
    "height",
    "400"
  );


  bg.setAttribute(
    "fill",
    "white"
  );


  svg.appendChild(
    bg
  );


  /* =================================================
     GARIS POTONG
     ================================================= */

  const border =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "rect"

    );


  border.setAttribute(
    "x",
    "2"
  );


  border.setAttribute(
    "y",
    "2"
  );


  border.setAttribute(
    "width",
    "996"
  );


  border.setAttribute(
    "height",
    "396"
  );


  border.setAttribute(
    "fill",
    "none"
  );


  border.setAttribute(
    "stroke",
    "black"
  );


  border.setAttribute(
    "stroke-width",
    "2"
  );


  svg.appendChild(
    border
  );


  /* =================================================
     BARCODE
     ================================================= */

  const barcode =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "svg"

    );


  barcode.setAttribute(
    "x",
    "35"
  );


  barcode.setAttribute(
    "y",
    "20"
  );


  barcode.setAttribute(
    "width",
    "930"
  );


  barcode.setAttribute(
    "height",
    "250"
  );


  svg.appendChild(
    barcode
  );


  JsBarcode(

    barcode,

    register,

    {

      format:
        "CODE128",

      width:
        2,

      height:
        220,

      displayValue:
        false,

      margin:
        0

    }

  );


  /* =================================================
     REGISTER
     ================================================= */

  const textRegister =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "text"

    );


  textRegister.setAttribute(
    "x",
    "500"
  );


  textRegister.setAttribute(
    "y",
    "315"
  );


  textRegister.setAttribute(
    "text-anchor",
    "middle"
  );


  textRegister.setAttribute(
    "font-family",
    "Arial"
  );


  textRegister.setAttribute(
    "font-size",
    "50"
  );


  textRegister.setAttribute(
    "font-weight",
    "bold"
  );


  textRegister.textContent =
    register;


  svg.appendChild(
    textRegister
  );


  /* =================================================
     TUMPUK
     ================================================= */

  const textTumpuk =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "text"

    );


  textTumpuk.setAttribute(
    "x",
    "500"
  );


  textTumpuk.setAttribute(
    "y",
    "375"
  );


  textTumpuk.setAttribute(
    "text-anchor",
    "middle"
  );


  textTumpuk.setAttribute(
    "font-family",
    "Arial"
  );


  textTumpuk.setAttribute(
    "font-size",
    "40"
  );


  textTumpuk.textContent =
    tumpuk;


  svg.appendChild(
    textTumpuk
  );


  return svg;

}


/* =====================================================
   BUAT MASTER SVG
   ===================================================== */

function buatMasterSVG(

  daftar

) {


  const lebar =
    parseFloat(
      document.getElementById(
        "lebarBarcode"
      ).value
    );


  const tinggi =
    parseFloat(
      document.getElementById(
        "tinggiBarcode"
      ).value
    );


  /*
     Setiap barcode disusun
     satu di bawah yang lain.

     Tujuannya:

     TIDAK ADA LAYOUT BANNER.

     Tukang cetak bebas menyusun
     ulang di software mereka.
  */


  const margin =
    0.2;


  const jarak =
    0.2;


  const tinggiTotal =
    margin +
    (
      daftar.length *
      (tinggi + jarak)
    );


  const svg =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "svg"

    );


  svg.setAttribute(
    "xmlns",
    "http://www.w3.org/2000/svg"
  );


  svg.setAttribute(
    "width",
    (lebar + margin * 2) +
    "cm"
  );


  svg.setAttribute(
    "height",
    tinggiTotal +
    "cm"
  );


  svg.setAttribute(
    "viewBox",

    "0 0 " +
    (lebar + margin * 2) +
    " " +
    tinggiTotal

  );


  /* =================================================
     BACKGROUND
     ================================================= */

  const background =
    document.createElementNS(

      "http://www.w3.org/2000/svg",

      "rect"

    );


  background.setAttribute(
    "width",
    lebar + margin * 2
  );


  background.setAttribute(
    "height",
    tinggiTotal
  );


  background.setAttribute(
    "fill",
    "white"
  );


  svg.appendChild(
    background
  );


  /* =================================================
     MASUKKAN BARCODE
     ================================================= */

  daftar.forEach(

    function(data, index) {


      const y =
        margin +
        index *
        (tinggi + jarak);


      const grup =
        document.createElementNS(

          "http://www.w3.org/2000/svg",

          "g"

        );


      grup.setAttribute(
        "transform",

        "translate(" +
        margin +
        "," +
        y +
        ")"

      );


      const barcode =
        buatBarcodeSVG(

          data.register,

          data.tumpuk,

          lebar,

          tinggi

        );


      while (
        barcode.firstChild
      ) {

        grup.appendChild(
          barcode.firstChild
        );

      }


      svg.appendChild(
        grup
      );

    }

  );


  return svg;

}


/* =====================================================
   DOWNLOAD SEMUA
   ===================================================== */

function downloadSemua() {


  if (
    dataBarcode.length === 0
  ) {

    alert(
      "Belum ada data barcode."
    );

    return;

  }


  const svg =
    buatMasterSVG(
      dataBarcode
    );


  downloadSVGFile(

    svg,

    "MASTER-BARCODE-SEMUA.svg"

  );

}


/* =====================================================
   DOWNLOAD PILIHAN
   ===================================================== */

function downloadPilihan() {


  const daftar =
    getDipilih();


  if (
    daftar.length === 0
  ) {

    alert(
      "Belum ada barcode yang dipilih."
    );

    return;

  }


  const svg =
    buatMasterSVG(
      daftar
    );


  downloadSVGFile(

    svg,

    "MASTER-BARCODE-PILIHAN.svg"

  );

}


/* =====================================================
   DOWNLOAD SVG
   ===================================================== */

function downloadSVGFile(

  svg,

  namaFile

) {


  const serializer =
    new XMLSerializer();


  let source =
    serializer.serializeToString(
      svg
    );


  source =
    '<?xml version="1.0" encoding="UTF-8"?>\n' +
    source;


  const blob =
    new Blob(

      [source],

      {
        type:
          "image/svg+xml;charset=utf-8"
      }

    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    namaFile;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  URL.revokeObjectURL(
    url
  );


  document.getElementById(
    "status"
  ).innerHTML =
    "✅ SVG berhasil dibuat";

}

</script>


</body>

</html>
