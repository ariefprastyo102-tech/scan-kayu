<script>


/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbx3wriyYJKQAUWp_QMWR3J0TxwdjVL0Htigd2g59vawku1c4abcwORWT8rwHzdlsg/exec";


/* =====================================================
   DATA
===================================================== */

let semuaData = [];

let registerSisaDipilih = new Set();


/* =====================================================
   JSONP
===================================================== */

function requestJSONP(
  parameter,
  callback
) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8);


  window[callbackName] =
    function(hasil) {

      delete window[
        callbackName
      ];


      const script =
        document.getElementById(
          callbackName
        );


      if (script) {
        script.remove();
      }


      callback(hasil);

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  let url =
    API_URL + "?";


  Object.keys(
    parameter
  ).forEach(
    function(key) {

      url +=
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(
          parameter[key]
        ) +
        "&";

    }
  );


  url +=
    "callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {

      delete window[
        callbackName
      ];


      script.remove();


      callback({

        status:
          "error",

        message:
          "Gagal menghubungi server."

      });

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   TANGGAL HARI INI
===================================================== */

function tanggalHariIni() {

  const sekarang =
    new Date();


  const hari =
    String(
      sekarang.getDate()
    ).padStart(
      2,
      "0"
    );


  const bulan =
    String(
      sekarang.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const tahun =
    String(
      sekarang.getFullYear()
    );


  return (
    hari +
    "-" +
    bulan +
    "-" +
    tahun
  );

}


/* =====================================================
   NORMALISASI TANGGAL
===================================================== */

function normalisasiTanggal(
  nilai
) {

  if (
    nilai === null ||
    nilai === undefined
  ) {

    return "";

  }


  let teks =
    String(
      nilai
    )
    .trim();


  if (!teks) {
    return "";
  }


  /*
   * Format:
   * DD-MM-YYYY
   * DD/MM/YYYY
   */

  let cocok =
    teks.match(
      /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/
    );


  if (cocok) {

    return (
      String(
        cocok[1]
      ).padStart(2,"0") +
      "-" +
      String(
        cocok[2]
      ).padStart(2,"0") +
      "-" +
      cocok[3]
    );

  }


  /*
   * Format timestamp / tanggal lain.
   */

  const tanggal =
    new Date(
      teks
    );


  if (
    !isNaN(
      tanggal.getTime()
    )
  ) {

    return (
      String(
        tanggal.getDate()
      ).padStart(2,"0") +
      "-" +
      String(
        tanggal.getMonth() + 1
      ).padStart(2,"0") +
      "-" +
      String(
        tanggal.getFullYear()
      )
    );

  }


  return teks;

}


/* =====================================================
   TENTUKAN DATA HARI INI / SISA
===================================================== */

function tentukanSumber(
  item
) {

  const hariIni =
    tanggalHariIni();


  const tanggalScan =
    normalisasiTanggal(
      item.tanggalScan
    );


  if (
    tanggalScan ===
    hariIni
  ) {

    return "HARI_INI";

  }


  /*
   * Semua data SCAN yang tanggalnya
   * bukan hari ini dianggap SISA.
   *
   * Ini yang membuat SISA kemarin
   * tetap muncul besok.
   */

  return "SISA";

}


/* =====================================================
   MUAT DATA
===================================================== */

function muatData() {

  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Mengambil data...";


  requestJSONP(

    {
      getDataOlah:
        "1"
    },

    function(hasil) {

      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        document.getElementById(
          "status"
        ).innerHTML =
          "❌ Gagal mengambil data";


        return;

      }


      semuaData =
        Array.isArray(
          hasil.data
        )
        ?
        hasil.data
        :
        [];


      /*
       * Tentukan sumber berdasarkan
       * tanggal scan.
       */

      semuaData.forEach(
        function(item) {

          item.sumber =
            tentukanSumber(
              item
            );

        }
      );


      /*
       * Jangan menghilangkan pilihan
       * yang masih ada di data server.
       */

      const registerYangAda =
        new Set(
          semuaData.map(
            function(item) {
              return String(
                item.register || ""
              ).trim();
            }
          )
        );


      registerSisaDipilih =
        new Set(
          Array.from(
            registerSisaDipilih
          ).filter(
            function(register) {

              return registerYangAda.has(
                register
              );

            }
          )
        );


      /*
       * Semua SISA lama otomatis dianggap
       * sebagai SISA.
       */

      semuaData.forEach(
        function(item) {

          if (
            item.sumber ===
            "SISA"
          ) {

            registerSisaDipilih.add(
              String(
                item.register || ""
              ).trim()
            );

          }

        }
      );


      tampilkanData();

    }

  );

}


/* =====================================================
   TAMPIL DATA
===================================================== */

function tampilkanData() {

  const hariIni =
    semuaData.filter(
      function(item) {

        return (
          item.sumber ===
          "HARI_INI"
        );

      }
    );


  const sisa =
    semuaData.filter(
      function(item) {

        return (
          item.sumber ===
          "SISA"
        );

      }
    );


  document.getElementById(
    "jumlahHariIni"
  ).innerHTML =
    hariIni.length;


  document.getElementById(
    "jumlahSisa"
  ).innerHTML =
    sisa.length;


  let volumeHariIni =
    0;


  hariIni.forEach(
    function(item) {

      volumeHariIni +=
        Number(
          item.volumeAngka || 0
        );

    }
  );


  let volumeSisa =
    0;


  sisa.forEach(
    function(item) {

      volumeSisa +=
        Number(
          item.volumeAngka || 0
        );

    }
  );


  document.getElementById(
    "detailHariIni"
  ).innerHTML =
    hariIni.length +
    " batang • " +
    formatVolume(
      volumeHariIni
    ) +
    " M³";


  document.getElementById(
    "detailSisa"
  ).innerHTML =
    sisa.length +
    " batang • " +
    formatVolume(
      volumeSisa
    ) +
    " M³";


  /*
   * Volume yang akan diolah =
   * semua data yang TIDAK ditandai SISA.
   */

  let totalAkanDiolah =
    0;


  semuaData.forEach(
    function(item) {

      const register =
        String(
          item.register || ""
        ).trim();


      if (
        !registerSisaDipilih.has(
          register
        )
      ) {

        totalAkanDiolah +=
          Number(
            item.volumeAngka || 0
          );

      }

    }
  );


  document.getElementById(
    "volumeOlah"
  ).innerHTML =
    "TOTAL VOLUME DIOLAH: " +
    formatVolume(
      totalAkanDiolah
    ) +
    " M³";


  filterData();


}


/* =====================================================
   FILTER
===================================================== */

function filterData() {

  const input =
    document.getElementById(
      "searchRegister"
    );


  const kata =
    String(
      input.value || ""
    )
    .trim()
    .toLowerCase();


  const hariIni =
    semuaData.filter(
      function(item) {

        return (
          item.sumber ===
          "HARI_INI" &&
          cocokSearch(
            item,
            kata
          )
        );

      }
    );


  const sisa =
    semuaData.filter(
      function(item) {

        return (
          item.sumber ===
          "SISA" &&
          cocokSearch(
            item,
            kata
          )
        );

      }
    );


  renderDaftar(
    hariIni,
    "daftarHariIni"
  );


  renderDaftar(
    sisa,
    "daftarSisa"
  );

}


/* =====================================================
   SEARCH
===================================================== */

function cocokSearch(
  item,
  kata
) {

  if (!kata) {
    return true;
  }


  return String(
    item.register || ""
  )
  .toLowerCase()
  .includes(
    kata
  );

}


/* =====================================================
   RENDER DAFTAR
===================================================== */

function renderDaftar(
  data,
  id
) {

  const daftar =
    document.getElementById(
      id
    );


  daftar.innerHTML =
    "";


  if (
    data.length === 0
  ) {

    daftar.innerHTML =
      `
      <div class="kosong">
        ${
          id === "daftarSisa"
          ?
          "Tidak ada SISA."
          :
          "Tidak ada data masuk hari ini."
        }
      </div>
      `;


    return;

  }


  data
    .slice()
    .reverse()
    .forEach(
      function(item) {

        buatItem(
          item,
          daftar
        );

      }
    );

}


/* =====================================================
   BUAT ITEM
===================================================== */

function buatItem(
  item,
  daftar
) {

  const register =
    String(
      item.register || ""
    ).trim();


  /*
   * SISA lama otomatis dicentang.
   * Data hari ini mengikuti pilihan user.
   */

  const checked =
    registerSisaDipilih.has(
      register
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    checked
    ?
    "item itemSisa"
    :
    "item";


  const panjang =
    escapeHTML(
      item.panjang || "-"
    );


  const diameter =
    escapeHTML(
      item.diameter || "-"
    );


  const tpk =
    escapeHTML(
      item.tpk || "-"
    );


  const tumpuk =
    escapeHTML(
      item.tumpuk || "-"
    );


  const mutu =
    escapeHTML(
      item.mutu || "-"
    );


  const m3 =
    escapeHTML(
      item.m3 || "-"
    );


  div.innerHTML = `

    <div class="barisUtama">

      <input
        type="checkbox"
        class="checkSisa"
        data-register="${escapeHTML(
          register
        )}"
        ${
          checked
          ?
          "checked"
          :
          ""
        }
        onchange="ubahTampilanSisa(this)"
        title="Centang jika kayu ini SISA"
      >


      <div
        class="register ${
          checked
          ?
          "registerSisa"
          :
          "registerOlah"
        }"
      >
        ${escapeHTML(
          register
        )}
      </div>


      <div class="dataRingkas">

        <span class="data">
          ${panjang}
        </span>

        <span class="pemisah">
          ×
        </span>

        <span class="data">
          ${diameter}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${tpk}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${tumpuk}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${mutu}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${m3}
        </span>

      </div>

    </div>


    <div
      class="statusKecil ${
        checked
        ?
        "statusSisa"
        :
        "statusOlah"
      }"
    >

      ${
        checked
        ?
        "🟠 DICENTANG = SISA"
        :
        "🟢 TIDAK DICENTANG = DIOLAH"
      }

    </div>

  `;


  daftar.appendChild(
    div
  );

}


/* =====================================================
   UBAH SISA
===================================================== */

function ubahTampilanSisa(
  checkbox
) {

  const register =
    String(
      checkbox.getAttribute(
        "data-register"
      ) || ""
    ).trim();


  const item =
    checkbox.closest(
      ".item"
    );


  const status =
    item.querySelector(
      ".statusKecil"
    );


  const registerEl =
    item.querySelector(
      ".register"
    );


  if (
    checkbox.checked
  ) {

    /*
     * DICENTANG = SISA
     */

    registerSisaDipilih.add(
      register
    );


    item.classList.add(
      "itemSisa"
    );


    registerEl.classList.remove(
      "registerOlah"
    );


    registerEl.classList.add(
      "registerSisa"
    );


    status.className =
      "statusKecil statusSisa";


    status.innerHTML =
      "🟠 DICENTANG = SISA";

  }

  else {

    /*
     * TIDAK DICENTANG = DIOLAH
     */

    registerSisaDipilih.delete(
      register
    );


    item.classList.remove(
      "itemSisa"
    );


    registerEl.classList.remove(
      "registerSisa"
    );


    registerEl.classList.add(
      "registerOlah"
    );


    status.className =
      "statusKecil statusOlah";


    status.innerHTML =
      "🟢 TIDAK DICENTANG = DIOLAH";

  }


  /*
   * Update volume tanpa reload server.
   */

  let total =
    0;


  semuaData.forEach(
    function(data) {

      const nomor =
        String(
          data.register || ""
        ).trim();


      if (
        !registerSisaDipilih.has(
          nomor
        )
      ) {

        total +=
          Number(
            data.volumeAngka || 0
          );

      }

    }
  );


  document.getElementById(
    "volumeOlah"
  ).innerHTML =
    "TOTAL VOLUME DIOLAH: " +
    formatVolume(
      total
    ) +
    " M³";

}


/* =====================================================
   SELESAI
===================================================== */

function selesaiOlah() {

  if (
    semuaData.length === 0
  ) {

    alert(
      "Tidak ada data untuk diproses."
    );

    return;

  }


  const daftarOlah =
    [];


  const daftarSisa =
    [];


  semuaData.forEach(
    function(item) {

      const register =
        String(
          item.register || ""
        ).trim();


      if (!register) {
        return;
      }


      /*
       * DICENTANG = SISA
       */

      if (
        registerSisaDipilih.has(
          register
        )
      ) {

        daftarSisa.push(
          register
        );

      }

      /*
       * TIDAK DICENTANG = DIOLAH
       */

      else {

        daftarOlah.push(
          register
        );

      }

    }
  );


  if (
    daftarOlah.length === 0
  ) {

    alert(
      "Tidak ada kayu yang akan diolah.\n\n" +
      "Semua data masih ditandai sebagai SISA."
    );

    return;

  }


  const yakin =
    confirm(

      "SELESAIKAN DATA?\n\n" +

      "🟢 Akan DIOLAH: " +
      daftarOlah.length +
      " batang\n\n" +

      "🟠 Tetap SISA: " +
      daftarSisa.length +
      " batang\n\n" +

      "Yang TIDAK dicentang akan masuk DATA OLAH.\n" +

      "Yang DICENTANG tetap berada di SCAN dan akan muncul sebagai SISA."

    );


  if (!yakin) {
    return;
  }


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Menyimpan hasil olah...";


  /*
   * PENTING:
   *
   * GS yang lu kasih menerima:
   *
   * registers = "123,124,125"
   *
   * BUKAN JSON.stringify(array).
   *
   * SISA TIDAK dikirim untuk ditulis
   * ke DATA OLAH.
   *
   * SISA tetap berada di SCAN.
   */

  requestJSONP(

    {

      selesaiOlah:
        "1",

      registers:
        daftarOlah.join(",")

    },

    function(hasil) {

      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        alert(

          hasil &&
          hasil.message
          ?
          hasil.message
          :
          "Gagal menyimpan hasil."

        );


        document.getElementById(
          "status"
        ).innerHTML =
          "❌ Gagal menyimpan";

        return;

      }


      alert(

        "SELESAI.\n\n" +

        "🟢 Diolah: " +
        daftarOlah.length +
        " batang\n" +

        "🟠 Tetap SISA: " +
        daftarSisa.length +
        " batang\n\n" +

        "Data SISA tetap berada di SCAN."

      );


      /*
       * Setelah data olah masuk,
       * ambil ulang dari server.
       *
       * Yang sudah masuk DATA OLAH
       * akan otomatis tidak ditampilkan
       * oleh GS.
       *
       * Yang SISA tetap ada di SCAN
       * dan besok terbaca sebagai SISA.
       */

      registerSisaDipilih =
        new Set();


      muatData();

    }

  );

}


/* =====================================================
   FORMAT VOLUME
===================================================== */

function formatVolume(
  angka
) {

  return Number(
    angka || 0
  ).toLocaleString(
    "id-ID",
    {
      minimumFractionDigits: 3,
      maximumFractionDigits: 3
    }
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  teks
) {

  return String(
    teks
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   MULAI
===================================================== */

muatData();

</script>

</body>

</html>
