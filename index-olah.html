<script>


/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbx3wriyYJKQAUWp_QMWR3J0TxwdjVL0Htigd2g59vawku1c4abcwORWT8rwHzdlsg/exec";


/* =====================================================
   DATA
===================================================== */

let semuaData = [];

let sedangMemuat = false;

let sedangMenyimpan = false;


/* =====================================================
   JSONP
===================================================== */

function requestJSONP(
  parameter,
  callback
) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8);


  let selesai = false;


  function bersihkan() {

    if (selesai) return;

    selesai = true;

    delete window[
      callbackName
    ];

    const script =
      document.getElementById(
        callbackName
      );

    if (script) {
      script.remove();
    }

  }


  window[callbackName] =
    function(hasil) {

      bersihkan();

      callback(
        hasil
      );

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  let url =
    API_URL + "?";


  Object.keys(
    parameter
  ).forEach(
    function(key) {

      url +=
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(
          parameter[key]
        ) +
        "&";

    }
  );


  url +=
    "callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {

      bersihkan();

      callback({

        status:
          "error",

        message:
          "Gagal menghubungi server."

      });

    };


  document.body.appendChild(
    script
  );


  setTimeout(
    function() {

      if (!selesai) {

        bersihkan();

        callback({

          status:
            "error",

          message:
            "Server tidak memberikan jawaban."

        });

      }

    },
    20000
  );

}


/* =====================================================
   MUAT DATA
===================================================== */

function muatData() {

  if (sedangMemuat) {
    return;
  }


  sedangMemuat = true;


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Mengambil data...";


  requestJSONP(

    {
      getDataOlah:
        "1"
    },

    function(hasil) {

      sedangMemuat = false;


      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        document.getElementById(
          "status"
        ).innerHTML =
          "❌ Gagal mengambil data";

        return;

      }


      semuaData =
        Array.isArray(
          hasil.data
        )
        ?
        hasil.data
        :
        [];


      tampilkanData();


      document.getElementById(
        "status"
      ).innerHTML =
        "📊 Data diperbarui";

    }

  );

}


/* =====================================================
   TAMPIL DATA
===================================================== */

function tampilkanData() {

  /*
   * PENTING:
   *
   * TIDAK ADA LAGI PEMISAHAN
   * BERDASARKAN TANGGAL SCAN.
   *
   * SEMUA DATA YANG DIKIRIM
   * APPS SCRIPT = SESI OLAH.
   *
   * Jadi:
   *
   * 29 kemarin
   * +
   * 12 hari ini
   * =
   * 41 SESI OLAH
   *
   * Tidak peduli tanggal scan.
   */


  const dataOlah =
    semuaData.filter(
      function(item) {

        return !item.isSisa;

      }
    );


  /*
   * SISA HANYA DATA YANG
   * MEMANG DITANDAI SISA.
   */

  const sisa =
    semuaData.filter(
      function(item) {

        return item.isSisa === true;

      }
    );


  /*
   * JUMLAH SESI OLAH
   */

  document.getElementById(
    "jumlahHariIni"
  ).innerHTML =
    dataOlah.length;


  document.getElementById(
    "jumlahSisa"
  ).innerHTML =
    sisa.length;


  /*
   * VOLUME SESI OLAH
   */

  let volumeOlah =
    0;


  dataOlah.forEach(
    function(item) {

      volumeOlah +=
        Number(
          item.volumeAngka || 0
        );

    }
  );


  /*
   * VOLUME SISA
   */

  let volumeSisa =
    0;


  sisa.forEach(
    function(item) {

      volumeSisa +=
        Number(
          item.volumeAngka || 0
        );

    }
  );


  document.getElementById(
    "detailHariIni"
  ).innerHTML =
    dataOlah.length +
    " batang • " +
    formatVolume(
      volumeOlah
    ) +
    " M³";


  document.getElementById(
    "detailSisa"
  ).innerHTML =
    sisa.length +
    " batang • " +
    formatVolume(
      volumeSisa
    ) +
    " M³";


  /*
   * DATA OLAH
   */

  renderDaftar(
    dataOlah,
    "daftarHariIni"
  );


  /*
   * DATA SISA
   */

  renderDaftar(
    sisa,
    "daftarSisa"
  );


  /*
   * Hitung volume berdasarkan
   * checkbox.
   */

  hitungVolumeDariCheckbox();

}


/* =====================================================
   FILTER
===================================================== */

function filterData() {

  const input =
    document.getElementById(
      "searchRegister"
    );


  const kata =
    String(
      input.value || ""
    )
    .trim()
    .toLowerCase();


  const dataOlah =
    semuaData.filter(
      function(item) {

        if (
          item.isSisa === true
        ) {

          return false;

        }


        return cocokSearch(
          item,
          kata
        );

      }
    );


  const sisa =
    semuaData.filter(
      function(item) {

        if (
          item.isSisa !== true
        ) {

          return false;

        }


        return cocokSearch(
          item,
          kata
        );

      }
    );


  renderDaftar(
    dataOlah,
    "daftarHariIni"
  );


  renderDaftar(
    sisa,
    "daftarSisa"
  );


  hitungVolumeDariCheckbox();

}


/* =====================================================
   SEARCH
===================================================== */

function cocokSearch(
  item,
  kata
) {

  if (!kata) {
    return true;
  }


  return String(
    item.register || ""
  )
  .toLowerCase()
  .includes(
    kata
  );

}


/* =====================================================
   RENDER
===================================================== */

function renderDaftar(
  data,
  id
) {

  const daftar =
    document.getElementById(
      id
    );


  daftar.innerHTML =
    "";


  if (
    data.length === 0
  ) {

    daftar.innerHTML =
      `
      <div class="kosong">
        ${
          id === "daftarSisa"
          ?
          "Tidak ada SISA."
          :
          "Tidak ada data dalam SESI OLAH."
        }
      </div>
      `;

    return;

  }


  data
    .slice()
    .reverse()
    .forEach(
      function(item) {

        buatItem(
          item,
          daftar
        );

      }
    );

}


/* =====================================================
   BUAT ITEM
===================================================== */

function buatItem(
  item,
  daftar
) {

  /*
   * STATUS TIDAK LAGI DITENTUKAN
   * OLEH TANGGAL SCAN.
   *
   * HANYA berdasarkan isSisa.
   */

  const sisa =
    item.isSisa === true;


  const div =
    document.createElement(
      "div"
    );


  div.className =
    sisa
    ?
    "item itemSisa"
    :
    "item";


  const register =
    escapeHTML(
      item.register || ""
    );


  const panjang =
    escapeHTML(
      item.panjang || "-"
    );


  const diameter =
    escapeHTML(
      item.diameter || "-"
    );


  const tpk =
    escapeHTML(
      item.tpk || "-"
    );


  const tumpuk =
    escapeHTML(
      item.tumpuk || "-"
    );


  const mutu =
    escapeHTML(
      item.mutu || "-"
    );


  const m3 =
    escapeHTML(
      item.m3 || "-"
    );


  /*
   * SEMUA DATA SESI AWALNYA
   * TIDAK DICENTANG.
   *
   * Checkbox hanya menjadi pilihan
   * user untuk menentukan SISA.
   */

  div.innerHTML =
    `

    <div class="barisUtama">

      <input
        type="checkbox"
        class="checkSisa"
        data-register="${escapeHTML(
          item.register || ""
        )}"
        ${sisa ? "checked" : ""}
        onchange="ubahTampilanSisa(this)"
        title="Centang jika kayu ini tetap SISA"
      >


      <div
        class="register ${
          sisa
          ?
          "registerSisa"
          :
          "registerOlah"
        }"
      >
        ${register}
      </div>


      <div class="dataRingkas">

        <span class="data">
          ${panjang}
        </span>

        <span class="pemisah">
          ×
        </span>

        <span class="data">
          ${diameter}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${tpk}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${tumpuk}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${mutu}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${m3}
        </span>

      </div>

    </div>


    <div
      class="statusKecil ${
        sisa
        ?
        "statusSisa"
        :
        "statusOlah"
      }"
    >

      ${
        sisa
        ?
        "🟠 DICENTANG = TETAP SISA"
        :
        "🟢 TIDAK DICENTANG = DIOLAH"
      }

    </div>

    `;


  daftar.appendChild(
    div
  );

}


/* =====================================================
   UBAH TAMPILAN CHECKBOX
===================================================== */

function ubahTampilanSisa(
  checkbox
) {

  const item =
    checkbox.closest(
      ".item"
    );


  const status =
    item.querySelector(
      ".statusKecil"
    );


  const register =
    item.querySelector(
      ".register"
    );


  if (
    checkbox.checked
  ) {

    item.classList.add(
      "itemSisa"
    );


    register.classList.remove(
      "registerOlah"
    );


    register.classList.add(
      "registerSisa"
    );


    status.className =
      "statusKecil statusSisa";


    status.innerHTML =
      "🟠 DICENTANG = TETAP SISA";

  }

  else {

    item.classList.remove(
      "itemSisa"
    );


    register.classList.remove(
      "registerSisa"
    );


    register.classList.add(
      "registerOlah"
    );


    status.className =
      "statusKecil statusOlah";


    status.innerHTML =
      "🟢 TIDAK DICENTANG = DIOLAH";

  }


  hitungVolumeDariCheckbox();

}


/* =====================================================
   VOLUME CHECKBOX
===================================================== */

function hitungVolumeDariCheckbox() {

  let total =
    0;


  document
    .querySelectorAll(
      ".checkSisa"
    )
    .forEach(
      function(checkbox) {

        /*
         * YANG TIDAK DICENTANG
         * = DIOLAH
         */

        if (
          checkbox.checked
        ) {

          return;

        }


        const register =
          checkbox.getAttribute(
            "data-register"
          );


        const item =
          semuaData.find(
            function(data) {

              return String(
                data.register || ""
              ) ===
              String(
                register || ""
              );

            }
          );


        if (item) {

          total +=
            Number(
              item.volumeAngka || 0
            );

        }

      }
    );


  document.getElementById(
    "volumeOlah"
  ).innerHTML =
    "TOTAL VOLUME DIOLAH: " +
    formatVolume(
      total
    ) +
    " M³";

}


/* =====================================================
   SELESAI
===================================================== */

function selesaiOlah() {

  if (
    sedangMenyimpan
  ) {

    return;

  }


  if (
    semuaData.length === 0
  ) {

    alert(
      "Tidak ada data untuk diproses."
    );

    return;

  }


  const semuaCheckbox =
    document.querySelectorAll(
      ".checkSisa"
    );


  const daftarOlah =
    [];


  const daftarSisa =
    [];


  semuaCheckbox.forEach(
    function(checkbox) {

      const register =
        String(
          checkbox.getAttribute(
            "data-register"
          ) || ""
        ).trim();


      if (!register) {
        return;
      }


      /*
       * DICENTANG = SISA
       */

      if (
        checkbox.checked
      ) {

        daftarSisa.push(
          register
        );

      }


      /*
       * TIDAK DICENTANG = DIOLAH
       */

      else {

        daftarOlah.push(
          register
        );

      }

    }
  );


  /*
   * Kalau semua dicentang,
   * berarti semuanya SISA.
   *
   * Ini sekarang BOLEH.
   *
   * Karena user memang sengaja
   * menentukan semuanya sebagai SISA.
   */

  const yakin =
    confirm(

      "SELESAIKAN DATA?\n\n" +

      "🟢 Akan DIOLAH: " +
      daftarOlah.length +
      " batang\n\n" +

      "🟠 Akan menjadi SISA: " +
      daftarSisa.length +
      " batang\n\n" +

      "Lanjutkan?"

    );


  if (!yakin) {
    return;
  }


  sedangMenyimpan =
    true;


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Menyimpan data olah...";


  /*
   * KIRIM KEDUANYA.
   *
   * registers      = yang benar-benar DIOLAH
   * sisaRegisters  = yang benar-benar SISA
   */

  requestJSONP(

    {

      selesaiOlah:
        "1",

      registers:
        JSON.stringify(
          daftarOlah
        ),

      sisaRegisters:
        JSON.stringify(
          daftarSisa
        )

    },

    function(hasil) {

      sedangMenyimpan =
        false;


      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        alert(

          hasil &&
          hasil.message
          ?
          hasil.message
          :
          "Gagal menyimpan hasil olah."

        );


        document.getElementById(
          "status"
        ).innerHTML =
          "❌ Gagal menyimpan";

        return;

      }


      alert(

        "SELESAI.\n\n" +

        "🟢 Diolah: " +
        daftarOlah.length +
        " batang\n" +

        "🟠 Sisa: " +
        daftarSisa.length +
        " batang"

      );


      /*
       * Ambil ulang data.
       */

      muatData();

    }

  );

}


/* =====================================================
   FORMAT VOLUME
===================================================== */

function formatVolume(
  angka
) {

  return Number(
    angka || 0
  ).toLocaleString(
    "id-ID",
    {
      minimumFractionDigits: 3,
      maximumFractionDigits: 3
    }
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  teks
) {

  return String(
    teks
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   MULAI
===================================================== */

muatData();
