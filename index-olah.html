<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Data Olah - IK Saradan</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f6f4;
  margin: 0;
  padding: 10px;
  color: #222;
}

/* =====================================================
   HEADER
===================================================== */

.header {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 10px;
  background: white;
  border-radius: 12px;
  padding: 8px 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border-top: 4px solid #176b38;
}

.headerIsi {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.logo {
  width: 65px;
  height: 55px;
  object-fit: contain;
}

.judulBox {
  text-align: left;
}

.judul {
  font-size: 20px;
  font-weight: 900;
  color: #176b38;
}

.subjudul {
  font-size: 14px;
  font-weight: bold;
  color: #666;
  margin-top: 2px;
}

/* =====================================================
   RINGKASAN
===================================================== */

.ringkasan {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 10px;
  background: white;
  border-radius: 10px;
  padding: 8px;
  box-shadow: 0 2px 7px rgba(0,0,0,0.07);
}

.ringkasBaris {
  display: flex;
  justify-content: space-around;
  align-items: center;
  text-align: center;
}

.ringkasItem {
  flex: 1;
}

.ringkasAngka {
  font-size: 23px;
  font-weight: 900;
}

.ringkasLabel {
  font-size: 10px;
  font-weight: bold;
  color: #666;
  margin-top: 2px;
}

.hijau {
  color: #176b38;
}

.orange {
  color: #d97706;
}

.volume {
  border-top: 1px solid #ddd;
  margin-top: 7px;
  padding-top: 7px;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  color: #176b38;
}

/* =====================================================
   TOOLBAR
===================================================== */

.toolbar {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 8px;
  display: flex;
  gap: 7px;
}

.toolbar button {
  flex: 1;
  border: none;
  border-radius: 8px;
  padding: 10px;
  color: white;
  font-size: 13px;
  font-weight: bold;
}

.refresh {
  background: #1976d2;
}

/* =====================================================
   STATUS
===================================================== */

#status {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 8px;
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  color: #666;
}

/* =====================================================
   DAFTAR
===================================================== */

#daftar {
  width: 100%;
  max-width: 600px;
  margin: auto;
}

/* =====================================================
   ITEM
===================================================== */

.item {
  background: white;
  border-radius: 8px;
  margin-bottom: 6px;
  padding: 7px 8px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.07);
}

.itemSisa {
  background: #fff8e8;
  border-left: 4px solid #d97706;
}

/* =====================================================
   BARIS UTAMA
===================================================== */

.barisUtama {
  display: flex;
  align-items: center;
  gap: 7px;
}

/* =====================================================
   TOMBOL SISA
===================================================== */

.btnSisa {
  flex: 0 0 55px;
  height: 30px;
  padding: 0 5px;
  border: none;
  border-radius: 6px;
  background: #d97706;
  color: white;
  font-size: 10px;
  font-weight: 900;
}

.btnSisa:active {
  transform: scale(0.94);
}

.btnBatal {
  background: #555;
}

/* =====================================================
   REGISTER
===================================================== */

.register {
  flex: 0 0 auto;
  min-width: 80px;
  font-size: 17px;
  font-weight: 900;
}

.registerOlah {
  color: #176b38;
}

.registerSisa {
  color: #d97706;
}

/* =====================================================
   DATA RINGKAS
===================================================== */

.dataRingkas {
  flex: 1;
  min-width: 0;

  display: flex;
  align-items: center;
  gap: 6px;

  overflow: hidden;
}

.data {
  font-size: 13px;
  font-weight: bold;
  white-space: nowrap;
}

.pemisah {
  color: #aaa;
}

/* =====================================================
   STATUS KECIL
===================================================== */

.statusKecil {
  margin-top: 3px;
  margin-left: 62px;
  font-size: 9px;
  font-weight: bold;
}

.statusOlah {
  color: #16833a;
}

.statusSisa {
  color: #d97706;
}

/* =====================================================
   LOADING / KOSONG
===================================================== */

.kosong {
  background: white;
  border-radius: 10px;
  padding: 25px 10px;
  text-align: center;
  color: #777;
  font-size: 13px;
  font-weight: bold;
}

/* =====================================================
   HP KECIL
===================================================== */

@media(max-width:400px) {

  body {
    padding: 7px;
  }

  .logo {
    width: 58px;
    height: 50px;
  }

  .judul {
    font-size: 18px;
  }

  .subjudul {
    font-size: 12px;
  }

  .ringkasAngka {
    font-size: 20px;
  }

  .register {
    min-width: 74px;
    font-size: 15px;
  }

  .btnSisa {
    flex-basis: 52px;
    font-size: 9px;
  }

  .dataRingkas {
    gap: 4px;
  }

  .data {
    font-size: 11px;
  }

  .statusKecil {
    margin-left: 58px;
  }

}

</style>

</head>

<body>

<!-- ===================================================
     HEADER
=================================================== -->

<div class="header">

  <div class="headerIsi">


<img
  class="logo"
  src="logo-perhutani.jpg"
  alt="Logo Perhutani"
>

<div class="judulBox">

  <div class="judul">
    DATA OLAH
  </div>

  <div class="subjudul">
    IK SARADAN
  </div>

</div>


  </div>

</div>

<!-- ===================================================
     RINGKASAN
=================================================== -->

<div class="ringkasan">

  <div class="ringkasBaris">


<div class="ringkasItem">

  <div
    id="jumlahMasuk"
    class="ringkasAngka hijau"
  >
    0
  </div>

  <div class="ringkasLabel">
    KAYU MASUK
  </div>

</div>


<div class="ringkasItem">

  <div
    id="jumlahOlah"
    class="ringkasAngka hijau"
  >
    0
  </div>

  <div class="ringkasLabel">
    DIOLAH
  </div>

</div>


<div class="ringkasItem">

  <div
    id="jumlahSisa"
    class="ringkasAngka orange"
  >
    0
  </div>

  <div class="ringkasLabel">
    SISA
  </div>

</div>


  </div>

  <div
    id="volumeOlah"
    class="volume"
  >
    VOLUME DIOLAH: 0,000 M³
  </div>

</div>

<!-- ===================================================
     TOMBOL
=================================================== -->

<div class="toolbar">

<button
class="refresh"
onclick="muatData()"

>


🔄 REFRESH DATA


  </button>

</div>

<!-- ===================================================
     STATUS
=================================================== -->

<div id="status">
  Memuat data...
</div>

<!-- ===================================================
     DAFTAR
=================================================== -->

<div id="daftar">

  <div class="kosong">
    ⏳ Memuat data...
  </div>

</div>

<script>

/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbx3wriyYJKQAUWp_QMWR3J0TxwdjVL0Htigd2g59vawku1c4abcwORWT8rwHzdlsg/exec";


/* =====================================================
   DATA
===================================================== */

let semuaData = [];


/* =====================================================
   JSONP
===================================================== */

function requestJSONP(
  parameter,
  callback
) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8);


  window[callbackName] =
    function(hasil) {

      delete window[
        callbackName
      ];

      const script =
        document.getElementById(
          callbackName
        );

      if (script) {
        script.remove();
      }

      callback(
        hasil
      );

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  let url =
    API_URL + "?";


  Object.keys(
    parameter
  ).forEach(
    function(key) {

      url +=
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(
          parameter[key]
        ) +
        "&";

    }
  );


  url +=
    "callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {

      delete window[
        callbackName
      ];

      script.remove();

      callback({

        status:
          "error",

        message:
          "Gagal menghubungi server"

      });

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   MUAT DATA
===================================================== */

function muatData() {

  const status =
    document.getElementById(
      "status"
    );

  const daftar =
    document.getElementById(
      "daftar"
    );


  status.innerHTML =
    "⏳ Mengambil data...";


  daftar.innerHTML =
    `
      <div class="kosong">
        ⏳ Memuat data...
      </div>
    `;


  requestJSONP(

    {
      getDataOlah:
        "1"
    },

    function(hasil) {

      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        status.innerHTML =
          "❌ Gagal mengambil data";

        daftar.innerHTML =
          `
            <div class="kosong">
              ${
                hasil &&
                hasil.message
                ?
                hasil.message
                :
                "Data tidak dapat dimuat."
              }
            </div>
          `;

        return;

      }


      semuaData =
        Array.isArray(
          hasil.data
        )
        ?
        hasil.data
        :
        [];


      tampilkanData();

    }

  );

}


/* =====================================================
   TAMPIL DATA
===================================================== */

function tampilkanData() {

  const daftar =
    document.getElementById(
      "daftar"
    );


  daftar.innerHTML =
    "";


  let jumlahSisa =
    0;

  let jumlahOlah =
    0;

  let volumeOlah =
    0;


  semuaData.forEach(
    function(item) {

      if (
        item.statusOlah ===
        "SISA"
      ) {

        jumlahSisa++;

      }

      else {

        jumlahOlah++;

        volumeOlah +=
          Number(
            item.volumeAngka || 0
          );

      }

    }
  );


  document.getElementById(
    "jumlahMasuk"
  ).innerHTML =
    semuaData.length;


  document.getElementById(
    "jumlahOlah"
  ).innerHTML =
    jumlahOlah;


  document.getElementById(
    "jumlahSisa"
  ).innerHTML =
    jumlahSisa;


  document.getElementById(
    "volumeOlah"
  ).innerHTML =
    "VOLUME DIOLAH: " +
    formatVolume(
      volumeOlah
    ) +
    " M³";


  document.getElementById(
    "status"
  ).innerHTML =
    "📊 Data diperbarui";


  if (
    semuaData.length === 0
  ) {

    daftar.innerHTML =
      `
        <div class="kosong">
          Belum ada kayu masuk.
        </div>
      `;

    return;

  }


  semuaData
    .slice()
    .reverse()
    .forEach(
      function(item) {

        buatItem(
          item
        );

      }
    );

}


/* =====================================================
   BUAT ITEM
===================================================== */

function buatItem(
  item
) {

  const daftar =
    document.getElementById(
      "daftar"
    );


  const sisa =
    item.statusOlah ===
    "SISA";


  const div =
    document.createElement(
      "div"
    );


  div.className =
    sisa
    ?
    "item itemSisa"
    :
    "item";


  const register =
    escapeHTML(
      item.register || ""
    );


  const panjang =
    escapeHTML(
      item.panjang || "-"
    );


  const diameter =
    escapeHTML(
      item.diameter || "-"
    );


  const tpk =
    escapeHTML(
      item.tpk || "-"
    );


  const tumpuk =
    escapeHTML(
      item.tumpuk || "-"
    );


  const mutu =
    escapeHTML(
      item.mutu || "-"
    );


  const m3 =
    escapeHTML(
      item.m3 || "-"
    );


  div.innerHTML = `

    <div class="barisUtama">

      <button
        class="btnSisa ${
          sisa
          ?
          "btnBatal"
          :
          ""
        }"
        onclick="
          ${
            sisa
            ?
            "batalSisa"
            :
            "tandaiSisa"
          }(
            '${escapeJS(
              item.register || ""
            )}'
          )
        "
      >

        ${
          sisa
          ?
          "BATAL"
          :
          "SISA"
        }

      </button>


      <div
        class="register ${
          sisa
          ?
          "registerSisa"
          :
          "registerOlah"
        }"
      >

        ${register}

      </div>


      <div class="dataRingkas">

        <span class="data">
          ${panjang}
        </span>

        <span class="pemisah">×</span>

        <span class="data">
          ${diameter}
        </span>

        <span class="pemisah">|</span>

        <span class="data">
          ${tpk}
        </span>

        <span class="pemisah">|</span>

        <span class="data">
          ${tumpuk}
        </span>

        <span class="pemisah">|</span>

        <span class="data">
          ${mutu}
        </span>

        <span class="pemisah">|</span>

        <span class="data">
          ${m3}
        </span>

      </div>

    </div>


    <div
      class="statusKecil ${
        sisa
        ?
        "statusSisa"
        :
        "statusOlah"
      }"
    >

      ${
        sisa
        ?
        "🟠 SISA"
        :
        "🟢 OTOMATIS DIOLAH"
      }

    </div>

  `;


  daftar.appendChild(
    div
  );

}


/* =====================================================
   TANDAI SISA
===================================================== */

function tandaiSisa(
  register
) {

  const yakin =
    confirm(
      "Tandai " +
      register +
      " sebagai SISA?"
    );


  if (!yakin) return;


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Menyimpan SISA...";


  requestJSONP(

    {

      tandaiSisa:
        "1",

      register:
        register

    },

    function(hasil) {

      if (
        hasil &&
        hasil.status ===
        "success"
      ) {

        const item =
          semuaData.find(
            function(x) {

              return (
                x.register ===
                register
              );

            }
          );


        if (item) {

          item.statusOlah =
            "SISA";

        }


        tampilkanData();

      }

      else {

        alert(
          hasil &&
          hasil.message
          ?
          hasil.message
          :
          "Gagal menyimpan SISA."
        );

      }

    }

  );

}


/* =====================================================
   BATALKAN SISA
===================================================== */

function batalSisa(
  register
) {

  const yakin =
    confirm(
      "Batalkan SISA " +
      register +
      "?"
    );


  if (!yakin) return;


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Mengubah status...";


  requestJSONP(

    {

      batalkanSisa:
        "1",

      register:
        register

    },

    function(hasil) {

      if (
        hasil &&
        hasil.status ===
        "success"
      ) {

        const item =
          semuaData.find(
            function(x) {

              return (
                x.register ===
                register
              );

            }
          );


        if (item) {

          item.statusOlah =
            "BELUM DIOLAH";

        }


        tampilkanData();

      }

      else {

        alert(
          hasil &&
          hasil.message
          ?
          hasil.message
          :
          "Gagal mengubah status."
        );

      }

    }

  );

}


/* =====================================================
   FORMAT VOLUME
===================================================== */

function formatVolume(
  angka
) {

  return Number(
    angka || 0
  ).toLocaleString(
    "id-ID",
    {
      minimumFractionDigits: 3,
      maximumFractionDigits: 3
    }
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  teks
) {

  return String(
    teks
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJS(
  teks
) {

  return String(
    teks
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /\n/g,
    "\\n"
  )
  .replace(
    /\r/g,
    "\\r"
  );

}


/* =====================================================
   MULAI
===================================================== */

muatData();

</script>

</body>

</html>
