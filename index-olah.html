<style>

.barisUtama {

}

}

}

  }

  .ringkasAngka {

  .volume {

  }

  .register {
    min-width: 70px;

  }

  }

</head>

<body>

<div class="header">

  <div class="headerIsi">

    <img
      class="logo"
      src="logo-perhutani.jpg"
      alt="Logo Perhutani"
    >

    <div class="judulBox">

      <div class="judul">
        DATA OLAH
      </div>

      <div class="subjudul">
        IK SARADAN
      </div>

    </div>

  </div>

</div>


<div class="ringkasan">

  <div class="ringkasBaris">

    <div class="ringkasItem">

      <div
        id="jumlahHariIni"
        class="ringkasAngka hijau"
      >
        0
      </div>

      <div class="ringkasLabel">
        KAYU MASUK BARU
      </div>

    </div>

    <div class="ringkasItem">

      <div
        id="jumlahSisa"
        class="ringkasAngka orange"
      >
        0
      </div>

      <div class="ringkasLabel">
        SISA
      </div>

    </div>

  </div>

  <div
    id="volumeOlah"
    class="volume"
  >
    TOTAL VOLUME DIOLAH: 0,000 M³
  </div>

</div>


<div class="searchBox">

  <input
    id="searchRegister"
    type="search"
    placeholder="🔎 Cari nomor register..."
    oninput="filterData()"
  >

  <span class="searchIcon">
    🔎
  </span>

</div>


<div class="toolbar">

  <button
    class="refresh"
    onclick="muatData()"
  >
    🔄 REFRESH
  </button>

  <button
    class="selesai"
    onclick="selesaiOlah()"
  >
    ✅ SELESAI
  </button>

</div>


<div id="status">
  Memuat data...
</div>


<div class="bagian">

  <div class="judulBagian">

    <div class="judulBagianAtas judulHariIni">
      🟢 DATA BARU
    </div>

    <div
      id="detailHariIni"
      class="detailBagian"
    >
      0 batang • 0,000 M³
    </div>

  </div>

  <div id="daftarHariIni">

    <div class="kosong">
      ⏳ Memuat data...
    </div>

  </div>

</div>


<div class="bagian">

  <div class="judulBagian">

    <div class="judulBagianAtas judulSisa">
      🟠 SISA SEBELUMNYA
    </div>

    <div
      id="detailSisa"
      class="detailBagian"
    >
      0 batang • 0,000 M³
    </div>

  </div>

  <div id="daftarSisa">

    <div class="kosong">
      Belum ada sisa.
    </div>

  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx3wriyYJKQAUWp_QMWR3J0TxwdjVL0Htigd2g59vawku1c4abcwORWT8rwHzdlsg/exec";

let semuaData = [];

let sedangMemuat = false;

let sedangMenyimpan = false;


// =====================================================
// JSONP
// =====================================================

function requestJSONP(
  parameter,
  callback
) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8);

  let selesai = false;

  function bersihkan() {

    if (selesai) return;

    selesai = true;

    delete window[callbackName];

    const script =
      document.getElementById(
        callbackName
      );

    if (script) {
      script.remove();
    }
  }

  window[callbackName] =
    function(hasil) {

      bersihkan();

      callback(hasil);
    };

  const script =
    document.createElement("script");

  script.id =
    callbackName;

  let url =
    API_URL + "?";

  Object.keys(parameter)
    .forEach(function(key) {

      url +=
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(
          parameter[key]
        ) +
        "&";

    });

  url +=
    "callback=" +
    encodeURIComponent(
      callbackName
    );

  script.src = url;

  script.onerror =
    function() {

      bersihkan();

      callback({

        status:
          "error",

        message:
          "Gagal menghubungi server."
      });
    };

  document.body.appendChild(
    script
  );

  setTimeout(function() {

    if (!selesai) {

      bersihkan();

      callback({

        status:
          "error",

        message:
          "Server tidak memberikan jawaban."
      });
    }

  },20000);
}


// =====================================================
// MUAT DATA
// =====================================================

function muatData() {

  if (sedangMemuat) {
    return;
  }

  sedangMemuat = true;

  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Mengambil data...";

  requestJSONP(

    {
      getDataOlah:
        "1"
    },

    function(hasil) {

      sedangMemuat = false;

      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        document.getElementById(
          "status"
        ).innerHTML =
          "❌ Gagal mengambil data";

        return;
      }

      semuaData =
        Array.isArray(
          hasil.data
        )
        ?
        hasil.data
        :
        [];

      tampilkanData();

      document.getElementById(
        "status"
      ).innerHTML =
        "📊 Data diperbarui";

    }
  );
}


// =====================================================
// TAMPIL DATA
// =====================================================

function tampilkanData() {

  /*
   * STATUS DARI SESI_AKTIF
   *
   * BARU = masuk setelah selesai sebelumnya
   *
   * SISA = sisa dari sesi sebelumnya
   */

  const baru =
    semuaData.filter(
      item =>
        String(
          item.status || ""
        ).toUpperCase() ===
        "BARU"
    );

  const sisa =
    semuaData.filter(
      item =>
        String(
          item.status || ""
        ).toUpperCase() ===
        "SISA"
    );


  document.getElementById(
    "jumlahHariIni"
  ).innerHTML =
    baru.length;


  document.getElementById(
    "jumlahSisa"
  ).innerHTML =
    sisa.length;


  const volumeBaru =
    hitungVolume(baru);


  const volumeSisa =
    hitungVolume(sisa);


  document.getElementById(
    "detailHariIni"
  ).innerHTML =
    baru.length +
    " batang • " +
    formatVolume(volumeBaru) +
    " M³";


  document.getElementById(
    "detailSisa"
  ).innerHTML =
    sisa.length +
    " batang • " +
    formatVolume(volumeSisa) +
    " M³";


  /*
   * BARU otomatis diolah.
   * SISA tidak masuk volume olah.
   */

  document.getElementById(
    "volumeOlah"
  ).innerHTML =
    "TOTAL VOLUME DIOLAH: " +
    formatVolume(volumeBaru) +
    " M³";


  filterData();
}


// =====================================================
// FILTER
// =====================================================

function filterData() {

  const input =
    document.getElementById(
      "searchRegister"
    );

  const kata =
    String(
      input.value || ""
    )
    .trim()
    .toLowerCase();


  const baru =
    semuaData.filter(function(item) {

      return (
        String(
          item.status || ""
        ).toUpperCase() ===
        "BARU"
      )
      &&
      cocokSearch(
        item,
        kata
      );

    });


  const sisa =
    semuaData.filter(function(item) {

      return (
        String(
          item.status || ""
        ).toUpperCase() ===
        "SISA"
      )
      &&
      cocokSearch(
        item,
        kata
      );

    });


  renderDaftar(
    baru,
    "daftarHariIni"
  );


  renderDaftar(
    sisa,
    "daftarSisa"
  );
}


// =====================================================
// SEARCH
// =====================================================

function cocokSearch(
  item,
  kata
) {

  if (!kata) {
    return true;
  }

  return String(
    item.register ||
    (
      item.data &&
      item.data[0]
    ) ||
    ""
  )
  .toLowerCase()
  .includes(
    kata
  );
}


// =====================================================
// RENDER
// =====================================================

function renderDaftar(
  data,
  id
) {

  const daftar =
    document.getElementById(id);

  daftar.innerHTML = "";

  if (
    data.length === 0
  ) {

    daftar.innerHTML =
      `<div class="kosong">
        ${
          id === "daftarSisa"
          ?
          "Tidak ada SISA."
          :
          "Tidak ada data baru."
        }
      </div>`;

    return;
  }


  data
    .slice()
    .reverse()
    .forEach(function(item) {

      buatItem(
        item,
        daftar
      );

    });
}


// =====================================================
// BUAT ITEM
// =====================================================

function buatItem(
  item,
  daftar
) {

  const status =
    String(
      item.status || ""
    )
    .trim()
    .toUpperCase();

  const isSisa =
    status === "SISA";

  const div =
    document.createElement("div");

  div.className =
    isSisa
    ?
    "item itemSisa"
    :
    "item itemBaru";


  const data =
    item.data || [];


  const register =
    escapeHTML(
      item.register ||
      data[0] ||
      ""
    );

  const panjang =
    escapeHTML(
      data[1] || "-"
    );

  const diameter =
    escapeHTML(
      data[2] || "-"
    );

  const tpk =
    escapeHTML(
      data[3] || "-"
    );

  const tumpuk =
    escapeHTML(
      data[4] || "-"
    );

  const mutu =
    escapeHTML(
      data[5] || "-"
    );

  const m3 =
    escapeHTML(
      data[7] || "-"
    );


  /*
   * SISA = checked
   *
   * BARU = unchecked
   */

  div.innerHTML = `

    <div class="barisUtama">

      <input
        type="checkbox"
        class="checkSisa"
        data-register="${escapeHTML(register)}"
        ${isSisa ? "checked" : ""}
        onchange="ubahTampilanSisa(this)"
      >

      <div
        class="register ${
          isSisa
          ?
          "registerSisa"
          :
          "registerOlah"
        }"
      >
        ${register}
      </div>

      <div class="dataRingkas">

        <span class="data">
          ${panjang}
        </span>

        <span class="pemisah">
          ×
        </span>

        <span class="data">
          ${diameter}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${tpk}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${tumpuk}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${mutu}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${m3}
        </span>

      </div>

    </div>

    <div
      class="statusKecil ${
        isSisa
        ?
        "statusSisa"
        :
        "statusOlah"
      }"
    >
      ${
        isSisa
        ?
        "🟠 DICENTANG = TETAP SISA"
        :
        "🟢 TIDAK DICENTANG = DIOLAH"
      }
    </div>

  `;

  daftar.appendChild(div);
}


// =====================================================
// CHECKBOX
// =====================================================

function ubahTampilanSisa(
  checkbox
) {

  const item =
    checkbox.closest(
      ".item"
    );

  const status =
    item.querySelector(
      ".statusKecil"
    );

  const register =
    item.querySelector(
      ".register"
    );


  if (
    checkbox.checked
  ) {

    item.classList.remove(
      "itemBaru"
    );

    item.classList.add(
      "itemSisa"
    );

    register.classList.remove(
      "registerOlah"
    );

    register.classList.add(
      "registerSisa"
    );

    status.className =
      "statusKecil statusSisa";

    status.innerHTML =
      "🟠 DICENTANG = TETAP SISA";

  }

  else {

    item.classList.remove(
      "itemSisa"
    );

    item.classList.add(
      "itemBaru"
    );

    register.classList.remove(
      "registerSisa"
    );

    register.classList.add(
      "registerOlah"
    );

    status.className =
      "statusKecil statusOlah";

    status.innerHTML =
      "🟢 TIDAK DICENTANG = DIOLAH";
  }


  hitungVolumeDariCheckbox();
}


// =====================================================
// VOLUME CHECKBOX
// =====================================================

function hitungVolumeDariCheckbox() {

  let total = 0;

  document
    .querySelectorAll(
      ".checkSisa"
    )
    .forEach(function(checkbox) {

      if (
        checkbox.checked
      ) {
        return;
      }

      const register =
        checkbox.getAttribute(
          "data-register"
        );

      const item =
        semuaData.find(function(data) {

          return String(
            data.register ||
            (
              data.data &&
              data.data[0]
            ) ||
            ""
          ) ===
          String(register);

        });


      if (item) {

        const data =
          item.data || [];

        /*
         * DATABASE kolom M3
         * berada di index 7.
         */

        total +=
          Number(
            data[7] || 0
          );
      }

    });


  document.getElementById(
    "volumeOlah"
  ).innerHTML =
    "TOTAL VOLUME DIOLAH: " +
    formatVolume(total) +
    " M³";
}


// =====================================================
// SELESAI
// =====================================================

function selesaiOlah() {

  if (
    sedangMenyimpan
  ) {
    return;
  }


  if (
    semuaData.length === 0
  ) {

    alert(
      "Tidak ada data untuk diproses."
    );

    return;
  }


  const semuaCheckbox =
    document.querySelectorAll(
      ".checkSisa"
    );


  const daftarOlah = [];

  const daftarSisa = [];


  semuaCheckbox.forEach(
    function(checkbox) {

      const register =
        String(
          checkbox.getAttribute(
            "data-register"
          ) || ""
        ).trim();


      if (!register) {
        return;
      }


      if (
        checkbox.checked
      ) {

        daftarSisa.push(
          register
        );

      }

      else {

        daftarOlah.push(
          register
        );

      }

    }
  );


  if (
    daftarOlah.length === 0
  ) {

    alert(
      "Tidak ada kayu yang diolah.\n\n" +
      "Semua data akan tetap menjadi SISA."
    );

    /*
     * Kalau semuanya sisa,
     * tetap boleh disimpan.
     */

  }


  const yakin =
    confirm(

      "SELESAIKAN DATA?\n\n" +

      "🟢 DIOLAH: " +
      daftarOlah.length +
      " batang\n\n" +

      "🟠 SISA: " +
      daftarSisa.length +
      " batang\n\n" +

      "Setelah selesai:\n" +

      "• DIOLAH menjadi data selesai\n" +

      "• SISA dibawa ke sesi berikutnya\n" +

      "• Scan baru berikutnya akan muncul sebagai DATA BARU"

    );


  if (!yakin) {
    return;
  }


  sedangMenyimpan = true;


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Menyimpan hasil olah...";


  requestJSONP(

    {

      selesaiOlah:
        "1",

      registers:
        daftarOlah.join(","),

      sisa:
        daftarSisa.join(",")

    },

    function(hasil) {

      sedangMenyimpan = false;


      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        alert(
          hasil &&
          hasil.message
          ?
          hasil.message
          :
          "Gagal menyimpan."
        );

        document.getElementById(
          "status"
        ).innerHTML =
          "❌ Gagal menyimpan";

        return;
      }


      alert(

        "SELESAI.\n\n" +

        "🟢 Diolah: " +
        hasil.diolah +
        " batang\n" +

        "🟠 Sisa: " +
        hasil.sisa +
        " batang\n\n" +

        "Sekarang data tersebut sudah menjadi batas sesi selesai.\n" +

        "Kalau ada scan baru, otomatis muncul sebagai DATA BARU."

      );


      muatData();

    }
  );
}


// =====================================================
// VOLUME
// =====================================================

function hitungVolume(data) {

  let total = 0;

  data.forEach(function(item) {

    const d =
      item.data || [];

    total +=
      Number(
        d[7] || 0
      );

  });

  return total;
}


// =====================================================
// FORMAT VOLUME
// =====================================================

function formatVolume(
  angka
) {

  return Number(
    angka || 0
  ).toLocaleString(
    "id-ID",
    {
      minimumFractionDigits: 3,
      maximumFractionDigits: 3
    }
  );
}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(
  teks
) {

  return String(
    teks
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}
