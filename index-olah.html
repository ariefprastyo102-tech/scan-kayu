<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Data Olah - IK Saradan</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f6f4;
  margin: 0;
  padding: 10px;
  color: #222;
}

.header,
.ringkasan,
.searchBox,
.toolbar,
#status,
.bagian {
  width: 100%;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}

.header {
  margin-bottom: 10px;
  background: white;
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  border-top: 4px solid #176b38;
}

.headerIsi {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.logo {
  width: 70px;
  height: 60px;
  object-fit: contain;
}

.judulBox {
  text-align: left;
}

.judul {
  font-size: 22px;
  font-weight: 900;
  color: #176b38;
}

.subjudul {
  font-size: 15px;
  font-weight: bold;
  color: #666;
  margin-top: 3px;
}

.ringkasan {
  margin-bottom: 10px;
  background: white;
  border-radius: 10px;
  padding: 12px 10px;
  box-shadow: 0 2px 7px rgba(0,0,0,.07);
}

.ringkasBaris {
  display: flex;
  justify-content: space-around;
  align-items: center;
  text-align: center;
}

.ringkasItem {
  flex: 1;
  padding: 3px;
}

.ringkasAngka {
  font-size: 30px;
  font-weight: 900;
  line-height: 1.1;
}

.ringkasLabel {
  font-size: 12px;
  font-weight: 900;
  color: #666;
  margin-top: 5px;
}

.hijau {
  color: #176b38;
}

.orange {
  color: #d97706;
}

.volume {
  border-top: 1px solid #ddd;
  margin-top: 10px;
  padding-top: 11px;
  text-align: center;
  font-size: 21px;
  font-weight: 900;
  color: #176b38;
}

.searchBox {
  margin-bottom: 8px;
  position: relative;
}

.searchBox input {
  width: 100%;
  border: none;
  background: white;
  border-radius: 9px;
  padding: 12px 42px 12px 14px;
  font-size: 15px;
  font-weight: bold;
  outline: none;
  box-shadow: 0 2px 7px rgba(0,0,0,.07);
}

.searchIcon {
  position: absolute;
  right: 13px;
  top: 10px;
  font-size: 20px;
}

.toolbar {
  margin-bottom: 8px;
  display: flex;
  gap: 7px;
}

.toolbar button {
  flex: 1;
  border: none;
  border-radius: 8px;
  padding: 12px;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.refresh {
  background: #1976d2;
}

.selesai {
  background: #176b38;
}

#status {
  margin-bottom: 8px;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  color: #666;
}

.bagian {
  margin-bottom: 10px;
}

.judulBagian {
  background: white;
  border-radius: 9px;
  padding: 11px 12px;
  margin-bottom: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,.07);
}

.judulBagianAtas {
  font-size: 17px;
  font-weight: 900;
}

.judulHariIni {
  color: #176b38;
}

.judulSisa {
  color: #d97706;
}

.detailBagian {
  margin-top: 5px;
  font-size: 15px;
  font-weight: 900;
  color: #555;
  line-height: 1.35;
}

.item {
  background: white;
  border-radius: 8px;
  margin-bottom: 6px;
  padding: 8px 9px;
  box-shadow: 0 1px 5px rgba(0,0,0,.07);
}

.itemSisa {
  background: #fff8e8;
  border-left: 4px solid #d97706;
}

.itemBaru {
  background: #f2fff6;
  border-left: 4px solid #176b38;
}

.barisUtama {
  display: flex;
  align-items: center;
  gap: 8px;
}

.checkSisa {
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  accent-color: #d97706;
  cursor: pointer;
}

.register {
  flex: 0 0 auto;
  min-width: 85px;
  font-size: 18px;
  font-weight: 900;
}

.registerOlah {
  color: #176b38;
}

.registerSisa {
  color: #d97706;
}

.dataRingkas {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  overflow: hidden;
}

.data {
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
}

.pemisah {
  color: #aaa;
}

.statusKecil {
  margin-top: 4px;
  margin-left: 38px;
  font-size: 10px;
  font-weight: bold;
}

.statusOlah {
  color: #16833a;
}

.statusSisa {
  color: #d97706;
}

.kosong {
  background: white;
  border-radius: 10px;
  padding: 24px 10px;
  text-align: center;
  color: #777;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

.historyFloat {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 9998;

  width: 38px;
  height: 38px;

  border: none;
  border-radius: 50%;

  background: #176b38;
  color: white;

  padding: 0;

  font-size: 16px;
  font-weight: 900;

  box-shadow: 0 3px 10px rgba(0,0,0,.25);

  cursor: pointer;
}

.historyFloat:active {
  transform: scale(.94);
}

.historyOverlay {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 9999;

  background: rgba(0,0,0,.45);

  padding: 15px;

  align-items: center;
  justify-content: center;
}

.historyOverlay.aktif {
  display: flex;
}

.historyPopup {
  width: 100%;
  max-width: 560px;

  max-height: 85vh;

  background: #f3f6f4;

  border-radius: 14px;

  overflow: hidden;

  box-shadow: 0 8px 30px rgba(0,0,0,.3);

  animation: historyMasuk .18s ease-out;
}

@keyframes historyMasuk {

  from {
    transform: translateY(20px);
    opacity: 0;
  }

  to {
    transform: translateY(0);
    opacity: 1;
  }

}

.historyHeader {
  background: #176b38;
  color: white;

  padding: 13px 14px;

  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 10px;
}

.historyJudul {
  font-size: 17px;
  font-weight: 900;
}

.historyTutup {
  width: 32px;
  height: 32px;

  border: none;
  border-radius: 50%;

  background: rgba(255,255,255,.18);

  color: white;

  font-size: 19px;
  font-weight: bold;

  cursor: pointer;
}

.historyIsi {
  padding: 10px;

  max-height: calc(85vh - 60px);

  overflow-y: auto;
}

.historyTable {
  background: white;

  border-radius: 9px;

  overflow: hidden;

  box-shadow: 0 2px 7px rgba(0,0,0,.07);
}

.historyHead,
.historyRow {
  display: grid;

  grid-template-columns:
    1.25fr .75fr 1.1fr;

  align-items: center;

  gap: 4px;
}

.historyHead {
  background: #176b38;

  color: white;

  padding: 10px 9px;

  font-size: 12px;

  font-weight: 900;

  text-align: center;
}

.historyHead div:first-child {
  text-align: left;
}

.historyRow {
  padding: 10px 9px;

  border-top: 1px solid #e5e5e5;

  font-size: 14px;

  font-weight: bold;
}

.historyRow div:first-child {
  text-align: left;
}

.historyRow div:nth-child(2),
.historyRow div:nth-child(3) {
  text-align: center;
}

.historyVolume {
  color: #176b38;
}

@media(max-width:400px) {

  body {
    padding: 7px;
  }

  .logo {
    width: 62px;
    height: 52px;
  }

  .judul {
    font-size: 19px;
  }

  .subjudul {
    font-size: 13px;
  }

  .ringkasan {
    padding: 11px 7px;
  }

  .ringkasAngka {
    font-size: 27px;
  }

  .ringkasLabel {
    font-size: 11px;
  }

  .volume {
    font-size: 19px;
  }

  .judulBagianAtas {
    font-size: 16px;
  }

  .detailBagian {
    font-size: 14px;
  }

  .register {
    min-width: 72px;
    font-size: 16px;
  }

  .dataRingkas {
    gap: 5px;
  }

  .data {
    font-size: 12px;
  }

  .checkSisa {
    flex: 0 0 28px;
    width: 28px;
    height: 28px;
  }

  .statusKecil {
    margin-left: 35px;
    font-size: 9px;
  }

  .historyFloat {
    right: 10px;
    bottom: 10px;

    width: 34px;
    height: 34px;

    font-size: 14px;
  }

  .historyPopup {
    max-height: 90vh;
    border-radius: 12px;
  }

  .historyIsi {
    max-height: calc(90vh - 60px);
    padding: 8px;
  }

  .historyJudul {
    font-size: 15px;
  }

  .historyHead {
    font-size: 11px;
  }

  .historyRow {
    font-size: 13px;
    padding: 9px 7px;
  }

}

@media(max-width:350px) {

  .ringkasAngka {
    font-size: 25px;
  }

  .ringkasLabel {
    font-size: 10px;
  }

  .volume {
    font-size: 18px;
  }

  .detailBagian {
    font-size: 13px;
  }

  .register {
    min-width: 65px;
    font-size: 15px;
  }

  .data {
    font-size: 11px;
  }

  .historyFloat {
    width: 32px;
    height: 32px;

    font-size: 13px;
  }

  .historyHead {
    font-size: 10px;
  }

  .historyRow {
    font-size: 12px;
  }

}

</style>

</head>

<body>

<div class="header">

  <div class="headerIsi">

    <img
      class="logo"
      src="logo-perhutani.jpg"
      alt="Logo Perhutani">

    <div class="judulBox">

      <div class="judul">
        DATA OLAH
      </div>

      <div class="subjudul">
        IK SARADAN
      </div>

    </div>

  </div>

</div>

<div class="ringkasan">

  <div class="ringkasBaris">

    <div class="ringkasItem">

      <div
        id="jumlahHariIni"
        class="ringkasAngka hijau">
        0
      </div>

      <div class="ringkasLabel">
        KAYU MASUK BARU
      </div>

    </div>

    <div class="ringkasItem">

      <div
        id="jumlahSisa"
        class="ringkasAngka orange">
        0
      </div>

      <div class="ringkasLabel">
        SISA
      </div>

    </div>

  </div>

  <div
    id="volumeOlah"
    class="volume">

    TOTAL VOLUME: 0,000 M³

  </div>

</div>

<div class="searchBox">

  <input
    id="searchRegister"
    type="search"
    placeholder="🔎 Cari nomor register..."
    oninput="filterData()">

  <span class="searchIcon">
    🔎
  </span>

</div>

<div class="toolbar">

  <button
    class="refresh"
    onclick="muatData()">

    🔄 REFRESH

  </button>

  <button
    class="selesai"
    onclick="selesaiOlah()">

    ✅ SELESAI

  </button>

</div>

<div id="status">
  Memuat data...
</div>

<div class="bagian">

  <div class="judulBagian">

    <div class="judulBagianAtas judulHariIni">
      🟢 DATA BARU / AKAN DIOLAH
    </div>

    <div
      id="detailHariIni"
      class="detailBagian">

      0 batang • 0,000 M³

    </div>

  </div>

  <div id="daftarHariIni">

    <div class="kosong">
      ⏳ Memuat data...
    </div>

  </div>

</div>

<div class="bagian">

  <div class="judulBagian">

    <div class="judulBagianAtas judulSisa">
      🟠 SISA SEBELUMNYA
    </div>

    <div
      id="detailSisa"
      class="detailBagian">

      0 batang • 0,000 M³

    </div>

  </div>

  <div id="daftarSisa">

    <div class="kosong">
      Belum ada sisa.
    </div>

  </div>

</div>

<button
  class="historyFloat"
  onclick="bukaHistory()"
  title="History Olah">

  📊

</button>

<div
  id="historyOverlay"
  class="historyOverlay"
  onclick="klikLuarHistory(event)">

  <div class="historyPopup">

    <div class="historyHeader">

      <div class="historyJudul">
        📊 HISTORY OLAH PERTANGGAL
      </div>

      <button
        class="historyTutup"
        onclick="tutupHistory()">

        ×

      </button>

    </div>

    <div class="historyIsi">

      <div class="historyTable">

        <div class="historyHead">

          <div>
            TANGGAL
          </div>

          <div>
            BATANG
          </div>

          <div>
            VOLUME
          </div>

        </div>

        <div id="historyOlah">

          <div class="kosong">
            ⏳ Memuat history...
          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<script>

// =====================================================
// API
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbx3wriyYJKQAUWp_QMWR3J0TxwdjVL0Htigd2g59vawku1c4abcwORWT8rwHzdlsg/exec";


let semuaData = [];

let sedangMemuat = false;

let sedangMenyimpan = false;


// =====================================================
// JSONP
// =====================================================

function requestJSONP(
  parameter,
  callback
) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8);


  let selesai = false;


  function bersihkan() {

    if (selesai) return;

    selesai = true;

    delete window[callbackName];


    const script =
      document.getElementById(
        callbackName
      );


    if (script) {
      script.remove();
    }

  }


  window[callbackName] =
    function(hasil) {

      bersihkan();

      callback(hasil);

    };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  let url =
    API_URL + "?";


  Object.keys(parameter)
    .forEach(function(key) {

      url +=
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(
          parameter[key]
        ) +
        "&";

    });


  url +=
    "callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {

      bersihkan();


      callback({

        status:
          "error",

        message:
          "Gagal menghubungi server."

      });

    };


  document.body.appendChild(
    script
  );


  setTimeout(function() {

    if (!selesai) {

      bersihkan();


      callback({

        status:
          "error",

        message:
          "Server tidak memberikan jawaban."

      });

    }

  },60000);

}


// =====================================================
// MUAT DATA
// =====================================================

function muatData() {

  if (sedangMemuat) return;


  sedangMemuat = true;


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Mengambil data...";


  requestJSONP(

    {
      getDataOlah:"1"
    },

    function(hasil) {

      sedangMemuat = false;


      if (
        !hasil ||
        hasil.status !== "success"
      ) {

        document.getElementById(
          "status"
        ).innerHTML =
          "❌ Gagal mengambil data";

        return;

      }


      semuaData =
        Array.isArray(
          hasil.data
        )
        ? hasil.data
        : [];


      /*
       * Pilihan sementara TIDAK disimpan di server.
       *
       * Status sementara hanya berada di:
       *
       * item._statusSementara
       *
       * Saat refresh dari server,
       * pilihan sementara akan hilang.
       */


      tampilkanData();


      muatHistoryOlah();


      document.getElementById(
        "status"
      ).innerHTML =
        "📊 Data diperbarui";

    }

  );

}


// =====================================================
// PARSE VOLUME
// =====================================================

function parseVolume(nilai) {

  if (
    nilai === null ||
    nilai === undefined ||
    nilai === ""
  ) {

    return 0;

  }


  let teks =
    String(nilai)
      .trim()
      .replace(/\s/g,"");


  teks =
    teks.replace(",", ".");


  const angka =
    parseFloat(teks);


  return isNaN(angka)
    ? 0
    : angka;

}


// =====================================================
// STATUS TAMPILAN SEMENTARA
// =====================================================

function statusTampilan(item) {

  /*
   * Kalau ada pilihan sementara,
   * gunakan pilihan tersebut.
   */

  if (
    item &&
    item._statusSementara
  ) {

    return String(
      item._statusSementara
    )
    .trim()
    .toUpperCase();

  }


  /*
   * Default berdasarkan status server:
   *
   * BARU = DIOLAH
   * SISA = SISA
   */

  const statusAsli =
    String(
      item.status || ""
    )
    .trim()
    .toUpperCase();


  if (
    statusAsli === "BARU"
  ) {

    return "DIOLAH";

  }


  if (
    statusAsli === "SISA"
  ) {

    return "SISA";

  }


  return statusAsli;

}


// =====================================================
// TAMPILKAN DATA
// =====================================================

function tampilkanData() {

  /*
   * SEMUA DATA DITENTUKAN DARI
   * STATUS YANG SEDANG DIPILIH.
   *
   * DIOLAH → DATA BARU / AKAN DIOLAH
   * SISA   → SISA SEBELUMNYA
   */

  const baru =
    semuaData.filter(function(item) {

      return (
        statusTampilan(item) ===
        "DIOLAH"
      );

    });


  const sisa =
    semuaData.filter(function(item) {

      return (
        statusTampilan(item) ===
        "SISA"
      );

    });


  /*
   * JUMLAH DATA AKAN DIOLAH
   */

  document.getElementById(
    "jumlahHariIni"
  ).innerHTML =
    baru.length;


  /*
   * JUMLAH SISA
   */

  document.getElementById(
    "jumlahSisa"
  ).innerHTML =
    sisa.length;


  /*
   * VOLUME AKAN DIOLAH
   */

  const volumeBaru =
    hitungVolume(baru);


  /*
   * VOLUME SISA
   */

  const volumeSisa =
    hitungVolume(sisa);


  /*
   * TOTAL VOLUME
   */

  const volumeTotal =
    volumeBaru +
    volumeSisa;


  document.getElementById(
    "detailHariIni"
  ).innerHTML =

    baru.length +
    " batang • " +
    formatVolume(volumeBaru) +
    " M³";


  document.getElementById(
    "detailSisa"
  ).innerHTML =

    sisa.length +
    " batang • " +
    formatVolume(volumeSisa) +
    " M³";


  document.getElementById(
    "volumeOlah"
  ).innerHTML =

    "TOTAL VOLUME: " +
    formatVolume(volumeTotal) +
    " M³";


  filterData();

}


// =====================================================
// FILTER DATA
// =====================================================

function filterData() {

  const input =
    document.getElementById(
      "searchRegister"
    );


  const kata =
    String(
      input.value || ""
    )
    .trim()
    .toLowerCase();


  /*
   * DATA BARU / AKAN DIOLAH
   */

  const baru =
    semuaData.filter(function(item) {

      return (
        statusTampilan(item) ===
        "DIOLAH" &&
        cocokSearch(
          item,
          kata
        )
      );

    });


  /*
   * SISA
   */

  const sisa =
    semuaData.filter(function(item) {

      return (
        statusTampilan(item) ===
        "SISA" &&
        cocokSearch(
          item,
          kata
        )
      );

    });


  renderDaftar(
    baru,
    "daftarHariIni"
  );


  renderDaftar(
    sisa,
    "daftarSisa"
  );

}


// =====================================================
// COCOK SEARCH
// =====================================================

function cocokSearch(
  item,
  kata
) {

  if (!kata) {
    return true;
  }


  return String(
    item.register ||
    (
      item.data &&
      item.data[0]
    ) ||
    ""
  )
  .toLowerCase()
  .includes(kata);

}


// =====================================================
// RENDER DAFTAR
// =====================================================

function renderDaftar(
  data,
  id
) {

  const daftar =
    document.getElementById(
      id
    );


  daftar.innerHTML = "";


  if (
    data.length === 0
  ) {

    daftar.innerHTML =

      `<div class="kosong">
        ${
          id === "daftarSisa"
            ? "Tidak ada SISA."
            : "Tidak ada data baru."
        }
      </div>`;


    return;

  }


  data
    .slice()
    .reverse()
    .forEach(function(item) {

      buatItem(
        item,
        daftar
      );

    });

}


// =====================================================
// BUAT ITEM
// =====================================================

function buatItem(
  item,
  daftar
) {

  const status =
    statusTampilan(item);


  const isSisa =
    status === "SISA";


  const div =
    document.createElement(
      "div"
    );


  div.className =
    isSisa
      ? "item itemSisa"
      : "item itemBaru";


  const data =
    Array.isArray(item.data)
      ? item.data
      : [];


  const registerRaw =
    String(
      item.register ||
      data[0] ||
      ""
    ).trim();


  const register =
    escapeHTML(
      registerRaw
    );


  const panjang =
    escapeHTML(
      data[1] || "-"
    );


  const diameter =
    escapeHTML(
      data[2] || "-"
    );


  const tpk =
    escapeHTML(
      data[3] || "-"
    );


  const tumpuk =
    escapeHTML(
      data[4] || "-"
    );


  const mutu =
    escapeHTML(
      data[5] || "-"
    );


  const m3 =
    escapeHTML(
      data[7] || "-"
    );


  /*
   * =================================================
   * CHECKBOX UNTUK SEMUA DATA
   * =================================================
   *
   * DATA BARU:
   *   default tidak dicentang
   *   centang → SISA
   *
   * SISA:
   *   default dicentang
   *   lepas → DIOLAH
   *
   */

  const checkboxHTML = `

    <input
      type="checkbox"
      class="checkSisa"
      data-register="${escapeHTML(registerRaw)}"
      ${isSisa ? "checked" : ""}
      onchange="ubahStatusSementara(this)">

  `;


  /*
   * KETERANGAN STATUS
   */

  let keteranganStatus = "";


  if (
    isSisa
  ) {

    /*
     * Baik SISA lama maupun DATA BARU
     * yang sementara dipindahkan ke SISA.
     */

    const statusAsli =
      String(
        item.status || ""
      )
      .trim()
      .toUpperCase();


    if (
      statusAsli === "SISA"
    ) {

      keteranganStatus =
        "🟠 DICENTANG = TETAP SISA";

    }

    else {

      keteranganStatus =
        "🟠 DICENTANG = JADI SISA";

    }

  }

  else {

    const statusAsli =
      String(
        item.status || ""
      )
      .trim()
      .toUpperCase();


    if (
      statusAsli === "SISA"
    ) {

      keteranganStatus =
        "🟢 TIDAK DICENTANG = IKUT DIOLAH";

    }

    else {

      keteranganStatus =
        "🟢 TIDAK DICENTANG = IKUT DIOLAH";

    }

  }


  div.innerHTML = `

    <div class="barisUtama">

      ${checkboxHTML}

      <div
        class="register ${
          isSisa
            ? "registerSisa"
            : "registerOlah"
        }">

        ${register}

      </div>


      <div class="dataRingkas">

        <span class="data">
          ${panjang}
        </span>

        <span class="pemisah">
          ×
        </span>

        <span class="data">
          ${diameter}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${tpk}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${tumpuk}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${mutu}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${m3}
        </span>

      </div>

    </div>


    <div
      class="statusKecil ${
        isSisa
          ? "statusSisa"
          : "statusOlah"
      }">

      ${keteranganStatus}

    </div>

  `;


  daftar.appendChild(
    div
  );

}


// =====================================================
// UBAH STATUS SEMENTARA
// =====================================================

function ubahStatusSementara(
  checkbox
) {

  const register =
    String(
      checkbox.getAttribute(
        "data-register"
      ) || ""
    ).trim();


  if (!register) {
    return;
  }


  /*
   * Cari data asli.
   */

  const item =
    semuaData.find(
      function(data) {

        return String(
          data.register ||
          (
            data.data &&
            data.data[0]
          ) ||
          ""
        )
        .trim()
        ===
        register;

      }
    );


  if (!item) {
    return;
  }


  /*
   * =================================================
   * INI INTI LOGIKA BARU
   * =================================================
   *
   * CENTANG     → SISA
   * TIDAK CENTANG → DIOLAH
   *
   * Berlaku untuk:
   *
   * - DATA BARU
   * - SISA SEBELUMNYA
   *
   */


  item._statusSementara =
    checkbox.checked
      ? "SISA"
      : "DIOLAH";


  /*
   * Render ulang supaya data langsung
   * berpindah bagian.
   */

  tampilkanData();


  /*
   * Pesan sementara.
   */

  if (
    checkbox.checked
  ) {

    const statusAsli =
      String(
        item.status || ""
      )
      .trim()
      .toUpperCase();


    if (
      statusAsli === "BARU"
    ) {

      document.getElementById(
        "status"
      ).innerHTML =
        "🟠 DATA BARU dipindahkan ke SISA sementara";

    }

    else {

      document.getElementById(
        "status"
      ).innerHTML =
        "🟠 Data dipertahankan sebagai SISA sementara";

    }

  }

  else {

    document.getElementById(
      "status"
    ).innerHTML =
      "🟢 Data dipindahkan ke DATA BARU sementara";

  }

}


// =====================================================
// HITUNG VOLUME BERDASARKAN KEPUTUSAN SEMENTARA
// =====================================================

function hitungVolumeDariCheckbox() {

  let total = 0;


  semuaData.forEach(
    function(item) {

      const statusSekarang =
        statusTampilan(item);


      /*
       * Hanya yang status akhirnya
       * sementara DIOLAH.
       */

      if (
        statusSekarang !==
        "DIOLAH"
      ) {

        return;

      }


      const data =
        item.data || [];


      total +=
        parseVolume(
          data[7]
        );

    }
  );


  document.getElementById(
    "volumeOlah"
  ).innerHTML =

    "TOTAL VOLUME DIOLAH: " +
    formatVolume(total) +
    " M³";

}


// =====================================================
// SELESAI OLAH
// =====================================================

function selesaiOlah() {

  if (
    sedangMenyimpan
  ) {

    return;

  }


  if (
    semuaData.length === 0
  ) {

    alert(
      "Tidak ada data untuk diproses."
    );

    return;

  }


  /*
   * =================================================
   * KEPUTUSAN DIAMBIL DARI STATUS SEMENTARA
   * =================================================
   *
   * Tidak peduli data asalnya BARU atau SISA.
   *
   * Yang penting:
   *
   * DIOLAH → DATA OLAH
   * SISA   → SISA
   *
   */


  const daftarOlah = [];

  const daftarSisa = [];


  semuaData.forEach(
    function(item) {

      const register =
        String(
          item.register ||
          (
            item.data &&
            item.data[0]
          ) ||
          ""
        ).trim();


      if (!register) {
        return;
      }


      const statusSekarang =
        statusTampilan(item);


      /*
       * STATUS AKHIR:
       *
       * DIOLAH
       */

      if (
        statusSekarang ===
        "DIOLAH"
      ) {

        daftarOlah.push(
          register
        );

        return;

      }


      /*
       * STATUS AKHIR:
       *
       * SISA
       */

      if (
        statusSekarang ===
        "SISA"
      ) {

        daftarSisa.push(
          register
        );

      }

    }
  );


  /*
   * Konfirmasi sebelum benar-benar menyimpan.
   */

  const yakin =
    confirm(

      "SELESAIKAN DATA?\n\n" +

      "🟢 DIOLAH: " +
      daftarOlah.length +
      " batang\n\n" +

      "🟠 SISA: " +
      daftarSisa.length +
      " batang\n\n" +

      "Data yang tampil di atas adalah\n" +
      "keputusan sementara yang sudah lu pilih.\n\n" +

      "Setelah klik OK:\n" +

      "• ⬜ TIDAK DICENTANG → DATA OLAH\n" +

      "• ☑️ DICENTANG → SISA\n\n" +

      "Lanjutkan?"

    );


  if (!yakin) {
    return;
  }


  sedangMenyimpan =
    true;


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Menyimpan hasil olah...";


  requestJSONP(

    {

      selesaiOlah:
        "1",

      registers:
        daftarOlah.join(","),

      sisa:
        daftarSisa.join(",")

    },


    function(hasil) {


      sedangMenyimpan =
        false;


      if (
        !hasil ||
        hasil.status !== "success"
      ) {

        alert(

          hasil &&
          hasil.message

            ? hasil.message

            : "Gagal menyimpan."

        );


        document.getElementById(
          "status"
        ).innerHTML =
          "❌ Gagal menyimpan";


        return;

      }


      /*
       * Setelah benar-benar tersimpan,
       * hapus keputusan sementara.
       */

      semuaData.forEach(
        function(item) {

          delete item._statusSementara;

        }
      );


      alert(

        "SELESAI.\n\n" +

        "🟢 Diolah: " +
        hasil.diolah +
        " batang\n" +

        "🟠 Sisa: " +
        hasil.sisa +
        " batang\n\n" +

        "Sekarang data tersebut sudah menjadi batas sesi selesai.\n\n" +

        "Kalau ada scan baru, otomatis muncul sebagai DATA BARU."

      );


      muatData();

    }

  );

}


// =====================================================
// HITUNG VOLUME
// =====================================================

function hitungVolume(
  data
) {

  let total = 0;


  data.forEach(
    function(item) {

      const d =
        item.data || [];


      total +=
        parseVolume(
          d[7]
        );

    }
  );


  return total;

}


// =====================================================
// FORMAT VOLUME
// =====================================================

function formatVolume(
  angka
) {

  return Number(
    angka || 0
  )
  .toLocaleString(
    "id-ID",
    {

      minimumFractionDigits: 3,

      maximumFractionDigits: 3

    }

  );

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(
  teks
) {

  return String(
    teks
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


// =====================================================
// MUAT HISTORY
// =====================================================

function muatHistoryOlah() {

  requestJSONP(

    {
      getHistoryOlah:
        "1"
    },

    function(hasil) {

      if (
        !hasil ||
        hasil.status !== "success"
      ) {

        document.getElementById(
          "historyOlah"
        ).innerHTML =

          '<div class="kosong">' +
          '❌ Gagal mengambil history olah.' +
          '</div>';

        return;

      }


      renderHistoryOlah(

        Array.isArray(
          hasil.data
        )
          ? hasil.data
          : []

      );

    }

  );

}


// =====================================================
// RENDER HISTORY
// =====================================================

function renderHistoryOlah(
  data
) {

  const el =
    document.getElementById(
      "historyOlah"
    );


  if (
    !data.length
  ) {

    el.innerHTML =

      '<div class="kosong">' +
      'Belum ada history olah.' +
      '</div>';

    return;

  }


  el.innerHTML = "";


  data.forEach(
    function(item) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "historyRow";


      const tanggal =
        document.createElement(
          "div"
        );


      tanggal.innerHTML =
        escapeHTML(
          item.tanggal || "-"
        );


      const batang =
        document.createElement(
          "div"
        );


      batang.innerHTML =
        Number(
          item.batang || 0
        )
        .toLocaleString(
          "id-ID"
        );


      const volume =
        document.createElement(
          "div"
        );


      volume.className =
        "historyVolume";


      volume.innerHTML =
        formatVolume(
          item.volume
        ) +
        " M³";


      row.appendChild(
        tanggal
      );


      row.appendChild(
        batang
      );


      row.appendChild(
        volume
      );


      el.appendChild(
        row
      );

    }
  );

}


// =====================================================
// BUKA HISTORY
// =====================================================

function bukaHistory() {

  const overlay =
    document.getElementById(
      "historyOverlay"
    );


  overlay.classList.add(
    "aktif"
  );


  muatHistoryOlah();


  document.body.style.overflow =
    "hidden";

}


// =====================================================
// TUTUP HISTORY
// =====================================================

function tutupHistory() {

  const overlay =
    document.getElementById(
      "historyOverlay"
    );


  overlay.classList.remove(
    "aktif"
  );


  document.body.style.overflow =
    "";

}


// =====================================================
// KLIK LUAR HISTORY
// =====================================================

function klikLuarHistory(
  event
) {

  if (
    event.target.id ===
    "historyOverlay"
  ) {

    tutupHistory();

  }

}


// =====================================================
// MULAI
// =====================================================

muatData();

</script>
