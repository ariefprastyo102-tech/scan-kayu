<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Data Olah - IK Saradan</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f6f4;
  margin: 0;
  padding: 10px;
  color: #222;
}


/* =====================================================
   HEADER
===================================================== */

.header {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 10px;
  background: white;
  border-radius: 12px;
  padding: 8px 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border-top: 4px solid #176b38;
}

.headerIsi {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.logo {
  width: 65px;
  height: 55px;
  object-fit: contain;
}

.judulBox {
  text-align: left;
}

.judul {
  font-size: 20px;
  font-weight: 900;
  color: #176b38;
}

.subjudul {
  font-size: 14px;
  font-weight: bold;
  color: #666;
  margin-top: 2px;
}


/* =====================================================
   RINGKASAN
===================================================== */

.ringkasan {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 10px;
  background: white;
  border-radius: 10px;
  padding: 8px;
  box-shadow: 0 2px 7px rgba(0,0,0,0.07);
}

.ringkasBaris {
  display: flex;
  justify-content: space-around;
  align-items: center;
  text-align: center;
}

.ringkasItem {
  flex: 1;
}

.ringkasAngka {
  font-size: 23px;
  font-weight: 900;
}

.ringkasLabel {
  font-size: 10px;
  font-weight: bold;
  color: #666;
  margin-top: 2px;
}

.hijau {
  color: #176b38;
}

.orange {
  color: #d97706;
}


/* =====================================================
   VOLUME
===================================================== */

.volume {
  border-top: 1px solid #ddd;
  margin-top: 7px;
  padding-top: 9px;
  text-align: center;
  font-size: 18px;
  font-weight: 900;
  color: #176b38;
}


/* =====================================================
   SEARCH
===================================================== */

.searchBox {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 8px;
  position: relative;
}

.searchBox input {
  width: 100%;
  border: none;
  background: white;
  border-radius: 9px;
  padding: 11px 40px 11px 14px;
  font-size: 14px;
  font-weight: bold;
  outline: none;
  box-shadow: 0 2px 7px rgba(0,0,0,0.07);
}

.searchIcon {
  position: absolute;
  right: 13px;
  top: 9px;
  font-size: 19px;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 8px;
  display: flex;
  gap: 7px;
}

.toolbar button {
  flex: 1;
  border: none;
  border-radius: 8px;
  padding: 11px;
  color: white;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

.refresh {
  background: #1976d2;
}

.selesai {
  background: #176b38;
}


/* =====================================================
   STATUS
===================================================== */

#status {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 8px;
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  color: #666;
}


/* =====================================================
   BAGIAN
===================================================== */

.bagian {
  width: 100%;
  max-width: 600px;
  margin: 0 auto 10px;
}

.judulBagian {
  background: white;
  border-radius: 9px;
  padding: 9px 10px;
  margin-bottom: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.07);
}

.judulBagianAtas {
  font-size: 15px;
  font-weight: 900;
}

.judulHariIni {
  color: #176b38;
}

.judulSisa {
  color: #d97706;
}

.detailBagian {
  margin-top: 3px;
  font-size: 11px;
  font-weight: bold;
  color: #666;
}


/* =====================================================
   DAFTAR
===================================================== */

#daftarData {
  width: 100%;
}


/* =====================================================
   ITEM
===================================================== */

.item {
  background: white;
  border-radius: 8px;
  margin-bottom: 6px;
  padding: 7px 8px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.07);
}

.itemSisa {
  background: #fff8e8;
  border-left: 4px solid #d97706;
}


/* =====================================================
   BARIS
===================================================== */

.barisUtama {
  display: flex;
  align-items: center;
  gap: 7px;
}


/* =====================================================
   CHECKBOX
===================================================== */

.checkSisa {
  flex: 0 0 28px;
  width: 28px;
  height: 28px;
  accent-color: #d97706;
  cursor: pointer;
}


/* =====================================================
   REGISTER
===================================================== */

.register {
  flex: 0 0 auto;
  min-width: 80px;
  font-size: 17px;
  font-weight: 900;
}

.registerOlah {
  color: #176b38;
}

.registerSisa {
  color: #d97706;
}


/* =====================================================
   DATA
===================================================== */

.dataRingkas {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
}

.data {
  font-size: 13px;
  font-weight: bold;
  white-space: nowrap;
}

.pemisah {
  color: #aaa;
}


/* =====================================================
   STATUS KECIL
===================================================== */

.statusKecil {
  margin-top: 3px;
  margin-left: 35px;
  font-size: 9px;
  font-weight: bold;
}

.statusOlah {
  color: #16833a;
}

.statusSisa {
  color: #d97706;
}


/* =====================================================
   KOSONG
===================================================== */

.kosong {
  background: white;
  border-radius: 10px;
  padding: 22px 10px;
  text-align: center;
  color: #777;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 8px;
}


/* =====================================================
   HP KECIL
===================================================== */

@media(max-width:400px) {

  body {
    padding: 7px;
  }

  .logo {
    width: 58px;
    height: 50px;
  }

  .judul {
    font-size: 18px;
  }

  .subjudul {
    font-size: 12px;
  }

  .ringkasAngka {
    font-size: 20px;
  }

  .volume {
    font-size: 17px;
  }

  .register {
    min-width: 70px;
    font-size: 15px;
  }

  .dataRingkas {
    gap: 4px;
  }

  .data {
    font-size: 11px;
  }

}

</style>

</head>


<body>


<!-- ===================================================
     HEADER
=================================================== -->

<div class="header">

  <div class="headerIsi">

    <img
      class="logo"
      src="logo-perhutani.jpg"
      alt="Logo Perhutani"
    >

    <div class="judulBox">

      <div class="judul">
        DATA OLAH
      </div>

      <div class="subjudul">
        IK SARADAN
      </div>

    </div>

  </div>

</div>


<!-- ===================================================
     RINGKASAN
=================================================== -->

<div class="ringkasan">

  <div class="ringkasBaris">

    <div class="ringkasItem">

      <div
        id="jumlahData"
        class="ringkasAngka hijau"
      >
        0
      </div>

      <div class="ringkasLabel">
        TOTAL SESI AKTIF
      </div>

    </div>


    <div class="ringkasItem">

      <div
        id="jumlahSisa"
        class="ringkasAngka orange"
      >
        0
      </div>

      <div class="ringkasLabel">
        SISA
      </div>

    </div>

  </div>


  <div
    id="volumeOlah"
    class="volume"
  >
    TOTAL VOLUME DIOLAH: 0,000 M³
  </div>

</div>


<!-- ===================================================
     SEARCH
=================================================== -->

<div class="searchBox">

  <input
    id="searchRegister"
    type="search"
    placeholder="🔎 Cari nomor register..."
    oninput="filterData()"
  >

  <span class="searchIcon">
    🔎
  </span>

</div>


<!-- ===================================================
     TOOLBAR
=================================================== -->

<div class="toolbar">

  <button
    class="refresh"
    onclick="muatData()"
  >
    🔄 REFRESH
  </button>


  <button
    class="selesai"
    onclick="selesaiOlah()"
  >
    ✅ SELESAI
  </button>

</div>


<!-- ===================================================
     STATUS
=================================================== -->

<div id="status">
  Memuat data...
</div>


<!-- ===================================================
     DATA SESI AKTIF
=================================================== -->

<div class="bagian">

  <div class="judulBagian">

    <div class="judulBagianAtas judulHariIni">
      🟢 DATA SESI AKTIF
    </div>

    <div
      id="detailData"
      class="detailBagian"
    >
      0 batang • 0,000 M³
    </div>

  </div>


  <div id="daftarData">

    <div class="kosong">
      ⏳ Memuat data...
    </div>

  </div>

</div>


<script>


/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbx3wriyYJKQAUWp_QMWR3J0TxwdjVL0Htigd2g59vawku1c4abcwORWT8rwHzdlsg/exec";


/* =====================================================
   DATA
===================================================== */

let semuaData = [];

let pilihanOlah = {};

let sedangMemuat = false;

let sedangMenyimpan = false;


/* =====================================================
   JSONP
===================================================== */

function requestJSONP(
  parameter,
  callback
) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8);


  let selesai =
    false;


  function bersihkan() {

    if (selesai) {
      return;
    }


    selesai =
      true;


    delete window[
      callbackName
    ];


    const script =
      document.getElementById(
        callbackName
      );


    if (script) {
      script.remove();
    }

  }


  window[callbackName] =
    function(hasil) {

      bersihkan();

      callback(
        hasil
      );

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  let url =
    API_URL + "?";


  Object.keys(
    parameter
  ).forEach(
    function(key) {

      url +=
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(
          parameter[key]
        ) +
        "&";

    }
  );


  url +=
    "callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {

      bersihkan();


      callback({

        status:
          "error",

        message:
          "Gagal menghubungi server."

      });

    };


  document.body.appendChild(
    script
  );


  setTimeout(
    function() {

      if (!selesai) {

        bersihkan();


        callback({

          status:
            "error",

          message:
            "Server tidak memberikan jawaban."

        });

      }

    },
    20000
  );

}


/* =====================================================
   MUAT DATA
===================================================== */

function muatData() {

  if (
    sedangMemuat
  ) {

    return;
  }


  sedangMemuat =
    true;


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Mengambil SESI_AKTIF...";


  requestJSONP(

    {
      getDataOlah:
        "1"
    },

    function(hasil) {

      sedangMemuat =
        false;


      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        document.getElementById(
          "status"
        ).innerHTML =
          "❌ Gagal mengambil data";

        return;
      }


      semuaData =
        Array.isArray(
          hasil.data
        )
        ?
        hasil.data
        :
        [];


      /*
       * Kalau server sudah memberikan status SISA,
       * pertahankan status tersebut.
       *
       * Data baru tetap BARU.
       */

      semuaData.forEach(
        function(item) {

          const register =
            String(
              item.register ||
              (
                item.data &&
                item.data[0]
              ) ||
              ""
            ).trim();


          if (
            !register
          ) {

            return;
          }


          /*
           * SISA dari server
           */

          if (
            item.isSisa === true ||
            String(
              item.status ||
              ""
            ).toUpperCase() ===
            "SISA"
          ) {

            pilihanOlah[
              register
            ] = false;

          }


          /*
           * Data baru:
           * default diolah.
           */

          else if (
            pilihanOlah[
              register
            ] ===
            undefined
          ) {

            pilihanOlah[
              register
            ] = true;

          }

        }
      );


      tampilkanData();


      document.getElementById(
        "status"
      ).innerHTML =
        "📊 Sesi aktif: " +
        (
          hasil.sesi ||
          "-"
        );

    }

  );

}


/* =====================================================
   FILTER
===================================================== */

function filterData() {

  const input =
    document.getElementById(
      "searchRegister"
    );


  const kata =
    String(
      input.value ||
      ""
    )
    .trim()
    .toLowerCase();


  const hasil =
    semuaData.filter(
      function(item) {

        const register =
          getRegister(
            item
          );


        return String(
          register
        )
        .toLowerCase()
        .includes(
          kata
        );

      }
    );


  renderDaftar(
    hasil
  );

}


/* =====================================================
   TAMPIL DATA
===================================================== */

function tampilkanData() {

  let jumlahSisa =
    0;


  let volume =
    0;


  semuaData.forEach(
    function(item) {

      const register =
        getRegister(
          item
        );


      const sisa =
        isSisa(
          item
        );


      /*
       * Checkbox menentukan apakah
       * data akan diolah.
       *
       * SISA default tidak diolah
       * sampai checkbox dibuka.
       */

      const dipilih =
        pilihanOlah[
          register
        ] === true;


      if (
        sisa &&
        !dipilih
      ) {

        jumlahSisa++;

      }


      if (
        dipilih
      ) {

        volume +=
          getVolume(
            item
          );

      }

    }
  );


  document.getElementById(
    "jumlahData"
  ).innerHTML =
    semuaData.length;


  document.getElementById(
    "jumlahSisa"
  ).innerHTML =
    jumlahSisa;


  document.getElementById(
    "detailData"
  ).innerHTML =
    semuaData.length +
    " batang • " +
    formatVolume(
      getTotalVolume()
    ) +
    " M³";


  document.getElementById(
    "volumeOlah"
  ).innerHTML =
    "TOTAL VOLUME DIOLAH: " +
    formatVolume(
      volume
    ) +
    " M³";


  filterData();

}


/* =====================================================
   RENDER
===================================================== */

function renderDaftar(
  data
) {

  const daftar =
    document.getElementById(
      "daftarData"
    );


  daftar.innerHTML =
    "";


  if (
    data.length === 0
  ) {

    daftar.innerHTML =
      `
      <div class="kosong">
        Tidak ada data.
      </div>
      `;

    return;
  }


  data
    .slice()
    .reverse()
    .forEach(
      function(item) {

        buatItem(
          item,
          daftar
        );

      }
    );

}


/* =====================================================
   BUAT ITEM
===================================================== */

function buatItem(
  item,
  daftar
) {

  const register =
    getRegister(
      item
    );


  const sisa =
    isSisa(
      item
    );


  /*
   * Kalau data SISA:
   * false = tetap sisa
   *
   * Kalau data baru:
   * true = akan diolah
   */

  let dicentang;


  if (
    pilihanOlah[
      register
    ] !==
    undefined
  ) {

    dicentang =
      pilihanOlah[
        register
      ];

  }

  else {

    dicentang =
      !sisa;

  }


  const div =
    document.createElement(
      "div"
    );


  div.className =
    (
      sisa &&
      !dicentang
    )
    ?
    "item itemSisa"
    :
    "item";


  const data =
    Array.isArray(
      item.data
    )
    ?
    item.data
    :
    [];


  const panjang =
    escapeHTML(
      data[1] ||
      "-"
    );


  const diameter =
    escapeHTML(
      data[2] ||
      "-"
    );


  const tpk =
    escapeHTML(
      data[3] ||
      "-"
    );


  const tumpuk =
    escapeHTML(
      data[4] ||
      "-"
    );


  const mutu =
    escapeHTML(
      data[5] ||
      "-"
    );


  const m3 =
    escapeHTML(
      data[7] ||
      "-"
    );


  div.innerHTML =
    `

    <div class="barisUtama">

      <input
        type="checkbox"
        class="checkSisa"
        ${dicentang ? "checked" : ""}
        data-register="${escapeHTML(
          register
        )}"
        onchange="ubahCheckbox(this)"
        title="${
          sisa
          ?
          "Buka centang untuk mengolah SISA"
          :
          "Centang jika akan diolah"
        }"
      >


      <div
        class="register ${
          (
            sisa &&
            !dicentang
          )
          ?
          "registerSisa"
          :
          "registerOlah"
        }"
      >
        ${escapeHTML(
          register
        )}
      </div>


      <div class="dataRingkas">

        <span class="data">
          ${panjang}
        </span>

        <span class="pemisah">
          ×
        </span>

        <span class="data">
          ${diameter}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${tpk}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${tumpuk}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${mutu}
        </span>

        <span class="pemisah">
          |
        </span>

        <span class="data">
          ${m3}
        </span>

      </div>

    </div>


    <div
      class="statusKecil ${
        (
          sisa &&
          !dicentang
        )
        ?
        "statusSisa"
        :
        "statusOlah"
      }"
    >

      ${
        (
          sisa &&
          !dicentang
        )
        ?
        "🟠 SISA — TIDAK DIOLAH"
        :
        "🟢 AKAN DIOLAH"
      }

    </div>

    `;


  daftar.appendChild(
    div
  );

}


/* =====================================================
   CHECKBOX
===================================================== */

function ubahCheckbox(
  checkbox
) {

  const register =
    String(
      checkbox.getAttribute(
        "data-register"
      ) ||
      ""
    ).trim();


  pilihanOlah[
    register
  ] =
    checkbox.checked;


  tampilkanData();

}


/* =====================================================
   CEK SISA
===================================================== */

function isSisa(
  item
) {

  return (
    item.isSisa === true ||
    String(
      item.status ||
      ""
    ).toUpperCase() ===
    "SISA" ||
    String(
      item.asal ||
      ""
    ).toUpperCase() ===
    "SISA"
  );

}


/* =====================================================
   REGISTER
===================================================== */

function getRegister(
  item
) {

  return String(
    item.register ||
    (
      item.data &&
      item.data[0]
    ) ||
    ""
  ).trim();

}


/* =====================================================
   VOLUME
===================================================== */

function getVolume(
  item
) {

  if (
    item.volumeAngka !==
    undefined
  ) {

    return Number(
      item.volumeAngka ||
      0
    );

  }


  const data =
    Array.isArray(
      item.data
    )
    ?
    item.data
    :
    [];


  return Number(
    data[7] ||
    0
  ) || 0;

}


function getTotalVolume() {

  let total =
    0;


  semuaData.forEach(
    function(item) {

      total +=
        getVolume(
          item
        );

    }
  );


  return total;

}


/* =====================================================
   SELESAI
===================================================== */

function selesaiOlah() {

  if (
    sedangMenyimpan
  ) {

    return;
  }


  if (
    semuaData.length ===
    0
  ) {

    alert(
      "Tidak ada data untuk diproses."
    );

    return;
  }


  const daftarOlah =
    [];


  const daftarSisa =
    [];


  semuaData.forEach(
    function(item) {

      const register =
        getRegister(
          item
        );


      if (
        !register
      ) {

        return;
      }


      if (
        pilihanOlah[
          register
        ] === true
      ) {

        daftarOlah.push(
          register
        );

      }

      else {

        daftarSisa.push(
          register
        );

      }

    }
  );


  if (
    daftarOlah.length ===
    0
  ) {

    alert(

      "Tidak ada kayu yang akan diolah.\n\n" +

      "Semua " +
      daftarSisa.length +
      " batang akan tetap menjadi SISA."

    );

    return;
  }


  const yakin =
    confirm(

      "SELESAIKAN DATA?\n\n" +

      "🟢 Akan DIOLAH: " +
      daftarOlah.length +
      " batang\n\n" +

      "🟠 Menjadi SISA: " +
      daftarSisa.length +
      " batang\n\n" +

      "SISA akan otomatis dibawa ke SESI BARU.\n\n" +

      "Lanjutkan?"

    );


  if (!yakin) {

    return;
  }


  sedangMenyimpan =
    true;


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Menyelesaikan sesi...";


  requestJSONP(

    {

      selesaiOlah:
        "1",

      registers:
        daftarOlah.join(",")

    },

    function(hasil) {

      sedangMenyimpan =
        false;


      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        alert(

          hasil &&
          hasil.message
          ?
          hasil.message
          :
          "Gagal menyelesaikan sesi."

        );


        document.getElementById(
          "status"
        ).innerHTML =
          "❌ Gagal menyimpan";

        return;
      }


      alert(

        "SESI SELESAI.\n\n" +

        "🟢 Diolah: " +
        hasil.diolah +
        " batang\n" +

        "🟠 Sisa: " +
        hasil.sisa +
        " batang\n\n" +

        "SISA sudah dibawa ke SESI BARU.\n\n" +

        "Sesi baru: " +
        hasil.sesiBaru

      );


      /*
       * Reset pilihan.
       */

      pilihanOlah =
        {};


      /*
       * Ambil sesi baru.
       */

      muatData();

    }

  );

}


/* =====================================================
   FORMAT VOLUME
===================================================== */

function formatVolume(
  angka
) {

  return Number(
    angka ||
    0
  ).toLocaleString(
    "id-ID",
    {
      minimumFractionDigits:
        3,

      maximumFractionDigits:
        3
    }
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  teks
) {

  return String(
    teks
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   MULAI
===================================================== */

muatData();
