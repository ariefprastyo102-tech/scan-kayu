
<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Data Olah - IK Saradan</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:12px;
  padding-bottom:75px;

  font-family:Arial,sans-serif;

  background:
    radial-gradient(
      circle at top left,
      #e8f4ed 0,
      #f4f6f8 38%,
      #eef1f3 100%
    );

  color:#20262b;
}


/* =========================================================
   GLOBAL WIDTH
========================================================= */

.header,
.ringkasan,
.searchBox,
.toolbar,
#status,
.bagian,
.pilihanOlah{
  width:100%;
  max-width:620px;

  margin-left:auto;
  margin-right:auto;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  position:relative;

  margin-bottom:12px;

  padding:15px 16px;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #10251a 0%,
      #176b38 58%,
      #23945a 100%
    );

  border:1px solid rgba(255,255,255,.12);

  border-radius:18px;

  box-shadow:
    0 8px 24px rgba(18,76,44,.22);
}

.header::before{
  content:"";

  position:absolute;

  width:170px;
  height:170px;

  right:-65px;
  top:-95px;

  border-radius:50%;

  background:rgba(255,255,255,.07);
}

.header::after{
  content:"";

  position:absolute;

  width:90px;
  height:90px;

  right:35px;
  bottom:-65px;

  border-radius:50%;

  background:rgba(255,255,255,.045);
}

.headerIsi{
  position:relative;

  z-index:2;

  display:flex;

  align-items:center;

  gap:13px;
}

.logo{
  width:68px;
  height:58px;

  flex-shrink:0;

  object-fit:contain;

  padding:3px;

  background:white;

  border-radius:11px;

  box-shadow:
    0 4px 12px rgba(0,0,0,.18);
}

.judulBox{
  min-width:0;

  text-align:left;
}

.judul{
  color:white;

  font-size:23px;

  line-height:1.05;

  font-weight:900;

  letter-spacing:.2px;
}

.subjudul{
  margin-top:5px;

  color:#d8f1e2;

  font-size:11px;

  font-weight:800;

  letter-spacing:1.4px;
}


/* =========================================================
   RINGKASAN
========================================================= */

.ringkasan{
  margin-bottom:12px;

  padding:13px;

  background:#ffffff;

  border:1px solid #dfe5e1;

  border-radius:16px;

  box-shadow:
    0 5px 16px rgba(0,0,0,.07);
}

.ringkasBaris{
  display:flex;

  align-items:stretch;

  justify-content:space-between;

  gap:8px;
}

.ringkasItem{
  flex:1;

  min-width:0;

  padding:10px 6px;

  text-align:center;

  background:#f7f9f8;

  border:1px solid #e5eae7;

  border-radius:12px;
}

.ringkasAngka{
  font-size:32px;

  line-height:1;

  font-weight:900;

  letter-spacing:-1px;
}

.ringkasLabel{
  margin-top:6px;

  font-size:10px;

  font-weight:900;

  letter-spacing:.5px;

  color:#69736d;
}

.hijau{
  color:#176b38;
}

.orange{
  color:#d97706;
}

.volume{
  margin-top:10px;

  padding-top:11px;

  border-top:1px solid #e3e8e5;

  text-align:center;

  color:#176b38;

  font-size:21px;

  font-weight:900;
}


/* =========================================================
   SEARCH
========================================================= */

.searchBox{
  position:relative;

  margin-bottom:9px;
}

.searchBox input{
  width:100%;

  padding:14px 46px 14px 16px;

  border:1px solid #d8e0db;

  border-radius:13px;

  outline:none;

  background:white;

  color:#222;

  font-family:Arial,sans-serif;

  font-size:15px;

  font-weight:700;

  box-shadow:
    0 4px 13px rgba(0,0,0,.06);

  transition:.15s ease;
}

.searchBox input:focus{
  border-color:#176b38;

  box-shadow:
    0 0 0 3px rgba(23,107,56,.10),
    0 4px 13px rgba(0,0,0,.06);
}

.searchIcon{
  position:absolute;

  right:15px;
  top:10px;

  font-size:21px;

  color:#176b38;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  display:flex;

  gap:8px;

  margin-bottom:9px;
}

.toolbar button{
  flex:1;

  min-height:45px;

  border:0;

  border-radius:12px;

  color:white;

  font-size:13px;

  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 4px 10px rgba(0,0,0,.10);

  transition:.12s ease;
}

.toolbar button:active{
  transform:scale(.98);
}

.refresh{
  background:
    linear-gradient(135deg,#1976d2,#2196f3);
}

.selesai{
  background:
    linear-gradient(135deg,#176b38,#249957);
}


/* =========================================================
   PILIHAN JENIS OLAH & BULAN
========================================================= */

.pilihanOlah{
  margin-bottom:9px;

  padding:12px;

  background:white;

  border:1px solid #dfe5e1;

  border-radius:14px;

  box-shadow:
    0 4px 13px rgba(0,0,0,.06);
}

.pilihanOlahBaris{
  display:flex;

  gap:9px;
}

.pilihanOlahItem{
  flex:1;

  min-width:0;
}

.pilihanOlahLabel{
  display:block;

  margin-bottom:5px;

  color:#66716b;

  font-size:10px;

  font-weight:900;

  letter-spacing:.6px;

  text-transform:uppercase;
}

.pilihanOlahInput,
.pilihanOlahSelect{
  width:100%;

  padding:11px 10px;

  border:1px solid #d6ded9;

  border-radius:10px;

  outline:none;

  background:#fafcfb;

  color:#20262b;

  font-family:Arial,sans-serif;

  font-size:14px;

  font-weight:800;
}

.pilihanOlahInput:focus,
.pilihanOlahSelect:focus{
  border-color:#176b38;

  background:white;

  box-shadow:
    0 0 0 3px rgba(23,107,56,.08);
}


/* =========================================================
   STATUS
========================================================= */

#status{
  margin-bottom:9px;

  padding:7px 10px;

  text-align:center;

  color:#68736d;

  font-size:12px;

  font-weight:800;
}


/* =========================================================
   BAGIAN
========================================================= */

.bagian{
  margin-bottom:12px;
}

.judulBagian{
  position:relative;

  margin-bottom:7px;

  padding:12px 14px;

  overflow:hidden;

  background:white;

  border:1px solid #dfe5e1;

  border-radius:13px;

  box-shadow:
    0 4px 12px rgba(0,0,0,.055);
}

.judulBagianAtas{
  font-size:17px;

  font-weight:900;
}

.judulHariIni{
  color:#176b38;
}

.judulSisa{
  color:#b96b00;
}

.detailBagian{
  margin-top:4px;

  color:#66716b;

  font-size:12px;

  font-weight:800;

  line-height:1.45;
}


/* =========================================================
   ITEM REGISTER
========================================================= */

.item{
  position:relative;

  width:100%;

  margin-bottom:7px;

  padding:10px;

  overflow:hidden;

  background:white;

  border:1px solid #dfe5e1;

  border-radius:13px;

  box-shadow:
    0 3px 10px rgba(0,0,0,.055);

  transition:
    transform .12s ease,
    box-shadow .12s ease;
}

.item:active{
  transform:scale(.995);

  box-shadow:
    0 2px 7px rgba(0,0,0,.05);
}


/* =========================================================
   WARNA BARU / SISA
========================================================= */

.itemBaru{
  background:
    linear-gradient(
      100deg,
      #effbf3 0%,
      #ffffff 65%
    );

  border-left:5px solid #176b38;
}

.itemSisa{
  background:
    linear-gradient(
      100deg,
      #fff6df 0%,
      #ffffff 65%
    );

  border-left:5px solid #d97706;
}


/* =========================================================
   BARIS UTAMA
========================================================= */

.barisUtama{
  display:flex;

  align-items:center;

  width:100%;

  gap:7px;

  min-width:0;
}


/* =========================================================
   CHECKBOX
========================================================= */

.checkSisa{
  flex:0 0 32px;

  width:32px;
  height:32px;

  margin:0;

  accent-color:#d97706;

  cursor:pointer;
}


/* =========================================================
   REGISTER
========================================================= */

.register{
  flex:0 0 auto;

  min-width:96px;

  max-width:120px;

  overflow:hidden;

  color:#20282d;

  font-size:17px;

  line-height:1.15;

  font-weight:900;

  white-space:nowrap;

  text-overflow:ellipsis;
}

.registerOlah{
  color:#176b38;
}

.registerSisa{
  color:#b96b00;
}


/* =========================================================
   TOMBOL KEMBALI
========================================================= */

.btn-kembali{
  flex:0 0 44px;

  width:44px;
  height:44px;

  display:flex;

  align-items:center;
  justify-content:center;

  margin:0;

  padding:0;

  border:0;

  border-radius:11px;

  background:#eaf3ed;

  color:#176b38;

  font-size:24px;

  line-height:1;

  font-weight:900;

  cursor:pointer;

  box-shadow:
    inset 0 0 0 1px #d5e5da;

  transition:.12s ease;

  -webkit-tap-highlight-color:transparent;
}

.btn-kembali:active{
  transform:scale(.91);

  background:#dcebe1;
}


/* =========================================================
   DATA PANJANG / DIAMETER / DLL
========================================================= */

.dataRingkas{
  flex:1;

  min-width:0;

  display:flex;

  align-items:center;

  gap:8px;

  overflow-x:auto;

  overflow-y:hidden;

  padding:4px 2px;

  white-space:nowrap;

  -webkit-overflow-scrolling:touch;

  scrollbar-width:thin;
}

.dataRingkas::-webkit-scrollbar{
  height:4px;
}

.dataRingkas::-webkit-scrollbar-track{
  background:#edf1ef;

  border-radius:10px;
}

.dataRingkas::-webkit-scrollbar-thumb{
  background:#aab7af;

  border-radius:10px;
}

.data{
  flex:0 0 auto;

  color:#303a35;

  font-size:14px;

  font-weight:800;

  white-space:nowrap;
}

.pemisah{
  flex:0 0 auto;

  color:#aeb7b2;

  font-size:13px;

  font-weight:900;
}


/* =========================================================
   STATUS KECIL
========================================================= */

.statusKecil{
  margin-top:5px;

  margin-left:40px;

  font-size:10px;

  line-height:1.4;

  font-weight:900;
}

.statusOlah{
  color:#16833a;
}

.statusSisa{
  color:#c16f00;
}


/* =========================================================
   KOSONG
========================================================= */

.kosong{
  margin-bottom:8px;

  padding:30px 12px;

  text-align:center;

  color:#7a847e;

  background:white;

  border:1px dashed #cbd5cf;

  border-radius:13px;

  font-size:14px;

  font-weight:800;
}


/* =========================================================
   HISTORY FLOAT
========================================================= */

.historyFloat{
  position:fixed;

  right:14px;
  bottom:14px;

  z-index:9998;

  width:48px;
  height:48px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:0;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(135deg,#176b38,#239957);

  color:white;

  font-size:19px;

  font-weight:900;

  box-shadow:
    0 7px 18px rgba(0,0,0,.22);

  cursor:pointer;
}

.historyFloat:active{
  transform:scale(.93);
}


/* =========================================================
   HISTORY OVERLAY
========================================================= */

.historyOverlay{
  display:none;

  position:fixed;

  inset:0;

  z-index:9999;

  align-items:center;
  justify-content:center;

  padding:14px;

  background:rgba(8,18,12,.60);

  backdrop-filter:blur(4px);
}

.historyOverlay.aktif{
  display:flex;
}


/* =========================================================
   HISTORY POPUP
========================================================= */

.historyPopup{
  width:100%;

  max-width:580px;

  max-height:88vh;

  overflow:hidden;

  background:#f3f6f4;

  border:1px solid rgba(255,255,255,.15);

  border-radius:18px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.35);

  animation:
    historyMasuk .18s ease-out;
}

@keyframes historyMasuk{

  from{
    transform:translateY(25px) scale(.98);

    opacity:0;
  }

  to{
    transform:translateY(0) scale(1);

    opacity:1;
  }

}


/* =========================================================
   HISTORY HEADER
========================================================= */

.historyHeader{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  padding:14px 15px;

  background:
    linear-gradient(
      135deg,
      #10251a,
      #176b38
    );

  color:white;
}

.historyJudul{
  font-size:18px;

  font-weight:900;
}

.historyTutup{
  width:36px;
  height:36px;

  flex-shrink:0;

  border:0;

  border-radius:10px;

  background:rgba(255,255,255,.15);

  color:white;

  font-size:20px;

  font-weight:900;

  cursor:pointer;
}


/* =========================================================
   HISTORY CONTENT
========================================================= */

.historyIsi{
  max-height:calc(88vh - 64px);

  overflow-y:auto;

  padding:11px;
}


/* =========================================================
   HISTORY TABLE
========================================================= */

.historyTable{
  overflow:hidden;

  background:white;

  border:1px solid #dfe5e1;

  border-radius:13px;

  box-shadow:
    0 3px 10px rgba(0,0,0,.06);
}

.historyHead,
.historyRow{
  display:grid;

  grid-template-columns:
    1.25fr .75fr 1.1fr;

  align-items:center;

  gap:5px;
}

.historyHead{
  padding:11px 9px;

  background:#176b38;

  color:white;

  font-size:11px;

  font-weight:900;

  text-align:center;
}

.historyHead div:first-child{
  text-align:left;
}

.historyRow{
  padding:11px 9px;

  border-top:1px solid #e6ebe8;

  color:#303832;

  font-size:13px;

  font-weight:800;
}

.historyRow div:first-child{
  text-align:left;
}

.historyRow div:nth-child(2),
.historyRow div:nth-child(3){
  text-align:center;
}

.historyVolume{
  color:#176b38;

  font-weight:900;
}


/* =========================================================
   TABLET / HP
========================================================= */

@media(max-width:500px){

  body{
    padding:8px;

    padding-bottom:72px;
  }

  .header{
    padding:13px;

    border-radius:16px;
  }

  .logo{
    width:61px;
    height:53px;
  }

  .judul{
    font-size:20px;
  }

  .subjudul{
    font-size:9px;

    letter-spacing:1.1px;
  }

  .ringkasan{
    padding:10px;
  }

  .ringkasItem{
    padding:9px 4px;
  }

  .ringkasAngka{
    font-size:28px;
  }

  .ringkasLabel{
    font-size:9px;
  }

  .volume{
    font-size:19px;
  }

  .pilihanOlah{
    padding:10px;
  }

  .item{
    padding:9px;

    border-radius:11px;
  }

  .checkSisa{
    flex-basis:32px;

    width:32px;
    height:32px;
  }

  .register{
    min-width:82px;

    max-width:100px;

    font-size:16px;
  }

  .btn-kembali{
    flex-basis:44px;

    width:44px;
    height:44px;

    font-size:23px;
  }

  .dataRingkas{
    gap:7px;
  }

  .data{
    font-size:13px;
  }

  .statusKecil{
    margin-left:39px;

    font-size:10px;
  }

  .historyFloat{
    right:11px;
    bottom:11px;

    width:46px;
    height:46px;
  }

  .historyPopup{
    max-height:91vh;

    border-radius:16px;
  }

  .historyIsi{
    max-height:calc(91vh - 64px);
  }
}


/* =========================================================
   ANDROID / HP KECIL
========================================================= */

@media(max-width:380px){

  .header{
    padding:11px;
  }

  .logo{
    width:56px;
    height:49px;
  }

  .judul{
    font-size:18px;
  }

  .subjudul{
    font-size:8px;
  }

  .ringkasAngka{
    font-size:25px;
  }

  .ringkasLabel{
    font-size:8px;
  }

  .item{
    padding:8px;
  }

  .checkSisa{
    flex-basis:30px;

    width:30px;
    height:30px;
  }

  .register{
    min-width:74px;

    max-width:88px;

    font-size:15px;
  }

  .btn-kembali{
    flex-basis:44px;

    width:44px;
    height:44px;

    font-size:22px;
  }

  .data{
    font-size:12px;
  }

  .statusKecil{
    margin-left:37px;

    font-size:9px;
  }

  .toolbar button{
    min-height:43px;

    font-size:12px;
  }

  .historyFloat{
    width:44px;
    height:44px;
  }
}


/* =========================================================
   HP SANGAT KECIL
========================================================= */

@media(max-width:340px){

  body{
    padding:6px;
  }

  .headerIsi{
    gap:9px;
  }

  .logo{
    width:52px;
    height:46px;
  }

  .judul{
    font-size:17px;
  }

  .subjudul{
    font-size:7px;
  }

  .ringkasAngka{
    font-size:23px;
  }

  .ringkasLabel{
    font-size:8px;
  }

  .register{
    min-width:68px;

    max-width:80px;

    font-size:14px;
  }

  .btn-kembali{
    flex-basis:42px;

    width:42px;
    height:42px;

    font-size:21px;
  }

  .data{
    font-size:11px;
  }

  .historyHead{
    font-size:10px;
  }

  .historyRow{
    font-size:12px;
  }

  .pilihanOlahBaris{
    flex-direction:column;

    gap:7px;
  }
}

</style>
</head>

<body>

<div class="header">

  <div class="headerIsi">

    <img
      class="logo"
      src="logo-perhutani.jpg"
      alt="Logo Perhutani">

    <div class="judulBox">

      <div class="judul">
        DATA OLAH
      </div>

      <div class="subjudul">
        IK SARADAN
      </div>

    </div>

  </div>

</div>

<div class="ringkasan">

  <div class="ringkasBaris">

    <div class="ringkasItem">

      <div
        id="jumlahHariIni"
        class="ringkasAngka hijau">
        0
      </div>

      <div class="ringkasLabel">
        KAYU MASUK BARU
      </div>

    </div>

    <div class="ringkasItem">

      <div
        id="jumlahSisa"
        class="ringkasAngka orange">
        0
      </div>

      <div class="ringkasLabel">
        SISA
      </div>

    </div>

  </div>

  <div
    id="volumeOlah"
    class="volume">

    TOTAL VOLUME: 0,000 M³

  </div>

</div>

<div class="searchBox">

  <input
    id="searchRegister"
    type="search"
    placeholder="🔎 Cari nomor register..."
    oninput="filterData()">

  <span class="searchIcon">
    🔎
  </span>

</div>


<!-- =====================================================
     PILIHAN JENIS OLAH & BULAN OLAH
===================================================== -->

<div class="pilihanOlah">

  <div class="pilihanOlahBaris">

    <div class="pilihanOlahItem">

      <label
        class="pilihanOlahLabel"
        for="jenisOlah">

        JENIS OLAH

      </label>

      <input
        id="jenisOlah"
        class="pilihanOlahInput"
        type="text"
        value="REGULER"
        placeholder="Contoh: REGULER">

    </div>


    <div class="pilihanOlahItem">

      <label
        class="pilihanOlahLabel"
        for="bulanOlah">

        BULAN OLAH

      </label>

      <select
        id="bulanOlah"
        class="pilihanOlahSelect">

        <option value="">
          PILIH BULAN
        </option>

        <option value="JANUARI">
          JANUARI
        </option>

        <option value="FEBRUARI">
          FEBRUARI
        </option>

        <option value="MARET">
          MARET
        </option>

        <option value="APRIL">
          APRIL
        </option>

        <option value="MEI">
          MEI
        </option>

        <option value="JUNI">
          JUNI
        </option>

        <option value="JULI">
          JULI
        </option>

        <option value="AGUSTUS">
          AGUSTUS
        </option>

        <option value="SEPTEMBER">
          SEPTEMBER
        </option>

        <option value="OKTOBER">
          OKTOBER
        </option>

        <option value="NOVEMBER">
          NOVEMBER
        </option>

        <option value="DESEMBER">
          DESEMBER
        </option>

      </select>

    </div>

  </div>

</div>


<div class="toolbar">

  <button
    class="refresh"
    onclick="muatData()">

    🔄 REFRESH

  </button>

  <button
    class="selesai"
    onclick="selesaiOlah()">

    ✅ SELESAI

  </button>

</div>

<div id="status">
  Memuat data...
</div>

<div class="bagian">

  <div class="judulBagian">

    <div class="judulBagianAtas judulHariIni">
      🟢 DATA BARU / AKAN DIOLAH
    </div>

<script>

// =====================================================
// API
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbx3wriyYJKQAUWp_QMWR3J0TxwdjVL0Htigd2g59vawku1c4abcwORWT8rwHzdlsg/exec";

const API_BARCODE_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";

let semuaData = [];

let sedangMemuat = false;

let sedangMenyimpan = false;


// =====================================================
// PENYIMPANAN CENTANG SEMENTARA
// =====================================================
//
// Hanya menyimpan REGISTER yang dipilih sementara.
//
// Tidak dikirim ke Apps Script.
// Tidak mengubah DATABASE.
// Tetap ada walaupun halaman di-refresh.
//
// Setelah SELESAI OLAH berhasil,
// penyimpanan ini dibersihkan.
//

const STORAGE_CENTANG =
  "DATA_OLAH_CENTANG_SEMENTARA";


function ambilCentangTersimpan() {

  try {

    const data =
      localStorage.getItem(
        STORAGE_CENTANG
      );

    if (!data) {
      return [];
    }


    const hasil =
      JSON.parse(data);


    return Array.isArray(hasil)
      ? hasil.map(function(register) {

          return String(
            register
          ).trim();

        })
        .filter(Boolean)

      : [];

  }

  catch(e) {

    return [];

  }

}


function simpanCentangTersimpan(
  daftar
) {

  try {

    const unik =
      [
        ...new Set(
          daftar
            .map(function(register) {

              return String(
                register
              ).trim();

            })
            .filter(Boolean)
        )
      ];


    localStorage.setItem(

      STORAGE_CENTANG,

      JSON.stringify(
        unik
      )

    );

  }

  catch(e) {

    console.error(
      "Gagal menyimpan centang:",
      e
    );

  }

}


function tambahCentangTersimpan(
  register
) {

  register =
    String(
      register || ""
    ).trim();


  if (!register) {
    return;
  }


  const daftar =
    ambilCentangTersimpan();


  if (
    !daftar.includes(
      register
    )
  ) {

    daftar.push(
      register
    );

  }


  simpanCentangTersimpan(
    daftar
  );

}


function hapusCentangTersimpan(
  register
) {

  register =
    String(
      register || ""
    ).trim();


  if (!register) {
    return;
  }


  const daftar =
    ambilCentangTersimpan()
      .filter(function(item) {

        return item !== register;

      });


  simpanCentangTersimpan(
    daftar
  );

}


function centangTersimpan(
  register
) {

  register =
    String(
      register || ""
    ).trim();


  if (!register) {
    return false;
  }


  return ambilCentangTersimpan()
    .includes(
      register
    );

}


function bersihkanCentangTersimpan() {

  try {

    localStorage.removeItem(
      STORAGE_CENTANG
    );

  }

  catch(e) {

    console.error(
      "Gagal membersihkan centang:",
      e
    );

  }

}


// =====================================================
// JSONP
// =====================================================

function requestJSONP(
  parameter,
  callback
) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8);


  let selesai = false;


  function bersihkan() {

    if (selesai) return;

    selesai = true;

    delete window[callbackName];


    const script =
      document.getElementById(
        callbackName
      );


    if (script) {
      script.remove();
    }

  }


  window[callbackName] =
    function(hasil) {

      bersihkan();

      callback(hasil);

    };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  let url =
    API_URL + "?";


  Object.keys(parameter)
    .forEach(function(key) {

      url +=
        encodeURIComponent(key) +
        "=" +
        encodeURIComponent(
          parameter[key]
        ) +
        "&";

    });


  url +=
    "callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {

      bersihkan();


      callback({

        status:
          "error",

        message:
          "Gagal menghubungi server."

      });

    };


  document.body.appendChild(
    script
  );


  setTimeout(function() {

    if (!selesai) {

      bersihkan();


      callback({

        status:
          "error",

        message:
          "Server tidak memberikan jawaban."

      });

    }

  },60000);

}

function requestJSONPBarcode(parameter, callback) {
  const callbackName =
    "callbackBarcode_" + Date.now() + "_" + Math.floor(Math.random() * 1000);

  window[callbackName] = function(data) {
    try {
      callback(data);
    } finally {
      delete window[callbackName];
      script.remove();
    }
  };

  const script = document.createElement("script");

  const params = new URLSearchParams(parameter);
  params.set("callback", callbackName);

  script.src =
    API_BARCODE_URL + "?" + params.toString();

  script.onerror = function() {
    callback({
      status: "error",
      message: "Gagal terhubung ke API barcode"
    });

    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
} 

function kembaliKeTumpuk(register) {

  if (!register) {
    alert("Register tidak ditemukan.");
    return;
  }

  if (!confirm(
    "Register " + register +
    " akan dikembalikan ke tumpukan.\n\nLanjutkan?"
  )) {
    return;
  }

  requestJSONPBarcode(
    {
      kembaliKeTumpuk: register
    },
    function(res) {

      if (res && res.status === "success") {

        alert(
          res.message ||
          "Register " + register +
          " berhasil dikembalikan ke tumpukan."
        );

        // Nanti di langkah berikutnya kita refresh DATA OLAH
        muatData();

      } else {

        alert(
          (res && res.message) ||
          "Gagal mengembalikan register ke tumpukan."
        );

      }

    }
  );
}
  
// =====================================================
// MUAT DATA
// =====================================================

function muatData() {

  if (sedangMemuat) return;


  sedangMemuat = true;


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Mengambil data...";


  requestJSONP(

    {
      getDataOlah:"1"
    },

    function(hasil) {

      sedangMemuat = false;


      if (
        !hasil ||
        hasil.status !== "success"
      ) {

        document.getElementById(
          "status"
        ).innerHTML =
          "❌ Gagal mengambil data";

        return;

      }


      semuaData =
        Array.isArray(
          hasil.data
        )
        ? hasil.data
        : [];


      /*
       * =================================================
       * TERAPKAN KEMBALI CENTANG YANG TERSIMPAN
       * =================================================
       *
       * Data dari server baru saja masuk.
       *
       * Kalau register sebelumnya sudah dicentang,
       * kembalikan status sementara menjadi SISA.
       *
       * Register baru yang belum pernah dicentang
       * tidak disentuh, sehingga tetap DATA BARU.
       */

      const daftarCentang =
        ambilCentangTersimpan();


      semuaData.forEach(
        function(item) {

          const register =
            String(
              item.register ||
              (
                item.data &&
                item.data[0]
              ) ||
              ""
            ).trim();


          if (
            register &&
            daftarCentang.includes(
              register
            )
          ) {

            item._statusSementara =
              "SISA";

          }

        }
      );


      tampilkanData();


      muatHistoryOlah();


      document.getElementById(
        "status"
      ).innerHTML =
        "📊 Data diperbarui";

    }

  );

}


// =====================================================
// PARSE VOLUME
// =====================================================

function parseVolume(nilai) {

  if (
    nilai === null ||
    nilai === undefined ||
    nilai === ""
  ) {

    return 0;

  }


  let teks =
    String(nilai)
      .trim()
      .replace(/\s/g,"");


  teks =
    teks.replace(",", ".");


  const angka =
    parseFloat(teks);


  return isNaN(angka)
    ? 0
    : angka;

}


// =====================================================
// STATUS TAMPILAN SEMENTARA
// =====================================================

function statusTampilan(item) {

  /*
   * Kalau ada pilihan sementara,
   * gunakan pilihan tersebut.
   */

  if (
    item &&
    item._statusSementara
  ) {

    return String(
      item._statusSementara
    )
    .trim()
    .toUpperCase();

  }


  /*
   * Default berdasarkan status server:
   *
   * BARU = DIOLAH
   * SISA = SISA
   */

  const statusAsli =
    String(
      item.status || ""
    )
    .trim()
    .toUpperCase();


  if (
    statusAsli === "BARU"
  ) {

    return "DIOLAH";

  }


  if (
    statusAsli === "SISA"
  ) {

    return "SISA";

  }


  return statusAsli;

}


// =====================================================
// TAMPILKAN DATA
// =====================================================

function tampilkanData() {

  /*
   * SEMUA DATA DITENTUKAN DARI
   * STATUS YANG SEDANG DIPILIH.
   *
   * DIOLAH → DATA BARU / AKAN DIOLAH
   * SISA   → SISA SEBELUMNYA
   */

  const baru =
    semuaData.filter(function(item) {

      return (
        statusTampilan(item) ===
        "DIOLAH"
      );

    });


  const sisa =
    semuaData.filter(function(item) {

      return (
        statusTampilan(item) ===
        "SISA"
      );

    });


  /*
   * JUMLAH DATA AKAN DIOLAH
   */

  document.getElementById(
    "jumlahHariIni"
  ).innerHTML =
    baru.length;


  /*
   * JUMLAH SISA
   */

  document.getElementById(
    "jumlahSisa"
  ).innerHTML =
    sisa.length;


  /*
   * VOLUME AKAN DIOLAH
   */

  const volumeBaru =
    hitungVolume(baru);


  /*
   * VOLUME SISA
   */

  const volumeSisa =
    hitungVolume(sisa);


  /*
   * TOTAL VOLUME
   */

  const volumeTotal =
    volumeBaru +
    volumeSisa;


  document.getElementById(
    "detailHariIni"
  ).innerHTML =

    baru.length +
    " batang • " +
    formatVolume(volumeBaru) +
    " M³";


  document.getElementById(
    "detailSisa"
  ).innerHTML =

    sisa.length +
    " batang • " +
    formatVolume(volumeSisa) +
    " M³";


  document.getElementById(
    "volumeOlah"
  ).innerHTML =

    "TOTAL VOLUME: " +
    formatVolume(volumeTotal) +
    " M³";


  filterData();

}


// =====================================================
// FILTER DATA
// =====================================================

function filterData() {

  const input =
    document.getElementById(
      "searchRegister"
    );


  const kata =
    String(
      input.value || ""
    )
    .trim()
    .toLowerCase();


  /*
   * DATA BARU / AKAN DIOLAH
   */

  const baru =
    semuaData.filter(function(item) {

      return (
        statusTampilan(item) ===
        "DIOLAH" &&
        cocokSearch(
          item,
          kata
        )
      );

    });


  /*
   * SISA
   */

  const sisa =
    semuaData.filter(function(item) {

      return (
        statusTampilan(item) ===
        "SISA" &&
        cocokSearch(
          item,
          kata
        )
      );

    });


  renderDaftar(
    baru,
    "daftarHariIni"
  );


  renderDaftar(
    sisa,
    "daftarSisa"
  );

}


// =====================================================
// COCOK SEARCH
// =====================================================

function cocokSearch(
  item,
  kata
) {

  if (!kata) {
    return true;
  }


  return String(
    item.register ||
    (
      item.data &&
      item.data[0]
    ) ||
    ""
  )
  .toLowerCase()
  .includes(kata);

}


// =====================================================
// RENDER DAFTAR
// =====================================================

function renderDaftar(
  data,
  id
) {

  const daftar =
    document.getElementById(
      id
    );


  daftar.innerHTML = "";


  if (
    data.length === 0
  ) {

    daftar.innerHTML =

      `<div class="kosong">
        ${
          id === "daftarSisa"
            ? "Tidak ada SISA."
            : "Tidak ada data baru."
        }
      </div>`;


    return;

  }


  data
    .slice()
    .reverse()
    .forEach(function(item) {

      buatItem(
        item,
        daftar
      );

    });

}


// =====================================================
// BUAT ITEM
// =====================================================

function buatItem(
  item,
  daftar
) {

  const status =
    statusTampilan(item);


  const isSisa =
    status === "SISA";


  const div =
    document.createElement(
      "div"
    );


  div.className =
    isSisa
      ? "item itemSisa"
      : "item itemBaru";


  const data =
    Array.isArray(item.data)
      ? item.data
      : [];


  const registerRaw =
    String(
      item.register ||
      data[0] ||
      ""
    ).trim();


  const register =
    escapeHTML(
      registerRaw
    );


  const panjang =
    escapeHTML(
      data[1] || "-"
    );


  const diameter =
    escapeHTML(
      data[2] || "-"
    );


  const tpk =
    escapeHTML(
      data[3] || "-"
    );


  const tumpuk =
    escapeHTML(
      data[4] || "-"
    );


  const mutu =
    escapeHTML(
      data[5] || "-"
    );


  const m3 =
    escapeHTML(
      data[7] || "-"
    );


  /*
   * =================================================
   * CHECKBOX UNTUK SEMUA DATA
   * =================================================
   *
   * DATA BARU:
   *   default tidak dicentang
   *   centang → SISA
   *
   * SISA:
   *   default dicentang
   *   lepas → DIOLAH
   *
   * CENTANG YANG DISIMPAN DI LOCALSTORAGE
   * juga akan tetap dicentang setelah refresh.
   *
   */

  const checkboxHTML = `

    <input
      type="checkbox"
      class="checkSisa"
      data-register="${escapeHTML(registerRaw)}"
      ${isSisa ? "checked" : ""}
      onchange="ubahStatusSementara(this)">

  `;


  /*
   * KETERANGAN STATUS
   */

  let keteranganStatus = "";


  if (
    isSisa
  ) {

    /*
     * Baik SISA lama maupun DATA BARU
     * yang sementara dipindahkan ke SISA.
     */

    const statusAsli =
      String(
        item.status || ""
      )
      .trim()
      .toUpperCase();


    if (
      statusAsli === "SISA"
    ) {

      keteranganStatus =
        "🟠 DICENTANG = TETAP SISA";

    }

    else {

      keteranganStatus =
        "🟠 DICENTANG = JADI SISA";

    }

  }

  else {

    const statusAsli =
      String(
        item.status || ""
      )
      .trim()
      .toUpperCase();


    if (
      statusAsli === "SISA"
    ) {

      keteranganStatus =
        "🟢 TIDAK DICENTANG = IKUT DIOLAH";

    }

    else {

      keteranganStatus =
        "🟢 TIDAK DICENTANG = IKUT DIOLAH";

    }

  }


  div.innerHTML = `

    <div class="barisUtama">

      ${checkboxHTML}

     <div
  class="register ${
    isSisa
      ? "registerSisa"
      : "registerOlah"
  }">

  ${register}

</div>

<button
  class="btn-kembali"
  title="Kembali ke tumpuk"
  onclick="kembaliKeTumpuk('${escapeHTML(registerRaw)}')">

  ↩

</button>


     <div class="dataRingkas">

  <span class="data">
    ${panjang}
  </span>

  <span class="pemisah">
    ×
  </span>

  <span class="data">
    ${diameter}
  </span>

  <span class="pemisah">
    |
  </span>

  <span class="data">
    ${tumpuk}
  </span>

  <span class="pemisah">
    |
  </span>

  <span class="data">
    ${tpk}
  </span>

  <span class="pemisah">
    |
  </span>

  <span class="data">
    ${mutu}
  </span>

  <span class="pemisah">
    |
  </span>

  <span class="data">
    ${m3}
  </span>

</div>
    </div>


    <div
      class="statusKecil ${
        isSisa
          ? "statusSisa"
          : "statusOlah"
      }">

      ${keteranganStatus}

    </div>

  `;


  daftar.appendChild(
    div
  );

}


// =====================================================
// UBAH STATUS SEMENTARA
// =====================================================

function ubahStatusSementara(
  checkbox
) {

  const register =
    String(
      checkbox.getAttribute(
        "data-register"
      ) || ""
    ).trim();


  if (!register) {
    return;
  }


  /*
   * Cari data asli.
   */

  const item =
    semuaData.find(
      function(data) {

        return String(
          data.register ||
          (
            data.data &&
            data.data[0]
          ) ||
          ""
        )
        .trim()
        ===
        register;

      }
    );


  if (!item) {
    return;
  }


  /*
   * =================================================
   * SIMPAN PILIHAN KE LOCALSTORAGE
   * =================================================
   *
   * Ini yang membuat centangan tidak hilang
   * ketika halaman di-refresh.
   */

  if (
    checkbox.checked
  ) {

    /*
     * CENTANG
     * → simpan register
     */

    tambahCentangTersimpan(
      register
    );

  }

  else {

    /*
     * TIDAK DICENTANG
     * → hapus register dari penyimpanan
     */

    hapusCentangTersimpan(
      register
    );

  }


  /*
   * =================================================
   * INI INTI LOGIKA STATUS SEMENTARA
   * =================================================
   *
   * CENTANG       → SISA
   * TIDAK CENTANG → DIOLAH
   *
   * Berlaku untuk:
   *
   * - DATA BARU
   * - SISA SEBELUMNYA
   */

  item._statusSementara =
    checkbox.checked
      ? "SISA"
      : "DIOLAH";


  /*
   * Render ulang supaya data langsung
   * berpindah bagian.
   */

  tampilkanData();


  /*
   * Pesan sementara.
   */

  if (
    checkbox.checked
  ) {

    const statusAsli =
      String(
        item.status || ""
      )
      .trim()
      .toUpperCase();


    if (
      statusAsli === "BARU"
    ) {

      document.getElementById(
        "status"
      ).innerHTML =
        "🟠 DATA BARU dipindahkan ke SISA sementara";

    }

    else {

      document.getElementById(
        "status"
      ).innerHTML =
        "🟠 Data dipertahankan sebagai SISA sementara";

    }

  }

  else {

    document.getElementById(
      "status"
    ).innerHTML =
      "🟢 Data dipindahkan ke DATA BARU sementara";

  }

}


// =====================================================
// HITUNG VOLUME BERDASARKAN KEPUTUSAN SEMENTARA
// =====================================================

function hitungVolumeDariCheckbox() {

  let total = 0;


  semuaData.forEach(
    function(item) {

      const statusSekarang =
        statusTampilan(item);


      /*
       * Hanya yang status akhirnya
       * sementara DIOLAH.
       */

      if (
        statusSekarang !==
        "DIOLAH"
      ) {

        return;

      }


      const data =
        item.data || [];


      total +=
        parseVolume(
          data[7]
        );

    }
  );


  document.getElementById(
    "volumeOlah"
  ).innerHTML =

    "TOTAL VOLUME DIOLAH: " +
    formatVolume(total) +
    " M³";

}


// =====================================================
// SELESAI OLAH
// =====================================================

function selesaiOlah() {

  if (
    sedangMenyimpan
  ) {

    return;

  }


  if (
    semuaData.length === 0
  ) {

    alert(
      "Tidak ada data untuk diproses."
    );

    return;

  }


  /*
   * =================================================
   * AMBIL JENIS OLAH
   * =================================================
   */

  const jenisOlah =
    String(
      document.getElementById(
        "jenisOlah"
      ).value || ""
    ).trim();


  /*
   * =================================================
   * AMBIL BULAN OLAH
   * =================================================
   */

  const bulanOlah =
    String(
      document.getElementById(
        "bulanOlah"
      ).value || ""
    ).trim();


  /*
   * JENIS OLAH WAJIB DIISI
   */

  if (!jenisOlah) {

    alert(
      "JENIS OLAH belum diisi."
    );

    document.getElementById(
      "jenisOlah"
    ).focus();

    return;

  }


  /*
   * BULAN OLAH WAJIB DIPILIH
   */

  if (!bulanOlah) {

    alert(
      "Silakan pilih BULAN OLAH."
    );

    document.getElementById(
      "bulanOlah"
    ).focus();

    return;

  }


  /*
   * =================================================
   * KEPUTUSAN DIAMBIL DARI STATUS SEMENTARA
   * =================================================
   *
   * Tidak peduli data asalnya BARU atau SISA.
   *
   * Yang penting:
   *
   * DIOLAH → DATA OLAH
   * SISA   → SISA
   *
   */


  const daftarOlah = [];

  const daftarSisa = [];


  semuaData.forEach(
    function(item) {

      const register =
        String(
          item.register ||
          (
            item.data &&
            item.data[0]
          ) ||
          ""
        ).trim();


      if (!register) {
        return;
      }


      const statusSekarang =
        statusTampilan(item);


      /*
       * STATUS AKHIR:
       *
       * DIOLAH
       */

      if (
        statusSekarang ===
        "DIOLAH"
      ) {

        daftarOlah.push(
          register
        );

        return;

      }


      /*
       * STATUS AKHIR:
       *
       * SISA
       */

      if (
        statusSekarang ===
        "SISA"
      ) {

        daftarSisa.push(
          register
        );

      }

    }
  );


  /*
   * Konfirmasi sebelum benar-benar menyimpan.
   */

  const yakin =
    confirm(

      "SELESAIKAN DATA?\n\n" +

      "JENIS OLAH: " +
      jenisOlah +
      "\n" +

      "BULAN OLAH: " +
      bulanOlah +
      "\n\n" +

      "🟢 DIOLAH: " +
      daftarOlah.length +
      " batang\n\n" +

      "🟠 SISA: " +
      daftarSisa.length +
      " batang\n\n" +

      "Data yang tampil di atas adalah\n" +
      "keputusan sementara yang sudah lu pilih.\n\n" +

      "Setelah klik OK:\n" +

      "• ⬜ TIDAK DICENTANG → DATA OLAH\n" +
      "• ☑️ DICENTANG → SISA\n\n" +

      "Lanjutkan?"

    );


  if (!yakin) {
    return;
  }


  sedangMenyimpan =
    true;


  document.getElementById(
    "status"
  ).innerHTML =
    "⏳ Menyimpan hasil olah...";


  requestJSONP(

    {

      selesaiOlah:
        "1",

      registers:
        daftarOlah.join(","),

      sisa:
        daftarSisa.join(","),

      jenisOlah:
        jenisOlah,

      bulanOlah:
        bulanOlah

    },


    function(hasil) {


      sedangMenyimpan =
        false;


      if (
        !hasil ||
        hasil.status !== "success"
      ) {

        alert(

          hasil &&
          hasil.message

            ? hasil.message

            : "Gagal menyimpan."

        );


        document.getElementById(
          "status"
        ).innerHTML =
          "❌ Gagal menyimpan";


        /*
         * PENTING:
         *
         * Kalau penyimpanan gagal,
         * centangan LOCALSTORAGE TIDAK DIHAPUS.
         *
         * Jadi keputusan sementara masih aman.
         */

        return;

      }


      /*
       * =================================================
       * SELESAI BERHASIL
       * =================================================
       *
       * Baru sekarang centangan sementara
       * dibersihkan.
       */

      bersihkanCentangTersimpan();


      /*
       * Hapus status sementara dari memory.
       */

      semuaData.forEach(
        function(item) {

          delete item._statusSementara;

        }
      );


      alert(

        "SELESAI.\n\n" +

        "JENIS OLAH: " +
        jenisOlah +
        "\n" +

        "BULAN OLAH: " +
        bulanOlah +
        "\n\n" +

        "🟢 Diolah: " +
        hasil.diolah +
        " batang\n" +

        "🟠 Sisa: " +
        hasil.sisa +
        " batang\n\n" +

        "Sekarang data tersebut sudah menjadi batas sesi selesai.\n\n" +

        "Kalau ada scan baru, otomatis muncul sebagai DATA BARU."

      );


      muatData();

    }

  );

}


// =====================================================
// HITUNG VOLUME
// =====================================================

function hitungVolume(
  data
) {

  let total = 0;


  data.forEach(
    function(item) {

      const d =
        item.data || [];


      total +=
        parseVolume(
          d[7]
        );

    }
  );


  return total;

}


// =====================================================
// FORMAT VOLUME
// =====================================================

function formatVolume(
  angka
) {

  return Number(
    angka || 0
  )
  .toLocaleString(
    "id-ID",
    {

      minimumFractionDigits: 3,

      maximumFractionDigits: 3

    }

  );

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(
  teks
) {

  return String(
    teks
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


// =====================================================
// MUAT HISTORY
// =====================================================

function muatHistoryOlah() {

  requestJSONP(

    {
      getHistoryOlah:
        "1"
    },

    function(hasil) {

      if (
        !hasil ||
        hasil.status !== "success"
      ) {

        document.getElementById(
          "historyOlah"
        ).innerHTML =

          '<div class="kosong">' +
          '❌ Gagal mengambil history olah.' +
          '</div>';

        return;

      }


      renderHistoryOlah(

        Array.isArray(
          hasil.data
        )
          ? hasil.data
          : []

      );

    }

  );

}


// =====================================================
// RENDER HISTORY
// =====================================================

function renderHistoryOlah(
  data
) {

  const el =
    document.getElementById(
      "historyOlah"
    );


  if (
    !data.length
  ) {

    el.innerHTML =

      '<div class="kosong">' +
      'Belum ada history olah.' +
      '</div>';

    return;

  }


  el.innerHTML = "";


  data.forEach(
    function(item) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "historyRow";


      const tanggal =
        document.createElement(
          "div"
        );


      tanggal.innerHTML =
        escapeHTML(
          item.tanggal || "-"
        );


      const batang =
        document.createElement(
          "div"
        );


      batang.innerHTML =
        Number(
          item.batang || 0
        )
        .toLocaleString(
          "id-ID"
        );


      const volume =
        document.createElement(
          "div"
        );


      volume.className =
        "historyVolume";


      volume.innerHTML =
        formatVolume(
          item.volume
        ) +
        " M³";


      row.appendChild(
        tanggal
      );


      row.appendChild(
        batang
      );


      row.appendChild(
        volume
      );


      el.appendChild(
        row
      );

    }
  );

}


// =====================================================
// BUKA HISTORY
// =====================================================

function bukaHistory() {

  const overlay =
    document.getElementById(
      "historyOverlay"
    );


  overlay.classList.add(
    "aktif"
  );


  muatHistoryOlah();


  document.body.style.overflow =
    "hidden";

}


// =====================================================
// TUTUP HISTORY
// =====================================================

function tutupHistory() {

  const overlay =
    document.getElementById(
      "historyOverlay"
    );


  overlay.classList.remove(
    "aktif"
  );


  document.body.style.overflow =
    "";

}


// =====================================================
// KLIK LUAR HISTORY
// =====================================================

function klikLuarHistory(
  event
) {

  if (
    event.target.id ===
    "historyOverlay"
  ) {

    tutupHistory();

  }

}


// =====================================================
// MULAI
// =====================================================

muatData();

</script>
