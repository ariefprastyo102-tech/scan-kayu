
<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PASOKAN & PERSEDIAAN BBI IK SARADAN</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    color:#222;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    background:#176b3a;
    color:white;
    text-align:center;
    padding:22px 15px;
}

.header h1{
    margin:0;
    font-size:30px;
    letter-spacing:1px;
}

.header p{
    margin:6px 0 0;
    font-size:14px;
}

/* =====================================================
   MENU
===================================================== */

.menu{
    display:flex;
    justify-content:center;
    gap:12px;
    padding:20px 15px;
    background:white;
    border-bottom:1px solid #ddd;
}

.menu button{
    border:0;
    padding:14px 25px;
    border-radius:8px;
    background:#ddd;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.menu button.active{
    background:#176b3a;
    color:white;
}

/* =====================================================
   RUANG
===================================================== */

.ruang{
    max-width:1000px;
    margin:20px auto;
    padding:0 15px;
}

.kartu{
    background:white;
    border-radius:10px;
    padding:25px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.kartu h2{
    margin-top:0;
    color:#176b3a;
}

/* =====================================================
   FILTER
===================================================== */

.filter{
    display:flex;
    align-items:center;
    gap:10px;
    margin:20px 0;
}

.filter label{
    font-weight:bold;
}

.filter select{
    padding:9px 12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

/* =====================================================
   JUDUL BAGIAN
===================================================== */

.kartu h3{
    margin-top:25px;
    margin-bottom:12px;
}

/* =====================================================
   TABEL
===================================================== */

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,
td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#176b3a;
    color:white;
}

tbody tr:last-child th{
    background:#e8f1eb;
    color:#222;
}

/* =====================================================
   TOTAL RINCIAN - WARNA KHUSUS
===================================================== */

.rincian th.total-header{
    background:#8b5a2b;
    color:white;
}

.rincian td.total-cell{
    background:#f3e4d2;
    color:#222;
    font-weight:bold;
}

.rincian tr.baris-total td.total-cell{
    background:#d9bd9a;
    color:#222;
    font-weight:bold;
}

.rincian tr.baris-total td.total-label{
    background:#e8f1eb;
    color:#222;
    font-weight:bold;
}

/* =====================================================
   RINCIAN
===================================================== */

.rincian{
    border:1px solid #ddd;
    border-radius:6px;
    padding:15px;
    background:#fafafa;
    overflow-x:auto;
}

.rincian table{
    margin-top:0;
}

.rincian th{
    white-space:nowrap;
}

.rincian td{
    white-space:nowrap;
}

.loading{
    text-align:center;
    padding:20px;
    color:#666;
}

.error{
    padding:15px;
    background:#ffe5e5;
    color:#a00000;
    border:1px solid #ffb5b5;
    border-radius:6px;
    margin-top:15px;
}

.kosong{
    text-align:center;
    padding:20px;
    color:#777;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px){

    .header h1{
        font-size:22px;
    }

    .menu{
        gap:6px;
    }

    .menu button{
        padding:12px 15px;
        font-size:14px;
    }

    .kartu{
        padding:15px;
    }

    .filter{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

<h1>PASOKAN & PERSEDIAAN BBI IK SARADAN</h1>

<p>Sistem Monitoring Persediaan</p>

</div>

<!-- =====================================================
     MENU
===================================================== -->

<div class="menu">

<button
    class="active"
    onclick="bukaRuang('pasokan',this)">
    PASOKAN
</button>

<button
    onclick="bukaRuang('olah',this)">
    OLAH
</button>

<button
    onclick="bukaRuang('sisa',this)">
    SISA
</button>

</div>

<!-- =====================================================
     RUANG
===================================================== -->

<div class="ruang">

<!-- =================================================
     PASOKAN
================================================== -->

<div id="pasokan" class="kartu">

    <h2>PASOKAN</h2>

    <!-- FILTER BULAN -->

    <div class="filter">

        <label for="bulanPasokan">
            FILTER BULAN
        </label>

        <select id="bulanPasokan">

            <option value="SEMUA">
                SEMUA BULAN
            </option>

            <option value="JANUARI">
                JANUARI
            </option>

            <option value="FEBRUARI">
                FEBRUARI
            </option>

            <option value="MARET">
                MARET
            </option>

            <option value="APRIL">
                APRIL
            </option>

            <option value="MEI">
                MEI
            </option>

            <option value="JUNI">
                JUNI
            </option>

            <option value="JULI">
                JULI
            </option>

            <option value="AGUSTUS">
                AGUSTUS
            </option>

            <option value="SEPTEMBER">
                SEPTEMBER
            </option>

            <option value="OKTOBER">
                OKTOBER
            </option>

            <option value="NOVEMBER">
                NOVEMBER
            </option>

            <option value="DESEMBER">
                DESEMBER
            </option>

        </select>

    </div>

    <!-- STATUS -->

    <div id="statusPasokan"
         class="loading">

        MEMUAT DATA PASOKAN...

    </div>

    <!-- TOTAL PASOKAN -->

    <h3>
        TOTAL PASOKAN
    </h3>

    <table>

        <thead>

            <tr>

                <th>
                    SORTIMEN
                </th>

                <th>
                    BATANG
                </th>

                <th>
                    VOLUME (M³)
                </th>

            </tr>

        </thead>

        <tbody>

            <tr>

                <td>
                    A I
                </td>

                <td id="batangAI">
                    0
                </td>

                <td id="volumeAI">
                    0,000
                </td>

            </tr>

            <tr>

                <td>
                    A II
                </td>

                <td id="batangAII">
                    0
                </td>

                <td id="volumeAII">
                    0,000
                </td>

            </tr>

            <tr>

                <td>
                    A III
                </td>

                <td id="batangAIII">
                    0
                </td>

                <td id="volumeAIII">
                    0,000
                </td>

            </tr>

            <tr>

                <td>
                    KBP
                </td>

                <td id="batangKBP">
                    0
                </td>

                <td id="volumeKBP">
                    0,000
                </td>

            </tr>

            <tr>

                <th>
                    TOTAL
                </th>

                <th id="totalBatang">
                    0
                </th>

                <th id="totalVolume">
                    0,000
                </th>

            </tr>

        </tbody>

    </table>

    <!-- RINCIAN -->

    <h3>
        RINCIAN PASOKAN
    </h3>

    <div
        id="rincianPasokan"
        class="rincian">

        <div class="loading">
            MEMUAT RINCIAN...
        </div>

    </div>

</div>

<!-- =================================================
     OLAH
================================================== -->

<div
    id="olah"
    class="kartu"
    style="display:none;">

    <h2>OLAH</h2>

    <p>
        Ruang OLAH.
    </p>

</div>

<!-- =================================================
     SISA
================================================== -->

<div
    id="sisa"
    class="kartu"
    style="display:none;">

    <h2>SISA</h2>

    <p>
        Ruang SISA.
    </p>

</div>

</div>

<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

/* =====================================================
   URL APPS SCRIPT BARU
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwARmnRs73166TJf_LH64jRsNAAZ9gEAZ4HmdfQ-NMJCOj9B08JfsXW2yKlYa89-Lg/exec";


/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatVolume(angka){

    return Number(angka || 0)
        .toFixed(3)
        .replace(".", ",");

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(tanggal){

    if(!tanggal){
        return "";
    }

    const teks =
        String(tanggal).trim();


    /*
     * JIKA BACKEND SUDAH MENGIRIM
     * FORMAT d-M-yyyy
     */
    if(
        /^\d{1,2}-\d{1,2}-\d{4}$/.test(teks)
    ){

        return teks;

    }


    /*
     * JIKA YANG DATANG ADALAH ISO
     * CONTOH:
     * 2026-02-27T17:00:00.000Z
     *
     * UBAH KE TANGGAL LOKAL BROWSER
     */
    const d =
        new Date(tanggal);


    if(isNaN(d.getTime())){

        return teks;

    }


    return d.getDate() +
        "-" +
        (d.getMonth() + 1) +
        "-" +
        d.getFullYear();

}


/* =====================================================
   BUKA RUANG
===================================================== */

function bukaRuang(nama,tombol){

    document
        .getElementById("pasokan")
        .style.display = "none";

    document
        .getElementById("olah")
        .style.display = "none";

    document
        .getElementById("sisa")
        .style.display = "none";

    document
        .getElementById(nama)
        .style.display = "block";

    document
        .querySelectorAll(".menu button")
        .forEach(function(btn){

            btn.classList.remove("active");

        });

    tombol.classList.add("active");

}


/* =====================================================
   TAMPILKAN DATA PASOKAN
===================================================== */

function tampilkanPasokan(hasil){

    if(!hasil || !hasil.sukses){

        tampilkanError(
            (hasil && hasil.pesan)
            ? hasil.pesan
            : "Data tidak dapat dibaca."
        );

        return;
    }

    const r = hasil.ringkasan || {};


    /* -----------------------------------------------
       A I
    ----------------------------------------------- */

    document.getElementById("batangAI").textContent =
        (r.AI ? r.AI.batang : 0);

    document.getElementById("volumeAI").textContent =
        formatVolume(r.AI ? r.AI.volume : 0);


    /* -----------------------------------------------
       A II
    ----------------------------------------------- */

    document.getElementById("batangAII").textContent =
        (r.AII ? r.AII.batang : 0);

    document.getElementById("volumeAII").textContent =
        formatVolume(r.AII ? r.AII.volume : 0);


    /* -----------------------------------------------
       A III
    ----------------------------------------------- */

    document.getElementById("batangAIII").textContent =
        (r.AIII ? r.AIII.batang : 0);

    document.getElementById("volumeAIII").textContent =
        formatVolume(r.AIII ? r.AIII.volume : 0);


    /* -----------------------------------------------
       KBP
    ----------------------------------------------- */

    document.getElementById("batangKBP").textContent =
        (r.KBP ? r.KBP.batang : 0);

    document.getElementById("volumeKBP").textContent =
        formatVolume(r.KBP ? r.KBP.volume : 0);


    /* -----------------------------------------------
       TOTAL
    ----------------------------------------------- */

    document.getElementById("totalBatang").textContent =
        hasil.totalBatang || 0;

    document.getElementById("totalVolume").textContent =
        formatVolume(hasil.totalVolume);


    document.getElementById("statusPasokan").style.display =
        "none";


    /*
     * BACKEND BARU SUDAH MENGIRIM
     * RINCIAN DALAM BENTUK KELOMPOK.
     */
    tampilkanRincian(hasil.rincian || []);

}


/* =====================================================
   NORMALISASI SORTIMEN
===================================================== */

function normalisasiSortimen(nama){

    const s =
        String(nama || "")
            .toUpperCase()
            .trim();

    if(s === "AI"){
        return "A I";
    }

    if(s === "AII"){
        return "A II";
    }

    if(s === "AIII"){
        return "A III";
    }

    return s;

}


/* =====================================================
   RINCIAN PASOKAN
   BACKEND SUDAH MENGELOMPOKKAN DATA
===================================================== */

function tampilkanRincian(data){

    const box =
        document.getElementById("rincianPasokan");


    if(!data || !data.length){

        box.innerHTML =
            '<div class="kosong">Tidak ada data pasokan.</div>';

        return;
    }


    /* =================================================
       AMBIL SEMUA SORTIMEN AKTIF
    ================================================= */

    const sortimenSet = new Set();


    data.forEach(function(item){

        const daftar =
            item.sortimen || {};


        Object.keys(daftar)
            .forEach(function(sortimen){

                if(sortimen){

                    sortimenSet.add(
                        normalisasiSortimen(sortimen)
                    );

                }

            });

    });


    /* =================================================
       URUTAN SORTIMEN
    ================================================= */

    const urutan = [
        "A I",
        "A II",
        "A III",
        "KBP"
    ];


    const sortimenAktif =
        Array.from(sortimenSet)
            .sort(function(a,b){

                const ia =
                    urutan.indexOf(a);

                const ib =
                    urutan.indexOf(b);


                if(
                    ia === -1 &&
                    ib === -1
                ){

                    return a.localeCompare(b);

                }


                if(ia === -1){
                    return 1;
                }


                if(ib === -1){
                    return -1;
                }


                return ia - ib;

            });


    if(!sortimenAktif.length){

        box.innerHTML =
            '<div class="kosong">Tidak ada sortimen.</div>';

        return;
    }


    /* =================================================
       TOTAL KANAN HANYA JIKA
       ADA LEBIH DARI 1 SORTIMEN
    ================================================= */

    const tampilkanTotal =
        sortimenAktif.length > 1;


    /* =================================================
       TOTAL KESELURUHAN
    ================================================= */

    const grandTotal = {

        batang: 0,

        volume: 0,

        sortimen: {}

    };


    sortimenAktif.forEach(function(sortimen){

        grandTotal.sortimen[sortimen] = {

            batang: 0,

            volume: 0

        };

    });


    /* =================================================
       HITUNG GRAND TOTAL
    ================================================= */

    data.forEach(function(item){

        const daftar =
            item.sortimen || {};


        sortimenAktif.forEach(function(sortimen){

            const nilai =
                daftar[sortimen];


            if(!nilai){
                return;
            }


            grandTotal
                .sortimen[sortimen]
                .batang +=
                    Number(nilai.batang || 0);


            grandTotal
                .sortimen[sortimen]
                .volume +=
                    Number(nilai.volume || 0);

        });

    });


    sortimenAktif.forEach(function(sortimen){

        grandTotal.batang +=
            grandTotal
                .sortimen[sortimen]
                .batang;


        grandTotal.volume +=
            grandTotal
                .sortimen[sortimen]
                .volume;

    });


    /* =================================================
       BIKIN TABEL
    ================================================= */

    let html = "";


    html += "<table>";


    /* =================================================
       HEADER BARIS 1
    ================================================= */

    html += "<thead>";

    html += "<tr>";


    html +=
        "<th rowspan='2'>NO</th>";


    html +=
        "<th rowspan='2'>SKSHH-KB</th>";


    html +=
        "<th rowspan='2'>TGL TERIMA</th>";


    html +=
        "<th rowspan='2'>TPK</th>";


    sortimenAktif.forEach(function(sortimen){

        html +=
            "<th colspan='2'>" +
            escapeHtml(sortimen) +
            "</th>";

    });


    if(tampilkanTotal){

        html +=
            "<th colspan='2' class='total-header'>TOTAL</th>";

    }


    html += "</tr>";


    /* =================================================
       HEADER BARIS 2
    ================================================= */

    html += "<tr>";


    sortimenAktif.forEach(function(){

        html +=
            "<th>BTG</th>";

        html +=
            "<th>M³</th>";

    });


    if(tampilkanTotal){

        html +=
            "<th class='total-header'>BTG</th>";

        html +=
            "<th class='total-header'>M³</th>";

    }


    html += "</tr>";

    html += "</thead>";


    /* =================================================
       BODY
    ================================================= */

    html += "<tbody>";


    data.forEach(function(item,index){

        html += "<tr>";


        /* NO */

        html +=
            "<td>" +
            (index + 1) +
            "</td>";


        /* SKSHH-KB */

        html +=
            "<td>" +
            escapeHtml(
                item.skshhkb || ""
            ) +
            "</td>";


        /* TGL TERIMA */

        html +=
            "<td>" +
            escapeHtml(
                formatTanggal(
                    item.tglTerima || ""
                )
            ) +
            "</td>";


        /* TPK */

        html +=
            "<td>" +
            escapeHtml(
                item.tpk || ""
            ) +
            "</td>";


        /* =================================================
           TOTAL PER BARIS
        ================================================= */

        let totalBatangBaris = 0;

        let totalVolumeBaris = 0;


        const daftar =
            item.sortimen || {};


        /* =================================================
           SORTIMEN
        ================================================= */

        sortimenAktif.forEach(function(sortimen){

            const nilai =
                daftar[sortimen] || {

                    batang: 0,

                    volume: 0

                };


            const batang =
                Number(
                    nilai.batang || 0
                );


            const volume =
                Number(
                    nilai.volume || 0
                );


            /* BTG */

            html +=
                "<td>" +
                (
                    batang === 0
                        ? ""
                        : batang
                ) +
                "</td>";


            /* VOLUME */

            html +=
                "<td>" +
                (
                    volume === 0
                        ? ""
                        : formatVolume(volume)
                ) +
                "</td>";


            totalBatangBaris +=
                batang;


            totalVolumeBaris +=
                volume;

        });


        /* =================================================
           TOTAL KANAN
        ================================================= */

        if(tampilkanTotal){

            html +=
                "<td class='total-cell'>" +
                (
                    totalBatangBaris === 0
                        ? ""
                        : totalBatangBaris
                ) +
                "</td>";


            html +=
                "<td class='total-cell'>" +
                (
                    totalVolumeBaris === 0
                        ? ""
                        : formatVolume(
                            totalVolumeBaris
                          )
                ) +
                "</td>";

        }


        html += "</tr>";

    });


    /* =================================================
       TOTAL PALING BAWAH
    ================================================= */

    html +=
        "<tr class='baris-total'>";


    html +=
        "<td class='total-label'></td>";


    html +=
        "<td class='total-label'><strong>TOTAL</strong></td>";


    html +=
        "<td class='total-label'></td>";


    html +=
        "<td class='total-label'></td>";


    /* =================================================
       TOTAL PER SORTIMEN
    ================================================= */

    sortimenAktif.forEach(function(sortimen){

        const total =
            grandTotal
                .sortimen[sortimen];


        html +=
            "<td class='total-label'><strong>" +
            (
                total.batang === 0
                    ? ""
                    : total.batang
            ) +
            "</strong></td>";


        html +=
            "<td class='total-label'><strong>" +
            (
                total.volume === 0
                    ? ""
                    : formatVolume(
                        total.volume
                      )
            ) +
            "</strong></td>";

    });


    /* =================================================
       TOTAL KESELURUHAN
    ================================================= */

    if(tampilkanTotal){

        html +=
            "<td class='total-cell'><strong>" +
            (
                grandTotal.batang === 0
                    ? ""
                    : grandTotal.batang
            ) +
            "</strong></td>";


        html +=
            "<td class='total-cell'><strong>" +
            (
                grandTotal.volume === 0
                    ? ""
                    : formatVolume(
                        grandTotal.volume
                      )
            ) +
            "</strong></td>";

    }


    html += "</tr>";


    html += "</tbody>";

    html += "</table>";


    box.innerHTML =
        html;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value == null ? "" : value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(pesan){

    document.getElementById("statusPasokan")
        .innerHTML =
        '<div class="error">' +
        escapeHtml(pesan) +
        '</div>';


    document.getElementById("rincianPasokan")
        .innerHTML =
        '<div class="error">' +
        escapeHtml(pesan) +
        '</div>';

}


/* =====================================================
   AMBIL DATA DARI APPS SCRIPT
===================================================== */

function ambilPasokan(){

    document.getElementById("statusPasokan")
        .style.display = "block";


    document.getElementById("statusPasokan")
        .textContent =
        "MEMUAT DATA PASOKAN...";


    const select =
        document.getElementById("bulanPasokan");


    const bulan =
        select
            ? select.value
            : "SEMUA";


    let url = API_URL;


    if(
        bulan &&
        bulan !== "SEMUA"
    ){

        url +=
            "?bulan=" +
            encodeURIComponent(bulan);

    }


    fetch(url)

        .then(function(response){

            if(!response.ok){

                throw new Error(
                    "HTTP " + response.status
                );

            }

            return response.json();

        })

        .then(function(data){

            tampilkanPasokan(data);

        })

        .catch(function(error){

            console.error(error);

            tampilkanError(
                "GAGAL MENGAMBIL DATA DARI APPS SCRIPT."
            );

        });

}


/* =====================================================
   FILTER BULAN
===================================================== */

document
    .getElementById("bulanPasokan")
    .addEventListener(
        "change",
        function(){

            ambilPasokan();

        }
    );


/* =====================================================
   JALANKAN SAAT HALAMAN DIBUKA
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        ambilPasokan();

    }
);

</script>

</body>

</html>
