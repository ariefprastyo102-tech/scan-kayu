
<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PASOKAN & PERSEDIAAN BBI IK SARADAN</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
    color:#222;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    background:#176b3a;
    color:white;
    text-align:center;
    padding:22px 15px;
}

.header h1{
    margin:0;
    font-size:30px;
    letter-spacing:1px;
}

.header p{
    margin:6px 0 0;
    font-size:14px;
}

/* =====================================================
   MENU
===================================================== */

.menu{
    display:flex;
    justify-content:center;
    gap:12px;
    padding:20px 15px;
    background:white;
    border-bottom:1px solid #ddd;
}

.menu button{
    border:0;
    padding:14px 25px;
    border-radius:8px;
    background:#ddd;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.menu button.active{
    background:#176b3a;
    color:white;
}

/* =====================================================
   RUANG
===================================================== */

.ruang{
    max-width:1000px;
    margin:20px auto;
    padding:0 15px;
}

.kartu{
    background:white;
    border-radius:10px;
    padding:25px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.kartu h2{
    margin-top:0;
    color:#176b3a;
}

/* =====================================================
   FILTER
===================================================== */

.filter{
    display:flex;
    align-items:center;
    gap:10px;
    margin:20px 0;
}

.filter label{
    font-weight:bold;
}

.filter select{
    padding:9px 12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

/* =====================================================
   JUDUL BAGIAN
===================================================== */

.kartu h3{
    margin-top:25px;
    margin-bottom:12px;
}

/* =====================================================
   TABEL
===================================================== */

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,
td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#176b3a;
    color:white;
}

tbody tr:last-child th{
    background:#e8f1eb;
    color:#222;
}

/* =====================================================
   RINCIAN
===================================================== */

.rincian{
    border:1px solid #ddd;
    border-radius:6px;
    padding:15px;
    background:#fafafa;
    overflow-x:auto;
}

.rincian table{
    margin-top:0;
}

.rincian th{
    white-space:nowrap;
}

.rincian td{
    white-space:nowrap;
}

.loading{
    text-align:center;
    padding:20px;
    color:#666;
}

.error{
    padding:15px;
    background:#ffe5e5;
    color:#a00000;
    border:1px solid #ffb5b5;
    border-radius:6px;
    margin-top:15px;
}

.kosong{
    text-align:center;
    padding:20px;
    color:#777;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px){

    .header h1{
        font-size:22px;
    }

    .menu{
        gap:6px;
    }

    .menu button{
        padding:12px 15px;
        font-size:14px;
    }

    .kartu{
        padding:15px;
    }

    .filter{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h1>PERSEDIAAN BBI</h1>

    <p>Sistem Monitoring Persediaan</p>

</div>


<!-- =====================================================
     MENU
===================================================== -->

<div class="menu">

    <button
        class="active"
        onclick="bukaRuang('pasokan',this)">
        PASOKAN
    </button>

    <button
        onclick="bukaRuang('olah',this)">
        OLAH
    </button>

    <button
        onclick="bukaRuang('sisa',this)">
        SISA
    </button>

</div>


<!-- =====================================================
     RUANG
===================================================== -->

<div class="ruang">


    <!-- =================================================
         PASOKAN
    ================================================== -->

    <div id="pasokan" class="kartu">

        <h2>PASOKAN</h2>


        <!-- FILTER BULAN -->

        <div class="filter">

            <label for="bulanPasokan">
                FILTER BULAN
            </label>

            <select id="bulanPasokan">

                <option value="SEMUA">
                    SEMUA BULAN
                </option>

                <option value="JANUARI">
                    JANUARI
                </option>

                <option value="FEBRUARI">
                    FEBRUARI
                </option>

                <option value="MARET">
                    MARET
                </option>

                <option value="APRIL">
                    APRIL
                </option>

                <option value="MEI">
                    MEI
                </option>

                <option value="JUNI">
                    JUNI
                </option>

                <option value="JULI">
                    JULI
                </option>

                <option value="AGUSTUS">
                    AGUSTUS
                </option>

                <option value="SEPTEMBER">
                    SEPTEMBER
                </option>

                <option value="OKTOBER">
                    OKTOBER
                </option>

                <option value="NOVEMBER">
                    NOVEMBER
                </option>

                <option value="DESEMBER">
                    DESEMBER
                </option>

            </select>

        </div>


        <!-- STATUS -->

        <div id="statusPasokan"
             class="loading">

            MEMUAT DATA PASOKAN...

        </div>


        <!-- TOTAL PASOKAN -->

        <h3>
            TOTAL PASOKAN
        </h3>


        <table>

            <thead>

                <tr>

                    <th>
                        SORTIMEN
                    </th>

                    <th>
                        BATANG
                    </th>

                    <th>
                        VOLUME (M³)
                    </th>

                </tr>

            </thead>


            <tbody>

                <tr>

                    <td>
                        A I
                    </td>

                    <td id="batangAI">
                        0
                    </td>

                    <td id="volumeAI">
                        0,000
                    </td>

                </tr>


                <tr>

                    <td>
                        A II
                    </td>

                    <td id="batangAII">
                        0
                    </td>

                    <td id="volumeAII">
                        0,000
                    </td>

                </tr>


                <tr>

                    <td>
                        A III
                    </td>

                    <td id="batangAIII">
                        0
                    </td>

                    <td id="volumeAIII">
                        0,000
                    </td>

                </tr>


                <tr>

                    <td>
                        KBP
                    </td>

                    <td id="batangKBP">
                        0
                    </td>

                    <td id="volumeKBP">
                        0,000
                    </td>

                </tr>


                <tr>

                    <th>
                        TOTAL
                    </th>

                    <th id="totalBatang">
                        0
                    </th>

                    <th id="totalVolume">
                        0,000
                    </th>

                </tr>

            </tbody>

        </table>


        <!-- RINCIAN -->

        <h3>
            RINCIAN PASOKAN
        </h3>


        <div
            id="rincianPasokan"
            class="rincian">

            <div class="loading">
                MEMUAT RINCIAN...
            </div>

        </div>

    </div>


    <!-- =================================================
         OLAH
    ================================================== -->

    <div
        id="olah"
        class="kartu"
        style="display:none;">

        <h2>OLAH</h2>

        <p>
            Ruang OLAH.
        </p>

    </div>


    <!-- =================================================
         SISA
    ================================================== -->

    <div
        id="sisa"
        class="kartu"
        style="display:none;">

        <h2>SISA</h2>

        <p>
            Ruang SISA.
        </p>

    </div>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

/* =====================================================
   URL APPS SCRIPT BARU
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwARmnRs73166TJf_LH64jRsNAAZ9gEAZ4HmdfQ-NMJCOj9B08JfsXW2yKlYa89-Lg/exec";


/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatVolume(angka){

    return Number(angka || 0)
        .toLocaleString("id-ID",{
            minimumFractionDigits:3,
            maximumFractionDigits:3
        });

}


/* =====================================================
   BUKA RUANG
===================================================== */

function bukaRuang(nama,tombol){

    document
        .getElementById("pasokan")
        .style.display = "none";

    document
        .getElementById("olah")
        .style.display = "none";

    document
        .getElementById("sisa")
        .style.display = "none";


    document
        .getElementById(nama)
        .style.display = "block";


    document
        .querySelectorAll(".menu button")
        .forEach(function(btn){

            btn.classList.remove("active");

        });


    tombol.classList.add("active");

}


/* =====================================================
   TAMPILKAN DATA PASOKAN
===================================================== */

function tampilkanPasokan(hasil){

    if(!hasil || !hasil.sukses){

        tampilkanError(
            (hasil && hasil.pesan)
            ? hasil.pesan
            : "Data tidak dapat dibaca."
        );

        return;
    }


    const r = hasil.ringkasan || {};


    /* -----------------------------------------------
       A I
    ----------------------------------------------- */

    document.getElementById("batangAI").textContent =
        (r.AI ? r.AI.batang : 0);

    document.getElementById("volumeAI").textContent =
        formatVolume(r.AI ? r.AI.volume : 0);


    /* -----------------------------------------------
       A II
    ----------------------------------------------- */

    document.getElementById("batangAII").textContent =
        (r.AII ? r.AII.batang : 0);

    document.getElementById("volumeAII").textContent =
        formatVolume(r.AII ? r.AII.volume : 0);


    /* -----------------------------------------------
       A III
    ----------------------------------------------- */

    document.getElementById("batangAIII").textContent =
        (r.AIII ? r.AIII.batang : 0);

    document.getElementById("volumeAIII").textContent =
        formatVolume(r.AIII ? r.AIII.volume : 0);


    /* -----------------------------------------------
       KBP
    ----------------------------------------------- */

    document.getElementById("batangKBP").textContent =
        (r.KBP ? r.KBP.batang : 0);

    document.getElementById("volumeKBP").textContent =
        formatVolume(r.KBP ? r.KBP.volume : 0);


    /* -----------------------------------------------
       TOTAL
    ----------------------------------------------- */

    document.getElementById("totalBatang").textContent =
        hasil.totalBatang || 0;

    document.getElementById("totalVolume").textContent =
        formatVolume(hasil.totalVolume);


    document.getElementById("statusPasokan").style.display =
        "none";


    tampilkanRincian(hasil.data || []);

}


/* =====================================================
   RINCIAN PASOKAN
===================================================== */

function tampilkanRincian(data){

    const box =
        document.getElementById("rincianPasokan");


    if(!data.length){

        box.innerHTML =
            '<div class="kosong">Tidak ada data pasokan.</div>';

        return;
    }


    let html = "";

    html += "<table>";

    html += "<thead>";

    html += "<tr>";

    html += "<th>NO</th>";
    html += "<th>REGISTER</th>";
    html += "<th>TPK</th>";
    html += "<th>TUMPUK</th>";
    html += "<th>SORTIMEN</th>";
    html += "<th>VOLUME (M³)</th>";

    html += "</tr>";

    html += "</thead>";

    html += "<tbody>";


    data.forEach(function(item,index){

        html += "<tr>";

        html += "<td>" +
            (index + 1) +
            "</td>";

        html += "<td>" +
            escapeHtml(item.register) +
            "</td>";

        html += "<td>" +
            escapeHtml(item.tpk) +
            "</td>";

        html += "<td>" +
            escapeHtml(item.tumpuk) +
            "</td>";

        html += "<td>" +
            escapeHtml(item.sortimen) +
            "</td>";

        html += "<td>" +
            formatVolume(item.volume) +
            "</td>";

        html += "</tr>";

    });


    html += "</tbody>";

    html += "</table>";


    box.innerHTML = html;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value == null ? "" : value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(pesan){

    document.getElementById("statusPasokan")
        .innerHTML =
        '<div class="error">' +
        escapeHtml(pesan) +
        '</div>';


    document.getElementById("rincianPasokan")
        .innerHTML =
        '<div class="error">' +
        escapeHtml(pesan) +
        '</div>';

}


/* =====================================================
   AMBIL DATA DARI APPS SCRIPT
===================================================== */

function ambilPasokan(){

    document.getElementById("statusPasokan")
        .style.display = "block";


    document.getElementById("statusPasokan")
        .textContent =
        "MEMUAT DATA PASOKAN...";


    fetch(API_URL)

        .then(function(response){

            if(!response.ok){

                throw new Error(
                    "HTTP " + response.status
                );

            }

            return response.json();

        })

        .then(function(data){

            tampilkanPasokan(data);

        })

        .catch(function(error){

            console.error(error);

            tampilkanError(
                "GAGAL MENGAMBIL DATA DARI APPS SCRIPT."
            );

        });

}


/* =====================================================
   FILTER BULAN
===================================================== */

document
    .getElementById("bulanPasokan")
    .addEventListener(
        "change",
        function(){

            /*
             * UNTUK SEMENTARA:
             * dropdown belum memfilter data.
             *
             * Kita aktifkan setelah kolom bulan
             * pasokan ditentukan.
             */

            ambilPasokan();

        }
    );


/* =====================================================
   JALANKAN SAAT HALAMAN DIBUKA
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        ambilPasokan();

    }
);

</script>

</body>

</html>
