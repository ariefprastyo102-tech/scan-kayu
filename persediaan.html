body{

/* =====================================================

.header{

/* =====================================================
   MENU
===================================================== */

.menu{

    gap:12px;

}

    background:#176b3a;
    color:white;
}

/* =====================================================
   RUANG
===================================================== */

.ruang{
    max-width:1000px;
    margin:20px auto;
    padding:0 15px;
}

.kartu{
    background:white;
    border-radius:10px;
    padding:25px;

}

.kartu h2{
    margin-top:0;

}

/* =====================================================
   FILTER
===================================================== */

.filter{
    display:flex;
    align-items:center;
    gap:10px;
    margin:20px 0;
}

.filter label{
    font-weight:bold;
}

    padding:9px 12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

/* =====================================================
   JUDUL BAGIAN
===================================================== */

.kartu h3{
    margin-top:25px;
    margin-bottom:12px;
}

/* =====================================================
   TABEL
===================================================== */

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th,
td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#176b3a;
    color:white;
}

tbody tr:last-child th{
    background:#e8f1eb;
    color:#222;
}

/* =====================================================
   RINCIAN
===================================================== */

.rincian{
    border:1px solid #ddd;
    border-radius:6px;
    padding:15px;
    background:#fafafa;
    overflow-x:auto;
}

.rincian table{
    margin-top:0;
}

.rincian th{
    white-space:nowrap;
}

.rincian td{
    white-space:nowrap;
}

.loading{
    text-align:center;
    padding:20px;
    color:#666;
}

.error{
    padding:15px;
    background:#ffe5e5;
    color:#a00000;
    border:1px solid #ffb5b5;
    border-radius:6px;
    margin-top:15px;
}

.kosong{
    text-align:center;
    padding:20px;
    color:#777;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px){

    .header h1{
        font-size:22px;
    }

    .menu{
        gap:6px;
    }

    .menu button{
        padding:12px 15px;
        font-size:14px;
    }

    .kartu{
        padding:15px;
    }

    .filter{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

</head>

<!-- =====================================================

===================================================== -->

<script>

/* =====================================================
   URL APPS SCRIPT BARU
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwARmnRs73166TJf_LH64jRsNAAZ9gEAZ4HmdfQ-NMJCOj9B08JfsXW2yKlYa89-Lg/exec";


/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatVolume(angka){

    return Number(angka || 0)
        .toFixed(3)
        .replace(".", ",");

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(tanggal){

    if(!tanggal){
        return "";
    }

    const d = new Date(tanggal);

    if(isNaN(d.getTime())){
        return String(tanggal);
    }

    return d.getDate() +
        "-" +
        (d.getMonth() + 1) +
        "-" +
        d.getFullYear();

}


/* =====================================================
   BUKA RUANG
===================================================== */

function bukaRuang(nama,tombol){

    document
        .getElementById("pasokan")
        .style.display = "none";

    document
        .getElementById("olah")
        .style.display = "none";

    document
        .getElementById("sisa")
        .style.display = "none";


    document
        .getElementById(nama)
        .style.display = "block";


    document
        .querySelectorAll(".menu button")
        .forEach(function(btn){

            btn.classList.remove("active");

        });


    tombol.classList.add("active");

}


/* =====================================================
   TAMPILKAN DATA PASOKAN
===================================================== */

function tampilkanPasokan(hasil){

    if(!hasil || !hasil.sukses){

        tampilkanError(
            (hasil && hasil.pesan)
            ? hasil.pesan
            : "Data tidak dapat dibaca."
        );

        return;
    }


    const r = hasil.ringkasan || {};


    /* -----------------------------------------------
       A I
    ----------------------------------------------- */

    document.getElementById("batangAI").textContent =
        (r.AI ? r.AI.batang : 0);

    document.getElementById("volumeAI").textContent =
        formatVolume(r.AI ? r.AI.volume : 0);


    /* -----------------------------------------------
       A II
    ----------------------------------------------- */

    document.getElementById("batangAII").textContent =
        (r.AII ? r.AII.batang : 0);

    document.getElementById("volumeAII").textContent =
        formatVolume(r.AII ? r.AII.volume : 0);


    /* -----------------------------------------------
       A III
    ----------------------------------------------- */

    document.getElementById("batangAIII").textContent =
        (r.AIII ? r.AIII.batang : 0);

    document.getElementById("volumeAIII").textContent =
        formatVolume(r.AIII ? r.AIII.volume : 0);


    /* -----------------------------------------------
       KBP
    ----------------------------------------------- */

    document.getElementById("batangKBP").textContent =
        (r.KBP ? r.KBP.batang : 0);

    document.getElementById("volumeKBP").textContent =
        formatVolume(r.KBP ? r.KBP.volume : 0);


    /* -----------------------------------------------
       TOTAL
    ----------------------------------------------- */

    document.getElementById("totalBatang").textContent =
        hasil.totalBatang || 0;

    document.getElementById("totalVolume").textContent =
        formatVolume(hasil.totalVolume);


    document.getElementById("statusPasokan").style.display =
        "none";


    tampilkanRincian(hasil.data || []);

}


/* =====================================================
   NORMALISASI SORTIMEN
===================================================== */

function normalisasiSortimen(nama){

    const s =
        String(nama || "")
            .toUpperCase()
            .trim();

    if(s === "AI"){
        return "A I";
    }

    if(s === "AII"){
        return "A II";
    }

    if(s === "AIII"){
        return "A III";
    }

    return s;

}

/* =====================================================
   RINCIAN PASOKAN
===================================================== */

function tampilkanRincian(data){

    const box =
        document.getElementById("rincianPasokan");


    if(!data.length){

        box.innerHTML =
            '<div class="kosong">Tidak ada data pasokan.</div>';

        return;
    }


    /*
     * SATU BARIS = SATU SKSHH-KB
     *
     * Digabung berdasarkan:
     *   SKSHH-KB
     *   TGL TERIMA
     *   TPK
     */

    const kelompok = {};

    const sortimenSet = new Set();


    data.forEach(function(item){

        const skshh =
            String(item.skshhkb || "")
                .trim();

        const tgl =
            String(item.tglTerima || "")
                .trim();

        const tpk =
            String(item.tpk || "")
                .trim();


        const key =
            skshh +
            "|" +
            tgl +
            "|" +
            tpk;


        if(!kelompok[key]){

            kelompok[key] = {

                skshhkb: skshh,

                tglTerima: tgl,

                tpk: tpk,

                sortimen: {},

                totalBatang: 0,

                totalVolume: 0

            };

        }


        const sortimen =
            normalisasiSortimen(
                item.sortimen
            );


        if(!sortimen){
            return;
        }


        sortimenSet.add(sortimen);


        if(
            !kelompok[key]
                .sortimen[sortimen]
        ){

            kelompok[key]
                .sortimen[sortimen] = {

                    batang: 0,

                    volume: 0

                };

        }


        kelompok[key]
            .sortimen[sortimen]
            .batang++;


        kelompok[key]
            .sortimen[sortimen]
            .volume +=
                Number(item.volume || 0);


        kelompok[key]
            .totalBatang++;


        kelompok[key]
            .totalVolume +=
                Number(item.volume || 0);

    });


    const baris =
        Object.values(kelompok);


    /*
     * URUTAN SORTIMEN
     */

    const urutan = [
        "A I",
        "A II",
        "A III",
        "KBP"
    ];


    const sortimenAktif =
        Array.from(sortimenSet)
            .sort(function(a,b){

                const ia =
                    urutan.indexOf(a);

                const ib =
                    urutan.indexOf(b);


                if(
                    ia === -1 &&
                    ib === -1
                ){

                    return a.localeCompare(b);

                }


                if(ia === -1){
                    return 1;
                }


                if(ib === -1){
                    return -1;
                }


                return ia - ib;

            });


    if(!sortimenAktif.length){

        box.innerHTML =
            '<div class="kosong">Tidak ada sortimen.</div>';

        return;
    }


    /*
     * TOTAL KANAN HANYA KALAU
     * ADA LEBIH DARI 1 SORTIMEN
     */

    const tampilkanTotal =
        sortimenAktif.length > 1;


    /*
     * TOTAL KESELURUHAN
     */

    const grandTotal = {

        batang: 0,

        volume: 0,

        sortimen: {}

    };


    sortimenAktif.forEach(function(sortimen){

        grandTotal.sortimen[sortimen] = {

            batang: 0,

            volume: 0

        };

    });


    baris.forEach(function(item){

        sortimenAktif.forEach(function(sortimen){

            const nilai =
                item.sortimen[sortimen];


            if(nilai){

                grandTotal
                    .sortimen[sortimen]
                    .batang +=
                        nilai.batang;


                grandTotal
                    .sortimen[sortimen]
                    .volume +=
                        nilai.volume;

            }

        });


        grandTotal.batang +=
            item.totalBatang;


        grandTotal.volume +=
            item.totalVolume;

    });


    /*
     * BIKIN TABEL
     */

    let html = "";

    html += "<table>";

    html += "<thead>";

    html += "<tr>";


    html +=
        "<th rowspan='2'>NO</th>";

    html +=
        "<th rowspan='2'>SKSHH-KB</th>";

    html +=
        "<th rowspan='2'>TGL TERIMA</th>";

    html +=
        "<th rowspan='2'>TPK</th>";


    sortimenAktif.forEach(function(sortimen){

        html +=
            "<th colspan='2'>" +
            escapeHtml(sortimen) +
            "</th>";

    });


    if(tampilkanTotal){

        html +=
            "<th colspan='2'>TOTAL</th>";

    }


    html += "</tr>";


    /*
     * HEADER BARIS KEDUA
     */

    html += "<tr>";


    sortimenAktif.forEach(function(){

        html +=
            "<th>BTG</th>";

        html +=
            "<th>M³</th>";

    });


    if(tampilkanTotal){

        html +=
            "<th>BTG</th>";

        html +=
            "<th>M³</th>";

    }


    html += "</tr>";

    html += "</thead>";


    /*
     * BODY
     */

    html += "<tbody>";


    baris.forEach(function(item,index){

        html += "<tr>";


        html +=
            "<td>" +
            (index + 1) +
            "</td>";


        html +=
            "<td>" +
            escapeHtml(
                item.skshhkb
            ) +
            "</td>";


        html +=
            "<td>" +
            formatTanggal(
                item.tglTerima
            ) +
            "</td>";


        html +=
            "<td>" +
            escapeHtml(
                item.tpk
            ) +
            "</td>";


        /*
         * TOTAL PER BARIS
         */

        let totalBatangBaris = 0;

        let totalVolumeBaris = 0;


        /*
         * SORTIMEN
         */

        sortimenAktif.forEach(function(sortimen){

            const nilai =
                item.sortimen[sortimen] || {

                    batang: 0,

                    volume: 0

                };


            /*
             * 0 = KOSONG
             */

            html +=
                "<td>" +
                (
                    nilai.batang === 0
                        ? ""
                        : nilai.batang
                ) +
                "</td>";


            html +=
                "<td>" +
                (
                    nilai.volume === 0
                        ? ""
                        : formatVolume(
                            nilai.volume
                          )
                ) +
                "</td>";


            totalBatangBaris +=
                nilai.batang;


            totalVolumeBaris +=
                nilai.volume;

        });


        /*
         * TOTAL DI KANAN
         */

        if(tampilkanTotal){

            html +=
                "<td>" +
                (
                    totalBatangBaris === 0
                        ? ""
                        : totalBatangBaris
                ) +
                "</td>";


            html +=
                "<td>" +
                (
                    totalVolumeBaris === 0
                        ? ""
                        : formatVolume(
                            totalVolumeBaris
                          )
                ) +
                "</td>";

        }


        html += "</tr>";

    });


    /*
     * =================================================
     * BARIS TOTAL PALING BAWAH
     * =================================================
     */

    html +=
        "<tr class='baris-total'>";


    /*
     * NO
     */

    html +=
        "<td></td>";


    /*
     * SKSHH-KB
     */

    html +=
        "<td><strong>TOTAL</strong></td>";


    /*
     * TGL TERIMA
     */

    html +=
        "<td></td>";


    /*
     * TPK
     */

    html +=
        "<td></td>";


    /*
     * TOTAL PER SORTIMEN
     */

    sortimenAktif.forEach(function(sortimen){

        const total =
            grandTotal
                .sortimen[sortimen];


        html +=
            "<td><strong>" +
            (
                total.batang === 0
                    ? ""
                    : total.batang
            ) +
            "</strong></td>";


        html +=
            "<td><strong>" +
            (
                total.volume === 0
                    ? ""
                    : formatVolume(
                        total.volume
                      )
            ) +
            "</strong></td>";

    });


    /*
     * TOTAL KESELURUHAN
     * HANYA KALAU ADA > 1 SORTIMEN
     */

    if(tampilkanTotal){

        html +=
            "<td><strong>" +
            (
                grandTotal.batang === 0
                    ? ""
                    : grandTotal.batang
            ) +
            "</strong></td>";


        html +=
            "<td><strong>" +
            (
                grandTotal.volume === 0
                    ? ""
                    : formatVolume(
                        grandTotal.volume
                      )
            ) +
            "</strong></td>";

    }


    html += "</tr>";


    html += "</tbody>";

    html += "</table>";


    box.innerHTML =
        html;

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value == null ? "" : value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(pesan){

    document.getElementById("statusPasokan")
        .innerHTML =
        '<div class="error">' +
        escapeHtml(pesan) +
        '</div>';


    document.getElementById("rincianPasokan")
        .innerHTML =
        '<div class="error">' +
        escapeHtml(pesan) +
        '</div>';

}


/* =====================================================
   AMBIL DATA DARI APPS SCRIPT
===================================================== */

function ambilPasokan(){

    document.getElementById("statusPasokan")
        .style.display = "block";


    document.getElementById("statusPasokan")
        .textContent =
        "MEMUAT DATA PASOKAN...";


    const select =
        document.getElementById("bulanPasokan");


    const bulan =
        select
            ? select.value
            : "SEMUA";


    let url = API_URL;


    if(
        bulan &&
        bulan !== "SEMUA"
    ){

        url +=
            "?bulan=" +
            encodeURIComponent(bulan);

    }


    fetch(url)

        .then(function(response){

            if(!response.ok){

                throw new Error(
                    "HTTP " + response.status
                );

            }

            return response.json();

        })

        .then(function(data){

            tampilkanPasokan(data);

        })

        .catch(function(error){

            console.error(error);

            tampilkanError(
                "GAGAL MENGAMBIL DATA DARI APPS SCRIPT."
            );

        });

}


/* =====================================================
   FILTER BULAN
===================================================== */

document
    .getElementById("bulanPasokan")
    .addEventListener(
        "change",
        function(){

            ambilPasokan();

        }
    );


/* =====================================================
   JALANKAN SAAT HALAMAN DIBUKA
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        ambilPasokan();

    }
);

</script>
