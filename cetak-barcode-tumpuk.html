<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cetak Barcode Tumpuk</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    font-family:Arial,Helvetica,sans-serif;
    background:#eeeeee;
}

/* =====================================================
   PANEL ATAS
===================================================== */

.controls{
    max-width:1100px;
    margin:0 auto 15px auto;
    background:#ffffff;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.controls h2{
    margin:0 0 12px 0;
    text-align:center;
}

.controls input{
    width:100%;
    padding:12px;
    font-size:18px;
    border:1px solid #999;
    border-radius:7px;
    outline:none;
}

.controls input:focus{
    border-color:#0066ff;
}

/* =====================================================
   MASTER A4
===================================================== */

#master{
    width:210mm;
    min-height:297mm;
    margin:0 auto;
    background:#ffffff;
    padding:5mm;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4mm;
}

/* =====================================================
   LABEL
===================================================== */

.label{
    width:100%;
    height:128mm;

    background:#ffd900;

    border:2mm solid #000000;

    border-radius:3mm;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;

    padding:6mm 5mm;

    overflow:hidden;

    page-break-inside:avoid;
}

/* =====================================================
   TUMPUK
===================================================== */

.label .tumpuk{
    width:100%;
    text-align:center;

    font-size:32mm;
    line-height:1;

    font-weight:900;

    color:#000000;

    margin-bottom:5mm;

    letter-spacing:1mm;
}

/* =====================================================
   TPK
===================================================== */

.label .tpk{
    width:100%;
    text-align:center;

    font-size:12mm;
    line-height:1.1;

    font-weight:900;

    color:#000000;

    margin-bottom:5mm;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =====================================================
   BARCODE
===================================================== */

.barcode{
    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#ffffff;

    padding:3mm;

    border-radius:2mm;

    margin-top:2mm;
}

.barcode svg{
    display:block;

    width:90mm !important;
    height:55mm !important;

    max-width:100%;
}

/* =====================================================
   ERROR BARCODE
===================================================== */

.barcode-error{
    color:#d00000;
    font-size:7mm;
    font-weight:900;
    text-align:center;
}

/* =====================================================
   PESAN KOSONG
===================================================== */

.empty{
    grid-column:1 / -1;

    text-align:center;

    padding:40px;

    font-size:24px;

    font-weight:bold;
}

/* =====================================================
   PRINT
===================================================== */

@media print{

    @page{
        size:F4 portrait;
        margin:0;
    }

    html,
    body{
        margin:0;
        padding:0;
        background:#ffffff;
    }

    .controls{
        display:none;
    }

    #master{
        width:210mm;
        min-height:297mm;

        margin:0;

        padding:5mm;

        background:#ffffff;
    }

    .label{
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;

        page-break-inside:avoid;
    }

}

/* =====================================================
   LAYAR KECIL
===================================================== */

@media screen and (max-width:900px){

    #master{
        width:100%;
        min-height:auto;

        grid-template-columns:1fr;
    }

    .label{
        height:128mm;
    }

}

</style>

</head>


<body>


<div class="controls">

    <h2>CETAK BARCODE TUMPUK</h2>

    <input
        type="text"
        id="searchInput"
        placeholder="Cari TPK atau TUMPUK..."
        oninput="filterData()"
    >

</div>


<div id="master">

    <div class="empty">
        MEMUAT DATA...
    </div>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


/* =====================================================
   DATA
===================================================== */

let allData = [];


/* =====================================================
   LOAD DATA
===================================================== */

function loadData(){

    const callbackName =
        "callbackTumpuk_" +
        Date.now();

    window[callbackName] = function(result){

        try{

            if(
                !result ||
                result.success !== true
            ){

                document.getElementById("master").innerHTML = `
                    <div class="empty">
                        DATA TUMPUK GAGAL DIMUAT
                    </div>
                `;

                return;
            }


            allData =
                Array.isArray(result.data)
                ? result.data
                : [];


            filterData();

        }
        catch(error){

            console.error(error);

            document.getElementById("master").innerHTML = `
                <div class="empty">
                    TERJADI KESALAHAN DATA
                </div>
            `;
        }


        const script =
            document.getElementById(callbackName);

        if(script){
            script.remove();
        }

        delete window[callbackName];

    };


    const script =
        document.createElement("script");

    script.id = callbackName;

    script.src =
        API_URL +
        "?action=getTumpukList" +
        "&callback=" +
        encodeURIComponent(callbackName);

    script.onerror = function(){

        document.getElementById("master").innerHTML = `
            <div class="empty">
                GAGAL TERHUBUNG KE SERVER
            </div>
        `;

        script.remove();

        delete window[callbackName];

    };


    document.body.appendChild(script);

}


/* =====================================================
   FILTER
===================================================== */

function filterData(){

    const keyword =
        String(
            document.getElementById("searchInput").value || ""
        )
        .trim()
        .toUpperCase();


    let filtered;


    if(!keyword){

        filtered = allData.slice();

    }
    else{

        filtered =
            allData.filter(item => {

                const tpk =
                    String(
                        item.tpk || ""
                    )
                    .trim()
                    .toUpperCase();


                const tumpuk =
                    String(
                        item.tumpuk || ""
                    )
                    .trim()
                    .toUpperCase();


                /*
                    Kalau angka:
                    cari TUMPUK secara EXACT.

                    Contoh:
                    input 1
                    hanya TUMPUK 1

                    bukan:
                    10
                    11
                    12
                    dst.
                */

                if(/^\d+$/.test(keyword)){

                    return tumpuk === keyword;

                }


                /*
                    Selain angka:
                    cari berdasarkan TPK
                */

                return tpk.includes(keyword);

            });

    }


    renderLabels(filtered);

}


/* =====================================================
   RENDER LABEL
===================================================== */

function renderLabels(data){

    const master =
        document.getElementById("master");


    master.innerHTML = "";


    if(!data.length){

        master.innerHTML = `
            <div class="empty">
                DATA TUMPUK TIDAK DITEMUKAN
            </div>
        `;

        return;

    }


    data.forEach(item => {

        const label =
            document.createElement("div");

        label.className = "label";


        /* =================================================
           DATA TUMPUK
        ================================================= */

        const tumpuk =
            String(
                item.tumpuk || ""
            )
            .trim();


        const tpk =
            String(
                item.tpk || ""
            )
            .trim();


        /*
           Pastikan stackId selalu ada.

           Format:
           TPK|TUMPUK

           Contoh:
           SARADAN|1
           SARADAN|29
           TPK_B|29
        */

        const barcodeValue =
            String(
                item.stackId ||
                (
                    tpk +
                    "|" +
                    tumpuk
                )
            )
            .trim();


        /* =================================================
           TUMPUK
        ================================================= */

        const title =
            document.createElement("div");

        title.className =
            "tumpuk";

        title.textContent =
            "TUMPUK " + tumpuk;


        /* =================================================
           TPK
        ================================================= */

        const tpkElement =
            document.createElement("div");

        tpkElement.className =
            "tpk";

        tpkElement.textContent =
            "TPK ASAL : " + tpk;


        /* =================================================
           BARCODE CONTAINER
        ================================================= */

        const barcodeContainer =
            document.createElement("div");

        barcodeContainer.className =
            "barcode";


        const svg =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "svg"
            );


        barcodeContainer.appendChild(svg);


        /* =================================================
           MASUKKAN KE LABEL
        ================================================= */

        label.appendChild(title);

        label.appendChild(tpkElement);

        label.appendChild(barcodeContainer);

        master.appendChild(label);


        /* =================================================
           GENERATE BARCODE
        ================================================= */

        if(!barcodeValue){

            barcodeContainer.innerHTML = `
                <div class="barcode-error">
                    BARCODE GAGAL
                </div>
            `;

            return;

        }


        try{

            JsBarcode(
                svg,
                barcodeValue,
                {
                    format:"CODE128",

                    width:3,

                    height:180,

                    displayValue:false,

                    margin:0,

                    background:"#ffffff",

                    lineColor:"#000000"
                }
            );

        }
        catch(error){

            console.error(
                "Barcode error:",
                barcodeValue,
                error
            );


            barcodeContainer.innerHTML = `
                <div class="barcode-error">
                    BARCODE GAGAL
                </div>
            `;

        }

    });

}


/* =====================================================
   MULAI
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadData();

    }
);

</script>


</body>

</html>
