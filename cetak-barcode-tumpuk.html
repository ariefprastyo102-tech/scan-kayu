<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CETAK BARCODE TUMPUK</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f3f5;
    color:#111;
}

h1{
    text-align:center;
    margin:0 0 20px;
    font-size:28px;
}

.panel{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.filter-area{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:20px;
}

.filter-box{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.filter-box label{
    font-weight:bold;
    font-size:15px;
}

.filter-box input{
    width:100%;
    padding:13px;
    font-size:18px;
    border:2px solid #aaa;
    border-radius:8px;
    outline:none;
}

.filter-box input:focus{
    border-color:#111;
}

.button-area{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button{
    border:none;
    border-radius:8px;
    padding:12px 18px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-load{
    background:#198754;
    color:white;
}

.btn-print{
    background:#111;
    color:white;
}

.btn-all{
    background:#0d6efd;
    color:white;
}

.status{
    padding:12px;
    background:#f8f9fa;
    border-radius:8px;
    margin-bottom:20px;
    font-weight:bold;
}

#hasil{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:15px;
}

.preview-card{
    background:#ffeb00;
    border:3px solid #111;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.preview-tumpuk{
    font-size:32px;
    font-weight:900;
    line-height:1;
    margin-bottom:8px;
}

.preview-tpk{
    font-size:18px;
    font-weight:900;
    margin-bottom:12px;
}

.preview-jumlah{
    font-size:14px;
    font-weight:bold;
    margin-bottom:10px;
}

.preview-barcode{
    background:white;
    border:2px solid #111;
    padding:8px;
}

.preview-barcode svg{
    width:100%;
    height:auto;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:40px;
    font-size:20px;
    font-weight:bold;
    color:#666;
}


/* =====================================================
   AREA CETAK
===================================================== */

#printArea{
    display:none;
}


/*
   F4
   215.9 mm x 330.2 mm

   8 LABEL
   2 KOLOM
   4 BARIS
*/

.lembar{
    width:215.9mm;
    height:330.2mm;

    display:grid;

    grid-template-columns:
        107.95mm
        107.95mm;

    grid-template-rows:
        repeat(4,82.55mm);

    padding:0;
    margin:0;

    page-break-after:always;

    overflow:hidden;
}

.label{
    width:107.95mm;
    height:82.55mm;

    background:#ffeb00;

    border:0.4mm solid #111;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:4mm;

    overflow:hidden;
}

.label-tumpuk{
    font-size:14mm;
    font-weight:900;
    line-height:1;

    margin-bottom:2mm;

    white-space:nowrap;
}

.label-tpk{
    font-size:6mm;
    font-weight:900;
    line-height:1;

    margin-bottom:3mm;

    white-space:nowrap;
}

.label-barcode{
    width:89.95mm;
    height:43mm;

    background:white;

    border:0.5mm solid #111;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:2mm;
}

.label-barcode svg{
    width:100%;
    height:100%;
}

@page{
    size:F4 portrait;
    margin:0;
}

@media print{

    html,
    body{
        margin:0 !important;
        padding:0 !important;
        width:215.9mm;
        background:white;
    }

    body > *{
        display:none !important;
    }

    #printArea{
        display:block !important;
        width:215.9mm;
        margin:0;
        padding:0;
    }

    .lembar{
        display:grid !important;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    body{
        padding:10px;
    }

    .panel{
        padding:14px;
    }

    h1{
        font-size:23px;
    }

    .filter-area{
        grid-template-columns:1fr;
    }

    #hasil{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<div class="panel">

    <h1>
        CETAK BARCODE TUMPUK
    </h1>


    <div class="filter-area">

        <div class="filter-box">

            <label>
                CARI TUMPUK
            </label>

            <input
                type="text"
                id="filterTumpuk"
                placeholder="Contoh: 29"
                oninput="tampilkanData()"
            >

        </div>


        <div class="filter-box">

            <label>
                CARI TPK
            </label>

            <input
                type="text"
                id="filterTpk"
                placeholder="Contoh: SARADAN"
                oninput="tampilkanData()"
            >

        </div>

    </div>


    <div class="button-area">

        <button
            class="btn-load"
            onclick="ambilDatabase()">
            🔄 AMBIL DATA
        </button>


        <button
            class="btn-all"
            onclick="tampilkanSemua()">
            📋 TAMPILKAN SEMUA
        </button>


        <button
            class="btn-print"
            onclick="cetakBarcode()">
            🖨️ CETAK 8 / LEMBAR F4
        </button>

    </div>


    <div
        id="status"
        class="status">
        Silakan ambil data tumpuk.
    </div>


    <div id="hasil"></div>

</div>



<div id="printArea"></div>



<script>


/* =====================================================
   BACKEND
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


/* =====================================================
   DATA
===================================================== */

let database = [];

let sedangMemuat = false;


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    if(sedangMemuat){
        return;
    }

    sedangMemuat = true;

    const status =
        document.getElementById("status");

    status.innerText =
        "⏳ Sedang mengambil data tumpuk...";


    const callbackName =
        "callbackTumpuk_" +
        Date.now();


    window[callbackName] =
        function(response){

            try{

                console.log(
                    "RESPON BACKEND:",
                    response
                );


                if(
                    !response ||
                    response.status !== "success"
                ){

                    throw new Error(
                        response &&
                        response.message
                            ? response.message
                            : "Response backend tidak valid."
                    );

                }


                database =
                    Array.isArray(
                        response.data
                    )
                    ? response.data
                    : [];


                database.sort(
                    function(a,b){

                        const tpkA =
                            String(
                                a.tpk || ""
                            ).toLowerCase();

                        const tpkB =
                            String(
                                b.tpk || ""
                            ).toLowerCase();


                        if(tpkA !== tpkB){

                            return tpkA.localeCompare(
                                tpkB,
                                "id"
                            );

                        }


                        const angkaA =
                            parseInt(
                                String(
                                    a.tumpuk || ""
                                ).replace(
                                    /[^0-9-]/g,
                                    ""
                                )
                            );


                        const angkaB =
                            parseInt(
                                String(
                                    b.tumpuk || ""
                                ).replace(
                                    /[^0-9-]/g,
                                    ""
                                )
                            );


                        if(
                            !isNaN(angkaA) &&
                            !isNaN(angkaB)
                        ){

                            return angkaA - angkaB;

                        }


                        return String(
                            a.tumpuk || ""
                        ).localeCompare(
                            String(
                                b.tumpuk || ""
                            ),
                            "id"
                        );

                    }
                );


                status.innerText =
                    "✅ Data berhasil diambil: " +
                    database.length +
                    " TUMPUK";


                tampilkanData();


            }

            catch(error){

                console.error(error);

                status.innerText =
                    "❌ GAGAL MENGAMBIL DATA TUMPUK: " +
                    error.message;

            }


            selesaiCallback(
                callbackName,
                script
            );

        };


    const script =
        document.createElement("script");


    script.src =
        API_URL +
        "?action=getTumpukList" +
        "&callback=" +
        encodeURIComponent(
            callbackName
        );


    script.onerror =
        function(){

            status.innerText =
                "❌ GAGAL MENGHUBUNGI BACKEND TUMPUK.";

            selesaiCallback(
                callbackName,
                script
            );

        };


    document.body.appendChild(
        script
    );

}


/* =====================================================
   HAPUS CALLBACK
===================================================== */

function selesaiCallback(
    callbackName,
    script
){

    sedangMemuat = false;


    if(script){

        setTimeout(
            function(){

                if(
                    script.parentNode
                ){

                    script.parentNode.removeChild(
                        script
                    );

                }

            },
            100
        );

    }


    try{

        delete window[
            callbackName
        ];

    }

    catch(e){

        window[
            callbackName
        ] = undefined;

    }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(){

    const container =
        document.getElementById(
            "hasil"
        );


    const filterTumpuk =
        document.getElementById(
            "filterTumpuk"
        )
        .value
        .trim()
        .toLowerCase();


    const filterTpk =
        document.getElementById(
            "filterTpk"
        )
        .value
        .trim()
        .toLowerCase();


    let data =
        database.filter(
            function(item){

                const tumpuk =
                    String(
                        item.tumpuk || ""
                    )
                    .trim()
                    .toLowerCase();


                const tpk =
                    String(
                        item.tpk || ""
                    )
                    .trim()
                    .toLowerCase();


                /*
                   TUMPUK HARUS EXACT

                   1  -> hanya 1
                   29 -> semua TUMPUK 29
                   1 TIDAK BOLEH MASUK 11,12,13
                */

                if(
                    filterTumpuk &&
                    tumpuk !== filterTumpuk
                ){

                    return false;

                }


                /*
                   TPK BOLEH PARTIAL
                */

                if(
                    filterTpk &&
                    !tpk.includes(
                        filterTpk
                    )
                ){

                    return false;

                }


                return true;

            }
        );


    container.innerHTML = "";


    if(
        database.length === 0
    ){

        container.innerHTML =
            '<div class="empty">' +
            'Belum ada data TUMPUK.' +
            '</div>';

        return;

    }


    if(
        data.length === 0
    ){

        container.innerHTML =
            '<div class="empty">' +
            'TUMPUK / TPK tidak ditemukan.' +
            '</div>';

        return;

    }


    data.forEach(
        function(item){

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "preview-card";


            const tumpuk =
                document.createElement(
                    "div"
                );

            tumpuk.className =
                "preview-tumpuk";

            tumpuk.innerText =
                "TUMPUK " +
                String(
                    item.tumpuk || ""
                );


            const tpk =
                document.createElement(
                    "div"
                );

            tpk.className =
                "preview-tpk";

            tpk.innerText =
                "TPK ASAL : " +
                String(
                    item.tpk || ""
                );


            const jumlah =
                document.createElement(
                    "div"
                );

            jumlah.className =
                "preview-jumlah";

            jumlah.innerText =
                "JUMLAH BATANG AWAL : " +
                Number(
                    item.jumlahAwal || 0
                );


            const barcodeBox =
                document.createElement(
                    "div"
                );

            barcodeBox.className =
                "preview-barcode";


            const svg =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                );


            barcodeBox.appendChild(
                svg
            );


            card.appendChild(
                tumpuk
            );

            card.appendChild(
                tpk
            );

            card.appendChild(
                jumlah
            );

            card.appendChild(
                barcodeBox
            );


            container.appendChild(
                card
            );


            /*
               IDENTITAS BARCODE

               TPK|TUMPUK

               Contoh:

               SARADAN|29
               TPK B|29
               TPK C|29

               Jadi TUMPUK 29 tetap
               terpisah.
            */

            const barcodeValue =
                String(
                    item.stackId ||
                    (
                        String(
                            item.tpk || ""
                        ) +
                        "|" +
                        String(
                            item.tumpuk || ""
                        )
                    )
                ).trim();


            try{

                JsBarcode(
                    svg,
                    barcodeValue,
                    {
                        format:"CODE128",
                        displayValue:false,
                        margin:0,
                        width:2,
                        height:80
                    }
                );

            }

            catch(error){

                console.error(
                    "Barcode error:",
                    error
                );

            }

        }
    );

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterTumpuk"
    ).value = "";


    document.getElementById(
        "filterTpk"
    ).value = "";


    tampilkanData();

}


/* =====================================================
   CETAK BARCODE
===================================================== */

function cetakBarcode(){

    if(
        database.length === 0
    ){

        alert(
            "Data TUMPUK belum diambil."
        );

        return;

    }


    const filterTumpuk =
        document.getElementById(
            "filterTumpuk"
        )
        .value
        .trim()
        .toLowerCase();


    const filterTpk =
        document.getElementById(
            "filterTpk"
        )
        .value
        .trim()
        .toLowerCase();


    let data =
        database.filter(
            function(item){

                const tumpuk =
                    String(
                        item.tumpuk || ""
                    )
                    .trim()
                    .toLowerCase();


                const tpk =
                    String(
                        item.tpk || ""
                    )
                    .trim()
                    .toLowerCase();


                if(
                    filterTumpuk &&
                    tumpuk !== filterTumpuk
                ){

                    return false;

                }


                if(
                    filterTpk &&
                    !tpk.includes(
                        filterTpk
                    )
                ){

                    return false;

                }


                return true;

            }
        );


    if(
        data.length === 0
    ){

        alert(
            "Tidak ada TUMPUK yang akan dicetak."
        );

        return;

    }


    /*
       URUTKAN TPK -> TUMPUK
    */

    data.sort(
        function(a,b){

            const tpkA =
                String(
                    a.tpk || ""
                ).toLowerCase();

            const tpkB =
                String(
                    b.tpk || ""
                ).toLowerCase();


            if(tpkA !== tpkB){

                return tpkA.localeCompare(
                    tpkB,
                    "id"
                );

            }


            const angkaA =
                parseInt(
                    String(
                        a.tumpuk || ""
                    ).replace(
                        /[^0-9-]/g,
                        ""
                    )
                );


            const angkaB =
                parseInt(
                    String(
                        b.tumpuk || ""
                    ).replace(
                        /[^0-9-]/g,
                        ""
                    )
                );


            if(
                !isNaN(angkaA) &&
                !isNaN(angkaB)
            ){

                return angkaA - angkaB;

            }


            return String(
                a.tumpuk || ""
            ).localeCompare(
                String(
                    b.tumpuk || ""
                ),
                "id"
            );

        }
    );


    const printArea =
        document.getElementById(
            "printArea"
        );


    printArea.innerHTML = "";


    /*
       8 LABEL PER LEMBAR

       2 KOLOM
       4 BARIS
    */

    for(
        let i=0;
        i<data.length;
        i += 8
    ){

        const lembar =
            document.createElement(
                "div"
            );

        lembar.className =
            "lembar";


        const kelompok =
            data.slice(
                i,
                i + 8
            );


        kelompok.forEach(
            function(item){

                const label =
                    document.createElement(
                        "div"
                    );

                label.className =
                    "label";


                const tumpuk =
                    document.createElement(
                        "div"
                    );

                tumpuk.className =
                    "label-tumpuk";

                tumpuk.innerText =
                    "TUMPUK " +
                    String(
                        item.tumpuk || ""
                    );


                const tpk =
                    document.createElement(
                        "div"
                    );

                tpk.className =
                    "label-tpk";

                tpk.innerText =
                    "TPK ASAL : " +
                    String(
                        item.tpk || ""
                    );


                const barcodeBox =
                    document.createElement(
                        "div"
                    );

                barcodeBox.className =
                    "label-barcode";


                const svg =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "svg"
                    );


                barcodeBox.appendChild(
                    svg
                );


                label.appendChild(
                    tumpuk
                );

                label.appendChild(
                    tpk
                );

                label.appendChild(
                    barcodeBox
                );


                lembar.appendChild(
                    label
                );


                const barcodeValue =
                    String(
                        item.stackId ||
                        (
                            String(
                                item.tpk || ""
                            ) +
                            "|" +
                            String(
                                item.tumpuk || ""
                            )
                        )
                    ).trim();


                try{

                    JsBarcode(
                        svg,
                        barcodeValue,
                        {
                            format:"CODE128",
                            displayValue:false,
                            margin:0,
                            width:2,
                            height:120
                        }
                    );

                }

                catch(error){

                    console.error(
                        "Barcode cetak error:",
                        error
                    );

                }

            }
        );


        /*
           Kalau kurang dari 8,
           sisanya tetap kosong.
        */

        while(
            lembar.children.length < 8
        ){

            const kosong =
                document.createElement(
                    "div"
                );

            kosong.className =
                "label";

            kosong.style.visibility =
                "hidden";

            lembar.appendChild(
                kosong
            );

        }


        printArea.appendChild(
            lembar
        );

    }


    /*
       Tunggu barcode selesai dirender
       baru print.
    */

    setTimeout(
        function(){

            window.print();

        },
        500
    );

}


/* =====================================================
   AUTO AMBIL DATA SAAT HALAMAN DIBUKA
===================================================== */

window.addEventListener(
    "load",
    function(){

        ambilDatabase();

    }
);

</script>


</body>

</html>
