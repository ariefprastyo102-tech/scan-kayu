<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Cetak Barcode Tumpuk</title>


<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>


<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    padding:20px;

    background:#f1f5f9;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#111827;

}


/* ================================
   HEADER
================================ */

.header{

    max-width:1100px;

    margin:
        0 auto 20px;

    background:white;

    padding:18px;

    border-radius:12px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.08);

}

.header h1{

    margin:0 0 15px;

    font-size:22px;

}


.toolbar{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}


.toolbar input{

    flex:1;

    min-width:220px;

    padding:12px;

    border:
        1px solid #cbd5e1;

    border-radius:8px;

    font-size:15px;

}


button{

    border:0;

    border-radius:8px;

    padding:
        12px 18px;

    font-weight:bold;

    cursor:pointer;

}


.btn-refresh{

    background:#2563eb;

    color:white;

}


.btn-print{

    background:#16a34a;

    color:white;

}


/* ================================
   STATUS
================================ */

#status{

    max-width:1100px;

    margin:
        0 auto 15px;

    padding:10px;

    background:white;

    border-radius:8px;

    font-size:14px;

}


/* ================================
   AREA LABEL
================================ */

#labelContainer{

    width:100%;

}


/* ================================
   LABEL
================================ */

.label{

    background:white;

    border:
        1px solid #111;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    padding:
        8mm 6mm;

    overflow:hidden;

}


/* ================================
   JUDUL
================================ */

.label-title{

    font-size:25px;

    font-weight:900;

    margin-bottom:5mm;

    text-align:center;

}


/* ================================
   TPK
================================ */

.label-tpk{

    font-size:18px;

    font-weight:bold;

    margin-bottom:6mm;

    text-align:center;

}


/* ================================
   BARCODE
================================ */

.barcode{

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

}


.barcode svg{

    width:100% !important;

    max-width:88mm;

    height:48mm !important;

}


/* ================================
   ID INTERNAL
================================ */

.label-id{

    display:none;

}


/* ================================
   GRID SCREEN
================================ */

#labelContainer{

    display:grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:12px;

    max-width:1100px;

    margin:0 auto;

}


/* ================================
   LOADING
================================ */

.loading{

    text-align:center;

    padding:40px;

    font-size:18px;

}


/* ================================
   PRINT
================================ */

@page{

    size:F4 portrait;

    margin:5mm;

}


@media print{

    body{

        background:white;

        padding:0;

    }


    .header,
    #status{

        display:none !important;

    }


    #labelContainer{

        width:100%;

        max-width:none;

        display:grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap:0;

        margin:0;

    }


    .label{

        width:100%;

        height:128mm;

        border:
            0.4mm solid #111;

        page-break-inside:avoid;

        break-inside:avoid;

    }


    .barcode svg{

        width:88mm !important;

        max-width:88mm;

        height:48mm !important;

    }

}


/* ================================
   MOBILE
================================ */

@media(max-width:700px){

    body{

        padding:10px;

    }


    #labelContainer{

        grid-template-columns:
            1fr;

    }


    .label{

        min-height:130mm;

    }

}

</style>

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<div class="header">

    <h1>
        CETAK BARCODE TUMPUK
    </h1>


    <div class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="Cari TPK / Tumpuk..."
            oninput="filterData()"
        >


        <button
            class="btn-refresh"
            onclick="loadData()"
        >
            REFRESH DATA
        </button>


        <button
            class="btn-print"
            onclick="window.print()"
        >
            CETAK
        </button>

    </div>

</div>


<!-- =====================================
     STATUS
===================================== -->

<div id="status">

    Mengambil data dari DATABASE...

</div>


<!-- =====================================
     LABEL
===================================== -->

<div id="labelContainer">

    <div class="loading">

        Memuat data...

    </div>

</div>


<script>


/************************************************
 * URL BACKEND BARU CEK TUMPUK
 ************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


/************************************************
 * DATA
 ************************************************/

let allData = [];


/************************************************
 * LOAD DATA
 *
 * INI PEMANGGIL DATABASE
 *
 * HTML
 *   ↓
 * BACKEND
 *   ↓
 * getTumpukList()
 *   ↓
 * DATABASE
 ************************************************/

function loadData(){

    setStatus(
        "Mengambil data tumpuk dari DATABASE..."
    );


    const callbackName =
        "callbackTumpuk_" +
        Date.now();


    window[callbackName] =
        function(result){

            try{

                if(
                    !result ||
                    result.success !== true
                ){

                    throw new Error(
                        result &&
                        result.error
                            ? result.error
                            : "Data gagal diambil"
                    );

                }


                allData =
                    Array.isArray(
                        result.data
                    )
                        ? result.data
                        : [];


                renderLabels(
                    allData
                );


                setStatus(
                    "Berhasil memuat " +
                    allData.length +
                    " tumpuk dari DATABASE."
                );


            }catch(err){

                console.error(err);

                setStatus(
                    "ERROR: " +
                    err.message
                );

                document
                    .getElementById(
                        "labelContainer"
                    )
                    .innerHTML =

                    '<div class="loading">' +
                    'Gagal memuat data.' +
                    '</div>';

            }


            cleanupJsonp(
                callbackName,
                script
            );

        };


    const script =
        document.createElement(
            "script"
        );


    script.src =
        API_URL +
        "?action=getTumpukList" +
        "&callback=" +
        encodeURIComponent(
            callbackName
        ) +
        "&_=" +
        Date.now();


    script.onerror =
        function(){

            setStatus(
                "Gagal terhubung ke backend CEK TUMPUK."
            );


            cleanupJsonp(
                callbackName,
                script
            );

        };


    document
        .body
        .appendChild(script);

}


/************************************************
 * CLEAN JSONP
 ************************************************/

function cleanupJsonp(
    callbackName,
    script
){

    try{

        delete window[
            callbackName
        ];

    }catch(e){}


    if(
        script &&
        script.parentNode
    ){

        script.parentNode
            .removeChild(script);

    }

}


/************************************************
 * RENDER LABEL
 ************************************************/

function renderLabels(
    data
){

    const container =
        document.getElementById(
            "labelContainer"
        );


    container.innerHTML = "";


    if(
        !data ||
        data.length === 0
    ){

        container.innerHTML =

            '<div class="loading">' +
            'Tidak ada data tumpuk.' +
            '</div>';

        return;

    }


    data.forEach(function(item){

        const label =
            document.createElement(
                "div"
            );


        label.className =
            "label";


        /*
         * JUDUL
         */
        const title =
            document.createElement(
                "div"
            );


        title.className =
            "label-title";


        title.textContent =
            "TUMPUK " +
            item.tumpuk;


        /*
         * TPK
         */
        const tpk =
            document.createElement(
                "div"
            );


        tpk.className =
            "label-tpk";


        tpk.textContent =
            "TPK ASAL : " +
            item.tpk;


        /*
         * BARCODE
         */
        const barcodeBox =
            document.createElement(
                "div"
            );


        barcodeBox.className =
            "barcode";


        const svg =
            document.createElement(
                "svg"
            );


        barcodeBox.appendChild(
            svg
        );


        /*
         * INTERNAL PAYLOAD
         *
         * CONTOH:
         * SARADAN|1
         *
         * TIDAK DITAMPILKAN
         * SEBAGAI TULISAN
         */
        const barcodeValue =
            item.stackId;


        try{

            JsBarcode(
                svg,
                barcodeValue,
                {

                    format:
                        "CODE128",

                    displayValue:
                        false,

                    width:
                        3,

                    height:
                        180,

                    margin:
                        0,

                    background:
                        "#ffffff",

                    lineColor:
                        "#000000"

                }
            );

        }catch(err){

            console.error(
                "Barcode error:",
                err
            );

        }


        /*
         * ID INTERNAL
         * TIDAK DITAMPILKAN
         */
        const hidden =
            document.createElement(
                "div"
            );


        hidden.className =
            "label-id";


        hidden.textContent =
            barcodeValue;


        label.appendChild(
            title
        );


        label.appendChild(
            tpk
        );


        label.appendChild(
            barcodeBox
        );


        label.appendChild(
            hidden
        );


        container.appendChild(
            label
        );

    });

}


/************************************************
 * FILTER
 ************************************************/

function filterData(){

    const keyword =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    /* KOSONG = TAMPILKAN SEMUA */
    if(!keyword){

        renderLabels(allData);

        setStatus(
            "Menampilkan " +
            allData.length +
            " tumpuk."
        );

        return;
    }


    const filtered =
        allData.filter(function(item){

            const tpk =
                String(item.tpk || "")
                    .trim()
                    .toLowerCase();

            const tumpuk =
                String(item.tumpuk || "")
                    .trim()
                    .toLowerCase();


            /*
             * KALAU YANG DIKETIK ANGKA TUMPUK,
             * HARUS COCOK PERSIS.
             *
             * Ketik 1
             * → TUMPUK 1
             *
             * TIDAK:
             * → TUMPUK 13
             * → TUMPUK 100
             * → TUMPUK 128
             */
            if(
                /^\d+$/.test(keyword)
            ){

                return (
                    tumpuk === keyword
                );

            }


            /*
             * KALAU CARI TPK,
             * BOLEH SEBAGIAN.
             *
             * SAR
             * → SARADAN
             */
            return tpk.includes(keyword);

        });


    renderLabels(filtered);


    setStatus(
        "Menampilkan " +
        filtered.length +
        " tumpuk."
    );

}

/************************************************
 * STATUS
 ************************************************/

function setStatus(
    text
){

    document
        .getElementById(
            "status"
        )
        .textContent =
        text;

}


/************************************************
 * JALANKAN SAAT DIBUKA
 ************************************************/

loadData();


</script>

</body>

</html>
