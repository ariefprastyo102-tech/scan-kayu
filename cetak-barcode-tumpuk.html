<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CETAK QR TUMPUK</title>

<!-- QR CODE -->

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f3f5;
    color:#111;
}

h1{
    text-align:center;
    margin:0 0 20px;
    font-size:28px;
}

.panel{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.filter-area{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:20px;
}

.filter-box{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.filter-box label{
    font-weight:bold;
    font-size:15px;
}

.filter-box input{
    width:100%;
    padding:13px;
    font-size:18px;
    border:2px solid #aaa;
    border-radius:8px;
    outline:none;
}

.filter-box input:focus{
    border-color:#111;
}

.button-area{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button{
    border:none;
    border-radius:8px;
    padding:12px 18px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-load{
    background:#198754;
    color:white;
}

.btn-print{
    background:#111;
    color:white;
}

.btn-all{
    background:#0d6efd;
    color:white;
}

.status{
    padding:12px;
    background:#f8f9fa;
    border-radius:8px;
    margin-bottom:20px;
    font-weight:bold;
}

#hasil{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:15px;
}

.preview-card{
    background:#ffeb00;
    border:3px solid #111;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.preview-tumpuk{
    font-size:32px;
    font-weight:900;
    line-height:1;
    margin-bottom:8px;
}

.preview-tpk{
    font-size:32px;
    font-weight:900;
    line-height:1;
    margin-bottom:12px;
}

.preview-jumlah{
    font-size:14px;
    font-weight:bold;
    margin-bottom:10px;
}

.preview-qr-area{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:white;
    border:2px solid #111;
    padding:10px;
}

.preview-qr{
    width:100px;
    height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.preview-akhir{
    width:120px;
    height:100px;
    border:3px solid #111;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    text-align:center;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:40px;
    font-size:20px;
    font-weight:bold;
    color:#666;
}


/* =====================================================
   AREA CETAK
===================================================== */

#printArea{
    display:none;
}


/*
   F4
   215.9 mm x 330.2 mm

   8 LABEL
   2 KOLOM
   4 BARIS
*/

.lembar{
    width:215.9mm;
    height:330.2mm;

    display:grid;

    grid-template-columns:
        107.95mm
        107.95mm;

    grid-template-rows:
        repeat(4,82.55mm);

    padding:0;
    margin:0;

    page-break-after:always;

    overflow:hidden;
}

.label{
    width:107.95mm;
    height:82.55mm;

    background:#ffeb00;

    border:0.4mm solid #111;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:flex-start;

    padding:5mm;

    overflow:hidden;
}


/* =====================================================
   TUMPUK
===================================================== */

.label-tumpuk{
    font-size:12mm;
    font-weight:900;
    line-height:1;

    margin-bottom:2mm;

    white-space:nowrap;
}


/* =====================================================
   TPK ASAL
===================================================== */

.label-tpk{
    font-size:12mm;
    font-weight:900;
    line-height:1;

    margin-bottom:4mm;

    white-space:nowrap;
}


/* =====================================================
   BAGIAN BAWAH
   QR + KOTAK JUMLAH AKHIR TAHUN
===================================================== */

.label-bottom{
    width:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:7mm;

    margin-top:1mm;
}


/* =====================================================
   QR CODE
===================================================== */

.label-qr-box{
    width:36mm;
    height:36mm;

    background:white;

    border:0.4mm solid #111;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:1mm;

    flex-shrink:0;
}

.label-qr{
    width:32mm;
    height:32mm;

    display:flex;

    align-items:center;
    justify-content:center;
}

.label-qr img{
    width:32mm !important;
    height:32mm !important;
}

.label-qr canvas{
    width:32mm !important;
    height:32mm !important;
}


/* =====================================================
   KOTAK JUMLAH BATANG AKHIR TAHUN
===================================================== */

.label-akhir-area{
    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:2mm;
}

.label-akhir-title{
    font-size:3.5mm;
    font-weight:900;

    text-align:center;

    line-height:1.1;

    width:42mm;
}

.label-akhir-box{
    width:42mm;
    height:27mm;

    background:white;

    border:0.7mm solid #111;

    display:flex;

    align-items:center;
    justify-content:center;
}

@page{
    size:F4 portrait;
    margin:0;
}


@media print{

    html,
    body{
        margin:0 !important;
        padding:0 !important;
        width:215.9mm;
        background:white;
    }

    body > *{
        display:none !important;
    }

    #printArea{
        display:block !important;
        width:215.9mm;
        margin:0;
        padding:0;
    }

    .lembar{
        display:grid !important;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    body{
        padding:10px;
    }

    .panel{
        padding:14px;
    }

    h1{
        font-size:23px;
    }

    .filter-area{
        grid-template-columns:1fr;
    }

    #hasil{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="panel">

```
<h1>
    CETAK QR TUMPUK
</h1>


<div class="filter-area">

    <div class="filter-box">

        <label>
            CARI TUMPUK
        </label>

        <input
            type="text"
            id="filterTumpuk"
            placeholder="Contoh: 29"
            oninput="tampilkanData()"
        >

    </div>


    <div class="filter-box">

        <label>
            CARI TPK
        </label>

        <input
            type="text"
            id="filterTpk"
            placeholder="Contoh: SARADAN"
            oninput="tampilkanData()"
        >

    </div>

</div>


<div class="button-area">

    <button
        class="btn-load"
        onclick="ambilDatabase()">
        🔄 AMBIL DATA
    </button>


    <button
        class="btn-all"
        onclick="tampilkanSemua()">
        📋 TAMPILKAN SEMUA
    </button>

        class="btn-print"
        onclick="cetakBarcode()">

```

</div>

<div id="printArea"></div>

<script>


/* =====================================================
   BACKEND
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


/* =====================================================
   DATA
===================================================== */

let database = [];

let sedangMemuat = false;


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    if(sedangMemuat){
        return;
    }

    sedangMemuat = true;

    const status =
        document.getElementById("status");

    status.innerText =
        "⏳ Sedang mengambil data tumpuk...";


    const callbackName =
        "callbackTumpuk_" +
        Date.now();


    /*
       SCRIPT DIBUAT DI SINI
       SUPAYA BISA DIPAKAI CALLBACK
    */

    const script =
        document.createElement("script");


    window[callbackName] =
        function(response){

            try{

                console.log(
                    "RESPON BACKEND:",
                    response
                );


                if(
                    !response ||
                    response.status !== "success"
                ){

                    throw new Error(
                        response &&
                        response.message
                            ? response.message
                            : "Response backend tidak valid."
                    );

                }


                database =
                    Array.isArray(
                        response.data
                    )
                    ? response.data
                    : [];


                database.sort(
                    function(a,b){

                        const tpkA =
                            String(
                                a.tpk || ""
                            ).toLowerCase();

                        const tpkB =
                            String(
                                b.tpk || ""
                            ).toLowerCase();


                        if(tpkA !== tpkB){

                            return tpkA.localeCompare(
                                tpkB,
                                "id"
                            );

                        }


                        const angkaA =
                            parseInt(
                                String(
                                    a.tumpuk || ""
                                ).replace(
                                    /[^0-9-]/g,
                                    ""
                                )
                            );


                        const angkaB =
                            parseInt(
                                String(
                                    b.tumpuk || ""
                                ).replace(
                                    /[^0-9-]/g,
                                    ""
                                )
                            );


                        if(
                            !isNaN(angkaA) &&
                            !isNaN(angkaB)
                        ){

                            return angkaA - angkaB;

                        }


                        return String(
                            a.tumpuk || ""
                        ).localeCompare(
                            String(
                                b.tumpuk || ""
                            ),
                            "id"
                        );

                    }
                );


                status.innerText =
                    "✅ Data berhasil diambil: " +
                    database.length +
                    " TUMPUK";


                tampilkanData();


            }

            catch(error){

                console.error(error);

                status.innerText =
                    "❌ GAGAL MENGAMBIL DATA TUMPUK: " +
                    error.message;

            }


            selesaiCallback(
                callbackName,
                script
            );

        };


    script.src =
        API_URL +
        "?action=getTumpukList" +
        "&callback=" +
        encodeURIComponent(
            callbackName
        );


    script.onerror =
        function(){

            status.innerText =
                "❌ GAGAL MENGHUBUNGI BACKEND TUMPUK.";

            selesaiCallback(
                callbackName,
                script
            );

        };


    document.body.appendChild(
        script
    );

}


/* =====================================================
   HAPUS CALLBACK
===================================================== */

function selesaiCallback(
    callbackName,
    script
){

    sedangMemuat = false;


    if(script){

        setTimeout(
            function(){

                if(
                    script.parentNode
                ){

                    script.parentNode.removeChild(
                        script
                    );

                }

            },
            100
        );

    }


    try{

        delete window[
            callbackName
        ];

    }

    catch(e){

        window[
            callbackName
        ] = undefined;

    }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(){

    const container =
        document.getElementById(
            "hasil"
        );


    const filterTumpuk =
        document.getElementById(
            "filterTumpuk"
        )
        .value
        .trim()
        .toLowerCase();


    const filterTpk =
        document.getElementById(
            "filterTpk"
        )
        .value
        .trim()
        .toLowerCase();


    let data =
        database.filter(
            function(item){

                const tumpuk =
                    String(
                        item.tumpuk || ""
                    )
                    .trim()
                    .toLowerCase();


                const tpk =
                    String(
                        item.tpk || ""
                    )
                    .trim()
                    .toLowerCase();


                /*
                   TUMPUK HARUS EXACT
                */

                if(
                    filterTumpuk &&
                    tumpuk !== filterTumpuk
                ){

                    return false;

                }


                /*
                   TPK BOLEH PARTIAL
                */

                if(
                    filterTpk &&
                    !tpk.includes(
                        filterTpk
                    )
                ){

                    return false;

                }


                return true;

            }
        );


    container.innerHTML = "";


    if(
        database.length === 0
    ){

        container.innerHTML =
            '<div class="empty">' +
            'Belum ada data TUMPUK.' +
            '</div>';

        return;

    }


    if(
        data.length === 0
    ){

        container.innerHTML =
            '<div class="empty">' +
            'TUMPUK / TPK tidak ditemukan.' +
            '</div>';

        return;

    }


    data.forEach(
        function(item){

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "preview-card";


            const tumpuk =
                document.createElement(
                    "div"
                );

            tumpuk.className =
                "preview-tumpuk";

            tumpuk.innerText =
                "TUMPUK " +
                String(
                    item.tumpuk || ""
                );


            const tpk =
                document.createElement(
                    "div"
                );

            tpk.className =
                "preview-tpk";

            tpk.innerText =
                "TPK ASAL : " +
                String(
                    item.tpk || ""
                );


            const jumlah =
                document.createElement(
                    "div"
                );

            jumlah.className =
                "preview-jumlah";

            jumlah.innerText =
                "JUMLAH BATANG AWAL : " +
                Number(
                    item.jumlahAwal || 0
                );


            const qrArea =
                document.createElement(
                    "div"
                );

            qrArea.className =
                "preview-qr-area";


            const qr =
                document.createElement(
                    "div"
                );

            qr.className =
                "preview-qr";


            const akhir =
                document.createElement(
                    "div"
                );

            akhir.className =
                "preview-akhir";

            akhir.innerText =
                "JUMLAH BATANG\nAKHIR TAHUN";


            qrArea.appendChild(
                qr
            );

            qrArea.appendChild(
                akhir
            );


            card.appendChild(
                tumpuk
            );

            card.appendChild(
                tpk
            );

            card.appendChild(
                jumlah
            );

            card.appendChild(
                qrArea
            );


            container.appendChild(
                card
            );


            /*
               IDENTITAS QR

               TPK|TUMPUK

               Contoh:

               SARADAN|29
               TPK B|29
               TPK C|29
            */

            const qrValue =
                String(
                    item.stackId ||
                    (
                        String(
                            item.tpk || ""
                        ) +
                        "|" +
                        String(
                            item.tumpuk || ""
                        )
                    )
                ).trim();


            try{

                new QRCode(
                    qr,
                    {
                        text:qrValue,
                        width:100,
                        height:100,
                        correctLevel:
                            QRCode.CorrectLevel.M
                    }
                );

            }

            catch(error){

                console.error(
                    "QR error:",
                    error
                );

            }

        }
    );

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterTumpuk"
    ).value = "";


    document.getElementById(
        "filterTpk"
    ).value = "";


    tampilkanData();

}


/* =====================================================
   CETAK QR
===================================================== */

function cetakBarcode(){

    if(
        database.length === 0
    ){

        alert(
            "Data TUMPUK belum diambil."
        );

        return;

    }


    const filterTumpuk =
        document.getElementById(
            "filterTumpuk"
        )
        .value
        .trim()
        .toLowerCase();


    const filterTpk =
        document.getElementById(
            "filterTpk"
        )
        .value
        .trim()
        .toLowerCase();


    let data =
        database.filter(
            function(item){

                const tumpuk =
                    String(
                        item.tumpuk || ""
                    )
                    .trim()
                    .toLowerCase();


                const tpk =
                    String(
                        item.tpk || ""
                    )
                    .trim()
                    .toLowerCase();


                if(
                    filterTumpuk &&
                    tumpuk !== filterTumpuk
                ){

                    return false;

                }


                if(
                    filterTpk &&
                    !tpk.includes(
                        filterTpk
                    )
                ){

                    return false;

                }


                return true;

            }
        );


    if(
        data.length === 0
    ){

        alert(
            "Tidak ada TUMPUK yang akan dicetak."
        );

        return;

    }


    /*
       URUTKAN TPK -> TUMPUK
    */

    data.sort(
        function(a,b){

            const tpkA =
                String(
                    a.tpk || ""
                ).toLowerCase();

            const tpkB =
                String(
                    b.tpk || ""
                ).toLowerCase();


            if(tpkA !== tpkB){

                return tpkA.localeCompare(
                    tpkB,
                    "id"
                );

            }


            const angkaA =
                parseInt(
                    String(
                        a.tumpuk || ""
                    ).replace(
                        /[^0-9-]/g,
                        ""
                    )
                );


            const angkaB =
                parseInt(
                    String(
                        b.tumpuk || ""
                    ).replace(
                        /[^0-9-]/g,
                        ""
                    )
                );


            if(
                !isNaN(angkaA) &&
                !isNaN(angkaB)
            ){

                return angkaA - angkaB;

            }


            return String(
                a.tumpuk || ""
            ).localeCompare(
                String(
                    b.tumpuk || ""
                ),
                "id"
            );

        }
    );


    const printArea =
        document.getElementById(
            "printArea"
        );


    printArea.innerHTML = "";


    /*
       8 LABEL PER LEMBAR

       2 KOLOM
       4 BARIS
    */

    for(
        let i=0;
        i<data.length;
        i += 8
    ){

        const lembar =
            document.createElement(
                "div"
            );

        lembar.className =
            "lembar";


        const kelompok =
            data.slice(
                i,
                i + 8
            );


        kelompok.forEach(
            function(item){

                const label =
                    document.createElement(
                        "div"
                    );

                label.className =
                    "label";


                /* =========================
                   TUMPUK
                ========================= */

                const tumpuk =
                    document.createElement(
                        "div"
                    );

                tumpuk.className =
                    "label-tumpuk";

                tumpuk.innerText =
                    "TUMPUK " +
                    String(
                        item.tumpuk || ""
                    );


                /* =========================
                   TPK ASAL
                ========================= */

                const tpk =
                    document.createElement(
                        "div"
                    );

                tpk.className =
                    "label-tpk";

                tpk.innerText =
                    "TPK ASAL : " +
                    String(
                        item.tpk || ""
                    );


                /* =========================
                   BAGIAN BAWAH
                ========================= */

                const bottom =
                    document.createElement(
                        "div"
                    );

                bottom.className =
                    "label-bottom";


                /* =========================
                   QR
                ========================= */

                const qrBox =
                    document.createElement(
                        "div"
                    );

                qrBox.className =
                    "label-qr-box";


                const qr =
                    document.createElement(
                        "div"
                    );

                qr.className =
                    "label-qr";


                qrBox.appendChild(
                    qr
                );


                /* =========================
                   KOTAK AKHIR TAHUN
                ========================= */

                const akhirArea =
                    document.createElement(
                        "div"
                    );

                akhirArea.className =
                    "label-akhir-area";


                const akhirTitle =
                    document.createElement(
                        "div"
                    );

                akhirTitle.className =
                    "label-akhir-title";

                akhirTitle.innerText =
                    "JUMLAH BATANG AKHIR TAHUN";


                const akhirBox =
                    document.createElement(
                        "div"
                    );

                akhirBox.className =
                    "label-akhir-box";


                akhirArea.appendChild(
                    akhirTitle
                );

                akhirArea.appendChild(
                    akhirBox
                );


                bottom.appendChild(
                    qrBox
                );

                bottom.appendChild(
                    akhirArea
                );


                /* =========================
                   MASUKKAN KE LABEL
                ========================= */

                label.appendChild(
                    tumpuk
                );

                label.appendChild(
                    tpk
                );

                label.appendChild(
                    bottom
                );


                lembar.appendChild(
                    label
                );


                /*
                   IDENTITAS QR

                   TPK|TUMPUK
                */

                const qrValue =
                    String(
                        item.stackId ||
                        (
                            String(
                                item.tpk || ""
                            ) +
                            "|" +
                            String(
                                item.tumpuk || ""
                            )
                        )
                    ).trim();


                try{

                    new QRCode(
                        qr,
                        {
                            text:qrValue,
                            width:120,
                            height:120,
                            correctLevel:
                                QRCode.CorrectLevel.M
                        }
                    );

                }

                catch(error){

                    console.error(
                        "QR cetak error:",
                        error
                    );

                }

            }
        );


        /*
           Kalau kurang dari 8,
           sisanya tetap kosong.
        */

        while(
            lembar.children.length < 8
        ){

            const kosong =
                document.createElement(
                    "div"
                );

            kosong.className =
                "label";

            kosong.style.visibility =
                "hidden";

            lembar.appendChild(
                kosong
            );

        }


        printArea.appendChild(
            lembar
        );

    }


    /*
       Tunggu QR selesai dirender
       baru print.
    */

    setTimeout(
        function(){

            window.print();

        },
        700
    );

}


/* =====================================================
   AUTO AMBIL DATA SAAT HALAMAN DIBUKA
===================================================== */

window.addEventListener(
    "load",
    function(){

        ambilDatabase();

    }
);

</script>
