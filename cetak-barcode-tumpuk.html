<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CETAK QR TUMPUK</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

/* =====================================================
   DASAR
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#eeeeee;
    font-family:Arial,Helvetica,sans-serif;
    color:#111;
}

.panel{
    max-width:1200px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 18px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    font-size:28px;
    margin:0 0 25px 0;
}


/* =====================================================
   FILTER
===================================================== */

.filter-box{
    max-width:500px;
    margin:0 auto 20px auto;
}

.filter-box label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    font-size:16px;
}

.filter-box input{
    width:100%;
    padding:13px 15px;
    border:2px solid #ccc;
    border-radius:9px;
    font-size:18px;
    outline:none;
}

.filter-box input:focus{
    border-color:#2196f3;
}


/* =====================================================
   TOMBOL
===================================================== */

.button-area{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:13px 20px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-load{
    background:#16a34a;
    color:#fff;
}

.btn-all{
    background:#2196f3;
    color:#fff;
}

.btn-print{
    background:#111;
    color:#fff;
}

button:active{
    transform:scale(.97);
}


/* =====================================================
   STATUS
===================================================== */

#status{
    text-align:center;
    background:#f1f1f1;
    border-radius:8px;
    padding:10px;
    margin-bottom:20px;
    font-size:14px;
}


/* =====================================================
   HASIL
===================================================== */

#hasil{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:18px;
}


/* =====================================================
   KARTU PREVIEW
===================================================== */

.preview-card{
    background:#ffeb00;
    border:3px solid #000;
    border-radius:10px;

    padding:12px 10px 10px 10px;

    text-align:center;

    overflow:hidden;
}


/* =====================================================
   TUMPUK
   PALING NOTICE
===================================================== */

.preview-tumpuk{

    width:100%;

    font-size:58px;

    font-weight:1000;

    line-height:.9;

    margin-bottom:8px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    letter-spacing:-1px;
}


/* =====================================================
   TPK
===================================================== */

.preview-tpk{

    width:100%;

    font-size:32px;

    font-weight:1000;

    line-height:1;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-bottom:5px;
}


/* =====================================================
   BLOK
===================================================== */

.preview-blok{

    width:100%;

    font-size:25px;

    font-weight:1000;

    line-height:1;

    margin-bottom:10px;
}


/* =====================================================
   QR 3 JEJER
===================================================== */

.qr-row{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:7px;

    width:100%;
}


.qr-box{

    width:70px;

    height:70px;

    background:#fff;

    border:2px solid #000;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-shrink:0;
}


.qr-box img,
.qr-box canvas{

    width:62px !important;

    height:62px !important;
}


/* =====================================================
   PRINT AREA
===================================================== */

#printArea{
    display:none;
}


/* =====================================================
   CETAK F4
   8 LABEL / LEMBAR
   2 KOLOM x 4 BARIS
===================================================== */

@media print{

    @page{
        size:F4 portrait;
        margin:0;
    }

    html,
    body{

        margin:0;

        padding:0;

        width:215.9mm;

        height:330.2mm;

        background:#fff;
    }

    body *{
        visibility:hidden;
    }

    #printArea,
    #printArea *{
        visibility:visible;
    }

    #printArea{

        display:grid;

        grid-template-columns:
            107.95mm
            107.95mm;

        grid-template-rows:
            82.55mm
            82.55mm
            82.55mm
            82.55mm;

        width:215.9mm;

        height:330.2mm;

        margin:0;

        padding:0;
    }


    /* =================================================
       LABEL
    ================================================= */

    .print-label{

        width:107.95mm;

        height:82.55mm;

        background:#ffeb00;

        border:1mm solid #000;

        display:flex;

        flex-direction:column;

        align-items:center;

        justify-content:flex-start;

        overflow:hidden;

        padding:3mm 3mm 2mm 3mm;
    }


    /* =================================================
       TUMPUK PRINT
       SUPER NOTICE
    ================================================= */

    .print-tumpuk{

        width:100%;

        text-align:center;

        font-size:21mm;

        line-height:.82;

        font-weight:1000;

        white-space:nowrap;

        overflow:hidden;

        text-overflow:ellipsis;

        letter-spacing:-.5mm;

        margin-bottom:2mm;
    }


    /* =================================================
       TPK PRINT
    ================================================= */

    .print-tpk{

        width:100%;

        text-align:center;

        font-size:10mm;

        line-height:.9;

        font-weight:1000;

        white-space:nowrap;

        overflow:hidden;

        text-overflow:ellipsis;

        margin-bottom:1.5mm;
    }


    /* =================================================
       BLOK PRINT
    ================================================= */

    .print-blok{

        width:100%;

        text-align:center;

        font-size:6mm;

        line-height:.9;

        font-weight:1000;

        margin-bottom:2.5mm;
    }


    /* =================================================
       QR 3 JEJER
    ================================================= */

    .print-qr-row{

        width:100%;

        display:flex;

        justify-content:center;

        align-items:center;

        gap:2.5mm;
    }


    .print-qr{

        width:21mm;

        height:21mm;

        background:#fff;

        border:.5mm solid #000;

        display:flex;

        justify-content:center;

        align-items:center;

        flex-shrink:0;
    }


    .print-qr img,
    .print-qr canvas{

        width:18mm !important;

        height:18mm !important;
    }


    .print-empty{

        visibility:hidden !important;

        border-color:transparent !important;

        background:transparent !important;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    body{
        padding:10px;
    }

    .panel{
        padding:14px;
        border-radius:12px;
    }

    h1{
        font-size:23px;
        margin-bottom:20px;
    }

    #hasil{
        grid-template-columns:1fr;
    }

    .preview-card{

        padding:10px 8px 9px 8px;
    }


    /* TUMPUK MOBILE */

    .preview-tumpuk{

        font-size:62px;

        line-height:.86;

        letter-spacing:-1.5px;

        margin-bottom:8px;
    }


    /* TPK MOBILE */

    .preview-tpk{

        font-size:34px;

        line-height:.95;

        margin-bottom:5px;
    }


    /* BLOK MOBILE */

    .preview-blok{

        font-size:27px;

        line-height:.95;

        margin-bottom:10px;
    }


    /* QR MOBILE */

    .qr-row{

        gap:6px;
    }


    .qr-box{

        width:66px;

        height:66px;
    }


    .qr-box img,
    .qr-box canvas{

        width:58px !important;

        height:58px !important;
    }


    button{
        width:100%;
    }

}

</style>

</head>


<body>

<div class="panel">

    <h1>CETAK QR TUMPUK</h1>


    <!-- =================================================
         FILTER
    ================================================== -->

    <div class="filter-box">

        <label for="filterTumpuk">
            FILTER TUMPUK
        </label>

        <input
            type="text"
            id="filterTumpuk"
            placeholder="Contoh: 29"
            oninput="tampilkanData()"
        >

    </div>


    <!-- =================================================
         TOMBOL
    ================================================== -->

    <div class="button-area">

        <button
            class="btn-load"
            onclick="ambilDatabase()">
            🔄 AMBIL DATA
        </button>

        <button
            class="btn-all"
            onclick="tampilkanSemua()">
            📋 TAMPILKAN SEMUA
        </button>

        <button
            class="btn-print"
            onclick="cetakBarcode()">
            🖨️ CETAK 8 / LEMBAR F4
        </button>

    </div>


    <!-- =================================================
         STATUS
    ================================================== -->

    <div id="status">
        Silakan ambil data tumpuk.
    </div>


    <!-- =================================================
         HASIL
    ================================================== -->

    <div id="hasil"></div>

</div>


<!-- =====================================================
     AREA CETAK
===================================================== -->

<div id="printArea"></div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


/* =====================================================
   DATA
===================================================== */

let database = [];

let sedangMemuat = false;


/* =====================================================
   FUNGSI URUT TUMPUK
   KECIL → BESAR
===================================================== */

function urutTumpuk(a,b){

    const numA =
        parseInt(a.tumpuk,10) || 0;

    const numB =
        parseInt(b.tumpuk,10) || 0;

    return numA - numB;

}


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    if(sedangMemuat){
        return;
    }

    sedangMemuat = true;

    document.getElementById("status").textContent =
        "⏳ Mengambil data...";

    const callbackName =
        "jsonpCallback_" + Date.now();

    window[callbackName] = function(response){

        try{

            if(!response ||
               response.status !== "success"){

                throw new Error(
                    response && response.message
                    ? response.message
                    : "Gagal mengambil data."
                );

            }

            database =
                Array.isArray(response.data)
                ? response.data
                : [];


            /* =========================================
               URUT TUMPUK KECIL → BESAR
            ========================================= */

            database.sort(urutTumpuk);


            document.getElementById("status").textContent =
                "✅ " + database.length +
                " tumpukan berhasil diambil.";

            tampilkanData();

        }

        catch(error){

            console.error(error);

            document.getElementById("status").textContent =
                "❌ " + error.message;

        }

        finally{

            selesaiCallback(
                callbackName,
                script
            );

            sedangMemuat = false;

        }

    };


    const script =
        document.createElement("script");

    script.src =
        API_URL +
        "?action=getTumpukList" +
        "&callback=" +
        callbackName;

    script.onerror = function(){

        document.getElementById("status").textContent =
            "❌ Gagal menghubungi server.";

        selesaiCallback(
            callbackName,
            script
        );

        sedangMemuat = false;

    };

    document.body.appendChild(script);

}


/* =====================================================
   CLEAN JSONP
===================================================== */

function selesaiCallback(
    callbackName,
    script
){

    try{

        if(script &&
           script.parentNode){

            script.parentNode.removeChild(script);

        }

    }
    catch(e){}

    try{

        delete window[callbackName];

    }
    catch(e){

        window[callbackName] =
            undefined;

    }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(){

    const container =
        document.getElementById("hasil");

    container.innerHTML = "";


    const filter =
        document
            .getElementById("filterTumpuk")
            .value
            .trim()
            .toLowerCase();


    let data =
        database.filter(function(item){

            if(!filter){
                return true;
            }

            return String(
                item.tumpuk || ""
            ).toLowerCase() === filter;

        });


    /* ================================================
       URUT TUMPUK KECIL → BESAR
    ================================================ */

    data.sort(urutTumpuk);


    if(data.length === 0){

        container.innerHTML =
            '<div style="' +
            'grid-column:1/-1;' +
            'text-align:center;' +
            'padding:30px;' +
            'font-weight:bold;' +
            '">' +
            'Data tidak ditemukan.' +
            '</div>';

        return;

    }


    data.forEach(function(item){

        const card =
            document.createElement("div");

        card.className =
            "preview-card";


        /* =================================================
           TUMPUK
        ================================================= */

        const tumpuk =
            document.createElement("div");

        tumpuk.className =
            "preview-tumpuk";

        tumpuk.textContent =
            "TUMPUK " +
            (item.tumpuk || "");


        /* =================================================
           TPK
        ================================================= */

        const tpk =
            document.createElement("div");

        tpk.className =
            "preview-tpk";

        tpk.textContent =
            "TPK " +
            (item.tpk || "");


        /* =================================================
           BLOK
        ================================================= */

        const blok =
            document.createElement("div");

        blok.className =
            "preview-blok";

        blok.textContent =
            "BLOK";


        /* =================================================
           QR ROW
        ================================================= */

        const qrRow =
            document.createElement("div");

        qrRow.className =
            "qr-row";


        const stackId =
            item.stackId ||
            (
                String(item.tpk || "") +
                "|" +
                String(item.tumpuk || "")
            );


        /* =================================================
           3 QR
        ================================================= */

        for(let i = 0; i < 3; i++){

            const qrBox =
                document.createElement("div");

            qrBox.className =
                "qr-box";


            const qr =
                document.createElement("div");


            qrBox.appendChild(qr);

            qrRow.appendChild(qrBox);


            setTimeout(function(){

                new QRCode(qr,{

                    text:stackId,

                    width:62,

                    height:62,

                    correctLevel:
                        QRCode.CorrectLevel.M

                });

            },0);

        }


        card.appendChild(tumpuk);

        card.appendChild(tpk);

        card.appendChild(blok);

        card.appendChild(qrRow);

        container.appendChild(card);

    });

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterTumpuk"
    ).value = "";

    tampilkanData();

}


/* =====================================================
   CETAK
===================================================== */

function cetakBarcode(){

    const filter =
        document
            .getElementById("filterTumpuk")
            .value
            .trim()
            .toLowerCase();


    let data =
        database.filter(function(item){

            if(!filter){
                return true;
            }

            return String(
                item.tumpuk || ""
            ).toLowerCase() === filter;

        });


    /* ================================================
       URUT TUMPUK KECIL → BESAR
    ================================================ */

    data.sort(urutTumpuk);


    if(data.length === 0){

        alert(
            "Tidak ada data untuk dicetak."
        );

        return;

    }


    const printArea =
        document.getElementById(
            "printArea"
        );

    printArea.innerHTML = "";


    /* =================================================
       BUAT LABEL
    ================================================= */

    data.forEach(function(item){

        const label =
            document.createElement("div");

        label.className =
            "print-label";


        /* =================================================
           TUMPUK
        ================================================= */

        const tumpuk =
            document.createElement("div");

        tumpuk.className =
            "print-tumpuk";

        tumpuk.textContent =
            "TUMPUK " +
            (item.tumpuk || "");


        /* =================================================
           TPK
        ================================================= */

        const tpk =
            document.createElement("div");

        tpk.className =
            "print-tpk";

        tpk.textContent =
            "TPK " +
            (item.tpk || "");


        /* =================================================
           BLOK
        ================================================= */

        const blok =
            document.createElement("div");

        blok.className =
            "print-blok";

        blok.textContent =
            "BLOK";


        /* =================================================
           QR ROW
        ================================================= */

        const qrRow =
            document.createElement("div");

        qrRow.className =
            "print-qr-row";


        const stackId =
            item.stackId ||
            (
                String(item.tpk || "") +
                "|" +
                String(item.tumpuk || "")
            );


        /* =================================================
           3 QR
        ================================================= */

        for(let i = 0; i < 3; i++){

            const qrBox =
                document.createElement("div");

            qrBox.className =
                "print-qr";


            const qr =
                document.createElement("div");


            qrBox.appendChild(qr);

            qrRow.appendChild(qrBox);


            new QRCode(qr,{

                text:stackId,

                width:65,

                height:65,

                correctLevel:
                    QRCode.CorrectLevel.M

            });

        }


        label.appendChild(tumpuk);

        label.appendChild(tpk);

        label.appendChild(blok);

        label.appendChild(qrRow);

        printArea.appendChild(label);

    });


    /* =================================================
       PAD 8 LABEL
    ================================================= */

    const jumlahSisa =
        data.length % 8;


    if(jumlahSisa !== 0){

        const jumlahKosong =
            8 - jumlahSisa;


        for(
            let i = 0;
            i < jumlahKosong;
            i++
        ){

            const empty =
                document.createElement("div");

            empty.className =
                "print-label print-empty";

            printArea.appendChild(empty);

        }

    }


    /* =================================================
       CETAK
    ================================================= */

    setTimeout(function(){

        window.print();

    },700);

}


/* =====================================================
   OTOMATIS AMBIL DATA
===================================================== */

window.addEventListener(
    "load",
    function(){

        ambilDatabase();

    }
);

</script>

</body>

</html>
