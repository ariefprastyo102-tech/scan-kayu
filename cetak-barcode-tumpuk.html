<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CETAK QR TUMPUK</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

/* =====================================================
   DASAR
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#eeeeee;
    font-family:Arial,Helvetica,sans-serif;
    color:#111;
}

.panel{
    width:100%;
    max-width:1200px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

h1{
    margin:0 0 18px 0;
    text-align:center;
    font-size:28px;
}


/* =====================================================
   FILTER
===================================================== */

.filter-box{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:15px;
}

.filter-title{
    font-size:16px;
    font-weight:bold;
}

.filter-input-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

#filterTumpuk{
    flex:1;
    min-width:250px;
    height:45px;
    padding:0 14px;
    border:2px solid #777;
    border-radius:8px;
    font-size:18px;
    outline:none;
}

#filterTumpuk:focus{
    border-color:#111;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 16px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-filter{
    background:#1976d2;
    color:white;
}

.btn-all{
    background:#333;
    color:white;
}

.btn-pilih-filter{
    background:#f0ad00;
    color:#111;
}

.btn-pilih-semua{
    background:#198754;
    color:white;
}

.btn-batal{
    background:#dc3545;
    color:white;
}

button:hover{
    opacity:.85;
}

.filter-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:4px;
    padding:10px 12px;
    background:#f5f5f5;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
}


/* =====================================================
   HASIL
===================================================== */

.hasil-box{
    margin-top:15px;
    font-size:15px;
    font-weight:bold;
}

.preview-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:15px;
    margin-top:15px;
}


/* =====================================================
   CARD PREVIEW
===================================================== */

.preview-card{
    position:relative;
    background:#ffe900;
    border:2px solid #111;
    border-radius:10px;
    padding:15px;
    text-align:center;
}

.preview-check{
    position:absolute;
    top:10px;
    left:10px;
    width:24px;
    height:24px;
    cursor:pointer;
}

.preview-tumpuk-label{
    font-size:30px;
    font-weight:bold;
    line-height:1;
    margin-top:8px;
}

.preview-tumpuk-number{
    font-size:68px;
    font-weight:900;
    line-height:.95;
    margin-top:5px;
}

.preview-tpk{
    font-size:38px;
    font-weight:900;
    line-height:1;
    margin-top:18px;
    margin-bottom:12px;
}

.preview-qr{
    width:120px;
    height:120px;
    margin:0 auto;
    display:flex;
    justify-content:center;
    align-items:center;
}

.preview-qr-inner{
    width:112px;
    height:112px;
}

.preview-blok{
    margin-top:14px;
    font-size:35px;
    font-weight:900;
    line-height:1;
}


/* =====================================================
   PESAN
===================================================== */

.message{
    text-align:center;
    padding:30px 10px;
    font-size:18px;
    font-weight:bold;
    color:#555;
}


/* =====================================================
   PRINT
===================================================== */

#printArea{
    display:none;
}


/* =====================================================
   PRINT F4 LANDSCAPE
===================================================== */

@media print{

    @page{
        size:F4 landscape;
        margin:0;
    }

    html,
    body{
        margin:0!important;
        padding:0!important;

        width:330.2mm!important;
        min-width:330.2mm!important;

        height:215.9mm!important;
        min-height:215.9mm!important;

        background:#fff!important;
    }

    .panel,
    #previewGrid,
    .hasil-box{
        display:none!important;
    }

    #printArea{

        display:block!important;

        width:330.2mm!important;
        height:215.9mm!important;

        margin:0!important;
        padding:0!important;

        position:relative!important;

        box-sizing:border-box!important;
    }


    /* =================================================
       HALAMAN PRINT

       TINGGI 213MM
       JARAK HORIZONTAL 2MM
       JARAK VERTIKAL 2MM
       GESER 3MM KE KANAN
    ================================================= */

    .print-page{

        width:326.898mm!important;

        height:213mm!important;

        min-width:326.898mm!important;
        min-height:213mm!important;

        max-width:326.898mm!important;
        max-height:213mm!important;

        margin:2mm 0 0 0!important;

        padding:0!important;

        display:grid!important;

        grid-template-columns:
            162.449mm
            162.449mm;

        grid-template-rows:
            105.5mm
            105.5mm;

        column-gap:2mm!important;

        row-gap:2mm!important;

        box-sizing:border-box!important;

        overflow:hidden!important;

        transform:translateX(3mm)!important;

        break-after:page;
        page-break-after:always;
    }

    .print-page:last-child{
        break-after:auto!important;
        page-break-after:auto!important;
    }


    /* =================================================
       LABEL
    ================================================= */

    .print-label{

        width:162.449mm!important;
        height:105.5mm!important;

        min-width:162.449mm!important;
        min-height:105.5mm!important;

        max-width:162.449mm!important;
        max-height:105.5mm!important;

        box-sizing:border-box!important;

        background:#ffeb00!important;

        border:1mm solid #000;

        display:flex;

        flex-direction:column;

        align-items:center;

        justify-content:flex-start;

        overflow:hidden;

        padding:
            2mm
            5mm
            2mm
            5mm;

        margin:0!important;

        position:relative!important;
    }


    /* =================================================
       TUMPUK
    ================================================= */

    .print-tumpuk{

        width:100%;

        display:flex;

        justify-content:center;

        align-items:center;

        gap:5mm;

        text-align:center;

        margin-bottom:1.5mm;

        line-height:1;

        white-space:nowrap;

        overflow:visible;

        flex-shrink:0;
    }

    .print-tumpuk-label{

        font-size:14mm;

        font-weight:900;

        line-height:.85;

        flex-shrink:0;
    }

    .print-tumpuk-number{

        display:inline-flex;

        align-items:center;

        justify-content:center;

        min-width:48mm;

        padding:
            2.5mm
            6mm
            3mm
            6mm;

        border:.9mm solid #000;

        border-radius:3.5mm;

        background:#fff;

        font-size:36mm;

        font-weight:1000;

        line-height:.72;

        letter-spacing:-1mm;

        flex-shrink:0;
    }


    /* =================================================
       TPK
       DITURUNKAN 3MM
       AGAR TPK + QR + BLOK TURUN BERSAMA
    ================================================= */

    .print-tpk{

        width:100%;

        text-align:center;

        font-size:14mm;

        line-height:.85;

        font-weight:1000;

        white-space:nowrap;

        overflow:hidden;

        text-overflow:ellipsis;

        margin-top:3mm;

        margin-bottom:3mm;

        flex-shrink:0;
    }


    /* =================================================
       QR
       DIPERKECIL AGAR TPK + BLOK LEBIH BESAR
    ================================================= */

    .print-qr{

        width:30mm;

        height:30mm;

        min-width:30mm;

        min-height:30mm;

        background:#fff;

        border:.7mm solid #000;

        display:flex;

        justify-content:center;

        align-items:center;

        padding:1.5mm;

        margin:
            0
            0
            3mm
            0;

        flex-shrink:0;
    }

    .print-qr-inner{

        width:27mm;

        height:27mm;
    }

    .print-qr img,
    .print-qr canvas{

        width:27mm!important;

        height:27mm!important;

        image-rendering:auto;
    }


    /* =================================================
       BLOK
    ================================================= */

    .print-blok{

        width:100%;

        text-align:center;

        font-size:14mm;

        line-height:.8;

        font-weight:1000;

        margin-top:0;

        margin-bottom:0;

        flex-shrink:0;
    }


    /* =================================================
       TAHUN
    ================================================= */

    .print-tahun{

        position:absolute;

        right:3mm;

        bottom:2mm;

        font-size:6mm;

        line-height:1;

        font-weight:900;

        margin:0;

        padding:0;

        z-index:10;
    }


    /* =================================================
       KOTAK KOSONG
    ================================================= */

    .print-empty{

        visibility:hidden!important;

        border-color:transparent!important;

        background:transparent!important;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    body{
        padding:8px;
    }

    .panel{
        padding:12px;
        border-radius:8px;
    }

    h1{
        font-size:22px;
    }

    .filter-input-row{
        flex-direction:column;
    }

    #filterTumpuk{
        width:100%;
        min-width:0;
        font-size:17px;
    }

    .filter-input-row button{
        width:100%;
    }

    .preview-grid{
        grid-template-columns:1fr;
    }

    .preview-tumpuk-label{
        font-size:25px;
    }

    .preview-tumpuk-number{
        font-size:58px;
    }

    .preview-tpk{
        font-size:32px;
    }

    .preview-blok{
        font-size:30px;
    }

}

</style>

</head>


<body>


<div class="panel">

    <h1>CETAK QR TUMPUK</h1>


    <div class="filter-box">

        <div class="filter-title">
            FILTER NOMOR TUMPUK
        </div>


        <div class="filter-input-row">

            <input
                type="text"
                id="filterTumpuk"
                placeholder="Contoh: 1 11 12 13"
                autocomplete="off"
            >

            <button
                class="btn-filter"
                onclick="jalankanFilter()">
                🔎 FILTER
            </button>

            <button
                class="btn-all"
                onclick="tampilkanSemua()">
                TAMPILKAN SEMUA
            </button>

        </div>


        <div class="filter-input-row">

            <button
                class="btn-pilih-filter"
                onclick="pilihHasilFilter()">
                PILIH HASIL FILTER
            </button>

            <button
                class="btn-pilih-semua"
                onclick="pilihSemua()">
                PILIH SEMUA
            </button>

            <button
                class="btn-batal"
                onclick="batalSemua()">
                BATAL SEMUA
            </button>

            <button
                onclick="cetakBarcode()">
                🖨 CETAK YANG DIPILIH
            </button>

        </div>


        <div class="filter-info">

            <span id="infoTampil">
                Menampilkan: 0 data
            </span>

            <span id="infoDipilih">
                Dipilih: 0 data
            </span>

        </div>

    </div>


    <div
        class="hasil-box"
        id="hasilBox">
        DATA TUMPUK
    </div>


    <div
        id="previewGrid"
        class="preview-grid">
    </div>

</div>


<div id="printArea"></div>


<script>


/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


const HALAMAN_TUMPUK_URL =
"https://ariefprastyo102-tech.github.io/scan-kayu/cek-tumpuk.html";


/* =====================================================
   VARIABEL
===================================================== */

let database=[];

let sedangMemuat=false;

let pilihanCetak=new Set();


/* =====================================================
   LINK TUMPUK
===================================================== */

function buatLinkTumpuk(item){

    const tpk=
        encodeURIComponent(
            String(item.tpk||"").trim()
        );

    const tumpuk=
        encodeURIComponent(
            String(item.tumpuk||"").trim()
        );

    return (
        HALAMAN_TUMPUK_URL+
        "?tpk="+
        tpk+
        "&tumpuk="+
        tumpuk
    );
}


/* =====================================================
   ID PILIHAN
===================================================== */

function buatIdPilihan(item){

    return (
        String(item.tpk||"").trim()+
        "|" +
        String(item.tumpuk||"").trim()
    );
}


/* =====================================================
   SORT TUMPUK
===================================================== */

function urutTumpuk(a,b){

    const na=
        Number(
            String(a.tumpuk||"")
            .replace(/[^\d.-]/g,"")
        );

    const nb=
        Number(
            String(b.tumpuk||"")
            .replace(/[^\d.-]/g,"")
        );

    if(
        !isNaN(na) &&
        !isNaN(nb)
    ){

        return na-nb;

    }

    return String(a.tumpuk||"")
        .localeCompare(
            String(b.tumpuk||""),
            undefined,
            {
                numeric:true,
                sensitivity:"base"
            }
        );
}


/* =====================================================
   UPDATE INFO
===================================================== */

function updateInfo(){

    const tampil=
        document.querySelectorAll(
            ".preview-card"
        ).length;

    let dipilih=0;

    document
        .querySelectorAll(".preview-check")
        .forEach(cb=>{

            if(cb.checked){

                dipilih++;

            }

        });


    document.getElementById(
        "infoTampil"
    ).textContent=
        "Menampilkan: "+
        tampil+
        " data";


    document.getElementById(
        "infoDipilih"
    ).textContent=
        "Dipilih: "+
        dipilih+
        " data";
}


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    if(sedangMemuat)return;

    sedangMemuat=true;


    document.getElementById(
        "previewGrid"
    ).innerHTML=
        '<div class="message">⏳ Memuat data...</div>';


    const callbackName=
        "callbackTumpuk_"+
        Date.now();


    window[callbackName]=function(data){

        try{

            if(Array.isArray(data)){

                database=data;

            }
            else if(
                data &&
                Array.isArray(data.data)
            ){

                database=data.data;

            }
            else{

                database=[];

            }


            database.sort(urutTumpuk);

            pilihanCetak.clear();

            tampilkanData(database);

        }
        catch(err){

            console.error(err);

            document.getElementById(
                "previewGrid"
            ).innerHTML=
                '<div class="message">❌ Data gagal diproses</div>';

        }


        sedangMemuat=false;

    };


    const script=
        document.createElement("script");


    script.src=
        API_URL+
        "?action=getTumpukList"+
        "&callback="+
        callbackName+
        "&_="+
        Date.now();


    script.onerror=function(){

        sedangMemuat=false;

        document.getElementById(
            "previewGrid"
        ).innerHTML=
            '<div class="message">❌ Gagal mengambil data dari server</div>';

    };


    document.body.appendChild(script);
}


/* =====================================================
   FILTER
===================================================== */

function ambilFilterTumpuk(){

    const input=
        document
        .getElementById("filterTumpuk")
        .value
        .trim();


    if(!input)return [];


    return input
        .split(/[\s,;]+/)
        .map(x=>x.trim().toLowerCase())
        .filter(x=>x!=="");
}


/* =====================================================
   JALANKAN FILTER
===================================================== */

function jalankanFilter(){

    const daftar=
        ambilFilterTumpuk();


    if(daftar.length===0){

        tampilkanData(database);

        return;

    }


    const hasil=
        database.filter(item=>{

            const tumpuk=
                String(
                    item.tumpuk||""
                )
                .trim()
                .toLowerCase();


            return daftar.includes(tumpuk);

        });


    hasil.sort(urutTumpuk);

    tampilkanData(hasil);
}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterTumpuk"
    ).value="";


    tampilkanData(database);
}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(data){

    const grid=
        document.getElementById(
            "previewGrid"
        );


    grid.innerHTML="";


    if(
        !Array.isArray(data) ||
        data.length===0
    ){

        grid.innerHTML=
            '<div class="message">Tidak ada data Tumpuk yang ditemukan.</div>';

        updateInfo();

        return;

    }


    data.forEach(item=>{

        const tumpuk=
            String(
                item.tumpuk||""
            ).trim();


        const tpk=
            String(
                item.tpk||""
            ).trim();


        const blok=
            String(
                item.blok||""
            ).trim();


        const id=
            buatIdPilihan(item);


        const card=
            document.createElement("div");


        card.className=
            "preview-card";


        /* CHECKBOX */

        const checkbox=
            document.createElement("input");


        checkbox.type="checkbox";

        checkbox.className=
            "preview-check";


        checkbox.dataset.id=id;

        checkbox.checked=
            pilihanCetak.has(id);


        checkbox.addEventListener(
            "change",
            function(){

                if(this.checked){

                    pilihanCetak.add(id);

                }
                else{

                    pilihanCetak.delete(id);

                }


                updateInfo();

            }
        );


        card.appendChild(checkbox);


        /* TUMPUK */

        const labelTumpuk=
            document.createElement("div");


        labelTumpuk.className=
            "preview-tumpuk-label";


        labelTumpuk.textContent=
            "TUMPUK";


        card.appendChild(labelTumpuk);


        /* NOMOR */

        const nomorTumpuk=
            document.createElement("div");


        nomorTumpuk.className=
            "preview-tumpuk-number";


        nomorTumpuk.textContent=
            tumpuk;


        card.appendChild(nomorTumpuk);


        /* TPK */

        const teksTpk=
            document.createElement("div");


        teksTpk.className=
            "preview-tpk";


        if(tumpuk==="29"){

            teksTpk.textContent=
                "TPK CAMPUR";

        }
        else{

            teksTpk.textContent=
                "TPK "+tpk;

        }


        card.appendChild(teksTpk);


        /* QR */

        const qrBox=
            document.createElement("div");


        qrBox.className=
            "preview-qr";


        const qrInner=
            document.createElement("div");


        qrInner.className=
            "preview-qr-inner";


        qrBox.appendChild(qrInner);

        card.appendChild(qrBox);


        new QRCode(
            qrInner,
            {
                text:buatLinkTumpuk(item),
                width:112,
                height:112,
                correctLevel:
                    QRCode.CorrectLevel.H
            }
        );


        /* BLOK */

        const teksBlok=
            document.createElement("div");


        teksBlok.className=
            "preview-blok";


        teksBlok.textContent=
            "BLOK "+blok;


        card.appendChild(teksBlok);


        grid.appendChild(card);

    });


    updateInfo();
}


/* =====================================================
   PILIH HASIL FILTER
===================================================== */

function pilihHasilFilter(){

    const cards=
        document.querySelectorAll(
            ".preview-card"
        );


    if(cards.length===0)return;


    cards.forEach(card=>{

        const cb=
            card.querySelector(
                ".preview-check"
            );


        if(!cb)return;


        cb.checked=true;

        pilihanCetak.add(
            cb.dataset.id
        );

    });


    updateInfo();
}


/* =====================================================
   PILIH SEMUA
===================================================== */

function pilihSemua(){

    database.forEach(item=>{

        pilihanCetak.add(
            buatIdPilihan(item)
        );

    });


    document
        .querySelectorAll(
            ".preview-check"
        )
        .forEach(cb=>{

            cb.checked=true;

        });


    updateInfo();
}


/* =====================================================
   BATAL SEMUA
===================================================== */

function batalSemua(){

    pilihanCetak.clear();


    document
        .querySelectorAll(
            ".preview-check"
        )
        .forEach(cb=>{

            cb.checked=false;

        });


    updateInfo();
}


/* =====================================================
   BUAT PRINT
===================================================== */

function prosesCetak(dataCetak){

    if(
        !Array.isArray(dataCetak) ||
        dataCetak.length===0
    ){

        alert(
            "Tidak ada data yang akan dicetak."
        );

        return;

    }


    const printArea=
        document.getElementById(
            "printArea"
        );


    printArea.innerHTML="";


    for(
        let i=0;
        i<dataCetak.length;
        i+=4
    ){

        const page=
            document.createElement("div");


        page.className=
            "print-page";


        for(
            let j=0;
            j<4;
            j++
        ){

            const index=i+j;


            /* KOTAK KOSONG */

            if(
                index>=dataCetak.length
            ){

                const empty=
                    document.createElement("div");


                empty.className=
                    "print-label print-empty";


                page.appendChild(empty);

                continue;

            }


            const item=
                dataCetak[index];


            const tumpuk=
                String(
                    item.tumpuk||""
                ).trim();


            const tpk=
                String(
                    item.tpk||""
                ).trim();


            const blok=
                String(
                    item.blok||""
                ).trim();


            /* LABEL */

            const label=
                document.createElement("div");


            label.className=
                "print-label";


            /* =========================
               TUMPUK ROW
            ========================= */

            const tumpukRow=
                document.createElement("div");


            tumpukRow.className=
                "print-tumpuk";


            const labelTumpuk=
                document.createElement("span");


            labelTumpuk.className=
                "print-tumpuk-label";


            labelTumpuk.textContent=
                "TUMPUK";


            const nomor=
                document.createElement("span");


            nomor.className=
                "print-tumpuk-number";


            nomor.textContent=
                tumpuk;


            tumpukRow.appendChild(
                labelTumpuk
            );


            tumpukRow.appendChild(
                nomor
            );


            label.appendChild(
                tumpukRow
            );


            /* =========================
               TPK
            ========================= */

            const teksTpk=
                document.createElement("div");


            teksTpk.className=
                "print-tpk";


            if(tumpuk==="29"){

                teksTpk.textContent=
                    "TPK CAMPUR";

            }
            else{

                teksTpk.textContent=
                    "TPK "+tpk;

            }


            label.appendChild(
                teksTpk
            );


            /* =========================
               QR
            ========================= */

            const qr=
                document.createElement("div");


            qr.className=
                "print-qr";


            const qrInner=
                document.createElement("div");


            qrInner.className=
                "print-qr-inner";


            qr.appendChild(qrInner);

            label.appendChild(qr);


            new QRCode(
                qrInner,
                {
                    text:buatLinkTumpuk(item),
                    width:225,
                    height:225,
                    correctLevel:
                        QRCode.CorrectLevel.H
                }
            );


            /* =========================
               BLOK
            ========================= */

            const teksBlok=
                document.createElement("div");


            teksBlok.className=
                "print-blok";


            teksBlok.textContent=
                "BLOK "+blok;


            label.appendChild(
                teksBlok
            );


            /* =========================
               TAHUN
            ========================= */

            const tahun=
                document.createElement("div");


            tahun.className=
                "print-tahun";


            tahun.textContent="26";


            label.appendChild(
                tahun
            );


            page.appendChild(label);

        }


        printArea.appendChild(page);

    }


    /*
       Tunggu QR selesai dirender
       sebelum membuka dialog print
    */

    setTimeout(
        function(){

            window.print();

        },
        700
    );
}


/* =====================================================
   CETAK YANG DIPILIH
===================================================== */

function cetakBarcode(){

    const dataCetak=
        database
        .filter(
            item=>
                pilihanCetak.has(
                    buatIdPilihan(item)
                )
        )
        .sort(urutTumpuk);


    if(dataCetak.length===0){

        alert(
            "Belum ada Tumpuk yang dipilih."
        );

        return;

    }


    prosesCetak(dataCetak);
}

document
