<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CETAK QR TUMPUK</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#eeeeee;
    font-family:Arial,Helvetica,sans-serif;
    color:#111;
}

.panel{
    max-width:1200px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 18px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    font-size:28px;
    margin:0 0 25px 0;
}


/* =====================================================
   FILTER
===================================================== */

.filter-box{
    max-width:500px;
    margin:0 auto 20px auto;
}

.filter-box label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    font-size:16px;
}

.filter-box input{
    width:100%;
    padding:13px 15px;
    border:2px solid #ccc;
    border-radius:9px;
    font-size:18px;
    outline:none;
}

.filter-box input:focus{
    border-color:#2196f3;
}


/* =====================================================
   BUTTON
===================================================== */

.button-area{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:13px 20px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-load{
    background:#16a34a;
    color:#fff;
}

.btn-all{
    background:#2196f3;
    color:#fff;
}

.btn-print{
    background:#111;
    color:#fff;
}

button:active{
    transform:scale(.97);
}


/* =====================================================
   STATUS
===================================================== */

#status{
    text-align:center;
    background:#f1f1f1;
    border-radius:8px;
    padding:10px;
    margin-bottom:20px;
    font-size:14px;
}

#printInfo{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:10px 0 20px 0;
}


/* =====================================================
   PREVIEW
===================================================== */

#hasil{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:18px;
}

.preview-card{
    background:#ffeb00;
    border:3px solid #000;
    border-radius:10px;
    padding:12px 10px;
    text-align:center;
    overflow:hidden;
}


/* =====================================================
   PILIH CETAK
===================================================== */

.pilih-cetak{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    margin-bottom:12px;
    font-size:19px;
    font-weight:900;
    cursor:pointer;
}

.pilih-cetak input{
    width:24px;
    height:24px;
    cursor:pointer;
    accent-color:#16a34a;
}

.preview-card.dipilih{
    border:4px solid #16a34a;
}


/* =====================================================
   PREVIEW TUMPUK
===================================================== */

.preview-tumpuk{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
}

.preview-tumpuk-label{
    font-size:30px;
    font-weight:900;
    line-height:.9;
    flex-shrink:0;
}

.preview-tumpuk-number{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:100px;
    padding:6px 15px 8px 15px;
    border:3px solid #000;
    border-radius:10px;
    background:#fff;
    font-size:68px;
    font-weight:1000;
    line-height:.78;
    letter-spacing:-2px;
    flex-shrink:0;
}


/* =====================================================
   PREVIEW TPK
===================================================== */

.preview-tpk{
    width:100%;
    font-size:38px;
    font-weight:1000;
    line-height:.95;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:10px;
}


/* =====================================================
   PREVIEW QR
===================================================== */

.qr-row{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    margin-top:4px;
    margin-bottom:11px;
}

.qr-box{
    width:120px;
    height:120px;
    background:#fff;
    border:2px solid #000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-shrink:0;
    padding:3px;
}

.qr-box img,
.qr-box canvas{
    width:112px !important;
    height:112px !important;
    image-rendering:auto;
}


/* =====================================================
   PREVIEW BLOK
===================================================== */

.preview-blok{
    width:100%;
    font-size:35px;
    font-weight:1000;
    line-height:.95;
    margin-bottom:5px;
}


/* =====================================================
   AREA PRINT
===================================================== */

#printArea{
    display:none;
}


/* =====================================================
   PRINT F4 LANDSCAPE
   2 KOLOM x 2 BARIS
   SKALA INTERNAL 99%
===================================================== */

@media print{

    @page{
        size:F4 landscape;
        margin:0;
    }

    html,
    body{
        margin:0 !important;
        padding:0 !important;

        width:330.2mm !important;
        min-width:330.2mm !important;

        height:215.9mm !important;
        min-height:215.9mm !important;

        background:#fff !important;
    }

    .panel,
    #hasil{
        display:none !important;
    }

    #printArea{
        display:block !important;

        width:330.2mm !important;
        height:215.9mm !important;

        margin:0 !important;
        padding:0 !important;

        position:relative !important;

        box-sizing:border-box !important;
    }


    /* =================================================
       F4 MASTER
       UKURAN INTERNAL 99%
    ================================================= */

    .print-page{

        /*
           F4 landscape:
           330.2 x 215.9 mm

           99%:
           326.898 x 213.741 mm
        */

        width:326.898mm !important;
        height:213.741mm !important;

        min-width:326.898mm !important;
        min-height:213.741mm !important;

        max-width:326.898mm !important;
        max-height:213.741mm !important;

        margin:0 !important;

        padding:0 !important;

        display:grid !important;

        grid-template-columns:
            163.449mm 163.449mm;

        grid-template-rows:
            106.8705mm 106.8705mm;

        box-sizing:border-box !important;

        overflow:hidden !important;

        /*
           Tetap mulai dari kiri atas.
           Tidak digeser ke bawah/atas.
        */

        transform:none !important;

        break-after:page;
        page-break-after:always;
    }

    .print-page:last-child{
        break-after:auto !important;
        page-break-after:auto !important;
    }


    /* =================================================
       LABEL
       MASING-MASING 99% DARI UKURAN SETENGAH F4
    ================================================= */

    .print-label{

        width:163.449mm !important;
        height:106.8705mm !important;

        min-width:163.449mm !important;
        min-height:106.8705mm !important;

        max-width:163.449mm !important;
        max-height:106.8705mm !important;

        box-sizing:border-box !important;

        background:#ffeb00 !important;

        border:1mm solid #000;

        display:flex;

        flex-direction:column;

        align-items:center;

        justify-content:flex-start;

        overflow:hidden;

        padding:
            2mm
            5mm
            2mm
            5mm;

        margin:0 !important;
    }


    /* =================================================
       TUMPUK
===================================================== */

    .print-tumpuk{

        width:100%;

        display:flex;

        justify-content:center;

        align-items:center;

        gap:5mm;

        text-align:center;

        margin-bottom:1.5mm;

        line-height:1;

        white-space:nowrap;

        overflow:visible;

        flex-shrink:0;
    }

    .print-tumpuk-label{

        font-size:13mm;

        font-weight:900;

        line-height:.85;

        flex-shrink:0;
    }

    .print-tumpuk-number{

        display:inline-flex;

        align-items:center;

        justify-content:center;

        min-width:48mm;

        padding:
            2.5mm
            6mm
            3mm
            6mm;

        border:
            .9mm
            solid
            #000;

        border-radius:3.5mm;

        background:#fff;

        font-size:34mm;

        font-weight:1000;

        line-height:.72;

        letter-spacing:-1mm;

        flex-shrink:0;
    }


    /* =================================================
       TPK
===================================================== */

    .print-tpk{

        width:100%;

        text-align:center;

        font-size:12mm;

        line-height:.85;

        font-weight:1000;

        white-space:nowrap;

        overflow:hidden;

        text-overflow:ellipsis;

        margin-top:0;

        /* JARAK TPK → QR */
        margin-bottom:5mm;

        flex-shrink:0;
    }


    /* =================================================
       QR
===================================================== */

    .print-qr-row{

        width:100%;

        display:flex;

        justify-content:center;

        align-items:center;

        margin-top:0;

        /* JARAK QR → BLOK */
        margin-bottom:1.5mm;

        flex-shrink:0;
    }

    .print-qr{

        width:43mm;

        height:43mm;

        min-width:43mm;

        min-height:43mm;

        background:#fff;

        border:.7mm solid #000;

        display:flex;

        justify-content:center;

        align-items:center;

        padding:1.5mm;

        flex-shrink:0;
    }

    .print-qr img,
    .print-qr canvas{

        width:40mm !important;

        height:40mm !important;

        image-rendering:auto;
    }


    /* =================================================
       BLOK
===================================================== */

    .print-blok{

        width:100%;

        text-align:center;

        font-size:12mm;

        line-height:.8;

        font-weight:1000;

        margin-top:0;

        margin-bottom:0;

        flex-shrink:0;
    }


    /* =================================================
       LABEL KOSONG
===================================================== */

    .print-empty{

        visibility:hidden !important;

        border-color:transparent !important;

        background:transparent !important;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    body{
        padding:10px;
    }

    .panel{
        padding:14px;
        border-radius:12px;
    }

    h1{
        font-size:23px;
        margin-bottom:20px;
    }

    #hasil{
        grid-template-columns:1fr;
    }

    .preview-card{
        padding:
            12px
            9px
            12px
            9px;
    }

    .pilih-cetak{
        font-size:18px;
        margin-bottom:10px;
    }

    .pilih-cetak input{
        width:24px;
        height:24px;
    }

    .preview-tumpuk{
        gap:8px;
        margin-bottom:10px;
    }

    .preview-tumpuk-label{
        font-size:27px;
    }

    .preview-tumpuk-number{

        min-width:95px;

        padding:
            6px
            14px
            8px
            14px;

        border:3px solid #000;

        border-radius:10px;

        font-size:65px;

        line-height:.80;

        letter-spacing:-2px;
    }

    .preview-tpk{
        font-size:36px;
        line-height:.95;
        margin-bottom:9px;
    }

    .qr-row{
        margin-top:4px;
        margin-bottom:10px;
    }

    .qr-box{
        width:110px;
        height:110px;
        padding:3px;
    }

    .qr-box img,
    .qr-box canvas{
        width:102px !important;
        height:102px !important;
    }

    .preview-blok{
        font-size:33px;
        line-height:.95;
        margin-bottom:5px;
    }

    button{
        width:100%;
    }

}

</style>

</head>

<body>


<div class="panel">

    <h1>CETAK QR TUMPUK</h1>


    <div class="filter-box">

        <label for="filterTumpuk">
            FILTER TUMPUK
        </label>

        <input
            type="text"
            id="filterTumpuk"
            placeholder="Contoh: 29"
            oninput="tampilkanData()"
        >

    </div>


    <div class="button-area">

        <button
            class="btn-load"
            onclick="ambilDatabase()"
        >
            🔄 AMBIL DATA
        </button>


        <button
            class="btn-all"
            onclick="tampilkanSemua()"
        >
            📋 TAMPILKAN SEMUA
        </button>


        <button
            class="btn-print"
            onclick="cetakBarcode()"
        >
            🖨️ CETAK YANG DIPILIH
        </button>

    </div>


    <div id="status">
        Silakan ambil data tumpuk.
    </div>


    <div id="printInfo">
        0 TUMPUK DIPILIH — 0 LEMBAR F4
    </div>


    <div id="hasil"></div>

</div>


<div id="printArea"></div>


<script>


/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


let database = [];

let sedangMemuat = false;

let pilihanCetak = new Set();


const HALAMAN_TUMPUK_URL =
"https://ariefprastyo102-tech.github.io/scan-kayu/cek-tumpuk.html";


/* =====================================================
   LINK TUMPUK
===================================================== */

function buatLinkTumpuk(item){

    const tpk =
        String(item.tpk || "").trim();

    const tumpuk =
        String(item.tumpuk || "").trim();

    return (
        HALAMAN_TUMPUK_URL +
        "?tpk=" +
        encodeURIComponent(tpk) +
        "&tumpuk=" +
        encodeURIComponent(tumpuk)
    );

}


/* =====================================================
   ID PILIHAN
===================================================== */

function buatIdPilihan(item){

    const tpk =
        String(item.tpk || "").trim();

    const tumpuk =
        String(item.tumpuk || "").trim();

    return tpk + "|" + tumpuk;

}


/* =====================================================
   SORT TUMPUK
===================================================== */

function urutTumpuk(a,b){

    const numA =
        parseInt(a.tumpuk,10) || 0;

    const numB =
        parseInt(b.tumpuk,10) || 0;

    return numA - numB;

}


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    if(sedangMemuat)return;

    sedangMemuat = true;

    document.getElementById("status").textContent =
        "⏳ Mengambil data...";

    const callbackName =
        "jsonpCallback_" + Date.now();

    let script = null;

    window[callbackName] =
        function(response){

            try{

                if(
                    !response ||
                    response.status !== "success"
                ){

                    throw new Error(
                        response &&
                        response.message
                        ?
                        response.message
                        :
                        "Gagal mengambil data."
                    );

                }

                database =
                    Array.isArray(response.data)
                    ?
                    response.data
                    :
                    [];

                database.sort(urutTumpuk);

                document.getElementById("status").textContent =
                    "✅ " +
                    database.length +
                    " tumpukan berhasil diambil.";

                tampilkanData();

            }catch(error){

                console.error(error);

                document.getElementById("status").textContent =
                    "❌ " +
                    error.message;

            }finally{

                selesaiCallback(
                    callbackName,
                    script
                );

                sedangMemuat = false;

            }

        };


    script =
        document.createElement("script");


    script.src =
        API_URL +
        "?action=getTumpukList&callback=" +
        callbackName;


    script.onerror =
        function(){

            document.getElementById("status").textContent =
                "❌ Gagal menghubungi server.";

            selesaiCallback(
                callbackName,
                script
            );

            sedangMemuat = false;

        };


    document.body.appendChild(script);

}


/* =====================================================
   SELESAI CALLBACK
===================================================== */

function selesaiCallback(
    callbackName,
    script
){

    try{

        if(
            script &&
            script.parentNode
        ){

            script.parentNode.removeChild(script);

        }

    }catch(e){}


    try{

        delete window[callbackName];

    }catch(e){

        window[callbackName] = undefined;

    }

}


/* =====================================================
   UPDATE STATUS PILIHAN
===================================================== */

function updateStatusPilihan(){

    const jumlah =
        pilihanCetak.size;

    const jumlahLembar =
        jumlah > 0
        ?
        Math.ceil(jumlah / 4)
        :
        0;

    document.getElementById("printInfo").textContent =
        jumlah +
        " TUMPUK DIPILIH — " +
        jumlahLembar +
        " LEMBAR F4";

    const status =
        document.getElementById("status");

    if(jumlah > 0){

        status.textContent =
            "✅ " +
            jumlah +
            " TUMPUK siap dicetak.";

    }else{

        status.textContent =
            "Belum ada TUMPUK yang dipilih.";

    }

}


/* =====================================================
   UBAH PILIHAN
===================================================== */

function ubahPilihan(
    item,
    checked,
    card
){

    const id =
        buatIdPilihan(item);

    if(checked){

        pilihanCetak.add(id);

        card.classList.add("dipilih");

    }else{

        pilihanCetak.delete(id);

        card.classList.remove("dipilih");

    }

    updateStatusPilihan();

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(){

    const container =
        document.getElementById("hasil");

    container.innerHTML = "";

    const filter =
        document
        .getElementById("filterTumpuk")
        .value
        .trim()
        .toLowerCase();

    let data =
        database.filter(function(item){

            if(!filter)return true;

            return String(
                item.tumpuk || ""
            )
            .trim()
            .toLowerCase()
            === filter;

        });

    data.sort(urutTumpuk);

    if(data.length === 0){

        container.innerHTML =
            '<div style="grid-column:1/-1;text-align:center;padding:30px;font-weight:bold;">Data tidak ditemukan.</div>';

        return;

    }


    data.forEach(function(item){

        const card =
            document.createElement("div");

        card.className =
            "preview-card";

        const idPilihan =
            buatIdPilihan(item);

        const sudahDipilih =
            pilihanCetak.has(idPilihan);

        if(sudahDipilih){

            card.classList.add("dipilih");

        }


        /* =============================================
           CHECKBOX
        ============================================= */

        const pilihCetak =
            document.createElement("label");

        pilihCetak.className =
            "pilih-cetak";

        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";

        checkbox.checked =
            sudahDipilih;

        const tulisan =
            document.createElement("span");

        tulisan.textContent =
            "PILIH CETAK";

        checkbox.addEventListener(
            "change",
            function(){

                ubahPilihan(
                    item,
                    checkbox.checked,
                    card
                );

            }
        );

        pilihCetak.appendChild(
            checkbox
        );

        pilihCetak.appendChild(
            tulisan
        );


        /* =============================================
           TUMPUK
        ============================================= */

        const tumpuk =
            document.createElement("div");

        tumpuk.className =
            "preview-tumpuk";

        const tumpukLabel =
            document.createElement("span");

        tumpukLabel.className =
            "preview-tumpuk-label";

        tumpukLabel.textContent =
            "TUMPUK";

        const tumpukNumber =
            document.createElement("span");

        tumpukNumber.className =
            "preview-tumpuk-number";

        tumpukNumber.textContent =
            item.tumpuk || "";

        tumpuk.appendChild(
            tumpukLabel
        );

        tumpuk.appendChild(
            tumpukNumber
        );


        /* =============================================
           TPK
        ============================================= */

        const tpk =
            document.createElement("div");

        tpk.className =
            "preview-tpk";

        tpk.textContent =
            "TPK " +
            (item.tpk || "");


        /* =============================================
           QR
        ============================================= */

        const qrRow =
            document.createElement("div");

        qrRow.className =
            "qr-row";

        const qrBox =
            document.createElement("div");

        qrBox.className =
            "qr-box";

        const qr =
            document.createElement("div");

        qrBox.appendChild(
            qr
        );

        qrRow.appendChild(
            qrBox
        );

        const qrLink =
            buatLinkTumpuk(item);

        setTimeout(function(){

            new QRCode(
                qr,
                {
                    text:qrLink,

                    width:112,

                    height:112,

                    correctLevel:
                        QRCode.CorrectLevel.M
                }
            );

        },0);


        /* =============================================
           BLOK
        ============================================= */

        const blok =
            document.createElement("div");

        blok.className =
            "preview-blok";

        blok.textContent =
            "BLOK " +
            (item.blok || "");


        /* =============================================
           APPEND
        ============================================= */

        card.appendChild(
            pilihCetak
        );

        card.appendChild(
            tumpuk
        );

        card.appendChild(
            tpk
        );

        card.appendChild(
            qrRow
        );

        card.appendChild(
            blok
        );

        container.appendChild(
            card
        );

    });


    updateStatusPilihan();

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document
    .getElementById("filterTumpuk")
    .value = "";

    tampilkanData();

}


/* =====================================================
   CETAK BARCODE
===================================================== */

function cetakBarcode(){

    let data =
        database.filter(function(item){

            const id =
                buatIdPilihan(item);

            return pilihanCetak.has(id);

        });


    data.sort(urutTumpuk);


    if(data.length === 0){

        alert(
            "Belum ada TUMPUK yang dipilih untuk dicetak."
        );

        return;

    }


    const printArea =
        document.getElementById("printArea");


    printArea.innerHTML = "";


    const PER_LEMBAR = 4;


    for(
        let start = 0;

        start < data.length;

        start += PER_LEMBAR
    ){

        const page =
            document.createElement("div");

        page.className =
            "print-page";


        const pageData =
            data.slice(
                start,
                start + PER_LEMBAR
            );


        pageData.forEach(
            function(item){

                const label =
                    document.createElement("div");

                label.className =
                    "print-label";


                /* =====================================
                   TUMPUK
                ===================================== */

                const tumpuk =
                    document.createElement("div");

                tumpuk.className =
                    "print-tumpuk";

                const tumpukLabel =
                    document.createElement("span");

                tumpukLabel.className =
                    "print-tumpuk-label";

                tumpukLabel.textContent =
                    "TUMPUK";

                const tumpukNumber =
                    document.createElement("span");

                tumpukNumber.className =
                    "print-tumpuk-number";

                tumpukNumber.textContent =
                    item.tumpuk || "";

                tumpuk.appendChild(
                    tumpukLabel
                );

                tumpuk.appendChild(
                    tumpukNumber
                );


                /* =====================================
                   TPK
                ===================================== */

                const tpk =
                    document.createElement("div");

                tpk.className =
                    "print-tpk";

                tpk.textContent =
                    "TPK " +
                    (item.tpk || "");


                /* =====================================
                   QR
                ===================================== */

                const qrRow =
                    document.createElement("div");

                qrRow.className =
                    "print-qr-row";

                const qrBox =
                    document.createElement("div");

                qrBox.className =
                    "print-qr";

                const qr =
                    document.createElement("div");

                qrBox.appendChild(
                    qr
                );

                qrRow.appendChild(
                    qrBox
                );


                const qrLink =
                    buatLinkTumpuk(item);


                new QRCode(
                    qr,
                    {
                        text:qrLink,

                        width:275,

                        height:275,

                        correctLevel:
                            QRCode.CorrectLevel.M
                    }
                );


                /* =====================================
                   BLOK
                ===================================== */

                const blok =
                    document.createElement("div");

                blok.className =
                    "print-blok";

                blok.textContent =
                    "BLOK " +
                    (item.blok || "");


                /* =====================================
                   SUSUN LABEL
                ===================================== */

                label.appendChild(
                    tumpuk
                );

                label.appendChild(
                    tpk
                );

                label.appendChild(
                    qrRow
                );

                label.appendChild(
                    blok
                );

                page.appendChild(
                    label
                );

            }
        );


        while(
            page.children.length <
            PER_LEMBAR
        ){

            const empty =
                document.createElement("div");

            empty.className =
                "print-label print-empty";

            page.appendChild(
                empty
            );

        }


        printArea.appendChild(
            page
        );

    }


    const jumlahLembar =
        Math.ceil(
            data.length /
            PER_LEMBAR
        );


    document.getElementById(
        "printInfo"
    ).textContent =
        data.length +
        " TUMPUK DIPILIH — " +
        jumlahLembar +
        " LEMBAR F4";


    setTimeout(
        function(){

            window.print();

        },
        700
    );

}


/* =====================================================
   LOAD AWAL
===================================================== */

window.addEventListener(
    "load",
    function(){

        ambilDatabase();

    }
);

</script>

</body>

</html>
