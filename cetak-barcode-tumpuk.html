<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Cetak Barcode Tumpuk</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:#eeeeee;
    font-family:Arial, Helvetica, sans-serif;
}


/* =====================================================
   KONTROL
===================================================== */

.controls{
    width:100%;
    max-width:1000px;
    margin:20px auto;
    padding:20px;

    background:#ffffff;

    border-radius:12px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.12);
}

.controls h1{
    margin:0 0 15px 0;

    text-align:center;

    font-size:26px;
    font-weight:900;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.search-box input{
    flex:1;

    height:48px;

    padding:0 15px;

    border:2px solid #cccccc;
    border-radius:8px;

    font-size:18px;
}

.search-box button{
    min-width:110px;

    border:none;
    border-radius:8px;

    background:#111111;
    color:#ffffff;

    font-size:16px;
    font-weight:800;

    cursor:pointer;
}

.search-box button:hover{
    opacity:.85;
}

.info{
    text-align:center;

    font-size:15px;

    margin-top:8px;
}

.loading{
    text-align:center;

    padding:20px;

    font-size:18px;
    font-weight:700;
}


/* =====================================================
   MASTER F4
===================================================== */

#master{

    width:215mm;
    height:330mm;

    margin:20px auto;

    padding:4mm;

    background:#ffffff;

    display:grid;

    grid-template-columns:1fr 1fr;

    grid-template-rows:repeat(4, 1fr);

    gap:3mm;

    overflow:hidden;
}


/* =====================================================
   LABEL
===================================================== */

.label{

    width:100%;
    height:100%;

    background:#ffd900;

    border:1.5mm solid #000000;

    border-radius:2mm;

    padding:3mm;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    overflow:hidden;

    page-break-inside:avoid;
}


/* =====================================================
   TUMPUK
===================================================== */

.label .tumpuk{

    width:100%;

    text-align:center;

    font-size:13mm;

    line-height:1;

    font-weight:900;

    color:#000000;

    margin-bottom:2mm;

    letter-spacing:.5mm;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =====================================================
   TPK
===================================================== */

.label .tpk{

    width:100%;

    text-align:center;

    font-size:5mm;

    line-height:1.1;

    font-weight:900;

    color:#000000;

    margin-bottom:2mm;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =====================================================
   BARCODE
===================================================== */

.barcode{

    width:100%;

    flex:1;

    min-height:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#ffffff;

    padding:2mm;

    border-radius:1mm;

    overflow:hidden;
}

.barcode svg{

    display:block;

    width:78mm !important;

    height:38mm !important;

    max-width:100%;

    max-height:100%;
}


/* =====================================================
   TIDAK ADA DATA
===================================================== */

.empty{

    grid-column:1 / -1;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:24px;

    font-weight:800;

    color:#777777;
}


/* =====================================================
   PRINT
===================================================== */

@media print{

    @page{

        size:215mm 330mm;

        margin:0;
    }


    html,
    body{

        width:215mm;

        height:330mm;

        margin:0;

        padding:0;

        background:#ffffff;
    }


    .controls{

        display:none !important;
    }


    #master{

        width:215mm;

        height:330mm;

        margin:0;

        padding:4mm;

        background:#ffffff;

        display:grid;

        grid-template-columns:1fr 1fr;

        grid-template-rows:repeat(4, 1fr);

        gap:3mm;

        overflow:hidden;
    }


    .label{

        width:100%;

        height:100%;

        -webkit-print-color-adjust:exact;

        print-color-adjust:exact;

        page-break-inside:avoid;

        break-inside:avoid;
    }


    .label .tumpuk,
    .label .tpk{

        color:#000000;
    }


    .barcode{

        background:#ffffff;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     KONTROL
===================================================== -->

<div class="controls">

    <h1>
        CETAK BARCODE TUMPUK
    </h1>


    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Cari TUMPUK atau TPK..."
            autocomplete="off"
        >

        <button
            onclick="cariTumpuk()"
        >
            CARI
        </button>

        <button
            onclick="resetCari()"
        >
            RESET
        </button>

    </div>


    <div
        class="info"
        id="info"
    >
        Memuat data...
    </div>

</div>


<!-- =====================================================
     MASTER CETAK
===================================================== -->

<div id="master">

    <div class="loading">
        Memuat data...
    </div>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
    "https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


/* =====================================================
   DATA
===================================================== */

let semuaData = [];

let dataTampil = [];


/* =====================================================
   JSONP
===================================================== */

function ambilData(){

    const callbackName =
        "jsonpTumpuk_" +
        Date.now();

    window[callbackName] = function(response){

        try{

            if(
                !response ||
                response.success === false
            ){

                throw new Error(
                    response &&
                    response.message
                        ? response.message
                        : "Gagal mengambil data."
                );

            }


            semuaData =
                Array.isArray(response.data)
                    ? response.data
                    : [];


            dataTampil =
                [...semuaData];


            tampilkanData();


        }catch(error){

            console.error(error);

            document.getElementById(
                "master"
            ).innerHTML = `
                <div class="empty">
                    Gagal memuat data
                </div>
            `;

            document.getElementById(
                "info"
            ).textContent =
                error.message;

        }


        delete window[callbackName];

        const script =
            document.getElementById(
                callbackName
            );

        if(script){

            script.remove();

        }

    };


    const script =
        document.createElement(
            "script"
        );


    script.id =
        callbackName;


    script.src =
        API_URL +
        "?action=getTumpukList" +
        "&callback=" +
        encodeURIComponent(
            callbackName
        );


    script.onerror =
        function(){

            document.getElementById(
                "master"
            ).innerHTML = `
                <div class="empty">
                    Gagal terhubung ke server
                </div>
            `;

            document.getElementById(
                "info"
            ).textContent =
                "Gagal mengambil data dari server.";

            delete window[callbackName];

            script.remove();

        };


    document.body.appendChild(
        script
    );

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(){

    const master =
        document.getElementById(
            "master"
        );


    master.innerHTML = "";


    if(!dataTampil.length){

        master.innerHTML = `
            <div class="empty">
                DATA TUMPUK TIDAK DITEMUKAN
            </div>
        `;

        document.getElementById(
            "info"
        ).textContent =
            "Tidak ada data.";

        return;

    }


    dataTampil.forEach(
        function(item){

            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "label";


            /* -----------------------------------------
               TUMPUK
            ----------------------------------------- */

            const tumpuk =
                document.createElement(
                    "div"
                );

            tumpuk.className =
                "tumpuk";

            tumpuk.textContent =
                "TUMPUK " +
                String(
                    item.tumpuk || ""
                );


            /* -----------------------------------------
               TPK
            ----------------------------------------- */

            const tpk =
                document.createElement(
                    "div"
                );

            tpk.className =
                "tpk";

            tpk.textContent =
                "TPK ASAL : " +
                String(
                    item.tpk || "-"
                );


            /* -----------------------------------------
               BARCODE
            ----------------------------------------- */

            const barcodeBox =
                document.createElement(
                    "div"
                );

            barcodeBox.className =
                "barcode";


            const svg =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "svg"
                );


            barcodeBox.appendChild(
                svg
            );


            label.appendChild(
                tumpuk
            );

            label.appendChild(
                tpk
            );

            label.appendChild(
                barcodeBox
            );


            master.appendChild(
                label
            );


            /* -----------------------------------------
               BARCODE VALUE
               
               WAJIB PAKAI STACK ID
               contoh:
               SARADAN|29
            ----------------------------------------- */

            const barcodeValue =
                String(
                    item.stackId ||
                    (
                        (item.tpk || "") +
                        "|" +
                        (item.tumpuk || "")
                    )
                ).trim();


            try{

                JsBarcode(
                    svg,
                    barcodeValue,
                    {

                        format:
                            "CODE128",

                        lineColor:
                            "#000000",

                        background:
                            "#ffffff",

                        width:
                            2,

                        height:
                            80,

                        displayValue:
                            false,

                        margin:
                            0,

                        marginTop:
                            0,

                        marginBottom:
                            0,

                        marginLeft:
                            0,

                        marginRight:
                            0,

                        valid:
                            function(valid){

                                if(!valid){

                                    console.warn(
                                        "Barcode tidak valid:",
                                        barcodeValue
                                    );

                                }

                            }

                    }
                );


            }catch(error){

                console.error(
                    "Gagal membuat barcode:",
                    barcodeValue,
                    error
                );

            }

        }
    );


    document.getElementById(
        "info"
    ).textContent =
        dataTampil.length +
        " label siap dicetak.";


}


/* =====================================================
   CARI
===================================================== */

function cariTumpuk(){

    const input =
        document.getElementById(
            "searchInput"
        ).value
        .trim();


    if(!input){

        dataTampil =
            [...semuaData];

        tampilkanData();

        return;

    }


    /*
       Kalau input angka:
       cari TUMPUK secara EXACT.

       Contoh:
       1  -> hanya TUMPUK 1
       29 -> semua TUMPUK 29
       1 tidak boleh masuk 11, 12, 13
    */

    if(/^\d+$/.test(input)){

        dataTampil =
            semuaData.filter(
                function(item){

                    return String(
                        item.tumpuk || ""
                    ).trim() === input;

                }
            );

    }

    /*
       Kalau bukan angka:
       cari TPK.
    */

    else{

        const keyword =
            input.toLowerCase();


        dataTampil =
            semuaData.filter(
                function(item){

                    return String(
                        item.tpk || ""
                    )
                    .toLowerCase()
                    .includes(
                        keyword
                    );

                }
            );

    }


    tampilkanData();

}


/* =====================================================
   RESET
===================================================== */

function resetCari(){

    document.getElementById(
        "searchInput"
    ).value = "";


    dataTampil =
        [...semuaData];


    tampilkanData();

}


/* =====================================================
   ENTER UNTUK SEARCH
===================================================== */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key ===
                "Enter"
            ){

                cariTumpuk();

            }

        }
    );


/* =====================================================
   MULAI
===================================================== */

ambilData();

</script>


</body>

</html>
