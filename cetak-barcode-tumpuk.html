
<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CETAK QR TUMPUK</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f3f5;
    color:#111;
}

h1{
    text-align:center;
    margin:0 0 20px;
    font-size:28px;
}

.panel{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}


/* =====================================================
   FILTER
===================================================== */

.filter-area{
    margin-bottom:20px;
}

.filter-box{
    display:flex;
    flex-direction:column;
    gap:7px;
    max-width:500px;
}

.filter-box label{
    font-weight:bold;
    font-size:15px;
}

.filter-box input{
    width:100%;
    padding:13px;
    font-size:18px;
    border:2px solid #aaa;
    border-radius:8px;
    outline:none;
}

.filter-box input:focus{
    border-color:#111;
}


/* =====================================================
   BUTTON
===================================================== */

.button-area{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button{
    border:none;
    border-radius:8px;
    padding:12px 18px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-load{
    background:#198754;
    color:white;
}

.btn-print{
    background:#111;
    color:white;
}

.btn-all{
    background:#0d6efd;
    color:white;
}


/* =====================================================
   STATUS
===================================================== */

.status{
    padding:12px;
    background:#f8f9fa;
    border-radius:8px;
    margin-bottom:20px;
    font-weight:bold;
}


/* =====================================================
   PREVIEW
===================================================== */

#hasil{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(280px,1fr));
    gap:15px;
}

.preview-card{
    background:#ffeb00;
    border:3px solid #111;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.preview-tumpuk{
    font-size:32px;
    font-weight:900;
    line-height:1;
    margin-bottom:8px;
}

.preview-tpk{
    font-size:28px;
    font-weight:900;
    line-height:1;
    margin-bottom:14px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.preview-bottom{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:12px;
}

.preview-qr{
    width:90px;
    height:90px;

    background:white;
    border:2px solid #111;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.preview-qr img{
    width:82px !important;
    height:82px !important;
}

.preview-qr canvas{
    width:82px !important;
    height:82px !important;
}


/* KOTAK KOSONG */

.preview-empty-box{
    height:45px;
    flex:1;

    background:white;
    border:3px solid #111;

    min-width:100px;
}


.empty{
    grid-column:1/-1;
    text-align:center;
    padding:40px;
    font-size:20px;
    font-weight:bold;
    color:#666;
}


/* =====================================================
   AREA CETAK
===================================================== */

#printArea{
    display:none;
}


/*
   F4
   215.9mm x 330.2mm

   8 LABEL
   2 KOLOM
   4 BARIS
*/

.lembar{
    width:215.9mm;
    height:330.2mm;

    display:grid;

    grid-template-columns:
        107.95mm
        107.95mm;

    grid-template-rows:
        repeat(4,82.55mm);

    padding:0;
    margin:0;

    page-break-after:always;

    overflow:hidden;
}


/* =====================================================
   LABEL
===================================================== */

.label{
    width:107.95mm;
    height:82.55mm;

    background:#ffeb00;

    border:0.4mm solid #111;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:flex-start;

    padding:5mm;

    overflow:hidden;
}


/* =====================================================
   TUMPUK
===================================================== */

.label-tumpuk{
    font-size:12mm;
    font-weight:900;
    line-height:1;

    margin-bottom:2mm;

    white-space:nowrap;
}


/* =====================================================
   TPK
===================================================== */

.label-tpk{
    font-size:9mm;
    font-weight:900;
    line-height:1;

    margin-bottom:5mm;

    white-space:nowrap;

    max-width:100%;
}


/* =====================================================
   QR + KOTAK KOSONG
===================================================== */

.label-bottom{
    width:100%;

    display:flex;

    align-items:center;

    justify-content:flex-start;

    gap:6mm;

    margin-top:1mm;
}


/* QR DIPINGGIR */

.label-qr-box{
    width:32mm;
    height:32mm;

    background:white;

    border:0.4mm solid #111;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:1mm;

    flex-shrink:0;
}

.label-qr{
    width:29mm;
    height:29mm;

    display:flex;

    align-items:center;
    justify-content:center;
}

.label-qr img{
    width:29mm !important;
    height:29mm !important;
}

.label-qr canvas{
    width:29mm !important;
    height:29mm !important;
}


/* =====================================================
   KOTAK KOSONG
   PENDEK TAPI MEMANJANG
===================================================== */

.label-empty-box{
    width:48mm;
    height:18mm;

    background:white;

    border:0.7mm solid #111;

    flex-shrink:0;
}


/* =====================================================
   PRINT
===================================================== */

@page{
    size:F4 portrait;
    margin:0;
}

@media print{

    html,
    body{
        margin:0 !important;
        padding:0 !important;
        width:215.9mm;
        background:white;
    }

    body > *{
        display:none !important;
    }

    #printArea{
        display:block !important;
        width:215.9mm;
        margin:0;
        padding:0;
    }

    .lembar{
        display:grid !important;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    body{
        padding:10px;
    }

    .panel{
        padding:14px;
    }

    h1{
        font-size:23px;
    }

    .filter-box{
        max-width:none;
    }

    #hasil{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<div class="panel">

    <h1>
        CETAK QR TUMPUK
    </h1>


    <!-- =================================================
         SEARCH CUMA TUMPUK
    ================================================== -->

    <div class="filter-area">

        <div class="filter-box">

            <label>
                CARI TUMPUK
            </label>

            <input
                type="text"
                id="filterTumpuk"
                placeholder="Contoh: 29"
                oninput="tampilkanData"
            >

        </div>

    </div>


    <div class="button-area">

        <button
            class="btn-load"
            onclick="ambilDatabase()">
            🔄 AMBIL DATA
        </button>


        <button
            class="btn-all"
            onclick="tampilkanSemua()">
            📋 TAMPILKAN SEMUA
        </button>


        <button
            class="btn-print"
            onclick="cetakBarcode()">
            🖨️ CETAK 8 / LEMBAR F4
        </button>

    </div>


    <div
        id="status"
        class="status">
        Silakan ambil data tumpuk.
    </div>


    <div id="hasil"></div>

</div>


<div id="printArea"></div>



<script>


/* =====================================================
   BACKEND
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


/* =====================================================
   DATA
===================================================== */

let database = [];

let sedangMemuat = false;


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    if(sedangMemuat){
        return;
    }

    sedangMemuat = true;

    const status =
        document.getElementById("status");

    status.innerText =
        "⏳ Sedang mengambil data tumpuk...";


    const callbackName =
        "callbackTumpuk_" +
        Date.now();


    const script =
        document.createElement("script");


    window[callbackName] =
        function(response){

            try{

                console.log(
                    "RESPON BACKEND:",
                    response
                );


                if(
                    !response ||
                    response.status !== "success"
                ){

                    throw new Error(
                        response &&
                        response.message
                            ? response.message
                            : "Response backend tidak valid."
                    );

                }


                database =
                    Array.isArray(
                        response.data
                    )
                    ? response.data
                    : [];


                database.sort(
                    function(a,b){

                        const tpkA =
                            String(
                                a.tpk || ""
                            ).toLowerCase();

                        const tpkB =
                            String(
                                b.tpk || ""
                            ).toLowerCase();


                        if(tpkA !== tpkB){

                            return tpkA.localeCompare(
                                tpkB,
                                "id"
                            );

                        }


                        const angkaA =
                            parseInt(
                                String(
                                    a.tumpuk || ""
                                ).replace(
                                    /[^0-9-]/g,
                                    ""
                                )
                            );


                        const angkaB =
                            parseInt(
                                String(
                                    b.tumpuk || ""
                                ).replace(
                                    /[^0-9-]/g,
                                    ""
                                )
                            );


                        if(
                            !isNaN(angkaA) &&
                            !isNaN(angkaB)
                        ){

                            return angkaA - angkaB;

                        }


                        return String(
                            a.tumpuk || ""
                        ).localeCompare(
                            String(
                                b.tumpuk || ""
                            ),
                            "id"
                        );

                    }
                );


                status.innerText =
                    "✅ Data berhasil diambil: " +
                    database.length +
                    " TUMPUK";


                tampilkanData();

            }

            catch(error){

                console.error(error);

                status.innerText =
                    "❌ GAGAL MENGAMBIL DATA TUMPUK: " +
                    error.message;

            }


            selesaiCallback(
                callbackName,
                script
            );

        };


    script.src =
        API_URL +
        "?action=getTumpukList" +
        "&callback=" +
        encodeURIComponent(
            callbackName
        );


    script.onerror =
        function(){

            status.innerText =
                "❌ GAGAL MENGHUBUNGI BACKEND TUMPUK.";

            selesaiCallback(
                callbackName,
                script
            );

        };


    document.body.appendChild(
        script
    );

}


/* =====================================================
   HAPUS CALLBACK
===================================================== */

function selesaiCallback(
    callbackName,
    script
){

    sedangMemuat = false;


    if(script){

        setTimeout(
            function(){

                if(
                    script.parentNode
                ){

                    script.parentNode.removeChild(
                        script
                    );

                }

            },
            100
        );

    }


    try{

        delete window[
            callbackName
        ];

    }

    catch(e){

        window[
            callbackName
        ] = undefined;

    }

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(){

    const container =
        document.getElementById(
            "hasil"
        );


    const filterTumpuk =
        document.getElementById(
            "filterTumpuk"
        )
        .value
        .trim()
        .toLowerCase();


    let data =
        database.filter(
            function(item){

                const tumpuk =
                    String(
                        item.tumpuk || ""
                    )
                    .trim()
                    .toLowerCase();


                /*
                   TUMPUK EXACT
                */

                if(
                    filterTumpuk &&
                    tumpuk !== filterTumpuk
                ){

                    return false;

                }


                return true;

            }
        );


    container.innerHTML = "";


    if(
        database.length === 0
    ){

        container.innerHTML =
            '<div class="empty">' +
            'Belum ada data TUMPUK.' +
            '</div>';

        return;

    }


    if(
        data.length === 0
    ){

        container.innerHTML =
            '<div class="empty">' +
            'TUMPUK tidak ditemukan.' +
            '</div>';

        return;

    }


    data.forEach(
        function(item){

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "preview-card";


            const tumpuk =
                document.createElement(
                    "div"
                );

            tumpuk.className =
                "preview-tumpuk";

            tumpuk.innerText =
                "TUMPUK " +
                String(
                    item.tumpuk || ""
                );


            const tpk =
                document.createElement(
                    "div"
                );

            tpk.className =
                "preview-tpk";

            tpk.innerText =
                "TPK ASAL : " +
                String(
                    item.tpk || ""
                );


            const bottom =
                document.createElement(
                    "div"
                );

            bottom.className =
                "preview-bottom";


            const qr =
                document.createElement(
                    "div"
                );

            qr.className =
                "preview-qr";


            const emptyBox =
                document.createElement(
                    "div"
                );

            emptyBox.className =
                "preview-empty-box";


            bottom.appendChild(
                qr
            );

            bottom.appendChild(
                emptyBox
            );


            card.appendChild(
                tumpuk
            );

            card.appendChild(
                tpk
            );

            card.appendChild(
                bottom
            );


            container.appendChild(
                card
            );


            /*
               ISI QR

               TPK|TUMPUK
            */

            const qrValue =
                String(
                    item.stackId ||
                    (
                        String(
                            item.tpk || ""
                        ) +
                        "|" +
                        String(
                            item.tumpuk || ""
                        )
                    )
                ).trim();


            try{

                new QRCode(
                    qr,
                    {
                        text:qrValue,
                        width:82,
                        height:82,
                        correctLevel:
                            QRCode.CorrectLevel.M
                    }
                );

            }

            catch(error){

                console.error(
                    "QR error:",
                    error
                );

            }

        }
    );

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterTumpuk"
    ).value = "";


    tampilkanData();

}


/* =====================================================
   CETAK
===================================================== */

function cetakBarcode(){

    if(
        database.length === 0
    ){

        alert(
            "Data TUMPUK belum diambil."
        );

        return;

    }


    const filterTumpuk =
        document.getElementById(
            "filterTumpuk"
        )
        .value
        .trim()
        .toLowerCase();


    let data =
        database.filter(
            function(item){

                const tumpuk =
                    String(
                        item.tumpuk || ""
                    )
                    .trim()
                    .toLowerCase();


                if(
                    filterTumpuk &&
                    tumpuk !== filterTumpuk
                ){

                    return false;

                }


                return true;

            }
        );


    if(
        data.length === 0
    ){

        alert(
            "Tidak ada TUMPUK yang akan dicetak."
        );

        return;

    }


    /*
       URUTKAN TPK -> TUMPUK
    */

    data.sort(
        function(a,b){

            const tpkA =
                String(
                    a.tpk || ""
                ).toLowerCase();

            const tpkB =
                String(
                    b.tpk || ""
                ).toLowerCase();


            if(tpkA !== tpkB){

                return tpkA.localeCompare(
                    tpkB,
                    "id"
                );

            }


            const angkaA =
                parseInt(
                    String(
                        a.tumpuk || ""
                    ).replace(
                        /[^0-9-]/g,
                        ""
                    )
                );


            const angkaB =
                parseInt(
                    String(
                        b.tumpuk || ""
                    ).replace(
                        /[^0-9-]/g,
                        ""
                    )
                );


            if(
                !isNaN(angkaA) &&
                !isNaN(angkaB)
            ){

                return angkaA - angkaB;

            }


            return String(
                a.tumpuk || ""
            ).localeCompare(
                String(
                    b.tumpuk || ""
                ),
                "id"
            );

        }
    );


    const printArea =
        document.getElementById(
            "printArea"
        );


    printArea.innerHTML = "";


    /*
       8 LABEL PER F4
    */

    for(
        let i=0;
        i<data.length;
        i += 8
    ){

        const lembar =
            document.createElement(
                "div"
            );

        lembar.className =
            "lembar";


        const kelompok =
            data.slice(
                i,
                i + 8
            );


        kelompok.forEach(
            function(item){

                const label =
                    document.createElement(
                        "div"
                    );

                label.className =
                    "label";


                /* TUMPUK */

                const tumpuk =
                    document.createElement(
                        "div"
                    );

                tumpuk.className =
                    "label-tumpuk";

                tumpuk.innerText =
                    "TUMPUK " +
                    String(
                        item.tumpuk || ""
                    );


                /* TPK */

                const tpk =
                    document.createElement(
                        "div"
                    );

                tpk.className =
                    "label-tpk";

                tpk.innerText =
                    "TPK ASAL : " +
                    String(
                        item.tpk || ""
                    );


                /* BAGIAN BAWAH */

                const bottom =
                    document.createElement(
                        "div"
                    );

                bottom.className =
                    "label-bottom";


                /* QR */

                const qrBox =
                    document.createElement(
                        "div"
                    );

                qrBox.className =
                    "label-qr-box";


                const qr =
                    document.createElement(
                        "div"
                    );

                qr.className =
                    "label-qr";


                qrBox.appendChild(
                    qr
                );


                /* KOTAK KOSONG */

                const emptyBox =
                    document.createElement(
                        "div"
                    );

                emptyBox.className =
                    "label-empty-box";


                bottom.appendChild(
                    qrBox
                );

                bottom.appendChild(
                    emptyBox
                );


                /* MASUKKAN */

                label.appendChild(
                    tumpuk
                );

                label.appendChild(
                    tpk
                );

                label.appendChild(
                    bottom
                );


                lembar.appendChild(
                    label
                );


                /*
                   QR VALUE

                   TPK|TUMPUK
                */

                const qrValue =
                    String(
                        item.stackId ||
                        (
                            String(
                                item.tpk || ""
                            ) +
                            "|" +
                            String(
                                item.tumpuk || ""
                            )
                        )
                    ).trim();


                try{

                    new QRCode(
                        qr,
                        {
                            text:qrValue,
                            width:110,
                            height:110,
                            correctLevel:
                                QRCode.CorrectLevel.M
                        }
                    );

                }

                catch(error){

                    console.error(
                        "QR cetak error:",
                        error
                    );

                }

            }
        );


        /*
           KOSONGKAN SLOT SAMPAI 8
        */

        while(
            lembar.children.length < 8
        ){

            const kosong =
                document.createElement(
                    "div"
                );

            kosong.className =
                "label";

            kosong.style.visibility =
                "hidden";

            lembar.appendChild(
                kosong
            );

        }


        printArea.appendChild(
            lembar
        );

    }


    /*
       TUNGGU QR SELESAI
    */

    setTimeout(
        function(){

            window.print();

        },
        700
    );

}


/* =====================================================
   AUTO LOAD
===================================================== */

window.addEventListener(
    "load",
    function(){

        ambilDatabase();

    }
);

</script>

</body>

</html>
