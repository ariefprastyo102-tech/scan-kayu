<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CETAK QR TUMPUK</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

/* =====================================================
   DASAR
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#eeeeee;
    font-family:Arial,Helvetica,sans-serif;
    color:#111;
}

.panel{
    width:100%;
    max-width:1200px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

h1{
    margin:0 0 18px 0;
    text-align:center;
    font-size:28px;
}

/* =====================================================
   FILTER
===================================================== */

.filter-box{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:15px;
}

.filter-title{
    font-size:16px;
    font-weight:bold;
}

.filter-input-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

#filterTumpuk{
    flex:1;
    min-width:250px;
    height:45px;
    padding:0 14px;
    border:2px solid #777;
    border-radius:8px;
    font-size:18px;
    outline:none;
}

#filterTumpuk:focus{
    border-color:#111;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 16px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-filter{
    background:#1976d2;
    color:white;
}

.btn-all{
    background:#333;
    color:white;
}

.btn-pilih-filter{
    background:#f0ad00;
    color:#111;
}

.btn-pilih-semua{
    background:#198754;
    color:white;
}

.btn-batal{
    background:#dc3545;
    color:white;
}

button:hover{
    opacity:.85;
}

.filter-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:4px;
    padding:10px 12px;
    background:#f5f5f5;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
}

/* =====================================================
   HASIL
===================================================== */

.hasil-box{
    margin-top:15px;
    font-size:15px;
    font-weight:bold;
}

.preview-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:15px;
    margin-top:15px;
}

/* =====================================================
   CARD PREVIEW
===================================================== */

.preview-card{
    position:relative;
    background:#ffe900;
    border:2px solid #111;
    border-radius:10px;
    padding:15px;
    text-align:center;
}

.preview-check{
    position:absolute;
    top:10px;
    left:10px;
    width:24px;
    height:24px;
    cursor:pointer;
}

.preview-tumpuk-label{
    font-size:30px;
    font-weight:bold;
    line-height:1;
    margin-top:8px;
}

.preview-tumpuk-number{
    font-size:68px;
    font-weight:900;
    line-height:.95;
    margin-top:5px;
}

.preview-tpk{
    font-size:38px;
    font-weight:900;
    line-height:1;
    margin-top:18px;
    margin-bottom:12px;
}

.preview-qr{
    width:120px;
    height:120px;
    margin:0 auto;
    display:flex;
    justify-content:center;
    align-items:center;
}

.preview-qr-inner{
    width:112px;
    height:112px;
}

.preview-blok{
    margin-top:14px;
    font-size:35px;
    font-weight:900;
    line-height:1;
}

/* =====================================================
   PESAN
===================================================== */

.message{
    text-align:center;
    padding:30px 10px;
    font-size:18px;
    font-weight:bold;
    color:#555;
}

/* =====================================================
   PRINT
===================================================== */

#printArea{
    display:none;
}

@media print{

    @page{
        size:F4 landscape;
        margin:0;
    }

    html,
    body{
        width:330.2mm;
        height:215.9mm;
        margin:0;
        padding:0;
        background:white;
    }

    body > *{
        display:none !important;
    }

    #printArea{
        display:block !important;
        width:330.2mm;
        height:215.9mm;
        margin:0;
        padding:0;
    }

    .print-page{
        width:326.898mm;
        height:213.741mm;
        margin:1.0795mm auto;
        padding:0;

        display:grid;

        grid-template-columns:
            repeat(2,163.449mm);

        grid-template-rows:
            repeat(2,106.8705mm);

        page-break-after:always;
        break-after:page;
    }

    .print-label{
        width:163.449mm;
        height:106.8705mm;

        background:#ffe900;

        border:1mm solid #111;

        padding:2mm 5mm;

        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:flex-start;

        overflow:hidden;
    }

    /* ================================================
       TUMPUK
    ================================================ */

    .print-tumpuk-label{
        font-size:12mm;
        font-weight:bold;
        line-height:.9;
        margin-top:0;
    }

    /* ================================================
       NOMOR TUMPUK
    ================================================ */

    .print-tumpuk-number{
        font-size:32mm;
        font-weight:900;
        line-height:.85;
        margin-top:1mm;
    }

    /* ================================================
       TPK
    ================================================ */

    .print-tpk{
        font-size:11mm;
        font-weight:900;
        line-height:.9;
        margin-top:4mm;
        margin-bottom:4mm;
        white-space:nowrap;
    }

    /* ================================================
       QR
    ================================================ */

    .print-qr{
        width:35mm;
        height:35mm;

        display:flex;
        justify-content:center;
        align-items:center;

        flex:none;
    }

    .print-qr-inner{
        width:32mm;
        height:32mm;
    }

    /* ================================================
       BLOK
    ================================================ */

    .print-blok{
        font-size:11mm;
        font-weight:900;
        line-height:.9;
        margin-top:3mm;
        white-space:nowrap;
    }

    .print-empty{
        visibility:hidden;
    }

}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    body{
        padding:8px;
    }

    .panel{
        padding:12px;
        border-radius:8px;
    }

    h1{
        font-size:22px;
    }

    .filter-input-row{
        flex-direction:column;
    }

    #filterTumpuk{
        width:100%;
        min-width:0;
        font-size:17px;
    }

    .filter-input-row button{
        width:100%;
    }

    .preview-grid{
        grid-template-columns:1fr;
    }

    .preview-tumpuk-label{
        font-size:25px;
    }

    .preview-tumpuk-number{
        font-size:58px;
    }

    .preview-tpk{
        font-size:32px;
    }

    .preview-blok{
        font-size:30px;
    }

}

</style>

</head>

<body>

<div class="panel">

    <h1>CETAK QR TUMPUK</h1>

    <!-- =================================================
         FILTER
    ================================================== -->

    <div class="filter-box">

        <div class="filter-title">
            FILTER NOMOR TUMPUK
        </div>

        <div class="filter-input-row">

            <input
                type="text"
                id="filterTumpuk"
                placeholder="Contoh: 1 11 12 13"
                autocomplete="off"
            >

            <button
                class="btn-filter"
                onclick="jalankanFilter()">
                🔎 FILTER
            </button>

            <button
                class="btn-all"
                onclick="tampilkanSemua()">
                TAMPILKAN SEMUA
            </button>

        </div>

        <div class="filter-input-row">

            <button
                class="btn-pilih-filter"
                onclick="pilihHasilFilter()">
                PILIH HASIL FILTER
            </button>

            <button
                class="btn-pilih-semua"
                onclick="pilihSemua()">
                PILIH SEMUA
            </button>

            <button
                class="btn-batal"
                onclick="batalSemua()">
                BATAL SEMUA
            </button>

            <button
                onclick="cetakBarcode()">
                🖨 CETAK YANG DIPILIH
            </button>

        </div>

        <div class="filter-info">

            <span id="infoTampil">
                Menampilkan: 0 data
            </span>

            <span id="infoDipilih">
                Dipilih: 0 data
            </span>

        </div>

    </div>

    <!-- =================================================
         HASIL
    ================================================== -->

    <div class="hasil-box" id="hasilBox">
        DATA TUMPUK
    </div>

    <div
        id="previewGrid"
        class="preview-grid">
    </div>

</div>

<!-- =====================================================
     AREA PRINT
===================================================== -->

<div id="printArea"></div>

<script>

/* =====================================================
   KONFIGURASI
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";

const HALAMAN_TUMPUK_URL =
"https://ariefprastyo102-tech.github.io/scan-kayu/cek-tumpuk.html";


/* =====================================================
   DATA
===================================================== */

let database = [];

let sedangMemuat = false;

let pilihanCetak = new Set();


/* =====================================================
   LINK TUMPUK
===================================================== */

function buatLinkTumpuk(item){

    const tpk =
        encodeURIComponent(
            String(item.tpk || "").trim()
        );

    const tumpuk =
        encodeURIComponent(
            String(item.tumpuk || "").trim()
        );

    return HALAMAN_TUMPUK_URL +
        "?tpk=" + tpk +
        "&tumpuk=" + tumpuk;
}


/* =====================================================
   ID PILIHAN
===================================================== */

function buatIdPilihan(item){

    return (
        String(item.tpk || "").trim()
        + "|"
        + String(item.tumpuk || "").trim()
    );

}


/* =====================================================
   URUTKAN TUMPUK
===================================================== */

function urutTumpuk(a,b){

    const na =
        Number(
            String(a.tumpuk || "")
            .replace(/[^\d.-]/g,"")
        );

    const nb =
        Number(
            String(b.tumpuk || "")
            .replace(/[^\d.-]/g,"")
        );

    if(!isNaN(na) && !isNaN(nb)){
        return na - nb;
    }

    return String(a.tumpuk || "")
        .localeCompare(
            String(b.tumpuk || ""),
            undefined,
            {
                numeric:true,
                sensitivity:"base"
            }
        );
}


/* =====================================================
   UPDATE INFO
===================================================== */

function updateInfo(){

    const tampil =
        document.querySelectorAll(
            ".preview-card"
        ).length;

    let dipilih = 0;

    document
        .querySelectorAll(".preview-check")
        .forEach(cb => {

            if(cb.checked){
                dipilih++;
            }

        });

    document.getElementById("infoTampil")
        .textContent =
        "Menampilkan: " + tampil + " data";

    document.getElementById("infoDipilih")
        .textContent =
        "Dipilih: " + dipilih + " data";

}


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    if(sedangMemuat){
        return;
    }

    sedangMemuat = true;

    document.getElementById("previewGrid")
        .innerHTML =
        '<div class="message">⏳ Memuat data...</div>';

    const callbackName =
        "callbackTumpuk_" +
        Date.now();

    window[callbackName] =
        function(data){

            try{

                if(Array.isArray(data)){

                    database = data;

                }else if(
                    data &&
                    Array.isArray(data.data)
                ){

                    database = data.data;

                }else{

                    database = [];

                }

                database.sort(urutTumpuk);

                pilihanCetak.clear();

                tampilkanData(database);

            }catch(err){

                console.error(err);

                document.getElementById(
                    "previewGrid"
                ).innerHTML =
                '<div class="message">' +
                '❌ Data gagal diproses' +
                '</div>';

            }

            sedangMemuat = false;

        };

    const script =
        document.createElement("script");

    script.src =
        API_URL +
        "?action=getTumpukList" +
        "&callback=" +
        callbackName +
        "&_=" +
        Date.now();

    script.onerror =
        function(){

            sedangMemuat = false;

            document.getElementById(
                "previewGrid"
            ).innerHTML =
            '<div class="message">' +
            '❌ Gagal mengambil data dari server' +
            '</div>';

        };

    document.body.appendChild(script);

}


/* =====================================================
   AMBIL DAFTAR NOMOR DARI FILTER
===================================================== */

function ambilFilterTumpuk(){

    const input =
        document.getElementById(
            "filterTumpuk"
        ).value.trim();

    if(!input){
        return [];
    }

    return input
        .split(/[\s,;]+/)
        .map(function(x){

            return x
                .trim()
                .toLowerCase();

        })
        .filter(function(x){

            return x !== "";

        });

}


/* =====================================================
   FILTER
===================================================== */

function jalankanFilter(){

    const daftar =
        ambilFilterTumpuk();

    if(daftar.length === 0){

        tampilkanData(database);

        return;

    }

    const hasil =
        database.filter(function(item){

            const tumpuk =
                String(
                    item.tumpuk || ""
                )
                .trim()
                .toLowerCase();

            return daftar.includes(tumpuk);

        });

    hasil.sort(urutTumpuk);

    tampilkanData(hasil);

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterTumpuk"
    ).value = "";

    tampilkanData(database);

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(data){

    const grid =
        document.getElementById(
            "previewGrid"
        );

    grid.innerHTML = "";

    if(!Array.isArray(data) || data.length === 0){

        grid.innerHTML =
        '<div class="message">' +
        'Tidak ada data Tumpuk yang ditemukan.' +
        '</div>';

        updateInfo();

        return;

    }

    data.forEach(function(item){

        const tumpuk =
            String(item.tumpuk || "").trim();

        const tpk =
            String(item.tpk || "").trim();

        const blok =
            String(item.blok || "").trim();

        const id =
            buatIdPilihan(item);

        const card =
            document.createElement("div");

        card.className =
            "preview-card";


        /* =================================================
           CHECKBOX
        ================================================= */

        const checkbox =
            document.createElement("input");

        checkbox.type = "checkbox";

        checkbox.className =
            "preview-check";

        checkbox.dataset.id = id;

        checkbox.checked =
            pilihanCetak.has(id);

        checkbox.addEventListener(
            "change",
            function(){

                if(this.checked){

                    pilihanCetak.add(id);

                }else{

                    pilihanCetak.delete(id);

                }

                updateInfo();

            }
        );

        card.appendChild(checkbox);


        /* =================================================
           LABEL TUMPUK
        ================================================= */

        const labelTumpuk =
            document.createElement("div");

        labelTumpuk.className =
            "preview-tumpuk-label";

        labelTumpuk.textContent =
            "TUMPUK";

        card.appendChild(labelTumpuk);


        /* =================================================
           NOMOR TUMPUK
        ================================================= */

        const nomorTumpuk =
            document.createElement("div");

        nomorTumpuk.className =
            "preview-tumpuk-number";

        nomorTumpuk.textContent =
            tumpuk;

        card.appendChild(nomorTumpuk);


        /* =================================================
           TPK
        ================================================= */

        const teksTpk =
            document.createElement("div");

        teksTpk.className =
            "preview-tpk";

        teksTpk.textContent =
            "TPK " + tpk;

        card.appendChild(teksTpk);


        /* =================================================
           QR
        ================================================= */

        const qrBox =
            document.createElement("div");

        qrBox.className =
            "preview-qr";

        const qrInner =
            document.createElement("div");

        qrInner.className =
            "preview-qr-inner";

        qrBox.appendChild(qrInner);

        card.appendChild(qrBox);


        new QRCode(
            qrInner,
            {
                text: buatLinkTumpuk(item),
                width:112,
                height:112,
                correctLevel:
                    QRCode.CorrectLevel.H
            }
        );


        /* =================================================
           BLOK
        ================================================= */

        const teksBlok =
            document.createElement("div");

        teksBlok.className =
            "preview-blok";

        teksBlok.textContent =
            "BLOK " + blok;

        card.appendChild(teksBlok);


        grid.appendChild(card);

    });

    updateInfo();

}


/* =====================================================
   PILIH HASIL FILTER
===================================================== */

function pilihHasilFilter(){

    const cards =
        document.querySelectorAll(
            ".preview-card"
        );

    if(cards.length === 0){
        return;
    }

    cards.forEach(function(card){

        const cb =
            card.querySelector(
                ".preview-check"
            );

        if(!cb){
            return;
        }

        cb.checked = true;

        pilihanCetak.add(
            cb.dataset.id
        );

    });

    updateInfo();

}


/* =====================================================
   PILIH SEMUA
===================================================== */

function pilihSemua(){

    database.forEach(function(item){

        pilihanCetak.add(
            buatIdPilihan(item)
        );

    });

    document
        .querySelectorAll(
            ".preview-check"
        )
        .forEach(function(cb){

            cb.checked = true;

        });

    updateInfo();

}


/* =====================================================
   BATAL SEMUA
===================================================== */

function batalSemua(){

    pilihanCetak.clear();

    document
        .querySelectorAll(
            ".preview-check"
        )
        .forEach(function(cb){

            cb.checked = false;

        });

    updateInfo();

}


/* =====================================================
   CETAK BARCODE
===================================================== */

function cetakBarcode(){

    const dataCetak =
        database
        .filter(function(item){

            return pilihanCetak.has(
                buatIdPilihan(item)
            );

        })
        .sort(urutTumpuk);

    if(dataCetak.length === 0){

        alert(
            "Belum ada Tumpuk yang dipilih."
        );

        return;

    }

    const printArea =
        document.getElementById(
            "printArea"
        );

    printArea.innerHTML = "";


    /* =================================================
       4 LABEL PER F4
    ================================================= */

    for(
        let i = 0;
        i < dataCetak.length;
        i += 4
    ){

        const page =
            document.createElement("div");

        page.className =
            "print-page";


        for(
            let j = 0;
            j < 4;
            j++
        ){

            const index = i + j;

            if(index >= dataCetak.length){

                const empty =
                    document.createElement("div");

                empty.className =
                    "print-label print-empty";

                page.appendChild(empty);

                continue;

            }

            const item =
                dataCetak[index];

            const tumpuk =
                String(
                    item.tumpuk || ""
                ).trim();

            const tpk =
                String(
                    item.tpk || ""
                ).trim();

            const blok =
                String(
                    item.blok || ""
                ).trim();


            const label =
                document.createElement("div");

            label.className =
                "print-label";


            /* =============================================
               TUMPUK
            ============================================= */

            const labelTumpuk =
                document.createElement("div");

            labelTumpuk.className =
                "print-tumpuk-label";

            labelTumpuk.textContent =
                "TUMPUK";

            label.appendChild(
                labelTumpuk
            );


            /* =============================================
               NOMOR
            ============================================= */

            const nomor =
                document.createElement("div");

            nomor.className =
                "print-tumpuk-number";

            nomor.textContent =
                tumpuk;

            label.appendChild(
                nomor
            );


            /* =============================================
               TPK
            ============================================= */

            const teksTpk =
                document.createElement("div");

            teksTpk.className =
                "print-tpk";

            teksTpk.textContent =
                "TPK " + tpk;

            label.appendChild(
                teksTpk
            );


            /* =============================================
               QR
            ============================================= */

            const qr =
                document.createElement("div");

            qr.className =
                "print-qr";

            const qrInner =
                document.createElement("div");

            qrInner.className =
                "print-qr-inner";

            qr.appendChild(
                qrInner
            );

            label.appendChild(
                qr
            );


            new QRCode(
                qrInner,
                {
                    text:
                        buatLinkTumpuk(item),

                    width:275,
                    height:275,

                    correctLevel:
                        QRCode.CorrectLevel.H
                }
            );


            /* =============================================
               BLOK
            ============================================= */

            const teksBlok =
                document.createElement("div");

            teksBlok.className =
                "print-blok";

            teksBlok.textContent =
                "BLOK " + blok;

            label.appendChild(
                teksBlok
            );


            page.appendChild(
                label
            );

        }


        printArea.appendChild(
            page
        );

    }


    /* =================================================
       TUNGGU QR SELESAI
    ================================================= */

    setTimeout(
        function(){

            window.print();

        },
        700
    );

}


/* =====================================================
   FILTER LANGSUNG SAAT KETIK
===================================================== */

document
    .getElementById("filterTumpuk")
    .addEventListener(
        "input",
        function(){

            jalankanFilter();

        }
    );


/* =====================================================
   ENTER = FILTER
===================================================== */

document
    .getElementById("filterTumpuk")
    .addEventListener(
        "keydown",
        function(e){

            if(e.key === "Enter"){

                e.preventDefault();

                jalankanFilter();

            }

        }
    );


/* =====================================================
   LOAD AWAL
===================================================== */

window.addEventListener(
    "load",
    function(){

        ambilDatabase();

    }
);

</script>

</body>
</html>
