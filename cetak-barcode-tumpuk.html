<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CETAK QR TUMPUK</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

/* =====================================================
   DASAR
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#eeeeee;
    font-family:Arial,Helvetica,sans-serif;
    color:#111;
}

.panel{
    max-width:1200px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 18px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    font-size:28px;
    margin:0 0 25px 0;
}


/* =====================================================
   FILTER
===================================================== */

.filter-box{
    max-width:500px;
    margin:0 auto 20px auto;
}

.filter-box label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    font-size:16px;
}

.filter-box input{
    width:100%;
    padding:13px 15px;
    border:2px solid #ccc;
    border-radius:9px;
    font-size:18px;
    outline:none;
}

.filter-box input:focus{
    border-color:#2196f3;
}


/* =====================================================
   BUTTON
===================================================== */

.button-area{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:13px 20px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-load{
    background:#16a34a;
    color:#fff;
}

.btn-all{
    background:#2196f3;
    color:#fff;
}

.btn-print{
    background:#111;
    color:#fff;
}

button:active{
    transform:scale(.97);
}


/* =====================================================
   STATUS
===================================================== */

#status{
    text-align:center;
    background:#f1f1f1;
    border-radius:8px;
    padding:10px;
    margin-bottom:20px;
    font-size:14px;
}

#printInfo{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:10px 0 20px 0;
}


/* =====================================================
   PREVIEW
===================================================== */

#hasil{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(300px,1fr));
    gap:18px;
}

.preview-card{
    background:#ffeb00;
    border:3px solid #000;
    border-radius:10px;
    padding:12px 10px 10px 10px;
    text-align:center;
    overflow:hidden;
}

.pilih-cetak{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

.pilih-cetak input{
    width:22px;
    height:22px;
    cursor:pointer;
    accent-color:#16a34a;
}

.preview-card.dipilih{
    border:4px solid #16a34a;
}


/* =====================================================
   PREVIEW TUMPUK
===================================================== */

.preview-tumpuk{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
}

.preview-tumpuk-label{
    font-size:26px;
    font-weight:900;
    line-height:1;
    flex-shrink:0;
}

.preview-tumpuk-number{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:85px;
    padding:5px 13px 7px 13px;
    border:3px solid #000;
    border-radius:10px;
    background:#fff;
    font-size:58px;
    font-weight:1000;
    line-height:.82;
    letter-spacing:-2px;
    flex-shrink:0;
}


/* =====================================================
   PREVIEW TPK
===================================================== */

.preview-tpk{
    width:100%;
    font-size:32px;
    font-weight:1000;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:5px;
}


/* =====================================================
   PREVIEW QR
===================================================== */

.qr-row{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    margin-top:3px;
    margin-bottom:8px;
}

.qr-box{
    width:105px;
    height:105px;
    background:#fff;
    border:2px solid #000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-shrink:0;
    padding:3px;
}

.qr-box img,
.qr-box canvas{
    width:97px !important;
    height:97px !important;
    image-rendering:auto;
}


/* =====================================================
   PREVIEW BLOK
===================================================== */

.preview-blok{
    width:100%;
    font-size:29px;
    font-weight:1000;
    line-height:1;
    margin-bottom:5px;
}


/* =====================================================
   AREA PRINT
===================================================== */

#printArea{
    display:none;
}


/* =====================================================
   PRINT F4
   215.9 x 330.2 mm
   8 LABEL
   2 KOLOM x 4 BARIS
===================================================== */

@media print{

    @page{
        size:F4 portrait;
        margin:0;
    }

    html,
    body{
        margin:0 !important;
        padding:0 !important;
        width:215.9mm !important;
        min-width:215.9mm !important;
        background:#fff !important;
    }

    .panel,
    #hasil{
        display:none !important;
    }

    #printArea{
        display:block !important;
        width:215.9mm !important;
        margin:0 !important;
        padding:0 !important;
    }


    /* =================================================
       HALAMAN F4
    ================================================= */

    .print-page{
        width:215.9mm !important;
        height:330.2mm !important;

        display:grid !important;

        grid-template-columns:
            107.95mm 107.95mm;

        grid-template-rows:
            82.55mm
            82.55mm
            82.55mm
            82.55mm;

        margin:0 !important;
        padding:0 !important;

        overflow:hidden !important;

        box-sizing:border-box !important;

        break-after:page;
        page-break-after:always;
    }

    .print-page:last-child{
        break-after:auto !important;
        page-break-after:auto !important;
    }


    /* =================================================
       LABEL
    ================================================= */

    .print-label{
        width:107.95mm !important;
        height:82.55mm !important;

        box-sizing:border-box !important;

        background:#ffeb00 !important;

        border:1mm solid #000;

        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:flex-start;

        overflow:hidden;

        /*
           TOP DIPERKECIL
           SUPAYA ISI BISA LEBIH BESAR
        */

        padding:
            1.5mm
            3mm
            1mm
            3mm;

        margin:0 !important;
    }


    /* =================================================
       TUMPUK PRINT
       LEBIH BESAR
    ================================================= */

    .print-tumpuk{
        width:100%;

        display:flex;
        justify-content:center;
        align-items:center;

        gap:3mm;

        text-align:center;

        margin-bottom:1mm;

        line-height:1;

        white-space:nowrap;

        overflow:visible;

        flex-shrink:0;
    }

    .print-tumpuk-label{
        font-size:8mm;
        font-weight:900;
        line-height:.9;
        flex-shrink:0;
    }

    .print-tumpuk-number{
        display:inline-flex;

        align-items:center;
        justify-content:center;

        min-width:31mm;

        padding:
            2mm
            4mm
            2.5mm
            4mm;

        border:
            .7mm
            solid
            #000;

        border-radius:2.5mm;

        background:#fff;

        /*
           ANGKA TUMPUK DIBESARKAN
        */

        font-size:23mm;

        font-weight:1000;

        line-height:.78;

        letter-spacing:-.7mm;

        flex-shrink:0;
    }


    /* =================================================
       TPK
       SEDIKIT DIBESARKAN
    ================================================= */

    .print-tpk{
        width:100%;

        text-align:center;

        font-size:10mm;

        line-height:.9;

        font-weight:1000;

        white-space:nowrap;

        overflow:hidden;

        text-overflow:ellipsis;

        /*
           TIDAK LANGSUNG NEMPEL KE QR
        */

        margin-top:0;

        margin-bottom:3.5mm;

        flex-shrink:0;
    }


    /* =================================================
       QR
       TETAP 30 MM
       DITURUNKAN
    ================================================= */

    .print-qr-row{
        width:100%;

        display:flex;

        justify-content:center;

        align-items:center;

        /*
           TAMBAH JARAK DARI TPK
        */

        margin-top:0;

        margin-bottom:1.5mm;

        flex-shrink:0;
    }

    .print-qr{
        width:30mm;
        height:30mm;

        background:#fff;

        border:.5mm solid #000;

        display:flex;

        justify-content:center;

        align-items:center;

        padding:1mm;

        flex-shrink:0;
    }

    .print-qr img,
    .print-qr canvas{
        width:27.5mm !important;
        height:27.5mm !important;

        image-rendering:auto;
    }


    /* =================================================
       BLOK
       DIBESARKAN
       DAN DITURUNKAN
    ================================================= */

    .print-blok{
        width:100%;

        text-align:center;

        /*
           BLOK LEBIH BESAR
        */

        font-size:8mm;

        line-height:.9;

        font-weight:1000;

        /*
           Sedikit turun dari QR
        */

        margin-top:0.5mm;

        margin-bottom:0;

        flex-shrink:0;
    }


    /* =================================================
       LABEL KOSONG
    ================================================= */

    .print-empty{
        visibility:hidden !important;

        border-color:transparent !important;

        background:transparent !important;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    body{
        padding:10px;
    }

    .panel{
        padding:14px;
        border-radius:12px;
    }

    h1{
        font-size:23px;
        margin-bottom:20px;
    }

    #hasil{
        grid-template-columns:1fr;
    }

    .preview-card{
        padding:
            10px
            8px
            9px
            8px;
    }

    .pilih-cetak{
        font-size:17px;
        margin-bottom:8px;
    }

    .pilih-cetak input{
        width:23px;
        height:23px;
    }

    .preview-tumpuk{
        gap:7px;
        margin-bottom:8px;
    }

    .preview-tumpuk-label{
        font-size:25px;
    }

    .preview-tumpuk-number{
        min-width:92px;

        padding:
            5px
            14px
            7px
            14px;

        border:3px solid #000;

        border-radius:10px;

        font-size:62px;

        line-height:.80;

        letter-spacing:-2px;
    }

    .preview-tpk{
        font-size:34px;
        line-height:.95;
        margin-bottom:5px;
    }

    .qr-row{
        margin-top:3px;
        margin-bottom:8px;
    }

    .qr-box{
        width:100px;
        height:100px;
        padding:3px;
    }

    .qr-box img,
    .qr-box canvas{
        width:92px !important;
        height:92px !important;
    }

    .preview-blok{
        font-size:31px;
        line-height:.95;
        margin-bottom:5px;
    }

    button{
        width:100%;
    }

}

</style>

</head>

<body>


<div class="panel">

    <h1>CETAK QR TUMPUK</h1>


    <div class="filter-box">

        <label for="filterTumpuk">
            FILTER TUMPUK
        </label>

        <input
            type="text"
            id="filterTumpuk"
            placeholder="Contoh: 29"
            oninput="tampilkanData"
        >

    </div>


    <div class="button-area">

        <button
            class="btn-load"
            onclick="ambilDatabase()"
        >
            🔄 AMBIL DATA
        </button>

        <button
            class="btn-all"
            onclick="tampilkanSemua()"
        >
            📋 TAMPILKAN SEMUA
        </button>

        <button
            class="btn-print"
            onclick="cetakBarcode()"
        >
            🖨️ CETAK YANG DIPILIH
        </button>

    </div>


    <div id="status">
        Silakan ambil data tumpuk.
    </div>


    <div id="printInfo">
        0 TUMPUK DIPILIH — 0 LEMBAR F4
    </div>


    <div id="hasil"></div>

</div>


<div id="printArea"></div>


<script>


/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


let database = [];

let sedangMemuat = false;

let pilihanCetak = new Set();


const HALAMAN_TUMPUK_URL =
"https://ariefprastyo102-tech.github.io/scan-kayu/cek-tumpuk.html";


/* =====================================================
   LINK TUMPUK
===================================================== */

function buatLinkTumpuk(item){

    const tpk =
        String(item.tpk || "").trim();

    const tumpuk =
        String(item.tumpuk || "").trim();

    return (
        HALAMAN_TUMPUK_URL +
        "?tpk=" +
        encodeURIComponent(tpk) +
        "&tumpuk=" +
        encodeURIComponent(tumpuk)
    );
}


/* =====================================================
   ID PILIHAN
===================================================== */

function buatIdPilihan(item){

    const tpk =
        String(item.tpk || "").trim();

    const tumpuk =
        String(item.tumpuk || "").trim();

    return tpk + "|" + tumpuk;
}


/* =====================================================
   SORT TUMPUK
===================================================== */

function urutTumpuk(a,b){

    const numA =
        parseInt(a.tumpuk,10) || 0;

    const numB =
        parseInt(b.tumpuk,10) || 0;

    return numA - numB;
}


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    if(sedangMemuat)return;

    sedangMemuat = true;

    document.getElementById("status").textContent =
        "⏳ Mengambil data...";


    const callbackName =
        "jsonpCallback_" + Date.now();


    let script = null;


    window[callbackName] =
        function(response){

            try{

                if(
                    !response ||
                    response.status !== "success"
                ){

                    throw new Error(
                        response &&
                        response.message
                        ?
                        response.message
                        :
                        "Gagal mengambil data."
                    );

                }


                database =
                    Array.isArray(response.data)
                    ?
                    response.data
                    :
                    [];


                database.sort(urutTumpuk);


                document.getElementById("status").textContent =
                    "✅ " +
                    database.length +
                    " tumpukan berhasil diambil.";


                tampilkanData();


            }catch(error){

                console.error(error);

                document.getElementById("status").textContent =
                    "❌ " +
                    error.message;

            }finally{

                selesaiCallback(
                    callbackName,
                    script
                );

                sedangMemuat = false;

            }

        };


    script =
        document.createElement("script");


    script.src =
        API_URL +
        "?action=getTumpukList&callback=" +
        callbackName;


    script.onerror =
        function(){

            document.getElementById("status").textContent =
                "❌ Gagal menghubungi server.";


            selesaiCallback(
                callbackName,
                script
            );


            sedangMemuat = false;

        };


    document.body.appendChild(script);

}


/* =====================================================
   SELESAI CALLBACK
===================================================== */

function selesaiCallback(
    callbackName,
    script
){

    try{

        if(
            script &&
            script.parentNode
        ){

            script.parentNode.removeChild(script);

        }

    }catch(e){}


    try{

        delete window[callbackName];

    }catch(e){

        window[callbackName] = undefined;

    }

}


/* =====================================================
   UPDATE STATUS PILIHAN
===================================================== */

function updateStatusPilihan(){

    const jumlah =
        pilihanCetak.size;


    const jumlahLembar =
        jumlah > 0
        ?
        Math.ceil(jumlah / 8)
        :
        0;


    document.getElementById("printInfo").textContent =
        jumlah +
        " TUMPUK DIPILIH — " +
        jumlahLembar +
        " LEMBAR F4";


    const status =
        document.getElementById("status");


    if(jumlah > 0){

        status.textContent =
            "✅ " +
            jumlah +
            " TUMPUK siap dicetak.";

    }else{

        status.textContent =
            "Belum ada TUMPUK yang dipilih.";

    }

}


/* =====================================================
   UBAH PILIHAN
===================================================== */

function ubahPilihan(
    item,
    checked,
    card
){

    const id =
        buatIdPilihan(item);


    if(checked){

        pilihanCetak.add(id);

        card.classList.add("dipilih");

    }else{

        pilihanCetak.delete(id);

        card.classList.remove("dipilih");

    }


    updateStatusPilihan();

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(){

    const container =
        document.getElementById("hasil");


    container.innerHTML = "";


    const filter =
        document
        .getElementById("filterTumpuk")
        .value
        .trim()
        .toLowerCase();


    let data =
        database.filter(function(item){

            if(!filter)return true;


            /*
               FILTER TUMPUK HARUS PERSIS
               1 TIDAK AKAN MENAMPILKAN 11, 12, 13
            */

            return String(
                item.tumpuk || ""
            )
            .trim()
            .toLowerCase()
            === filter;

        });


    data.sort(urutTumpuk);


    if(data.length === 0){

        container.innerHTML =
            '<div style="grid-column:1/-1;text-align:center;padding:30px;font-weight:bold;">Data tidak ditemukan.</div>';

        return;

    }


    data.forEach(function(item){

        const card =
            document.createElement("div");


        card.className =
            "preview-card";


        const idPilihan =
            buatIdPilihan(item);


        const sudahDipilih =
            pilihanCetak.has(idPilihan);


        if(sudahDipilih){

            card.classList.add("dipilih");

        }


        /* =============================================
           CHECKBOX
        ============================================= */

        const pilihCetak =
            document.createElement("label");


        pilihCetak.className =
            "pilih-cetak";


        const checkbox =
            document.createElement("input");


        checkbox.type =
            "checkbox";


        checkbox.checked =
            sudahDipilih;


        const tulisan =
            document.createElement("span");


        tulisan.textContent =
            "PILIH CETAK";


        checkbox.addEventListener(
            "change",
            function(){

                ubahPilihan(
                    item,
                    checkbox.checked,
                    card
                );

            }
        );


        pilihCetak.appendChild(
            checkbox
        );

        pilihCetak.appendChild(
            tulisan
        );


        /* =============================================
           TUMPUK
        ============================================= */

        const tumpuk =
            document.createElement("div");


        tumpuk.className =
            "preview-tumpuk";


        const tumpukLabel =
            document.createElement("span");


        tumpukLabel.className =
            "preview-tumpuk-label";


        tumpukLabel.textContent =
            "TUMPUK";


        const tumpukNumber =
            document.createElement("span");


        tumpukNumber.className =
            "preview-tumpuk-number";


        tumpukNumber.textContent =
            item.tumpuk || "";


        tumpuk.appendChild(
            tumpukLabel
        );

        tumpuk.appendChild(
            tumpukNumber
        );


        /* =============================================
           TPK
        ============================================= */

        const tpk =
            document.createElement("div");


        tpk.className =
            "preview-tpk";


        tpk.textContent =
            "TPK " +
            (item.tpk || "");


        /* =============================================
           QR
        ============================================= */

        const qrRow =
            document.createElement("div");


        qrRow.className =
            "qr-row";


        const qrBox =
            document.createElement("div");


        qrBox.className =
            "qr-box";


        const qr =
            document.createElement("div");


        qrBox.appendChild(qr);

        qrRow.appendChild(qrBox);


        const qrLink =
            buatLinkTumpuk(item);


        setTimeout(function(){

            new QRCode(
                qr,
                {
                    text:qrLink,
                    width:97,
                    height:97,
                    correctLevel:
                        QRCode.CorrectLevel.M
                }
            );

        },0);


        /* =============================================
           BLOK
        ============================================= */

        const blok =
            document.createElement("div");


        blok.className =
            "preview-blok";


        blok.textContent =
            "BLOK " +
            (item.blok || "");


        /* =============================================
           APPEND
        ============================================= */

        card.appendChild(
            pilihCetak
        );

        card.appendChild(
            tumpuk
        );

        card.appendChild(
            tpk
        );

        card.appendChild(
            qrRow
        );

        card.appendChild(
            blok
        );


        container.appendChild(card);

    });


    updateStatusPilihan();

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document
    .getElementById("filterTumpuk")
    .value = "";


    tampilkanData();

}


/* =====================================================
   CETAK BARCODE
===================================================== */

function cetakBarcode(){

    let data =
        database.filter(function(item){

            const id =
                buatIdPilihan(item);

            return pilihanCetak.has(id);

        });


    data.sort(urutTumpuk);


    if(data.length === 0){

        alert(
            "Belum ada TUMPUK yang dipilih untuk dicetak."
        );

        return;

    }


    const printArea =
        document.getElementById("printArea");


    printArea.innerHTML = "";


    /*
       8 LABEL PER F4
    */

    const PER_LEMBAR = 8;


    for(
        let start = 0;
        start < data.length;
        start += PER_LEMBAR
    ){

        const page =
            document.createElement("div");


        page.className =
            "print-page";


        const pageData =
            data.slice(
                start,
                start + PER_LEMBAR
            );


        pageData.forEach(
            function(item){

                const label =
                    document.createElement("div");


                label.className =
                    "print-label";


                /* =====================================
                   TUMPUK
                ===================================== */

                const tumpuk =
                    document.createElement("div");


                tumpuk.className =
                    "print-tumpuk";


                const tumpukLabel =
                    document.createElement("span");


                tumpukLabel.className =
                    "print-tumpuk-label";


                tumpukLabel.textContent =
                    "TUMPUK";


                const tumpukNumber =
                    document.createElement("span");


                tumpukNumber.className =
                    "print-tumpuk-number";


                tumpukNumber.textContent =
                    item.tumpuk || "";


                tumpuk.appendChild(
                    tumpukLabel
                );

                tumpuk.appendChild(
                    tumpukNumber
                );


                /* =====================================
                   TPK
                ===================================== */

                const tpk =
                    document.createElement("div");


                tpk.className =
                    "print-tpk";


                tpk.textContent =
                    "TPK " +
                    (item.tpk || "");


                /* =====================================
                   QR
                ===================================== */

                const qrRow =
                    document.createElement("div");


                qrRow.className =
                    "print-qr-row";


                const qrBox =
                    document.createElement("div");


                qrBox.className =
                    "print-qr";


                const qr =
                    document.createElement("div");


                qrBox.appendChild(qr);

                qrRow.appendChild(qrBox);


                const qrLink =
                    buatLinkTumpuk(item);


                new QRCode(
                    qr,
                    {
                        text:qrLink,
                        width:275,
                        height:275,
                        correctLevel:
                            QRCode.CorrectLevel.M
                    }
                );


                /* =====================================
                   BLOK
                ===================================== */

                const blok =
                    document.createElement("div");


                blok.className =
                    "print-blok";


                blok.textContent =
                    "BLOK " +
                    (item.blok || "");


                /* =====================================
                   SUSUN LABEL
                ===================================== */

                label.appendChild(
                    tumpuk
                );

                label.appendChild(
                    tpk
                );

                label.appendChild(
                    qrRow
                );

                label.appendChild(
                    blok
                );


                page.appendChild(
                    label
                );

            }
        );


        /* =============================================
           ISI LABEL KOSONG
        ============================================= */

        while(
            page.children.length <
            PER_LEMBAR
        ){

            const empty =
                document.createElement("div");


            empty.className =
                "print-label print-empty";


            page.appendChild(
                empty
            );

        }


        printArea.appendChild(
            page
        );

    }


    const jumlahLembar =
        Math.ceil(
            data.length /
            PER_LEMBAR
        );


    document.getElementById(
        "printInfo"
    ).textContent =
        data.length +
        " TUMPUK DIPILIH — " +
        jumlahLembar +
        " LEMBAR F4";


    setTimeout(
        function(){

            window.print();

        },
        700
    );

}


/* =====================================================
   LOAD AWAL
===================================================== */

window.addEventListener(
    "load",
    function(){

        ambilDatabase();

    }
);

</script>

</body>

</html>
