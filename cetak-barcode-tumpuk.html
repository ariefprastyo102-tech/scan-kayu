<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CETAK QR TUMPUK</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

/* =====================================================
   DASAR
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background:#f2f2f2;
}

/* =====================================================
   PANEL
===================================================== */

.panel{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

h2{
    margin-top:0;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    font-size:18px;
    margin-bottom:10px;
}

button{
    padding:11px 16px;
    margin:4px;
    border:0;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.btn-data{
    background:#2196f3;
    color:white;
}

.btn-semua{
    background:#777;
    color:white;
}

.btn-cetak{
    background:#16a34a;
    color:white;
}

#status{
    margin-top:10px;
    font-weight:bold;
}

#printInfo{
    margin-top:5px;
    font-weight:bold;
}

/* =====================================================
   HASIL DATA
===================================================== */

#hasil{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:12px;
}

.card{
    border:2px solid #ddd;
    border-radius:10px;
    padding:15px;
    background:white;
    cursor:pointer;
    transition:.15s;
}

.card:hover{
    border-color:#2196f3;
}

.card.dipilih{
    border-color:#16a34a;
    background:#ecfdf5;
}

.card-tumpuk{
    font-size:28px;
    font-weight:bold;
}

.card-tpk{
    margin-top:5px;
    font-size:18px;
}

.card-blok{
    margin-top:5px;
    font-weight:bold;
}

/* =====================================================
   AREA PRINT
===================================================== */

#printArea{
    display:none;
}

/* =====================================================
   PRINT F4
   8 LABEL / LEMBAR
   2 KOLOM x 4 BARIS
===================================================== */

.print-page{

    width:215.9mm;
    height:330.2mm;

    display:grid;

    grid-template-columns:107.95mm 107.95mm;
    grid-template-rows:repeat(4,82.55mm);

    padding:0;
    margin:0;

    page-break-after:always;
    break-after:page;

    overflow:hidden;
}

.print-page:last-child{
    page-break-after:auto;
    break-after:auto;
}

/* =====================================================
   LABEL
===================================================== */

.print-label{

    width:107.95mm;
    height:82.55mm;

    border:1px solid #000;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:flex-start;

    overflow:hidden;

    padding:4mm 4mm 3mm 4mm;

    background:white;
}

.print-tumpuk{

    font-size:34pt;
    line-height:1;

    font-weight:900;

    margin-top:1mm;
    margin-bottom:2mm;
}

.print-tpk{

    font-size:20pt;
    line-height:1;

    font-weight:900;

    margin-bottom:2mm;
}

.print-qr{

    width:50mm;
    height:50mm;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-top:1mm;
}

.print-qr img,
.print-qr canvas{

    width:48mm !important;
    height:48mm !important;
}

.print-blok{

    font-size:18pt;
    line-height:1;

    font-weight:900;

    margin-top:2mm;
}

/* =====================================================
   PRINT
===================================================== */

@media print{

    @page{
        size:F4 portrait;
        margin:0;
    }

    html,
    body{

        margin:0 !important;
        padding:0 !important;

        width:215.9mm !important;
        height:330.2mm !important;

        background:white !important;
    }

    /* PENTING:
       PANEL BENAR-BENAR DIHILANGKAN DARI LAYOUT
       AGAR TIDAK MEMBUAT HALAMAN KOSONG */
    .panel{
        display:none !important;
    }

    #printArea{

        display:block !important;

        width:215.9mm !important;
        margin:0 !important;
        padding:0 !important;
    }

    .print-page{

        width:215.9mm !important;
        height:330.2mm !important;

        display:grid !important;

        grid-template-columns:107.95mm 107.95mm !important;
        grid-template-rows:repeat(4,82.55mm) !important;

        margin:0 !important;
        padding:0 !important;

        page-break-after:always;
        break-after:page;

        overflow:hidden !important;
    }

    .print-page:last-child{

        page-break-after:auto;
        break-after:auto;
    }

    .print-label{

        width:107.95mm !important;
        height:82.55mm !important;

        border:1px solid #000 !important;

        overflow:hidden !important;

        break-inside:avoid;
        page-break-inside:avoid;
    }

}

/* =====================================================
   SEMBUNYIKAN AREA PRINT DI LAYAR
===================================================== */

@media screen{

    #printArea{
        display:none;
    }

}

</style>

</head>

<body>

<div class="panel">

    <h2>CETAK QR TUMPUK</h2>

    <input
        type="text"
        id="filterTumpuk"
        placeholder="SEARCH NOMOR TUMPUK..."
        autocomplete="off"
    >

    <div>

        <button
            class="btn-data"
            onclick="ambilDatabase()">
            AMBIL DATA
        </button>

        <button
            class="btn-semua"
            onclick="tampilkanSemua()">
            TAMPILKAN SEMUA
        </button>

        <button
            class="btn-cetak"
            onclick="cetakBarcode()">
            CETAK YANG DIPILIH
        </button>

    </div>

    <div id="status">
        Belum mengambil data.
    </div>

    <div id="printInfo"></div>

    <div id="hasil"></div>

</div>


<div id="printArea"></div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


/* =====================================================
   HALAMAN CEK TUMPUK
===================================================== */

const HALAMAN_TUMPUK_URL =
"https://ariefprastyo102-tech.github.io/scan-kayu/cek-tumpuk.html";


/* =====================================================
   DATABASE
===================================================== */

let database = [];

let pilihanCetak = new Set();


/* =====================================================
   8 LABEL / 1 LEMBAR
===================================================== */

const PER_LEMBAR = 8;


/* =====================================================
   ID PILIHAN
===================================================== */

function buatIdPilihan(item){

    return String(item.tpk || "").trim()
        + "|"
        + String(item.tumpuk || "").trim();

}


/* =====================================================
   LINK QR
===================================================== */

function buatLinkTumpuk(item){

    const tpk =
        String(item.tpk || "").trim();

    const tumpuk =
        String(item.tumpuk || "").trim();

    return HALAMAN_TUMPUK_URL
        + "?tpk="
        + encodeURIComponent(tpk)
        + "&tumpuk="
        + encodeURIComponent(tumpuk);

}


/* =====================================================
   SORT TUMPUK
===================================================== */

function urutTumpuk(a,b){

    const aa =
        parseInt(a.tumpuk,10) || 0;

    const bb =
        parseInt(b.tumpuk,10) || 0;

    return aa - bb;

}


/* =====================================================
   AMBIL DATABASE
===================================================== */

function ambilDatabase(){

    document.getElementById("status").innerText =
        "Mengambil data...";

    const callbackName =
        "jsonpTumpuk_" + Date.now();

    window[callbackName] = function(data){

        try{

            if(!Array.isArray(data)){

                throw new Error(
                    "Data backend bukan array."
                );

            }

            database =
                data.slice().sort(urutTumpuk);

            tampilkanData();

            document.getElementById("status").innerText =
                "Data berhasil diambil: "
                + database.length
                + " data.";

        }
        catch(err){

            console.error(err);

            document.getElementById("status").innerText =
                "ERROR: " + err.message;

        }

        delete window[callbackName];

        script.remove();

    };

    const script =
        document.createElement("script");

    script.src =
        API_URL
        + "?action=getTumpukList"
        + "&callback="
        + callbackName;

    script.onerror = function(){

        document.getElementById("status").innerText =
            "Gagal mengambil database.";

        delete window[callbackName];

        script.remove();

    };

    document.body.appendChild(script);

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(){

    const container =
        document.getElementById("hasil");

    container.innerHTML = "";

    const filter =
        document.getElementById("filterTumpuk")
            .value
            .trim()
            .toLowerCase();


    const dataTampil =
        database.filter(item => {

            if(!filter){
                return true;
            }

            /* EXACT MATCH
               1 TIDAK AKAN MATCH 11 / 12 / 100 */
            return String(item.tumpuk || "")
                .trim()
                .toLowerCase()
                === filter;

        });


    dataTampil.forEach(item => {

        const id =
            buatIdPilihan(item);

        const card =
            document.createElement("div");

        card.className =
            "card"
            + (
                pilihanCetak.has(id)
                ? " dipilih"
                : ""
            );

        card.onclick = function(){

            ubahPilihan(
                item,
                card
            );

        };


        const tumpuk =
            document.createElement("div");

        tumpuk.className =
            "card-tumpuk";

        tumpuk.innerText =
            "TUMPUK " + (item.tumpuk || "-");


        const tpk =
            document.createElement("div");

        tpk.className =
            "card-tpk";

        tpk.innerText =
            "TPK: " + (item.tpk || "-");


        const blok =
            document.createElement("div");

        blok.className =
            "card-blok";

        blok.innerText =
            "BLOK: " + (item.blok || "-");


        card.appendChild(tumpuk);
        card.appendChild(tpk);
        card.appendChild(blok);

        container.appendChild(card);

    });


    updateStatusPilihan();

}


/* =====================================================
   PILIH / BATAL PILIH
===================================================== */

function ubahPilihan(item, card){

    const id =
        buatIdPilihan(item);

    if(pilihanCetak.has(id)){

        pilihanCetak.delete(id);

        card.classList.remove(
            "dipilih"
        );

    }
    else{

        pilihanCetak.add(id);

        card.classList.add(
            "dipilih"
        );

    }

    updateStatusPilihan();

}


/* =====================================================
   STATUS PILIHAN
===================================================== */

function updateStatusPilihan(){

    const jumlah =
        pilihanCetak.size;

    const jumlahLembar =
        jumlah > 0
        ? Math.ceil(
            jumlah / PER_LEMBAR
        )
        : 0;

    document.getElementById(
        "printInfo"
    ).innerText =
        "Dipilih: "
        + jumlah
        + " label | "
        + jumlahLembar
        + " lembar F4";

}


/* =====================================================
   TAMPILKAN SEMUA
===================================================== */

function tampilkanSemua(){

    document.getElementById(
        "filterTumpuk"
    ).value = "";

    tampilkanData();

}


/* =====================================================
   FILTER LIVE
===================================================== */

document.getElementById(
    "filterTumpuk"
).addEventListener(
    "input",
    tampilkanData
);


/* =====================================================
   CETAK
===================================================== */

function cetakBarcode(){

    const data =
        database
            .filter(item =>
                pilihanCetak.has(
                    buatIdPilihan(item)
                )
            )
            .sort(urutTumpuk);


    if(data.length === 0){

        alert(
            "Pilih minimal 1 label terlebih dahulu."
        );

        return;

    }


    const printArea =
        document.getElementById(
            "printArea"
        );

    printArea.innerHTML = "";


    /* =================================================
       BAGI DATA PER 8 LABEL
       1 - 8   = 1 LEMBAR
       9 - 16  = 2 LEMBAR
       dst.
    ================================================= */

    for(
        let start = 0;
        start < data.length;
        start += PER_LEMBAR
    ){

        const page =
            document.createElement("div");

        page.className =
            "print-page";


        const potongan =
            data.slice(
                start,
                start + PER_LEMBAR
            );


        potongan.forEach(item => {

            const label =
                document.createElement("div");

            label.className =
                "print-label";


            /* TUMPUK */

            const tumpuk =
                document.createElement("div");

            tumpuk.className =
                "print-tumpuk";

            tumpuk.innerText =
                "TUMPUK "
                + (item.tumpuk || "-");


            /* TPK */

            const tpk =
                document.createElement("div");

            tpk.className =
                "print-tpk";

            tpk.innerText =
                "TPK "
                + (item.tpk || "-");


            /* QR */

            const qrBox =
                document.createElement("div");

            qrBox.className =
                "print-qr";


            /* BLOK */

            const blok =
                document.createElement("div");

            blok.className =
                "print-blok";

            blok.innerText =
                "BLOK "
                + (item.blok || "-");


            label.appendChild(
                tumpuk
            );

            label.appendChild(
                tpk
            );

            label.appendChild(
                qrBox
            );

            label.appendChild(
                blok
            );


            page.appendChild(
                label
            );


            /* QR dibuat setelah element masuk DOM */

            new QRCode(
                qrBox,
                {
                    text:
                        buatLinkTumpuk(item),

                    width:180,
                    height:180,

                    correctLevel:
                        QRCode.CorrectLevel.M
                }
            );

        });


        printArea.appendChild(
            page
        );

    }


    document.getElementById(
        "printInfo"
    ).innerText =
        "Mencetak "
        + data.length
        + " label | "
        + Math.ceil(
            data.length / PER_LEMBAR
        )
        + " lembar F4";


    /* Beri waktu QR selesai render */

    setTimeout(
        function(){

            window.print();

        },
        700
    );

}


/* =====================================================
   LOAD AWAL
===================================================== */

</script>

</body>

</html>
