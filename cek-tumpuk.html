<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CEK TUMPUK</title>

<script src="https://unpkg.com/html5-qrcode"
crossorigin="anonymous"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:#f1f5f9;
    font-family:Arial,Helvetica,sans-serif;
    color:#0f172a;
}

.container{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:16px;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    background:#0f172a;
    color:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.header-title{
    font-size:25px;
    font-weight:800;
    margin:0;
}

.header-sub{
    font-size:13px;
    opacity:.75;
    margin-top:5px;
}

/* =====================================================
   SCANNER
===================================================== */

.scanner-box{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

#reader{
    width:100%;
    overflow:hidden;
    border-radius:14px;
}

/*
   =====================================================
   TAMPILAN KAMERA
   =====================================================

   Kamera dibuat 16:9 supaya proporsional.
   Jangan dipaksa menjadi 2.5 atau rasio aneh.
*/

#reader__scan_region{
    width:100% !important;
    min-height:0 !important;
}

#reader video{
    width:100% !important;
    height:auto !important;
    aspect-ratio:16 / 9 !important;
    object-fit:cover !important;
    display:block !important;
}

/*
   Area scan CODE 128:
   LEBAR dan BESAR.

   Bukan kotak kecil.
*/

#qr-shaded-region{
    border-radius:12px !important;
}

/* Dashboard scanner */

#reader__dashboard{
    padding-top:8px;
}

#reader__dashboard_section{
    margin-top:5px;
}

#reader__dashboard_section_csr{
    margin-top:5px;
}

.scan-status{
    text-align:center;
    font-size:13px;
    margin-top:10px;
    color:#64748b;
}

.manual-box{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.manual-box input{
    flex:1;
    min-width:0;
    height:46px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    padding:0 12px;
    font-size:16px;
    outline:none;
}

.manual-box input:focus{
    border-color:#2563eb;
}

button{
    border:0;
    cursor:pointer;
    font-family:inherit;
}

.btn{
    min-height:44px;
    border-radius:10px;
    padding:0 16px;
    font-size:14px;
    font-weight:700;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-secondary{
    background:#e2e8f0;
    color:#0f172a;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.scan-buttons{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.scan-buttons .btn{
    flex:1;
}

/* =====================================================
   LOADING
===================================================== */

.loading{
    display:none;
    background:white;
    border-radius:15px;
    padding:18px;
    text-align:center;
    margin-bottom:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.07);
}

.loading.show{
    display:block;
}

.spinner{
    width:28px;
    height:28px;
    border:3px solid #cbd5e1;
    border-top-color:#2563eb;
    border-radius:50%;
    margin:0 auto 10px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =====================================================
   ERROR
===================================================== */

.error-box{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
    border-radius:14px;
    padding:14px;
    margin-bottom:15px;
    font-size:14px;
    line-height:1.5;
}

.error-box.show{
    display:block;
}

/* =====================================================
   HASIL
===================================================== */

.result{
    display:none;
}

.result.show{
    display:block;
}

.stack-card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.09);
}

/* =====================================================
   JUDUL
===================================================== */

.stack-title{
    text-align:center;
    margin-bottom:15px;
}

.stack-title .tumpuk{
    font-size:30px;
    font-weight:900;
    text-transform:uppercase;
}

.stack-title .tpk{
    margin-top:5px;
    font-size:14px;
    color:#64748b;
    font-weight:700;
}

/* =====================================================
   JUMLAH BATANG
===================================================== */

.main-number{
    background:#eff6ff;
    border:2px solid #bfdbfe;
    border-radius:18px;
    padding:20px;
    text-align:center;
    margin-bottom:12px;
}

.main-number .label{
    font-size:13px;
    font-weight:800;
    color:#2563eb;
    letter-spacing:.5px;
}

.main-number .value{
    margin-top:6px;
    font-size:42px;
    line-height:1;
    font-weight:900;
    color:#0f172a;
}

.main-number .unit{
    margin-top:6px;
    font-size:14px;
    color:#64748b;
    font-weight:700;
}

/* =====================================================
   INFO
===================================================== */

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.info-box{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:13px;
    padding:13px;
}

.info-box .label{
    font-size:11px;
    color:#64748b;
    font-weight:700;
    text-transform:uppercase;
}

.info-box .value{
    margin-top:4px;
    font-size:20px;
    font-weight:900;
}

/* =====================================================
   RINCIAN TPK
   KHUSUS TUMPUK 29
===================================================== */

.tpk-detail-box{
    display:none;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:15px;
    padding:14px;
    margin-bottom:15px;
}

.tpk-detail-box.show{
    display:block;
}

.tpk-detail-title{
    font-size:16px;
    font-weight:900;
    margin-bottom:10px;
}

.tpk-detail-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.tpk-detail-item{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:11px;
    padding:11px 12px;
}

.tpk-detail-name{
    font-size:14px;
    font-weight:900;
}

.tpk-detail-info{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:5px;
    font-size:13px;
    color:#475569;
    font-weight:700;
}

.tpk-detail-volume{
    text-align:right;
}

/* =====================================================
   SECTION
===================================================== */

.section{
    margin-top:18px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:18px;
    font-weight:900;
    margin-bottom:10px;
}

.section-count{
    font-size:12px;
    background:#e2e8f0;
    padding:5px 9px;
    border-radius:20px;
    color:#475569;
}

/* =====================================================
   REGISTER
===================================================== */

.register-list{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.register-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:11px;
    padding:11px 12px;
    transition:.15s;
}

.register-item input{
    width:20px;
    height:20px;
    accent-color:#2563eb;
    cursor:pointer;
    flex-shrink:0;
}

.register-number{
    font-family:monospace;
    font-size:16px;
    font-weight:800;
    flex:1;
}

.register-item.checked{
    background:#f0fdf4;
    border-color:#bbf7d0;
}

.register-item.checked .register-number{
    color:#15803d;
}

.check-status{
    font-size:11px;
    font-weight:800;
    color:#16a34a;
    white-space:nowrap;
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
    text-align:center;
    padding:20px;
    color:#64748b;
    background:#f8fafc;
    border-radius:12px;
    font-size:14px;
}

/* =====================================================
   HISTORY
===================================================== */

.history-list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.history-item{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:13px;
    overflow:hidden;
}

.history-head{
    padding:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    cursor:pointer;
}

.history-date{
    font-size:15px;
    font-weight:900;
}

.history-taken{
    font-size:13px;
    color:#dc2626;
    font-weight:800;
    margin-top:3px;
}

.history-arrow{
    font-size:18px;
    color:#64748b;
    transition:.2s;
}

.history-item.open .history-arrow{
    transform:rotate(180deg);
}

.history-detail{
    display:none;
    padding:0 14px 14px;
    border-top:1px solid #e2e8f0;
}

.history-item.open .history-detail{
    display:block;
}

.detail-title{
    font-size:12px;
    color:#64748b;
    font-weight:700;
    margin:12px 0 8px;
}

.detail-register{
    display:block;
    font-family:monospace;
    font-size:15px;
    font-weight:800;
    padding:7px 0;
    border-bottom:1px dashed #cbd5e1;
}

.detail-register:last-child{
    border-bottom:0;
}

/* =====================================================
   BOTTOM BUTTON
===================================================== */

.bottom-buttons{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.bottom-buttons .btn{
    flex:1;
}

/* =====================================================
   FOOTER
===================================================== */

.footer{
    text-align:center;
    font-size:11px;
    color:#94a3b8;
    padding:5px 0 20px;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:420px){

    .container{
        padding:10px;
    }

    .header{
        padding:16px;
    }

    .header-title{
        font-size:22px;
    }

    .stack-title .tumpuk{
        font-size:27px;
    }

    .main-number .value{
        font-size:38px;
    }

    .info-grid{
        grid-template-columns:1fr 1fr;
    }

    .tpk-detail-info{
        flex-direction:column;
        gap:3px;
    }

    .tpk-detail-volume{
        text-align:left;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- =================================================
         HEADER
    ================================================= -->

    <div class="header">

        <div class="header-title">
            CEK TUMPUK
        </div>

        <div class="header-sub">
            Scan barcode tumpuk untuk melihat data terbaru
        </div>

    </div>


    <!-- =================================================
         SCANNER
    ================================================= -->

    <div class="scanner-box">

        <div id="reader"></div>

        <div class="scan-status"
             id="scanStatus">
            Arahkan barcode CODE 128 ke area scan
        </div>


        <!-- =============================================
             SEARCH TUMPUK
        ============================================== -->

        <div class="manual-box">

            <input
                type="search"
                id="manualInput"
                placeholder="Ketik nomor TUMPUK..."
                autocomplete="off"
                inputmode="numeric">

            <button
                class="btn btn-primary"

                CARI

            </button>

        </div>


        <div class="scan-buttons">

                class="btn btn-secondary"

            </button>

            <button

    </div>


    <!-- =================================================
         LOADING
    ================================================= -->

    <div
        class="loading"
        id="loading">

        <div class="spinner"></div>

        <b>Mengambil data terbaru...</b>

    </div>


    <!-- =================================================
         ERROR
    ================================================= -->

    <div
        class="error-box"
        id="errorBox">
    </div>


    <!-- =================================================
         HASIL
    ================================================= -->

    <div
        class="result"
        id="result">

        <div class="stack-card">

            <!-- =========================================
                 JUDUL
            ========================================= -->

            <div class="stack-title">

                <div
                    class="tumpuk"
                    id="tumpukTitle">
                    TUMPUK
                </div>

                <div
                    class="tpk"
                    id="tpkTitle">
                    TPK ASAL :
                </div>

            </div>


            <!-- =========================================
                 JUMLAH BATANG
            ========================================= -->

            <div class="main-number">

                <div class="label">
                    JUMLAH BATANG
                </div>

                <div
                    class="value"
                    id="jumlahAwal">
                    0
                </div>

                <div class="unit">
                    BATANG
                </div>

            </div>


            <!-- =========================================
                 VOLUME + JUMLAH CEK
            ========================================= -->

            <div class="info-grid">

                <div class="info-box">

                    <div class="label">
                        Volume
                    </div>

                    <div
                        class="value"
                        id="volumeAwal">
                        0 m³
                    </div>

                </div>


                <div class="info-box">

                    <div class="label">
                        Jumlah Cek
                    </div>

                    <div
                        class="value"
                        id="jumlahCek">
                        0
                    </div>

                </div>

            </div>


            <!-- =========================================
                 RINCIAN TPK
                 KHUSUS TUMPUK 29
            ========================================= -->

            <div
                class="tpk-detail-box"
                id="tpkDetailBox">

                <div class="tpk-detail-title">
                    RINCIAN TPK
                </div>

                <div
                    class="tpk-detail-list"
                    id="tpkDetailList">
                </div>

            </div>


            <!-- =========================================
                 REGISTER
            ========================================= -->

            <div class="section">

                <div class="section-title">

                    <span>
                        DAFTAR REGISTER
                    </span>

                    <span
                        class="section-count"
                        id="registerBadge">
                        0 REGISTER
                    </span>

                </div>

                <div
                    class="register-list"
                    id="registerList">
                </div>

            </div>


            <!-- =========================================
                 HISTORY
            ========================================= -->

            <div class="section">

                <div class="section-title">

                    <span>
                        HISTORY PENGAMBILAN
                    </span>

                    <span
                        class="section-count"
                        id="historyBadge">
                        0
                    </span>

                </div>

                <div
                    class="history-list"
                    id="historyList">
                </div>

            </div>

        </div>


        <!-- =============================================
             BUTTON
        ============================================= -->

        <div class="bottom-buttons">

            <button
                class="btn btn-primary"
                onclick="refreshData()">

                REFRESH DATA

            </button>

            <button
                class="btn btn-secondary"
                onclick="kembaliScan()">

                KEMBALI SCAN

            </button>

        </div>

    </div>


    <div class="footer">
        Sistem CEK TUMPUK
    </div>

</div>


<script>

/* =====================================================
   KONFIGURASI BACKEND
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


/* =====================================================
   VARIABEL
===================================================== */

let html5QrCode = null;

let scannerRunning = false;

let currentTPK = "";

let currentTumpuk = "";

let currentStackId = "";

let currentRegisters = [];


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        mulaiScanner();

        document
            .getElementById("manualInput")
            .addEventListener(
                "keydown",
                function(e){

                    if(e.key === "Enter"){
                        prosesManual();
                    }

                }
            );

    }
);


/* =====================================================
   START SCANNER
   KHUSUS CODE 128
===================================================== */

async function mulaiScanner(){

    hideError();

    if(scannerRunning){
        return;
    }

    const reader =
        document.getElementById("reader");

    reader.innerHTML = "";


    /*
       =================================================
       CODE 128
       =================================================

       Scanner dibatasi ke CODE 128.

       Ini penting karena barcode kita
       bukan QR Code.
    */

    html5QrCode =
        new Html5Qrcode(
            "reader",
            {
                formatsToSupport:[
                    Html5QrcodeSupportedFormats.CODE_128
                ]
            }
        );


    /*
       =================================================
       KONFIGURASI KAMERA
       =================================================

       Kamera:
       16:9

       Area scan:
       92% lebar kamera
       55% tinggi kamera

       Jadi area scan TIDAK KECIL.
       Tetap besar tetapi horizontal.
    */

    const config = {

        fps:10,

        aspectRatio:16 / 9,

        qrbox:function(
            width,
            height
        ){

            const scanWidth =
                Math.floor(
                    width * 0.92
                );


            const scanHeight =
                Math.floor(
                    height * 0.55
                );


            return {
                width:scanWidth,
                height:scanHeight
            };

        }

    };


    try{

        await html5QrCode.start(

            {
                facingMode:"environment"
            },

            config,

            function(decodedText){

                hasilScan(decodedText);

            },

            function(errorMessage){

                // Abaikan error frame scan

            }

        );


        scannerRunning = true;


        document
            .getElementById("scanStatus")
            .textContent =
            "Arahkan barcode CODE 128 ke area scan";


    }
    catch(error){

        console.error(error);


        document
            .getElementById("scanStatus")
            .textContent =
            "Kamera tidak dapat digunakan. Gunakan pencarian TUMPUK.";

    }

}


/* =====================================================
   STOP SCANNER
===================================================== */

async function stopScanner(){

    if(
        html5QrCode &&
        scannerRunning
    ){

        try{

            await html5QrCode.stop();

        }
        catch(error){

            console.log(error);

        }

        scannerRunning = false;

    }

}


/* =====================================================
   HASIL SCAN
===================================================== */

function hasilScan(decodedText){

    if(!decodedText){
        return;
    }


    decodedText =
        decodedText.trim();


    console.log(
        "BARCODE TUMPUK:",
        decodedText
    );


    stopScanner();


    prosesKodeTumpuk(
        decodedText
    );

}


/* =====================================================
   SEARCH MANUAL
   CUKUP NOMOR TUMPUK
===================================================== */

function prosesManual(){

    hideError();


    let nomor =
        document
        .getElementById("manualInput")
        .value
        .trim();


    if(!nomor){

        showError(
            "Masukkan nomor TUMPUK."
        );

        return;

    }


    /*
       Kalau user memasukkan:

       29

       langsung cari TUMPUK 29.

       Kalau ternyata user memasukkan
       barcode lengkap seperti:

       SARADAN|29

       tetap kita dukung.
    */

    if(
        nomor.indexOf("|") !== -1
    ){

        prosesKodeTumpuk(
            nomor
        );

        return;

    }


    /*
       Bersihkan kalau user mengetik:

       TUMPUK 29
       TUMPUK29
       T29
    */

    nomor =
        nomor
        .replace(
            /TUMPUK/gi,
            ""
        )
        .replace(
            /^T/i,
            ""
        )
        .trim();


    if(!nomor){

        showError(
            "Nomor TUMPUK tidak ditemukan."
        );

        return;

    }


    cariTumpukDenganNomor(
        nomor
    );

}


/* =====================================================
   CARI NOMOR TUMPUK DARI DATABASE
===================================================== */

function cariTumpukDenganNomor(
    nomor
){

    showLoading();


    const callbackName =
        "callbackList_" +
        Date.now();


    let script = null;

    let timeoutId = null;


    window[callbackName] =
        function(response){

            try{

                hideLoading();


                if(
                    !response ||
                    response.success !== true
                ){

                    showError(
                        response &&
                        response.message
                        ?
                        response.message
                        :
                        "Data TUMPUK tidak ditemukan."
                    );

                    return;

                }


                const list =
                    Array.isArray(
                        response.data
                    )
                    ?
                    response.data
                    :
                    [];


                const target =
                    String(nomor)
                    .trim();


                const ditemukan =
                    list.find(
                        function(item){

                            return (
                                String(
                                    item.tumpuk
                                ).trim()
                                ===
                                target
                            );

                        }
                    );


                if(!ditemukan){

                    showError(
                        "TUMPUK <b>" +
                        escapeHtml(target) +
                        "</b> tidak ditemukan."
                    );

                    return;

                }


                currentTumpuk =
                    target;


                if(
                    target === "29"
                ){

                    currentTPK = "";

                }
                else{

                    currentTPK =
                        String(
                            ditemukan.tpk || ""
                        )
                        .split(",")[0]
                        .trim();

                }


                currentStackId =
                    ditemukan.stackId || "";


                ambilDataTumpuk();


            }
            catch(error){

                console.error(error);

                hideLoading();

                showError(
                    "Terjadi kesalahan saat mencari TUMPUK."
                );

            }


            if(timeoutId){
                clearTimeout(timeoutId);
            }


            cleanupJSONP(
                callbackName,
                script
            );

        };


    const url =
        API_URL +
        "?action=getTumpukList" +
        "&callback=" +
        callbackName +
        "&_=" +
        Date.now();


    script =
        document.createElement("script");


    script.src =
        url;


    script.onerror =
        function(){

            if(timeoutId){
                clearTimeout(timeoutId);
            }


            hideLoading();


            showError(
                "Gagal mengambil daftar TUMPUK."
            );


            cleanupJSONP(
                callbackName,
                script
            );

        };


    document
        .body
        .appendChild(script);


    timeoutId =
        setTimeout(
            function(){

                if(
                    document.body.contains(
                        script
                    )
                ){

                    cleanupJSONP(
                        callbackName,
                        script
                    );


                    hideLoading();


                    showError(
                        "Waktu pencarian habis. Coba lagi."
                    );

                }

            },
            15000
        );

}


/* =====================================================
   PARSE BARCODE
===================================================== */

function prosesKodeTumpuk(kode){

    hideError();


    kode =
        kode.trim();


    let parts =
        kode.split("|");


    /*
       FORMAT:

       SARADAN|10
    */

    if(parts.length >= 2){

        currentTPK =
            parts[0]
            .trim();


        currentTumpuk =
            parts
            .slice(1)
            .join("|")
            .trim();

    }


    else{

        /*
           FORMAT:

           SARADAN-T10
        */

        const match =
            kode.match(
                /^(.+)-T(\d+)$/i
            );


        if(match){

            currentTPK =
                match[1]
                .trim();


            currentTumpuk =
                match[2]
                .trim();

        }


        else{

            /*
               Kalau barcode hanya berisi
               nomor TUMPUK:

               29
            */

            if(
                /^\d+$/.test(kode)
            ){

                cariTumpukDenganNomor(
                    kode
                );

                return;

            }


            showError(
                "Format barcode TUMPUK tidak dikenali."
            );

            return;

        }

    }


    if(
        !currentTumpuk
    ){

        showError(
            "Nomor TUMPUK tidak terbaca."
        );

        return;

    }


    /*
       TUMPUK 29 adalah SATU TUMPUK.
    */

    if(
        String(currentTumpuk) === "29"
    ){

        currentStackId =
            "TUMPUK|29";

    }
    else{

        currentStackId =
            currentTPK +
            "|" +
            currentTumpuk;

    }


    ambilDataTumpuk();

}


/* =====================================================
   AMBIL DATA TUMPUK
===================================================== */

function ambilDataTumpuk(){

    showLoading();


    const callbackName =
        "callbackTumpuk_" +
        Date.now();


    let timeoutId = null;

    let script = null;


    window[callbackName] =
        function(response){

            try{

                hideLoading();


                if(
                    !response ||
                    response.success !== true
                ){

                    showError(
                        response &&
                        response.message
                        ?
                        response.message
                        :
                        "Data TUMPUK tidak ditemukan."
                    );

                    return;

                }


                if(
                    !response.data ||
                    typeof response.data !== "object"
                ){

                    showError(
                        "Format data TUMPUK tidak sesuai."
                    );

                    return;

                }


                tampilkanData(
                    response.data
                );

            }
            catch(error){

                console.error(error);

                showError(
                    "Terjadi kesalahan saat menampilkan data."
                );

            }


            if(timeoutId){
                clearTimeout(timeoutId);
            }


            cleanupJSONP(
                callbackName,
                script
            );

        };


    const url =
        API_URL +
        "?action=getTumpukData" +
        "&tpk=" +
        encodeURIComponent(
            currentTPK
        ) +
        "&tumpuk=" +
        encodeURIComponent(
            currentTumpuk
        ) +
        "&callback=" +
        callbackName +
        "&_=" +
        Date.now();


    script =
        document.createElement("script");


    script.src =
        url;


    script.onerror =
        function(){

            if(timeoutId){
                clearTimeout(timeoutId);
            }


            hideLoading();


            showError(
                "Gagal menghubungi backend CEK TUMPUK."
            );


            cleanupJSONP(
                callbackName,
                script
            );

        };


    document
        .body
        .appendChild(script);


    timeoutId =
        setTimeout(
            function(){

                if(
                    document.body.contains(script)
                ){

                    cleanupJSONP(
                        callbackName,
                        script
                    );


                    hideLoading();


                    showError(
                        "Waktu koneksi habis. Coba lagi."
                    );

                }

            },
            15000
        );

}

){

/* =====================================================
   CHECKBOX PER REGISTER
===================================================== */

function setCheckbox(
    register,
    checked,
    wrapper,
    status
){

    const checkbox =
        wrapper.querySelector(
            'input[type="checkbox"]'
        );


    const previousChecked =
        !checked;


    if(checked){

        wrapper.classList.add(
            "checked"
        );

    }
    else{

        wrapper.classList.remove(
            "checked"
        );

    }


    status.textContent =
        "MENYIMPAN...";


    let stackId =
        currentStackId;


    if(!stackId){

        stackId =
            String(currentTumpuk) === "29"
            ?
            "TUMPUK|29"
            :
            currentTPK +
            "|" +
            currentTumpuk;

    }


    const callbackName =
        "callbackCek_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random()*1000
        );


    let script = null;

    let timeoutId = null;


    window[callbackName] =
        function(data){

            if(timeoutId){
                clearTimeout(timeoutId);
            }


            if(
                data &&
                data.success === true
            ){

                status.textContent =
                    checked
                    ?
                    "SUDAH DICEK"
                    :
                    "";


                if(checked){

                    wrapper.classList.add(
                        "checked"
                    );

                }
                else{

                    wrapper.classList.remove(
                        "checked"
                    );

                }

            }
            else{

                status.textContent =
                    "GAGAL";


                checkbox.checked =
                    previousChecked;


                if(previousChecked){

                    wrapper.classList.add(
                        "checked"
                    );

                }
                else{

                    wrapper.classList.remove(
                        "checked"
                    );

                }

            }


            updateJumlahCek();


            cleanupJSONP(
                callbackName,
                script
            );

        };


    const url =
        API_URL +
        "?action=setCek" +
        "&stackId=" +
        encodeURIComponent(
            stackId
        ) +
        "&register=" +
        encodeURIComponent(
            register
        ) +
        "&checked=" +
        encodeURIComponent(
            checked
        ) +
        "&callback=" +
        callbackName +
        "&_=" +
        Date.now();


    script =
        document.createElement("script");


    script.src =
        url;


    script.onerror =
        function(){

            if(timeoutId){
                clearTimeout(timeoutId);
            }


            status.textContent =
                "GAGAL";


            checkbox.checked =
                previousChecked;


            if(previousChecked){

                wrapper.classList.add(
                    "checked"
                );

            }
            else{

                wrapper.classList.remove(
                    "checked"
                );

            }


            updateJumlahCek();


            cleanupJSONP(
                callbackName,
                script
            );

        };


    document
        .body
        .appendChild(script);


    timeoutId =
        setTimeout(
            function(){

                if(
                    document.body.contains(script)
                ){

                    status.textContent =
                        "GAGAL";


                    checkbox.checked =
                        previousChecked;


                    if(previousChecked){

                        wrapper.classList.add(
                            "checked"
                        );

                    }
                    else{

                        wrapper.classList.remove(
                            "checked"
                        );

                    }


                    updateJumlahCek();


                    cleanupJSONP(
                        callbackName,
                        script
                    );

                }

            },
            15000
        );

}

/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatAngka(value){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "0";

    }


    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return value;

    }


    return number.toLocaleString(
        "id-ID"
    );

}


/* =====================================================
   FORMAT VOLUME
===================================================== */

function formatVolume(value){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "0 m³";

    }


    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return value + " m³";

    }


    return number.toLocaleString(
        "id-ID",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:6
        }
    ) + " m³";

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(value){

    if(!value){
        return "-";
    }


    if(
        typeof value === "string" &&
        /^\d{1,2}-\d{1,2}-\d{4}$/.test(
            value
        )
    ){

        return value;

    }


    if(
        typeof value === "string" &&
        /^\d{4}-\d{1,2}-\d{1,2}$/.test(
            value
        )
    ){

        const p =
            value.split("-");


        return (
            String(p[2]).padStart(2,"0") +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            p[0]
        );

    }


    const d =
        new Date(value);


    if(
        !Number.isNaN(
            d.getTime()
        )
    ){

        return (
            String(
                d.getDate()
            ).padStart(2,"0") +
            "-" +
            String(
                d.getMonth()+1
            ).padStart(2,"0") +
            "-" +
            d.getFullYear()
        );

    }


    return value;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

){
