<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CEK TUMPUK</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:#f1f5f9;
    font-family:Arial,Helvetica,sans-serif;
    color:#0f172a;
}

.container{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:16px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    position:relative;
    background:#ffffff;
    color:#14532d;
    border-radius:18px;
    padding:18px 20px;
    margin-bottom:15px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.10);

    display:flex;
    align-items:center;
    gap:18px;

    overflow:hidden;

    border:2px solid #16a34a;
}

.header::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:6px;

    background:
        linear-gradient(
            90deg,
            #15803d 0%,
            #22c55e 35%,
            #16a34a 65%,
            #166534 100%
        );
}

.header::after{
    content:"";
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:6px;

    background:
        linear-gradient(
            90deg,
            #166534 0%,
            #16a34a 35%,
            #22c55e 65%,
            #15803d 100%
        );
}

.header-logo{
    width:90px;
    height:90px;

    flex-shrink:0;

    background:white;

    border-radius:16px;

    padding:5px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border:2px solid #16a34a;

    box-shadow:
        0 2px 8px rgba(22,163,74,.20);
}

.header-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.header-text{
    min-width:0;
    flex:1;
}

.header-title{
    font-size:32px;
    font-weight:900;
    margin:0;
    line-height:1.05;
    letter-spacing:.5px;
    color:#14532d;
}

.header-sub{
    font-size:15px;
    color:#15803d;
    margin-top:8px;
    font-weight:800;
    letter-spacing:1.8px;
}

.header-text::after{
    content:"";
    display:block;

    width:75px;
    height:4px;

    margin-top:9px;

    border-radius:5px;

    background:#16a34a;
}


/* =====================================================
   SCANNER BOX
===================================================== */

.scanner-box{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}


/* =====================================================
   SEARCH TUMPUK
===================================================== */

.manual-title{
    font-size:17px;
    font-weight:900;
    margin-bottom:8px;
    color:#14532d;
}

.manual-box{
    display:flex;
    gap:8px;
    margin-top:0;
}

.manual-box input{
    flex:1;
    min-width:0;
    height:48px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    padding:0 12px;
    font-size:16px;
    outline:none;
}

.manual-box input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 2px rgba(37,99,235,.10);
}


/* =====================================================
   CAMERA
===================================================== */

.camera-section{
    display:none;
    margin-top:15px;
}

.camera-section.show{
    display:block;
}

.camera-card{
    width:100%;
    max-width:500px;
    margin:auto;
    background:white;
    border-radius:14px;
    padding:8px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.camera-wrapper{
    position:relative;
    width:100%;
    height:300px;
    border-radius:10px;
    overflow:hidden;
    background:black;
}

#video{
    width:100%;
    height:300px;
    object-fit:cover;
    display:block;
}


/* =====================================================
   GARIS POJOK
===================================================== */

.qr-frame{
    position:absolute;
    left:50%;
    top:50%;
    width:250px;
    height:250px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:10;
}

.corner{
    position:absolute;
    width:55px;
    height:55px;
    border-color:#00e676;
    border-style:solid;
}

.corner.tl{
    left:0;
    top:0;
    border-width:5px 0 0 5px;
    border-radius:6px 0 0 0;
}

.corner.tr{
    right:0;
    top:0;
    border-width:5px 5px 0 0;
    border-radius:0 6px 0 0;
}

.corner.bl{
    left:0;
    bottom:0;
    border-width:0 0 5px 5px;
    border-radius:0 0 0 6px;
}

.corner.br{
    right:0;
    bottom:0;
    border-width:0 5px 5px 0;
    border-radius:0 0 6px 0;
}


/* =====================================================
   INDIKATOR BERHASIL
===================================================== */

#scanBerhasil{
    position:absolute;
    left:50%;
    top:50%;
    width:250px;
    height:250px;
    transform:translate(-50%,-50%);
    border:6px solid #00e676;
    border-radius:12px;
    display:none;
    z-index:20;
    pointer-events:none;
    box-shadow:
        0 0 10px rgba(0,230,118,0.9),
        0 0 25px rgba(0,230,118,0.8);
}

#scanBerhasil::after{
    content:"✓";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:60px;
    height:60px;
    border-radius:50%;
    background:#00c853;
    color:white;
    font-size:40px;
    font-weight:bold;
    line-height:60px;
    text-align:center;
}


/* =====================================================
   STATUS
===================================================== */

.scan-status{
    text-align:center;
    font-size:13px;
    margin-top:10px;
    color:#64748b;
    line-height:1.5;
}

.camera-buttons{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.camera-buttons .btn{
    flex:1;
}


/* =====================================================
   BUTTON
===================================================== */

button{
    border:0;
    cursor:pointer;
    font-family:inherit;
}

.btn{
    min-height:44px;
    border-radius:10px;
    padding:0 16px;
    font-size:14px;
    font-weight:700;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-secondary{
    background:#e2e8f0;
    color:#0f172a;
}

.btn-green{
    background:#16a34a;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
    display:none;
    background:white;
    border-radius:15px;
    padding:18px;
    text-align:center;
    margin-bottom:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.07);
}

.loading.show{
    display:block;
}

.spinner{
    width:28px;
    height:28px;
    border:3px solid #cbd5e1;
    border-top-color:#2563eb;
    border-radius:50%;
    margin:0 auto 10px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =====================================================
   ERROR
===================================================== */

.error-box{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
    border-radius:14px;
    padding:14px;
    margin-bottom:15px;
    font-size:14px;
    line-height:1.5;
}

.error-box.show{
    display:block;
}


/* =====================================================
   RESULT
===================================================== */

.result{
    display:none;
}

.result.show{
    display:block;
}

.stack-card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.09);
}

.stack-title{
    text-align:center;
    margin-bottom:15px;
}

.stack-title .tumpuk{
    font-size:30px;
    font-weight:900;
    text-transform:uppercase;
}

.stack-title .tpk{
    margin-top:5px;
    font-size:14px;
    color:#64748b;
    font-weight:700;
}

.main-number{
    background:#eff6ff;
    border:2px solid #bfdbfe;
    border-radius:18px;
    padding:20px;
    text-align:center;
    margin-bottom:12px;
}

.main-number .label{
    font-size:13px;
    font-weight:800;
    color:#2563eb;
    letter-spacing:.5px;
}

.main-number .value{
    margin-top:6px;
    font-size:42px;
    line-height:1;
    font-weight:900;
    color:#0f172a;
}

.main-number .unit{
    margin-top:6px;
    font-size:14px;
    color:#64748b;
    font-weight:700;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.info-box{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:13px;
    padding:13px;
}

.info-box .label{
    font-size:11px;
    color:#64748b;
    font-weight:700;
    text-transform:uppercase;
}

.info-box .value{
    margin-top:4px;
    font-size:20px;
    font-weight:900;
}


/* =====================================================
   RINCIAN TPK
===================================================== */

.tpk-detail-box{
    display:none;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:15px;
    padding:14px;
    margin-bottom:15px;
}

.tpk-detail-box.show{
    display:block;
}

.tpk-detail-title{
    font-size:16px;
    font-weight:900;
    margin-bottom:10px;
}

.tpk-detail-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.tpk-detail-item{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:11px;
    padding:11px 12px;
}

.tpk-detail-name{
    font-size:14px;
    font-weight:900;
}

.tpk-detail-info{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:5px;
    font-size:13px;
    color:#475569;
    font-weight:700;
}

.tpk-detail-volume{
    text-align:right;
}


/* =====================================================
   SECTION
===================================================== */

.section{
    margin-top:18px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:18px;
    font-weight:900;
    margin-bottom:10px;
}

.section-count{
    font-size:12px;
    background:#e2e8f0;
    padding:5px 9px;
    border-radius:20px;
    color:#475569;
}


/* =====================================================
   REGISTER
===================================================== */

.register-list{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.register-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:11px;
    padding:11px 12px;
    transition:.15s;
}

.register-item input{
    width:20px;
    height:20px;
    accent-color:#2563eb;
    cursor:pointer;
    flex-shrink:0;
}

.register-number{
    font-family:monospace;
    font-size:16px;
    font-weight:800;
    flex:1;
}

.register-item.checked{
    background:#f0fdf4;
    border-color:#bbf7d0;
}

.register-item.checked .register-number{
    color:#15803d;
}

.check-status{
    font-size:11px;
    font-weight:800;
    color:#16a34a;
    white-space:nowrap;
}


/* =====================================================
   HISTORY
===================================================== */

.history-list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.history-item{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:13px;
    overflow:hidden;
}

.history-head{
    padding:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    cursor:pointer;
}

.history-date{
    font-size:15px;
    font-weight:900;
}

.history-taken{
    font-size:13px;
    color:#dc2626;
    font-weight:800;
    margin-top:3px;
}

.history-arrow{
    font-size:18px;
    color:#64748b;
    transition:.2s;
}

.history-item.open .history-arrow{
    transform:rotate(180deg);
}

.history-detail{
    display:none;
    padding:0 14px 14px;
    border-top:1px solid #e2e8f0;
}

.history-item.open .history-detail{
    display:block;
}

.detail-title{
    font-size:12px;
    color:#64748b;
    font-weight:700;
    margin:12px 0 8px;
}

.detail-register{
    display:block;
    font-family:monospace;
    font-size:15px;
    font-weight:800;
    padding:7px 0;
    border-bottom:1px dashed #cbd5e1;
}

.detail-register:last-child{
    border-bottom:0;
}


/* =====================================================
   BOTTOM
===================================================== */

.bottom-buttons{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.bottom-buttons .btn{
    flex:1;
}

.footer{
    text-align:center;
    font-size:11px;
    color:#94a3b8;
    padding:5px 0 20px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:500px){

    .container{
        padding:10px;
    }

    .header{
        padding:16px 14px;
        gap:14px;
    }

    .header-logo{

    }

    .header-title{
        font-size:28px;

    #video{
        height:280px;
    }

    .qr-frame,
    #scanBerhasil{
        width:220px;
        height:220px;
    }

}

</style>

</head>

<body>

<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="header-logo">

        <img
            src="logo-perhutani.jpg"
            alt="Perhutani">

    </div>

    <div class="header-text">

        <div class="header-title">
            CEK TUMPUK
        </div>

        <div class="header-sub">
            IK SARADAN
        </div>

    </div>

</div>


<!-- =====================================================
     SEARCH / SCANNER
===================================================== -->

<div class="scanner-box">


    <!-- =================================================
         SEARCH
    ================================================== -->

    <div class="manual-title">
        🔎 CARI NOMOR TUMPUK
    </div>

    <div class="manual-box">

        <input
            type="search"
            id="manualInput"
            placeholder="Ketik nomor TUMPUK..."
            autocomplete="off"
            inputmode="numeric">

        <button
            class="btn btn-primary"
            onclick="prosesManual()">

            CARI

        </button>

    </div>


    <!-- =================================================
         BUTTON BUKA KAMERA
    ================================================== -->

    <div class="camera-buttons">

        <button
            class="btn btn-green"
            id="cameraToggleBtn"

    <!-- =================================================
         CAMERA SECTION

    <div
        class="camera-section"
        id="cameraSection">

                <video
                    id="video"
                    autoplay
                    muted
                    playsinline>
                </video>

            class="scan-status"
            id="scanStatus">

            Kamera belum dibuka.

                class="btn btn-secondary"
                onclick="mulaiScanner()">

                📷 SCAN LAGI

            </button>

                class="btn btn-danger"

<!-- =====================================================

    class="loading"
    id="loading">

             HISTORY
        ================================================== -->

            <div class="section-title">

                <span>
                    HISTORY PENGAMBILAN
                </span>

                <span
                    class="section-count"

                    0

                id="historyList">

<script>

/* =====================================================
   KONFIGURASI BACKEND
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


/* =====================================================
   VARIABEL SCANNER
===================================================== */

let scannerControls = null;
let scannerReader = null;
let kameraAktif = false;
let sedangProses = false;


/* =====================================================
   VARIABEL DATA
===================================================== */

let currentTPK = "";
let currentTumpuk = "";
let currentStackId = "";
let currentRegisters = [];


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const params =
            new URLSearchParams(
                window.location.search
            );

        const urlTPK =
            params.get("tpk");

        const urlTumpuk =
            params.get("tumpuk");


        /*
         * Kalau URL berisi TPK + TUMPUK,
         * langsung ambil data.
         *
         * Kamera tetap tidak dibuka.
         */

        if(urlTumpuk){

            currentTPK =
                urlTPK
                ?
                String(urlTPK).trim()
                :
                "";

            currentTumpuk =
                String(urlTumpuk).trim();


            if(
                currentTumpuk === "29"
            ){

                currentTPK =
                    "";

                currentStackId =
                    "TUMPUK|29";

            }
            else{

                currentStackId =
                    currentTPK +
                    "|" +
                    currentTumpuk;

            }


            document
                .getElementById("scanStatus")
                .innerHTML =
                "🔗 MEMBUKA TUMPUK<br>" +
                "TUMPUK " +
                escapeHtml(
                    currentTumpuk
                );


            sedangProses =
                true;


            ambilDataTumpuk();

        }

        else{

            /*
             * DEFAULT:
             * JANGAN BUKA KAMERA.
             */

            document
                .getElementById("scanStatus")
                .textContent =
                "Ketik nomor TUMPUK atau buka kamera untuk scan.";

        }


        document
            .getElementById("manualInput")
            .addEventListener(
                "keydown",
                function(e){

                    if(e.key === "Enter"){

                        prosesManual();

                    }

                }
            );

    }
);


/* =====================================================
   TOGGLE KAMERA
===================================================== */

function toggleKamera(){

    if(kameraAktif){

        tutupKamera();

    }
    else{

        mulaiScanner();

    }

}


/* =====================================================
   START SCANNER
===================================================== */

async function mulaiScanner(){

    hideError();


    const cameraSection =
        document.getElementById(
            "cameraSection"
        );


    const toggleBtn =
        document.getElementById(
            "cameraToggleBtn"
        );


    const status =
        document.getElementById(
            "scanStatus"
        );


    if(kameraAktif){

        return;

    }


    cameraSection.classList.add(
        "show"
    );


    toggleBtn.textContent =
        "✕ TUTUP KAMERA";


    toggleBtn.className =
        "btn btn-danger";


    status.innerHTML =
        "⏳ Membuka kamera...";


    try{

        if(!window.ZXingBrowser){

            throw new Error(
                "ZXing belum berhasil dimuat"
            );

        }


        const video =
            document.getElementById(
                "video"
            );


        scannerReader =
            new ZXingBrowser.BrowserMultiFormatReader(
                undefined,
                80
            );


        const constraints = {

            audio:false,

            video:{

                facingMode:{
                    ideal:"environment"
                },

                width:{
                    min:640,
                    ideal:1280,
                    max:1920
                },

                height:{
                    min:480,
                    ideal:720,
                    max:1080
                },

                frameRate:{
                    min:15,
                    ideal:30,
                    max:60
                },

                focusMode:{
                    ideal:"continuous"
                }

            }

        };


        status.innerHTML =
            "⏳ Meminta akses kamera...";


        scannerControls =
            await scannerReader.decodeFromConstraints(

                constraints,

                video,

                function(
                    result,
                    error
                ){

                    if(!result){

                        return;

                    }


                    if(sedangProses){

                        return;

                    }


                    const kode =
                        String(
                            result.getText() || ""
                        ).trim();


                    if(!kode){

                        return;

                    }


                    sedangProses =
                        true;


                    tampilkanIndikatorHijau();


                    bunyiBerhasil();


                    getarBerhasil();


                    status.innerHTML =
                        "⏳ BARCODE TERBACA<br>" +
                        "Mengecek " +
                        escapeHtml(kode) +
                        "...";


                    /*
                     * KAMERA OTOMATIS DITUTUP
                     * SETELAH BARCODE TERBACA
                     */

                    tutupKamera();


                    prosesKodeTumpuk(
                        kode
                    );

                }

            );


        kameraAktif =
            true;


        status.innerHTML =
            "📷 KAMERA AKTIF<br>" +
            "Arahkan CODE 128 ke kotak hijau";


        setTimeout(
            function(){

                optimalkanKamera(
                    video
                );

            },
            500
        );

    }
    catch(error){

        kameraAktif =
            false;

        scannerControls =
            null;

        scannerReader =
            null;


        cameraSection.classList.remove(
            "show"
        );


        toggleBtn.textContent =
            "📷 BUKA KAMERA";


        toggleBtn.className =
            "btn btn-green";


        status.innerHTML =
            "❌ Kamera gagal dibuka<br>" +
            escapeHtml(
                error.message
            );


        console.log(
            "ZXing error:",
            error
        );

    }

}


/* =====================================================
   TUTUP KAMERA
===================================================== */

function tutupKamera(){

    try{

        if(scannerControls){

            scannerControls.stop();

        }

    }
    catch(error){

        console.log(
            "Stop scanner:",
            error
        );

    }


    try{

        const video =
            document.getElementById(
                "video"
            );


        if(video.srcObject){

            const tracks =
                video.srcObject
                    .getTracks();


            tracks.forEach(
                function(track){

                    track.stop();

                }
            );


            video.srcObject =
                null;

        }

    }
    catch(error){

        console.log(
            "Stop video:",
            error
        );

    }


    scannerControls =
        null;

    scannerReader =
        null;

    kameraAktif =
        false;


    const cameraSection =
        document.getElementById(
            "cameraSection"
        );


    const toggleBtn =
        document.getElementById(
            "cameraToggleBtn"
        );


    const status =
        document.getElementById(
            "scanStatus"
        );


    cameraSection.classList.remove(
        "show"
    );


    toggleBtn.textContent =
        "📷 BUKA KAMERA";


    toggleBtn.className =
        "btn btn-green";


    if(
        !sedangProses
    ){

        status.textContent =
            "Kamera ditutup. Ketik nomor TUMPUK atau buka kamera untuk scan.";

    }

}

/* =====================================================
   SUARA
===================================================== */

function bunyiBerhasil(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if(!AudioContext){

            return;

        }


        const audio =
            new AudioContext();


        const oscillator =
            audio.createOscillator();


        const gain =
            audio.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.setValueAtTime(
            1400,
            audio.currentTime
        );


        gain.gain.setValueAtTime(
            0.001,
            audio.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.35,
            audio.currentTime + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime + 0.10
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            audio.destination
        );


        oscillator.start();


        oscillator.stop(
            audio.currentTime + 0.11
        );


        setTimeout(
            function(){

                try{

                    audio.close();

                }
                catch(e){}

            },
            200
        );

    }
    catch(e){

        console.log(e);

    }

}

}


/* =====================================================
   OPTIMASI KAMERA
===================================================== */

async function optimalkanKamera(
    video
){

    try{

        if(!video.srcObject){

            return;

        }


        const tracks =
            video.srcObject
                .getVideoTracks();


        if(!tracks.length){

            return;

        }


        const track =
            tracks[0];


        const capabilities =
            track.getCapabilities
            ?
            track.getCapabilities()
            :
            {};


        const advanced = {};


        if(
            capabilities.focusMode &&
            capabilities.focusMode.includes(
                "continuous"
            )
        ){

            advanced.focusMode =
                "continuous";

        }


        if(
            capabilities.exposureMode &&
            capabilities.exposureMode.includes(
                "continuous"
            )
        ){

            advanced.exposureMode =
                "continuous";

        }


        if(
            capabilities.whiteBalanceMode &&
            capabilities.whiteBalanceMode.includes(
                "continuous"
            )
        ){

            advanced.whiteBalanceMode =
                "continuous";

        }


        if(
            Object.keys(advanced).length
        ){

            await track.applyConstraints({

                advanced:[
                    advanced
                ]

            });

        }

    }
    catch(error){

        console.log(
            "Optimasi kamera tidak tersedia:",
            error
        );

    }

}

   SEARCH MANUAL
===================================================== */

function prosesManual(){

    hideError();

    let nomor =
        document
        .getElementById("manualInput")
        .value
        .trim();


    if(!nomor){

        showError(
            "Masukkan nomor TUMPUK."
        );

        return;

    }


    if(
        nomor.indexOf("|") !== -1
    ){

        sedangProses =
            true;


        prosesKodeTumpuk(
            nomor
        );


        return;

    }


    nomor =
        nomor
        .replace(
            /TUMPUK/gi,
            ""
        )
        .replace(
            /^T/i,
            ""
        )
        .trim();


    if(!nomor){

        showError(
            "Nomor TUMPUK tidak ditemukan."
        );

        return;

    }


    sedangProses =
        true;


    cariTumpukDenganNomor(
        nomor
    );

}


/* =====================================================
   CARI NOMOR TUMPUK DARI DATABASE
===================================================== */

function cariTumpukDenganNomor(
    nomor
){

    showLoading();


    const callbackName =
        "callbackList_" +
        Date.now();


    let script = null;
    let timeoutId = null;


    window[callbackName] =
        function(response){

            try{

                hideLoading();


                const berhasil =
                    response &&
                    (
                        response.ok === "success" ||
                        response.ok === true ||
                        response.status === "success" ||
                        response.success === true
                    );


                if(!berhasil){

                    showError(
                        response &&
                        (
                            response.message ||
                            response.error
                        )
                        ?
                        (
                            response.message ||
                            response.error
                        )
                        :
                        "Data TUMPUK tidak ditemukan."
                    );


                    sedangProses =
                        false;


                    return;

                }


                const list =
                    Array.isArray(
                        response.data
                    )
                    ?
                    response.data
                    :
                    [];


                const target =
                    String(nomor)
                    .trim();


                const ditemukan =
                    list.find(
                        function(item){

                            return (
                                String(
                                    item.tumpuk
                                ).trim()
                                ===
                                target
                            );

                        }
                    );


                if(!ditemukan){

                    showError(
                        "TUMPUK <b>" +
                        escapeHtml(target) +
                        "</b> tidak ditemukan."
                    );


                    sedangProses =
                        false;


                    return;

                }


                currentTumpuk =
                    target;


                if(
                    target === "29"
                ){

                    currentTPK = "";

                }
                else{

                    currentTPK =
                        String(
                            ditemukan.tpk || ""
                        )
                        .split(",")[0]
                        .trim();

                }


                currentStackId =
                    ditemukan.stackId || "";


                ambilDataTumpuk();

            }
            catch(error){

                console.error(error);


                hideLoading();


                showError(
                    "Terjadi kesalahan saat mencari TUMPUK."
                );


                sedangProses =
                    false;

            }


            if(timeoutId){

                clearTimeout(
                    timeoutId
                );

            }


            cleanupJSONP(
                callbackName,
                script
            );

        };


    const url =
        API_URL +
        "?action=getTumpukList" +
        "&callback=" +
        callbackName +
        "&_=" +
        Date.now();


    script =
        document.createElement(
            "script"
        );


    script.src =
        url;


    script.onerror =
        function(){

            if(timeoutId){

                clearTimeout(
                    timeoutId
                );

            }


            hideLoading();


            showError(
                "Gagal mengambil daftar TUMPUK."
            );


            sedangProses =
                false;


            cleanupJSONP(
                callbackName,
                script
            );

        };


    document
        .body
        .appendChild(script);


    timeoutId =
        setTimeout(
            function(){

                if(
                    document.body.contains(
                        script
                    )
                ){

                    cleanupJSONP(
                        callbackName,
                        script
                    );


                    hideLoading();


                    showError(
                        "Waktu pencarian habis. Coba lagi."
                    );


                    sedangProses =
                        false;

                }

            },
            15000
        );

}


/* =====================================================
   PARSE BARCODE / QR TUMPUK
===================================================== */

function prosesKodeTumpuk(
    kode
){

    hideError();


    kode =
        String(kode || "")
        .trim();


    console.log(
        "KODE TUMPUK:",
        kode
    );


    /* =================================================
       1. QR URL
    ================================================= */

    try{

        const url =
            new URL(kode);


        const urlTPK =
            url.searchParams.get(
                "tpk"
            );


        const urlTumpuk =
            url.searchParams.get(
                "tumpuk"
            );


        if(urlTumpuk){

            currentTPK =
                urlTPK
                ?
                String(urlTPK).trim()
                :
                "";


            currentTumpuk =
                String(urlTumpuk).trim();


            if(
                currentTumpuk === "29"
            ){

                currentTPK =
                    "";

                currentStackId =
                    "TUMPUK|29";

            }
            else{

                currentStackId =
                    currentTPK +
                    "|" +
                    currentTumpuk;

            }


            console.log(
                "QR LINK TERBACA:",
                currentTPK,
                currentTumpuk,
                currentStackId
            );


            ambilDataTumpuk();


            return;

        }

    }
    catch(error){

        console.log(
            "Bukan QR URL, lanjut parser lama."
        );

    }


    /* =================================================
       2. FORMAT TPK|45
    ================================================= */

    let parts =
        kode.split("|");


    if(parts.length >= 2){

        currentTPK =
            parts[0]
            .trim();


        currentTumpuk =
            parts
            .slice(1)
            .join("|")
            .trim();

    }

    else{

        /* =============================================
           3. FORMAT TPK-T45
        ============================================= */

        const match =
            kode.match(
                /^(.+)-T(\d+)$/i
            );


        if(match){

            currentTPK =
                match[1]
                .trim();


            currentTumpuk =
                match[2]
                .trim();

        }

        else{

            /* =========================================
               4. NOMOR SAJA
            ========================================= */

            if(
                /^\d+$/.test(kode)
            ){

                sedangProses =
                    true;


                cariTumpukDenganNomor(
                    kode
                );


                return;

            }


            showError(
                "Format barcode TUMPUK tidak dikenali."
            );


            sedangProses =
                false;


            return;

        }

    }


    /* =================================================
       5. PASTIKAN NOMOR
    ================================================= */

    if(
        !currentTumpuk
    ){

        showError(
            "Nomor TUMPUK tidak terbaca."
        );


        sedangProses =
            false;


        return;

    }


    /* =================================================
       6. TUMPUK 29
    ================================================= */

    if(
        String(currentTumpuk) === "29"
    ){

        currentTPK =
            "";

        currentStackId =
            "TUMPUK|29";

    }
    else{

        currentStackId =
            currentTPK +
            "|" +
            currentTumpuk;

    }


    /* =================================================
       7. AMBIL DATA
    ================================================= */

    ambilDataTumpuk();

}


/* =====================================================
   AMBIL DATA TUMPUK
===================================================== */

function ambilDataTumpuk(){

    showLoading();


    const callbackName =
        "callbackTumpuk_" +
        Date.now();


    let timeoutId = null;
    let script = null;


    window[callbackName] =
        function(response){

            try{

                hideLoading();


                const berhasil =
                    response &&
                    (
                        response.ok === "success" ||
                        response.ok === true ||
                        response.status === "success" ||
                        response.success === true
                    );


                if(!berhasil){

                    showError(
                        response &&
                        (
                            response.message ||
                            response.error
                        )
                        ?
                        (
                            response.message ||
                            response.error
                        )
                        :
                        "Data TUMPUK tidak ditemukan."
                    );


                    sedangProses =
                        false;


                    return;

                }


                if(
                    !response.data ||
                    typeof response.data !== "object"
                ){

                    showError(
                        "Format data TUMPUK tidak sesuai."
                    );


                    sedangProses =
                        false;


                    return;

                }


                tampilkanData(
                    response.data
                );


                sedangProses =
                    false;

            }
            catch(error){

                console.error(error);


                showError(
                    "Terjadi kesalahan saat menampilkan data."
                );


                sedangProses =
                    false;

            }


            if(timeoutId){

                clearTimeout(
                    timeoutId
                );

            }


            cleanupJSONP(
                callbackName,
                script
            );

        };


    const url =
        API_URL +
        "?action=getTumpukData" +
        "&tpk=" +
        encodeURIComponent(
            currentTPK
        ) +
        "&tumpuk=" +
        encodeURIComponent(
            currentTumpuk
        ) +
        "&callback=" +
        callbackName +
        "&_=" +
        Date.now();


    console.log(
        "REQUEST TUMPUK:",
        currentTPK,
        currentTumpuk,
        currentStackId
    );


    script =
        document.createElement(
            "script"
        );


    script.src =
        url;


    script.onerror =
        function(){

            if(timeoutId){

                clearTimeout(
                    timeoutId
                );

            }


            hideLoading();


            showError(
                "Gagal menghubungi backend CEK TUMPUK."
            );


            sedangProses =
                false;


            cleanupJSONP(
                callbackName,
                script
            );

        };


    document
        .body
        .appendChild(
            script
        );


    timeoutId =
        setTimeout(
            function(){

                if(
                    document.body.contains(
                        script
                    )
                ){

                    cleanupJSONP(
                        callbackName,
                        script
                    );


                    hideLoading();


                    showError(
                        "Waktu koneksi habis. Coba lagi."
                    );


                    sedangProses =
                        false;

                }

            },
            15000
        );

}

){

        (

            ?
            "TUMPUK|29"
            :
            currentTPK +
            "|" +
            currentTumpuk
        );

    );

/* =====================================================
   TAMPILKAN REGISTER
===================================================== */

function tampilkanRegister(
    registers,
    data
){

    const container =
        document
        .getElementById(
            "registerList"
        );


    container.innerHTML = "";


    if(!registers.length){

        container.innerHTML =
            '<div class="empty">' +
            'Tidak ada register yang masih tersisa.' +
            '</div>';


        updateJumlahCek();


        return;

    }


    registers.forEach(
        function(item){

            const register =
                item.register !== undefined
                ?
                String(item.register)
                :
                (
                    item.REGISTER !== undefined
                    ?
                    String(item.REGISTER)
                    :
                    ""
                );


            if(!register){

                return;

            }


            const checked =
                item.checked === true ||
                String(
                    item.checked
                ).toLowerCase() === "true";


            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "register-item" +
                (
                    checked
                    ?
                    " checked"
                    :
                    ""
                );


            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.checked =
                checked;


            const status =
                document.createElement(
                    "div"
                );


            status.className =
                "check-status";


            status.textContent =
                checked
                ?
                "SUDAH DICEK"
                :
                "";


            checkbox.addEventListener(
                "change",
                function(){

                    updateJumlahCek();


                    setCheckbox(
                        register,
                        checkbox.checked,
                        wrapper,
                        status
                    );

                }
            );


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "register-number";


            number.textContent =
                register;


            wrapper.appendChild(
                checkbox
            );


            wrapper.appendChild(
                number
            );


            wrapper.appendChild(
                status
            );


            container.appendChild(
                wrapper
            );

        }
    );


    updateJumlahCek();

}


/* =====================================================
   CHECKBOX
===================================================== */

function setCheckbox(
    register,
    checked,
    wrapper,
    status
){

    const checkbox =
        wrapper.querySelector(
            'input[type="checkbox"]'
        );


    const previousChecked =
        !checked;


    if(checked){

        wrapper.classList.add(
            "checked"
        );

    }
    else{

        wrapper.classList.remove(
            "checked"
        );

    }


    status.textContent =
        "MENYIMPAN...";


    let stackId =
        currentStackId;


    if(!stackId){

        stackId =
            String(currentTumpuk) === "29"
            ?
            "TUMPUK|29"
            :
            currentTPK +
            "|" +
            currentTumpuk;

    }


    const callbackName =
        "callbackCek_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random()*1000
        );


    let script = null;
    let timeoutId = null;


    window[callbackName] =
        function(data){

            if(timeoutId){

                clearTimeout(
                    timeoutId
                );

            }


            const berhasil =
                data &&
                (
                    data.ok === "success" ||
                    data.ok === true ||
                    data.status === "success" ||
                    data.success === true
                );


            if(berhasil){

                status.textContent =
                    checked
                    ?
                    "SUDAH DICEK"
                    :
                    "";


                if(checked){

                    wrapper.classList.add(
                        "checked"
                    );

                }
                else{

                    wrapper.classList.remove(
                        "checked"
                    );

                }

            }
            else{

                status.textContent =
                    "GAGAL";


                checkbox.checked =
                    previousChecked;


                if(previousChecked){

                    wrapper.classList.add(
                        "checked"
                    );

                }
                else{

                    wrapper.classList.remove(
                        "checked"
                    );

                }

            }


            updateJumlahCek();


            cleanupJSONP(
                callbackName,
                script
            );

        };


    const url =
        API_URL +
        "?action=setCek" +
        "&stackId=" +
        encodeURIComponent(
            stackId
        ) +
        "&register=" +
        encodeURIComponent(
            register
        ) +
        "&checked=" +
        encodeURIComponent(
            checked
        ) +
        "&callback=" +
        callbackName +
        "&_=" +
        Date.now();


    script =
        document.createElement(
            "script"
        );


    script.src =
        url;


    script.onerror =
        function(){

            if(timeoutId){

                clearTimeout(
                    timeoutId
                );

            }


            status.textContent =
                "GAGAL";


            checkbox.checked =
                previousChecked;


            if(previousChecked){

                wrapper.classList.add(
                    "checked"
                );

            }
            else{

                wrapper.classList.remove(
                    "checked"
                );

            }


            updateJumlahCek();


            cleanupJSONP(
                callbackName,
                script
            );

        };


    document
        .body
        .appendChild(
            script
        );


    timeoutId =
        setTimeout(
            function(){

                if(
                    document.body.contains(
                        script
                    )
                ){

                    status.textContent =
                        "GAGAL";


                    checkbox.checked =
                        previousChecked;


                    if(previousChecked){

                        wrapper.classList.add(
                            "checked"
                        );

                    }
                    else{

                        wrapper.classList.remove(
                            "checked"
                        );

                    }


                    updateJumlahCek();


                    cleanupJSONP(
                        callbackName,
                        script
                    );

                }

            },
            15000
        );

}


/* =====================================================
   HISTORY PENGAMBILAN
===================================================== */

function tampilkanHistory(
    history
){

    const container =
        document.getElementById(
            "historyList"
        );


    container.innerHTML = "";


    if(
        !Array.isArray(history) ||
        history.length === 0
    ){

        container.innerHTML =
            '<div class="empty">' +
            'Belum ada history pengambilan.' +
            '</div>';


        return;

    }


    history.forEach(
        function(item){

            if(
                !item ||
                typeof item !== "object"
            ){

                return;

            }


            const tanggal =
                item.tanggal !== undefined
                ?
                item.tanggal
                :
                (
                    item.TANGGAL !== undefined
                    ?
                    item.TANGGAL
                    :
                    ""
                );


            const registers =
                Array.isArray(
                    item.registers
                )
                ?
                item.registers
                :
                [];


            let jumlah =
                Number(
                    item.jumlah
                );


            if(
                Number.isNaN(jumlah)
            ){

                jumlah =
                    registers.length;

            }


            const tanggalTampil =
                formatTanggalHistory(
                    tanggal
                );


            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "history-item";


            const head =
                document.createElement(
                    "div"
                );


            head.className =
                "history-head";


            const left =
                document.createElement(
                    "div"
                );


            const dateEl =
                document.createElement(
                    "div"
                );


            dateEl.className =
                "history-date";


            dateEl.textContent =
                tanggalTampil;


            const takenEl =
                document.createElement(
                    "div"
                );


            takenEl.className =
                "history-taken";


            takenEl.textContent =
                "DIAMBIL " +
                formatAngka(
                    jumlah
                ) +
                " BATANG";


            left.appendChild(
                dateEl
            );


            left.appendChild(
                takenEl
            );


            const arrow =
                document.createElement(
                    "div"
                );


            arrow.className =
                "history-arrow";


            arrow.textContent =
                "▼";


            head.appendChild(
                left
            );


            head.appendChild(
                arrow
            );


            const detail =
                document.createElement(
                    "div"
                );


            detail.className =
                "history-detail";


            const detailTitle =
                document.createElement(
                    "div"
                );


            detailTitle.className =
                "detail-title";


            detailTitle.textContent =
                "REGISTER YANG DIAMBIL";


            detail.appendChild(
                detailTitle
            );


            if(
                registers.length === 0
            ){

                const empty =
                    document.createElement(
                        "div"
                    );


                empty.className =
                    "empty";


                empty.textContent =
                    "Detail register tidak tersedia.";


                detail.appendChild(
                    empty
                );

            }
            else{

                registers.forEach(
                    function(register){

                        const el =
                            document.createElement(
                                "span"
                            );


                        el.className =
                            "detail-register";


                        el.textContent =
                            String(
                                register
                            );


                        detail.appendChild(
                            el
                        );

                    }
                );

            }


            head.addEventListener(
                "click",
                function(){

                    box.classList.toggle(
                        "open"
                    );

                }
            );


            box.appendChild(
                head
            );


            box.appendChild(
                detail
            );


            container.appendChild(
                box
            );

        }
    );


    if(
        !container.children.length
    ){

        container.innerHTML =
            '<div class="empty">' +
            'Belum ada history pengambilan.' +
            '</div>';

    }

}


/* =====================================================
   NORMALISASI TANGGAL HISTORY
===================================================== */

function normalisasiTanggalHistory(
    value
){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "-";

    }


    const text =
        String(value).trim();


    if(
        /^\d{4}-\d{2}-\d{2}T/.test(text)
    ){

        return text.substring(
            0,
            10
        );

    }


    if(
        /^\d{4}-\d{1,2}-\d{1,2}$/.test(text)
    ){

        const p =
            text.split("-");


        return (
            String(p[0]) +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            String(p[2]).padStart(2,"0")
        );

    }


    if(
        /^\d{1,2}-\d{1,2}-\d{4}$/.test(text)
    ){

        const p =
            text.split("-");


        return (
            String(p[2]) +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            String(p[0]).padStart(2,"0")
        );

    }


    if(
        /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(text)
    ){

        const p =
            text.split("/");


        return (
            String(p[2]) +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            String(p[0]).padStart(2,"0")
        );

    }


    if(
        /^\d{4}\/\d{1,2}\/\d{1,2}$/.test(text)
    ){

        const p =
            text.split("/");


        return (
            String(p[0]) +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            String(p[2]).padStart(2,"0")
        );

    }


    const d =
        new Date(text);


    if(
        !Number.isNaN(
            d.getTime()
        )
    ){

        return (
            String(
                d.getFullYear()
            ) +
            "-" +
            String(
                d.getMonth()+1
            ).padStart(2,"0") +
            "-" +
            String(
                d.getDate()
            ).padStart(2,"0")
        );

    }


    return text;

}


/* =====================================================
   FORMAT TANGGAL HISTORY
===================================================== */

function formatTanggalHistory(
    value
){

    const key =
        normalisasiTanggalHistory(
            value
        );


    if(
        !key ||
        key === "-"
    ){

        return "-";

    }


    const match =
        String(key).match(
            /^(\d{4})-(\d{2})-(\d{2})$/
        );


    if(match){

        return (
            match[3] +
            "-" +
            match[2] +
            "-" +
            match[1]
        );

    }


    return String(value);

}

/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatAngka(
    value
){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "0";

    }


    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return value;

    }


    return number.toLocaleString(
        "id-ID"
    );

}


/* =====================================================
   FORMAT VOLUME
===================================================== */

function formatVolume(
    value
){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "0 m³";

    }


    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return value + " m³";

    }


    return number.toLocaleString(
        "id-ID",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:6
        }
    ) + " m³";

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(
    value
){

    if(!value){

        return "-";

    }


    if(
        typeof value === "string" &&
        /^\d{1,2}-\d{1,2}-\d{4}$/.test(
            value
        )
    ){

        return value;

    }


    if(
        typeof value === "string" &&
        /^\d{4}-\d{1,2}-\d{1,2}$/.test(
            value
        )
    ){

        const p =
            value.split("-");


        return (
            String(p[2]).padStart(2,"0") +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            p[0]
        );

    }


    const d =
        new Date(value);


    if(
        !Number.isNaN(
            d.getTime()
        )
    ){

        return (
            String(
                d.getDate()
            ).padStart(2,"0") +
            "-" +
            String(
                d.getMonth()+1
            ).padStart(2,"0") +
            "-" +
            d.getFullYear()
        );

    }


    return value;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
