<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CEK TUMPUK</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

<style>

/* =====================================================
   RESET & DASAR
===================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#f3f6f4;
    font-family:Arial,Helvetica,sans-serif;
    color:#17221c;
}

.container{
    width:100%;
    max-width:620px;
    margin:0 auto;
    padding:14px;
}


/* =====================================================
   HEADER — PREMIUM MODERN
===================================================== */

.header{
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 8% 10%,
            rgba(255,255,255,.12),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #08482b 0%,
            #0d6338 50%,
            #20834d 100%
        );

    color:white;

    border:1px solid rgba(255,255,255,.10);
    border-radius:16px;

    padding:14px 16px;

    display:flex;
    align-items:center;
    gap:14px;

    box-shadow:
        0 8px 22px rgba(20,80,45,.20);
}


/* efek dekorasi kanan */

.header::after{
    content:"";

    position:absolute;

    width:150px;
    height:150px;

    right:-55px;
    top:-75px;

    border-radius:50%;

    background:rgba(255,255,255,.07);
}


/* =====================================================
   LOGO
===================================================== */

.header img{
    position:relative;
    z-index:2;

    width:76px;
    height:76px;

    object-fit:contain;

    flex-shrink:0;

    background:white;

    padding:6px;

    border-radius:12px;

    box-shadow:
        0 4px 12px rgba(0,0,0,.18),
        0 0 0 1px rgba(255,255,255,.25);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.header img:hover{
    transform:scale(1.03);

    box-shadow:
        0 6px 16px rgba(0,0,0,.22),
        0 0 0 1px rgba(255,255,255,.35);
}


/* =====================================================
   JUDUL
===================================================== */

.header h1{
    position:relative;
    z-index:2;

    margin:0;

    font-size:26px;

    font-weight:900;

    color:white;

    letter-spacing:.3px;

    line-height:1.15;

    text-shadow:
        0 2px 4px rgba(0,0,0,.18);
}


/* =====================================================
   SUBTITLE
===================================================== */

.header .sub{
    position:relative;
    z-index:2;

    margin-top:5px;

    font-size:12px;

    font-weight:600;

    color:rgba(255,255,255,.82);

    letter-spacing:.5px;
}


/* =====================================================
   GARIS AKSEN
===================================================== */

.header::before{
    content:"";

    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:2px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{
        padding:12px 13px;
        gap:11px;

        border-radius:14px;
    }

    .header img{
        width:60px;
        height:60px;

        padding:5px;

        border-radius:10px;
    }

    .header h1{
        font-size:20px;
    }

    .header .sub{
        margin-top:3px;
        font-size:10px;
    }

}

/* =====================================================
   SCANNER CARD
===================================================== */

.scanner-card{
    background:white;

    border:1px solid #e0e8e3;

    border-radius:15px;

    padding:16px;

    margin-top:13px;

    box-shadow:
        0 4px 14px rgba(20,40,28,.06);
}

.section-title{
    font-size:13px;

    font-weight:900;

    color:#34453b;

    margin-bottom:9px;

    letter-spacing:.2px;
}

.manual-row{
    display:flex;

    gap:8px;
}

.manual-row input{
    flex:1;

    min-width:0;

    padding:12px 13px;

    border:1px solid #cbd8d0;

    border-radius:9px;

    background:#fbfcfb;

    color:#17221c;

    font-size:16px;

    outline:none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.manual-row input::placeholder{
    color:#9aa8a0;
}

.manual-row input:focus{
    background:white;

    border-color:#176b3a;

    box-shadow:
        0 0 0 3px rgba(23,107,58,.10);
}


/* =====================================================
   BUTTON
===================================================== */

.btn{
    border:none;

    border-radius:9px;

    padding:11px 15px;

    font-weight:800;

    cursor:pointer;

    transition:
        transform .12s ease,
        box-shadow .15s ease,
        opacity .15s ease;
}

.btn:active{
    transform:scale(.97);
}

.btn-search{
    background:#176b3a;

    color:white;

    box-shadow:
        0 3px 8px rgba(23,107,58,.20);
}

.btn-search:hover{
    background:#125b30;
}

.btn-camera{
    width:100%;

    margin-top:10px;

    background:#eef7f1;

    color:#176b3a;

    border:1px solid #cfe2d5;

    box-shadow:none;
}

.btn-camera:hover{
    background:#e1f0e6;
}

.btn-camera.close{
    background:#fff1f1;

    color:#c62828;

    border-color:#f0cccc;
}


/* =====================================================
   CAMERA
===================================================== */

#cameraSection{
    display:none;

    margin-top:12px;
}

.camera-box{
    position:relative;

    width:100%;

    max-width:500px;

    height:300px;

    margin:0 auto;

    overflow:hidden;

    background:#07100b;

    border-radius:14px;

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        0 5px 15px rgba(0,0,0,.12);
}

#video{
    width:100%;
    height:100%;

    object-fit:cover;
}

.qr-frame{
    position:absolute;

    left:50%;
    top:50%;

    width:220px;
    height:220px;

    transform:translate(-50%,-50%);

    pointer-events:none;
}

.qr-frame::before,
.qr-frame::after{
    content:"";

    position:absolute;

    width:42px;
    height:42px;

    border-color:#39d477;

    border-style:solid;

    filter:drop-shadow(
        0 0 5px rgba(57,212,119,.35)
    );
}

.qr-frame::before{
    top:0;
    left:0;

    border-width:4px 0 0 4px;
}

.qr-frame::after{
    right:0;
    bottom:0;

    border-width:0 4px 4px 0;
}

.qr-indicator{
    position:absolute;

    left:50%;
    top:50%;

    width:220px;
    height:220px;

    transform:translate(-50%,-50%);

    border:1px solid rgba(255,255,255,.28);

    border-radius:10px;

    pointer-events:none;
}

.scan-success{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:220px;
    height:220px;

    border:5px solid #39d477;

    border-radius:12px;

    display:none;

    pointer-events:none;

    box-shadow:
        0 0 25px rgba(57,212,119,.55);
}

.scan-success.show{
    display:block;
}


/* =====================================================
   SCAN STATUS
===================================================== */

.scan-status{
    margin-top:9px;

    text-align:center;

    font-size:12px;

    color:#718078;

    font-weight:700;
}


/* =====================================================
   LOADING
===================================================== */

#loading{
    display:none;

    background:white;

    margin-top:13px;

    padding:18px;

    border-radius:13px;

    text-align:center;

    font-weight:800;

    font-size:13px;

    color:#176b3a;

    border:1px solid #e0e8e3;

    box-shadow:
        0 4px 14px rgba(20,40,28,.05);
}

#loading.show{
    display:block;
}


/* =====================================================
   ERROR
===================================================== */

#errorBox{
    display:none;

    margin-top:13px;

    background:#fff5f5;

    border:1px solid #f0cccc;

    border-left:4px solid #c62828;

    color:#b42323;

    padding:12px 13px;

    border-radius:10px;

    font-size:13px;

    font-weight:700;
}

#errorBox.show{
    display:block;
}


/* =====================================================
   RESULT
===================================================== */

#result{
    display:none;

    margin-top:13px;
}

#result.show{
    display:block;
}

.result-card{
    background:white;

    border:1px solid #e0e8e3;

    border-radius:15px;

    padding:16px;

    box-shadow:
        0 5px 16px rgba(20,40,28,.06);
}


/* =====================================================
   TUMPUK TITLE
===================================================== */

.tumpuk-title{
    text-align:center;

    font-size:22px;

    line-height:1.1;

    font-weight:900;

    color:#176b3a;

    letter-spacing:.5px;
}

.tpk-title{
    text-align:center;

    margin-top:5px;

    font-size:12px;

    font-weight:800;

    color:#7a8880;

    letter-spacing:.3px;
}


/* =====================================================
   RINGKASAN
===================================================== */

.summary-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-top:15px;
}

.summary-box{
    background:#f7faf8;

    border:1px solid #dfe8e2;

    border-radius:11px;

    padding:12px;

    text-align:center;
}

.jumlah-utama{
    grid-column:1 / -1;

    padding:17px 12px;

    background:#eef7f1;

    border-color:#cfe2d5;
}

.jumlah-utama .summary-label{
    font-size:12px;

    color:#557063;
}

.jumlah-angka{
    margin-top:6px !important;
    font-size:72px !important;
    line-height:.95 !important;
    font-weight:900 !important;
    color:#176b3a;
}

.summary-label{
    font-size:10px;

    color:#7a8880;

    font-weight:800;

    letter-spacing:.2px;
}

.summary-value{
    margin-top:4px;

    font-size:20px;

    font-weight:900;

    color:#202d25;
}


/* =====================================================
   RINCIAN TPK
===================================================== */

#tpkDetailBox{
    display:none;

    margin-top:13px;

    background:#f7faf8;

    border:1px solid #dfe8e2;

    border-radius:11px;

    padding:12px;
}

#tpkDetailBox.show{
    display:block;
}

.tpk-detail-title{
    font-size:12px;

    font-weight:900;

    color:#34453b;

    margin-bottom:8px;
}

.tpk-detail-list{
    display:flex;

    flex-direction:column;

    gap:7px;
}

.tpk-detail-item{
    background:white;

    border:1px solid #e1e9e4;

    border-radius:9px;

    padding:9px 11px;
}

.tpk-detail-name{
    font-size:13px;

    font-weight:900;

    color:#176b3a;
}

.tpk-detail-info{
    display:flex;

    justify-content:space-between;

    gap:10px;

    margin-top:4px;

    font-size:11px;

    font-weight:800;

    color:#66766d;
}

.tpk-detail-volume{
    color:#2563eb;
}


/* =====================================================
   SECTION
===================================================== */

.section{
    margin-top:15px;
}

.section-head{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-bottom:8px;
}

.section-title-main{
    font-size:13px;

    font-weight:900;

    color:#34453b;
}

.badge{
    background:#edf2ef;

    color:#607068;

    border-radius:999px;

    padding:5px 9px;

    font-size:10px;

    font-weight:900;
}


/* =====================================================
   REGISTER LIST
===================================================== */

.register-list{
    display:flex;

    flex-direction:column;

    gap:7px;
}

.register-item{
    display:flex;

    flex-wrap:wrap;

    align-items:center;

    gap:0;

    background:#f9fbfa;

    border:1px solid #e0e8e3;

    border-radius:10px;

    padding:10px 11px;

    transition:
        background .15s ease,
        border-color .15s ease;
}

.register-item:hover{
    background:#f4f8f5;
}

.register-main{
    width:100%;

    display:flex;

    align-items:center;

    gap:9px;
}

.register-item input{
    width:19px;
    height:19px;

    accent-color:#176b3a;

    cursor:pointer;

    flex-shrink:0;
}

.register-number{
    font-family:Arial,Helvetica,sans-serif;

    font-size:16px;

    font-weight:700;

    letter-spacing:.2px;

    flex:1;

    color:#202c25;
}

.register-item.checked{
    background:#eff9f2;

    border-color:#bfe0ca;
}

.register-item.checked .register-number{
    color:#176b3a;
}

.register-actions{
    display:flex;

    align-items:center;

    gap:6px;

    margin-left:auto;

    flex-shrink:0;
}

.check-status{
    font-size:10px;

    font-weight:800;

    color:#169447;

    white-space:nowrap;
}

.btn-detail{
    border:none;

    background:#176b3a;

    color:white;

    padding:7px 10px;

    border-radius:7px;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

    white-space:nowrap;
}

.btn-detail.detail-button-olah{
    background:#c62828;
}

.btn-detail.detail-button-persediaan{
    background:#2563eb;
}

.btn-detail:active{
    transform:scale(.96);
}


/* =====================================================
   DETAIL REGISTER
===================================================== */

.detail-register-box{
    flex:0 0 100%;

    display:none;

    margin-top:9px;

    padding:10px 11px;

    background:white;

    border:1px solid #dce8e0;

    border-radius:9px;

    font-size:13px;

    line-height:1.7;
}

.detail-register-box.show{
    display:block;
}

.detail-register-row{
    display:flex;

    gap:10px;

    padding:3px 0;

    align-items:center;
}

.detail-register-label{
    width:105px;

    flex-shrink:0;

    font-size:12px;

    font-weight:700;

    color:#718078;

    display:flex;

    align-items:center;
}

.detail-register-value{
    font-size:13px;

    font-weight:600;

    color:#176b3a;

    word-break:break-word;

    line-height:1.4;
}


/* =====================================================
   HISTORY
===================================================== */

.history-list{
    display:flex;

    flex-direction:column;

    gap:8px;
}

.history-item{
    background:#f9fbfa;

    border:1px solid #e0e8e3;

    border-radius:11px;

    overflow:hidden;
}

.history-head{
    padding:12px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    cursor:pointer;
}

.history-date{
    font-size:14px;

    font-weight:900;

    color:#26362d;
}

.history-taken{
    font-size:12px;

    color:#c62828;

    font-weight:800;

    margin-top:3px;
}

.history-arrow{
    font-size:17px;

    color:#718078;

    transition:.2s;
}

.history-item.open .history-arrow{
    transform:rotate(180deg);
}

.history-detail{
    display:none;

    padding:0 12px 12px;

    border-top:1px solid #e1e8e3;
}

.history-item.open .history-detail{
    display:block;
}

.detail-title{
    font-size:11px;

    color:#7a8880;

    font-weight:700;

    margin:11px 0 7px;
}

.history-detail .detail-register{
    display:block;

    font-family:monospace;

    font-size:14px;

    font-weight:800;

    padding:7px 0;

    border-bottom:1px dashed #ccd8d0;
}

.history-detail .detail-register:last-child{
    border-bottom:0;
}


/* =====================================================
   HISTORY REGISTER DETAIL
===================================================== */

.history-register-item{
    background:white;

    border:1px solid #e0e8e3;

    border-radius:9px;

    padding:9px 10px;

    margin-top:7px;
}

.history-register-main{
    display:flex;

    align-items:center;

    gap:8px;
}

.history-register-number{
    flex:1;

    font-family:Arial,Helvetica,sans-serif;

    font-size:15px;

    font-weight:700;

    color:#202c25;

    word-break:break-word;
}

.history-detail-button{
    border:none;

    background:#2563eb;

    color:white;

    padding:6px 9px;

    border-radius:7px;

    font-size:10px;

    font-weight:800;

    cursor:pointer;

    white-space:nowrap;
}

.history-detail-button:active{
    transform:scale(.96);
}

.history-register-detail{
    display:none;

    margin-top:8px;

    padding:9px 10px;

    background:#f8faf9;

    border:1px solid #dce8e0;

    border-radius:8px;

    font-size:12px;

    line-height:1.7;
}

.history-register-detail.show{
    display:block;
}

.history-detail-row{
    display:flex;

    align-items:center;

    gap:6px;

    padding:3px 0;
}

.history-detail-label{
    width:75px;

    flex-shrink:0;

    font-weight:800;

    color:#65746c;
}

.history-detail-value{
    flex:1;

    font-size:14px;

    font-weight:800;

    color:#202c25;

    word-break:break-word;
}


/* =====================================================
   BUTTON BAWAH
===================================================== */

.bottom-buttons{
    display:flex;

    gap:8px;

    margin-top:14px;
}

.bottom-buttons button{
    flex:1;
}

.btn-refresh{
    background:#176b3a;

    color:white;
}

.btn-back{
    background:#64746b;

    color:white;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
    background:#f8faf9;

    border:1px dashed #cbd8d0;

    color:#718078;

    border-radius:10px;

    padding:14px;

    text-align:center;

    font-size:12px;

    font-weight:700;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
    text-align:center;

    color:#9aa7a0;

    font-size:10px;

    font-weight:700;

    margin:17px 0 5px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:500px){

    .container{
        padding:10px;
    }

    .header{
        padding:12px 13px;
    }

    .header img{
        width:68px;
        height:68px;
    }

    .header h1{
        font-size:23px;
    }

    .scanner-card,
    .result-card{
        padding:14px;
    }

    .camera-box{
        height:300px;
    }
}

@media(max-width:380px){

    .container{
        padding:8px;
    }

    .header{
        gap:10px;
    }

    .header img{
        width:60px;
        height:60px;
    }

    .header h1{
        font-size:20px;
    }

    .header .sub{
        font-size:10px;
    }

    .camera-box{
        height:280px;
    }

    .qr-frame,
    .qr-indicator,
    .scan-success{
        width:210px;
        height:210px;
    }

    .register-number{
        font-size:14px;
    }

    .check-status{
        font-size:9px;
    }

    .btn-detail{
        font-size:10px;
        padding:6px 8px;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- =================================================
     HEADER
================================================= -->

<div class="header">

    <img
        src="logo-perhutani.jpg"
        alt="Perhutani"
    >

    <div class="header-text">

        <h1>CEK TUMPUK</h1>

        <div class="sub">
            IK SARADAN
        </div>

    </div>

</div>


<!-- =================================================
     SCANNER CARD
================================================= -->

<div class="scanner-card">

    <div class="section-title">
        🔎 CARI NOMOR TUMPUK
    </div>

    <div class="manual-row">

        <input
            type="text"
            id="manualInput"
            placeholder="Masukkan nomor TUMPUK"
            autocomplete="off"
        >

        <button
            class="btn btn-search"
            type="button"
            onclick="prosesManual()"
        >
            CARI
        </button>

    </div>


    <button
        id="cameraToggleBtn"
        class="btn btn-camera"
        type="button"
        onclick="toggleKamera()"
    >
        📷 BUKA KAMERA
    </button>


    <!-- =================================================
         CAMERA
    ================================================= -->

    <div id="cameraSection">

        <div class="camera-box">

            <video
                id="video"
                autoplay
                muted
                playsinline
            ></video>

            <div class="qr-frame"></div>

            <div class="qr-indicator"></div>

            <div
                id="scanBerhasil"
                class="scan-success"
            ></div>

        </div>

    </div>


    <div
        id="scanStatus"
        class="scan-status"
    >
        Ketik nomor TUMPUK atau buka kamera untuk scan.
    </div>

</div>


<!-- =================================================
     LOADING
================================================= -->

<div id="loading">
    MEMUAT DATA...
</div>


<!-- =================================================
     ERROR
================================================= -->

<div id="errorBox"></div>


<!-- =================================================
     RESULT
================================================= -->

<div id="result">

    <div class="result-card">

        <div
            id="tumpukTitle"
            class="tumpuk-title"
        >
            TUMPUK -
        </div>

        <div
            id="tpkTitle"
            class="tpk-title"
        >
            TPK ASAL : -
        </div>


        <!-- =================================================
             SUMMARY
        ================================================= -->
<div
    id="filterBulan"
    style="
        margin:10px 0;
        text-align:center;
    "
>
    <select
        id="bulanSisa"
        onchange="bulanSisaAktif = this.value; ambilDataTumpuk(true)"
        style="
            width:100%;
            padding:10px;
            border-radius:8px;
            border:1px solid #ccc;
            font-size:15px;

/* =====================================================

async function mulaiScanner(){

    hideError();


    const cameraSection =
        document.getElementById(
            "cameraSection"
        );


    const cameraButton =
        document.getElementById(
            "cameraToggleBtn"
        );


    cameraSection.style.display =

    );

            new ZXingBrowser.BrowserMultiFormatReader(

                80
            );


        const video =
            document.getElementById(
                "video"
            );


        const constraints = {

            video:{
                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                },

                frameRate:{
                    ideal:30
                },

                focusMode:"continuous"

            }

        };


        scannerControls =
            await scannerReader.decodeFromConstraints(
                constraints,
                video,
                function(result){

                    if(
                        !result ||
                        sedangProses

                        return;

                    const kode =
                        result.getText();


                    if(!kode){

/* =====================================================
   TUTUP KAMERA
   PERBAIKAN AGAR BISA SCAN BERULANG
===================================================== */

function tutupKamera(){

    try{

        /*
         * HENTIKAN CONTROL ZXING
         */
        if(scannerControls){

            try{

                scannerControls.stop();

            }
            catch(error){

                console.log(
                    "Stop scanner:",
                    error
                );

            }

        }


        /*
         * RESET READER ZXING
         * Supaya instance lama tidak mengunci kamera.
         */
        if(scannerReader){

            try{

                if(
                    typeof scannerReader.reset ===
                    "function"
                ){

                    scannerReader.reset();

                }

            }
            catch(error){

                console.log(
                    "Reset scanner:",
                    error
                );

            }

        }

    }
    catch(error){

        console.log(
            "Tutup scanner:",
            error
        );

    }


    /*
     * AMBIL VIDEO
     */
    const video =
        document.getElementById(
            "video"
        );


    /*
     * MATIKAN SEMUA TRACK KAMERA
     */
    if(video){

        try{

            const stream =
                video.srcObject;


            if(stream){

                const tracks =
                    stream.getTracks();


                tracks.forEach(
                    function(track){

                        try{

                            track.stop();

                        }
                        catch(error){

                            console.log(
                                "Stop track:",
                                error
                            );

                        }

                    }
                );

            }

        }
        catch(error){

            console.log(
                "Stop video stream:",
                error
            );

        }


        /*
         * LEPAS STREAM DARI VIDEO
         */
        video.pause();


        video.srcObject =
            null;

    }


    /*
     * HAPUS INSTANCE LAMA
     */
    scannerControls =
        null;


    scannerReader =
        null;


    kameraAktif =
        false;


    /*
     * SEMBUNYIKAN CAMERA SECTION
     */
    const cameraSection =
        document.getElementById(
            "cameraSection"
        );


    if(cameraSection){

        cameraSection.style.display =
            "none";

    }


    /*
     * KEMBALIKAN TOMBOL
     */
    const button =
        document.getElementById(
            "cameraToggleBtn"
        );


    if(button){

        button.textContent =
            "📷 BUKA KAMERA";


        button.classList.remove(
            "close"
        );

    }


    /*
     * STATUS
     */
    if(!sedangProses){

        const scanStatus =
            document.getElementById(
                "scanStatus"
            );


        if(scanStatus){

            scanStatus.textContent =
                "Kamera ditutup. Ketik nomor TUMPUK atau buka kamera untuk scan.";

        }

    }

}

/* =====================================================
   BUNYI
===================================================== */

function bunyiBerhasil(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if(!AudioContext){

            return;

        }


        const context =
            new AudioContext();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            1400;


        gain.gain.setValueAtTime(
            0.15,
            context.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            context.currentTime + 0.15
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            context.destination
        );


        oscillator.start();


        oscillator.stop(
            context.currentTime + 0.15
        );

    }
    catch(error){

        console.log(error);

    }

}


/* =====================================================
   GETAR
===================================================== */

function getarBerhasil(){

    try{

}


/* =====================================================
   OPTIMALKAN KAMERA
===================================================== */

function optimalkanKamera(
    video
){

    try{

        if(
            !video ||
            !video.srcObject
        ){

            return;

        }


        const tracks =
            video
            .srcObject
            .getVideoTracks();


        if(!tracks.length){

            return;

        }


        const track =
            tracks[0];


        const capabilities =
            track.getCapabilities
            ?
            track.getCapabilities()
            :
            {};


        const advanced = {};


        if(
            capabilities.focusMode &&
            capabilities.focusMode.includes(
                "continuous"
            )
        ){

            advanced.focusMode =
                "continuous";

        }


        if(
            capabilities.exposureMode &&
            capabilities.exposureMode.includes(
                "continuous"
            )
        ){

            advanced.exposureMode =
                "continuous";

        }


        if(
            capabilities.whiteBalanceMode &&
            capabilities.whiteBalanceMode.includes(
                "continuous"
            )
        ){

            advanced.whiteBalanceMode =
                "continuous";

        }


        if(
            Object.keys(advanced).length
        ){

            track.applyConstraints({
                advanced:[
                    advanced
                ]
            })
            .catch(
                function(error){

                    console.log(
                        "Optimasi kamera:",
                        error
                    );

                }
            );

        }

    }
    catch(error){

        console.log(error);

    }

}

/* =====================================================
   PROSES KODE TUMPUK
===================================================== */

function prosesKodeTumpuk(
    kode
){

    hideError();


    kode =
        String(kode || "")
        .trim();

    console.log(
        "HASIL SCAN TUMPUK:",
        kode
    );

   tampilkanIndikatorHijau();
bunyiBerhasil();
getarBerhasil();

    /* ================================================
       FORMAT LINK QR TUMPUK
    ================================================ */

    if(
        kode.indexOf(
            "cek-tumpuk.html?"
        ) !== -1
    ){

        try{

            const url =
                new URL(kode);


            const urlTPK =
                url.searchParams.get(
                    "tpk"
                );


            const urlTumpuk =
                url.searchParams.get(
                    "tumpuk"
                );


            if(
                urlTumpuk
            ){

                currentTPK =
                    urlTPK
                    ?
                    String(urlTPK).trim()
                    :
                    "";


                currentTumpuk =
                    String(
                        urlTumpuk
                    ).trim();


                if(
                    currentTumpuk === "29"
                ){

                    currentTPK =
                        "";

                    currentStackId =
                        "TUMPUK|29";

                }
                else{

                    currentStackId =
                        currentTPK +
                        "|" +
                        currentTumpuk;

                }


                ambilDataTumpuk();


                return;

            }

        }
        catch(error){

            console.error(
                "LINK TUMPUK TIDAK VALID:",
                error
            );

        }

    }


    /* ================================================
       FORMAT TPK|TUMPUK
    ================================================ */

    if(
        kode.includes("|")
    ){

        const p =
            kode.split("|");


        if(
            p.length >= 2
        ){

            currentTPK =
                String(
                    p[0]
                ).trim();


            currentTumpuk =
                String(
                    p[1]
                )
                .replace(
                    /^TUMPUK/i,
                    ""
                )
                .replace(
                    /^T/i,
                    ""
                )
                .trim();

        }

    }


    /* ================================================
       FORMAT TPK-T45
    ================================================ */

    const match =
        kode.match(
            /^(.+?)-T?(\d+)$/i
        );


    if(
        match
    ){

        currentTPK =
            String(
                match[1]
            ).trim();


        currentTumpuk =
            String(
                match[2]
            ).trim();

    }


    /* ================================================
       NOMOR SAJA
    ================================================ */

    if(
        /^\d+$/.test(kode)
    ){

        cariTumpukDenganNomor(
            kode
        );

        return;

    }


    if(
        !currentTumpuk
    ){

        showError(
            "Kode TUMPUK tidak valid."
        );


        sedangProses =
            false;


        return;

    }


    /* ================================================
       STACK ID
    ================================================ */

    if(
        String(currentTumpuk) === "29"
    ){

        currentTPK =
            "";

        currentStackId =
            "TUMPUK|29";

    }
    else{

        currentStackId =
            currentTPK +
            "|" +
            currentTumpuk;

    }


    /* =================================================
       AMBIL DATA
    ================================================= */

    ambilDataTumpuk();

}

/* =====================================================
   AMBIL DATA TUMPUK
   OPTIMASI REQUEST SAJA
   FUNGSI SCAN TIDAK DIUBAH
===================================================== */

function ambilDataTumpuk(
    tampilkanLoading = true,
    bulan = bulanSisaAktif
){

    if(tampilkanLoading){
        showLoading();
    }

    const callbackName =
        "callbackTumpuk_" +
        Date.now();

    let timeoutId = null;
    let script = null;
    let selesai = false;


    window[callbackName] =
        function(response){

            // Cegah callback ganda
            if(selesai){
                return;
            }

            selesai = true;

            try{

                hideLoading();


                const berhasil =
                    response &&
                    (
                        response.ok === "success" ||
                        response.ok === true ||
                        response.status === "success" ||
                        response.success === true
                    );


                if(!berhasil){

                    showError(
                        response &&
                        (
                            response.message ||
                            response.error
                        )
                        ?
                        (
                            response.message ||
                            response.error
                        )
                        :
                        "Backend tidak mengembalikan data TUMPUK."
                    );


                    sedangProses =
                        false;

                    return;
                }


                if(
                    !response.data ||
                    typeof response.data !== "object"
                ){

                    showError(
                        "Format data TUMPUK tidak sesuai."
                    );


                    sedangProses =
                        false;

                    return;
                }


                /*
                 * TETAP SAMA
                 * HASIL REQUEST LANGSUNG KE FUNGSI LAMA
                 */
                tampilkanData(
                    response.data
                );


                sedangProses =
                    false;

            }
            catch(error){

                console.error(error);


                showError(
                    "Terjadi kesalahan saat menampilkan data."
                );


                sedangProses =
                    false;

            }
            finally{

                if(timeoutId){

                    clearTimeout(
                        timeoutId
                    );

                    timeoutId = null;

                }


                cleanupJSONP(
                    callbackName,
                    script
                );

            }

        };


    /*
     * ACTION TETAP SAMA
     */
    const action =
        bulan
            ? "sisa"
            : "getTumpukData";


    /*
     * PARAMETER TETAP SAMA
     */
    const url =
        API_URL +
        "?action=" +
        action +
        "&tpk=" +
        encodeURIComponent(
            currentTPK
        ) +
        "&tumpuk=" +
        encodeURIComponent(
            currentTumpuk
        ) +
        (
            bulan
                ? "&bulan=" +
                  encodeURIComponent(
                      bulan
                  )
                : ""
        ) +
        "&callback=" +
        callbackName +
        "&_=" +
        Date.now();


    console.log(
        "REQUEST TUMPUK:",
        currentTPK,
        currentTumpuk,
        currentStackId
    );


    /*
     * SCRIPT JSONP
     */
    script =
        document.createElement(
            "script"
        );

    script.src =
        url;

    script.async =
        true;


    script.onerror =
        function(){

            if(selesai){
                return;
            }

            selesai = true;


            if(timeoutId){

                clearTimeout(
                    timeoutId
                );

                timeoutId = null;

            }


            hideLoading();


            showError(
                "Gagal menghubungi backend CEK TUMPUK."
            );


            sedangProses =
                false;


            cleanupJSONP(
                callbackName,
                script
            );

        };


    /*
     * REQUEST LANGSUNG
     */
    document.body.appendChild(
        script
    );


    /*

     */
    timeoutId =
        setTimeout(
            function(){

                if(selesai){

                    callbackName,

                );


                hideLoading();

        );

buatBarisDetail(

function formatTanggalPengolahan(
    item
){

    const nilai =
        item &&
        item.tglOlah !== undefined
        ?
        item.tglOlah
        :
        "";

    if(!nilai){
        return "-";
    }

    const tanggal =
        new Date(nilai);

    if(
        isNaN(
            tanggal.getTime()
        )
    ){
        return String(nilai);
    }

    return (
        String(
            tanggal.getDate()
        ).padStart(2,"0") +
        "-" +
        String(
            tanggal.getMonth() + 1
        ).padStart(2,"0") +
        "-" +
        tanggal.getFullYear()
    );

}
   
   /* =====================================================
   AMBIL FIELD DETAIL
===================================================== */

function ambilFieldDetail(
    item,
    fields
){

    for(
        let i = 0;
        i < fields.length;
        i++
    ){

        const key =
            fields[i];


        if(
            item &&
            item[key] !== undefined &&
            item[key] !== null &&
            item[key] !== ""
        ){

            return String(
                item[key]
            );

        }

    }


    return "-";

}


/* =====================================================
   BUAT BARIS DETAIL
===================================================== */

function buatBarisDetail(
    label,
    value
){

    return (

        '<div class="detail-register-row">' +

            '<div class="detail-register-label">' +
                escapeHtml(label) +
            '</div>' +

            '<div class="detail-register-value">' +
                escapeHtml(value) +
            '</div>' +

        '</div>'

    );

}


/* =====================================================
   FORMAT VOLUME 3 ANGKA
===================================================== */

function formatVolume3(
    value
){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "0,000";

    }


    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return String(value);

    }


    return number
        .toFixed(3)
        .replace(
            ".",
            ","
        );

}


/* =====================================================
   CHECKBOX
===================================================== */

function setCheckbox(
    register,
    checked,
    wrapper,
    status
){

    const checkbox =
        wrapper.querySelector(
            'input[type="checkbox"]'
        );


    const previousChecked =
        !checked;


    if(checked){

        wrapper.classList.add(
            "checked"
        );

    }
    else{

        wrapper.classList.remove(
            "checked"
        );

    }


    status.textContent =
        "MENYIMPAN...";


    let stackId =
        currentStackId;


    if(!stackId){

        stackId =
            String(currentTumpuk) === "29"
            ?
            "TUMPUK|29"
            :
            currentTPK +
            "|" +
            currentTumpuk;

    }


    const callbackName =
        "callbackCek_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random()*1000
        );


    let script = null;
    let timeoutId = null;


    window[callbackName] =
        function(data){

            if(timeoutId){

                clearTimeout(
                    timeoutId
                );

            }


            const berhasil =
                data &&
                (
                    data.ok === "success" ||
                    data.ok === true ||
                    data.status === "success" ||
                    data.success === true
                );


            if(berhasil){

                status.textContent =
                    checked
                    ?
                    "SUDAH DICEK"
                    :
                    "";


                if(checked){

                    wrapper.classList.add(
                        "checked"
                    );

                }
                else{

                    wrapper.classList.remove(
                        "checked"
                    );

                }

            }
            else{

                status.textContent =
                    "GAGAL";


                checkbox.checked =
                    previousChecked;


                if(previousChecked){

                    wrapper.classList.add(
                        "checked"
                    );

                }
                else{

                    wrapper.classList.remove(
                        "checked"
                    );

                }

            }


            updateJumlahCek();


            cleanupJSONP(
                callbackName,
                script
            );

        };


    const url =
        API_URL +
        "?action=setCek" +
        "&stackId=" +
        encodeURIComponent(
            stackId
        ) +
        "&register=" +
        encodeURIComponent(
            register
        ) +
        "&checked=" +
        encodeURIComponent(
            checked
        ) +
        "&callback=" +
        callbackName +
        "&_=" +
        Date.now();


    script =
        document.createElement(
            "script"
        );


    script.src =
        url;


    script.onerror =
        function(){

            if(timeoutId){

                clearTimeout(
                    timeoutId
                );

            }


            status.textContent =
                "GAGAL";


            checkbox.checked =
                previousChecked;


            if(previousChecked){

                wrapper.classList.add(
                    "checked"
                );

            }
            else{

                wrapper.classList.remove(
                    "checked"
                );

            }


            updateJumlahCek();


            cleanupJSONP(
                callbackName,
                script
            );

        };


    document
        .body
        .appendChild(
            script
        );


    timeoutId =
        setTimeout(
            function(){

                if(
                    document.body.contains(
                        script
                    )
                ){

                    status.textContent =
                        "GAGAL";


                    checkbox.checked =
                        previousChecked;


                    if(previousChecked){

                        wrapper.classList.add(
                            "checked"
                        );

                    }
                    else{

                        wrapper.classList.remove(
                            "checked"
                        );

                    }


                    updateJumlahCek();


                    cleanupJSONP(
                        callbackName,
                        script
                    );

                }

            },
            15000
        );

}

/* =====================================================

===================================================== */

function buatBarisHistoryDetail(
    label,
    value
){

    const row =

            "div"
        );


    row.className =
        "history-detail-row";


    const labelEl =
        document.createElement(
            "div"
        );


    labelEl.className =
        "history-detail-label";


    labelEl.textContent =
        label;


    const valueEl =
        document.createElement(
            "div"
        );


    valueEl.className =
        "history-detail-value";


    valueEl.textContent =
        value;


    row.appendChild(
        labelEl
    );


    row.appendChild(
        valueEl
    );


    return row;

}


/* =====================================================
   NORMALISASI TANGGAL HISTORY
===================================================== */

function normalisasiTanggalHistory(
    value
){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "-";

    }


    const text =
        String(value).trim();


    if(
        /^\d{4}-\d{2}-\d{2}T/.test(text)
    ){

        return text.substring(
            0,
            10
        );

    }


    if(
        /^\d{4}-\d{1,2}-\d{1,2}$/.test(text)
    ){

        const p =
            text.split("-");


        return (
            String(p[0]) +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            String(p[2]).padStart(2,"0")
        );

    }


    if(
        /^\d{1,2}-\d{1,2}-\d{4}$/.test(text)
    ){

        const p =
            text.split("-");


        return (
            String(p[2]) +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            String(p[0]).padStart(2,"0")
        );

    }


    if(
        /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(text)
    ){

        const p =
            text.split("/");


        return (
            String(p[2]) +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            String(p[0]).padStart(2,"0")
        );

    }


    if(
        /^\d{4}\/\d{1,2}\/\d{1,2}$/.test(text)
    ){

        const p =
            text.split("/");


        return (
            String(p[0]) +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            String(p[2]).padStart(2,"0")
        );

    }


    const d =
        new Date(text);


    if(
        !Number.isNaN(
            d.getTime()
        )
    ){

        return (
            String(
                d.getFullYear()
            ) +
            "-" +
            String(
                d.getMonth()+1
            ).padStart(2,"0") +
            "-" +
            String(
                d.getDate()
            ).padStart(2,"0")
        );

    }


    return text;

}


/* =====================================================
   FORMAT TANGGAL HISTORY
===================================================== */

function formatTanggalHistory(
    value
){

    const key =
        normalisasiTanggalHistory(
            value
        );


    if(
        !key ||
        key === "-"
    ){

        return "-";

    }


    const match =
        String(key).match(
            /^(\d{4})-(\d{2})-(\d{2})$/
        );


    if(match){

        return (
            match[3] +
            "-" +
            match[2] +
            "-" +
            match[1]
        );

    }


    return String(value);

}

/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatAngka(
    value
){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "0";

    }


    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return value;

    }


    return number.toLocaleString(
        "id-ID"
    );

}


/* =====================================================
   FORMAT VOLUME
===================================================== */

function formatVolume(
    value
){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "0 m³";

    }


    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return value + " m³";

    }


    return number.toLocaleString(
        "id-ID",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:6
        }
    ) + " m³";

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(
    value
){

    if(!value){

        return "-";

    }


    if(
        typeof value === "string" &&
        /^\d{1,2}-\d{1,2}-\d{4}$/.test(
            value
        )
    ){

        return value;

    }


    if(
        typeof value === "string" &&
        /^\d{4}-\d{1,2}-\d{1,2}$/.test(
            value
        )
    ){

        const p =
            value.split("-");


        return (
            String(p[2]).padStart(2,"0") +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            p[0]
        );

    }


    const d =
        new Date(value);


    if(
        !Number.isNaN(
            d.getTime()
        )
    ){

        return (
            String(
                d.getDate()
            ).padStart(2,"0") +
            "-" +
            String(
                d.getMonth()+1
            ).padStart(2,"0") +
            "-" +
            d.getFullYear()
        );

    }


    return value;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
