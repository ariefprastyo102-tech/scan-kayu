<head>

content="width=device-width, initial-scale=1.0">

<style>

/* =====================================================
   DASAR
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f1f5f9;
    font-family:Arial, Helvetica, sans-serif;
    color:#111827;
}

.container{
    width:100%;
    max-width:600px;
    margin:0 auto;
    padding:16px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    background:#ffffff;
    border:1px solid #d1fae5;
    border-top:5px solid #15803d;
    border-bottom:5px solid #15803d;
    border-radius:18px;
    padding:12px 15px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
}
.header img{
    width:90px;
    height:90px;
    object-fit:contain;
    flex-shrink:0;
}
.header h1{
    margin:0;
    font-size:28px;
    font-weight:900;
    color:#166534;
}

.header .sub{
    margin-top:3px;
    font-size:14px;
    font-weight:800;
    color:#64748b;
}


/* =====================================================
   SCANNER
===================================================== */

.scanner-card{
    background:#ffffff;
    border-radius:16px;
    padding:15px;
    margin-top:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
}

.section-title{
    font-size:14px;
    font-weight:900;
    color:#334155;
    margin-bottom:9px;
}

.manual-row{
    display:flex;
    gap:8px;
}

.manual-row input{
    flex:1;
    min-width:0;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

.manual-row input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 2px rgba(37,99,235,.1);
}

.btn{
    border:none;
    border-radius:9px;
    padding:11px 14px;
    font-weight:800;
    cursor:pointer;
}

.btn-search{
    background:#2563eb;
    color:white;
}

.btn-camera{
    width:100%;
    margin-top:10px;
    background:#15803d;
    color:white;
}

.btn-camera.close{
    background:#dc2626;
}


/* =====================================================
   CAMERA
===================================================== */

#cameraSection{
    display:none;
    margin-top:12px;
}

.camera-box{
    position:relative;
    width:100%;
    max-width:500px;
    height:300px;
    margin:0 auto;
    overflow:hidden;
    background:#000;
    border-radius:14px;
}

#video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.qr-frame{
    position:absolute;
    left:50%;
    top:50%;
    width:220px;
    height:220px;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

.qr-frame::before,
.qr-frame::after{
    content:"";
    position:absolute;
    width:40px;
    height:40px;
    border-color:#22c55e;
    border-style:solid;
}

.qr-frame::before{
    top:0;
    left:0;
    border-width:4px 0 0 4px;
}

.qr-frame::after{
    right:0;
    bottom:0;
    border-width:0 4px 4px 0;
}

.qr-indicator{
    position:absolute;
    left:50%;
    top:50%;
    width:220px;
    height:220px;
    transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.25);
    border-radius:10px;
    pointer-events:none;
}

.scan-success{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:220px;
    height:220px;
    border:5px solid #22c55e;
    border-radius:12px;
    display:none;
    pointer-events:none;
    box-shadow:0 0 25px rgba(34,197,94,.65);
}

.scan-success.show{
    display:block;
}


/* =====================================================
   STATUS
===================================================== */

.scan-status{
    margin-top:9px;
    text-align:center;
    font-size:12px;
    color:#64748b;
    font-weight:700;
}


/* =====================================================
   LOADING
===================================================== */

#loading{
    display:none;
    background:#ffffff;
    margin-top:14px;
    padding:18px;
    border-radius:14px;
    text-align:center;
    font-weight:800;
    color:#2563eb;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
}

#loading.show{
    display:block;
}


/* =====================================================
   ERROR
===================================================== */

#errorBox{

    margin-top:14px;
    background:#fef2f2;
    border:1px solid #fecaca;
    color:#b91c1c;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
}

#errorBox.show{
    display:block;
}


/* =====================================================
   RESULT
===================================================== */

#result{
    display:none;
    margin-top:14px;
}

#result.show{
    display:block;
}

.result-card{
    background:#ffffff;
    border-radius:16px;

}

.tumpuk-title{

    font-size:28px;
    font-weight:900;
    color:#166534;
}

.tpk-title{
    text-align:center;
    margin-top:3px;
    font-size:14px;
    font-weight:800;
    color:#64748b;
}


/* =====================================================
   RINGKASAN
===================================================== */

.summary-grid{
    display:grid;

    gap:10px;
    margin-top:14px;
}

.summary-box{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:12px;

}

.jumlah-utama{

}

.jumlah-utama .summary-label{

}

.jumlah-angka{

    line-height:1;
    font-weight:900;

}

.summary-label{

    font-weight:800;
}

.summary-value{

}

<body>

<div class="container">

<script>

/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


/* =====================================================
   VARIABEL
===================================================== */

let scannerControls = null;
let scannerReader = null;
let kameraAktif = false;
let sedangProses = false;

let currentTPK = "";
let currentTumpuk = "";
let currentStackId = "";
let currentRegisters = [];


/* =====================================================
   LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const params =
            new URLSearchParams(
                window.location.search
            );

        const tpk =
            params.get("tpk");

        const tumpuk =
            params.get("tumpuk");


        if(tumpuk){

            currentTumpuk =
                String(tumpuk);

            if(
                String(currentTumpuk) === "29"
            ){

                currentTPK = "";

                currentStackId =
                    "TUMPUK|29";

            }
            else{

                currentTPK =
                    tpk
                    ?
                    String(tpk)
                    :
                    "";

                currentStackId =
                    currentTPK +
                    "|" +
                    currentTumpuk;

            }


            document
    .getElementById("scanStatus")
    .textContent = "";


            ambilDataTumpuk();

        }
        else{

            document
                .getElementById("scanStatus")
                .textContent =
                "Ketik nomor TUMPUK atau buka kamera untuk scan.";

        }


        document
            .getElementById("manualInput")
            .addEventListener(
                "keydown",
                function(event){

                    if(
                        event.key === "Enter"
                    ){

                        prosesManual();

                    }

                }
            );

    }
);


/* =====================================================
   TOGGLE KAMERA
===================================================== */

function toggleKamera(){

    if(kameraAktif){

        tutupKamera();

    }
    else{

        mulaiScanner();

    }

}


/* =====================================================
   MULAI SCANNER
===================================================== */

async function mulaiScanner(){

    hideError();


    const cameraSection =
        document.getElementById(
            "cameraSection"
        );


    const cameraButton =
        document.getElementById(
            "cameraToggleBtn"
        );


    cameraSection.style.display =
        "block";


    cameraButton.textContent =
        "✕ TUTUP KAMERA";


    cameraButton.classList.add(
        "close"
    );


    try{

        scannerReader =
            new ZXingBrowser.BrowserMultiFormatReader(
                undefined,
                80
            );


        const video =
            document.getElementById(
                "video"
            );


        const constraints = {

            video:{
                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                },

                frameRate:{
                    ideal:30
                },

                focusMode:"continuous"

            }

        };


        scannerControls =
            await scannerReader.decodeFromConstraints(
                constraints,
                video,
                function(result){

                    if(
                        !result ||
                        sedangProses
                    ){

                        return;

                    }


                    const kode =
                        result.getText();


                    if(!kode){

                        return;

                    }


                    sedangProses =
                        true;


                    tampilkanIndikatorHijau();

                    bunyiBerhasil();

                    getarBerhasil();


                    document
                        .getElementById("scanStatus")
                        .textContent =
                        "BARCODE TERBACA";


                    tutupKamera();


                    prosesKodeTumpuk(
                        kode
                    );

                }
            );


        kameraAktif =
            true;


        document
            .getElementById("scanStatus")
            .textContent =
            "Kamera aktif. Arahkan QR ke kotak.";


        setTimeout(
            function(){

                optimalkanKamera(
                    video
                );

            },
            500
        );

    }
    catch(error){

        console.error(error);


        kameraAktif =
            false;

        scannerControls =
            null;

        scannerReader =
            null;


        cameraSection.style.display =
            "none";


        cameraButton.textContent =
            "📷 BUKA KAMERA";


        cameraButton.classList.remove(
            "close"
        );


        showError(
            "Kamera tidak dapat dibuka. Pastikan izin kamera sudah diberikan."
        );


        document
            .getElementById("scanStatus")
            .textContent =
            "Kamera tidak aktif.";


        sedangProses =
            false;

    }

}


/* =====================================================
   TUTUP KAMERA
===================================================== */

function tutupKamera(){

    try{

        if(
            scannerControls
        ){

            scannerControls.stop();

        }

    }
    catch(error){

        console.log(error);

    }


    scannerControls =
        null;


    scannerReader =
        null;


    const video =
        document.getElementById(
            "video"
        );


    if(video){

        try{

            const stream =
                video.srcObject;


            if(stream){

                stream
                    .getTracks()
                    .forEach(
                        function(track){

                            track.stop();

                        }
                    );

            }

        }
        catch(error){

            console.log(error);

        }


        video.srcObject =
            null;

    }


    kameraAktif =
        false;


    document
        .getElementById(
            "cameraSection"
        )
        .style.display =
        "none";


    const button =
        document.getElementById(
            "cameraToggleBtn"
        );


    button.textContent =
        "📷 BUKA KAMERA";


    button.classList.remove(
        "close"
    );


    if(!sedangProses){

        document
            .getElementById("scanStatus")
            .textContent =
            "Kamera ditutup. Ketik nomor TUMPUK atau buka kamera untuk scan.";

}

/* =====================================================
   BUNYI
===================================================== */

function bunyiBerhasil(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if(!AudioContext){

            return;

        }


        const context =
            new AudioContext();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            1400;


        gain.gain.setValueAtTime(
            0.15,
            context.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            context.currentTime + 0.15
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            context.destination
        );


        oscillator.start();


        oscillator.stop(
            context.currentTime + 0.15
        );

    }
    catch(error){

        console.log(error);

    }

}

    catch(error){

/* =====================================================
   OPTIMALKAN KAMERA
===================================================== */

function optimalkanKamera(
    video
){

    try{

        if(
            !video ||
            !video.srcObject
        ){

            return;

        }


        const tracks =
            video
            .srcObject
            .getVideoTracks();


        if(!tracks.length){

            return;

        }


        const track =
            tracks[0];


        const capabilities =
            track.getCapabilities
            ?
            track.getCapabilities()
            :
            {};


        const advanced = {};


        if(
            capabilities.focusMode &&
            capabilities.focusMode.includes(
                "continuous"
            )
        ){

            advanced.focusMode =
                "continuous";

        }


        if(
            capabilities.exposureMode &&
            capabilities.exposureMode.includes(
                "continuous"
            )
        ){

            advanced.exposureMode =
                "continuous";

        }


        if(
            capabilities.whiteBalanceMode &&
            capabilities.whiteBalanceMode.includes(
                "continuous"
            )
        ){

            advanced.whiteBalanceMode =
                "continuous";

        }


        if(
            Object.keys(advanced).length
        ){

            track.applyConstraints({
                advanced:[
                    advanced
                ]
            })
            .catch(
                function(error){

                    console.log(
                        "Optimasi kamera:",
                        error
                    );

                }
            );

        }

    }
    catch(error){

        console.log(error);

    }

}

===================================================== */

function prosesManual(){

    hideError();


    const input =
        document.getElementById(
            "manualInput"
        );


    let nomor =
        input.value.trim();


    if(!nomor){

        showError(
            "Masukkan nomor TUMPUK terlebih dahulu."
        );

        return;

    }


    if(
        nomor.includes("|")
    ){

        sedangProses =
            true;


        prosesKodeTumpuk(
            nomor
        );


        return;

    }


    nomor =
        nomor
        .replace(
            /^TUMPUK\s*/i,
            ""
        )
        .replace(

            ""
        )
        .trim();


    if(
        !/^\d+$/.test(nomor)
    ){

        showError(
            "Nomor TUMPUK tidak valid."
        );

        return;

    }


    sedangProses =
        true;


    cariTumpukDenganNomor(
        nomor
    );

}

/* =====================================================
   PROSES KODE TUMPUK
===================================================== */

function prosesKodeTumpuk(
    kode
){

    hideError();


    kode =
        String(kode || "")
        .trim();


    const params =
        new URLSearchParams(
            window.location.search
        );


    const urlTPK =
        params.get("tpk");


    const urlTumpuk =
        params.get("tumpuk");


    if(
        urlTumpuk
    ){

        currentTumpuk =
            String(urlTumpuk);


        if(
            String(currentTumpuk) === "29"
        ){

            currentTPK =
                "";

            currentStackId =
                "TUMPUK|29";

        }
        else{

            currentTPK =
                urlTPK
                ?
                String(urlTPK)
                :
                "";

            currentStackId =
                currentTPK +
                "|" +
                currentTumpuk;

        }

    }


    /* ================================================
       FORMAT TPK|TUMPUK
    ================================================ */

    if(
        kode.includes("|")
    ){

        const p =
            kode.split("|");


        if(
            p.length >= 2
        ){

            currentTPK =
                String(
                    p[0]
                ).trim();


            currentTumpuk =
                String(
                    p[1]
                )
                .replace(
                    /^TUMPUK/i,
                    ""
                )
                .replace(
                    /^T/i,
                    ""
                )
                .trim();

        }

    }


    /* ================================================
       FORMAT TPK-T45
    ================================================ */

    const match =
        kode.match(
            /^(.+?)-T?(\d+)$/i
        );


    if(
        match
    ){

        currentTPK =
            String(
                match[1]
            ).trim();


        currentTumpuk =
            String(
                match[2]
            ).trim();

    }


    /* ================================================
       NOMOR SAJA
    ================================================ */

    if(
        /^\d+$/.test(kode)
    ){

        cariTumpukDenganNomor(
            kode
        );

        return;

    }


    if(
        !currentTumpuk
    ){

        showError(
            "Kode TUMPUK tidak valid."
        );


        sedangProses =
            false;


        return;

    }


    /* ================================================
       STACK ID
    ================================================ */

    if(
        String(currentTumpuk) === "29"
    ){

        currentTPK =
            "";

        currentStackId =
            "TUMPUK|29";

    }
    else{

        currentStackId =
            currentTPK +
            "|" +
            currentTumpuk;

    }


    /* =================================================
       7. AMBIL DATA
    ================================================= */

    ambilDataTumpuk();

}

/* =====================================================
   AMBIL FIELD DETAIL
===================================================== */

function ambilFieldDetail(
    item,
    fields
){

    for(
        let i = 0;
        i < fields.length;
        i++
    ){

        const key =
            fields[i];


        if(
            item &&
            item[key] !== undefined &&
            item[key] !== null &&
            item[key] !== ""
        ){

            return String(
                item[key]
            );

        }

    }


    return "-";

}


/* =====================================================
   BUAT BARIS DETAIL
===================================================== */

function buatBarisDetail(
    label,
    value
){

    return (

        '<div class="detail-register-row">' +

            '<div class="detail-register-label">' +
                escapeHtml(label) +
            '</div>' +

            '<div class="detail-register-value">' +
                escapeHtml(value) +
            '</div>' +

        '</div>'

    );

}


/* =====================================================
   FORMAT VOLUME 3 ANGKA
===================================================== */

function formatVolume3(
    value
){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "0,000";

    }


    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return String(value);

    }


    return number
        .toFixed(3)
        .replace(
            ".",
            ","
        );

}


/* =====================================================
   CHECKBOX
===================================================== */

function setCheckbox(
    register,
    checked,
    wrapper,
    status
){

    const checkbox =
        wrapper.querySelector(
            'input[type="checkbox"]'
        );


    const previousChecked =
        !checked;


    if(checked){

        wrapper.classList.add(
            "checked"
        );

    }
    else{

        wrapper.classList.remove(
            "checked"
        );

    }


    status.textContent =
        "MENYIMPAN...";


    let stackId =
        currentStackId;


    if(!stackId){

        stackId =
            String(currentTumpuk) === "29"
            ?
            "TUMPUK|29"
            :
            currentTPK +
            "|" +
            currentTumpuk;

    }


    const callbackName =
        "callbackCek_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random()*1000
        );


    let script = null;
    let timeoutId = null;


    window[callbackName] =
        function(data){

            if(timeoutId){

                clearTimeout(
                    timeoutId
                );

            }


            const berhasil =
                data &&
                (
                    data.ok === "success" ||
                    data.ok === true ||
                    data.status === "success" ||
                    data.success === true
                );


            if(berhasil){

                status.textContent =
                    checked
                    ?
                    "SUDAH DICEK"
                    :
                    "";


                if(checked){

                    wrapper.classList.add(
                        "checked"
                    );

                }
                else{

                    wrapper.classList.remove(
                        "checked"
                    );

                }

            }
            else{

                status.textContent =
                    "GAGAL";


                checkbox.checked =
                    previousChecked;


                if(previousChecked){

                    wrapper.classList.add(
                        "checked"
                    );

                }
                else{

                    wrapper.classList.remove(
                        "checked"
                    );

                }

            }


            updateJumlahCek();


            cleanupJSONP(
                callbackName,
                script
            );

        };


    const url =
        API_URL +
        "?action=setCek" +
        "&stackId=" +
        encodeURIComponent(
            stackId
        ) +
        "&register=" +
        encodeURIComponent(
            register
        ) +
        "&checked=" +
        encodeURIComponent(
            checked
        ) +
        "&callback=" +
        callbackName +
        "&_=" +
        Date.now();


    script =
        document.createElement(
            "script"
        );


    script.src =
        url;


    script.onerror =
        function(){

            if(timeoutId){

                clearTimeout(
                    timeoutId
                );

            }


            status.textContent =
                "GAGAL";


            checkbox.checked =
                previousChecked;


            if(previousChecked){

                wrapper.classList.add(
                    "checked"
                );

            }
            else{

                wrapper.classList.remove(
                    "checked"
                );

            }


            updateJumlahCek();


            cleanupJSONP(
                callbackName,
                script
            );

        };


    document
        .body
        .appendChild(
            script
        );


    timeoutId =
        setTimeout(
            function(){

                if(
                    document.body.contains(
                        script
                    )
                ){

                    status.textContent =
                        "GAGAL";


                    checkbox.checked =
                        previousChecked;


                    if(previousChecked){

                        wrapper.classList.add(
                            "checked"
                        );

                    }
                    else{

                        wrapper.classList.remove(
                            "checked"
                        );

                    }


                    updateJumlahCek();


                    cleanupJSONP(
                        callbackName,
                        script
                    );

                }

            },
            15000
        );

}

/* =====================================================
   NORMALISASI TANGGAL HISTORY
===================================================== */

function normalisasiTanggalHistory(
    value
){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "-";

    }


    const text =
        String(value).trim();


    if(
        /^\d{4}-\d{2}-\d{2}T/.test(text)
    ){

        return text.substring(
            0,
            10
        );

    }


    if(
        /^\d{4}-\d{1,2}-\d{1,2}$/.test(text)
    ){

        const p =
            text.split("-");


        return (
            String(p[0]) +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            String(p[2]).padStart(2,"0")
        );

    }


    if(
        /^\d{1,2}-\d{1,2}-\d{4}$/.test(text)
    ){

        const p =
            text.split("-");


        return (
            String(p[2]) +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            String(p[0]).padStart(2,"0")
        );

    }


    if(
        /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(text)
    ){

        const p =
            text.split("/");


        return (
            String(p[2]) +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            String(p[0]).padStart(2,"0")
        );

    }


    if(
        /^\d{4}\/\d{1,2}\/\d{1,2}$/.test(text)
    ){

        const p =
            text.split("/");


        return (
            String(p[0]) +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            String(p[2]).padStart(2,"0")
        );

    }


    const d =
        new Date(text);


    if(
        !Number.isNaN(
            d.getTime()
        )
    ){

        return (
            String(
                d.getFullYear()
            ) +
            "-" +
            String(
                d.getMonth()+1
            ).padStart(2,"0") +
            "-" +
            String(
                d.getDate()
            ).padStart(2,"0")
        );

    }


    return text;

}


/* =====================================================
   FORMAT TANGGAL HISTORY
===================================================== */

function formatTanggalHistory(
    value
){

    const key =
        normalisasiTanggalHistory(
            value
        );


    if(
        !key ||
        key === "-"
    ){

        return "-";

    }


    const match =
        String(key).match(
            /^(\d{4})-(\d{2})-(\d{2})$/
        );


    if(match){

        return (
            match[3] +
            "-" +
            match[2] +
            "-" +
            match[1]
        );

    }


    return String(value);

}

/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatAngka(
    value
){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "0";

    }


    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return value;

    }


    return number.toLocaleString(
        "id-ID"
    );

}


/* =====================================================
   FORMAT VOLUME
===================================================== */

function formatVolume(
    value
){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "0 m³";

    }


    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return value + " m³";

    }


    return number.toLocaleString(
        "id-ID",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:6
        }
    ) + " m³";

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(
    value
){

    if(!value){

        return "-";

    }


    if(
        typeof value === "string" &&
        /^\d{1,2}-\d{1,2}-\d{4}$/.test(
            value
        )
    ){

        return value;

    }


    if(
        typeof value === "string" &&
        /^\d{4}-\d{1,2}-\d{1,2}$/.test(
            value
        )
    ){

        const p =
            value.split("-");


        return (
            String(p[2]).padStart(2,"0") +
            "-" +
            String(p[1]).padStart(2,"0") +
            "-" +
            p[0]
        );

    }


    const d =
        new Date(value);


    if(
        !Number.isNaN(
            d.getTime()
        )
    ){

        return (
            String(
                d.getDate()
            ).padStart(2,"0") +
            "-" +
            String(
                d.getMonth()+1
            ).padStart(2,"0") +
            "-" +
            d.getFullYear()
        );

    }


    return value;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
