<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CEK TUMPUK</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    font-family:Arial,Helvetica,sans-serif;
    background:#f2f4f7;
    color:#222;
}

.container{
    max-width:600px;
    margin:auto;
}

h1{
    text-align:center;
    margin:5px 0 18px;
    font-size:26px;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

#reader{
    width:100%;
    max-width:420px;
    margin:auto;
}

.manual-box{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.manual-box input{
    flex:1;
    min-width:0;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-cari{
    background:#1976d2;
    color:#fff;
}

.btn-refresh{
    background:#2e7d32;
    color:#fff;
}

.btn-kembali{
    background:#555;
    color:#fff;
    width:100%;
    margin-top:12px;
}

.hidden{
    display:none !important;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.info-box{
    background:#f5f7fa;
    border-radius:10px;
    padding:12px;
}

.info-label{
    font-size:12px;
    color:#777;
    margin-bottom:4px;
}

.info-value{
    font-size:19px;
    font-weight:bold;
}

.tumpuk-title{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    margin-bottom:5px;
}

.tpk-title{
    text-align:center;
    font-size:17px;
    color:#555;
    margin-bottom:15px;
}

.register-list{
    margin-top:10px;
}

.register-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    border-bottom:1px solid #eee;
}

.register-item:last-child{
    border-bottom:0;
}

.register-item input{
    width:21px;
    height:21px;
}

.register-code{
    font-weight:bold;
    flex:1;
}

.status{
    font-size:12px;
    font-weight:bold;
    padding:5px 8px;
    border-radius:6px;
}

.status-sudah{
    background:#d7f5dc;
    color:#1b6e2b;
}

.status-belum{
    background:#eee;
    color:#666;
}

.history-item{
    border:1px solid #ddd;
    border-radius:9px;
    margin-bottom:8px;
    overflow:hidden;
}

.history-header{
    padding:12px;
    background:#f5f5f5;
    cursor:pointer;
    font-weight:bold;
}

.history-detail{
    display:none;
    padding:12px;
    background:#fff;
}

.history-detail.show{
    display:block;
}

.history-register{
    padding:5px 0;
    font-size:14px;
}

.empty{
    text-align:center;
    color:#777;
    padding:15px;
}

.loading{
    text-align:center;
    padding:15px;
    color:#777;
}

.error{
    background:#ffebee;
    color:#c62828;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
}

.success{
    background:#e8f5e9;
    color:#2e7d32;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
}

@media(max-width:480px){

    body{
        padding:10px;
    }

    h1{
        font-size:23px;
    }

    .info-grid{
        grid-template-columns:1fr 1fr;
    }

    .manual-box{
        flex-direction:column;
    }

    .btn-cari{
        width:100%;
    }

}

</style>

</head>


<body>

<div class="container">

    <h1>CEK TUMPUK</h1>


    <!-- =================================================
         BAGIAN SCAN
    ================================================== -->

    <div id="scanSection">

        <div class="card">

            <div class="section-title">
                SCAN BARCODE TUMPUK
            </div>

            <div id="reader"></div>

            <div class="manual-box">

                <input
                    type="text"
                    id="manualInput"
                    placeholder="Contoh: SARADAN|29"
                    autocomplete="off">

                <button
                    class="btn-cari"
                    onclick="prosesManual()">
                    CARI
                </button>

            </div>

            <div
                id="scanMessage"
                class="loading">
            </div>

        </div>

    </div>


    <!-- =================================================
         HASIL TUMPUK
    ================================================== -->

    <div id="hasilSection"
         class="hidden">


        <div class="card">

            <div
                id="tumpukTitle"
                class="tumpuk-title">
            </div>

            <div
                id="tpkTitle"
                class="tpk-title">
            </div>


            <div class="info-grid">

                <div class="info-box">

                    <div class="info-label">
                        JUMLAH BATANG AWAL
                    </div>

                    <div
                        id="jumlahAwal"
                        class="info-value">
                        0
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        VOLUME AWAL
                    </div>

                    <div
                        id="volumeAwal"
                        class="info-value">
                        0
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        JUMLAH REGISTER
                    </div>

                    <div
                        id="jumlahRegister"
                        class="info-value">
                        0
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        SUDAH DICEK
                    </div>

                    <div
                        id="jumlahCek"
                        class="info-value">
                        0
                    </div>

                </div>

            </div>

        </div>


        <!-- =================================================
             DAFTAR REGISTER
        ================================================== -->

        <div class="card">

            <div class="section-title">
                DAFTAR REGISTER
            </div>

            <div
                id="registerList"
                class="register-list">
            </div>

        </div>


        <!-- =================================================
             HISTORY
        ================================================== -->

        <div class="card">

            <div class="section-title">
                HISTORY PENGAMBILAN
            </div>

            <div
                id="historyList">
            </div>

        </div>


        <div class="card">

            <button
                class="btn-refresh"
                onclick="refreshData()"
                style="width:100%;">
                REFRESH DATA
            </button>

            <button
                class="btn-kembali"
                onclick="kembaliScan()">
                KEMBALI KE SCAN
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   KONFIGURASI
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz5Nq8bkldUGinF32eLDouyEZ6m8Gjk6rsVFK_zjv-4jdqevRGwmE6tyUCsAZIo3S7J/exec";


/* =====================================================
   VARIABEL
===================================================== */

let html5QrCode = null;

let scannerRunning = false;

let currentTPK = "";

let currentTumpuk = "";

let currentStackId = "";


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        mulaiScanner();


        document
            .getElementById("manualInput")
            .addEventListener(
                "keydown",
                function(e){

                    if(e.key === "Enter"){

                        prosesManual();

                    }

                }
            );

    }
);


/* =====================================================
   MULAI SCANNER
===================================================== */

function mulaiScanner(){

    html5QrCode =
        new Html5Qrcode("reader");


    const config = {

        fps:10,

        qrbox:function(
            width,
            height
        ){

            const size =
                Math.min(
                    width,
                    height
                ) * 0.70;

            return {
                width:size,
                height:size
            };

        },

        aspectRatio:1.0

    };


    html5QrCode
        .start(

            {
                facingMode:"environment"
            },

            config,

            function(decodedText){

                if(scannerRunning){

                    scannerRunning = false;

                    hentikanScanner();

                    prosesKodeTumpuk(
                        decodedText
                    );

                }

            },

            function(errorMessage){

                // error scan biasa
                // tidak perlu ditampilkan

            }

        )
        .then(function(){

            scannerRunning = true;

        })
        .catch(function(error){

            document
                .getElementById(
                    "scanMessage"
                )
                .innerHTML =
                    "Kamera tidak dapat digunakan. Gunakan input manual.";

        });

}


/* =====================================================
   HENTIKAN SCANNER
===================================================== */

function hentikanScanner(){

    if(
        html5QrCode &&
        scannerRunning
    ){

        html5QrCode
            .stop()
            .then(function(){

                scannerRunning = false;

            })
            .catch(function(){

                scannerRunning = false;

            });

    }

}


/* =====================================================
   INPUT MANUAL
===================================================== */

function prosesManual(){

    const input =
        document
            .getElementById(
                "manualInput"
            );

    const kode =
        input.value.trim();


    if(!kode){

        alert(
            "Masukkan kode TPK|TUMPUK."
        );

        return;

    }


    prosesKodeTumpuk(kode);

}


/* =====================================================
   PROSES KODE BARCODE
=====================================================

   FORMAT UTAMA:

   SARADAN|29

   Artinya:

   TPK     = SARADAN
   TUMPUK  = 29

   Ini penting karena TUMPUK 29
   bisa ada di beberapa TPK.

===================================================== */

function prosesKodeTumpuk(kode){

    kode =
        String(kode || "")
            .trim();


    if(!kode){

        alert(
            "Kode barcode kosong."
        );

        return;

    }


    let tpk = "";

    let tumpuk = "";


    /* =================================================
       FORMAT UTAMA TPK|TUMPUK
    ================================================= */

    if(kode.includes("|")){

        const parts =
            kode.split("|");


        tpk =
            String(
                parts[0] || ""
            ).trim();


        tumpuk =
            String(
                parts[1] || ""
            ).trim();

    }


    /* =================================================
       FORMAT LAMA TPK-T01
       Tetap dipertahankan sebagai cadangan.
    ================================================= */

    else if(
        kode.includes("-T")
    ){

        const pos =
            kode.lastIndexOf("-T");


        tpk =
            kode
                .substring(
                    0,
                    pos
                )
                .trim();


        tumpuk =
            kode
                .substring(
                    pos + 2
                )
                .trim();

    }


    /* =================================================
       FORMAT TUMPUK SAJA
       HANYA kalau barcode lama memang
       berupa angka tunggal.

       Catatan:
       Untuk TUMPUK 29 yang ada di 3 TPK,
       WAJIB menggunakan TPK|29.
    ================================================= */

    else if(
        /^\d+$/.test(kode)
    ){

        alert(
            "Barcode TUMPUK ini hanya berisi nomor TUMPUK.\n\n" +
            "Untuk TUMPUK yang memiliki TPK berbeda, " +
            "barcode harus menggunakan format:\n\n" +
            "TPK|TUMPUK\n\n" +
            "Contoh: SARADAN|29"
        );

        return;

    }


    if(
        !tpk ||
        !tumpuk
    ){

        alert(
            "Format barcode tidak dikenali.\n\n" +
            "Format yang benar:\n" +
            "TPK|TUMPUK\n\n" +
            "Contoh:\n" +
            "SARADAN|29"
        );

        return;

    }


    /* =================================================
       IDENTITAS STACK
    ================================================= */

    currentTPK =
        tpk;

    currentTumpuk =
        tumpuk;


    currentStackId =
        currentTPK +
        "|" +
        currentTumpuk;


    ambilDataTumpuk();

}


/* =====================================================
   AMBIL DATA TUMPUK
===================================================== */

function ambilDataTumpuk(){

    tampilkanLoading();


    const callbackName =
        "callbackTumpuk_" +
        Date.now();


    window[callbackName] =
        function(data){

            try{

                tampilkanData(data);

            }

            catch(error){

                console.error(error);

                tampilkanError(
                    "Data TUMPUK gagal diproses."
                );

            }


            cleanupJsonp(
                callbackName,
                script
            );

        };


    const url =
        API_URL +
        "?action=getTumpukData" +
        "&tpk=" +
        encodeURIComponent(
            currentTPK
        ) +
        "&tumpuk=" +
        encodeURIComponent(
            currentTumpuk
        ) +
        "&callback=" +
        encodeURIComponent(
            callbackName
        );


    const script =
        document.createElement(
            "script"
        );


    script.src = url;

    script.onerror =
        function(){

            tampilkanError(
                "Gagal menghubungi database."
            );

            cleanupJsonp(
                callbackName,
                script
            );

        };


    document
        .body
        .appendChild(script);

}


/* =====================================================
   TAMPILKAN LOADING
===================================================== */

function tampilkanLoading(){

    document
        .getElementById(
            "scanSection"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "hasilSection"
        )
        .classList
        .remove("hidden");


    document
        .getElementById(
            "registerList"
        )
        .innerHTML =
            '<div class="loading">MEMUAT DATA...</div>';


    document
        .getElementById(
            "historyList"
        )
        .innerHTML = "";

}


/* =====================================================
   TAMPILKAN DATA
===================================================== */

function tampilkanData(data){

    if(!data){

        tampilkanError(
            "Data tidak ditemukan."
        );

        return;

    }


    if(data.error){

        tampilkanError(
            data.error
        );

        return;

    }


    /* =================================================
       JUDUL
    ================================================= */

    document
        .getElementById(
            "tumpukTitle"
        )
        .textContent =
            "TUMPUK " +
            currentTumpuk;


    document
        .getElementById(
            "tpkTitle"
        )
        .textContent =
            "TPK ASAL : " +
            currentTPK;


    /* =================================================
       JUMLAH AWAL
    ================================================= */

    document
        .getElementById(
            "jumlahAwal"
        )
        .textContent =
            formatNumber(
                data.jumlahAwal
            );


    /* =================================================
       VOLUME AWAL
    ================================================= */

    document
        .getElementById(
            "volumeAwal"
        )
        .textContent =
            formatVolume(
                data.volumeAwal
            );


    /* =================================================
       REGISTER
    ================================================= */

    const registers =
        Array.isArray(
            data.registers
        )
            ? data.registers
            : [];


    document
        .getElementById(
            "jumlahRegister"
        )
        .textContent =
            formatNumber(
                registers.length
            );


    tampilkanRegister(
        registers,
        data
    );


    /* =================================================
       HISTORY
    ================================================= */

    tampilkanHistory(
        data.history || []
    );

}


/* =====================================================
   TAMPILKAN REGISTER
===================================================== */

function tampilkanRegister(
    registers,
    data
){

    const container =
        document
            .getElementById(
                "registerList"
            );


    if(
        !registers ||
        registers.length === 0
    ){

        container.innerHTML =
            '<div class="empty">' +
            'Tidak ada register.' +
            '</div>';


        document
            .getElementById(
                "jumlahCek"
            )
            .textContent =
                "0";

        return;

    }


    let jumlahCek = 0;


    let html = "";


    registers.forEach(
        function(item){

            const register =
                String(
                    item.register || ""
                );


            const checked =
                item.checked === true ||
                item.checked === "true" ||
                item.checked === 1 ||
                item.checked === "1";


            if(checked){

                jumlahCek++;

            }


            html +=
                '<div class="register-item">' +

                    '<input ' +
                        'type="checkbox" ' +
                        'data-register="' +
                        escapeHtml(register) +
                        '" ' +
                        (checked
                            ? 'checked'
                            : '') +
                        ' ' +
                        'onchange="setCheckbox(this)"' +
                    '>' +

                    '<div class="register-code">' +
                        escapeHtml(register) +
                    '</div>' +

                    '<div class="status ' +
                    (
                        checked
                            ? 'status-sudah'
                            : 'status-belum'
                    ) +
                    '">' +
                    (
                        checked
                            ? 'SUDAH DICEK'
                            : 'BELUM'
                    ) +
                    '</div>' +

                '</div>';

        }
    );


    container.innerHTML =
        html;


    document
        .getElementById(
            "jumlahCek"
        )
        .textContent =
            formatNumber(
                jumlahCek
            );

}


/* =====================================================
   CHECKBOX
===================================================== */

function setCheckbox(
    checkbox
){

    const register =
        checkbox
            .getAttribute(
                "data-register"
            );


    const checked =
        checkbox.checked;


    const parent =
        checkbox.parentElement;


    const status =
        parent.querySelector(
            ".status"
        );


    if(status){

        status.textContent =
            checked
                ? "SUDAH DICEK"
                : "BELUM";


        status.className =
            "status " +
            (
                checked
                    ? "status-sudah"
                    : "status-belum"
            );

    }


    updateJumlahCek();


    const callbackName =
        "callbackCek_" +
        Date.now();


    window[callbackName] =
        function(data){

            if(
                data &&
                data.error
            ){

                alert(
                    data.error
                );

                checkbox.checked =
                    !checked;

                updateJumlahCek();

            }

            cleanupJsonp(
                callbackName,
                script
            );

        };


    const url =
        API_URL +
        "?action=setCek" +
        "&stackId=" +
        encodeURIComponent(
            currentStackId
        ) +
        "&register=" +
        encodeURIComponent(
            register
        ) +
        "&checked=" +
        encodeURIComponent(
            checked
        ) +
        "&callback=" +
        encodeURIComponent(
            callbackName
        );


    const script =
        document.createElement(
            "script"
        );


    script.src =
        url;


    script.onerror =
        function(){

            checkbox.checked =
                !checked;

            updateJumlahCek();

            alert(
                "Gagal menyimpan status cek."
            );

            cleanupJsonp(
                callbackName,
                script
            );

        };


    document
        .body
        .appendChild(
            script
        );

}


/* =====================================================
   UPDATE JUMLAH CEK
===================================================== */

function updateJumlahCek(){

    const checkboxes =
        document.querySelectorAll(
            '#registerList input[type="checkbox"]'
        );


    let total = 0;


    checkboxes.forEach(
        function(cb){

            if(cb.checked){

                total++;

            }

        }
    );


    document
        .getElementById(
            "jumlahCek"
        )
        .textContent =
            formatNumber(
                total
            );

}


/* =====================================================
   HISTORY
===================================================== */

function tampilkanHistory(
    history
){

    const container =
        document
            .getElementById(
                "historyList"
            );


    if(
        !history ||
        history.length === 0
    ){

        container.innerHTML =
            '<div class="empty">' +
            'Belum ada history pengambilan.' +
            '</div>';

        return;

    }


    let html = "";


    history.forEach(
        function(item,index){

            const tanggal =
                item.tanggal ||
                item.date ||
                "-";


            const jumlah =
                item.jumlah ||
                item.jumlahBatang ||
                (
                    Array.isArray(
                        item.registers
                    )
                        ? item.registers.length
                        : 0
                );


            const regs =
                Array.isArray(
                    item.registers
                )
                    ? item.registers
                    : [];


            let registerHtml = "";


            regs.forEach(
                function(reg){

                    registerHtml +=
                        '<div class="history-register">' +
                        escapeHtml(
                            String(reg)
                        ) +
                        '</div>';

                }
            );


            html +=
                '<div class="history-item">' +

                    '<div ' +
                        'class="history-header" ' +
                        'onclick="toggleHistory(' +
                        index +
                        ')">' +

                        escapeHtml(
                            String(tanggal)
                        ) +

                        ' — ' +

                        formatNumber(
                            jumlah
                        ) +

                        ' BATANG' +

                    '</div>' +

                    '<div ' +
                        'id="history-' +
                        index +
                        '" ' +
                        'class="history-detail">' +

                        (
                            registerHtml ||
                            '<div class="empty">' +
                            'Tidak ada daftar register.' +
                            '</div>'
                        ) +

                    '</div>' +

                '</div>';

        }
    );


    container.innerHTML =
        html;

}


/* =====================================================
   TOGGLE HISTORY
===================================================== */

function toggleHistory(
    index
){

    const el =
        document.getElementById(
            "history-" +
            index
        );


    if(!el){

        return;

    }


    el.classList.toggle(
        "show"
    );

}


/* =====================================================
   REFRESH
===================================================== */

function refreshData(){

    if(
        !currentTPK ||
        !currentTumpuk
    ){

        return;

    }


    ambilDataTumpuk();

}


/* =====================================================
   KEMBALI KE SCAN
===================================================== */

function kembaliScan(){

    document
        .getElementById(
            "hasilSection"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "scanSection"
        )
        .classList
        .remove("hidden");


    currentTPK =
        "";

    currentTumpuk =
        "";

    currentStackId =
        "";


    document
        .getElementById(
            "manualInput"
        )
        .value =
            "";


    if(
        html5QrCode
    ){

        html5QrCode
            .clear()
            .then(function(){

                html5QrCode =
                    new Html5Qrcode(
                        "reader"
                    );

                mulaiScanner();

            })
            .catch(function(){

                mulaiScanner();

            });

    }
    else{

        mulaiScanner();

    }

}


/* =====================================================
   ERROR
===================================================== */

function tampilkanError(
    pesan
){

    document
        .getElementById(
            "registerList"
        )
        .innerHTML =
            '<div class="error">' +
            escapeHtml(
                String(pesan)
            ) +
            '</div>';

}


/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatNumber(
    value
){

    const num =
        Number(value);


    if(
        !Number.isFinite(num)
    ){

        return "0";

    }


    return num.toLocaleString(
        "id-ID"
    );

}


/* =====================================================
   FORMAT VOLUME
===================================================== */

function formatVolume(
    value
){

    const num =
        Number(value);


    if(
        !Number.isFinite(num)
    ){

        return "0";

    }


    return num.toLocaleString(
        "id-ID",
        {
            minimumFractionDigits:6,
            maximumFractionDigits:6
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   CLEANUP JSONP
===================================================== */

function cleanupJsonp(
    callbackName,
    script
){

    try{

        delete window[
            callbackName
        ];

    }

    catch(e){}


    if(
        script &&
        script.parentNode
    ){

        script
            .parentNode
            .removeChild(
                script
            );

    }

}
