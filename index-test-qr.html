<!DOCTYPE html>

<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>Scan Register BBI - IK Saradan</title>

<!-- ZXING -->

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f6f4;
  margin: 0;
  padding: 15px;
  color: #222;
}

/* ==============================
   HEADER
============================== */

.header {
  width: 100%;
  max-width: 500px;
  margin: 0 auto 15px;
  background: white;
  border-radius: 14px;
  padding: 12px 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
  border-top: 4px solid #176b38;
}

.headerIsi {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transform: translateX(-10px);
}

.logo {
  width: 100px;
  height: 90px;
  object-fit: contain;
  flex-shrink: 0;
}

.judulBox {
  flex: 0 0 auto;
  text-align: left;
}

.judul {
  font-size: 22px;
  font-weight: 800;
  color: #176b38;
  line-height: 1.2;
  white-space: nowrap;
}

.subjudul {
  font-size: 17px;
  font-weight: bold;
  color: #555;
  letter-spacing: 1.5px;
  margin-top: 6px;
  white-space: nowrap;
}

/* ==============================
   CAMERA
============================== */

.camera-card {
  width: 100%;
  max-width: 500px;
  margin: auto;
  background: white;
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.camera-wrapper {
  position: relative;
  width: 100%;
  height: 300px;
  border-radius: 10px;
  overflow: hidden;
  background: black;
}

#video {
  width: 100%;
  height: 300px;
  object-fit: cover;
  display: block;
}

/* ==============================
   GARIS POJOK
============================== */

.qr-frame {

  position: absolute;

  left: 50%;
  top: 50%;

  width: 250px;
  height: 250px;

  transform: translate(-50%, -50%);

  pointer-events: none;

  z-index: 10;
}

.corner {

  position: absolute;

  width: 55px;
  height: 55px;

  border-color: #00e676;

  border-style: solid;

}

.tl {
  left: 0;
  top: 0;
  border-width: 5px 0 0 5px;
  border-radius: 6px 0 0 0;
}

.tr {
  right: 0;
  top: 0;
  border-width: 5px 5px 0 0;
  border-radius: 0 6px 0 0;
}

.bl {
  left: 0;
  bottom: 0;
  border-width: 0 0 5px 5px;
  border-radius: 0 0 0 6px;
}

.br {
  right: 0;
  bottom: 0;
  border-width: 0 5px 5px 0;
  border-radius: 0 0 6px 0;
}

/* ==============================
   INDIKATOR BERHASIL
============================== */

#scanBerhasil {

  position: absolute;

  left: 50%;
  top: 50%;

  width: 250px;
  height: 250px;

  transform: translate(-50%, -50%);

  border: 6px solid #00e676;

  border-radius: 12px;

  display: none;

  z-index: 20;

  pointer-events: none;

  box-shadow:
    0 0 10px rgba(0,230,118,0.9),
    0 0 25px rgba(0,230,118,0.8);
}

#scanBerhasil::after {

  content: "✓";

  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  width: 60px;
  height: 60px;

  border-radius: 50%;

  background: #00c853;

  color: white;

  font-size: 40px;

  font-weight: bold;

  line-height: 60px;

  text-align: center;
}

/* ==============================
   BUTTON
============================== */

#btnScan {

  display: block;

  width: 100%;
  max-width: 500px;

  margin: 15px auto;

  padding: 15px;

  font-size: 18px;

  font-weight: bold;

  border: none;

  border-radius: 10px;

  background: #1976d2;

  color: white;

  box-shadow:
    0 3px 8px rgba(25,118,210,0.25);

  cursor: pointer;
}

#btnScan:active {
  transform: scale(0.98);
}

/* ==============================
   STATUS
============================== */

.status-card {

  width: 100%;
  max-width: 500px;

  margin: 10px auto;

  background: white;

  border-radius: 12px;

  padding: 13px;

  text-align: center;

  box-shadow:
    0 3px 10px rgba(0,0,0,0.06);
}

#status {

  font-weight: bold;

  line-height: 1.6;
}

#jumlah {

  margin-top: 5px;

  font-weight: bold;

  color: #555;
}

/* ==============================
   HASIL
============================== */

#daftar {

  width: 100%;

  max-width: 500px;

  margin: 15px auto;
}

.item {

  background: white;

  margin-bottom: 9px;

  border-radius: 10px;

  padding: 12px;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.07);
}

.baris {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;
}

.nomor {

  font-size: 20px;

  font-weight: bold;

  word-break: break-all;
}

.detailBtn {

  width: auto;

  min-width: 80px;

  padding: 8px 12px;

  margin: 0;

  background: #555;

  color: white;

  border: none;

  border-radius: 6px;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;
}

.detail {

  display: none;

  margin-top: 12px;

  padding-top: 10px;

  border-top: 1px solid #ddd;

  font-size: 15px;

  line-height: 1.7;
}

.success {
  color: #16833a;
}

.duplicate {
  color: #d32f2f;
}

.notfound {
  color: #e67e00;
}

.duplicateBtn {
  background: #c62828;
}

.label {

  display: inline-block;

  width: 115px;

  font-weight: bold;
}

/* ==============================
   HP
============================== */

@media(max-width:500px) {

  body {
    padding: 10px;
  }

  .header {
    padding: 10px 8px;
  }

  .headerIsi {
    gap: 8px;
    transform: translateX(-8px);
  }

  .logo {
    width: 95px;
    height: 85px;
  }

  .judul {
    font-size: 22px;
  }

  .subjudul {
    font-size: 17px;
  }

  .camera-wrapper,
  #video {
    height: 300px;
  }

}

/* ==============================
   HP KECIL
============================== */

@media(max-width:380px) {

  .logo {
    width: 85px;
    height: 75px;
  }

  .judul {
    font-size: 20px;
  }

  .subjudul {
    font-size: 16px;
  }

  .camera-wrapper,
  #video {
    height: 280px;
  }

  .qr-frame,
  #scanBerhasil {
    width: 220px;
    height: 220px;
  }

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

  <div class="headerIsi">

```
<img
  class="logo"
  src="logo-perhutani.jpg"
  alt="Logo Perhutani"
>

<div class="judulBox">

  <div class="judul">
    SCAN REGISTER BBI
  </div>

  <div class="subjudul">
    IK SARADAN
  </div>

</div>
```

  </div>

</div>

<!-- CAMERA -->

<div class="camera-card">

  <div class="camera-wrapper">

```
<video
  id="video"
  autoplay
  muted
  playsinline
></video>

<div class="qr-frame">

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

</div>

<div id="scanBerhasil"></div>
```

  </div>

</div>

<button
id="btnScan"
onclick="mulaiKamera()"

>

📷 BUKA KAMERA </button>

<!-- STATUS -->

<div class="status-card">

  <div id="status">
    Tekan Buka Kamera
  </div>

  <div id="jumlah">
    Jumlah berhasil: 0
  </div>

</div>

<div id="daftar"></div>

<script>

/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";

/* =====================================================
   VARIABEL
===================================================== */

let scannerControls = null;

let kameraAktif = false;

let sedangProses = false;

let jumlahBerhasil = 0;

/* =====================================================
   INDIKATOR HIJAU
===================================================== */

function tampilkanIndikatorHijau() {

  const indikator =
    document.getElementById(
      "scanBerhasil"
    );

  indikator.style.display =
    "block";

  setTimeout(function() {

    indikator.style.display =
      "none";

  }, 500);

}

/* =====================================================
   SUARA
===================================================== */

function bunyiBerhasil() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;

    const audio =
      new AudioContext();

    const oscillator1 =
      audio.createOscillator();

    const gain1 =
      audio.createGain();

    oscillator1.type =
      "sine";

    oscillator1.frequency.setValueAtTime(
      1300,
      audio.currentTime
    );

    gain1.gain.setValueAtTime(
      0.001,
      audio.currentTime
    );

    gain1.gain.exponentialRampToValueAtTime(
      0.35,
      audio.currentTime + 0.01
    );

    gain1.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.12
    );

    oscillator1.connect(gain1);

    gain1.connect(
      audio.destination
    );

    oscillator1.start();

    oscillator1.stop(
      audio.currentTime + 0.13
    );

    setTimeout(function() {

      audio.close();

    }, 300);

  } catch (e) {

    console.log(e);

  }

}

/* =====================================================
   GETAR
===================================================== */

function getarBerhasil() {

  if (navigator.vibrate) {

    navigator.vibrate([
      100,
      50,
      100
    ]);

  }

}

/* =====================================================
   MULAI KAMERA ZXING
   QR + CODE 128
===================================================== */

async function mulaiKamera() {

  if (kameraAktif) return;

  const status =
    document.getElementById(
      "status"
    );

  const tombol =
    document.getElementById(
      "btnScan"
    );

  status.innerHTML =
    "⏳ Membuka kamera...";

  try {

    if (
      !window.ZXingBrowser
    ) {

      throw new Error(
        "ZXing belum berhasil dimuat"
      );

    }

    const video =
      document.getElementById(
        "video"
      );

    /*
     * MULTI FORMAT
     *
     * Mendukung QR CODE
     * dan CODE 128
     */

    const reader =
      new ZXingBrowser.BrowserMultiFormatReader();

    const constraints = {

      audio: false,

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        },

        frameRate: {
          ideal: 30,
          max: 60
        }

      }

    };

    status.innerHTML =
      "⏳ Meminta akses kamera...";

    scannerControls =
      await reader.decodeFromConstraints(

        constraints,

        video,

        function(
          result,
          error
        ) {

          if (!result) return;

          const kode =
            String(
              result.getText() || ""
            ).trim();

          if (!kode) return;

          if (sedangProses) return;

          sedangProses = true;

          tampilkanIndikatorHijau();

          const format =
            result.getBarcodeFormat();

          status.innerHTML =
            "⏳ BARCODE TERBACA<br>" +
            "Mengecek " +
            kode +
            "...";

          /*
           * ==========================================
           * BEDAKAN QR DAN CODE 128
           * ==========================================
           */

          if (
            format ===
            ZXingBrowser.BarcodeFormat.QR_CODE
          ) {

            /*
             * QR
             *
             * Cari kode di KOLOM M
             */

            cekQR(kode);

          }

          else if (
            format ===
            ZXingBrowser.BarcodeFormat.CODE_128
          ) {

            /*
             * CODE 128
             *
             * Cari register di KOLOM A
             */

            cekRegister(kode);

          }

          else {

            status.innerHTML =
              "⚠️ Format barcode tidak didukung<br>" +
              kode;

            sedangProses = false;

          }

        }

      );

    kameraAktif =
      true;

    tombol.innerHTML =
      "📷 KAMERA AKTIF";

    tombol.style.background =
      "#555";

    status.innerHTML =
      "📷 KAMERA AKTIF<br>" +
      "Arahkan QR / CODE 128 ke kotak hijau";

  }

  catch (error) {

    kameraAktif =
      false;

    tombol.innerHTML =
      "📷 BUKA KAMERA";

    tombol.style.background =
      "#1976d2";

    status.innerHTML =
      "❌ Kamera gagal dibuka<br>" +
      error.message;

    console.log(
      "ZXing error:",
      error
    );

  }

}

/* =====================================================
   CEK QR
   KIRIM ?kode=
===================================================== */

function cekQR(kode) {

  const callbackName =
    "scan_" +
    Date.now();

  window[callbackName] =
    function(hasil) {

      prosesHasilScan(
        hasil,
        kode,
        callbackName
      );

    };

  const script =
    document.createElement(
      "script"
    );

  script.id =
    callbackName;

  script.src =
    API_URL +
    "?kode=" +
    encodeURIComponent(
      kode
    ) +
    "&callback=" +
    callbackName;

  script.onerror =
    function() {

      document.getElementById(
        "status"
      ).innerHTML =
        "❌ Gagal menghubungi DATABASE";

      sedangProses = false;

      delete window[
        callbackName
      ];

      script.remove();

    };

  document.body.appendChild(
    script
  );

}

/* =====================================================
   CEK CODE 128
   KIRIM ?register=
===================================================== */

function cekRegister(register) {

  const callbackName =
    "scan_" +
    Date.now();

  window[callbackName] =
    function(hasil) {

      prosesHasilScan(
        hasil,
        register,
        callbackName
      );

    };

  const script =
    document.createElement(
      "script"
    );

  script.id =
    callbackName;

  script.src =
    API_URL +
    "?register=" +
    encodeURIComponent(
      register
    ) +
    "&callback=" +
    callbackName;

  script.onerror =
    function() {

      document.getElementById(
        "status"
      ).innerHTML =
        "❌ Gagal menghubungi DATABASE";

      sedangProses = false;

      delete window[
        callbackName
      ];

      script.remove();

    };

  document.body.appendChild(
    script
  );

}

/* =====================================================
   HASIL SCAN
===================================================== */

function prosesHasilScan(
  hasil,
  kode,
  callbackName
) {

  if (
    hasil.status ===
    "success"
  ) {

    jumlahBerhasil++;

    document.getElementById(
      "jumlah"
    ).innerHTML =
      "Jumlah berhasil: " +
      jumlahBerhasil;

    document.getElementById(
      "status"
    ).innerHTML =
      "✅ " +
      hasil.data[0];

    bunyiBerhasil();

    getarBerhasil();

    tambahHasil(
      hasil.data,
      hasil.tanggalScan,
      hasil.jamScan,
      "success"
    );

  }

  else if (
    hasil.status ===
    "duplicate"
  ) {

    document.getElementById(
      "status"
    ).innerHTML =
      "❌ " +
      hasil.message;

    tambahHasil(
      hasil.data,
      "",
      "",
      "duplicate"
    );

  }

  else if (
    hasil.status ===
    "not_found"
  ) {

    document.getElementById(
      "status"
    ).innerHTML =
      "⚠️ " +
      hasil.message;

    tambahHasilTidakDitemukan(
      kode
    );

  }

  else {

    document.getElementById(
      "status"
    ).innerHTML =
      "⚠️ " +
      hasil.message;

  }

  sedangProses =
    false;

  delete window[
    callbackName
  ];

  const script =
    document.getElementById(
      callbackName
    );

  if (script) {

    script.remove();

  }

}

/* =====================================================
   HASIL SCAN
===================================================== */

function tambahHasil(

  data,
  tanggalScan,
  jamScan,
  tipe

) {

  const register =
    data[0];

  const item =
    document.createElement(
      "div"
    );

  item.className =
    "item";

  const id =
    "detail_" +
    Date.now();

  const warna =
    tipe === "success"
    ?
    "success"
    :
    "duplicate";

  const tulisan =
    tipe === "success"
    ?
    "✅ " + register
    :
    "❌ " + register;

  item.innerHTML = `

    <div class="baris">

      <div class="nomor ${warna}">
        ${tulisan}
      </div>

      <button
        class="detailBtn ${
          tipe === "duplicate"
          ? "duplicateBtn"
          : ""
        }"
        onclick="toggleDetail('${id}', this)"
      >
        DETAIL
      </button>

    </div>

    <div
      id="${id}"
      class="detail"
    >

      <div>
        <span class="label">REGISTER</span>
        : ${data[0]}
      </div>

      <div>
        <span class="label">PANJANG</span>
        : ${data[1]}
      </div>

      <div>
        <span class="label">DIAMETER</span>
        : ${data[2]}
      </div>

      <div>
        <span class="label">TPK</span>
        : ${data[3]}
      </div>

      <div>
        <span class="label">TUMPUK</span>
        : ${data[4]}
      </div>

      <div>
        <span class="label">MUTU</span>
        : ${data[5]}
      </div>

      <div>
        <span class="label">STATUS</span>
        : ${data[6]}
      </div>

      <div>
        <span class="label">M3</span>
        : ${data[7]}
      </div>

      ${
        tanggalScan
        ?
        `
        <div>
          <span class="label">TANGGAL</span>
          : ${tanggalScan}
        </div>

        <div>
          <span class="label">JAM</span>
          : ${jamScan}
        </div>
        `
        :
        ""
      }

    </div>

  `;

  document
    .getElementById(
      "daftar"
    )
    .prepend(item);

}

/* =====================================================
   TIDAK DITEMUKAN
===================================================== */

function tambahHasilTidakDitemukan(
  kode
) {

  const item =
    document.createElement(
      "div"
    );

  item.className =
    "item";

  item.innerHTML = `

    <div class="baris">

      <div class="nomor notfound">
        ⚠️ ${kode}
      </div>

      <div class="notfound">
        TIDAK ADA
      </div>

    </div>

  `;

  document
    .getElementById(
      "daftar"
    )
    .prepend(item);

}

/* =====================================================
   DETAIL
===================================================== */

function toggleDetail(
  id,
  tombol
) {

  const detail =
    document.getElementById(
      id
    );

  if (
    detail.style.display ===
    "block"
  ) {

    detail.style.display =
      "none";

    tombol.innerHTML =
      "DETAIL";

  }

  else {

    detail.style.display =
      "block";

    tombol.innerHTML =
      "TUTUP";

  }

}

</script>

</body>
