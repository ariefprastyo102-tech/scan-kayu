<!DOCTYPE html>

<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scan Register BBI - IK Saradan</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f6f4;
  margin: 0;
  padding: 15px;
  color: #222;
}


/* ==============================
   HEADER
============================== */

.header {
  width: 100%;
  max-width: 500px;
  margin: 0 auto 15px;
  background: white;
  border-radius: 14px;
  padding: 12px 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
  border-top: 4px solid #176b38;
}

.headerIsi {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transform: translateX(-10px);
}

.logo {
  width: 100px;
  height: 90px;
  object-fit: contain;
  flex-shrink: 0;
}

.judulBox {
  flex: 0 0 auto;
  text-align: left;
}

.judul {
  font-size: 22px;
  font-weight: 800;
  color: #176b38;
  line-height: 1.2;
  white-space: nowrap;
}

.subjudul {
  font-size: 17px;
  font-weight: bold;
  color: #555;
  letter-spacing: 1.5px;
  margin-top: 6px;
  white-space: nowrap;
}


/* ==============================
   CAMERA
============================== */

.camera-card {
  width: 100%;
  max-width: 500px;
  margin: auto;
  background: white;
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}


/* =================================================
   AREA KAMERA + INDIKATOR HIJAU
================================================= */

.camera-wrapper {
  position: relative;
  width: 100%;
  height: 220px;
  border-radius: 10px;
  overflow: hidden;
  background: black;
}

#reader {
  width: 100%;
  height: 220px;
  max-height: 220px;
  margin: auto;
  background: white;
  border-radius: 10px;
  overflow: hidden;
}

#reader video {
  width: 100% !important;
  height: 220px !important;
  object-fit: cover !important;
}


/* =================================================
   INDIKATOR HIJAU
================================================= */

#scanBerhasil {
  position: absolute;
  left: 50%;
  top: 50%;

  width: 80%;
  height: 55%;

  transform: translate(-50%, -50%);

  border: 5px solid #00e676;
  border-radius: 12px;

  box-shadow:
    0 0 8px rgba(0,230,118,0.9),
    0 0 20px rgba(0,230,118,0.7),
    inset 0 0 10px rgba(0,230,118,0.25);

  display: none;

  z-index: 20;

  pointer-events: none;
}


/* =================================================
   TANDA CHECK HIJAU
================================================= */

#scanBerhasil::after {

  content: "✓";

  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  width: 55px;
  height: 55px;

  border-radius: 50%;

  background: #00c853;

  color: white;

  font-size: 38px;
  font-weight: bold;

  line-height: 55px;

  text-align: center;

  box-shadow:
    0 0 15px rgba(0,0,0,0.35);
}


/* ==============================
   BUTTON
============================== */

#btnScan {
  display: block;
  width: 100%;
  max-width: 500px;
  margin: 15px auto;
  padding: 15px;
  font-size: 18px;
  font-weight: bold;
  border: none;
  border-radius: 10px;
  background: #1976d2;
  color: white;
  box-shadow: 0 3px 8px rgba(25,118,210,0.25);
  cursor: pointer;
}

#btnScan:active {
  transform: scale(0.98);
}


/* ==============================
   STATUS
============================== */

.status-card {
  width: 100%;
  max-width: 500px;
  margin: 10px auto;
  background: white;
  border-radius: 12px;
  padding: 13px;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.06);
}

#status {
  font-weight: bold;
  line-height: 1.6;
}

#jumlah {
  margin-top: 5px;
  font-weight: bold;
  color: #555;
}


/* ==============================
   HASIL SCAN
============================== */

#daftar {
  width: 100%;
  max-width: 500px;
  margin: 15px auto;
}

.item {
  background: white;
  margin-bottom: 9px;
  border-radius: 10px;
  padding: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
}

.baris {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.nomor {
  font-size: 20px;
  font-weight: bold;
  word-break: break-all;
}

.detailBtn {
  width: auto;
  min-width: 80px;
  padding: 8px 12px;
  margin: 0;
  background: #555;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.detail {
  display: none;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid #ddd;
  font-size: 15px;
  line-height: 1.7;
}

.success {
  color: #16833a;
}

.duplicate {
  color: #d32f2f;
}

.notfound {
  color: #e67e00;
}

.detailBtn.duplicateBtn {
  background: #c62828;
}

.label {
  display: inline-block;
  width: 115px;
  font-weight: bold;
}


/* ==============================
   HP
============================== */

@media(max-width:500px) {

  body {
    padding: 10px;
  }

  .header {
    padding: 10px 8px;
  }

  .headerIsi {
    gap: 8px;
    transform: translateX(-8px);
  }

  .logo {
    width: 95px;
    height: 85px;
  }

  .judul {
    font-size: 22px;
    white-space: nowrap;
  }

  .subjudul {
    font-size: 17px;
    white-space: nowrap;
  }

  #reader {
    height: 220px;
    max-height: 220px;
  }

  #reader video {
    height: 220px !important;
  }

  .camera-wrapper {
    height: 220px;
  }

}


/* ==============================
   HP SANGAT KECIL
============================== */

@media(max-width:380px) {

  .logo {
    width: 85px;
    height: 75px;
  }

  .judul {
    font-size: 20px;
    white-space: nowrap;
  }

  .subjudul {
    font-size: 16px;
    white-space: nowrap;
  }

  #reader {
    height: 210px;
    max-height: 210px;
  }

  #reader video {
    height: 210px !important;
  }

  .camera-wrapper {
    height: 210px;
  }

}

</style>

</head>

<body>


<!-- HEADER -->

<div class="header">

  <div class="headerIsi">

    <img
      class="logo"
      src="logo-perhutani.jpg"
      alt="Logo Perhutani"
    >

    <div class="judulBox">

      <div class="judul">
        SCAN REGISTER BBI
      </div>

      <div class="subjudul">
        IK SARADAN
      </div>

    </div>

  </div>

</div>


<!-- CAMERA -->

<div class="camera-card">

  <div class="camera-wrapper">

    <div id="reader"></div>

    <!-- INDIKATOR HIJAU -->

    <div id="scanBerhasil"></div>

  </div>

</div>


<button
  id="btnScan"
  onclick="mulaiKamera()"
>

📷 BUKA KAMERA

</button>


<!-- STATUS -->

<div class="status-card">

  <div id="status">
    Tekan Buka Kamera
  </div>

  <div id="jumlah">
    Jumlah berhasil: 0
  </div>

</div>


<div id="daftar"></div>


<script>


/* ==============================
   DATABASE
============================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyCBGCWXwOS62cahHe8zA3FSwKFunkcm3qhaan7oJOBPJMzdu3r7WNlFXoLt-xyGD8/exec";


let scanner = null;

let kameraAktif = false;

let sedangProses = false;

let jumlahBerhasil = 0;


/* ==============================
   INDIKATOR HIJAU
============================== */

function tampilkanIndikatorHijau() {

  const indikator =
    document.getElementById(
      "scanBerhasil"
    );


  indikator.style.display =
    "block";


  setTimeout(function() {

    indikator.style.display =
      "none";

  }, 700);

}


/* ==============================
   SUARA CEKLING
============================== */

function bunyiBerhasil() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;

    const audio =
      new AudioContext();


    const oscillator1 =
      audio.createOscillator();

    const gain1 =
      audio.createGain();


    oscillator1.type =
      "sine";


    oscillator1.frequency.setValueAtTime(
      1300,
      audio.currentTime
    );


    gain1.gain.setValueAtTime(
      0.001,
      audio.currentTime
    );


    gain1.gain.exponentialRampToValueAtTime(
      0.35,
      audio.currentTime + 0.01
    );


    gain1.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.12
    );


    oscillator1.connect(gain1);

    gain1.connect(
      audio.destination
    );


    oscillator1.start();

    oscillator1.stop(
      audio.currentTime + 0.13
    );


    const oscillator2 =
      audio.createOscillator();

    const gain2 =
      audio.createGain();


    oscillator2.type =
      "sine";


    oscillator2.frequency.setValueAtTime(
      1850,
      audio.currentTime + 0.08
    );


    gain2.gain.setValueAtTime(
      0.001,
      audio.currentTime + 0.08
    );


    gain2.gain.exponentialRampToValueAtTime(
      0.28,
      audio.currentTime + 0.09
    );


    gain2.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.22
    );


    oscillator2.connect(gain2);

    gain2.connect(
      audio.destination
    );


    oscillator2.start(
      audio.currentTime + 0.08
    );


    oscillator2.stop(
      audio.currentTime + 0.23
    );


    setTimeout(function() {

      audio.close();

    }, 400);


  } catch (e) {

    console.log(
      "Audio tidak tersedia",
      e
    );

  }

}


/* ==============================
   GETAR
============================== */

function getarBerhasil() {

  if (navigator.vibrate) {

    navigator.vibrate([
      100,
      50,
      100
    ]);

  }

}


/* ==============================
   MULAI KAMERA
============================== */

function mulaiKamera() {

  if (kameraAktif) return;

  kameraAktif = true;


  document.getElementById("status").innerHTML =
    "⏳ Membuka kamera...";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {

      fps: 30,

      qrbox: {
        width: 320,
        height: 180
      },

      aspectRatio: 1.777778

    },


    function(register) {


      register =
        String(register).trim();


      if (!register) return;


      if (sedangProses) return;


      sedangProses = true;


      /*
       * BARCODE BERHASIL TERBACA
       * TAMPILKAN INDIKATOR HIJAU
       */

      tampilkanIndikatorHijau();


      document.getElementById("status").innerHTML =
        "⏳ Mengecek " +
        register +
        "...";


      cekRegister(register);

    },


    function(errorMessage) {

      // pembacaan yang belum berhasil diabaikan

    }

  )


  .then(function() {


    document.getElementById("status").innerHTML =
      "📷 KAMERA AKTIF<br>" +
      "Arahkan ke barcode";


  })


  .catch(function(error) {


    kameraAktif = false;


    document.getElementById("status").innerHTML =
      "❌ Kamera gagal dibuka<br>" +
      error;


  });

}


/* ==============================
   CEK REGISTER
============================== */

function cekRegister(register) {


  const callbackName =
    "scan_" +
    Date.now();


  window[callbackName] =
    function(hasil) {


      if (
        hasil.status === "success"
      ) {


        jumlahBerhasil++;


        document.getElementById("jumlah").innerHTML =
          "Jumlah berhasil: " +
          jumlahBerhasil;


        document.getElementById("status").innerHTML =
          "✅ " +
          register;


        bunyiBerhasil();


        getarBerhasil();


        tambahHasil(

          hasil.data,

          hasil.tanggalScan,

          hasil.jamScan,

          "success"

        );

      }


      else if (
        hasil.status === "duplicate"
      ) {


        document.getElementById("status").innerHTML =
          "❌ " +
          hasil.message;


        tambahHasil(

          hasil.data,

          "",

          "",

          "duplicate"

        );

      }


      else if (
        hasil.status === "not_found"
      ) {


        document.getElementById("status").innerHTML =
          "⚠️ " +
          hasil.message;


        tambahHasilTidakDitemukan(
          register
        );

      }


      else {


        document.getElementById("status").innerHTML =
          "⚠️ " +
          hasil.message;

      }


      sedangProses = false;


      delete window[callbackName];


      const script =
        document.getElementById(
          callbackName
        );


      if (script) {

        script.remove();

      }

    };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?register=" +
    encodeURIComponent(register) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {


      document.getElementById("status").innerHTML =
        "❌ Gagal menghubungi DATABASE";


      sedangProses = false;


      delete window[callbackName];


      script.remove();

    };


  document.body.appendChild(script);

}


/* ==============================
   HASIL SCAN
============================== */

function tambahHasil(

  data,
  tanggalScan,
  jamScan,
  tipe

) {


  const register =
    data[0];


  const item =
    document.createElement("div");


  item.className =
    "item";


  const id =
    "detail_" +
    Date.now();


  const warna =
    tipe === "success"
    ?
    "success"
    :
    "duplicate";


  const tulisan =
    tipe === "success"
    ?
    "✅ " + register
    :
    "❌ " + register;


  item.innerHTML = `

    <div class="baris">

      <div class="nomor ${warna}">
        ${tulisan}
      </div>

      <button
        class="detailBtn ${
          tipe === "duplicate"
          ? "duplicateBtn"
          : ""
        }"
        onclick="toggleDetail('${id}', this)"
      >
        DETAIL
      </button>

    </div>


    <div
      id="${id}"
      class="detail"
    >

      <div>
        <span class="label">REGISTER</span>
        : ${data[0]}
      </div>

      <div>
        <span class="label">PANJANG</span>
        : ${data[1]}
      </div>

      <div>
        <span class="label">DIAMETER</span>
        : ${data[2]}
      </div>

      <div>
        <span class="label">TPK</span>
        : ${data[3]}
      </div>

      <div>
        <span class="label">TUMPUK</span>
        : ${data[4]}
      </div>

      <div>
        <span class="label">MUTU</span>
        : ${data[5]}
      </div>

      <div>
        <span class="label">STATUS</span>
        : ${data[6]}
      </div>

      <div>
        <span class="label">M3</span>
        : ${data[7]}
      </div>


      ${
        tanggalScan
        ?
        `
        <div>
          <span class="label">TANGGAL</span>
          : ${tanggalScan}
        </div>

        <div>
          <span class="label">JAM</span>
          : ${jamScan}
        </div>
        `
        :
        ""
      }


    </div>

  `;


  document
    .getElementById("daftar")
    .prepend(item);

}


/* ==============================
   TIDAK DITEMUKAN
============================== */

function tambahHasilTidakDitemukan(
  register
) {


  const item =
    document.createElement("div");


  item.className =
    "item";


  item.innerHTML = `

    <div class="baris">

      <div class="nomor notfound">
        ⚠️ ${register}
      </div>

      <div class="notfound">
        TIDAK ADA
      </div>

    </div>

  `;


  document
    .getElementById("daftar")
    .prepend(item);

}


/* ==============================
   DETAIL
============================== */

function toggleDetail(
  id,
  tombol
) {


  const detail =
    document.getElementById(id);


  if (
    detail.style.display === "block"
  ) {


    detail.style.display =
      "none";


    tombol.innerHTML =
      "DETAIL";


  }

  else {


    detail.style.display =
      "block";


    tombol.innerHTML =
      "TUTUP";


  }

}

</script>

</body>
</html>
