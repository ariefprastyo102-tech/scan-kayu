<script>

/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";


/* =====================================================
   VARIABEL KAMERA
===================================================== */

let scannerControls = null;

let scannerReader = null;

let kameraAktif = false;

let sedangProses = false;


/* =====================================================
   DATA SERVER
===================================================== */

let dataScanTersimpan = [];

let jumlahBerhasil = 0;

let sesiAktif = "";

let sedangMuatData = false;

let nomorRequest = 0;


/* =====================================================
   POLLING
===================================================== */

let timerSinkronisasi = null;

const INTERVAL_SINKRONISASI = 2000;


/* =====================================================
   SIMPAN DETAIL YANG SEDANG TERBUKA
===================================================== */

let detailTerbuka = new Set();


/* =====================================================
   JSONP REQUEST
===================================================== */

function requestJSONP(
  parameter,
  callbackSelesai
) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8);

  const script =
    document.createElement(
      "script"
    );

  script.id =
    callbackName;

  let selesai = false;

  window[callbackName] =
    function(hasil) {

      if (selesai) return;

      selesai = true;

      try {

        callbackSelesai(
          hasil
        );

      }

      catch (error) {

        console.log(
          "Callback error:",
          error
        );

      }

      bersihkan();

    };


  function bersihkan() {

    delete window[
      callbackName
    ];

    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );

    }

  }


  script.onerror =
    function() {

      if (selesai) return;

      selesai = true;

      bersihkan();

      callbackSelesai(
        {
          status:
            "error",

          message:
            "Gagal menghubungi DATABASE"
        }
      );

    };


  const query =
    Object.keys(
      parameter
    )
    .map(
      function(key) {

        return (
          encodeURIComponent(key) +
          "=" +
          encodeURIComponent(
            parameter[key]
          )
        );

      }
    )
    .join("&");


  script.src =
    API_URL +
    "?" +
    query +
    "&callback=" +
    callbackName;


  document.body.appendChild(
    script
  );

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(
  nilai
) {

  if (!nilai)
    return "";


  let teks =
    String(
      nilai
    ).trim();


  /*
   * Kalau bentuk ISO:
   * 2026-08-28T00:00:00.000Z
   */

  if (
    teks.includes("T")
  ) {

    const bagian =
      teks.split("T")[0];

    const p =
      bagian.split("-");


    if (
      p.length === 3
    ) {

      return (
        p[2] +
        "-" +
        p[1] +
        "-" +
        p[0]
      );

    }

  }


  /*
   * Kalau sudah dd/MM/yyyy
   */

  if (
    /^\d{2}\/\d{2}\/\d{4}$/.test(
      teks
    )
  ) {

    return teks.replace(
      /\//g,
      "-"
    );

  }


  /*
   * Kalau sudah dd-MM-yyyy
   */

  if (
    /^\d{2}-\d{2}-\d{4}$/.test(
      teks
    )
  ) {

    return teks;

  }


  return teks;

}


/* =====================================================
   FORMAT JAM
===================================================== */

function formatJam(
  nilai
) {

  if (!nilai)
    return "";


  let teks =
    String(
      nilai
    ).trim();


  /*
   * Buang bagian tanggal
   * jika server mengirim ISO.
   *
   * Contoh:
   * 2026-08-28T14:35:20.000Z
   */

  if (
    teks.includes("T")
  ) {

    teks =
      teks.split("T")[1] ||
      "";

  }


  /*
   * Buang Z
   */

  teks =
    teks.replace(
      /Z$/i,
      ""
    );


  /*
   * Buang pecahan detik
   */

  teks =
    teks.split(".")[0];


  /*
   * Ambil HH:mm:ss
   */

  const cocok =
    teks.match(
      /(\d{2}):(\d{2})(?::(\d{2}))?/
    );


  if (cocok) {

    return (
      cocok[1] +
      ":" +
      cocok[2] +
      ":" +
      (
        cocok[3] ||
        "00"
      )
    );

  }


  return teks;

}


/* =====================================================
   AMBIL SESI AKTIF
===================================================== */

function muatDataSesiAktif(
  tampilStatus
) {

  if (sedangMuatData)
    return;

  sedangMuatData = true;

  const requestIni =
    ++nomorRequest;


  requestJSONP(

    {
      getActiveData:
        "1"
    },

    function(hasil) {

      sedangMuatData =
        false;


      if (
        requestIni !==
        nomorRequest
      ) {

        return;

      }


      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        if (tampilStatus) {

          document.getElementById(
            "status"
          ).innerHTML =
            "❌ Gagal mengambil data sesi";

        }

        return;

      }


      sesiAktif =
        hasil.sesi ||
        "";


      const dataServer =
        Array.isArray(
          hasil.data
        )
        ?
        hasil.data
        :
        [];


      dataScanTersimpan =
        dataServer;


      jumlahBerhasil =
        dataServer.filter(
          function(item) {

            return (
              item &&
              item.tipe ===
              "success"
            );

          }
        ).length;


      updateJumlah();


      /*
       * PENTING:
       * Sebelum daftar dibangun ulang,
       * simpan ID DETAIL yang sedang terbuka.
       */

      simpanDetailTerbuka();


      tampilkanDataServer();


      /*
       * Setelah daftar dibangun ulang,
       * buka kembali DETAIL tadi.
       */

      bukaKembaliDetail();


      if (tampilStatus) {

        if (jumlahBerhasil > 0) {

          document.getElementById(
            "status"
          ).innerHTML =
            "📷 Sesi aktif<br>" +
            jumlahBerhasil +
            " batang";

        }

        else {

          document.getElementById(
            "status"
          ).innerHTML =
            "📷 Sesi aktif<br>" +
            "Siap untuk scan";

        }

      }

    }

  );

}


/* =====================================================
   SIMPAN DETAIL TERBUKA
===================================================== */

function simpanDetailTerbuka() {

  detailTerbuka =
    new Set();


  document
    .querySelectorAll(
      ".detail"
    )
    .forEach(
      function(detail) {

        if (
          detail.style.display ===
          "block"
        ) {

          const register =
            detail.dataset.register;


          if (register) {

            detailTerbuka.add(
              register
            );

          }

        }

      }
    );

}


/* =====================================================
   BUKA KEMBALI DETAIL
===================================================== */

function bukaKembaliDetail() {

  detailTerbuka.forEach(
    function(register) {

      const detail =
        document.querySelector(
          '.detail[data-register="' +
          CSS.escape(register) +
          '"]'
        );


      if (!detail)
        return;


      detail.style.display =
        "block";


      const tombol =
        detail.previousElementSibling
          ?
        detail.previousElementSibling
          .querySelector(
            ".detailBtn"
          )
          :
        null;


      if (tombol) {

        tombol.innerHTML =
          "TUTUP";

      }

    }
  );

}


/* =====================================================
   SINKRONISASI OTOMATIS
===================================================== */

function mulaiSinkronisasi() {

  if (timerSinkronisasi) {

    clearInterval(
      timerSinkronisasi
    );

  }


  timerSinkronisasi =
    setInterval(
      function() {

        if (
          sedangProses
        ) {

          return;

        }


        muatDataSesiAktif(
          false
        );

      },
      INTERVAL_SINKRONISASI
    );

}


/* =====================================================
   UPDATE JUMLAH
===================================================== */

function updateJumlah() {

  const angka =
    document.querySelector(
      "#jumlah .angkaTotal"
    );


  if (angka) {

    angka.innerHTML =
      jumlahBerhasil;

  }

}


/* =====================================================
   TAMPIL DATA SERVER
===================================================== */

function tampilkanDataServer() {

  const daftar =
    document.getElementById(
      "daftar"
    );


  daftar.innerHTML =
    "";


  dataScanTersimpan
    .slice()
    .reverse()
    .forEach(
      function(item) {

        if (!item)
          return;


        if (
          item.tipe ===
          "notfound"
        ) {

          tambahHasilTidakDitemukan(
            item.kode || ""
          );

        }

        else {

          tambahHasil(
            item.data,
            item.tanggalScan,
            item.jamScan,
            item.tipe
          );

        }

      }
    );

}


/* =====================================================
   INDIKATOR
===================================================== */

function tampilkanIndikatorHijau() {

  const indikator =
    document.getElementById(
      "scanBerhasil"
    );


  indikator.style.display =
    "block";


  setTimeout(
    function() {

      indikator.style.display =
        "none";

    },
    400
  );

}


/* =====================================================
   SUARA
===================================================== */

function bunyiBerhasil() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext)
      return;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.setValueAtTime(
      1400,
      audio.currentTime
    );


    gain.gain.setValueAtTime(
      0.001,
      audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.35,
      audio.currentTime + 0.01
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.10
    );


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.start();


    oscillator.stop(
      audio.currentTime + 0.11
    );


    setTimeout(
      function() {

        audio.close();

      },
      200
    );

  }

  catch (e) {

    console.log(e);

  }

}


/* =====================================================
   GETAR
===================================================== */

function getarBerhasil() {

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      80
    );

  }

}


/* =====================================================
   OPTIMASI CAMERA
===================================================== */

async function optimalkanKamera(
  video
) {

  try {

    if (!video.srcObject)
      return;


    const tracks =
      video.srcObject
        .getVideoTracks();


    if (!tracks.length)
      return;


    const track =
      tracks[0];


    const capabilities =
      track.getCapabilities
      ?
      track.getCapabilities()
      :
      {};


    const advanced = {};


    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes(
        "continuous"
      )
    ) {

      advanced.focusMode =
        "continuous";

    }


    if (
      capabilities.exposureMode &&
      capabilities.exposureMode.includes(
        "continuous"
      )
    ) {

      advanced.exposureMode =
        "continuous";

    }


    if (
      capabilities.whiteBalanceMode &&
      capabilities.whiteBalanceMode.includes(
        "continuous"
      )
    ) {

      advanced.whiteBalanceMode =
        "continuous";

    }


    if (
      Object.keys(
        advanced
      ).length
    ) {

      await track.applyConstraints({

        advanced: [
          advanced
        ]

      });

    }

  }

  catch (e) {

    console.log(
      "Optimasi kamera tidak tersedia:",
      e
    );

  }

}


/* =====================================================
   MULAI KAMERA
===================================================== */

async function mulaiKamera() {

  if (
    kameraAktif
  ) {

    return;

  }


  const status =
    document.getElementById(
      "status"
    );


  const tombol =
    document.getElementById(
      "btnScan"
    );


  status.innerHTML =
    "⏳ Membuka kamera...";


  try {

    if (
      !window.ZXingBrowser
    ) {

      throw new Error(
        "ZXing belum berhasil dimuat"
      );

    }


    const video =
      document.getElementById(
        "video"
      );


    scannerReader =
      new ZXingBrowser
        .BrowserMultiFormatReader(
          undefined,
          80
        );


    const constraints = {

      audio: false,

      video: {

        facingMode: {

          ideal:
            "environment"

        },

        width: {

          min: 640,

          ideal: 1280,

          max: 1920

        },

        height: {

          min: 480,

          ideal: 720,

          max: 1080

        },

        frameRate: {

          min: 15,

          ideal: 30,

          max: 60

        },

        focusMode: {

          ideal:
            "continuous"

        }

      }

    };


    status.innerHTML =
      "⏳ Meminta akses kamera...";


    scannerControls =
      await scannerReader
        .decodeFromConstraints(

          constraints,

          video,

          function(
            result,
            error
          ) {

            if (!result)
              return;


            if (
              sedangProses
            )
              return;


            const kode =
              String(
                result.getText() ||
                ""
              ).trim();


            if (!kode)
              return;


            sedangProses =
              true;


            tampilkanIndikatorHijau();


            const format =
              result.getBarcodeFormat();


            status.innerHTML =
              "⏳ BARCODE TERBACA<br>" +
              "Mengecek " +
              kode +
              "...";


            if (
              format ===
              ZXingBrowser
                .BarcodeFormat
                .CODE_128
            ) {

              cekRegister(
                kode
              );

            }

            else if (
              format ===
              ZXingBrowser
                .BarcodeFormat
                .QR_CODE
            ) {

              cekQR(
                kode
              );

            }

            else {

              status.innerHTML =
                "⚠️ Format barcode tidak didukung<br>" +
                kode;


              sedangProses =
                false;

            }

          }

        );


    kameraAktif =
      true;


    tombol.innerHTML =
      "📷 KAMERA AKTIF";


    tombol.style.background =
      "#555";


    status.innerHTML =
      "📷 KAMERA AKTIF<br>" +
      "Arahkan QR / CODE 128 ke kotak hijau";


    setTimeout(
      function() {

        optimalkanKamera(
          video
        );

      },
      500
    );

  }

  catch (error) {

    kameraAktif =
      false;


    scannerControls =
      null;


    tombol.innerHTML =
      "📷 BUKA KAMERA";


    tombol.style.background =
      "#1976d2";


    status.innerHTML =
      "❌ Kamera gagal dibuka<br>" +
      error.message;


    console.log(
      "ZXing error:",
      error
    );

  }

}


/* =====================================================
   CEK QR
===================================================== */

function cekQR(
  kode
) {

  requestJSONP(

    {
      kode:
        kode
    },

    function(hasil) {

      prosesHasilScan(
        hasil,
        kode
      );

    }

  );

}


/* =====================================================
   CEK CODE 128
===================================================== */

function cekRegister(
  register
) {

  requestJSONP(

    {
      register:
        register
    },

    function(hasil) {

      prosesHasilScan(
        hasil,
        register
      );

    }

  );

}


/* =====================================================
   PROSES HASIL SCAN
===================================================== */

function prosesHasilScan(
  hasil,
  kode
) {

  if (
    hasil.status ===
    "success"
  ) {

    document.getElementById(
      "status"
    ).innerHTML =
      "✅ " +
      (
        hasil.data &&
        hasil.data[0]
        ?
        hasil.data[0]
        :
        kode
      );


    bunyiBerhasil();

    getarBerhasil();


    setTimeout(
      function() {

        muatDataSesiAktif(
          false
        );

      },
      200
    );

  }

  else if (
    hasil.status ===
    "duplicate"
  ) {

    document.getElementById(
      "status"
    ).innerHTML =
      "❌ " +
      hasil.message;


    setTimeout(
      function() {

        muatDataSesiAktif(
          false
        );

      },
      200
    );

  }

  else if (
    hasil.status ===
    "not_found"
  ) {

    document.getElementById(
      "status"
    ).innerHTML =
      "⚠️ " +
      hasil.message;


    tambahHasilTidakDitemukan(
      kode
    );

  }

  else {

    document.getElementById(
      "status"
    ).innerHTML =
      "⚠️ " +
      (
        hasil.message ||
        "Terjadi kesalahan"
      );

  }


  sedangProses =
    false;

}


/* =====================================================
   TAMBAH HASIL
===================================================== */

function tambahHasil(

  tanggalScan,
  jamScan,
  tipe

) {

  if (!data)
    return;


  const register =
    String(

    );

    document.createElement(
      "div"
    );

    "item";

    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(
        2,
        8
      );


  const warna =
    tipe ===
    "success"

    "success"
    :
    "duplicate";

    tipe ===
    "success"
    ?
    "✅ " +
    register
    :
    "❌ " +
    register;


  const tanggal =
    formatTanggal(
      tanggalScan
    );


  const jam =
    formatJam(
      jamScan
    );


  item.innerHTML = `

    <div class="baris">

      <div class="nomor ${warna}">
        ${tulisan}
      </div>

      <button

          ? "duplicateBtn"

        }"

          '${id}',
          this
        )"

        DETAIL
      </button>

    </div>

    <div
      id="${id}"
      class="detail"
      data-register="${escapeHtml(register)}"
    >

      <div>
        <span class="label">
          REGISTER
        </span>
        : ${escapeHtml(data[0] || "")}
      </div>

      <div>
        <span class="label">
          PANJANG
        </span>
        : ${escapeHtml(data[1] || "")}
      </div>

      <div>
        <span class="label">
          DIAMETER
        </span>
        : ${escapeHtml(data[2] || "")}
      </div>

      <div>
        <span class="label">
          TPK
        </span>
        : ${escapeHtml(data[3] || "")}
      </div>

      <div>
        <span class="label">
          TUMPUK
        </span>
        : ${escapeHtml(data[4] || "")}
      </div>

      <div>
        <span class="label">
          MUTU
        </span>
        : ${escapeHtml(data[5] || "")}
      </div>

      <div>
        <span class="label">
          STATUS
        </span>
        : ${escapeHtml(data[6] || "")}
      </div>

      <div>
        <span class="label">
          M3
        </span>
        : ${escapeHtml(data[7] || "")}
      </div>

      ${
        tanggal
        ?
        `
        <div>
          <span class="label">
            TANGGAL
          </span>
          : ${escapeHtml(tanggal)}
        </div>
        `
        :
        ""
      }

      ${
        jam
        ?
        `
        <div>
          <span class="label">
            JAM
          </span>
          : ${escapeHtml(jam)}
        </div>
        `
        :
        ""
      }

    </div>

  `;


  document
    .getElementById(
      "daftar"
    )
    .appendChild(
      item
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  nilai
) {

  return String(
    nilai || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   TIDAK DITEMUKAN
===================================================== */

function tambahHasilTidakDitemukan(
  kode
) {

  const daftar =
    document.getElementById(
      "daftar"
    );


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "item";


  item.innerHTML = `

    <div class="baris">

      <div class="nomor notfound">
        ⚠️ ${escapeHtml(kode)}
      </div>

      <div class="notfound">
        TIDAK ADA
      </div>

    </div>

  `;


  daftar.prepend(
    item
  );

}


/* =====================================================
   DETAIL
===================================================== */

function toggleDetail(
  id,
  tombol
) {

  const detail =
    document.getElementById(
      id
    );


  if (!detail)
    return;


  if (
    detail.style.display ===
    "block"
  ) {

    detail.style.display =
      "none";


    tombol.innerHTML =
      "DETAIL";


    detailTerbuka.delete(
      detail.dataset.register
    );

  }

  else {

    detail.style.display =
      "block";


    tombol.innerHTML =
      "TUTUP";


    detailTerbuka.add(
      detail.dataset.register
    );

  }

}


/* =====================================================
   SCAN BARU
===================================================== */

function scanBaru() {

  const yakin =
    confirm(

      "Mulai SCAN BARU?\n\n" +

      "Sesi yang sedang aktif akan disimpan sebagai HISTORY.\n\n" +

      "Semua HP yang membuka web ini akan pindah ke sesi baru.\n\n" +

      "Lanjutkan?"

    );


  if (!yakin)
    return;


  const status =
    document.getElementById(
      "status"
    );


  const tombol =
    document.getElementById(
      "btnScanBaru"
    );


  tombol.disabled =
    true;


  tombol.innerHTML =
    "⏳ MEMBUAT SESI BARU...";


  status.innerHTML =
    "⏳ Menyimpan sesi lama ke HISTORY...";


  requestJSONP(

    {
      mulaiSesiBaru:
        "1"
    },

    function(hasil) {

      tombol.disabled =
        false;


      tombol.innerHTML =
        "🔄 SCAN BARU";


      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        status.innerHTML =
          "❌ " +
          (
            hasil &&
            hasil.message
            ?
            hasil.message
            :
            "Gagal membuat sesi baru"
          );

        return;

      }


      sesiAktif =
        hasil.sesi ||
        "";


      dataScanTersimpan =
        [];


      jumlahBerhasil =
        0;


      detailTerbuka =
        new Set();


      muatDataSesiAktif(
        false
      );


      status.innerHTML =
        "📷 SESI BARU AKTIF<br>" +
        "Siap untuk scan";

    }

  );

}


/* =====================================================
   HISTORY
===================================================== */

function tampilkanHistory() {

  const panel =
    document.getElementById(
      "historyPanel"
    );


  const isi =
    document.getElementById(
      "isiHistory"
    );


  isi.innerHTML = `

    <div class="historyItem">

      <div style="
        text-align:center;
        color:#777;
        padding:10px;
      ">

        ⏳ Mengambil history...

      </div>

    </div>

  `;


  panel.style.display =
    "block";


  panel.scrollIntoView({
    behavior:
      "smooth"
  });


  requestJSONP(

    {
      getHistory:
        "1"
    },

    function(hasil) {

      isi.innerHTML =
        "";


      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        isi.innerHTML = `

          <div class="historyItem">

            <div style="
              text-align:center;
              color:#c62828;
              padding:10px;
            ">

              ❌ Gagal mengambil history.

            </div>

          </div>

        `;

        return;

      }


      const history =
        Array.isArray(
          hasil.data
        )
        ?
        hasil.data
        :
        [];


      if (
        history.length ===
        0
      ) {

        isi.innerHTML = `

          <div class="historyItem">

            <div style="
              text-align:center;
              color:#777;
              padding:10px;
            ">

              Belum ada history scan.

            </div>

          </div>

        `;

        return;

      }


      history.forEach(
        function(sesi, index) {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "historyItem";


          const id =
            "history_detail_" +
            Date.now() +
            "_" +
            index;


          const semuaData =
            Array.isArray(
              sesi.data
            )
            ?
            sesi.data
            :
            [];


          item.innerHTML = `

            <div class="historyTop">

              <div>

                <div class="historyNomor">
                  SCAN #${
                    sesi.sesi ||
                    "-"
                  }
                </div>

                <div class="historyTanggal">
                  📅 ${
                    formatTanggal(
                      sesi.tanggal
                    ) ||
                    "-"
                  }
                </div>

                <div class="historyTanggal">
                  🕐 ${
                    formatJam(
                      sesi.jam
                    ) ||
                    "-"
                  }
                </div>

              </div>

              <div class="historyJumlah">
                ${
                  sesi.jumlah ||
                  0
                }
                BATANG
              </div>

            </div>

            <button
              class="btnHistoryDetail"
              onclick="toggleHistoryDetail(
                '${id}',
                this
              )"
            >
              LIHAT DETAIL REGISTER
            </button>

            <div
              id="${id}"
              class="historyDetail"
            ></div>

          `;


          isi.appendChild(
            item
          );


          const detail =
            document.getElementById(
              id
            );


          semuaData.forEach(
            function(dataScan) {

              if (!dataScan)
                return;


              if (
                dataScan.tipe ===
                "success"
              ) {

                const register =
                  dataScan.data &&
                  dataScan.data[0]
                  ?
                  dataScan.data[0]
                  :
                  "";


                const baris =
                  document.createElement(
                    "div"
                  );


                baris.className =
                  "historyRegister success";


                baris.innerHTML =
                  "✅ " +
                  escapeHtml(
                    register
                  );


                detail.appendChild(
                  baris
                );

              }

              else if (
                dataScan.tipe ===
                "duplicate"
              ) {

                const register =
                  dataScan.data &&
                  dataScan.data[0]
                  ?
                  dataScan.data[0]
                  :
                  "";


                const baris =
                  document.createElement(
                    "div"
                  );


                baris.className =
                  "historyRegister duplicate";


                baris.innerHTML =
                  "❌ " +
                  escapeHtml(
                    register
                  ) +
                  " — DUPLIKAT";


                detail.appendChild(
                  baris
                );

              }

              else if (
                dataScan.tipe ===
                "notfound"
              ) {

                const baris =
                  document.createElement(
                    "div"
                  );


                baris.className =
                  "historyRegister notfound";


                baris.innerHTML =
                  "⚠️ " +
                  escapeHtml(
                    dataScan.kode ||
                    ""
                  ) +
                  " — TIDAK ADA";


                detail.appendChild(
                  baris
                );

              }

            }
          );

        }
      );


      const tombolHapus =
        document.createElement(
          "button"
        );


      tombolHapus.className =
        "btnHapusHistory";


      tombolHapus.innerHTML =
        "🗑️ HAPUS SEMUA HISTORY";


      tombolHapus.onclick =
        hapusSemuaHistory;


      isi.appendChild(
        tombolHapus
      );

    }

  );

}

   TUTUP HISTORY

    "historyPanel"
  ).style.display =
    "none";

}

   DETAIL HISTORY

) {

        padding:10px;
      ">

      </div>

  );

}
