<style>

/* ==============================
   HEADER

.header {

.logo {

.judulBox {

  text-align: left;
}

.judul {
  font-size: 22px;

  color: #176b38;

}

.subjudul {

  letter-spacing: 1.5px;

/* ==============================
   CAMERA
============================== */

.camera-card {
  width: 100%;
  max-width: 500px;
  margin: auto;
  background: white;
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.camera-wrapper {
  position: relative;
  width: 100%;
  height: 300px;
  border-radius: 10px;
  overflow: hidden;

}

#video {
  width: 100%;
  height: 300px;
  object-fit: cover;
  display: block;
}

/* ==============================
   GARIS POJOK
============================== */

.qr-frame {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 250px;
  height: 250px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 10;
}

.corner {
  position: absolute;
  width: 55px;
  height: 55px;
  border-color: #00e676;
  border-style: solid;
}

.tl {
  left: 0;
  top: 0;
  border-width: 5px 0 0 5px;
  border-radius: 6px 0 0 0;
}

.tr {
  right: 0;
  top: 0;
  border-width: 5px 5px 0 0;
  border-radius: 0 6px 0 0;
}

.bl {
  left: 0;
  bottom: 0;
  border-width: 0 0 5px 5px;
  border-radius: 0 0 0 6px;
}

.br {
  right: 0;
  bottom: 0;
  border-width: 0 5px 5px 0;
  border-radius: 0 0 6px 0;
}

/* ==============================
   INDIKATOR BERHASIL
============================== */

#scanBerhasil {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 250px;
  height: 250px;
  transform: translate(-50%, -50%);
  border: 6px solid #00e676;
  border-radius: 12px;
  display: none;
  z-index: 20;
  pointer-events: none;
  box-shadow:
    0 0 10px rgba(0,230,118,0.9),
    0 0 25px rgba(0,230,118,0.8);
}

#scanBerhasil::after {
  content: "✓";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 60px;
  height: 60px;
  border-radius: 50%;

  color: white;
  font-size: 40px;

  line-height: 60px;

}

/* ==============================

============================== */

#btnScan,

  margin: 15px auto;

#btnScan:active,

}

/* ==============================

/* ==============================

.historyHeader {

.historyTop {

.historyNomor {

<body>

<!-- ==============================
     HEADER
============================== -->

<div class="header">

  <div class="headerIsi">

    <img
      class="logo"
      src="logo-perhutani.jpg"
      alt="Logo Perhutani"
    >

    <div class="judulBox">

      <div class="judul">
        SCAN REGISTER BBI
      </div>

      <div class="subjudul">
        IK SARADAN
      </div>

    </div>

  </div>

</div>

<!-- ==============================
     CAMERA
============================== -->

<div class="camera-card">

  <div class="camera-wrapper">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <div class="qr-frame">

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

    </div>

    <div id="scanBerhasil"></div>

  </div>

</div>

<button
  id="btnScan"
  onclick="mulaiKamera()"
>
  📷 BUKA KAMERA
</button>

  id="btnScanBaru"
  onclick="scanBaru()"
>
  🔄 SCAN BARU
</button>

<!-- ==============================
     HISTORY FLOATING
============================== -->

  id="btnHistory"
  onclick="tampilkanHistory()"
  title="History Scan"
>
  📋 HISTORY
</button>

<!-- ==============================
     TOTAL
============================== -->

<div class="status-card">

  <div id="jumlah">

    <span class="angkaTotal">
      0
    </span>

    <span class="teksBatang">
      BATANG
    </span>

  </div>

  <div id="status">
    Tekan Buka Kamera
  </div>

</div>

<!-- ==============================
     HASIL SCAN SESI AKTIF
============================== -->

<div id="daftar"></div>

<!-- ==============================
     HISTORY
============================== -->

<div id="historyPanel">

  <div class="historyHeader">

    <div class="historyJudul">
      📋 HISTORY SCAN
    </div>

    <button
      class="tutupHistory"
      onclick="tutupHistory()"
    >
      TUTUP
    </button>

  </div>

  <div id="isiHistory"></div>

</div>

<script>

/* =====================================================
   API
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyRZ4zVWMuOBxsVQHvrd5DzFdztNtcKcF_Te6Y7fXCsV8-hAQGqT8nio2vfAoB4x-t-/exec";

/* =====================================================
   LOCAL STORAGE
===================================================== */

const STORAGE_DATA =
"SCAN_REGISTER_BBI_DATA";

const STORAGE_HISTORY =
"SCAN_REGISTER_BBI_HISTORY";

/* =====================================================
   VARIABEL
===================================================== */

let scannerControls = null;

let kameraAktif = false;

let sedangProses = false;

let jumlahBerhasil = 0;

let dataScanTersimpan = [];

/*
 * Menyimpan kode yang sedang dicek.
 * Ini mencegah kamera membaca barcode
 * yang sama berkali-kali sebelum API selesai.
 */

let kodeSedangDicek = "";

/* =====================================================
   LOAD SESI AKTIF
===================================================== */

function muatDataTersimpan() {

  try {

    const data =
      localStorage.getItem(
        STORAGE_DATA
      );

    if (data) {

      dataScanTersimpan =
        JSON.parse(data);

    }

    if (
      !Array.isArray(
        dataScanTersimpan
      )
    ) {

      dataScanTersimpan = [];

    }

  }

  catch (e) {

    console.log(
      "Gagal membaca data:",
      e
    );

    dataScanTersimpan = [];

  }

  jumlahBerhasil =
    dataScanTersimpan.filter(
      function(item) {

        return item.tipe === "success";

      }
    ).length;

}

/* =====================================================
   SIMPAN SESI AKTIF
===================================================== */

function simpanData() {

  try {

    localStorage.setItem(

      STORAGE_DATA,

      JSON.stringify(
        dataScanTersimpan
      )

    );

  }

  catch (e) {

    console.log(
      "Gagal menyimpan data:",
      e
    );

  }

}

/* =====================================================
   UPDATE TOTAL
===================================================== */

function updateJumlah() {

  const angka =
    document.querySelector(
      "#jumlah .angkaTotal"
    );

  if (angka) {

    angka.innerHTML =
      jumlahBerhasil;

  }

}

/* =====================================================
   TAMPILKAN SESI AKTIF
===================================================== */

function tampilkanDataTersimpan() {

  const daftar =
    document.getElementById(
      "daftar"
    );

  daftar.innerHTML = "";

  dataScanTersimpan
    .slice()
    .reverse()
    .forEach(
      function(item) {

        if (
          item.tipe ===
          "notfound"
        ) {

          tambahHasilTidakDitemukan(
            item.kode
          );

        }

        else {

          tambahHasil(
            item.data,
            item.tanggalScan,
            item.jamScan,
            item.tipe
          );

        }

      }
    );

}

/* =====================================================
   LOAD AWAL
===================================================== */

muatDataTersimpan();

updateJumlah();

tampilkanDataTersimpan();

/* =====================================================
   INDIKATOR HIJAU
===================================================== */

function tampilkanIndikatorHijau() {

  const indikator =
    document.getElementById(
      "scanBerhasil"
    );

  indikator.style.display =
    "block";

  setTimeout(
    function() {

      indikator.style.display =
        "none";

    },
    350
  );

}

/* =====================================================
   SUARA
===================================================== */

function bunyiBerhasil() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;

    const audio =
      new AudioContext();

    const oscillator1 =
      audio.createOscillator();

    const gain1 =
      audio.createGain();

    oscillator1.type =
      "sine";

    oscillator1.frequency.setValueAtTime(
      1300,
      audio.currentTime
    );

    gain1.gain.setValueAtTime(
      0.001,
      audio.currentTime
    );

    gain1.gain.exponentialRampToValueAtTime(
      0.35,
      audio.currentTime + 0.01
    );

    gain1.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.12
    );

    oscillator1.connect(gain1);

    gain1.connect(
      audio.destination
    );

    oscillator1.start();

    oscillator1.stop(
      audio.currentTime + 0.13
    );

    setTimeout(
      function() {

        audio.close();

      },
      300
    );

  }

  catch (e) {

    console.log(e);

  }

}

/* =====================================================
   GETAR
===================================================== */

function getarBerhasil() {

  if (navigator.vibrate) {

    navigator.vibrate(80);

  }

}

/* =====================================================
   MULAI KAMERA ZXING
===================================================== */

async function mulaiKamera() {

  if (kameraAktif) return;

  const status =
    document.getElementById(
      "status"
    );

  const tombol =
    document.getElementById(
      "btnScan"
    );

  status.innerHTML =
    "⏳ Membuka kamera...";

  try {

    if (
      !window.ZXingBrowser
    ) {

      throw new Error(
        "ZXing belum berhasil dimuat"
      );

    }

    const video =
      document.getElementById(
        "video"
      );

    const reader =
      new ZXingBrowser.BrowserMultiFormatReader();

    const constraints = {

      audio: false,

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        },

        frameRate: {
          ideal: 30,
          max: 60
        }

      }

    };

    status.innerHTML =
      "⏳ Meminta akses kamera...";

    scannerControls =
      await reader.decodeFromConstraints(

        constraints,

        video,

        function(
          result,
          error
        ) {

          if (!result) return;

          const kode =
            String(
              result.getText() || ""
            ).trim();

          if (!kode) return;

          /*
           * LANGSUNG BLOK SCAN BERIKUTNYA
           * SAAT BARCODE TERBACA.
           */

          if (sedangProses) return;

          /*
           * Pengaman tambahan agar barcode
           * yang sama tidak dikirim dua kali.
           */

          if (
            kode === kodeSedangDicek
          ) {

            return;

          }

          sedangProses = true;

          kodeSedangDicek =
            kode;

          tampilkanIndikatorHijau();

          const format =
            result.getBarcodeFormat();

          status.innerHTML =
            "⏳ BARCODE TERBACA<br>" +
            "Mengecek " +
            kode +
            "...";

          /*
           * LANGSUNG CEK.
           * Tidak ada setTimeout / delay.
           */

          if (
            format ===
            ZXingBrowser.BarcodeFormat.QR_CODE
          ) {

            cekQR(kode);

          }

          else if (
            format ===
            ZXingBrowser.BarcodeFormat.CODE_128
          ) {

            cekRegister(kode);

          }

          else {

            status.innerHTML =
              "⚠️ Format barcode tidak didukung<br>" +
              kode;

            sedangProses = false;

            kodeSedangDicek = "";

          }

        }

      );

    kameraAktif =
      true;

    tombol.innerHTML =
      "📷 KAMERA AKTIF";

    tombol.style.background =
      "#555";

    status.innerHTML =
      "📷 KAMERA AKTIF<br>" +
      "Arahkan QR / CODE 128 ke kotak hijau";

  }

  catch (error) {

    kameraAktif =
      false;

    tombol.innerHTML =
      "📷 BUKA KAMERA";

    tombol.style.background =
      "#1976d2";

    status.innerHTML =
      "❌ Kamera gagal dibuka<br>" +
      error.message;

    console.log(
      "ZXing error:",
      error
    );

  }

}

/* =====================================================
   CEK QR
===================================================== */

function cekQR(kode) {

  const callbackName =
    "scan_" +
    Date.now();

  window[callbackName] =
    function(hasil) {

      prosesHasilScan(
        hasil,
        kode,
        callbackName
      );

    };

  const script =
    document.createElement(
      "script"
    );

  script.id =
    callbackName;

  script.src =
    API_URL +
    "?kode=" +
    encodeURIComponent(
      kode
    ) +
    "&callback=" +
    callbackName;

  script.onerror =
    function() {

      document.getElementById(
        "status"
      ).innerHTML =
        "❌ Gagal menghubungi DATABASE";

      sedangProses = false;

      kodeSedangDicek = "";

      delete window[
        callbackName
      ];

      script.remove();

    };

  document.body.appendChild(
    script
  );

}

/* =====================================================
   CEK CODE 128
===================================================== */

function cekRegister(register) {

  const callbackName =
    "scan_" +
    Date.now();

  window[callbackName] =
    function(hasil) {

      prosesHasilScan(
        hasil,
        register,
        callbackName
      );

    };

  const script =
    document.createElement(
      "script"
    );

  script.id =
    callbackName;

  script.src =
    API_URL +
    "?register=" +
    encodeURIComponent(
      register
    ) +
    "&callback=" +
    callbackName;

  script.onerror =
    function() {

      document.getElementById(
        "status"
      ).innerHTML =
        "❌ Gagal menghubungi DATABASE";

      sedangProses = false;

      kodeSedangDicek = "";

      delete window[
        callbackName
      ];

      script.remove();

    };

  document.body.appendChild(
    script
  );

}

/* =====================================================
   PROSES HASIL
===================================================== */

function prosesHasilScan(
  hasil,
  kode,
  callbackName
) {

  const status =
    document.getElementById(
      "status"
    );

  /*
   * HASIL SUKSES
   */

  if (
    hasil &&
    hasil.status ===
    "success"
  ) {

    jumlahBerhasil++;

    updateJumlah();

    status.innerHTML =
      "✅ " +
      hasil.data[0];

    bunyiBerhasil();

    getarBerhasil();

    dataScanTersimpan.push({

      tipe: "success",

      data: hasil.data,

      tanggalScan:
        hasil.tanggalScan || "",

      jamScan:
        hasil.jamScan || "",

      waktuSimpan:
        new Date().toISOString()

    });

    simpanData();

    tambahHasil(
      hasil.data,
      hasil.tanggalScan,
      hasil.jamScan,
      "success"
    );

  }

  /*
   * DUPLIKAT
   */

  else if (
    hasil &&
    hasil.status ===
    "duplicate"
  ) {

    status.innerHTML =
      "❌ " +
      hasil.message;

    dataScanTersimpan.push({

      tipe: "duplicate",

      data:
        hasil.data || [kode],

      tanggalScan: "",

      jamScan: "",

      waktuSimpan:
        new Date().toISOString()

    });

    simpanData();

    tambahHasil(
      hasil.data || [kode],
      "",
      "",
      "duplicate"
    );

  }

  /*
   * TIDAK DITEMUKAN
   */

  else if (
    hasil &&
    hasil.status ===
    "not_found"
  ) {

    status.innerHTML =
      "⚠️ " +
      hasil.message;

    dataScanTersimpan.push({

      tipe: "notfound",

      kode: kode,

      waktuSimpan:
        new Date().toISOString()

    });

    simpanData();

    tambahHasilTidakDitemukan(
      kode
    );

  }

  /*
   * RESPONSE LAIN
   */

  else {

    status.innerHTML =
      "⚠️ " +
      (
        hasil &&
        hasil.message
        ?
        hasil.message
        :
        "Response DATABASE tidak dikenal"
      );

  }

  /*
   * LANGSUNG SIAP SCAN BERIKUTNYA
   */

  sedangProses =
    false;

  kodeSedangDicek =
    "";

  delete window[
    callbackName
  ];

  const script =
    document.getElementById(
      callbackName
    );

  if (script) {

    script.remove();

  }

}

/* =====================================================
   TAMBAH HASIL
===================================================== */

function tambahHasil(

  data,
  tanggalScan,
  jamScan,
  tipe

) {

  if (!data) return;

  const register =
    data[0] || "";

  const item =
    document.createElement(
      "div"
    );

  item.className =
    "item";

  const id =
    "detail_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8);

  const warna =
    tipe === "success"
    ?
    "success"
    :
    "duplicate";

  const tulisan =
    tipe === "success"
    ?
    "✅ " + register
    :
    "❌ " + register;

  item.innerHTML = `

    <div class="baris">

      <div class="nomor ${warna}">
        ${tulisan}
      </div>

      <button
        class="detailBtn ${
          tipe === "duplicate"
          ? "duplicateBtn"
          : ""
        }"
        onclick="toggleDetail('${id}', this)"
      >
        DETAIL
      </button>

    </div>

    <div
      id="${id}"
      class="detail"
    >

      <div>
        <span class="label">REGISTER</span>
        : ${data[0] || ""}
      </div>

      <div>
        <span class="label">PANJANG</span>
        : ${data[1] || ""}
      </div>

      <div>
        <span class="label">DIAMETER</span>
        : ${data[2] || ""}
      </div>

      <div>
        <span class="label">TPK</span>
        : ${data[3] || ""}
      </div>

      <div>
        <span class="label">TUMPUK</span>
        : ${data[4] || ""}
      </div>

      <div>
        <span class="label">MUTU</span>
        : ${data[5] || ""}
      </div>

      <div>
        <span class="label">STATUS</span>
        : ${data[6] || ""}
      </div>

      <div>
        <span class="label">M3</span>
        : ${data[7] || ""}
      </div>

      ${
        tanggalScan
        ?
        `
        <div>
          <span class="label">TANGGAL</span>
          : ${tanggalScan}
        </div>

        <div>
          <span class="label">JAM</span>
          : ${jamScan}
        </div>
        `
        :
        ""
      }

    </div>

  `;

  document
    .getElementById(
      "daftar"
    )
    .prepend(item);

}

/* =====================================================
   TIDAK DITEMUKAN
===================================================== */

function tambahHasilTidakDitemukan(
  kode
) {

  const item =
    document.createElement(
      "div"
    );

  item.className =
    "item";

  item.innerHTML = `

    <div class="baris">

      <div class="nomor notfound">
        ⚠️ ${kode}
      </div>

      <div class="notfound">
        TIDAK ADA
      </div>

    </div>

  `;

  document
    .getElementById(
      "daftar"
    )
    .prepend(item);

}

/* =====================================================
   DETAIL
===================================================== */

function toggleDetail(
  id,
  tombol
) {

  const detail =
    document.getElementById(
      id
    );

  if (
    detail.style.display ===
    "block"
  ) {

    detail.style.display =
      "none";

    tombol.innerHTML =
      "DETAIL";

  }

  else {

    detail.style.display =
      "block";

    tombol.innerHTML =
      "TUTUP";

  }

}

/* =====================================================
   SCAN BARU
===================================================== */

function scanBaru() {

  if (
    dataScanTersimpan.length === 0
  ) {

    alert(
      "Belum ada data scan."
    );

    return;

  }

  const jumlahSesi =
    dataScanTersimpan.filter(
      function(item) {

        return item.tipe ===
          "success";

      }
    ).length;

  const sekarang =
    new Date();

  const tanggal =
    sekarang.toLocaleDateString(
      "id-ID"
    );

  const jam =
    sekarang.toLocaleTimeString(
      "id-ID"
    );

  const yakin =
    confirm(

      "Mulai SCAN BARU?\n\n" +

      "Sesi saat ini: " +
      jumlahSesi +
      " batang\n\n" +

      "Sesi ini akan disimpan sebagai 1 HISTORY."

    );

  if (!yakin) return;

  let history =
    [];

  try {

    history =
      JSON.parse(
        localStorage.getItem(
          STORAGE_HISTORY
        ) || "[]"
      );

    if (
      !Array.isArray(history)
    ) {

      history = [];

    }

  }

  catch (e) {

    history = [];

  }

  const nomorSesi =
    history.length + 1;

  const sesiBaru = {

    nomorSesi:
      nomorSesi,

    tanggal:
      tanggal,

    jam:
      jam,

    jumlah:
      jumlahSesi,

    data:
      JSON.parse(
        JSON.stringify(
          dataScanTersimpan
        )
      )

  };

  history.push(
    sesiBaru
  );

  try {

    localStorage.setItem(

      STORAGE_HISTORY,

      JSON.stringify(
        history
      )

    );

  }

  catch (e) {

    alert(
      "History gagal disimpan."
    );

    return;

  }

  dataScanTersimpan = [];

  jumlahBerhasil = 0;

  localStorage.removeItem(
    STORAGE_DATA
  );

  document.getElementById(
    "daftar"
  ).innerHTML = "";

  updateJumlah();

  document.getElementById(
    "status"
  ).innerHTML =
    "📷 Siap untuk scan baru";

}

/* =====================================================
   TAMPILKAN HISTORY
===================================================== */

function tampilkanHistory() {

  const panel =
    document.getElementById(
      "historyPanel"
    );

  const isi =
    document.getElementById(
      "isiHistory"
    );

  let history =
    [];

  try {

    history =
      JSON.parse(
        localStorage.getItem(
          STORAGE_HISTORY
        ) || "[]"
      );

    if (
      !Array.isArray(history)
    ) {

      history = [];

    }

  }

  catch (e) {

    history = [];

  }

  isi.innerHTML = "";

  if (
    history.length === 0
  ) {

    isi.innerHTML = `

      <div class="historyItem">

        <div style="
          text-align:center;
          color:#777;
          padding:10px;
        ">

          Belum ada history scan.

        </div>

      </div>

    `;

    panel.style.display =
      "block";

    panel.scrollIntoView({
      behavior: "smooth"
    });

    return;

  }

  history
    .slice()
    .reverse()
    .forEach(
      function(sesi, index) {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "historyItem";

        const id =
          "history_detail_" +
          Date.now() +
          "_" +
          index;

        const semuaData =
          Array.isArray(
            sesi.data
          )
          ?
          sesi.data
          :
          [];

        item.innerHTML = `

          <div class="historyTop">

            <div>

              <div class="historyNomor">
                SCAN #${sesi.nomorSesi || "-"}
              </div>

              <div class="historyTanggal">
                📅 ${sesi.tanggal || "-"}
              </div>

              <div class="historyTanggal">
                🕐 ${sesi.jam || "-"}
              </div>

            </div>

            <div class="historyJumlah">
              ${sesi.jumlah || 0} BATANG
            </div>

          </div>

          <button
            class="btnHistoryDetail"
            onclick="toggleHistoryDetail(
              '${id}',
              this
            )"
          >
            LIHAT DETAIL REGISTER
          </button>

          <div
            id="${id}"
            class="historyDetail"
          ></div>

        `;

        isi.appendChild(
          item
        );

        const detail =
          document.getElementById(
            id
          );

        semuaData.forEach(
          function(dataScan) {

            if (
              dataScan.tipe ===
              "success"
            ) {

              const register =
                dataScan.data &&
                dataScan.data[0]
                ?
                dataScan.data[0]
                :
                "";

              const baris =
                document.createElement(
                  "div"
                );

              baris.className =
                "historyRegister success";

              baris.innerHTML =
                "✅ " +
                register;

              detail.appendChild(
                baris
              );

            }

            else if (
              dataScan.tipe ===
              "duplicate"
            ) {

              const register =
                dataScan.data &&
                dataScan.data[0]
                ?
                dataScan.data[0]
                :
                "";

              const baris =
                document.createElement(
                  "div"
                );

              baris.className =
                "historyRegister duplicate";

              baris.innerHTML =
                "❌ " +
                register +
                " — DUPLIKAT";

              detail.appendChild(
                baris
              );

            }

            else if (
              dataScan.tipe ===
              "notfound"
            ) {

              const baris =
                document.createElement(
                  "div"
                );

              baris.className =
                "historyRegister notfound";

              baris.innerHTML =
                "⚠️ " +
                (
                  dataScan.kode ||
                  ""
                ) +
                " — TIDAK ADA";

              detail.appendChild(
                baris
              );

            }

          }
        );

      }
    );

  const tombolHapus =
    document.createElement(
      "button"
    );

  tombolHapus.className =
    "btnHapusHistory";

  tombolHapus.innerHTML =
    "🗑️ HAPUS SEMUA HISTORY";

  tombolHapus.onclick =
    hapusSemuaHistory;

  isi.appendChild(
    tombolHapus
  );

  panel.style.display =
    "block";

  panel.scrollIntoView({
    behavior: "smooth"
  });

}

/* =====================================================
   TUTUP HISTORY
===================================================== */

function tutupHistory() {

  document.getElementById(
    "historyPanel"
  ).style.display =
    "none";

}

/* =====================================================
   DETAIL HISTORY
===================================================== */

function toggleHistoryDetail(
  id,
  tombol
) {

  const detail =
    document.getElementById(
      id
    );

  if (
    detail.style.display ===
    "block"
  ) {

    detail.style.display =
      "none";

    tombol.innerHTML =
      "LIHAT DETAIL REGISTER";

  }

  else {

    detail.style.display =
      "block";

    tombol.innerHTML =
      "TUTUP DETAIL";

  }

}

/* =====================================================
   HAPUS SEMUA HISTORY
===================================================== */

function hapusSemuaHistory() {

  const yakin =
    confirm(

      "Yakin ingin menghapus SEMUA history scan?\n\n" +

      "Data history yang sudah dihapus tidak dapat dikembalikan."

    );

  if (!yakin) return;

  localStorage.removeItem(
    STORAGE_HISTORY
  );

  tampilkanHistory();

}
