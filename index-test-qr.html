content="width=device-width, initial-scale=1.0">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    overflow-x:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:#edf3ef;
    color:#202923;
    padding:10px;
    padding-bottom:82px;
}

/* =========================
   HEADER
========================= */

.header{
    width:100%;
    max-width:540px;
    margin:0 auto 10px;

    background:linear-gradient(135deg,#075b32,#0f7a43,#21a05d);

    color:white;

    border-radius:15px;

    padding:12px 14px;

    box-shadow:0 6px 18px rgba(7,91,50,.20);

    position:relative;
    overflow:hidden;
}

.header::after{
    content:"";

    position:absolute;

    width:130px;
    height:130px;

    right:-55px;
    top:-70px;

    border-radius:50%;

    background:rgba(255,255,255,.09);
}

.headerIsi{
    display:flex;
    align-items:center;
    gap:11px;

    position:relative;
    z-index:1;
}

.logo{
    width:68px;
    height:62px;

    object-fit:contain;

    background:white;

    border-radius:10px;

    padding:3px;

    flex-shrink:0;

    box-shadow:0 3px 8px rgba(0,0,0,.13);
}

.judulBox{
    min-width:0;
}

.judul{
    font-size:22px;
    font-weight:900;

    line-height:1.1;

    color:white;

    white-space:nowrap;
}

.subjudul{
    margin-top:5px;

    font-size:10px;
    font-weight:800;

    color:#dff4e7;

    letter-spacing:1.5px;

    white-space:nowrap;
}

/* =========================
   CAMERA
========================= */

.camera-card{
    width:100%;
    max-width:540px;

    margin:0 auto 10px;

    background:#111714;

    border-radius:15px;

    padding:6px;

    box-shadow:0 6px 17px rgba(0,0,0,.15);
}

.camera-wrapper{
    position:relative;

    width:100%;
    height:300px;

    background:#050807;

    border-radius:11px;

    overflow:hidden;
}

#video{
    width:100%;
    height:300px;

    object-fit:cover;

    display:block;
}

/* =========================
   QR FRAME
========================= */

.qr-frame{
    position:absolute;

    left:50%;
    top:50%;

    width:230px;
    height:230px;

    transform:translate(-50%,-50%);

    pointer-events:none;

    z-index:10;
}

.corner{
    position:absolute;

    width:50px;
    height:50px;

    border-color:#00e676;

    border-style:solid;

    filter:drop-shadow(0 0 5px rgba(0,230,118,.65));
}

.tl{
    left:0;
    top:0;
    border-width:5px 0 0 5px;
    border-radius:7px 0 0 0;
}

.tr{
    right:0;
    top:0;
    border-width:5px 5px 0 0;
    border-radius:0 7px 0 0;
}

.bl{
    left:0;
    bottom:0;
    border-width:0 0 5px 5px;
    border-radius:0 0 0 7px;
}

.br{
    right:0;
    bottom:0;
    border-width:0 5px 5px 0;
    border-radius:0 0 7px 0;
}

/* =========================
   SCAN BERHASIL
========================= */

#scanBerhasil{
    position:absolute;

    left:50%;
    top:50%;

    width:230px;
    height:230px;

    transform:translate(-50%,-50%);

    display:none;

    border:5px solid #00e676;

    border-radius:11px;

    z-index:20;

    pointer-events:none;

    box-shadow:
        0 0 12px rgba(0,230,118,.9),
        0 0 25px rgba(0,230,118,.7);
}

#scanBerhasil::after{
    content:"✓";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:58px;
    height:58px;

    border-radius:50%;

    background:#00c853;

    color:white;

    font-size:38px;
    font-weight:900;

    line-height:58px;

    text-align:center;
}

/* =========================
   TOTAL BATANG
========================= */

.status-card{
    width:100%;
    max-width:540px;

    margin:10px auto;

    padding:15px 12px;

    background:linear-gradient(135deg,#ffffff,#f0f8f3);

    border:1px solid #cfe0d5;

    border-radius:15px;

    text-align:center;

    box-shadow:0 4px 13px rgba(23,107,56,.09);

    position:relative;
    overflow:hidden;
}

.status-card::before{
    content:"";

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:4px;

    background:#198754;
}

#jumlah{
    margin:0;

    display:flex;

    align-items:baseline;

    justify-content:center;

    gap:7px;

    color:#176b38;

    line-height:1;
}

#jumlah .angkaTotal{
    font-size:64px;

    font-weight:900;

    line-height:.9;

    letter-spacing:-2px;
}

#jumlah .teksBatang{
    font-size:21px;

    font-weight:900;
}

/* =========================
   PENGAMBILAN
========================= */

.pengambilan-card{

    max-width:540px;

    margin:10px auto;

    padding:13px 12px;

    background:linear-gradient(135deg,#ffffff,#f1f7ff);

    border:1px solid #cddff0;

    border-radius:15px;

    text-align:center;

    box-shadow:0 4px 13px rgba(25,118,210,.08);

    position:relative;
    overflow:hidden;
}

.pengambilan-card::before{
    content:"";

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:4px;

    background:#1976d2;
}

.pengambilanJudul{
    font-size:10px;

    font-weight:900;

    color:#69766f;

    letter-spacing:1px;

}

#jumlahPengambilan{

}

.teksPengambilan{

    font-weight:900;

    color:#1976d2;
}

#status{

    font-size:12px;

    font-weight:700;

    line-height:1.45;
}

/* =========================
   BUTTON UTAMA
========================= */

#btnScan,
#btnScanBaru,
#btnLanjut{

    max-width:540px;

    margin:8px auto;

#btnScan{

#btnLanjut{

/* =========================

#daftar{

.item{

        #ffffff,

    border:1px solid #d7e4dc;

    border-radius:12px;

/* AKSEN KIRI */

.item::before{
    content:"";

    top:0;

/* TOMBOL DETAIL */

.detailBtn{

    font-weight:900;

.detail{

.success{

.duplicate{

/* =========================
   BOTTOM MENU

#btnTumpuk,
#btnHistory{

    padding:0 15px;

#btnHistory{

    left:auto;

    width:calc(50% - 15px);

    background:linear-gradient(

#btnTumpuk:active,
#btnHistory:active{
    transform:scale(.97);
}

/* =========================
   TUMPUK PANEL
========================= */

#tumpukPanel{
    display:none;

    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:94%;
    max-width:440px;

    max-height:82vh;

    overflow-y:auto;

    padding:0;

    background:#f4f6f8;

    border-radius:18px;

    z-index:2000;

    box-shadow:
        0 20px 50px rgba(0,0,0,.35);

    border:1px solid #d8dde2;

/* HEADER PANEL */

#tumpukPanel .tumpukHeader{
    position:sticky;

    top:0;

    z-index:5;

    padding:16px 18px;

    background:

    font-size:18px;

    font-weight:900;

    letter-spacing:.3px;

#tumpukPanel .tumpukHeader p{
    margin:4px 0 0;

    font-size:11px;

    font-weight:700;

    color:#cbd2d8;
}


/* ISI */

#tumpukPanel .tumpukIsi{
    padding:12px;
}


/* SATU TUMPUK */

.tumpukItem{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    min-height:66px;

    padding:11px 13px;

    margin-bottom:8px;

    background:#ffffff;

    border:1px solid #dfe4e8;

    box-shadow:

    transition:.12s ease;
}

.tumpukItem:last-child{
    margin-bottom:0;
}

.tumpukItem:active{
    transform:scale(.985);
}


/* NOMOR TUMPUK */

.tumpukNama{
    display:flex;

    align-items:center;

    gap:10px;

    min-width:0;

    font-size:15px;

    font-weight:900;

    color:#29323a;
}

.tumpukNama::before{
    content:"";

    width:5px;

    height:30px;

    flex-shrink:0;

    border-radius:5px;

    background:#b47b00;
}


/* TOTAL BATANG */

.tumpukJumlah{
    display:flex;

    align-items:baseline;

    justify-content:flex-end;

    gap:5px;

    flex-shrink:0;

    min-width:105px;

    padding-left:10px;

.tumpukJumlah .angka{

.tumpukJumlah .label{

    color:#6c757d;

}


/* SCROLLBAR */

#tumpukPanel::-webkit-scrollbar{
    width:6px;
}

#tumpukPanel::-webkit-scrollbar-track{
    background:#edf0f2;
}

#tumpukPanel::-webkit-scrollbar-thumb{
    background:#aeb6bd;

    border-radius:10px;
}


/* HP */

@media(max-width:500px){

    #tumpukPanel{
        width:94%;

        max-height:84vh;

        border-radius:16px;
    }

    #tumpukPanel .tumpukHeader{
        padding:14px 15px;

        border-radius:16px 16px 0 0;
    }

    #tumpukPanel .tumpukHeader h3{
        font-size:17px;
    }

    #tumpukPanel .tumpukIsi{
        padding:10px;
    }

    .tumpukItem{
        min-height:62px;

        padding:10px 11px;

        margin-bottom:7px;
    }

    .tumpukNama{
        font-size:14px;

        gap:8px;
    }

    .tumpukNama::before{
        width:4px;

        height:27px;

    .tumpukJumlah{

    }

    .tumpukJumlah .label{
        font-size:9px;
    }
}
/* =========================
   HISTORY
========================= */

#historyPanel{
    display:none;

    width:100%;
    max-width:540px;

    margin:12px auto;
}

.historyHeader{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:12px;

    margin-bottom:8px;

    background:white;

    border:1px solid #d9e4dd;

    border-radius:12px;

    box-shadow:0 3px 9px rgba(0,0,0,.05);
}

.historyJudul{

}

.tutupHistory{

}

.historyItem{

.historyTop{

.historyNomor{

.historyRegister{

.btnHistoryDetail{

.btnHapusHistory{

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    body{

<script>

function ambilRegisterDariQR(teks){

    teks = String(teks || "").trim();

    try {
        const url = new URL(teks);

        const register =
            url.searchParams.get("register");

        if(register){
            return register.trim();
        }

    } catch(e) {}

    return teks;
}

/* =====================================================
   JSONP REQUEST
===================================================== */

function requestJSONP(
  parameter,
  callbackSelesai
) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8);

  const script =
    document.createElement(
      "script"
    );

  script.id =
    callbackName;

  let selesai = false;

  window[callbackName] =
    function(hasil) {

      if (selesai) return;

      selesai = true;

      try {

        callbackSelesai(
          hasil
        );

      }

      catch (error) {

        console.log(
          "Callback error:",
          error
        );

      }

      bersihkan();

    };


  function bersihkan() {

    delete window[
      callbackName
    ];

    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );

    }

  }


  script.onerror =
    function() {

      if (selesai) return;

      selesai = true;

      bersihkan();

      callbackSelesai(
        {
          status:
            "error",

          message:
            "Gagal menghubungi DATABASE"
        }
      );

    };


  const query =
    Object.keys(
      parameter
    )
    .map(
      function(key) {

        return (
          encodeURIComponent(key) +
          "=" +
          encodeURIComponent(
            parameter[key]
          )
        );

      }
    )
    .join("&");


  script.src =
    API_URL +
    "?" +
    query +
    "&callback=" +
    callbackName;


  document.body.appendChild(
    script
  );

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(
  nilai
) {

  if (!nilai)
    return "";


  let teks =
    String(
      nilai
    ).trim();


  if (
    teks.includes("T")
  ) {

    const bagian =
      teks.split("T")[0];

    const p =
      bagian.split("-");


    if (
      p.length === 3
    ) {

      return (
        p[2] +
        "-" +
        p[1] +
        "-" +
        p[0]
      );

    }

  }


  if (
    /^\d{2}\/\d{2}\/\d{4}$/.test(
      teks
    )
  ) {

    return teks.replace(
      /\//g,
      "-"
    );

  }


  if (
    /^\d{2}-\d{2}-\d{4}$/.test(
      teks
    )
  ) {

    return teks;

  }


  return teks;

}

/* =====================================================
   FORMAT JAM
===================================================== */

function formatJam(nilai) {

  if (
    nilai === null ||
    nilai === undefined ||
    nilai === ""
  ) {
    return "";
  }

  /*
   * JAM dari Google Sheet sudah dalam bentuk
   * tampilan lokal, contoh:
   * 10:01:58
   *
   * Jangan gunakan new Date()
   * agar tidak terjadi konversi timezone.
   */

  let teks =
    String(nilai).trim();

  /*
   * Kalau backend mengirim format ISO,
   * ambil bagian jamnya saja.
   *
   * Contoh:
   * 2026-08-31T10:01:58.000Z
   * menjadi:
   * 10:01:58
   */

  if (
    teks.includes("T")
  ) {

    teks =
      teks.split("T")[1] || "";

  }

  teks =
    teks.replace(
      /Z$/i,
      ""
    );

  teks =
    teks.split(".")[0];

  /*
   * Kalau sudah HH:MM:SS,
   * langsung kembalikan.
   */

  const cocok =
    teks.match(
      /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/
    );

  if (cocok) {

    return (
      cocok[1].padStart(2, "0") +
      ":" +
      cocok[2] +
      ":" +
      (
        cocok[3] ||
        "00"
      )
    );

  }

  return teks;
}

/* =====================================================
   AMBIL SESI AKTIF
===================================================== */

function muatDataSesiAktif(
  tampilStatus
) {

  if (sedangMuatData)
    return;

  sedangMuatData = true;

  const requestIni =
    ++nomorRequest;


  requestJSONP(

    {
      getActiveData:
        "1"
    },

    function(hasil) {

      sedangMuatData =
        false;


      if (
        requestIni !==
        nomorRequest
      ) {

        return;

      }


      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        if (tampilStatus) {

          document.getElementById(
            "status"
          ).innerHTML =
            "❌ Gagal mengambil data sesi";

        }

        return;

      }


      const sesiServer =
        hasil.sesi ||
        "";


      /*
       * Kalau sesi server berubah,
       * berarti ada SCAN BARU.
       *
       * Maka hitungan pengambilan
       * di HP ini juga di-reset.
       */

      if (
        sesiAktif &&
        sesiServer &&
        sesiServer !== sesiAktif
      ) {

        resetPengambilan();

      }


      sesiAktif =
        sesiServer;


      const dataServer =
        Array.isArray(
          hasil.data
        )
        ?
        hasil.data
        :
        [];


      dataScanTersimpan =
        dataServer;


      jumlahBerhasil =
        dataServer.filter(
          function(item) {

            return (
              item &&
              item.tipe ===
              "success"
            );

          }
        ).length;


      updateJumlah();


      simpanDetailTerbuka();


      tampilkanDataServer();


      bukaKembaliDetail();


      if (tampilStatus) {

        if (jumlahBerhasil > 0) {

          document.getElementById(
            "status"
          ).innerHTML =
            "📷 Sesi aktif<br>" +
            jumlahBerhasil +
            " batang";

        }

        else {

          document.getElementById(
            "status"
          ).innerHTML =
            "📷 Sesi aktif<br>" +
            "Siap untuk scan";

        }

      }

    }

  );

}

/* =====================================================
   SUARA
===================================================== */

function bunyiBerhasil() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext)
      return;


    const audio =
      new AudioContext();


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.type =
      "sine";


    oscillator.frequency.setValueAtTime(
      1400,
      audio.currentTime
    );


    gain.gain.setValueAtTime(
      0.001,
      audio.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.35,
      audio.currentTime + 0.01
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audio.currentTime + 0.10
    );


    oscillator.connect(
      gain
    );


    gain.connect(
      audio.destination
    );


    oscillator.start();


    oscillator.stop(
      audio.currentTime + 0.11
    );


    setTimeout(
      function() {

        audio.close();

      },
      200
    );

  }

  catch (e) {

    console.log(e);

  }

}

/* =====================================================
   OPTIMASI CAMERA
===================================================== */

async function optimalkanKamera(
  video
) {

  try {

    if (!video.srcObject)
      return;


    const tracks =
      video.srcObject
        .getVideoTracks();


    if (!tracks.length)
      return;


    const track =
      tracks[0];


    const capabilities =
      track.getCapabilities
      ?
      track.getCapabilities()
      :
      {};


    const advanced = {};


    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes(
        "continuous"
      )
    ) {

      advanced.focusMode =
        "continuous";

    }


    if (
      capabilities.exposureMode &&
      capabilities.exposureMode.includes(
        "continuous"
      )
    ) {

      advanced.exposureMode =
        "continuous";

    }


    if (
      capabilities.whiteBalanceMode &&
      capabilities.whiteBalanceMode.includes(
        "continuous"
      )
    ) {

      advanced.whiteBalanceMode =
        "continuous";

    }


    if (
      Object.keys(
        advanced
      ).length
    ) {

      await track.applyConstraints({

        advanced: [
          advanced
        ]

      });

    }

  }

  catch (e) {

    console.log(
      "Optimasi kamera tidak tersedia:",
      e
    );

  }

}


/* =====================================================
   MULAI KAMERA
===================================================== */

async function mulaiKamera() {

  if (
    kameraAktif
  ) {

    return;

  }


  const status =
    document.getElementById(
      "status"
    );


  const tombol =
    document.getElementById(
      "btnScan"
    );


  status.innerHTML =
    "⏳ Membuka kamera...";


  try {

    if (
      !window.ZXingBrowser
    ) {

      throw new Error(
        "ZXing belum berhasil dimuat"
      );

    }


    const video =
      document.getElementById(
        "video"
      );


    scannerReader =
      new ZXingBrowser
        .BrowserMultiFormatReader(
          undefined,
          80
        );


    const constraints = {

      audio: false,

      video: {

        facingMode: {

          ideal:
            "environment"

        },

        width: {

          min: 640,

          ideal: 1280,

          max: 1920

        },

        height: {

          min: 480,

          ideal: 720,

          max: 1080

        },

        frameRate: {

          min: 15,

          ideal: 30,

          max: 60

        },

        focusMode: {

          ideal:
            "continuous"

        }

      }

    };


    status.innerHTML =
      "⏳ Meminta akses kamera...";


    scannerControls =
      await scannerReader
        .decodeFromConstraints(

          constraints,

          video,

          function(
            result,
            error
          ) {

            if (!result)
              return;


            if (
              sedangProses
            )
              return;


           const kode =
  ambilRegisterDariQR(
    result.getText()
  );


if (!kode)
  return;


            sedangProses =
              true;


            tampilkanIndikatorHijau();


            const format =
              result.getBarcodeFormat();


            status.innerHTML =
              "⏳ BARCODE TERBACA<br>" +
              "Mengecek " +
              kode +
              "...";


            if (
              format ===
              ZXingBrowser
                .BarcodeFormat
                .CODE_128
            ) {

              cekRegister(
                kode
              );

            }

            else if (
  format ===
  ZXingBrowser
    .BarcodeFormat
    .QR_CODE
) {

  if (
    kode.startsWith("PHT")
  ) {

    cekQR(
      kode
    );

  } else {

    cekRegister(
      kode
    );

  }

}

            else {

              status.innerHTML =
                "⚠️ Format barcode tidak didukung<br>" +
                kode;


              sedangProses =
                false;

            }

          }

        );


    kameraAktif =
      true;


    tombol.innerHTML =
      "📷 KAMERA AKTIF";


    tombol.style.background =
      "#555";


    status.innerHTML =
      "📷 KAMERA AKTIF<br>" +
      "Arahkan QR / CODE 128 ke kotak hijau";


    setTimeout(
      function() {

        optimalkanKamera(
          video
        );

      },
      500
    );

  }

  catch (error) {

    kameraAktif =
      false;


    scannerControls =
      null;


    tombol.innerHTML =
      "📷 BUKA KAMERA";


    tombol.style.background =
      "#1976d2";


    status.innerHTML =
      "❌ Kamera gagal dibuka<br>" +
      error.message;


    console.log(
      "ZXing error:",
      error
    );

  }

}

/* =====================================================
   PROSES HASIL SCAN
===================================================== */

function prosesHasilScan(
  hasil,
  kode
) {

  if (
    hasil.status ===
    "success"
  ) {

    /*
     * TAMBAHAN BARU:
     * Setiap scan sukses menambah
     * jumlah pengambilan saat ini.
     *
     * TOTAL SESI tetap dihitung dari server.
     */

    jumlahPengambilan++;

    updateJumlahPengambilan();


    document.getElementById(
      "status"
    ).innerHTML =
      "✅ " +
      (
        hasil.data &&
        hasil.data[0]
        ?
        hasil.data[0]
        :
        kode
      );


    bunyiBerhasil();

    getarBerhasil();


    setTimeout(
      function() {

        muatDataSesiAktif(
          false
        );

      },
      200
    );

  }

  else if (
    hasil.status ===
    "duplicate"
  ) {

    document.getElementById(
      "status"
    ).innerHTML =
      "❌ " +
      hasil.message;


    setTimeout(
      function() {

        muatDataSesiAktif(
          false
        );

      },
      200
    );

  }

  else if (
    hasil.status ===
    "not_found"
  ) {

    document.getElementById(
      "status"
    ).innerHTML =
      "⚠️ " +
      hasil.message;


    tambahHasilTidakDitemukan(
      kode
    );

  }

  else {

    document.getElementById(
      "status"
    ).innerHTML =
      "⚠️ " +
      (
        hasil.message ||
        "Terjadi kesalahan"
      );

  }


  sedangProses =
    false;

}

function escapeHtml(
  nilai
) {

  return String(
    nilai || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   TIDAK DITEMUKAN
===================================================== */

function tambahHasilTidakDitemukan(
  kode
) {

  const daftar =
    document.getElementById(
      "daftar"
    );


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "item";


  item.innerHTML = `

    <div class="baris">

      <div class="nomor notfound">
        ⚠️ ${escapeHtml(kode)}
      </div>

      <div class="notfound">
        TIDAK ADA
      </div>

    </div>

  `;


  daftar.prepend(
    item
  );

}


/* =====================================================
   DETAIL
===================================================== */

function toggleDetail(
  id,
  tombol
) {

  const detail =
    document.getElementById(
      id
    );


  if (!detail)
    return;


  if (
    detail.style.display ===
    "block"
  ) {

    detail.style.display =
      "none";


    tombol.innerHTML =
      "DETAIL";


    detailTerbuka.delete(
      detail.dataset.register
    );

  }

  else {

    detail.style.display =
      "block";


    tombol.innerHTML =
      "TUTUP";


    detailTerbuka.add(
      detail.dataset.register
    );

  }

}


/* =====================================================
   SCAN BARU
===================================================== */

function scanBaru() {

  const yakin =
    confirm(

      "Mulai SCAN BARU?\n\n" +

      "Sesi yang sedang aktif akan disimpan sebagai HISTORY.\n\n" +

      "Semua HP yang membuka web ini akan pindah ke sesi baru.\n\n" +

      "Lanjutkan?"

    );


  if (!yakin)
    return;


  const status =
    document.getElementById(
      "status"
    );


  const tombol =
    document.getElementById(
      "btnScanBaru"
    );


  tombol.disabled =
    true;


  tombol.innerHTML =
    "⏳ MEMBUAT SESI BARU...";


  status.innerHTML =
    "⏳ Menyimpan sesi lama ke HISTORY...";


  requestJSONP(

    {
      mulaiSesiBaru:
        "1"
    },

    function(hasil) {

      tombol.disabled =
        false;


      tombol.innerHTML =
        "🔄 SCAN BARU";


      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        status.innerHTML =
          "❌ " +
          (
            hasil &&
            hasil.message
            ?
            hasil.message
            :
            "Gagal membuat sesi baru"
          );

        return;

      }


      sesiAktif =
        hasil.sesi ||
        "";


      dataScanTersimpan =
        [];


      jumlahBerhasil =
        0;


      /*
       * SCAN BARU memang harus
       * menghapus hitungan pengambilan.
       */

      resetPengambilan();


      detailTerbuka =
        new Set();


      muatDataSesiAktif(
        false
      );


      status.innerHTML =
        "📷 SESI BARU AKTIF<br>" +
        "Siap untuk scan";

    }

  );

}


/* =====================================================
   HISTORY
===================================================== */

function tampilkanHistory() {

  const panel =
    document.getElementById(
      "historyPanel"
    );


  const isi =
    document.getElementById(
      "isiHistory"
    );


  isi.innerHTML = `

    <div class="historyItem">

      <div style="
        text-align:center;
        color:#777;
        padding:10px;
      ">

        ⏳ Mengambil history...

      </div>

    </div>

  `;


  panel.style.display =
    "block";


  panel.scrollIntoView({
    behavior:
      "smooth"
  });


  requestJSONP(

    {
      getHistory:
        "1"
    },

    function(hasil) {

      isi.innerHTML =
        "";


      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        isi.innerHTML = `

          <div class="historyItem">

            <div style="
              text-align:center;
              color:#c62828;
              padding:10px;
            ">

              ❌ Gagal mengambil history.

            </div>

          </div>

        `;

        return;

      }


      const history =
        Array.isArray(
          hasil.data
        )
        ?
        hasil.data
        :
        [];


      if (
        history.length ===
        0
      ) {

        isi.innerHTML = `

          <div class="historyItem">

            <div style="
              text-align:center;
              color:#777;
              padding:10px;
            ">

              Belum ada history scan.

            </div>

          </div>

        `;

        return;

      }


      history.forEach(
        function(sesi, index) {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "historyItem";


          const id =
            "history_detail_" +
            Date.now() +
            "_" +
            index;


          const semuaData =
            Array.isArray(
              sesi.data
            )
            ?
            sesi.data
            :
            [];


          item.innerHTML = `

            <div class="historyTop">

              <div>

                <div class="historyNomor">
                  SCAN #${
                    sesi.sesi ||
                    "-"
                  }
                </div>

                <div class="historyTanggal">
                  📅 ${
                    formatTanggal(
                      sesi.tanggal
                    ) ||
                    "-"
                  }
                </div>

                <div class="historyTanggal">
                  🕐 ${
                    formatJam(
                      sesi.jam
                    ) ||
                    "-"
                  }
                </div>

              </div>

              <div class="historyJumlah">
                ${
                  sesi.jumlah ||
                  0
                }
                BATANG
              </div>

            </div>

            <button
              class="btnHistoryDetail"
              onclick="toggleHistoryDetail(
                '${id}',
                this
              )"
            >
              LIHAT DETAIL REGISTER
            </button>

            <div
              id="${id}"
              class="historyDetail"
            ></div>

          `;


          isi.appendChild(
            item
          );


          const detail =
            document.getElementById(
              id
            );


          semuaData.forEach(
            function(dataScan) {

              if (!dataScan)
                return;


              if (
                dataScan.tipe ===
                "success"
              ) {

                const register =
                  dataScan.data &&
                  dataScan.data[0]
                  ?
                  dataScan.data[0]
                  :
                  "";


                const baris =
                  document.createElement(
                    "div"
                  );


                baris.className =
                  "historyRegister success";


                baris.innerHTML =
                  "✅ " +
                  escapeHtml(
                    register
                  );


                detail.appendChild(
                  baris
                );

              }

              else if (
                dataScan.tipe ===
                "duplicate"
              ) {

                const register =
                  dataScan.data &&
                  dataScan.data[0]
                  ?
                  dataScan.data[0]
                  :
                  "";


                const baris =
                  document.createElement(
                    "div"
                  );


                baris.className =
                  "historyRegister duplicate";


                baris.innerHTML =
                  "❌ " +
                  escapeHtml(
                    register
                  ) +
                  " — DUPLIKAT";


                detail.appendChild(
                  baris
                );

              }

              else if (
                dataScan.tipe ===
                "notfound"
              ) {

                const baris =
                  document.createElement(
                    "div"
                  );


                baris.className =
                  "historyRegister notfound";


                baris.innerHTML =
                  "⚠️ " +
                  escapeHtml(
                    dataScan.kode ||
                    ""
                  ) +
                  " — TIDAK ADA";


                detail.appendChild(
                  baris
                );

              }

            }
          );

        }
      );


      const tombolHapus =
        document.createElement(
          "button"
        );


      tombolHapus.className =
        "btnHapusHistory";


      tombolHapus.innerHTML =
        "🗑️ HAPUS SEMUA HISTORY";


      tombolHapus.onclick =
        hapusSemuaHistory;


      isi.appendChild(
        tombolHapus
      );

    }

  );

}

/* =====================================================
   HAPUS HISTORY
===================================================== */

function hapusSemuaHistory() {

  const yakin =
    confirm(

      "Yakin ingin menghapus SEMUA history scan?\n\n" +

      "Data history yang sudah dihapus tidak dapat dikembalikan."

    );


  if (!yakin)
    return;


  const isi =
    document.getElementById(
      "isiHistory"
    );


  isi.innerHTML = `

    <div class="historyItem">

      <div style="
        text-align:center;
        color:#777;
        padding:10px;
      ">

        ⏳ Menghapus history...

      </div>

    </div>

  `;


  requestJSONP(

    {
      hapusHistory:
        "1"
    },

    function(hasil) {

      if (
        !hasil ||
        hasil.status !==
        "success"
      ) {

        alert(
          hasil &&
          hasil.message
          ?
          hasil.message
          :
          "History gagal dihapus."
        );

        tampilkanHistory();

        return;

      }


      tampilkanHistory();

    }

  );

}

function tampilkanPerTumpuk() {

  const panel =
    document.getElementById("tumpukPanel");

  panel.style.display = "block";

  tumpukPanelTerbuka = true;

  renderPerTumpuk();
}


function tutupPerTumpuk() {

  const panel =
    document.getElementById("tumpukPanel");

  panel.style.display = "none";

  tumpukPanelTerbuka = false;
}


function renderPerTumpuk() {

  const isi =
    document.getElementById("isiTumpuk");

  const info =
    document.getElementById("tumpukInfo");

  if (!isi || !info)
    return;


  const group = {};


  dataScanTersimpan.forEach(
    function(item) {

      if (
        !item ||
        item.tipe !== "success"
      ) {
        return;
      }


      const data =
        item.data || [];


      const tumpuk =
        String(data[4] || "-").trim();


      if (!group[tumpuk]) {
        group[tumpuk] = 0;
      }


      group[tumpuk]++;
    }
  );


  const keys =
    Object.keys(group);


  keys.sort(
    function(a, b) {

      const na = Number(a);
      const nb = Number(b);

      if (
        !isNaN(na) &&
        !isNaN(nb)
      ) {
        return na - nb;
      }

      return a.localeCompare(b);
    }
  );


  info.innerHTML =
  "TOTAL BATANG : " +
  keys.reduce(
    (total, key) =>
      total + group[key],
    0
  );

  if (!keys.length) {

    isi.innerHTML =
      "<div class='tumpukItem'>" +
      "BELUM ADA DATA TUMPUK PADA SESI INI" +
      "</div>";

    return;
  }


  isi.innerHTML = "";


  keys.forEach(
    function(key) {

      isi.innerHTML +=
        "<div class='tumpukItem'>" +

          "<div class='tumpukNama'>" +
            "TUMPUK " + escapeHtml(key) +
          "</div>" +

          "<div class='tumpukJumlah'>" +
            group[key] +
            " BATANG" +
          "</div>" +

        "</div>";
    }
  );
}
